<svg width="128" height="128" viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg" fill="none">
  <!-- File background -->
  <rect x="18" y="12" width="92" height="104" rx="10" fill="#0D1F36"/>
  <rect x="18" y="12" width="92" height="104" rx="10" fill="url(#bg_grad)"/>

  <!-- File corner fold -->
  <path d="M90 12 L110 32 L90 32 Z" fill="#0D3060" opacity="0.6"/>

  <!-- Top node (start) -->
  <rect x="44" y="24" width="24" height="14" rx="4" fill="#43A047"/>
  <rect x="44" y="24" width="24" height="14" rx="4" fill="url(#start_grad)"/>

  <!-- Middle node (process) -->
  <rect x="32" y="56" width="28" height="16" rx="4" fill="#1565C0"/>
  <rect x="32" y="56" width="28" height="16" rx="4" fill="url(#proc_grad)"/>

  <!-- Right node (decision) — diamond -->
  <polygon points="90,56 104,64 90,72 76,64" fill="#E65100"/>
  <polygon points="90,56 104,64 90,72 76,64" fill="url(#dec_grad)"/>

  <!-- Bottom node (end) -->
  <rect x="44" y="92" width="24" height="14" rx="4" fill="#6A1B9A"/>
  <rect x="44" y="92" width="24" height="14" rx="4" fill="url(#end_grad)"/>

  <!-- Connector: start → process -->
  <line x1="56" y1="38" x2="46" y2="56" stroke="#42A5F5" stroke-width="2.5" stroke-linecap="round"/>
  <polygon points="44,56 49,48 51,54" fill="#42A5F5"/>

  <!-- Connector: start → decision -->
  <line x1="68" y1="38" x2="81" y2="56" stroke="#FF8A65" stroke-width="2.5" stroke-linecap="round"/>
  <polygon points="83,56 77,48 80,55" fill="#FF8A65"/>

  <!-- Connector: process → end -->
  <line x1="46" y1="72" x2="52" y2="92" stroke="#42A5F5" stroke-width="2.5" stroke-linecap="round"/>
  <polygon points="50,92 48,83 55,88" fill="#42A5F5"/>

  <!-- Connector: decision → end -->
  <line x1="86" y1="72" x2="70" y2="92" stroke="#FF8A65" stroke-width="2.5" stroke-linecap="round"/>
  <polygon points="68,92 72,83 75,89" fill="#FF8A65"/>

  <!-- .flow label -->
  <text x="64" y="120" text-anchor="middle" font-family="monospace" font-size="9" font-weight="bold" fill="#5C9BD6" letter-spacing="1">.flow</text>

  <defs>
    <linearGradient id="bg_grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1A3A5C"/>
      <stop offset="100%" stop-color="#0D1F36"/>
    </linearGradient>
    <linearGradient id="start_grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#66BB6A"/>
      <stop offset="100%" stop-color="#2E7D32"/>
    </linearGradient>
    <linearGradient id="proc_grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#42A5F5"/>
      <stop offset="100%" stop-color="#0D47A1"/>
    </linearGradient>
    <linearGradient id="dec_grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFA726"/>
      <stop offset="100%" stop-color="#E64A19"/>
    </linearGradient>
    <linearGradient id="end_grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#AB47BC"/>
      <stop offset="100%" stop-color="#4A148C"/>
    </linearGradient>
  </defs>
</svg>
