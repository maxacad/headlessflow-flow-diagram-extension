  - from: "UpdateWebForm1"
    via: "next"
    to: "ValidateWebForm1"
    into: "in"
  - from: "CheckForEmptyString4"
    via: "next"
    to: "CheckPassword2"
    into: "in"
  - from: "Join4"
    via: "next"
    to: "LogMessage3"
    into: "in"
  - from: "GetWebForm1"
    via: "error"
    to: "Join2"
    into: "in2"
  - from: "ValidateWebForm1"
    via: "error"
    to: "Join1"
    into: "in2"
  - from: "JoinNode6"
    via: "next"
    to: "DetermineLocales1"
    into: "in"
  - from: "DecisionNode1"
    via: "yes"
    to: "JoinNode3"
    into: "in1"
  - from: "GetWebForm1"
    via: "next"
    to: "UpdateWebForm1"
    into: "in"
  - from: "LogMessage5"
    via: "next"
    to: "JoinNode5"
    into: "in2"
  - from: "DecisionNode1"
