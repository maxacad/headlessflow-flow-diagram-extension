    to: "VerifyCredential1"
    into: "in"
  - from: "VerifyCredential1"
    via: "next"
    to: "Call2"
    into: "in"
  - from: "CheckForEmptyString4"
    via: "error"
    to: "SetDictionaryValue1"
    into: "in"
  - from: "Join2"
    via: "next"
    to: "CreateWebForm1"
    into: "in"
  - from: "CheckForEmptyString2"
    via: "error"
    to: "RemoveDictionaryValue2"
    into: "in"
  - from: "SetDictionaryValue7"
    via: "next"
    to: "Join5"
    into: "in1"
  - from: "DetermineLocales1"
    via: "next"
    to: "PrepareApplicationView1"
    into: "in"
  - from: "JoinNode4"
    via: "next"
    to: "EndNode2"
    into: "in"
  - from: "CheckPassword2"
    via: "next"
    to: "DecisionNode2"
    into: "in"
  - from: "DecisionNode2"
    via: "no"
    to: "EndNode1"
    into: "in"
  - from: "DecisionNode2"
    via: "yes"
    to: "SetDictionaryValue2"
    into: "in"
  - from: "Join9"
    via: "next"
    to: "CheckForEmptyString4"
    into: "in"
  - from: "VerifyCredential1"
    via: "error"
    to: "LogMessage5"
    into: "in"
  - from: "JoinNode2"
    via: "next"
    to: "JoinNode5"
