flow: "ViewAffiliatePartnerList_52"
kind: "view"

entries:
  - id: "Start1"
    name: "ListAll"
    mode: "private"
    strict: false
    inputs:
      []
  - id: "Start2"
    name: "Dispatch"
    mode: "private"
    strict: false
    inputs:
      []
  - id: "Start3"
    name: "Paging"
    mode: "private"
    strict: false
    inputs:
      []
  - id: "Start4"
    name: "Delete"
    mode: "private"
    strict: false
    inputs:
      []

steps:
  - id: "Call1"
    type: "call"
    ref: "ProcessClipboard-Get"
  - id: "Call2"
    type: "call"
    ref: "ProcessClipboard-Update"
  - id: "Call3"
    type: "call"
    ref: "ProcessClipboard-DeleteAllEntries"
  - id: "CreatePageableFromIterator1"
    type: "pipelet"
    ref: "CreatePageableFromIterator"
    config:
      Pagesize: 10
    bindings:
      Iterator: "UnpagedAffiliatePartners"
      Pageable: "AffiliatePartners"
  - id: "DeterminePageable1"
    type: "pipelet"
    ref: "DeterminePageable"
  - id: "DispatchFormAction1"
    type: "pipelet"
    ref: "DispatchFormAction"
    config:
      OutValue_0: "ViewAffiliatePartner_52-New"
      OutValue_1: "ViewAffiliatePartnerList_52-Delete"
      OutValue_2: "ViewAffiliatePartnerList_52-Paging"
      OutValue_3: "ViewAffiliatePartnerList_52-Paging"
    bindings:
      Key_0: "new"
      Key_1: "delete"
      Key_2: "confirmDelete"
      Key_3: "cancelDelete"
      SelectionKey: "JumpTarget"
  - id: "GetAccountByOwner1"
    type: "pipelet"
    ref: "GetAccountByOwner"
    config:
      DefaultTypeCode: 50
    bindings:
      Owner: "AffiliatePartner"
      Account: "AffiliatePartnerAccount"
      TypeCode: "null"
  - id: "GetAffiliatePartnerByUUID1"
    type: "pipelet"
    ref: "GetAffiliatePartnerByUUID"
  - id: "GetAffiliatePartners1"
    type: "pipelet"
    ref: "GetAffiliatePartners"
    bindings:
      AffiliatePartners: "UnpagedAffiliatePartners"
      Domain: "ChannelRepository:Domain"
  - id: "InteractionEnd1"
    type: "interaction"
  - id: "Join1"
    type: "join"
  - id: "Join2"
    type: "join"
  - id: "Join3"
    type: "join"
  - id: "JoinNode1"
    type: "join"
  - id: "Jump2"
    type: "jump"
    ref: "SecureJump-Start"
  - id: "Jump3"
    type: "jump"
    ref: "ViewAffiliatePartnerList_52-ListAll"
  - id: "Loop1"
    type: "loop"
  - id: "PrepareApplicationView1"
    type: "pipelet"
    ref: "PrepareApplicationView"
    config:
      SelectedMenuItem: "OnlineMarketing"
      WorkingTemplate: "marketing/AffiliatePartnerList_52"
  - id: "RemoveAccount1"
    type: "pipelet"
    ref: "RemoveAccount"
    config:
      RemoveTransactions: "True"
    bindings:
      Account: "AffiliatePartnerAccount"
  - id: "RemoveAffiliatePartner1"
    type: "pipelet"
    ref: "RemoveAffiliatePartner"
  - id: "RemovePromotionCodeGroupUserGroupAssignments1"
    type: "pipelet"
    ref: "RemovePromotionCodeGroupUserGroupAssignments"
    bindings:
      UserGroup: "AffiliatePartner:PartnerUserGroup"
  - id: "SortIteratorByComparator2"
    type: "pipelet"
    ref: "SortIteratorByComparator"
    config:
      DefaultSortingAttribute: "DisplayName"
      DefaultSortingOrder: true
    bindings:
      Iterator: "UnpagedAffiliatePartners"
      SortedIterator: "UnpagedAffiliatePartners"
  - id: "SwitchPage1"
    type: "pipelet"
    ref: "SwitchPage"

links:
  - from: "PrepareApplicationView1"
    via: "next"
    to: "InteractionEnd1"
    into: "in"
  - from: "Call1"
    via: "next"
    to: "Loop1"
    into: "in"
  - from: "Loop1"
