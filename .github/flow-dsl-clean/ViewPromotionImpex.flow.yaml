flow: "ViewPromotionImpex"
kind: "view"

entries:
  - id: "StartNode0"
    name: "PutKeyValueInWizardMap"
    mode: "private"
    strict: true
    inputs:
      - key: "Key"
        type: "java.lang.String"
        required: false
      - key: "Value"
        type: "java.lang.String"
        required: true
      - key: "WizardMapID"
        type: "java.lang.String"
        required: true
  - id: "StartNode1"
    name: "GetValueFromWizardMap"
    mode: "private"
    strict: true
    inputs:
      - key: "WizardMapID"
        type: "java.lang.String"
        required: true
      - key: "Key"
        type: "java.lang.Object"
        required: true

steps:
  - id: "EndNode0"
    type: "end"
    strict: true
  - id: "EndNode1"
    type: "end"
    strict: true
    outputs:
      - key: "Value"
        type: "java.lang.Object"
        guaranteed: false
  - id: "ExchangeSessionObject0"
    type: "pipelet"
    ref: "ExchangeSessionObject"
    config:
      ProcessMethod: "Get Object from Session"
    bindings:
      SessionObjectName: "WizardMapID"
      LoadObject: "WizardMapObject"
  - id: "ExchangeSessionObject1"
    type: "pipelet"
    ref: "ExchangeSessionObject"
    config:
      ProcessMethod: "Put Object to Session"
    bindings:
      SaveObject: "WizardMapObject"
      SessionObjectName: "WizardMapID"
  - id: "ExchangeSessionObject2"
    type: "pipelet"
    ref: "ExchangeSessionObject"
    config:
      ProcessMethod: "Get Object from Session"
    bindings:
      SessionObjectName: "WizardMapID"
      LoadObject: "WizardMapObject"
  - id: "KeyMapper0"
    type: "pipelet"
    ref: "KeyMapper"
    bindings:
      InValue_1: "WizardMapObject:get(Key)"
      OutValue_1: "Value"
  - id: "UpdateMapping0"
    type: "pipelet"
    ref: "UpdateMapping"
    config:
      Mode: "Add"
    bindings:
      InMap: "WizardMapObject"
      OutMap: "WizardMapObject"

links:
  - from: "ExchangeSessionObject0"
    via: "next"
    to: "UpdateMapping0"
    into: "in"
  - from: "ExchangeSessionObject1"
    via: "next"
    to: "EndNode0"
    into: "in"
  - from: "ExchangeSessionObject2"
    via: "next"
    to: "KeyMapper0"
    into: "in"
  - from: "KeyMapper0"
    via: "next"
    to: "EndNode1"
    into: "in"
  - from: "StartNode0"
    via: "next"
    to: "ExchangeSessionObject0"
    into: "in"
  - from: "StartNode1"
    via: "next"
    to: "ExchangeSessionObject2"
    into: "in"
  - from: "UpdateMapping0"
    via: "next"
    to: "ExchangeSessionObject1"
    into: "in"
