flow: "ApprovalNotification"
kind: "process"

entries:
  - id: "Start2"
    name: "Start"
    mode: "private"
    strict: false
    inputs:
      []

steps:
  - id: "CombineIterators1"
    type: "pipelet"
    ref: "CombineIterators"
    config:
      ProcessMethod: "Subtract Iterators and Remove Duplicates"
    bindings:
      Iterator: "NewUsers"
      Iterator1: "Users"
      Iterator2: "NotifiedUsers"
  - id: "Decision1"
    type: "decision"
    condition: "CurrentActivity:NotificationTemplate"
  - id: "DecisionNode1"
    type: "decision"
    condition: "NewUsers"
  - id: "DetermineMailNotificationData2"
    type: "pipelet"
    ref: "DetermineMailNotificationData"
    config:
      DefaultEmailFrom: "INTERSHOP_Enfinity_MultiSite"
      Mode: "Multiple"
    bindings:
      Users: "NewUsers"
      WorkflowActivity: "CurrentActivity"
  - id: "DetermineUnit1"
    type: "pipelet"
    ref: "DetermineUnit"
  - id: "DetermineUsersForNotification2"
    type: "pipelet"
    ref: "DetermineUsersForNotification"
    bindings:
      WorkflowActivity: "CurrentActivity"
  - id: "End2"
    type: "end"
    strict: false
  - id: "GetApprovalActivities1"
    type: "pipelet"
    ref: "GetApprovalActivities"
  - id: "GetApprovalLastNotifiedUsers1"
    type: "pipelet"
    ref: "GetApprovalLastNotifiedUsers"
  - id: "Join1"
    type: "join"
  - id: "JoinNode1"
    type: "join"
  - id: "Loop1"
    type: "loop"
  - id: "ProcessMail1"
    type: "pipelet"
    ref: "ProcessMail"
    bindings:
      Domain: "CurrentOrganization:OwningDomain"
  - id: "SetApprovalLastNotifiedUsers1"
    type: "pipelet"
    ref: "SetApprovalLastNotifiedUsers"
    bindings:
      NotifiedUsers: "Users"
  - id: "SetDictionaryValue1"
    type: "pipelet"
    ref: "SetDictionaryValue"
    config:
      Name: "MailTo"

links:
  - from: "Start2"
    via: "next"
    to: "DetermineUnit1"
    into: "in"
  - from: "Decision1"
    via: "no"
    to: "Join1"
    into: "in3"
  - from: "Join1"
    via: "next"
    to: "Loop1"
    into: "loop"
  - from: "GetApprovalLastNotifiedUsers1"
    via: "next"
    to: "CombineIterators1"
    into: "in"
  - from: "ProcessMail1"
    via: "next"
    to: "JoinNode1"
    into: "in1"
  - from: "SetApprovalLastNotifiedUsers1"
    via: "next"
    to: "Join1"
    into: "in1"
  - from: "CombineIterators1"
    via: "next"
    to: "DecisionNode1"
    into: "in"
  - from: "JoinNode1"
    via: "next"
    to: "SetApprovalLastNotifiedUsers1"
    into: "in"
  - from: "DecisionNode1"
    via: "yes"
    to: "SetDictionaryValue1"
    into: "in"
  - from: "SetDictionaryValue1"
    via: "next"
    to: "DetermineMailNotificationData2"
    into: "in"
  - from: "DetermineUnit1"
    via: "next"
    to: "GetApprovalActivities1"
    into: "in"
  - from: "GetApprovalActivities1"
    via: "next"
    to: "Loop1"
    into: "in"
  - from: "DetermineMailNotificationData2"
    via: "next"
    to: "ProcessMail1"
    into: "in"
  - from: "DetermineUsersForNotification2"
    via: "next"
    to: "GetApprovalLastNotifiedUsers1"
    into: "in"
  - from: "Loop1"
    via: "next"
    to: "End2"
    into: "in"
  - from: "Loop1"
    via: "do"
    to: "Decision1"
    into: "in"
  - from: "Decision1"
    via: "yes"
    to: "DetermineUsersForNotification2"
    into: "in"
  - from: "DecisionNode1"
    via: "no"
    to: "JoinNode1"
    into: "in2"
