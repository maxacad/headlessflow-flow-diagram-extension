flow: "ProcessIncludeViewContextProductMultiple"
kind: "process"

entries:
  - id: "StartNode8"
    name: "GetPageletEntryPoint"
    mode: "private"
    strict: true
    inputs:
      - key: "ProductBO"
        type: "com.intershop.component.product.capi.ProductBO"
        required: true
      - key: "CategoryBO"
        type: "com.intershop.component.catalog.capi.CatalogCategoryBO"
        required: false
      - key: "ViewContext"
        type: "com.intershop.component.pmc.capi.viewcontext.ViewContext"
        required: true
      - key: "ParentProductBO"
        type: "com.intershop.component.product.capi.ProductBO"
        required: false

steps:
  - id: "DecisionNode1"
    type: "decision"
    condition: "ProductBO:ProductBundle"
  - id: "DecisionNode2"
    type: "decision"
    condition: "ProductBO:RetailSet"
  - id: "DecisionNode3"
    type: "decision"
    condition: "ParentProductBO"
  - id: "DecisionNode4"
    type: "decision"
    condition: "ParentProductBO:RetailSet"
  - id: "DecisionNode5"
    type: "decision"
    condition: "ParentProductBO:ProductBundle"
  - id: "EndNode18"
    type: "end"
    strict: true
  - id: "EndNode3"
    type: "end"
    strict: true
  - id: "EndNode4"
    type: "end"
    strict: true
    outputs:
      - key: "PageletEntryPoint"
        type: "com.intershop.component.pmc.capi.pagelet.PageletEntryPoint"
        guaranteed: true
  - id: "GetPageletEntryPointByViewContext2"
    type: "pipelet"
    ref: "GetPageletEntryPointByViewContext"
    config:
      Strategy: "Product"
    bindings:
      Site: "CurrentDomain:Site"
      Domain: "Repository:RepositoryDomain"
  - id: "GetValuesFromRequest3"
    type: "pipelet"
    ref: "GetValuesFromRequest"
    config:
      Namespace: "ApplicationRepository"
    bindings:
      Namespace: "null"
      Key: "null"
  - id: "JoinNode1"
    type: "join"
  - id: "JoinNode2"
    type: "join"
  - id: "JoinNode3"
    type: "join"
  - id: "JoinNode4"
    type: "join"
  - id: "JoinNode5"
    type: "join"
  - id: "SetDictionaryValue1"
    type: "pipelet"
    ref: "SetDictionaryValue"
    config:
      Name: "ViewContextInclusionName"
      Value: "includeBundle"
  - id: "SetDictionaryValue2"
    type: "pipelet"
    ref: "SetDictionaryValue"
    config:
      Name: "ViewContextInclusionName"
      Value: "includeRetailset"
  - id: "SetDictionaryValue3"
    type: "pipelet"
    ref: "SetDictionaryValue"
    config:
      Name: "ViewContextInclusionName"
      Value: "includeBundle"
  - id: "SetDictionaryValue4"
    type: "pipelet"
    ref: "SetDictionaryValue"
    config:
      Name: "ViewContextInclusionName"
      Value: "includeProduct"
  - id: "SetDictionaryValue5"
    type: "pipelet"
    ref: "SetDictionaryValue"
    config:
      Name: "ViewContextInclusionName"
      Value: "includeRetailset"

links:
  - from: "DecisionNode1"
    via: "no"
    to: "DecisionNode2"
    into: "in"
  - from: "SetDictionaryValue4"
    via: "next"
    to: "JoinNode2"
    into: "in3"
  - from: "DecisionNode2"
    via: "yes"
    to: "SetDictionaryValue2"
    into: "in"
  - from: "SetDictionaryValue1"
    via: "next"
    to: "JoinNode1"
    into: "in1"
  - from: "SetDictionaryValue3"
    via: "next"
    to: "JoinNode3"
    into: "in2"
  - from: "SetDictionaryValue2"
    via: "next"
    to: "JoinNode2"
    into: "in1"
  - from: "JoinNode2"
    via: "next"
    to: "JoinNode1"
    into: "in3"
  - from: "GetValuesFromRequest3"
    via: "next"
    to: "DecisionNode3"
    into: "in"
  - from: "DecisionNode5"
    via: "no"
    to: "DecisionNode4"
    into: "in"
  - from: "DecisionNode4"
    via: "yes"
    to: "SetDictionaryValue5"
    into: "in"
  - from: "DecisionNode3"
    via: "yes"
    to: "DecisionNode5"
    into: "in"
  - from: "GetPageletEntryPointByViewContext2"
    via: "next"
    to: "EndNode4"
    into: "in"
  - from: "SetDictionaryValue5"
    via: "next"
    to: "JoinNode4"
    into: "in2"
  - from: "JoinNode3"
    via: "next"
    to: "GetPageletEntryPointByViewContext2"
    into: "in"
  - from: "JoinNode1"
    via: "next"
    to: "JoinNode4"
    into: "in1"
  - from: "JoinNode4"
    via: "next"
    to: "JoinNode3"
    into: "in1"
  - from: "DecisionNode3"
    via: "no"
    to: "JoinNode5"
    into: "in1"
  - from: "JoinNode5"
    via: "next"
    to: "DecisionNode1"
    into: "in"
  - from: "StartNode8"
    via: "next"
    to: "GetValuesFromRequest3"
    into: "in"
  - from: "GetPageletEntryPointByViewContext2"
    via: "error"
    to: "EndNode3"
    into: "in"
  - from: "DecisionNode4"
    via: "no"
    to: "JoinNode5"
    into: "in2"
  - from: "GetValuesFromRequest3"
    via: "error"
    to: "EndNode18"
    into: "in"
  - from: "DecisionNode5"
    via: "yes"
    to: "SetDictionaryValue3"
    into: "in"
  - from: "DecisionNode2"
    via: "no"
    to: "SetDictionaryValue4"
    into: "in"
  - from: "DecisionNode1"
    via: "yes"
    to: "SetDictionaryValue1"
    into: "in"
