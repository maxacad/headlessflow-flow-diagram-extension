    bindings:
      SessionRegistrationID: "ClipboardName"
  - id: "SetDictionaryValue1"
    type: "pipelet"
    ref: "SetDictionaryValue"
    config:
      Name: "PerformPageletSearch"
      Value: true
  - id: "SetDictionaryValue2"
    type: "pipelet"
    ref: "SetDictionaryValue"
    config:
      Name: "PerformPageletSearch"
      Value: true
  - id: "SetValuesToContainer1"
    type: "pipelet"
    ref: "SetValuesToContainer"
    bindings:
      ContainerName: "CurrentContainerName"
  - id: "SetValuesToContainer2"
    type: "pipelet"
    ref: "SetValuesToContainer"
    bindings:
      ContainerName: "CurrentContainerName"
      DictionaryKeys: "\"SortBy;SortDirection\""
  - id: "TextNode1"
    type: "text"

