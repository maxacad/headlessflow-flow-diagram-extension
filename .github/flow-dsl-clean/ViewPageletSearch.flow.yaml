  - id: "ConcatenateStrings2"
    type: "pipelet"
    ref: "ConcatenateStrings"
    bindings:
      String0: "\"ComponentsClipboard_\""
      String1: "ContentRepository:DisplayName"
      Concatenated: "SessionRegistrationID"
  - id: "DecisionNode1"
    type: "decision"
    condition: "PageSearchState"
  - id: "DecisionNode2"
    type: "decision"
    condition: "ComponentSearchState"
  - id: "DecisionNode3"
    type: "decision"
    condition: "BackFromFilter"
  - id: "DispatchFormAction1"
    type: "pipelet"
    ref: "DispatchFormAction"
    config:
      OutValue_1: "ViewPageletSearch-Search"
      OutValue_2: "ViewPageletSearch-Paging"
      PagingPipeline: "ViewPageletSearch-Paging"
      OutValue_0: "ViewPageletSearch-Search"
      OutValue_3: "ViewPageletSearch-Paging"
      OutValue_4: "ViewPageletSearch-Paging"
      OutValue_5: "ViewPageletSearch-PageFilter"
      OutValue_6: "ViewPageletSearch-ComponentFilter"
      OutValue_7: "ViewPageletSearchPageFilter-Reset"
      OutValue_8: "ViewPageletSearchComponentFilter-Reset"
    bindings:
      SelectionKey: "JumpTarget"
      Key_2: "paging"
      Key_1: "find"
      Key_0: "findAdvanced"
      Key_3: "confirmDelete"
      Key_4: "cancel"
      Key_5: "editPageFilter"
      Key_6: "editComponentFilter"
      Key_8: "removeComponentFilter"
      Key_7: "removePageFilter"
  - id: "EndNode1"
    type: "end"
    strict: false
  - id: "EndNode2"
    type: "end"
    strict: true
    outputs:
      - key: "SortBy"
        type: "java.lang.String"
        guaranteed: false
      - key: "SortDirection"
        type: "java.lang.String"
        guaranteed: false
