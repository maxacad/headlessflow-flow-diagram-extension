  - id: "JumpNode6"
    type: "jump"
    ref: "ViewPageletSearchComponentFilter-View"
  - id: "KeyMapper1"
    type: "pipelet"
    ref: "KeyMapper"
    bindings:
      OutValue_1: "RepositoryUUID"
      InValue_1: "ContentRepository:UUID"
  - id: "KeyMapper2"
    type: "pipelet"
    ref: "KeyMapper"
    bindings:
      OutValue_1: "SearchType"
      OutValue_2: "EnteringFilter"
      InValue_2: "\"true\""
      InValue_1: "\"advanced\""
  - id: "KeyMapper3"
    type: "pipelet"
    ref: "KeyMapper"
    bindings:
