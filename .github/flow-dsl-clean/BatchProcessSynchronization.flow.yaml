flow: "BatchProcessSynchronization"
kind: "process"

entries:
  - id: "Start1"
    name: "Finish"
    mode: "private"
    strict: false
    inputs:
      []
  - id: "Start2"
    name: "Synchronize"
    mode: "private"
    strict: false
    inputs:
      []
  - id: "Start4"
    name: "Initialize"
    mode: "private"
    strict: false
    inputs:
      []

steps:
  - id: "CalculateDate1"
    type: "pipelet"
    ref: "CalculateDate"
    bindings:
      Date: "CurrentDate"
      Days: "null"
      Hours: "null"
      Milliseconds: "SyncRecord:Interval"
      Minutes: "null"
      Seconds: "null"
  - id: "CallNode1"
    type: "call"
    ref: "BatchProcessLog-PrepareLogger"
  - id: "CallNode2"
    type: "call"
    ref: "BatchProcessLog-CleanLogger"
  - id: "CallNode3"
    type: "call"
    ref: "BatchProcessSynchronization-Finish"
  - id: "CombineIterators1"
    type: "pipelet"
    ref: "CombineIterators"
    config:
      ProcessMethod: "Concatenate Iterators"
    bindings:
      Iterator1: "ProductDataMappingRules"
      Iterator2: "ContentMappingRules"
      Iterator: "ProductDataMappingRules"
  - id: "CreateSyndicationProcessor1"
    type: "pipelet"
    ref: "CreateSyndicationProcessor"
    bindings:
      RuleProcessors: "RuleProcessorsIterator"
      SyndicationProcessor: "SynchProcessor"
      SyndicationRules: "ProductDataMappingRules"
  - id: "DecisionNode1"
    type: "decision"
    condition: "JournalState"
  - id: "DecisionNode2"
    type: "decision"
    condition: "CurrentRepository"
  - id: "DecisionNode7"
    type: "decision"
    condition: "SyndicationErrors"
  - id: "DecisionNode8"
    type: "decision"
    condition: "SyndicationErrorMap:get(FailedProductUUID):ErrorCode"
  - id: "End1"
    type: "end"
    strict: false
  - id: "End2"
    type: "end"
    strict: false
  - id: "End3"
    type: "end"
    strict: false
  - id: "End4"
    type: "end"
    strict: false
  - id: "EndNode1"
    type: "end"
    strict: false
  - id: "GetCurrentDate1"
    type: "pipelet"
    ref: "GetCurrentDate"
  - id: "GetPageable3"
    type: "pipelet"
    ref: "GetPageable"
    bindings:
      Pageable: "ParentRepositories"
      PageableID: "ParentRepositoriesID"
  - id: "GetProductDataMappingRules1"
    type: "pipelet"
    ref: "GetProductDataMappingRules"
    bindings:
      DeclaringDomain: "CurrentRepository:RepositoryDomain"
      ProvidingDomain: "ParentRepository:RepositoryDomain"
      TypeCode: "null"
  - id: "GetProductDataMappingRules2"
    type: "pipelet"
    ref: "GetProductDataMappingRules"
    config:
      DefaultTypeCode: 6
    bindings:
      DeclaringDomain: "CurrentRepository:OwningDomain"
      ProvidingDomain: "ParentRepository:RepositoryDomain"
      TypeCode: "null"
      ProductDataMappingRules: "ContentMappingRules"
  - id: "GetRepositoryByUUID1"
    type: "pipelet"
    ref: "GetRepositoryByUUID"
    bindings:
      Repository: "CurrentRepository"
      UUID: "CurrentRepositoryUUID"
  - id: "GetRepositoryByUUID3"
    type: "pipelet"
    ref: "GetRepositoryByUUID"
    bindings:
      Repository: "CurrentRepository"
      UUID: "CurrentRepositoryUUID"
  - id: "GetSyncRecord1"
    type: "pipelet"
    ref: "GetSyncRecord"
    bindings:
      SourceObject: "ParentRepository"
      TargetObject: "CurrentRepository"
  - id: "GetSyncRecord3"
    type: "pipelet"
    ref: "GetSyncRecord"
    bindings:
      SourceObject: "ParentRepository"
      TargetObject: "CurrentRepository"
  - id: "Join11"
    type: "join"
  - id: "Join4"
    type: "join"
  - id: "Join9"
    type: "join"
  - id: "JoinNode1"
    type: "join"
  - id: "JoinNode12"
    type: "join"
  - id: "JoinNode13"
    type: "join"
  - id: "JoinNode2"
    type: "join"
  - id: "JoinNode3"
    type: "join"
  - id: "Loop1"
    type: "loop"
  - id: "Loop4"
    type: "loop"
  - id: "LoopNode2"
    type: "loop"
  - id: "Pipelet1"
    type: "pipelet"
    ref: "RefreshCache"
    config:
      PersistentClassName_0: "com.intershop.beehive.xcs.internal.productvariation.ProductVariationPO"
      PersistentClassName_1: "com.intershop.beehive.xcs.internal.productvariation.ProductVariationValuePO"
      PersistentClassName_2: "com.intershop.beehive.xcs.internal.price.ProductCostPricePO"
  - id: "Pipelet12"
    type: "pipelet"
    ref: "CreateLogEntry"
    config:
      LogLevel: "Error"
      Message: "Bla"
      MessageKey: "bc_mvc.batch.Unknown"
    bindings:
      Object0: "SyndicationErrorMap:get(FailedProductUUID):TargetProduct:Name"
      Object1: "SyndicationErrorMap:get(FailedProductUUID):Exception"
      Object2: "SyndicationErrorMap:get(FailedProductUUID):ErrorCode"
  - id: "Pipelet13"
    type: "pipelet"
    ref: "CreateLogEntry"
    config:
      LogLevel: "Error"
      MessageKey: "bc_mvc.batch.ProductIDToLarge"
    bindings:
      Object0: "SyndicationErrorMap:get(FailedProductUUID):TargetProduct:Name"
      Object1: "SyndicationErrorMap:get(FailedProductUUID):Exception"
      Object2: "SyndicationErrorMap:get(FailedProductUUID):ErrorCode"
  - id: "Pipelet2"
    type: "pipelet"
    ref: "GetDomainPreference"
    config:
      DefaultPreferenceKey: "JournalState"
      Type: "Integer"
    bindings:
      PreferenceDomain: "CurrentRepository:Domain"
      PreferenceIntValue: "JournalState"
  - id: "Pipelet4"
    type: "pipelet"
    ref: "AddObjectToVector"
    config:
      Mode: "Forbid Duplicates"
    bindings:
      InVector: "null"
      Iterator: "RuleProcessorsIterator"
      Object: "ProductJournalEntryMappingRule"
      Objects: "null"
      OutVector: "RuleProcessors"
  - id: "Pipelet5"
    type: "pipelet"
    ref: "AddObjectToVector"
    config:
      Mode: "Allow Duplicates"
    bindings:
      InVector: "null"
      Iterator: "RuleProcessorsIterator"
      Object: "null"
      Objects: "null"
      OutVector: "RuleProcessors"
  - id: "Pipelet6"
    type: "pipelet"
    ref: "CreateMappingRuleProcessor"
    bindings:
      ClassName: "\"com.intershop.component.mvc.internal.mapping.SyncProductJournalEntryMappingRule\""
      MappingRule: "ProductJournalEntryMappingRule"
  - id: "RefreshCache1"
    type: "pipelet"
    ref: "RefreshCache"
    config:
      PersistentClassName_0: "com.intershop.beehive.xcs.internal.product.ProductPO"
      PersistentClassName_1: "com.intershop.beehive.xcs.internal.catalog.ProductCategoryAssignmentPO"
      PersistentClassName_2: "com.intershop.beehive.xcs.internal.price.ProductListPricePO"
      PersistentClassName_3: "com.intershop.component.pricing.internal.definition.PriceDefinitionProductAssignmentPO"
      PersistentClassName_4: "com.intershop.component.pricing.internal.scale.PriceScaleTablePO"
      PersistentClassName_5: "com.intershop.component.pricing.internal.scale.PriceScaleEntryPO"
      PersistentClassName_6: "com.intershop.beehive.xcs.internal.product.ProductLinkPO"
      PersistentClassName_7: "com.intershop.beehive.xcs.internal.product.BundleAssignmentPO"
      PersistentClassName_8: "com.intershop.beehive.xcs.internal.productvariation.ProductVariationAssignmentPO"
      PersistentClassName_9: "com.intershop.beehive.xcs.internal.productvariation.VariableVariationAttributePO"
  - id: "SynchronizeProducts1"
    type: "pipelet"
    ref: "SynchronizeProducts"
    bindings:
      SynchronizationProcessor: "null"
      SynchronizationProcessorMap: "ProcessorMap"
      TargetProducts: "Objects"
  - id: "UpdateMapping1"
    type: "pipelet"
    ref: "UpdateMapping"
    config:
      Mode: "Add"
    bindings:
      InMap: "ProcessorMap"
      Key: "ParentRepository:RepositoryDomain:UUID"
      OutMap: "ProcessorMap"
      Value: "SynchProcessor"
  - id: "UpdateSyncRecord1"
    type: "pipelet"
    ref: "UpdateSyncRecord"
    bindings:
      Interval: "null"
      JobUUID: "null"
      StartTime: "CalculatedDate"
      Status: "null"
      StopTime: "CurrentDate"
      TargetObject: "CurrentRepository"
  - id: "UpdateSyncRecord3"
    type: "pipelet"
    ref: "UpdateSyncRecord"
    bindings:
      Interval: "null"
      JobUUID: "JobConfigurationUUID"
      StartTime: "null"
      Status: "null"
      StopTime: "null"
      TargetObject: "CurrentRepository"

links:
  - from: "Loop4"
    via: "next"
    to: "CallNode1"
    into: "in"
  - from: "JoinNode1"
    via: "next"
    to: "Loop4"
    into: "in"
  - from: "GetSyncRecord1"
    via: "next"
    to: "CalculateDate1"
    into: "in"
  - from: "DecisionNode1"
    via: "yes"
    to: "Pipelet5"
    into: "in"
  - from: "Pipelet5"
    via: "next"
    to: "JoinNode1"
    into: "in1"
  - from: "GetRepositoryByUUID1"
    via: "next"
    to: "JoinNode3"
    into: "in1"
  - from: "UpdateSyncRecord3"
    via: "next"
    to: "GetProductDataMappingRules1"
    into: "in"
  - from: "Pipelet6"
    via: "next"
    to: "Pipelet4"
    into: "in"
  - from: "CreateSyndicationProcessor1"
    via: "next"
    to: "UpdateMapping1"
    into: "in"
  - from: "UpdateSyncRecord1"
    via: "next"
    to: "Join4"
    into: "in1"
  - from: "Join11"
    via: "next"
    to: "End3"
    into: "in"
  - from: "RefreshCache1"
    via: "next"
    to: "Pipelet1"
    into: "in"
  - from: "DecisionNode1"
    via: "no"
    to: "Pipelet6"
    into: "in"
  - from: "GetSyncRecord3"
    via: "next"
    to: "UpdateSyncRecord3"
    into: "in"
  - from: "Join4"
    via: "next"
    to: "Loop1"
    into: "loop"
  - from: "GetRepositoryByUUID3"
    via: "next"
    to: "GetPageable3"
    into: "in"
  - from: "Loop1"
    via: "next"
    to: "RefreshCache1"
    into: "in"
  - from: "SynchronizeProducts1"
    via: "error"
    to: "CallNode3"
    into: "in"
  - from: "Pipelet4"
    via: "next"
    to: "JoinNode1"
    into: "in3"
  - from: "GetPageable3"
    via: "error"
    to: "Join11"
    into: "in2"
  - from: "Start4"
    via: "next"
    to: "GetRepositoryByUUID3"
    into: "in"
  - from: "Join9"
    via: "next"
    to: "Loop4"
    into: "loop"
  - from: "Start2"
    via: "next"
    to: "SynchronizeProducts1"
    into: "in"
  - from: "UpdateMapping1"
    via: "next"
    to: "Join9"
    into: "in1"
  - from: "Pipelet2"
    via: "next"
    to: "DecisionNode1"
    into: "in"
  - from: "GetSyncRecord3"
    via: "error"
    to: "Join9"
    into: "in3"
  - from: "DecisionNode2"
    via: "no"
    to: "JoinNode3"
    into: "in2"
  - from: "Loop4"
    via: "do"
    to: "GetSyncRecord3"
    into: "in"
  - from: "CallNode2"
    via: "next"
    to: "GetCurrentDate1"
    into: "in"
  - from: "Pipelet1"
    via: "next"
    to: "End2"
    into: "in"
  - from: "GetProductDataMappingRules2"
    via: "next"
    to: "CombineIterators1"
    into: "in"
  - from: "DecisionNode2"
    via: "yes"
    to: "GetRepositoryByUUID1"
    into: "in"
  - from: "GetProductDataMappingRules1"
    via: "next"
    to: "GetProductDataMappingRules2"
    into: "in"
  - from: "GetCurrentDate1"
    via: "next"
    to: "DecisionNode2"
    into: "in"
  - from: "Loop1"
    via: "do"
    to: "GetSyncRecord1"
    into: "in"
  - from: "CallNode1"
    via: "next"
    to: "End4"
    into: "in"
  - from: "JoinNode3"
    via: "next"
    to: "Loop1"
    into: "in"
  - from: "SynchronizeProducts1"
    via: "next"
    to: "JoinNode2"
    into: "in1"
  - from: "LoopNode2"
    via: "do"
    to: "DecisionNode8"
    into: "in"
  - from: "DecisionNode8"
    via: "yes"
    to: "Pipelet13"
    into: "in"
  - from: "DecisionNode8"
    via: "no"
    to: "Pipelet12"
    into: "in"
  - from: "DecisionNode7"
    via: "yes"
    to: "JoinNode13"
    into: "in1"
  - from: "DecisionNode7"
    via: "no"
    to: "LoopNode2"
    into: "in"
  - from: "LoopNode2"
    via: "next"
    to: "JoinNode13"
    into: "in1"
  - from: "CombineIterators1"
    via: "next"
    to: "CreateSyndicationProcessor1"
    into: "in"
  - from: "JoinNode12"
    via: "next"
    to: "LoopNode2"
    into: "loop"
  - from: "Pipelet13"
    via: "next"
    to: "JoinNode12"
    into: "in1"
  - from: "Pipelet12"
    via: "next"
    to: "JoinNode12"
    into: "in3"
  - from: "Start1"
    via: "next"
    to: "DecisionNode7"
    into: "in"
  - from: "JoinNode13"
    via: "next"
    to: "CallNode2"
    into: "in"
  - from: "CallNode3"
    via: "next"
    to: "JoinNode2"
    into: "in3"
  - from: "JoinNode2"
    via: "next"
    to: "End1"
    into: "in"
  - from: "GetRepositoryByUUID3"
    via: "error"
    to: "Join11"
    into: "in1"
  - from: "GetPageable3"
