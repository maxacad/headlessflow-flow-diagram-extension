flow: "DBInitPromotion"
kind: "process"

entries:
  - id: "StartNode1"
    name: "Start"
    mode: "private"
    strict: true
    inputs:
      - key: "PromotionConfiguration"
        type: "java.lang.String"
        required: false
  - id: "StartNode10"
    name: "VerifyCurrency"
    mode: "private"
    strict: true
    inputs:
      - key: "ConfiguredCurrency"
        type: "java.lang.String"
        required: false
  - id: "StartNode11"
    name: "CreatePromotionCodeGroup"
    mode: "private"
    strict: true
    inputs:
      - key: "Configuration"
        type: "java.util.Map"
        required: true
      - key: "LeadLocale"
        type: "com.intershop.beehive.core.capi.localization.LocaleInformation"
        required: true
      - key: "Promotion"
        type: "com.intershop.component.marketing.capi.rebate.Promotion"
        required: true
  - id: "StartNode12"
    name: "CreateCondition"
    mode: "private"
    strict: true
    inputs:
      - key: "Rebate"
        type: "com.intershop.component.marketing.capi.rebate.Rebate"
        required: true
      - key: "Domain"
        type: "com.intershop.beehive.core.capi.domain.Domain"
        required: true
      - key: "Configuration"
        type: "java.util.Map"
        required: true
  - id: "StartNode13"
    name: "GetCategoryIDsFromReferences"
    mode: "private"
    strict: true
    inputs:
      - key: "CategoryReferences"
        type: "java.lang.String"
        required: true
  - id: "StartNode14"
    name: "CreatePromotionCodeGroupApplicationAssignment"
    mode: "private"
    strict: true
    inputs:
      - key: "PromotionCodeGroup"
        type: "com.intershop.component.marketing.capi.code.PromotionCodeGroup"
        required: true
      - key: "Configuration"
        type: "java.util.Map"
        required: true
  - id: "StartNode15"
    name: "CreatePromotionApplicationAssignment"
    mode: "private"
    strict: true
    inputs:
      - key: "Configuration"
        type: "java.util.Map"
        required: true
      - key: "Promotion"
        type: "com.intershop.component.marketing.capi.rebate.Promotion"
        required: true
  - id: "StartNode16"
    name: "CreatePromotionSingleCode"
    mode: "private"
    strict: true
    inputs:
      - key: "Configuration"
        type: "java.util.Map"
        required: true
      - key: "Promotion"
        type: "com.intershop.component.marketing.capi.rebate.Promotion"
        required: true
  - id: "StartNode2"
    name: "CreatePromotion"
    mode: "private"
    strict: true
    inputs:
      - key: "Configuration"
        type: "java.util.Map"
        required: true
      - key: "LeadLocale"
        type: "com.intershop.beehive.core.capi.localization.LocaleInformation"
        required: true
  - id: "StartNode3"
    name: "CreatePromotionCode"
    mode: "private"
    strict: true
    inputs:
      - key: "Configuration"
        type: "java.util.Map"
        required: true
      - key: "PromotionCodeGroup"
        type: "com.intershop.component.marketing.capi.code.PromotionCodeGroup"
        required: true
      - key: "Promotion"
        type: "com.intershop.component.marketing.capi.rebate.Promotion"
        required: true
  - id: "StartNode4"
    name: "AssignTargetGroupMembers"
    mode: "private"
    strict: true
    inputs:
      - key: "Configuration"
        type: "java.util.Map"
        required: true
      - key: "Promotion"
        type: "com.intershop.component.marketing.capi.rebate.Promotion"
        required: true
  - id: "StartNode5"
    name: "CreateDiscount"
    mode: "private"
    strict: true
    inputs:
      - key: "Configuration"
        type: "java.util.Map"
        required: true
      - key: "Promotion"
        type: "com.intershop.component.marketing.capi.rebate.Promotion"
        required: true
      - key: "LeadLocale"
        type: "com.intershop.beehive.core.capi.localization.LocaleInformation"
        required: true
      - key: "ConfigurationName"
        type: "java.lang.Object"
        required: true
      - key: "Rebate"
        type: "com.intershop.component.marketing.capi.rebate.Rebate"
        required: true
  - id: "StartNode6"
    name: "CreateDiscounts"
    mode: "private"
    strict: true
    inputs:
      - key: "Configuration"
        type: "java.util.Map"
        required: true
      - key: "Promotion"
        type: "com.intershop.component.marketing.capi.rebate.Promotion"
        required: true
      - key: "LeadLocale"
        type: "com.intershop.beehive.core.capi.localization.LocaleInformation"
        required: true
  - id: "StartNode7"
    name: "CreateAction"
    mode: "private"
    strict: true
    inputs:
      - key: "Rebate"
        type: "com.intershop.component.marketing.capi.rebate.Rebate"
        required: true
      - key: "Domain"
        type: "com.intershop.beehive.core.capi.domain.Domain"
        required: true
      - key: "Configuration"
        type: "java.util.Map"
        required: true
  - id: "StartNode8"
    name: "DetermineProducts"
    mode: "private"
    strict: true
    inputs:
      - key: "ProductRefs"
        type: "java.lang.String"
        required: false
  - id: "StartNode9"
    name: "DetermineCategories"
    mode: "private"
    strict: true
    inputs:
      - key: "CategoryRefs"
        type: "java.lang.String"
        required: false

steps:
  - id: "AddObjectToVector1"
    type: "pipelet"
    ref: "AddObjectToVector"
    config:
      Mode: "Forbid Duplicates"
    bindings:
      InVector: "CategoryVec"
      Iterator: "Categories"
      OutVector: "CategoryVec"
      Object: "Category"
  - id: "AddObjectToVector3"
    type: "pipelet"
    ref: "AddObjectToVector"
    bindings:
      Object: "TrimmedCode"
      Iterator: "PromotionCodes"
      OutVector: "PromotionCodesV"
  - id: "AddPromotionCodeGroupToPromotion1"
    type: "pipelet"
    ref: "AddPromotionCodeGroupToPromotion"
  - id: "AssignPromotionCodeGroupToApplication1"
    type: "pipelet"
    ref: "AssignPromotionCodeGroupToApplication"
  - id: "AssignPromotionToApplication1"
    type: "pipelet"
    ref: "AssignPromotionToApplication"
  - id: "CallNode1"
    type: "call"
    ref: "ProcessPromotion-GetPromotionDomainByChannel"
    bindings:
      Channel: "CurrentChannel"
  - id: "CallNode10"
    type: "call"
    ref: "DBInitPromotion-GetCategoryIDsFromReferences"
  - id: "CallNode11"
    type: "call"
    ref: "ViewPromotionRebateInclusionsExclusions-Prefix"
  - id: "CallNode12"
    type: "call"
    ref: "DBInitPromotion-CreatePromotionCode"
  - id: "CallNode13"
    type: "call"
    ref: "ProcessPromotionBudget-SetBudget"
    bindings:
      Unlimited: "\"(Boolean)false\""
      Locale: "LeadLocale"
      StartDate: "Promotion:StartDate"
      EndDate: "Promotion:EndDate"
  - id: "CallNode14"
    type: "call"
    ref: "ProcessPromotionBudget-SetBudget"
    bindings:
      Unlimited: "\"(Boolean)true\""
      Locale: "LeadLocale"
      EndDate: "Promotion:EndDate"
      StartDate: "Promotion:StartDate"
  - id: "CallNode15"
    type: "call"
    ref: "ViewPromotionRebateInclusionsExclusions-Prefix"
  - id: "CallNode16"
    type: "call"
    ref: "ProcessPromotionRebateInclusionsExclusions-DBinitAssignToAction"
    bindings:
      Action: "RebateAction"
      Exclusion: "\"(Boolean)false\""
      FilterObjectType: "\"CATEGORY\""
      ObjectIDs: "SelectedCategoriesUUIDIterator"
      RebateFilterGroup: "IncludedCategoriesGroup"
      Scope: "\"ACTION\""
      ActionID: "null"
  - id: "CallNode17"
    type: "call"
    ref: "DBInitPromotion-GetCategoryIDsFromReferences"
  - id: "CallNode18"
    type: "call"
    ref: "DBInitPromotion-CreatePromotionCodeGroupApplicationAssignment"
  - id: "CallNode19"
    type: "call"
    ref: "ProcessPromotionCode-CheckUniqueness"
    bindings:
      SingleCode: "TrimmedCode"
      PromotionDomain: "Promotion:Domain"
  - id: "CallNode2"
    type: "call"
    ref: "This:CreatePromotion"
  - id: "CallNode20"
    type: "call"
    ref: "DBInitPromotion-CreatePromotionApplicationAssignment"
  - id: "CallNode21"
    type: "call"
    ref: "ProcessApplication-GetApplications"
    bindings:
      ChannelRepository: "CurrentChannel"
  - id: "CallNode22"
    type: "call"
    ref: "ProcessPromotionRebateInclusionsExclusions-DBinitAssignToCondition"
    bindings:
      Condition: "RebateCondition"
      ConditionID: "null"
      Exclusion: "\"(Boolean)false\""
      FilterObjectType: "\"CATEGORY\""
      ObjectIDs: "SelectedCategoriesUUIDIterator"
      RebateFilterGroup: "IncludedCategoriesGroup"
      Scope: "\"CONDITION\""
  - id: "CallNode23"
    type: "call"
    ref: "DBInitPromotion-CreatePromotionSingleCode"
  - id: "CallNode24"
    type: "call"
    ref: "ProcessPromotionCode-CheckUniqueness"
    bindings:
      PromotionDomain: "Promotion:Domain"
  - id: "CallNode3"
    type: "call"
    ref: "DBInitPromotion-CreatePromotionCodeGroup"
  - id: "CallNode4"
    type: "call"
    ref: "This:AssignTargetGroupMembers"
  - id: "CallNode48"
    type: "call"
    ref: "ProcessApplication-GetApplications"
    bindings:
      ChannelRepository: "CurrentChannel"
  - id: "CallNode5"
    type: "call"
    ref: "This:CreateDiscounts"
  - id: "CallNode6"
    type: "call"
    ref: "DBInitPromotion-CreateDiscount"
    bindings:
      Configuration: "DiscountConfiguration"
      ConfigurationName: "DiscountConfigurationName"
  - id: "CallNode7"
    type: "call"
    ref: "DBInitPromotion-CreateCondition"
    bindings:
      Domain: "Promotion:Domain"
  - id: "CallNode8"
    type: "call"
    ref: "DBInitPromotion-VerifyCurrency"
    bindings:
      ConfiguredCurrency: "Configuration:Discount.Currency"
  - id: "CallNode9"
    type: "call"
    ref: "DBInitPromotion-CreateAction"
    bindings:
      Domain: "Promotion:Domain"
  - id: "ConcatenateStrings1"
    type: "pipelet"
    ref: "ConcatenateStrings"
    config:
      DefaultString0: "Configuration:Discount.Rule.Condition."
      DefaultString2: ".Type"
    bindings:
      String1: "AttrName"
      Concatenated: "TypeKey"
  - id: "ConcatenateStrings2"
    type: "pipelet"
    ref: "ConcatenateStrings"
    config:
      DefaultString0: "Configuration:Discount.Rule.Condition."
      DefaultString2: ".Value"
    bindings:
      String1: "AttrName"
      Concatenated: "ValueKey"
  - id: "ConcatenateStrings3"
    type: "pipelet"
    ref: "ConcatenateStrings"
    config:
      DefaultString0: "Configuration:Discount.Rule.Action."
      DefaultString2: ".Value"
    bindings:
      String1: "AttrName"
      Concatenated: "ValueKey"
  - id: "ConcatenateStrings4"
    type: "pipelet"
    ref: "ConcatenateStrings"
    config:
      DefaultString1: "-Site"
    bindings:
      String0: "Promotion:Domain:DomainName"
      Concatenated: "SiteName"
  - id: "ConcatenateStrings5"
    type: "pipelet"
    ref: "ConcatenateStrings"
    config:
      DefaultString0: "Configuration:Discount.Rule.Action."
      DefaultString2: ".Type"
    bindings:
      String1: "AttrName"
      Concatenated: "TypeKey"
  - id: "ConcatenateStrings6"
    type: "pipelet"
    ref: "ConcatenateStrings"
    config:
      DefaultString1: "-Site"
    bindings:
      String0: "Domain:DomainName"
      Concatenated: "SiteName"
  - id: "ConcatenateStrings7"
    type: "pipelet"
    ref: "ConcatenateStrings"
    config:
      DefaultString1: "-Site"
    bindings:
      String0: "Domain:DomainName"
      Concatenated: "SiteName"
  - id: "ConcatenateStrings8"
    type: "pipelet"
    ref: "ConcatenateStrings"
    config:
      DefaultString1: ","
    bindings:
      String0: "CategoryUUIDs"
      String2: "Category:UUID"
      Concatenated: "CategoryUUIDs"
  - id: "Convert1"
    type: "pipelet"
    ref: "Convert"
    config:
      ResultClass: "com.intershop.beehive.foundation.quantity.Money"
    bindings:
      Object2: "Configuration:Promotion.BudgetAmount"
      ResultObject: "BudgetAmount"
      Object1: "Promotion:Currency:Mnemonic"
  - id: "Convert2"
    type: "pipelet"
    ref: "Convert"
    config:
      ResultClass: "java.lang.Double"
    bindings:
      ResultObject: "BudgetNotificationThreshold"
      Object1: "\"0.0\""
  - id: "Convert3"
    type: "pipelet"
    ref: "Convert"
    config:
      ResultClass: "com.intershop.beehive.foundation.quantity.Money"
    bindings:
      Object2: "\"0.0\""
      ResultObject: "BudgetAmount"
      Object1: "Promotion:Currency:Mnemonic"
  - id: "Convert4"
    type: "pipelet"
    ref: "Convert"
    config:
      ResultClass: "java.lang.Double"
    bindings:
      ResultObject: "BudgetNotificationThreshold"
      Object1: "Configuration:Promotion.BudgetNotificationThreshold"
  - id: "Convert5"
    type: "pipelet"
    ref: "Convert"
    config:
      ResultClass: "java.lang.Boolean"
    bindings:
      Object1: "Configuration:PromotionSingleCode.SingleCodeCustomerUnlimited"
      ResultObject: "SingleCodeCustomerUnlimited"
  - id: "Convert6"
    type: "pipelet"
    ref: "Convert"
    config:
      ResultClass: "java.lang.Integer"
    bindings:
      Object1: "Configuration:PromotionSingleCode.TotalReusePerCode"
      ResultObject: "SingleCodeTotal"
  - id: "Convert7"
    type: "pipelet"
    ref: "Convert"
    config:
      ResultClass: "java.lang.Integer"
    bindings:
      Object1: "Configuration:PromotionSingleCode.TotalReusePerCodeFlag"
      ResultObject: "TotalReusePerCodeFlag"
  - id: "CreateAction1"
    type: "pipelet"
    ref: "CreateAction"
    bindings:
      Action: "RebateAction"
      Owner: "Rebate"
  - id: "CreateCondition1"
    type: "pipelet"
    ref: "CreateCondition"
    config:
      TypeGroupCondition: false
    bindings:
      ConditionDescriptorID: "Configuration:Discount.Rule.Condition.DescriptorID"
      Owner: "Rebate"
      CurrentDomain: "Domain"
      Condition: "RebateCondition"
      TargetCondition: "AndCondition"
  - id: "CreateIteratorFromConfigValues1"
    type: "pipelet"
    ref: "CreateIteratorFromConfigValues"
    config:
      Delimiters: ","
    bindings:
      ValuesString: "Configuration:Promotion.TargetGroup.Groups"
      ValuesIterator: "UserGroupRefs"
  - id: "CreateIteratorFromConfigValues2"
    type: "pipelet"
    ref: "CreateIteratorFromConfigValues"
    config:
      Delimiters: ","
    bindings:
      ValuesString: "Configuration:Promotion.Discounts"
      ValuesIterator: "DiscountConfigurations"
  - id: "CreateIteratorFromConfigValues3"
    type: "pipelet"
    ref: "CreateIteratorFromConfigValues"
    config:
      Delimiters: ","
    bindings:
      ValuesString: "ProductRefs"
      ValuesIterator: "ProductRefIterator"
  - id: "CreateIteratorFromConfigValues4"
    type: "pipelet"
    ref: "CreateIteratorFromConfigValues"
    config:
      Delimiters: ","
    bindings:
      ValuesString: "CategoryRefs"
      ValuesIterator: "CategoryRefIterator"
  - id: "CreateIteratorFromConfigValues5"
    type: "pipelet"
    ref: "CreateIteratorFromConfigValues"
    config:
      Delimiters: ",;"
    bindings:
      ValuesString: "Configuration:Discount.Rule.Condition.Attributes"
      ValuesIterator: "AttrNames"
  - id: "CreateIteratorFromConfigValues6"
    type: "pipelet"
    ref: "CreateIteratorFromConfigValues"
    config:
      Delimiters: ",;"
    bindings:
      ValuesString: "Configuration:Discount.Rule.Action.Attributes"
      ValuesIterator: "AttrNames"
  - id: "CreateIteratorFromConfigValues8"
    type: "pipelet"
    ref: "CreateIteratorFromConfigValues"
    config:
      Delimiters: ",;"
    bindings:
      ValuesString: "CategoryUUIDs"
      ValuesIterator: "SelectedCategoriesUUIDIterator"
  - id: "CreateIteratorFromConfigValues9"
    type: "pipelet"
    ref: "CreateIteratorFromConfigValues"
    config:
      Delimiters: ",;"
    bindings:
      ValuesString: "CategoryReferences"
      ValuesIterator: "CategoriesRefs"
  - id: "CreatePromotionCodeGroup1"
    type: "pipelet"
    ref: "CreatePromotionCodeGroup"
    bindings:
      Domain: "Promotion:Domain"
      GroupID: "Configuration:PromotionCodeGroup.ID"
  - id: "CreatePromotionCodes1"
    type: "pipelet"
    ref: "CreatePromotionCodes"
    config:
      Secured: false
    bindings:
      CodeLevel4Commit: "\"(Integer)1\""
      Codes: "PromotionCodes"
      Domain: "PromotionCodeGroup:Domain"
      PromotionCodeGroup: "PromotionCodeGroup"
  - id: "CreateRebate1"
    type: "pipelet"
    ref: "CreateRebate"
    bindings:
      Domain: "Promotion:Domain"
      CurrencyCode: "null"
  - id: "CreateRebate2"
    type: "pipelet"
    ref: "CreateRebate"
    bindings:
      Domain: "Promotion:Domain"
      CurrencyCode: "Configuration:Discount.Currency"
  - id: "CreateStringSplitter1"
    type: "pipelet"
    ref: "CreateStringSplitter"
    config:
      Mode: "Last Occurrence"
      Separator: "@"
    bindings:
      Splitter: "UGRef"
  - id: "CreateStringSplitter2"
    type: "pipelet"
    ref: "CreateStringSplitter"
    config:
      Mode: "Last Occurrence"
      Separator: "@"
    bindings:
      Splitter: "CatRef"
  - id: "DecisionNode1"
    type: "decision"
    condition: "Configuration:Discount.Currency"
  - id: "DecisionNode10"
    type: "decision"
    condition: "ConfiguredCurrency"
  - id: "DecisionNode11"
    type: "decision"
    condition: "Configuration:Promotion.Unlimited"
  - id: "DecisionNode12"
    type: "decision"
    condition: "Configuration:Discount.Currency"
  - id: "DecisionNode13"
    type: "decision"
    condition: "Configuration:Discount.Rule.Condition.Categories"
  - id: "DecisionNode14"
    type: "decision"
    condition: "Configuration:Promotion.ExternalDetailsURL"
  - id: "DecisionNode15"
    type: "decision"
    condition: "Configuration:Discount.Rule.Action.Categories"
  - id: "DecisionNode16"
    type: "decision"
    condition: "Promotion:RebatesCount"
  - id: "DecisionNode17"
    type: "decision"
    condition: "Configuration:Promotion.BudgetAmount"
  - id: "DecisionNode18"
    type: "decision"
    condition: "Configuration:Promotion.Unlimited"
  - id: "DecisionNode19"
    type: "decision"
    condition: "Configuration:Promotion.LocalizableAVs"
  - id: "DecisionNode2"
    type: "decision"
    condition: "Rebate:Actions"
  - id: "DecisionNode20"
    type: "decision"
    condition: "Configuration:Promotion.Rebate.LocalizableAVs"
  - id: "DecisionNode21"
    type: "decision"
    condition: "SelectedCategoriesUUIDIterator"
  - id: "DecisionNode22"
    type: "decision"
    condition: "SelectedCategoriesUUIDIterator"
  - id: "DecisionNode23"
    type: "decision"
    condition: "Configuration:Discount.Rule.Condition.DescriptorID"
  - id: "DecisionNode24"
    type: "decision"
    condition: "TotalReusePerCodeFlag"
  - id: "DecisionNode25"
    type: "decision"
    condition: "Application:Default"
  - id: "DecisionNode26"
    type: "decision"
    condition: "Configuration:PromotionSingleCode.Code"
  - id: "DecisionNode28"
    type: "decision"
    condition: "Application:Default"
  - id: "DecisionNode29"
    type: "decision"
    condition: "Application:Default"
  - id: "DecisionNode3"
    type: "decision"
    condition: "Configuration:Discount.Rule.Action.DescriptorID"
  - id: "DecisionNode30"
    type: "decision"
    condition: "Application:Default"
  - id: "DecisionNode4"
    type: "decision"
    condition: "Rebate:Condition"
  - id: "DecisionNode5"
    type: "decision"
    condition: "CategoryUUIDs"
  - id: "DecisionNode6"
    type: "decision"
    condition: "CategoryUUIDs"
  - id: "DecisionNode7"
    type: "decision"
    condition: "Configuration:PromotionCodeGroup.ID"
  - id: "DecisionNode8"
    type: "decision"
    condition: "PromotionCurrency"
  - id: "DecisionNode9"
    type: "decision"
    condition: "ConfiguredCurrency"
  - id: "EndNode1"
    type: "end"
    strict: true
    outputs:
      - key: "Promotion"
        type: "com.intershop.component.marketing.capi.rebate.Promotion"
        guaranteed: true
  - id: "EndNode10"
    type: "end"
    strict: true
  - id: "EndNode11"
    type: "end"
    strict: true
    outputs:
      - key: "RebateAction"
        type: "com.intershop.component.foundation.capi.action.Action"
        guaranteed: true
  - id: "EndNode12"
    type: "end"
    strict: true
    outputs:
      - key: "PromotionCodeGroup"
        type: "com.intershop.component.marketing.capi.code.PromotionCodeGroup"
        guaranteed: true
  - id: "EndNode13"
    type: "end"
    strict: true
  - id: "EndNode14"
    type: "end"
    strict: true
  - id: "EndNode15"
    type: "end"
    strict: true
    outputs:
      - key: "PromotionCurrency"
        type: "java.lang.String"
        guaranteed: false
  - id: "EndNode16"
    type: "end"
    strict: true
    outputs:
      - key: "SelectedCategoriesUUIDIterator"
        type: "java.util.Iterator"
        guaranteed: false
      - key: "SiteName"
        type: "java.lang.String"
        guaranteed: false
  - id: "EndNode17"
    type: "end"
    strict: true
  - id: "EndNode18"
    type: "end"
    strict: true
  - id: "EndNode19"
    type: "end"
    strict: true
    outputs:
      - key: "ApplicationBO"
        type: "com.intershop.component.application.capi.ApplicationBO"
        guaranteed: true
  - id: "EndNode2"
    type: "end"
    strict: true
  - id: "EndNode20"
    type: "end"
    strict: true
  - id: "EndNode3"
    type: "end"
    strict: true
  - id: "EndNode4"
    type: "end"
    strict: true
  - id: "EndNode5"
    type: "end"
    strict: true
    outputs:
      - key: "Rebate"
        type: "com.intershop.component.marketing.capi.rebate.Rebate"
        guaranteed: true
  - id: "EndNode6"
    type: "end"
    strict: true
  - id: "EndNode7"
    type: "end"
    strict: true
    outputs:
      - key: "Products"
        type: "java.util.Iterator"
        guaranteed: false
      - key: "ProductUUIDMap"
        type: "java.util.Map"
        guaranteed: false
  - id: "EndNode8"
    type: "end"
    strict: true
    outputs:
      - key: "Categories"
        type: "java.util.Iterator"
        guaranteed: false
  - id: "EndNode9"
    type: "end"
    strict: true
    outputs:
      - key: "RebateCondition"
        type: "com.intershop.component.foundation.capi.condition.Condition"
        guaranteed: true
  - id: "GetActionApplicationContext1"
    type: "pipelet"
    ref: "GetActionApplicationContext"
    bindings:
      ActionDescriptorRegistryName: "\"promotionActionDescriptorRegistry\""
      ActionRepositoryName: "\"promotionActionRepository\""
  - id: "GetActionApplicationContext2"
