    mode: "private"
    strict: false
    inputs:
      []
  - id: "StartNode4"
    name: "ViewPasswordChange"
    mode: "private"
    strict: false
    inputs:
      []
  - id: "StartNode5"
    name: "FinishLogin"
    mode: "private"
    strict: false
    inputs:
      []
  - id: "StartNode6"
    name: "ProcessPasswordChange"
    mode: "private"
    strict: false
    inputs:
      []

