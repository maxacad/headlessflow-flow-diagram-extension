  - id: "Start2"
    name: "DisplayWelcomePage"
    mode: "private"
    strict: false
    inputs:
      []
  - id: "Start4"
    name: "DisplaySiteNavigationBar"
    mode: "private"
    strict: false
    inputs:
      []
  - id: "Start5"
    name: "DisplayLogin"
    mode: "private"
    strict: false
    inputs:
      - key: "Login"
        type: "java.lang.String"
        required: false
      - key: "Password"
        type: "java.lang.String"
        required: false
  - id: "Start6"
    name: "ProcessLogin"
    mode: "private"
    strict: false
    inputs:
      - key: "Login"
        type: "java.lang.String"
        required: false
      - key: "Password"
        type: "java.lang.String"
        required: false
  - id: "Start7"
