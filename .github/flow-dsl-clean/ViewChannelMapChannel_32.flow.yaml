flow: "ViewChannelMapChannel_32"
kind: "view"

entries:
  - id: "Start1"
    name: "Information"
    mode: "private"
    strict: false
    inputs:
      []
  - id: "Start2"
    name: "SelectPartner"
    mode: "private"
    strict: false
    inputs:
      []
  - id: "Start4"
    name: "EditChannel"
    mode: "private"
    strict: false
    inputs:
      []
  - id: "Start5"
    name: "Dispatch"
    mode: "private"
    strict: false
    inputs:
      []

steps:
  - id: "Call2"
    type: "call"
    ref: "ProcessChannelPermission-GetAccessRoles"
  - id: "Call3"
    type: "call"
    ref: "ProcessUserList-ByFilter"
  - id: "CallNode1"
    type: "call"
    ref: "ViewChannel-ProcessSelect"
  - id: "CallNode2"
    type: "call"
    ref: "ViewChannel-ProcessSelect"
  - id: "CallNode3"
    type: "call"
    ref: "ProcessGlobalNavigationBar-GetChannelPermissions"
  - id: "CreatePageableFromIterator1"
    type: "pipelet"
    ref: "CreatePageableFromIterator"
    bindings:
      Iterator: "Organizations"
      Pageable: "Organizations"
  - id: "DispatchFormAction1"
    type: "pipelet"
    ref: "DispatchFormAction"
    config:
      OutValue_0: "ViewChannelMapChannel_32-EditChannel"
      OutValue_1: "ViewChannelMapChannel_32-SelectPartner"
      OutValue_2: "ViewChannelMap-ListAll"
    bindings:
      Key_0: "channelEdit"
      Key_1: "partnerEdit"
      Key_2: "back"
      SelectionKey: "JumpTarget"
  - id: "GetDomainByName1"
    type: "pipelet"
    ref: "GetDomainByName"
    bindings:
      DomainName: "\"SLDSystem\""
  - id: "GetOrganizations3"
    type: "pipelet"
    ref: "GetOrganizations"
    bindings:
      OrganizationType: "null"
      Owner: "Repository:RepositoryDomain"
  - id: "InteractionEnd2"
    type: "interaction"
  - id: "Jump1"
    type: "jump"
    ref: "SecureJump-Start"
  - id: "Jump2"
    type: "jump"
    ref: "ViewOrganizationList_32-ListAll"
  - id: "Jump3"
    type: "jump"
    ref: "ViewOverview-Channel"
  - id: "KeyMapper1"
    type: "pipelet"
    ref: "KeyMapper"
    config:
      ValueType: "Dictionary Value"
    bindings:
      InValue_1: "RepositoryUUID"
      OutValue_1: "ChannelID"
  - id: "KeyMapper3"
    type: "pipelet"
    ref: "KeyMapper"
    bindings:
      InValue_1: "AccessRoles"
      InValue_2: "Repository:OwningDomain:Domain"
      OutValue_1: "UserGroups"
      OutValue_2: "UserDomain"
  - id: "Pipelet1"
    type: "pipelet"
    ref: "KeyMapper"
    config:
      ValueType: "Dictionary Value"
    bindings:
      InValue_1: "RepositoryUUID"
      OutValue_1: "ChannelID"
  - id: "Pipelet2"
    type: "pipelet"
    ref: "GetChannelTypeByID"
    bindings:
      ChannelType: "RepositoryType"
      ChannelTypeID: "Repository:TypeCode"
  - id: "PrepareApplicationView1"
    type: "pipelet"
    ref: "PrepareApplicationView"
    config:
      SelectedMenuItem: "ChannelMap"
      WorkingTemplate: "channel/IncChannelInformation_32"
  - id: "SetDictionaryValue1"
    type: "pipelet"
    ref: "SetDictionaryValue"
    config:
      Name: "Filter"
      Value: "ProcessUserList-UserGroupsFilter"
  - id: "UpdatePageSize1"
    type: "pipelet"
    ref: "UpdatePageSize"
    config:
      DefaultPageSize: 1000
    bindings:
      PageSize: "null"
      PageableIterator: "Users"

links:
  - from: "GetOrganizations3"
