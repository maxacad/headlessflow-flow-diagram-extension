flow: "JournalLifetimeJob"
kind: "com.intershop.beehive.core.capi.domain.Domain"

entries:
  - id: "StartNode2"
    name: "Start"
    mode: "private"
    strict: false
    inputs:
      []
  - id: "StartNode4"
    name: "ProcessCleanUpJournal"
    mode: "private"
    strict: true
    inputs:
      - key: "PreferenceDomain"
        type: "com.intershop.beehive.core.capi.domain.Domain"
        required: true
      - key: "JournalEntryDomain"
        type: "com.intershop.beehive.core.capi.domain.Domain"
        required: true

steps:
  - id: "AddObjectToVector1"
    type: "pipelet"
    ref: "AddObjectToVector"
    bindings:
      Object: "\"20\""
      OutVector: "TypeCodes"
  - id: "AddObjectToVector2"
    type: "pipelet"
    ref: "AddObjectToVector"
    bindings:
      Object: "\"30\""
      OutVector: "TypeCodes"
      InVector: "TypeCodes"
  - id: "CallNode1"
    type: "call"
    ref: "JournalLifetimeJob-ProcessCleanUpJournal"
    bindings:
      JournalEntryDomain: "MasterRepositiry:RepositoryDomain"
      PreferenceDomain: "Enterprise:Domain"
  - id: "CallNode2"
    type: "call"
    ref: "JournalLifetimeJob-ProcessCleanUpJournal"
    bindings:
      PreferenceDomain: "CurrentChannel:Domain"
      JournalEntryDomain: "CurrentChannel:Domain"
  - id: "DecisionNode3"
    type: "decision"
    condition: "JournalState"
  - id: "EndNode1"
    type: "end"
    strict: false
  - id: "EndNode2"
    type: "end"
    strict: false
  - id: "EndNode4"
    type: "end"
    strict: true
  - id: "ExecuteObjectsQuery1"
    type: "pipelet"
    ref: "ExecuteObjectsQuery"
    config:
      QueryName: "channel/GetChannelsByTypeCode"
      Datasource: "current ORM connection"
      ParameterName_01: "TypeCodes"
    bindings:
      ParameterValue_01: "\"32 42 52\""
      SearchResult: "Channels"
  - id: "ExecuteObjectsQuery2"
    type: "pipelet"
    ref: "ExecuteObjectsQuery"
    config:
      QueryName: "organization/GetOrganizationsByTypeCode"
      Datasource: "current ORM connection"
      ParameterName_01: "TypeCodes"
    bindings:
      SearchResult: "Enterprises"
      ParameterValue_01: "TypeCodes"
  - id: "GetRepository2"
    type: "pipelet"
    ref: "GetRepository"
    config:
      CustomRepositoryTypeCode: 21
      Type: "Custom Repository"
    bindings:
      OrganizationDomain: "Enterprise:Domain"
      Repository: "MasterRepositiry"
  - id: "JoinNode1"
    type: "join"
  - id: "JoinNode10"
    type: "join"
  - id: "JoinNode11"
    type: "join"
  - id: "JoinNode2"
    type: "join"
  - id: "JoinNode9"
    type: "join"
  - id: "LoopNode1"
    type: "loop"
  - id: "LoopNode2"
    type: "loop"
  - id: "Pipelet1"
    type: "pipelet"
    ref: "GetDomainPreference"
    config:
      DefaultPreferenceKey: "JournalLifetime"
      Type: "Integer"
    bindings:
      PreferenceIntValue: "JournalLifetime"
  - id: "Pipelet2"
    type: "pipelet"
    ref: "GetDomainPreference"
    config:
      DefaultPreferenceKey: "JournalState"
      Type: "Integer"
    bindings:
      PreferenceIntValue: "JournalState"
  - id: "Pipelet6"
    type: "pipelet"
    ref: "RemoveExpiredJournalEntries"
    config:
      State: "All"
    bindings:
      Domain: "JournalEntryDomain"
      LifeTime: "JournalLifetime"

links:
  - from: "LoopNode2"
    via: "do"
    to: "CallNode2"
    into: "in"
  - from: "Pipelet2"
    via: "next"
    to: "DecisionNode3"
    into: "in"
  - from: "JoinNode10"
    via: "next"
    to: "JoinNode11"
    into: "in1"
  - from: "AddObjectToVector1"
    via: "next"
    to: "AddObjectToVector2"
    into: "in"
  - from: "JoinNode11"
    via: "next"
    to: "JoinNode9"
    into: "in3"
  - from: "GetRepository2"
    via: "error"
    to: "JoinNode1"
    into: "in2"
  - from: "Pipelet1"
    via: "next"
    to: "Pipelet6"
    into: "in"
  - from: "DecisionNode3"
    via: "no"
    to: "JoinNode10"
    into: "in2"
  - from: "ExecuteObjectsQuery2"
    via: "error"
    to: "JoinNode1"
    into: "in1"
  - from: "StartNode4"
    via: "next"
    to: "Pipelet2"
    into: "in"
  - from: "Pipelet1"
    via: "error"
    to: "JoinNode11"
    into: "in2"
  - from: "LoopNode2"
    via: "next"
    to: "EndNode1"
    into: "in"
  - from: "ExecuteObjectsQuery1"
    via: "next"
    to: "LoopNode2"
    into: "in"
  - from: "AddObjectToVector2"
    via: "next"
    to: "ExecuteObjectsQuery2"
    into: "in"
  - from: "StartNode2"
    via: "next"
    to: "AddObjectToVector1"
    into: "in"
  - from: "CallNode2"
    via: "next"
    to: "LoopNode2"
    into: "loop"
  - from: "JoinNode9"
    via: "next"
    to: "EndNode4"
    into: "in"
  - from: "Pipelet6"
    via: "next"
    to: "JoinNode9"
    into: "in1"
  - from: "ExecuteObjectsQuery2"
    via: "next"
    to: "LoopNode1"
    into: "in"
  - from: "CallNode1"
    via: "next"
    to: "LoopNode1"
    into: "loop"
  - from: "LoopNode1"
    via: "next"
    to: "ExecuteObjectsQuery1"
    into: "in"
  - from: "LoopNode1"
    via: "do"
    to: "GetRepository2"
    into: "in"
  - from: "GetRepository2"
    via: "next"
    to: "CallNode1"
    into: "in"
  - from: "ExecuteObjectsQuery1"
    via: "error"
    to: "JoinNode2"
    into: "in2"
  - from: "DecisionNode3"
    via: "yes"
    to: "Pipelet1"
    into: "in"
  - from: "Pipelet2"
    via: "error"
    to: "JoinNode10"
    into: "in1"
  - from: "JoinNode1"
    via: "next"
    to: "JoinNode2"
    into: "in1"
  - from: "JoinNode2"
    via: "next"
    to: "EndNode2"
    into: "in"
