flow: "ProcessProductNotification"
kind: "process"

entries:
  - id: "Start4"
    name: "GetNotificationsByUser"
    mode: "private"
    strict: true
    inputs:
      []
  - id: "Start5"
    name: "GetNotificationByProduct"
    mode: "private"
    strict: true
    inputs:
      - key: "ProductBO"
        type: "com.intershop.component.product.capi.ProductBO"
        required: true
      - key: "Type"
        type: "java.lang.String"
        required: true
  - id: "StartNode1"
    name: "GetProduct"
    mode: "private"
    strict: true
    inputs:
      - key: "SKU"
        type: "java.lang.String"
        required: true
      - key: "ProductDomain"
        type: "com.intershop.beehive.core.capi.domain.Domain"
        required: true
  - id: "StartNode2"
    name: "GetNotificationByAlertUUID"
    mode: "private"
    strict: true
    inputs:
      - key: "AlertUUID"
        type: "java.lang.String"
        required: true
  - id: "StartNode5"
    name: "RemoveAlert"
    mode: "private"
    strict: true
    inputs:
      - key: "AlertUUID"
        type: "java.lang.String"
        required: true

steps:
  - id: "CallNode1"
    type: "call"
    ref: "ProcessProductNotification-GetNotificationByAlertUUID"
  - id: "CallNode2"
    type: "call"
    ref: "ProcessB2CProduct-GetProductBO"
  - id: "CallNode9"
    type: "call"
    ref: "ProcessB2CProduct-GetProduct"
  - id: "Decision2"
    type: "decision"
    condition: "Alert:UUID"
  - id: "Decision4"
    type: "decision"
    condition: "CurrentSession:LoggedIn"
  - id: "Decision5"
    type: "decision"
    condition: "Alert:Product:UUID"
  - id: "DecisionNode1"
    type: "decision"
    condition: "Type"
  - id: "DecisionNode2"
    type: "decision"
    condition: "Alert:HandlerClassName"
  - id: "DecisionNode3"
    type: "decision"
    condition: "Alert:HandlerClassName"
  - id: "DecisionNode4"
    type: "decision"
    condition: "Type"
  - id: "End1"
    type: "end"
    strict: false
    outputs:
      - key: "Type"
        type: "java.lang.String"
        guaranteed: true
  - id: "End2"
    type: "end"
    strict: false
  - id: "End3"
    type: "end"
    strict: true
    outputs:
      - key: "AlertUUID"
        type: "java.lang.String"
        guaranteed: false
      - key: "Alert"
        type: "com.intershop.component.mvc.capi.alert.Alert"
        guaranteed: false
      - key: "Type"
        type: "java.lang.String"
        guaranteed: true
  - id: "EndNode1"
    type: "end"
    strict: true
    outputs:
      - key: "Type"
        type: "java.lang.String"
        guaranteed: true
  - id: "EndNode2"
    type: "end"
    strict: true
    outputs:
      - key: "ERROR_ALERT_NOT_FOUND"
        type: "java.lang.String"
        guaranteed: false
  - id: "EndNode3"
    type: "end"
    strict: true
    outputs:
      - key: "Product"
        type: "com.intershop.beehive.xcs.capi.product.Product"
        guaranteed: true
      - key: "ProductBO"
        type: "com.intershop.component.product.capi.ProductBO"
        guaranteed: true
  - id: "EndNode4"
    type: "end"
    strict: true
  - id: "EndNode5"
    type: "end"
    strict: true
    outputs:
      - key: "ERROR_ALERT_NOT_FOUND"
        type: "java.lang.String"
        guaranteed: true
  - id: "EndNode6"
    type: "end"
    strict: true
    outputs:
      - key: "UserAlerts"
        type: "java.util.Iterator"
        guaranteed: true
  - id: "EndNode7"
    type: "end"
    strict: true
    outputs:
      - key: "Alert"
        type: "com.intershop.component.mvc.capi.alert.Alert"
        guaranteed: true
  - id: "GetAlertsByUser2"
    type: "pipelet"
    ref: "GetAlertsByUser"
    bindings:
      AlertUser: "CurrentUser"
  - id: "GetAlertsByUser3"
    type: "pipelet"
    ref: "GetAlertsByUser"
    bindings:
      AlertUser: "CurrentUser"
  - id: "GetAlertsByUser4"
    type: "pipelet"
    ref: "GetAlertsByUser"
    bindings:
      AlertUser: "CurrentUser"
  - id: "Join2"
    type: "join"
  - id: "Join6"
    type: "join"
  - id: "JoinNode1"
    type: "join"
  - id: "JoinNode3"
    type: "join"
  - id: "JoinNode9"
    type: "join"
  - id: "KeyMapper1"
    type: "pipelet"
    ref: "KeyMapper"
    config:
      ValueType: "Dictionary Value"
    bindings:
      InValue_1: "Alert:UUID"
      OutValue_1: "AlertUUID"
  - id: "Loop1"
    type: "loop"
  - id: "Loop3"
    type: "loop"
  - id: "Pipelet13"
    type: "pipelet"
    ref: "RemoveAlert"
  - id: "Pipelet3"
    type: "pipelet"
    ref: "CheckForEmptyIterator"
    bindings:
      FilledIterator: "UserAlerts"
  - id: "Pipelet6"
    type: "pipelet"
    ref: "CheckForEmptyIterator"
    bindings:
      FilledIterator: "UserAlerts"
  - id: "RemoveDictionaryValue1"
    type: "pipelet"
    ref: "RemoveDictionaryValue"
    config:
      Key: "Alert"
  - id: "SetDictionaryValue2"
    type: "pipelet"
    ref: "SetDictionaryValue"
    config:
      Name: "ERROR_ALERT_NOT_FOUND"
      Value: true

links:
  - from: "Loop1"
    via: "next"
    to: "RemoveDictionaryValue1"
    into: "in"
  - from: "StartNode1"
    via: "next"
    to: "CallNode9"
    into: "in"
  - from: "Pipelet6"
    via: "error"
    to: "Join6"
    into: "in2"
  - from: "Start5"
    via: "next"
    to: "Decision4"
    into: "in"
  - from: "Decision5"
    via: "yes"
    to: "DecisionNode1"
    into: "in"
  - from: "Join6"
    via: "next"
    to: "End1"
    into: "in"
  - from: "Join2"
    via: "next"
    to: "SetDictionaryValue2"
    into: "in"
  - from: "Start4"
    via: "next"
    to: "GetAlertsByUser2"
    into: "in"
  - from: "CallNode1"
    via: "ERROR_ALERT_NOT_FOUND"
    to: "JoinNode9"
    into: "in1"
  - from: "GetAlertsByUser2"
    via: "next"
    to: "EndNode6"
    into: "in"
  - from: "DecisionNode1"
    via: "yes"
    to: "DecisionNode3"
    into: "in"
  - from: "Decision4"
    via: "yes"
    to: "GetAlertsByUser3"
    into: "in"
  - from: "CallNode9"
    via: "ERROR"
    to: "EndNode4"
    into: "in"
  - from: "DecisionNode1"
    via: "no"
    to: "DecisionNode4"
    into: "in"
  - from: "DecisionNode4"
    via: "yes"
    to: "DecisionNode2"
    into: "in"
  - from: "JoinNode9"
    via: "next"
    to: "EndNode2"
    into: "in"
  - from: "CallNode1"
    via: "Alert"
    to: "Pipelet13"
    into: "in"
  - from: "DecisionNode4"
    via: "no"
    to: "EndNode1"
    into: "in"
  - from: "Pipelet13"
    via: "next"
    to: "JoinNode9"
    into: "in1"
  - from: "Loop3"
    via: "do"
    to: "Decision2"
    into: "in"
  - from: "DecisionNode2"
    via: "no"
    to: "JoinNode3"
    into: "in1"
  - from: "RemoveDictionaryValue1"
    via: "next"
    to: "Join6"
    into: "in1"
  - from: "CallNode9"
    via: "next"
    to: "CallNode2"
    into: "in"
  - from: "CallNode2"
    via: "next"
    to: "EndNode3"
    into: "in"
  - from: "DecisionNode2"
    via: "yes"
    to: "JoinNode1"
    into: "in3"
  - from: "KeyMapper1"
    via: "next"
    to: "End3"
    into: "in"
  - from: "DecisionNode3"
    via: "yes"
    to: "JoinNode3"
    into: "in1"
  - from: "JoinNode1"
    via: "next"
    to: "KeyMapper1"
    into: "in"
  - from: "StartNode2"
    via: "next"
    to: "GetAlertsByUser4"
    into: "in"
  - from: "Pipelet6"
    via: "next"
    to: "Loop1"
    into: "in"
  - from: "Decision5"
    via: "no"
    to: "JoinNode3"
    into: "in1"
  - from: "JoinNode3"
    via: "next"
    to: "Loop1"
    into: "loop"
  - from: "GetAlertsByUser4"
    via: "next"
    to: "Pipelet3"
    into: "in"
  - from: "Decision2"
    via: "no"
    to: "Loop3"
    into: "loop"
  - from: "Pipelet3"
    via: "next"
    to: "Loop3"
    into: "in"
  - from: "SetDictionaryValue2"
    via: "next"
    to: "EndNode5"
    into: "in"
  - from: "StartNode5"
    via: "next"
    to: "CallNode1"
    into: "in"
  - from: "Loop1"
    via: "do"
    to: "Decision5"
    into: "in"
  - from: "Loop3"
    via: "next"
    to: "Join2"
    into: "in1"
  - from: "Pipelet3"
    via: "error"
    to: "Join2"
    into: "in2"
  - from: "Decision2"
    via: "yes"
    to: "EndNode7"
    into: "in"
  - from: "DecisionNode3"
    via: "no"
    to: "JoinNode1"
    into: "in1"
  - from: "GetAlertsByUser3"
    via: "next"
    to: "Pipelet6"
