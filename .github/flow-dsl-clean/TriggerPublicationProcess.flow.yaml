flow: "TriggerPublicationProcess"
kind: "process"

entries:
  - id: "Start1"
    name: "Start"
    mode: "private"
    strict: false
    inputs:
      []
  - id: "Start2"
    name: "TriggerLive"
    mode: "private"
    strict: false
    inputs:
      []
  - id: "StartNode1"
    name: "Error"
    mode: "private"
    strict: false
    inputs:
      []
  - id: "StartNode4"
    name: "SynchronizeLiveSystems"
    mode: "private"
    strict: false
    inputs:
      []

