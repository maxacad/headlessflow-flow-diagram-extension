    type: "join"
  - id: "JumpNode2"
    type: "jump"
    ref: "TriggerStagingProcess-Error"
  - id: "JumpNode5"
    type: "jump"
    ref: "TriggerStagingProcess-HandleError"
  - id: "LoopNode1"
    type: "loop"
  - id: "LoopNode2"
    type: "loop"
  - id: "Pipelet1"
    type: "pipelet"
    ref: "SetStagingState"
    config:
      StagingState: "ErrorExecutingEditingStagingPipeline"
  - id: "Pipelet18"
    type: "pipelet"
    ref: "CheckProcessModeIsSupported"
  - id: "Pipelet20"
    type: "pipelet"
    ref: "SetStagingState"
    config:
      StagingState: "ErrorCallingLivePipeline"
  - id: "Pipelet24"
    type: "pipelet"
    ref: "SetStagingState"
    config:
      StagingState: "ErrorCreatingLiveStagingProcess"
  - id: "Pipelet25"
    type: "pipelet"
    ref: "CopyStagingProcessToTargetSystem"
  - id: "Pipelet26"
    type: "pipelet"
    ref: "SetStagingState"
    config:
      StagingState: "ErrorAcquiringLiveLocks"
  - id: "Pipelet3"
    type: "pipelet"
    ref: "SetStagingState"
  - id: "Pipelet31"
    type: "pipelet"
    ref: "AcquireLiveResourcesForProcess"
  - id: "Pipelet34"
    type: "pipelet"
    ref: "SetStagingState"
    config:
      StagingState: "ErrorInitializingStagingProcessors"
  - id: "Pipelet35"
    type: "pipelet"
    ref: "SetStagingState"
    config:
      StagingState: "ErrorStagingProcessModeNotSupported"
  - id: "Pipelet4"
    type: "pipelet"
    ref: "SetStagingState"
  - id: "Pipelet7"
    type: "pipelet"
    ref: "SetStagingState"
    config:
      StagingState: "StartPublication"
  - id: "TriggerStagingProcess3"
    type: "pipelet"
    ref: "TriggerStagingProcess"
  - id: "WaitForStagingProcessState4"
    type: "pipelet"
    ref: "WaitForStagingProcessState"
    config:
      PollInterval: 10
      Timeout: 3600
      WaitForStagingState: "StagingProcessCompleted"
      TimeoutPropertyKey: "staging.timeout.waitingForState"

links:
