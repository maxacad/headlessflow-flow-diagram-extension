    type: "call"
    ref: "TriggerStagingProcess-SynchronizeCacheRefresh"
  - id: "CallNode2"
    type: "call"
    ref: "TriggerPublicationProcess-SynchronizeLiveSystems"
  - id: "End4"
    type: "end"
    strict: false
  - id: "End5"
    type: "end"
    strict: false
  - id: "EndNode4"
    type: "end"
    strict: false
  - id: "EndNode6"
    type: "end"
    strict: false
  - id: "EndNode7"
    type: "end"
    strict: false
  - id: "ExecutePipeline1"
    type: "pipelet"
    ref: "ExecutePipeline"
    config:
      Asynchronous: true
      PipelineDomainName: "CurrentDomain"
      PipelineName: "TriggerPublicationProcess"
      PipelineStartNode: "TriggerLive"
  - id: "InitializeStagingProcessors3"
    type: "pipelet"
    ref: "InitializeStagingProcessors"
  - id: "JoinNode1"
    type: "join"
  - id: "JoinNode10"
    type: "join"
  - id: "JoinNode12"
    type: "join"
  - id: "JoinNode18"
    type: "join"
  - id: "JoinNode19"
    type: "join"
  - id: "JoinNode3"
    type: "join"
