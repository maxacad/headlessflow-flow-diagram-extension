    name: "Display"
    mode: "public"
    strict: false
    inputs:
      []
  - id: "Start11"
    name: "CategoryDetails"
    mode: "private"
    strict: false
    inputs:
      []
  - id: "Start3"
    name: "Start"
    mode: "public"
    strict: false
    inputs:
      []

steps:
  - id: "CallNode1"
    type: "call"
    ref: "ViewCategoryProductLinks-ProcessStartPreparer"
  - id: "CallNode2"
    type: "call"
    ref: "ViewCategoryProductLinks-ProcessDisplayPreparer"
  - id: "CallNode3"
    type: "call"
    ref: "ViewCategoryCategoryLinks-ProcessStartPreparer"
  - id: "CallNode4"
    type: "call"
    ref: "ViewCategoryCategoryLinks-ProcessDisplayPreparer"
  - id: "CallNode5"
    type: "call"
    ref: "ViewProductList-GetServiceTypeCategories"
  - id: "CallNode6"
    type: "call"
    ref: "ProcessCategoryLinks-GetServiceTypeMappings"
  - id: "GetCategoryByUUID2"
    type: "pipelet"
    ref: "GetCategoryByUUID"
    bindings:
      CatalogCategoryID: "DetailCategoryUUID"
  - id: "InteractionEnd1"
    type: "interaction"
  - id: "InteractionEnd5"
    type: "interaction"
  - id: "JoinNode1"
    type: "join"
  - id: "PrepareApplicationView1"
    type: "pipelet"
    ref: "PrepareApplicationView"
    config:
      WorkingTemplate: "category/CategoryLinkList"
  - id: "PrepareApplicationView6"
    type: "pipelet"
    ref: "PrepareApplicationView"
    config:
      WorkingTemplate: "category/CategoryLinkCategoryDetailView"

links:
  - from: "PrepareApplicationView1"
    via: "next"
    to: "InteractionEnd1"
    into: "in"
  - from: "GetCategoryByUUID2"
    via: "next"
    to: "PrepareApplicationView6"
    into: "in"
  - from: "PrepareApplicationView6"
    via: "next"
    to: "InteractionEnd5"
    into: "in"
  - from: "JoinNode1"
    via: "next"
    to: "CallNode5"
    into: "in"
  - from: "CallNode6"
    via: "next"
    to: "PrepareApplicationView1"
    into: "in"
  - from: "CallNode3"
    via: "next"
    to: "CallNode1"
    into: "in"
  - from: "Start1"
    via: "next"
    to: "CallNode4"
    into: "in"
  - from: "CallNode2"
    via: "next"
    to: "JoinNode1"
    into: "in3"
  - from: "Start3"
    via: "next"
    to: "CallNode3"
    into: "in"
  - from: "CallNode4"
    via: "next"
    to: "CallNode2"
    into: "in"
  - from: "Start11"
    via: "next"
    to: "GetCategoryByUUID2"
    into: "in"
  - from: "CallNode1"
    via: "next"
    to: "JoinNode1"
    into: "in1"
  - from: "CallNode5"
    via: "next"
    to: "CallNode6"
    into: "in"
