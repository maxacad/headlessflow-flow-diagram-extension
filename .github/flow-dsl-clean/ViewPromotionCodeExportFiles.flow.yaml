flow: "ViewPromotionCodeExportFiles"
kind: "view"

entries:
  - id: "Start1"
    name: "BrowseDirectory"
    mode: "private"
    strict: false
    inputs:
      []
  - id: "Start2"
    name: "Paging"
    mode: "private"
    strict: false
    inputs:
      []
  - id: "Start3"
    name: "Back"
    mode: "private"
    strict: false
    inputs:
      []
  - id: "Start4"
    name: "DownloadFile"
    mode: "private"
    strict: false
    inputs:
      []
  - id: "Start5"
    name: "Dispatch"
    mode: "private"
    strict: false
    inputs:
      []
  - id: "Start6"
    name: "DeleteFiles"
    mode: "private"
    strict: false
    inputs:
      []
  - id: "StartNode1"
    name: "GetFilesOfFirstLevelDirs"
    mode: "private"
    strict: true
    inputs:
      - key: "Directory"
        type: "com.intershop.component.foundation.capi.upload.Directory"
        required: false

steps:
  - id: "AddObjectToVector1"
    type: "pipelet"
    ref: "AddObjectToVector"
    bindings:
      InVector: "null"
      Object: "null"
      Objects: "Directory:Files"
      OutVector: "FoundFiles"
  - id: "AddObjectToVector2"
    type: "pipelet"
    ref: "AddObjectToVector"
    bindings:
      InVector: "FoundFiles"
      Objects: "CurrentDir:Files"
      OutVector: "FoundFiles"
  - id: "BrowseDirectory1"
    type: "pipelet"
    ref: "BrowseDirectory"
    config:
      DefaultDirectoryPath: "export/marketing"
      UnitDirectory: "IMPEX_DIR"
    bindings:
      UnitDomain: "ChannelRepository:Domain"
  - id: "Call1"
    type: "call"
    ref: "ProcessClipboard-Update"
  - id: "Call2"
    type: "call"
    ref: "ProcessClipboard-Get"
  - id: "Call3"
    type: "call"
    ref: "ProcessClipboard-Delete"
  - id: "Call4"
    type: "call"
    ref: "ProcessClipboard-Update"
  - id: "CallNode1"
    type: "call"
    ref: "ViewPromotionCodeExportFiles-GetFilesOfFirstLevelDirs"
  - id: "CreatePageableFromIterator1"
    type: "pipelet"
    ref: "CreatePageableFromIterator"
    config:
      Pagesize: 10
      PageableName: "Files"
    bindings:
      Iterator: "FoundFiles:Iterator"
      Pageable: "Files"
  - id: "Decision1"
    type: "decision"
    condition: "PageLocator"
  - id: "Decision2"
    type: "decision"
    condition: "PageNumber"
  - id: "DeleteFile1"
    type: "pipelet"
    ref: "DeleteFile"
    config:
      DefaultDirectoryPath: "export/marketing/avail"
      UnitDirectory: "IMPEX_DIR"
    bindings:
      UnitDomain: "ChannelRepository:Domain"
  - id: "DeleteFile2"
    type: "pipelet"
    ref: "DeleteFile"
    config:
      DefaultDirectoryPath: "export/marketing/prudsys"
      UnitDirectory: "IMPEX_DIR"
    bindings:
      UnitDomain: "ChannelRepository:Domain"
  - id: "DeleteFile3"
    type: "pipelet"
    ref: "DeleteFile"
    config:
      DefaultDirectoryPath: "export/marketing"
      UnitDirectory: "IMPEX_DIR"
    bindings:
      UnitDomain: "ChannelRepository:Domain"
  - id: "DispatchFormAction1"
    type: "pipelet"
    ref: "DispatchFormAction"
    config:
      OutValue_0: "This:BrowseDirectory"
      OutValue_1: "This:Paging"
      OutValue_2: "This:DeleteFiles"
      OutValue_3: "This:DownloadFile"
      OutValue_4: "This:Back"
      PagingPipeline: "This:Paging"
    bindings:
      Key_0: "BrowseDirectory"
      Key_1: "Paging"
      Key_2: "DeleteFiles"
      Key_3: "DownloadFile"
      Key_4: "ConfirmDeleteFiles"
      SelectionKey: "JumpTarget"
  - id: "EndNode1"
    type: "end"
    strict: true
    outputs:
      - key: "FoundFiles"
        type: "java.util.Vector"
        guaranteed: true
  - id: "GetBinaryFileContent1"
    type: "pipelet"
    ref: "GetBinaryFileContent"
    config:
      UnitDirectory: "IMPEX_DIR"
    bindings:
      DirectoryPath: "\"export/marketing\""
      UnitDomain: "ChannelRepository:Domain"
  - id: "GetPageLocator1"
    type: "pipelet"
    ref: "GetPageLocator"
    config:
      DefaultPageLocatorName: "MarketingExportFilesPageLocator"
      RestorePageLocatorDictionary: "True"
  - id: "GetPageLocator2"
    type: "pipelet"
    ref: "GetPageLocator"
    config:
      DefaultPageLocatorName: "MarketingExportFilesPageLocator"
      RestorePageLocatorDictionary: "True"
  - id: "GetPageable1"
    type: "pipelet"
    ref: "GetPageable"
    bindings:
      Pageable: "Files"
      PageableID: "PageLocator:PageableID"
  - id: "InteractionEnd1"
    type: "interaction"
  - id: "InteractionEnd2"
    type: "interaction"
  - id: "InteractionEnd3"
    type: "interaction"
  - id: "Join1"
    type: "join"
  - id: "Join2"
    type: "join"
  - id: "Join3"
    type: "join"
  - id: "Join4"
    type: "join"
  - id: "Join5"
    type: "join"
  - id: "Join6"
    type: "join"
  - id: "Jump1"
    type: "jump"
    ref: "Error-FileNotFound"
  - id: "Jump2"
    type: "jump"
    ref: "This:BrowseDirectory"
  - id: "Jump3"
    type: "jump"
  - id: "Jump5"
    type: "jump"
    ref: "SecureJump-Start"
  - id: "Jump7"
    type: "jump"
    ref: "This:BrowseDirectory"
  - id: "Loop1"
    type: "loop"
  - id: "LoopNode1"
    type: "loop"
  - id: "PrepareApplicationView1"
    type: "pipelet"
    ref: "PrepareApplicationView"
    config:
      RenderingType: "HTML"
      SelectedMenuItem: "OnlineMarketing"
      WorkingTemplate: "impex/PromotionCodeExportFiles"
  - id: "PrepareApplicationView2"
    type: "pipelet"
    ref: "PrepareApplicationView"
    config:
      RenderingType: "HTML"
      SelectedMenuItem: "OnlineMarketing"
      WorkingTemplate: "impex/PromotionCodeExportFiles"
  - id: "SetPage1"
    type: "pipelet"
    ref: "SetPage"
    bindings:
      PageNumber: "PageLocator:PageNumber"
      Pageable: "Files"
  - id: "SetPage2"
    type: "pipelet"
    ref: "SetPage"
    bindings:
      Pageable: "Files"
  - id: "SetPageLocator1"
    type: "pipelet"
    ref: "SetPageLocator"
    config:
      DefaultHandlerPipeline: "ViewPromotionCodeExportFiles-Paging"
      DefaultPageLocatorName: "MarketingExportFilesPageLocator"
    bindings:
      Pageable: "Files"
  - id: "VerifyInteger1"
    type: "pipelet"
    ref: "VerifyInteger"
    bindings:
      IntegerObject: "PageNumber"
      LocalizedString: "PageNumber"

links:
  - from: "GetPageLocator1"
    via: "next"
    to: "GetPageable1"
    into: "in"
  - from: "Join3"
