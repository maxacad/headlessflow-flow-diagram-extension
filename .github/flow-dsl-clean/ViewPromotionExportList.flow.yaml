      OutValue_0: "ViewPromotionExportList-ListAll"
      OutValue_1: "ViewPromotionExportList-Paging"
      OutValue_2: "ViewPromotionExportList-Delete"
      OutValue_3: "ViewPromotionExportList-Paging"
      PagingPipeline: "ViewPromotionExportList-Paging"
      OutValue_4: "ViewPromotionExport-New"
      OutValue_5: "ViewPromotionExportList-Run"
      OutValue_6: "ViewPromotionExportList-Paging"
    bindings:
      Key_0: "Start"
      Key_1: "Paging"
      Key_2: "Delete"
      Key_3: "ConfirmDelete"
      SelectionKey: "JumpTarget"
      Key_4: "New"
      Key_5: "Run"
      Key_6: "Refresh"
  - id: "EndNode4"
    type: "end"
    strict: false
  - id: "ExecuteJob1"
    type: "pipelet"
    ref: "ExecuteJob"
    bindings:
      JobConfiguration: "JobConfiguration"
  - id: "GetAllJobConfigurations1"
    type: "pipelet"
    ref: "GetAllJobConfigurations"
    config:
      DefaultJobNamePrefix: "Promotion"
      DefaultJobState: "None"
    bindings:
      Domain: "CurrentSelectedChannel:Domain"
      JobConfigurations: "PromotionExports"
  - id: "GetJobConfiguration1"
    type: "pipelet"
    ref: "GetJobConfiguration"
    bindings:
      JobUUID: "ExportUUID"
  - id: "GetJobConfiguration2"
    type: "pipelet"
    ref: "GetJobConfiguration"
    bindings:
      JobUUID: "ExportUUID"
      JobConfiguration: "PromotionExport"
  - id: "GetLocale1"
