    config:
      DefaultHandlerPipeline: "ViewPromotionExportList-Paging"
      DefaultPageLocatorName: "PromotionExportPageLocator"
    bindings:
      Pageable: "PromotionExports"
  - id: "VerifyInteger1"
    type: "pipelet"
    ref: "VerifyInteger"
    bindings:
      IntegerObject: "PageNumber"
      LocalizedString: "PageNumber"

