    type: "loop"
  - id: "PrepareApplicationView2"
    type: "pipelet"
    ref: "PrepareApplicationView"
    config:
      RenderingType: "HTML"
      SelectedMenuItem: "Marketing"
      WorkingTemplate: "marketing/PromotionExportList"
  - id: "RemoveDictionaryValue1"
    type: "pipelet"
    ref: "RemoveDictionaryValue"
    config:
      Key: "SelectedObjectUUIDs"
      RemoveFormValues: true
  - id: "RemoveDictionaryValue2"
    type: "pipelet"
    ref: "RemoveDictionaryValue"
    config:
      Key: "SelectedObjectUUID"
      RemoveFormValues: true
  - id: "RemoveJobConfiguration1"
    type: "pipelet"
    ref: "RemoveJobConfiguration"
    bindings:
      JobConfiguration: "PromotionExport"
  - id: "SetDictionaryValue1"
    type: "pipelet"
    ref: "SetDictionaryValue"
    config:
      Value: "True"
      Name: "noTargetSelected"
  - id: "SetPage1"
    type: "pipelet"
    ref: "SetPage"
    bindings:
      PageNumber: "PageLocator:PageNumber"
      Pageable: "PromotionExports"
  - id: "SetPage2"
    type: "pipelet"
    ref: "SetPage"
    bindings:
