flow: "DBInitProductSetSharing"
kind: "process"

entries:
  - id: "Start4"
    name: "Master"
    mode: "private"
    strict: false
    inputs:
      []
  - id: "StartNode1"
    name: "InitializeProductSetRuleConfiguration"
    mode: "private"
    strict: true
    inputs:
      - key: "ProductSet"
        type: "com.intershop.beehive.xcs.capi.productset.ProductSet"
        required: true
      - key: "Configuration"
        type: "java.util.Map"
        required: true
  - id: "StartNode2"
    name: "CreateCategoryUUIDsIteratorFromConfigValues"
    mode: "private"
    strict: true
    inputs:
      - key: "Configuration"
        type: "java.util.Map"
        required: true
  - id: "StartNode3"
    name: "Start"
    mode: "private"
    strict: true
    inputs:
      - key: "ProductSetConfiguration"
        type: "java.lang.String"
        required: true
  - id: "StartNode4"
    name: "CreateProductSet"
    mode: "private"
    strict: true
    inputs:
      - key: "Configuration"
        type: "java.util.Map"
        required: true
      - key: "LeadLocale"
        type: "com.intershop.beehive.core.capi.localization.LocaleInformation"
        required: true
  - id: "StartNode5"
    name: "AssignTargetDomain"
    mode: "private"
    strict: true
    inputs:
      - key: "Configuration"
        type: "java.util.Map"
        required: true
      - key: "LeadLocale"
        type: "com.intershop.beehive.core.capi.localization.LocaleInformation"
        required: true
      - key: "ProductSet"
        type: "com.intershop.beehive.xcs.capi.productset.ProductSet"
        required: true
  - id: "StartNode7"
    name: "AssignProducts"
    mode: "private"
    strict: true
    inputs:
      - key: "Configuration"
        type: "java.util.Map"
        required: true
      - key: "LeadLocale"
        type: "com.intershop.beehive.core.capi.localization.LocaleInformation"
        required: true
      - key: "ProductSet"
        type: "com.intershop.beehive.xcs.capi.productset.ProductSet"
        required: true

steps:
  - id: "AddObjectToVector1"
    type: "pipelet"
    ref: "AddObjectToVector"
    config:
      Mode: "Forbid Duplicates"
    bindings:
      Object: "Category:UUID"
      InVector: "AssignedCategories"
      OutVector: "AssignedCategories"
  - id: "AddObjectToVector3"
    type: "pipelet"
    ref: "AddObjectToVector"
    bindings:
      Iterator: "Repositories"
      Object: "Repository"
      InVector: "null"
      Objects: "null"
      OutVector: "null"
  - id: "AssignProductSetToDomain2"
    type: "pipelet"
    ref: "AssignProductSetToDomain"
    bindings:
      Domain: "Channel:RepositoryDomain"
  - id: "AssignProductToProductSet1"
    type: "pipelet"
    ref: "AssignProductToProductSet"
  - id: "CallNode1"
    type: "call"
    ref: "ProcessProductSet-UpdateRuleBasedAssignments"
  - id: "CallNode10"
    type: "call"
    ref: "DBInitProductSetSharing-Master"
  - id: "CallNode2"
    type: "call"
    ref: "DBInitProductSetSharing-InitializeProductSetRuleConfiguration"
  - id: "CallNode3"
    type: "call"
    ref: "DBInitProductSetSharing-CreateCategoryUUIDsIteratorFromConfigValues"
  - id: "CallNode5"
    type: "call"
    ref: "This:CreateProductSet"
  - id: "CallNode6"
    type: "call"
    ref: "This:AssignProducts"
  - id: "CallNode7"
    type: "call"
    ref: "This:AssignTargetDomain"
  - id: "CallNode8"
    type: "call"
    ref: "DBInitProductSetSharing-Master"
  - id: "CallNode9"
    type: "call"
    ref: "DBInitProductSetSharing-Master"
  - id: "CreateIteratorFromConfigValues1"
    type: "pipelet"
    ref: "CreateIteratorFromConfigValues"
    config:
      Delimiters: "|"
      CaseSensitiveAndSort: true
    bindings:
      ValuesString: "Configuration:ProductSet.AssignedManufacturers"
      ValuesIterator: "Manufacturers"
  - id: "CreateIteratorFromConfigValues2"
    type: "pipelet"
    ref: "CreateIteratorFromConfigValues"
    config:
      CaseSensitiveAndSort: true
      Delimiters: "|"
    bindings:
      ValuesString: "Configuration:ProductSet.AssignedManufacturerAliases"
      ValuesIterator: "ManufacturerAliases"
  - id: "CreateProductSet1"
    type: "pipelet"
    ref: "CreateProductSet"
    bindings:
      Domain: "Repository:RepositoryDomain"
  - id: "Decision1"
    type: "decision"
    condition: "Organization"
  - id: "DecisionNode1"
    type: "decision"
    condition: "ProductSet:RuleBased"
  - id: "DecisionNode2"
    type: "decision"
    condition: "ProductSet:All"
  - id: "DetermineUnit1"
    type: "pipelet"
    ref: "DetermineUnit"
    bindings:
      UnitName: "Configuration:ProductSet.ProductAssign.SourceFile.DomainName"
      Unit: "UnitDomain"
  - id: "End2"
    type: "end"
    strict: false
  - id: "End4"
    type: "end"
    strict: false
  - id: "EndNode1"
    type: "end"
    strict: true
  - id: "EndNode2"
    type: "end"
    strict: true
    outputs:
      - key: "ProductSet"
        type: "com.intershop.beehive.xcs.capi.productset.ProductSet"
        guaranteed: true
      - key: "OrganizationDomain"
        type: "com.intershop.beehive.core.capi.domain.Domain"
        guaranteed: false
      - key: "Repository"
        type: "com.intershop.component.mvc.capi.catalog.Repository"
        guaranteed: false
  - id: "EndNode3"
    type: "end"
    strict: true
  - id: "EndNode4"
    type: "end"
    strict: true
  - id: "EndNode5"
    type: "end"
    strict: true
    outputs:
      - key: "ProductSet"
        type: "com.intershop.beehive.xcs.capi.productset.ProductSet"
        guaranteed: true
  - id: "EndNode6"
    type: "end"
    strict: true
    outputs:
      - key: "AssignedCategories"
        type: "java.util.Vector"
        guaranteed: false
  - id: "GetCategoryByName1"
    type: "pipelet"
    ref: "GetCategoryByName"
    bindings:
      CategoryDomainName: "CategorySplitter:End(CategoryNameAndCategoryDomainName)"
      CategoryName: "CategorySplitter:Begin(CategoryNameAndCategoryDomainName)"
  - id: "GetFileContent1"
    type: "pipelet"
    ref: "GetFileContent"
    config:
      UnitDirectory: "IMPEX_SRC_DIR"
    bindings:
      FileName: "Configuration:ProductSet.ProductAssign.SourceFile"
  - id: "GetLocale1"
    type: "pipelet"
    ref: "GetLocale"
    config:
      LocaleFallback: "Lead Locale"
    bindings:
      LocaleId: "null"
      Locale: "LeadLocale"
  - id: "GetLocalizedResources1"
    type: "pipelet"
    ref: "GetLocalizedResources"
    bindings:
      Locale: "LeadLocale"
      ResourceBundleName: "ProductSetConfiguration"
      Resources: "Configuration"
  - id: "GetOrganizationByName1"
    type: "pipelet"
    ref: "GetOrganizationByName"
    bindings:
      Name: "OrganizationID"
  - id: "GetProductsBySKUs2"
    type: "pipelet"
    ref: "GetProductsBySKUs"
    bindings:
      Domain: "Repository:RepositoryDomain"
  - id: "GetRepository3"
    type: "pipelet"
    ref: "GetRepository"
    config:
      CustomRepositoryTypeCode: 21
      Type: "Custom Repository"
  - id: "GetRepositoryByID3"
    type: "pipelet"
    ref: "GetRepositoryByID"
    bindings:
      RepositoryID: "Configuration:ProductSet.TargetRepositoryID"
      Domain: "OrganizationDomain"
      Repository: "Channel"
  - id: "GetStringSubstitution1"
    type: "pipelet"
    ref: "GetStringSubstitution"
    config:
      DefaultPattern: "(-Site)$"
    bindings:
      InputString: "CurrentDomain:DomainName"
      OutputString: "OrganizationID"
      Pattern: "null"
      SubstitutionPattern: "null"
  - id: "GetStringSubstitution2"
    type: "pipelet"
    ref: "GetStringSubstitution"
    config:
      DefaultPattern: "^(.+?)<sku\\s*>|</sku\\s*>(.+?)<sku\\s*>|</sku\\s*>(.+?)$"
      DefaultSubstitutionPattern: "</sku>"
    bindings:
      InputString: "OutputString"
  - id: "GetStringSubstitution3"
    type: "pipelet"
    ref: "GetStringSubstitution"
    config:
      DefaultPattern: "^</sku>|</sku>$"
    bindings:
      InputString: "OutputString"
  - id: "GetStringSubstitution4"
    type: "pipelet"
    ref: "GetStringSubstitution"
    config:
      DefaultPattern: "\\n|\\r"
      DefaultSubstitutionPattern: ""
    bindings:
      InputString: "FileContent"
  - id: "JoinNode1"
    type: "join"
  - id: "JoinNode10"
    type: "join"
  - id: "JoinNode11"
    type: "join"
  - id: "JoinNode12"
    type: "join"
  - id: "JoinNode2"
    type: "join"
  - id: "JoinNode3"
    type: "join"
  - id: "JoinNode4"
    type: "join"
  - id: "JoinNode5"
    type: "join"
  - id: "JoinNode6"
    type: "join"
  - id: "JoinNode7"
    type: "join"
  - id: "JoinNode8"
    type: "join"
  - id: "JoinNode9"
    type: "join"
  - id: "LoopNode1"
    type: "loop"
  - id: "LoopNode2"
    type: "loop"
  - id: "Pipelet1"
    type: "pipelet"
    ref: "LogMessage"
    config:
      Level: "Debug"
      Marker: "dbinit"
    bindings:
      MessageParam0: "CategorySplitter:Begin(CategoryNameAndCategoryDomainName)"
      MessageParam1: "CategorySplitter:End(CategoryNameAndCategoryDomainName)"
      MessageText: "\"A Category with NAME {} and DOMAINNAME {} does not seem to exist.\""
  - id: "Pipelet3"
    type: "pipelet"
    ref: "CreateStringSplitter"
    config:
      Mode: "Last Occurrence"
      Separator: "@"
    bindings:
      Splitter: "CategorySplitter"
  - id: "Pipelet5"
    type: "pipelet"
    ref: "CreateIteratorFromConfigValues"
    config:
      CaseSensitiveAndSort: true
      Delimiters: "|"
    bindings:
      ValuesString: "Configuration:ProductSet.AssignedCategories"
      ValuesIterator: "CategoryNames"
  - id: "SplitString1"
    type: "pipelet"
    ref: "SplitString"
    bindings:
      ValuesString: "OutputString"
      ValuesIterator: "SKUs"
      Delimeter: "\"</sku>\""
  - id: "UpdateCustomAttributes1"
    type: "pipelet"
    ref: "UpdateCustomAttributes"
    config:
      Attribute_1_Name: "AssignedManufacturers"
      Attribute_1_Type: "MultipleString"
      Attribute_2_Name: "AssignedManufacturerAliases"
      Attribute_2_Type: "MultipleString"
      Attribute_3_Name: "IncludeSubCategories"
      Attribute_3_Type: "String"
      Attribute_4_Name: "AssignedCategories"
      Attribute_4_Type: "MultipleString"
    bindings:
      ExtensibleObject: "ProductSet"
      Attribute_1_Value: "Manufacturers"
      Attribute_2_Value: "ManufacturerAliases"
      Attribute_3_Value: "Configuration:ProductSet.IncludeSubCategories"
      Attribute_4_Value: "AssignedCategories"
  - id: "UpdateProductSet2"
    type: "pipelet"
    ref: "UpdateProductSet"
    bindings:
      Name: "Configuration:ProductSet.Name"
      Description: "Configuration:ProductSet.Description"
      IsActive: "Configuration:ProductSet.IsActive"
      ProductSelectionType: "Configuration:ProductSet.ProductSelectionType"
      IsAll: "Configuration:ProductSet.IsAll"

