    into: "in"
  - from: "GetFormSelection6"
    via: "next"
    to: "GetFormSelection5"
    into: "in"
  - from: "CallNode2"
    via: "next"
    to: "DecisionNode2"
    into: "in"
  - from: "GetFormSelection5"
    via: "next"
    to: "UpdateClipboard5"
