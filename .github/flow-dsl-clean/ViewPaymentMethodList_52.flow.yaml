    via: "next"
    to: "JoinNode1"
    into: "in1"
  - from: "StartNode1"
    via: "next"
    to: "CallNode1"
    into: "in"
  - from: "DecisionNode2"
    via: "yes"
    to: "MovePaymentConfigurationPositions2"
    into: "in"
  - from: "DecisionNode1"
    via: "yes"
