flow: "SendAbandonedBasketMessagesJob"
kind: "job"

entries:
  - id: "Start12"
    name: "Start"
    mode: "private"
    strict: true
    inputs:
      []

steps:
  - id: "Call10"
    type: "call"
    ref: "GetRepositories-ChannelsReverse"
  - id: "CallNode1"
    type: "call"
    ref: "ProcessAbandonedBaskets-Check"
    bindings:
      CurrentChannel: "Channel"
      Organization: "ConsumerOrganization"
  - id: "CreateStack2"
    type: "pipelet"
    ref: "CreateStack"
    bindings:
      Stack: "OrganizationStack"
  - id: "CreateStack3"
    type: "pipelet"
    ref: "CreateStack"
    bindings:
      Stack: "ChannelStack"
  - id: "EndNode1"
    type: "end"
    strict: true
  - id: "GetOrganizationByName1"
    type: "pipelet"
    ref: "GetOrganizationByName"
    config:
      DefaultName: "Operations"
    bindings:
      Name: "null"
      Organization: "Operations"
      OrganizationDomain: "OperationsDomain"
  - id: "GetOrganizations2"
    type: "pipelet"
    ref: "GetOrganizations"
    bindings:
      Owner: "Channel:RepositoryDomain"
      OrganizationType: "null"
      Organizations: "ConsumerOrganizations"
  - id: "GetOrganizations4"
    type: "pipelet"
    ref: "GetOrganizations"
    bindings:
      Organizations: "Enterprises"
      Owner: "OperationsDomain"
  - id: "Join4"
    type: "join"
  - id: "JoinNode1"
    type: "join"
  - id: "Loop3"
    type: "loop"
  - id: "ManipulateStack2"
    type: "pipelet"
    ref: "ManipulateStack"
    config:
      ProcessMethod: "PUSH"
    bindings:
      AddElement: "Enterprise"
      Stack: "OrganizationStack"
  - id: "ManipulateStack5"
    type: "pipelet"
    ref: "ManipulateStack"
    config:
      ProcessMethod: "POP"
    bindings:
      GetElement: "Channel"
      Stack: "ChannelStack"
  - id: "Pipelet1"
    type: "pipelet"
    ref: "GetFirstElementOfIterator"
    bindings:
      Iterator: "ConsumerOrganizations"
      FirstElement: "ConsumerOrganization"

links:
  - from: "ManipulateStack5"
    via: "next"
    to: "GetOrganizations2"
    into: "in"
  - from: "Loop3"
    via: "do"
    to: "ManipulateStack2"
    into: "in"
  - from: "Pipelet1"
    via: "next"
    to: "CallNode1"
    into: "in"
  - from: "ManipulateStack2"
    via: "next"
    to: "Loop3"
    into: "loop"
  - from: "Pipelet1"
    via: "error"
    to: "JoinNode1"
    into: "in3"
  - from: "Start12"
    via: "next"
    to: "GetOrganizationByName1"
    into: "in"
  - from: "CallNode1"
    via: "next"
    to: "JoinNode1"
    into: "in1"
  - from: "GetOrganizationByName1"
    via: "next"
    to: "GetOrganizations4"
    into: "in"
  - from: "JoinNode1"
    via: "next"
    to: "Join4"
    into: "in2"
  - from: "Call10"
    via: "next"
    to: "Join4"
    into: "in1"
  - from: "GetOrganizations4"
    via: "next"
    to: "CreateStack2"
    into: "in"
  - from: "CreateStack3"
    via: "next"
    to: "Loop3"
    into: "in"
  - from: "ManipulateStack5"
    via: "error"
    to: "EndNode1"
    into: "in"
  - from: "Loop3"
    via: "next"
    to: "Call10"
    into: "in"
  - from: "CreateStack2"
    via: "next"
    to: "CreateStack3"
    into: "in"
  - from: "Join4"
    via: "next"
    to: "ManipulateStack5"
    into: "in"
  - from: "GetOrganizations2"
    via: "next"
    to: "Pipelet1"
    into: "in"
