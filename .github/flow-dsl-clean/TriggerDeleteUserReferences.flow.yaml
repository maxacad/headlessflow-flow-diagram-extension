flow: "TriggerDeleteUserReferences"
kind: "process"

entries:
  - id: "Start1"
    name: "Start"
    mode: "private"
    strict: false
    inputs:
      []

steps:
  - id: "CleanUpDeletionPOs1"
    type: "pipelet"
    ref: "CleanUpDeletionPOs"
    config:
      CartridgeName: "core"
      ColumnName: "userid"
      DeletionTrackingTableName: "DeletedUser"
      PDKeyOfIdentifiers: "DeletedUsers"
  - id: "Decision1"
    type: "decision"
    condition: "DeletedUsers"
  - id: "DetermineDeletedUsers1"
    type: "pipelet"
    ref: "DetermineDeletedUsers"
  - id: "End1"
    type: "end"
  - id: "End2"
    type: "end"
  - id: "ExecuteCartridgePipelines1"
    type: "pipelet"
    ref: "ExecuteCartridgePipelines"
    config:
      Asynchronous: false
      PipelinePropertyName: "UserDeletionPipeline"
      ProcessReversely: true
  - id: "Join1"
    type: "join"
  - id: "Join2"
    type: "join"
  - id: "RefreshCache1"
    type: "pipelet"
    ref: "RefreshCache"

links:
  - from: "Start1"
    via: "next"
    to: "DetermineDeletedUsers1"
    into: "in"
  - from: "DetermineDeletedUsers1"
    via: "next"
    to: "Decision1"
    into: "in"
  - from: "Decision1"
    via: "yes"
    to: "ExecuteCartridgePipelines1"
    into: "in"
  - from: "DetermineDeletedUsers1"
    via: "error"
    to: "Join2"
    into: "in1"
  - from: "ExecuteCartridgePipelines1"
    via: "error"
    to: "Join2"
    into: "in2"
  - from: "Join2"
    via: "next"
    to: "End2"
    into: "in"
  - from: "Join1"
    via: "next"
    to: "CleanUpDeletionPOs1"
    into: "in"
  - from: "Decision1"
    via: "no"
    to: "Join1"
    into: "in3"
  - from: "CleanUpDeletionPOs1"
    via: "next"
    to: "End1"
    into: "in"
  - from: "ExecuteCartridgePipelines1"
    via: "next"
    to: "RefreshCache1"
    into: "in"
  - from: "RefreshCache1"
    via: "next"
    to: "Join1"
    into: "in1"
