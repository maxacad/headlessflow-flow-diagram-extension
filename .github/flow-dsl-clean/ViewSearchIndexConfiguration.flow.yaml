flow: "ViewSearchIndexConfiguration"
kind: "view"

entries:
  - id: "StartNode1"
    name: "Start"
    mode: "private"
    strict: false
    inputs:
      []
  - id: "StartNode2"
    name: "Update"
    mode: "private"
    strict: false
    inputs:
      []
  - id: "StartNode3"
    name: "UpdatePreferences"
    mode: "private"
    strict: false
    inputs:
      []
  - id: "StartNode4"
    name: "GetPreferenceNames"
    mode: "private"
    strict: false
    inputs:
      []
  - id: "StartNode5"
    name: "UpdateCommonPreferences"
    mode: "private"
    strict: false
    inputs:
      []

steps:
  - id: "AddEntryToMap2"
    type: "pipelet"
    ref: "AddEntryToMap"
    bindings:
      InMap: "EnabledFeaturesMap"
      Key: "SearchIndexFeature:FeatureID"
      Value: "SearchIndexFeature"
      Keys: "EnabledFeaturesMapKeys"
      OutMap: "EnabledFeaturesMap"
  - id: "AddObjectToVector1"
    type: "pipelet"
    ref: "AddObjectToVector"
    bindings:
      InVector: "PreferenceNamesVector"
      OutVector: "PreferenceNamesVector"
      Iterator: "PreferenceNames"
      Object: "null"
      Objects: "null"
  - id: "AddObjectToVector2"
    type: "pipelet"
    ref: "AddObjectToVector"
    bindings:
      InVector: "PreferenceNamesVector"
      OutVector: "PreferenceNamesVector"
      Iterator: "PreferenceNames"
      Object: "PreferenceName"
      Objects: "null"
  - id: "AddObjectToVector3"
    type: "pipelet"
    ref: "AddObjectToVector"
    config:
      Mode: "Forbid Duplicates"
    bindings:
      InVector: "SearchIndexPreferences"
      OutVector: "SearchIndexPreferences"
      Iterator: "SearchIndexPreferencesIterator"
      Object: "Preference"
  - id: "AssignSearchIndexFeature1"
    type: "pipelet"
    ref: "AssignSearchIndexFeature"
    bindings:
      SearchIndexFeature: "EnabledFeaturesMap:get(EnabledFeatureMapKey)"
      AssignedDomain: "CurrentChannel:RepositoryDomain:Site"
  - id: "AssignSearchIndexFeature2"
    type: "pipelet"
    ref: "AssignSearchIndexFeature"
    bindings:
      SearchIndexFeature: "EnabledFeaturesMap:get(EnabledFeatureMapKey)"
      AssignedDomain: "CurrentDomain:Site"
  - id: "CallNode1"
    type: "call"
    ref: "ProcessSearchIndexConfiguration-Start"
  - id: "CallNode13"
    type: "call"
    ref: "ProcessSearchIndexFeature-GetSearchIndexFeature"
    bindings:
      FeatureID: "EnabledFeatureID"
      Domain: "CurrentChannel:RepositoryDomain"
  - id: "CallNode2"
    type: "call"
    ref: "ProcessSearchIndexConfiguration-UpdatePreferences"
  - id: "CallNode4"
    type: "call"
    ref: "ProcessSearchIndexFeature-GetSearchIndexFeature"
    bindings:
      FeatureID: "EnabledFeatureID"
  - id: "CallNode7"
    type: "call"
    ref: "ViewSearchIndexConfiguration-UnassignSearchIndexFeatures"
    bindings:
      AssignedDomain: "CurrentChannel:RepositoryDomain:Site"
      SelectedFeatures: "EnabledFeaturesIterator"
  - id: "CreateStringSplitter1"
    type: "pipelet"
    ref: "CreateStringSplitter"
    config:
      Mode: "First Occurrence"
      Separator: "."
    bindings:
      Splitter: "SplitAtDot"
  - id: "DecisionNode3"
    type: "decision"
    condition: "PreferenceName"
  - id: "DecisionNode4"
    type: "decision"
    condition: "PreferenceName"
  - id: "DecisionNode5"
    type: "decision"
    condition: "EnabledFeaturesMap:get(SearchIndexFeature:FeatureID)"
  - id: "DecisionNode6"
    type: "decision"
    condition: "ERROR_DUPLICATE_TYPE"
  - id: "DecisionNode7"
    type: "decision"
    condition: "null"
  - id: "DecisionNode8"
    type: "decision"
    condition: "EnabledSearchEngines:get(SearchEnginePreference)"
  - id: "DecisionNode9"
    type: "decision"
    condition: "SearchEnginePreference"
  - id: "EndNode1"
    type: "end"
    strict: false
  - id: "EndNode2"
    type: "end"
    strict: false
  - id: "GetDomainPreference2"
    type: "pipelet"
    ref: "GetDomainPreference"
    config:
      Type: "String"
    bindings:
      PreferenceDomain: "CurrentChannel:RepositoryDomain:Site"
      PreferenceKey: "CurrentPreference"
  - id: "GetDomainPreferenceNamesByPreferenceGroup3"
    type: "pipelet"
    ref: "GetDomainPreferenceNamesByPreferenceGroup"
    bindings:
      PreferenceDomain: "CurrentChannel:RepositoryDomain:Site"
      PreferenceGroup: "\"SearchIndexPreferences\""
  - id: "GetFormSelection1"
    type: "pipelet"
    ref: "GetFormSelection"
    config:
      DefaultParameterName: "EnabledFeatures"
    bindings:
      Selection: "EnabledFeaturesIterator"
      ParameterName: "null"
  - id: "InteractionEnd3"
    type: "interaction"
  - id: "JoinNode1"
    type: "join"
  - id: "JoinNode2"
    type: "join"
  - id: "JoinNode3"
    type: "join"
  - id: "JoinNode6"
    type: "join"
  - id: "JoinNode7"
    type: "join"
  - id: "JoinNode8"
    type: "join"
  - id: "JoinNode9"
    type: "join"
  - id: "JumpNode1"
    type: "jump"
    ref: "This:Start"
  - id: "JumpNode2"
    type: "jump"
    ref: "This:Start"
  - id: "JumpNode3"
    type: "jump"
    ref: "This:Start"
  - id: "JumpNode4"
    type: "jump"
    ref: "This:Start"
  - id: "KeyMapper2"
    type: "pipelet"
    ref: "KeyMapper"
    bindings:
      InValue_1: "CurrentChannel:RepositoryDomain:Site"
      OutValue_1: "PreferenceDomain"
  - id: "KeyMapper3"
    type: "pipelet"
    ref: "KeyMapper"
    bindings:
      InValue_1: "CurrentChannel:RepositoryDomain:Site"
      OutValue_1: "PreferenceDomain"
  - id: "KeyMapper4"
    type: "pipelet"
    ref: "KeyMapper"
    bindings:
      InValue_1: "SplitAtDot:Begin(PreferenceName)"
      OutValue_1: "SearchEnginePreference"
  - id: "KeyMapper5"
    type: "pipelet"
    ref: "KeyMapper"
    bindings:
      InValue_1: "CurrentChannel:RepositoryDomain"
      OutValue_1: "RepositoryDomain"
  - id: "LoopNode1"
    type: "loop"
  - id: "LoopNode10"
    type: "loop"
  - id: "LoopNode2"
    type: "loop"
  - id: "LoopNode3"
    type: "loop"
  - id: "LoopNode4"
    type: "loop"
  - id: "PrepareApplicationView4"
    type: "pipelet"
    ref: "PrepareApplicationView"
    config:
      SelectedMenuItem: "Service Configuration"
      WorkingTemplate: "searchindex/SearchIndexConfiguration"
  - id: "SetDictionaryValue1"
    type: "pipelet"
    ref: "SetDictionaryValue"
    config:
      Name: "ERROR_DUPLICATE_TYPE"
      Value: "ERROR_DUPLICATE_TYPE"
      ValueType: "Dictionary Value"
  - id: "SetDictionaryValue2"
    type: "pipelet"
    ref: "SetDictionaryValue"
    config:
      Name: "FactFinderEnabled"
      Value: true
      ValueType: "Dictionary Value"
  - id: "SetDictionaryValue3"
    type: "pipelet"
    ref: "SetDictionaryValue"
    config:
      Name: "OtherSearchEngineEnabled"
      Value: true
      ValueType: "Dictionary Value"
  - id: "SetDomainPreference6"
    type: "pipelet"
    ref: "SetDomainPreference"
    config:
      Type: "Integer"
      DefaultPreferenceKey: "BrowseBySearchCategoryLevel"
      DefaultPreferenceValue: 1
    bindings:
      PreferenceDomain: "CurrentChannel:RepositoryDomain:Site"
      PreferenceDoubleValue: "null"
      PreferenceKey: "null"
      PreferenceValue: "BrowseBySearchCategoryLevel"
      PreferenceIntValue: "null"
      PreferenceStringValue: "null"
  - id: "SortIteratorByComparator2"
    type: "pipelet"
    ref: "SortIteratorByComparator"
    config:
      DefaultSortingOrder: true
      ComparatorClassName: "com.intershop.beehive.core.capi.preference.PreferenceDefinitionComparator"
    bindings:
      SortedIterator: "SearchIndexPreferenceNames"
      Iterator: "PreferenceNames"
      SortingAttribute: "null"
      SortingOrder: "null"
  - id: "UpdateMapping3"
    type: "pipelet"
    ref: "UpdateMapping"
    config:
      Mode: "Add"
    bindings:
      InMap: "EnabledSearchEngines"
      Key: "SearchIndexFeature:SearchEngineID"
      Value: "SearchIndexFeature:SearchEngineID"
      Keys: "null"
      Values: "null"
      OutMap: "EnabledSearchEngines"

