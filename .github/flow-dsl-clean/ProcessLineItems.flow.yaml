    ref: "ExecuteObjectsQuery"
    config:
      QueryName: "requisition/GetLineItemChilds"
      Datasource: "current ORM connection"
      ParameterName_01: "LineItemUUID"
    bindings:
      SearchResult: "LineItemChilds"
      ParameterValue_01: "LineItem:UUID"
  - id: "GetBasketByID1"
    type: "pipelet"
    ref: "GetBasketByID"
