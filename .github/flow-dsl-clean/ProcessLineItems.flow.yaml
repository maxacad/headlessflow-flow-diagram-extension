      LineItemID: "LineItemSellerOrder:UUID"
      LineItemIDs: "NULL"
      Order: "NULL"
      Requisition: "NULL"
  - id: "UpdateLineItemStatus4"
    type: "pipelet"
    ref: "UpdateLineItemStatus"
    config:
      StatusGroup: "Delivery"
      StatusID: 7
    bindings:
      InputStatusGroup: "NULL"
      InputStatusID: "NULL"
      LineItemID: "NULL"
      LineItemIDs: "NULL"
      Order: "NULL"
  - id: "UpdateOrderStatus1"
    type: "pipelet"
    ref: "UpdateOrderStatus"
    config:
      StateGroup: "OrderStatus"
      StateName: "CANCELLED"
    bindings:
