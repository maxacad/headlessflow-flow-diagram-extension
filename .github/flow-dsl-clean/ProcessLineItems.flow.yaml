    name: "RecalculateRequisition"
    mode: "private"
    strict: false
    inputs:
      []
  - id: "Start2"
    name: "DetermineLineItemChilds"
    mode: "private"
    strict: false
    inputs:
      []
  - id: "Start4"
    name: "CancelLineItem"
    mode: "private"
    strict: false
    inputs:
      []
  - id: "Start5"
    name: "UpdateStatus"
    mode: "private"
    strict: false
    inputs:
      []
  - id: "Start6"
    name: "Calculate"
    mode: "private"
    strict: false
    inputs:
      []
  - id: "Start7"
    name: "RecalculateOrderStatus"
    mode: "private"
    strict: false
    inputs:
      []
