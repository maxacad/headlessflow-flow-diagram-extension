      Value: true
      ValueType: "Dictionary Value"
  - id: "SetupCalculationTarget1"
    type: "pipelet"
    ref: "SetupCalculationTarget"
    config:
      Name: "Requisition"
  - id: "UpdateLineItemStatus1"
    type: "pipelet"
    ref: "UpdateLineItemStatus"
    config:
      StatusGroup: "Requisition"
      StatusID: 7
    bindings:
      InputStatusGroup: "NotAvailable"
      InputStatusID: "NotAvailable"
