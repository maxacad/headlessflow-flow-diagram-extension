      StatusID: 22
      StatusType: "Status"
    bindings:
      InputStatusGroup: "NULL"
      InputStatusID: "NULL"
      LineItemID: "LineItemSupplierOrder:UUID"
      LineItemIDs: "NULL"
      Order: "NULL"
