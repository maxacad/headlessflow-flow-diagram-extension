    condition: "PageletConfigurationParameters:searchQueryDefinitionID"
  - id: "EndNode1"
    type: "end"
    strict: false
  - id: "GetCatalogBOByCatalogCategoryBO1"
    type: "pipelet"
    ref: "GetCatalogBOByCatalogCategoryBO"
    bindings:
      CatalogCategoryBO: "CategoryBO"
      OwningDomain: "CurrentOrganization:OwningDomain"
