      CurrentCategory: "Category"
  - id: "CallNode2"
    type: "call"
    ref: "DetermineMetaTags-CategoryMetaTags"
  - id: "CallNode3"
    type: "call"
    ref: "ProcessSearchEngineAttributes-CreateRobotsIndexFollowMetaTag"
  - id: "CallNode4"
    type: "call"
    ref: "This:GetCategoryProducts"
  - id: "CallNode5"
    type: "call"
    ref: "ProcessStandardCatalog-ProcessProductsPageable"
  - id: "DecisionNode0"
    type: "decision"
    condition: "PageableID"
  - id: "DecisionNode1"
    type: "decision"
    condition: "Action"
  - id: "DecisionNode2"
    type: "decision"
