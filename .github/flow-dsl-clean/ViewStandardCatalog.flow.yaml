      OutValue_1: "SearchQueryDefinitionID"
  - id: "KeyMapper6"
    type: "pipelet"
    ref: "KeyMapper"
    bindings:
      InValue_1: "\"fallback_searchquerydefinition\""
      OutValue_1: "SearchQueryDefinitionID"
  - id: "KeyMapper7"
    type: "pipelet"
    ref: "KeyMapper"
    bindings:
      InValue_1: "PageletConfigurationParameters:hasParametricNavigation"
      OutValue_1: "hasParametricNavigation"
  - id: "LogMessage1"
    type: "pipelet"
    ref: "LogMessage"
    config:
      Level: "Warn"
    bindings:
      MessageText: "\"ProcessStandardCatalog-ProcessProductsPageable: ERROR return, pageableId '{}'\""
      MessageParam1: "null"
      MessageParam2: "null"
      MessageParam3: "null"
      MessageParam4: "null"
      MessageParam0: "PageableID"
  - id: "SetDictionaryValue1"
    type: "pipelet"
    ref: "SetDictionaryValue"
    config:
      Name: "Action"
      Value: "ProductPaging"

