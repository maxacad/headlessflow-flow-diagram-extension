    type: "jump"
    ref: "This:Error"
  - id: "JumpNode3"
    type: "jump"
    ref: "This:RedirectToProductDetail"
  - id: "KeyMapper1"
    type: "pipelet"
    ref: "KeyMapper"
    config:
      ValueType: "Dictionary Value"
    bindings:
      InValue_1: "\"ViewProduct-Start\""
      InValue_2: "\"SKU\""
      InValue_3: "ProductBO:SKU"
      OutValue_1: "TargetPipeline"
      OutValue_2: "Parameter1_Name"
      OutValue_3: "Parameter1_Value"
  - id: "KeyMapper3"
    type: "pipelet"
    ref: "KeyMapper"
    bindings:
      InValue_1: "PageletConfigurationParameters:searchQueryDefinitionID"
      OutValue_1: "SearchQueryDefinitionID"
  - id: "KeyMapper4"
    type: "pipelet"
    ref: "KeyMapper"
    bindings:
