flow: "ViewStandardCatalog"
kind: "view"

entries:
  - id: "Start2"
    name: "Browse"
    mode: "private"
    strict: false
    inputs:
      - key: "CatalogCategoryID"
        type: "java.lang.String"
        required: false
      - key: "CatalogName"
        type: "java.lang.String"
        required: false
  - id: "Start6"
    name: "Error"
    mode: "private"
    strict: false
    inputs:
      []
  - id: "Start7"
    name: "ProductPaging"
    mode: "private"
    strict: false
    inputs:
      []
  - id: "Start8"
    name: "Refresh"
    mode: "private"
    strict: false
    inputs:
      []
  - id: "StartNode1"
    name: "GetCategoryProducts"
    mode: "private"
    strict: false
    inputs:
      []
  - id: "StartNode2"
    name: "RedirectToProductDetail"
    mode: "private"
    strict: false
    inputs:
      []

