      Value: "ViewWishlistPreferences_52-View"
  - id: "UpdateWebForm1"
    type: "pipelet"
    ref: "UpdateWebForm"
    config:
      mode: "update"
      webform-id: "WishlistWebForm"
    bindings:
      WebForm: "WishlistWebForm"
  - id: "UpdateWebForm2"
    type: "pipelet"
    ref: "UpdateWebForm"
    config:
      mode: "update"
      webform-id: "WishlistWebForm"
    bindings:
      WebForm: "WishlistWebForm"
  - id: "ValidateWebForm2"
    type: "pipelet"
    ref: "ValidateWebForm"
    bindings:
