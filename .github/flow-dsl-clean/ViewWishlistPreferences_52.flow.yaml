steps:
  - id: "CreateWebForm1"
    type: "pipelet"
    ref: "CreateWebForm"
    config:
      param.1.name: "EmailSubject"
      param.1.required: true
      param.2.name: "EmailTemplate"
      param.2.required: true
      param.3.required: false
      webform-id: "WishlistWebForm"
      param.1.rule: ""
      param.2.rule: ""
    bindings:
      WebForm: "WishlistWebForm"
  - id: "DispatchFormAction1"
    type: "pipelet"
    ref: "DispatchFormAction"
    config:
      OutValue_1: "ViewWishlistPreferences_52-Update"
      OutValue_3: "ViewDomainPreference_52-Start"
    bindings:
      Key_1: "updateSettings"
      Key_3: "backToPrefs"
      SelectionKey: "JumpTarget"
  - id: "GetDomainPreference2"
    type: "pipelet"
    ref: "GetDomainPreference"
    config:
      DefaultPreferenceKey: "WishlistEmailSubject"
      Type: "String"
    bindings:
      PreferenceDomain: "ChannelRepository:Domain"
      PreferenceStringValue: "WishlistEmailSubject"
  - id: "GetDomainPreference3"
    type: "pipelet"
    ref: "GetDomainPreference"
    config:
      DefaultPreferenceKey: "WishlistEmailTemplate"
      Type: "String"
    bindings:
      PreferenceDomain: "ChannelRepository:Domain"
      PreferenceStringValue: "WishlistEmailTemplate"
  - id: "GetWebForm2"
    type: "pipelet"
    ref: "GetWebForm"
