flow: "ViewWishlistPreferences_52"
kind: "view"

entries:
  - id: "Start1"
    name: "Dispatch"
    mode: "private"
    strict: false
    inputs:
      []
  - id: "Start2"
    name: "View"
    mode: "private"
    strict: false
    inputs:
      []
  - id: "Start6"
    name: "Update"
    mode: "private"
    strict: false
