      DefaultPageLocatorName: "PageletImportFilesPageLocator"
      RestorePageLocatorDictionary: "True"
  - id: "Pipelet4"
    type: "pipelet"
    ref: "CopyFile"
    config:
      DefaultSourceDirectoryPath: "upload"
      DefaultSourceUnitDirectory: "IMPEX_DIR"
      DefaultTargetDirectoryPath: "content"
      DefaultTargetUnitDirectory: "IMPEX_SRC_DIR"
    bindings:
      SourceFileName: "FileName"
      SourceUnitDomain: "ChannelRepository:Domain"
      TargetFileName: "FileName"
      TargetUnitDomain: "ChannelRepository:Domain"
  - id: "Pipelet5"
    type: "pipelet"
    ref: "SetPage"
    bindings:
      PageNumber: "PageLocator:PageNumber"
      Pageable: "Files"
  - id: "Pipelet6"
    type: "pipelet"
    ref: "DeleteFile"
    config:
      DefaultDirectoryPath: "upload"
      UnitDirectory: "IMPEX_DIR"
    bindings:
      FileName: "FileName"
      UnitDomain: "ChannelRepository:Domain"
  - id: "Pipelet7"
