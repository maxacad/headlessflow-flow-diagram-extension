    ref: "ProcessMultipartRequest"
    config:
      DirectoryPath: "upload"
      MaxFileSize: 100
      UnitDirectory: "IMPEX_DIR"
    bindings:
      Files: "UploadedFiles"
      UnitDomain: "ChannelRepository:Domain"
  - id: "Pipelet10"
    type: "pipelet"
    ref: "GetPageLocator"
    config:
      DefaultPageLocatorName: "PageletImportFilesPageLocator"
      RestorePageLocatorDictionary: "True"
  - id: "Pipelet11"
    type: "pipelet"
    ref: "VerifyInteger"
    bindings:
      IntegerObject: "PageNumber"
      LocalizedString: "PageNumber"
  - id: "Pipelet13"
    type: "pipelet"
    ref: "GetFirstElementOfIterator"
    bindings:
      FirstElement: "File"
      Iterator: "UploadedFiles"
  - id: "Pipelet15"
    type: "pipelet"
    ref: "DispatchFormAction"
    config:
      OutValue_0: "ViewChannelPageletImportFiles-BrowseDirectory"
      OutValue_1: "ViewChannelPageletImportFiles-Paging"
      OutValue_2: "ViewChannelPageletImportFiles-DeleteFiles"
      OutValue_4: "ViewChannelPageletImportFiles-Back"
      PagingPipeline: "ViewChannelPageletImportFiles-Paging"
      OutValue_3: "ViewChannelPageletImportFiles-CopyFile"
    bindings:
      Key_0: "BrowseDirectory"
      Key_1: "Paging"
      Key_2: "DeleteFiles"
      Key_4: "ConfirmDeleteFiles"
      SelectionKey: "JumpTarget"
      Key_3: "CopyFile"
