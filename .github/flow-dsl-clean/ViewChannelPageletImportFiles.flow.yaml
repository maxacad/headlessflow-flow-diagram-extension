      Locale: "null"
      Files: "ExistingFiles"
      SourceDirectoryPath: "null"
      SourceUnitDirectory: "null"
      SourceUnitDomain: "ChannelRepository:Domain"
      TargetUnitDomain: "ChannelRepository:Domain"
