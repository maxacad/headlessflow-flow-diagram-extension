      WorkingTemplate: "content/ChannelPageletImportSourceFiles"
  - id: "Pipelet8"
    type: "pipelet"
    ref: "DeleteFile"
    config:
      DefaultDirectoryPath: "src/content"
      UnitDirectory: "IMPEX_DIR"
    bindings:
      UnitDomain: "ChannelRepository:Domain"
  - id: "Pipelet9"
    type: "pipelet"
    ref: "CreatePageableFromIterator"
    config:
      PageableName: "Files"
      Pagesize: 10
    bindings:
      Iterator: "Directory:Files"
      Pageable: "Files"
  - id: "ReleaseFileResource1"
    type: "pipelet"
    ref: "ReleaseFileResource"
    bindings:
      CurrentProcess: "LockProcess"
  - id: "SetDictionaryValue3"
    type: "pipelet"
    ref: "SetDictionaryValue"
    config:
      Name: "ErrorCode"
      Value: "FileUploadError"

