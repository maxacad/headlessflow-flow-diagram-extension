  - from: "ValidateWebForm1"
    via: "next"
    to: "CallNode3"
    into: "in"
  - from: "Pipelet1"
    via: "error"
    to: "SetDictionaryValue7"
    into: "in"
  - from: "ValidateWebForm2"
    via: "next"
    to: "JoinNode3"
    into: "in3"
  - from: "KeyMapper2"
    via: "next"
