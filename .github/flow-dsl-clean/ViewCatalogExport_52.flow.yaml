flow: "ViewCatalogExport_52"
kind: "view"

entries:
  - id: "Start2"
    name: "SelectCatalog"
    mode: "private"
    strict: false
    inputs:
      []
  - id: "Start3"
    name: "Export"
    mode: "private"
    strict: false
    inputs:
      []
  - id: "StartNode1"
    name: "Dispatch"
    mode: "private"
    strict: false
    inputs:
      []
  - id: "StartNode2"
    name: "SelectClassificationCatalog"
    mode: "private"
    strict: false
    inputs:
      []
  - id: "StartNode3"
    name: "OverwriteFile"
    mode: "private"
    strict: false
    inputs:
      []
  - id: "StartNode4"
    name: "CancelOverwriteFile"
    mode: "private"
    strict: false
    inputs:
      []

steps:
  - id: "Call2"
    type: "call"
    ref: "ProcessImpexJob-Create"
  - id: "CallNode3"
    type: "call"
    ref: "ProcessImpexJob-IsFilenameTaken"
    bindings:
      Domain: "ChannelRepository:Domain"
      Filename: "CategoryExportForm:ExportFile:Value"
  - id: "CombineIterators3"
    type: "pipelet"
    ref: "CombineIterators"
    config:
      ProcessMethod: "Concatenate Iterators"
    bindings:
      Iterator: "Catalogs"
      Iterator1: "LocalStandardCatalogs"
      Iterator2: "GeneralPagesCatalogs"
  - id: "CreateWebForm1"
    type: "pipelet"
    ref: "CreateWebForm"
    config:
      param.1.name: "ExportFile"
      param.1.required: true
      param.1.rule: "^[^.\\\\/:*?<>|\\s]([^\\\\/:*?<>|\\s]*[^.\\\\/:*?<>|\\s])?$"
      param.2.name: "CatalogDomainUUID"
      param.2.required: true
      webform-id: "CategoryExportForm"
      param.2.rule: ""
    bindings:
      WebForm: "CategoryExportConfiguration"
  - id: "DecisionNode1"
    type: "decision"
    condition: "ExportedCatalogType"
  - id: "GetWebForm1"
    type: "pipelet"
    ref: "GetWebForm"
    config:
      webform-id: "CategoryExportForm"
    bindings:
      WebForm: "CategoryExportForm"
  - id: "GetWebForm2"
    type: "pipelet"
    ref: "GetWebForm"
    config:
      webform-id: "CategoryExportForm"
    bindings:
      WebForm: "CategoryExportForm"
  - id: "GetWebForm3"
    type: "pipelet"
    ref: "GetWebForm"
    config:
      webform-id: "CategoryExportForm"
    bindings:
      WebForm: "CategoryExportForm"
  - id: "InteractionEnd1"
    type: "interaction"
  - id: "Join2"
    type: "join"
  - id: "Join3"
    type: "join"
  - id: "JoinNode1"
    type: "join"
  - id: "JoinNode2"
    type: "join"
  - id: "JoinNode3"
    type: "join"
  - id: "JoinNode4"
    type: "join"
  - id: "Jump3"
    type: "jump"
    ref: "ViewCatalogImpex_52-Status"
  - id: "JumpNode2"
    type: "jump"
    ref: "SecureJump-Start"
  - id: "KeyMapper1"
    type: "pipelet"
    ref: "KeyMapper"
    config:
      ValueType: "Form Value"
    bindings:
      InValue_1: "CategoryExportForm_CatalogDomainUUID"
      InValue_2: "CategoryExportForm_ExportFile"
      OutValue_1: "CatalogDomainUUID"
      OutValue_2: "SelectedFile"
  - id: "KeyMapper2"
    type: "pipelet"
    ref: "KeyMapper"
    bindings:
      InValue_1: "ChannelRepository:Domain"
      InValue_2: "ChannelRepository:Domain"
      OutValue_1: "ProcessOwningDomain"
      OutValue_2: "ProcessExecutionDomain"
  - id: "KeyMapper7"
    type: "pipelet"
    ref: "KeyMapper"
    config:
      ValueType: "Form Value"
    bindings:
      OutValue_1: "ProcessPipelineName"
      InValue_1: "\"ProcessCatalogExport\""
      OutValue_2: "ProcessPipelineStartNode"
      InValue_2: "\"Export\""
      InValue_3: "\"ProcessCatalogImpex\""
      OutValue_3: "JobName"
  - id: "Pipelet1"
    type: "pipelet"
    ref: "DispatchFormAction"
    config:
      OutValue_0: "ViewCatalogExport_52-SelectCatalog"
      OutValue_1: "ViewCatalogExport_52-Export"
      OutValue_2: "ViewCatalogImpex_52-Status"
      OutValue_3: "ViewCatalogExport_52-OverwriteFile"
      OutValue_4: "ViewCatalogExport_52-CancelOverwriteFile"
    bindings:
      Key_0: "Start"
      Key_1: "Export"
      Key_2: "Cancel"
      SelectionKey: "JumpTarget"
      Key_3: "Overwrite"
      Key_4: "CancelOverwrite"
  - id: "Pipelet2"
    type: "pipelet"
    ref: "GetCatalogs"
    config:
      CatalogType: "Product Catalog"
      OnlineOnly: "False"
      ProxyFilter: "ON - Exclude Proxy Catalogs"
    bindings:
      Catalogs: "LocalStandardCatalogs"
      OrganizationDomain: "CurrentChannel:Domain"
  - id: "Pipelet3"
    type: "pipelet"
    ref: "GetCatalogs"
    config:
      CatalogType: "Classification Catalog"
      OnlineOnly: "False"
      ProxyFilter: "ON - Exclude Proxy Catalogs"
    bindings:
      Catalogs: "Catalogs"
      OrganizationDomain: "CurrentChannel:Domain"
  - id: "Pipelet5"
    type: "pipelet"
    ref: "GetCatalogs"
    config:
      CatalogType: "Custom"
      OnlineOnly: "False"
      ProxyFilter: "ON - Exclude Proxy Catalogs"
      CustomCatalogType: 7
    bindings:
      Catalogs: "GeneralPagesCatalogs"
      OrganizationDomain: "CurrentChannel:Domain"
  - id: "PrepareApplicationView1"
    type: "pipelet"
    ref: "PrepareApplicationView"
    config:
      SelectedMenuItem: "ChannelImportExport"
      WorkingTemplate: "impex/CatalogExportSelectCatalog_52"
  - id: "SetDictionaryValue1"
    type: "pipelet"
    ref: "SetDictionaryValue"
    config:
      Name: "ExportedCatalogType"
      Value: "classification"
  - id: "SetDictionaryValue4"
    type: "pipelet"
    ref: "SetDictionaryValue"
    config:
      Name: "FILENAME_ALREADY_IN_USE"
      Value: true
  - id: "SetDictionaryValue7"
    type: "pipelet"
    ref: "SetDictionaryValue"
    config:
      Name: "JumpTarget"
      Value: "ViewCatalogImpex_52-Status"
  - id: "UpdateWebForm1"
    type: "pipelet"
    ref: "UpdateWebForm"
    config:
      mode: "update"
      webform-id: "CategoryExportForm"
    bindings:
      WebForm: "CategoryExportForm"
  - id: "UpdateWebForm2"
    type: "pipelet"
    ref: "UpdateWebForm"
    config:
      mode: "update"
      webform-id: "CategoryExportForm"
    bindings:
      WebForm: "CategoryExportForm"
  - id: "ValidateWebForm1"
    type: "pipelet"
    ref: "ValidateWebForm"
    bindings:
      WebForm: "CategoryExportForm"
  - id: "ValidateWebForm2"
    type: "pipelet"
    ref: "ValidateWebForm"
    bindings:
      WebForm: "CategoryExportForm"

links:
  - from: "SetDictionaryValue7"
    via: "next"
    to: "JoinNode2"
    into: "in3"
  - from: "PrepareApplicationView1"
    via: "next"
    to: "InteractionEnd1"
    into: "in"
  - from: "CreateWebForm1"
    via: "next"
    to: "Join3"
    into: "in1"
  - from: "Join2"
    via: "next"
    to: "CreateWebForm1"
    into: "in"
  - from: "GetWebForm1"
    via: "error"
    to: "Join2"
    into: "in3"
  - from: "ValidateWebForm1"
    via: "error"
    to: "Join3"
    into: "in3"
  - from: "StartNode2"
