flow: "ProcessDate"
kind: "process"

entries:
  - id: "StartNode1"
    name: "VerifyDatePeriod"
    mode: "private"
    strict: true
    inputs:
      - key: "ValidFrom_Day"
        type: "java.lang.String"
        required: false
      - key: "ValidTo_Day"
        type: "java.lang.String"
        required: false
  - id: "StartNode10"
    name: "VerifyPeriod"
    mode: "private"
    strict: true
    inputs:
      - key: "DatePattern"
        type: "java.lang.String"
        required: false
      - key: "Locale"
        type: "com.intershop.beehive.core.capi.localization.LocaleInformation"
        required: false
      - key: "PeriodFlag"
        type: "java.lang.String"
        required: true
      - key: "ValidFrom_Day"
        type: "java.lang.String"
        required: false
      - key: "ValidFrom_Time"
        type: "java.lang.String"
        required: false
      - key: "ValidTo_Day"
        type: "java.lang.String"
        required: false
      - key: "ValidTo_Time"
        type: "java.lang.String"
        required: false
  - id: "StartNode2"
    name: "ConvertPeriodToString"
    mode: "private"
    strict: true
    inputs:
      - key: "ValidFromDate"
        type: "java.util.Date"
        required: false
      - key: "ValidToDate"
        type: "java.util.Date"
        required: false
  - id: "StartNode3"
    name: "ConvertPeriodToDate"
    mode: "private"
    strict: true
    inputs:
      - key: "ValidFromString"
        type: "java.lang.String"
        required: false
      - key: "ValidToString"
        type: "java.lang.String"
        required: false

steps:
  - id: "CalculateDate1"
    type: "pipelet"
    ref: "CalculateDate"
    config:
      DefaultDays: 1
    bindings:
      Date: "ValidTo"
      CalculatedDate: "ValidTo"
  - id: "CalculateDate2"
    type: "pipelet"
    ref: "CalculateDate"
    config:
      CalculationMethod: "Subtract"
    bindings:
      Date: "ValidTo"
      CalculatedDate: "ValidTo"
      Minutes: "ValidTo:TimezoneOffset"
  - id: "CalculateDate3"
    type: "pipelet"
    ref: "CalculateDate"
    config:
      CalculationMethod: "Subtract"
    bindings:
      Date: "ValidFrom"
      CalculatedDate: "ValidFrom"
      Minutes: "ValidFrom:TimezoneOffset"
  - id: "CheckForEmptyString1"
    type: "pipelet"
    ref: "CheckForEmptyString"
    bindings:
      FilledString: "ValidFrom_Day"
  - id: "CheckForEmptyString2"
    type: "pipelet"
    ref: "CheckForEmptyString"
    bindings:
      FilledString: "ValidFrom_Time"
  - id: "CheckForEmptyString3"
    type: "pipelet"
    ref: "CheckForEmptyString"
    bindings:
      FilledString: "ValidTo_Time"
  - id: "CheckForEmptyString4"
    type: "pipelet"
    ref: "CheckForEmptyString"
    bindings:
      FilledString: "ValidTo_Day"
  - id: "CheckForEmptyString5"
    type: "pipelet"
    ref: "CheckForEmptyString"
    bindings:
      FilledString: "ValidFrom_Day"
  - id: "CheckForEmptyString6"
    type: "pipelet"
    ref: "CheckForEmptyString"
    bindings:
      FilledString: "ValidTo_Day"
  - id: "ConcatenateStrings1"
    type: "pipelet"
    ref: "ConcatenateStrings"
    bindings:
      String0: "ValidFrom_Day"
      String2: "ValidFrom_Time"
      String1: "\",\""
      Concatenated: "ValidFrom"
  - id: "ConcatenateStrings2"
    type: "pipelet"
    ref: "ConcatenateStrings"
    bindings:
      String0: "ValidTo_Day"
      String2: "ValidTo_Time"
      String1: "\",\""
      Concatenated: "ValidTo"
  - id: "DecisionNode1"
    type: "decision"
    condition: "ValidFrom:Time"
  - id: "DecisionNode10"
    type: "decision"
    condition: "ValidToString"
  - id: "DecisionNode11"
    type: "decision"
    condition: "ValidFromString"
  - id: "DecisionNode2"
    type: "decision"
    condition: "ValidTo:Time"
  - id: "DecisionNode3"
    type: "decision"
    condition: "ValidFrom:Time"
  - id: "DecisionNode4"
    type: "decision"
    condition: "PeriodFlag"
  - id: "DecisionNode5"
    type: "decision"
    condition: "ValidFrom:Time"
  - id: "DecisionNode6"
    type: "decision"
    condition: "ValidTo:Time"
  - id: "DecisionNode7"
    type: "decision"
    condition: "ValidFrom:Time"
  - id: "DecisionNode8"
    type: "decision"
    condition: "ValidFromDate"
  - id: "DecisionNode9"
    type: "decision"
    condition: "ValidToDate"
  - id: "EndNode1"
    type: "end"
    strict: true
    outputs:
      - key: "ValidFrom"
        type: "java.util.Date"
        guaranteed: false
      - key: "ValidTo"
        type: "java.util.Date"
        guaranteed: false
  - id: "EndNode10"
    type: "end"
    strict: true
    outputs:
      - key: "ErrorPeriodIncorrect"
        type: "java.lang.String"
        guaranteed: true
  - id: "EndNode11"
    type: "end"
    strict: true
    outputs:
      - key: "ValidFromDate"
        type: "java.util.Date"
        guaranteed: false
      - key: "ValidToDate"
        type: "java.util.Date"
        guaranteed: false
  - id: "EndNode12"
    type: "end"
    strict: true
    outputs:
      - key: "ValidFromString"
        type: "java.lang.String"
        guaranteed: false
      - key: "ValidToString"
        type: "java.lang.String"
        guaranteed: false
  - id: "EndNode2"
    type: "end"
    strict: true
    outputs:
      - key: "ErrorValidFromIncorrect"
        type: "java.lang.String"
        guaranteed: true
  - id: "EndNode3"
    type: "end"
    strict: true
    outputs:
      - key: "PeriodFlag"
        type: "java.lang.Boolean"
        guaranteed: true
      - key: "ValidFrom"
        type: "java.util.Date"
