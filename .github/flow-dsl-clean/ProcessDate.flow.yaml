        type: "java.lang.String"
        guaranteed: false
      - key: "ValidFrom_Time"
        type: "java.lang.String"
        guaranteed: false
      - key: "ValidTo_Day"
        type: "java.lang.String"
        guaranteed: false
      - key: "ValidTo_Time"
