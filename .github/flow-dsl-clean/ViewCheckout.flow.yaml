flow: "ViewCheckout"
kind: "view"

entries:
  - id: "StartNode1"
    name: "Dispatch"
    mode: "private"
    strict: false
    inputs:
      []
  - id: "StartNode11"
    name: "Prefix"
    mode: "private"
    strict: false
    inputs:
      - key: "CurrentUser"
        type: "com.intershop.beehive.core.capi.user.User"
        required: true
      - key: "CurrentOrganization"
        type: "com.intershop.component.organization.capi.Organization"
        required: true
      - key: "ApplicationBO"
        type: "com.intershop.component.application.capi.ApplicationBO"
        required: true
  - id: "StartNode3"
    name: "Start"
    mode: "private"
    strict: false
    inputs:
      []

steps:
  - id: "AddEntryToMap1"
    type: "pipelet"
    ref: "AddEntryToMap"
    bindings:
      InMap: "AdjustedItems"
      OutMap: "AdjustedItems"
      Key: "PLI:ID"
      Value: "AdjustReasons"
  - id: "AddEntryToMap2"
    type: "pipelet"
    ref: "AddEntryToMap"
    bindings:
      InMap: "AdjustedItems"
      OutMap: "AdjustedItems"
      Key: "PLI:ID"
      Value: "AdjustReasons"
  - id: "AddObjectToVector1"
    type: "pipelet"
    ref: "AddObjectToVector"
    bindings:
      OutVector: "AdjustReasons"
      Object: "\"ProductNotAvailable\""
  - id: "AddObjectToVector2"
    type: "pipelet"
    ref: "AddObjectToVector"
    bindings:
      OutVector: "AdjustReasons"
      Object: "\"WarrantyNotAvailable\""
  - id: "CallNode1"
    type: "call"
    ref: "ProcessCart-Calculate"
    bindings:
      Cart: "CurrentCart"
  - id: "CallNode10"
    type: "call"
    ref: "ProcessCart-GetCurrentCart"
    bindings:
      User: "CurrentUser"
      Organization: "CurrentOrganization"
      BasketBORepository: "ApplicationBO:Extension(\"Basket\"):getBasketBORepository(CurrentOrganization)"
  - id: "CallNode2"
    type: "call"
    ref: "ProcessABTesting-LogCheckoutEvent"
  - id: "CallNode3"
    type: "call"
    ref: "ViewCheckout-Prefix"
  - id: "CallNode5"
    type: "call"
    ref: "ProcessCheckout-Safe_CheckInventory"
    bindings:
      AppContext: "CurrentAppContext"
      BasketBORepository: "ApplicationBO:Extension(\"Basket\"):getBasketBORepository(CurrentOrganization)"
      Organization: "CurrentOrganization"
      PreferenceDomain: "CurrentProductRepository:Domain"
      User: "CurrentUser"
  - id: "DecisionNode1"
    type: "decision"
    condition: "CurrentSession:getObject(\"T_ABTestMode\")"
  - id: "DecisionNode2"
    type: "decision"
    condition: "PLI:Price:Available"
  - id: "DecisionNode20"
    type: "decision"
    condition: "BasketAcceleration"
  - id: "DecisionNode3"
    type: "decision"
    condition: "CurrentCart:ProductLineItemsCount"
  - id: "DecisionNode4"
    type: "decision"
    condition: "AdjustedItems"
  - id: "DecisionNode5"
    type: "decision"
    condition: "PLI:Extension(\"Warranty\"):Warranty"
  - id: "DecisionNode6"
    type: "decision"
    condition: "PLI:Extension(\"Warranty\"):Warranty:Price:Available"
  - id: "DecisionNode7"
    type: "decision"
    condition: "RecalculateCart"
  - id: "DispatchFormAction3"
    type: "pipelet"
    ref: "DispatchFormAction"
    bindings:
      SelectionKey: "JumpTarget"
  - id: "EndNode1"
    type: "end"
    strict: true
    outputs:
      - key: "CurrentCart"
        type: "com.intershop.beehive.bts.capi.orderprocess.basket.Basket"
        guaranteed: true
      - key: "TaxationPolicy"
        type: "java.lang.Integer"
        guaranteed: true
      - key: "CurrentCartBO"
        type: "com.intershop.component.basket.capi.BasketBO"
        guaranteed: true
      - key: "BasketAcceleration"
        type: "java.lang.String"
        guaranteed: false
      - key: "JumpStep"
        type: "java.lang.Integer"
        guaranteed: false
  - id: "GetDomainPreference4"
    type: "pipelet"
    ref: "GetDomainPreference"
    config:
      DefaultPreferenceKey: "BasketAcceleration"
      Type: "String"
    bindings:
      PreferenceDomain: "CurrentOrganization:OrganizationDomain"
      PreferenceStringValue: "BasketAcceleration"
  - id: "JoinNode1"
    type: "join"
  - id: "JoinNode2"
    type: "join"
  - id: "JoinNode3"
    type: "join"
  - id: "JoinNode4"
    type: "join"
  - id: "JoinNode5"
    type: "join"
  - id: "JoinNode6"
    type: "join"
  - id: "Jump2"
    type: "jump"
  - id: "JumpNode1"
    type: "jump"
    ref: "ViewCart-View"
  - id: "JumpNode2"
    type: "jump"
    ref: "ViewCheckoutAddresses-Start"
  - id: "JumpNode4"
    type: "jump"
    ref: "ViewCart-View"
  - id: "KeyMapper1"
    type: "pipelet"
    ref: "KeyMapper"
    bindings:
      InValue_1: "\"true\""
      OutValue_1: "RecalculateCart"
  - id: "LoopNode1"
    type: "loop"
  - id: "RemoveWarrantyLineItem1"
    type: "pipelet"
    ref: "RemoveWarrantyLineItem"
    bindings:
      ProductLineItem: "PLI"
  - id: "VerifyInteger8"
    type: "pipelet"
    ref: "VerifyInteger"
    bindings:
      IntegerObject: "JumpStep"
      LocalizedString: "\"4\""

links:
  - from: "VerifyInteger8"
    via: "next"
    to: "JoinNode3"
    into: "in1"
  - from: "DispatchFormAction3"
    via: "next"
    to: "Jump2"
    into: "in"
  - from: "CallNode3"
    via: "next"
    to: "DecisionNode1"
    into: "in"
  - from: "LoopNode1"
    via: "do"
    to: "DecisionNode2"
    into: "in"
  - from: "LoopNode1"
    via: "next"
    to: "DecisionNode4"
    into: "in"
  - from: "DecisionNode5"
    via: "yes"
    to: "DecisionNode6"
    into: "in"
  - from: "DecisionNode7"
    via: "no"
    to: "JumpNode4"
    into: "in"
  - from: "DecisionNode2"
    via: "yes"
    to: "AddObjectToVector1"
    into: "in"
  - from: "AddEntryToMap1"
    via: "next"
    to: "DecisionNode5"
    into: "in"
  - from: "CallNode10"
    via: "next"
    to: "DecisionNode3"
    into: "in"
  - from: "DecisionNode3"
    via: "yes"
    to: "LoopNode1"
    into: "in"
  - from: "StartNode11"
    via: "next"
    to: "CallNode10"
    into: "in"
  - from: "AddObjectToVector1"
    via: "next"
    to: "AddEntryToMap1"
    into: "in"
  - from: "DecisionNode2"
    via: "no"
    to: "DecisionNode5"
    into: "in"
  - from: "DecisionNode20"
    via: "no"
    to: "JoinNode4"
    into: "in2"
  - from: "JoinNode3"
    via: "next"
    to: "EndNode1"
    into: "in"
  - from: "GetDomainPreference4"
    via: "error"
    to: "JoinNode4"
    into: "in1"
  - from: "VerifyInteger8"
    via: "error"
    to: "JoinNode5"
    into: "in2"
  - from: "JoinNode4"
    via: "next"
    to: "JoinNode5"
    into: "in1"
  - from: "JoinNode5"
    via: "next"
    to: "JoinNode3"
    into: "in2"
  - from: "DecisionNode6"
    via: "yes"
    to: "RemoveWarrantyLineItem1"
    into: "in"
  - from: "DecisionNode1"
    via: "no"
    to: "JoinNode1"
    into: "in2"
  - from: "DecisionNode5"
    via: "no"
    to: "JoinNode6"
    into: "in2"
  - from: "AddObjectToVector2"
    via: "next"
    to: "AddEntryToMap2"
    into: "in"
  - from: "DecisionNode6"
    via: "no"
    to: "JoinNode6"
    into: "in1"
  - from: "DecisionNode4"
    via: "yes"
    to: "DecisionNode7"
    into: "in"
  - from: "JoinNode6"
    via: "next"
    to: "JoinNode2"
    into: "in1"
  - from: "JoinNode2"
    via: "next"
    to: "LoopNode1"
    into: "loop"
  - from: "RemoveWarrantyLineItem1"
    via: "next"
    to: "AddObjectToVector2"
    into: "in"
  - from: "AddEntryToMap2"
    via: "next"
    to: "KeyMapper1"
    into: "in"
  - from: "KeyMapper1"
    via: "next"
    to: "JoinNode2"
    into: "in2"
  - from: "JoinNode1"
    via: "next"
    to: "CallNode5"
    into: "in"
  - from: "DecisionNode3"
    via: "no"
    to: "JumpNode1"
    into: "in"
  - from: "DecisionNode7"
    via: "yes"
    to: "CallNode1"
    into: "in"
  - from: "CallNode1"
    via: "next"
    to: "JumpNode4"
    into: "in"
  - from: "CallNode5"
    via: "next"
    to: "JumpNode2"
    into: "in"
  - from: "CallNode2"
    via: "next"
    to: "JoinNode1"
    into: "in1"
  - from: "DecisionNode4"
    via: "no"
    to: "GetDomainPreference4"
    into: "in"
  - from: "DecisionNode1"
    via: "yes"
    to: "CallNode2"
    into: "in"
  - from: "StartNode3"
    via: "next"
    to: "CallNode3"
    into: "in"
  - from: "GetDomainPreference4"
    via: "next"
    to: "DecisionNode20"
    into: "in"
  - from: "StartNode1"
    via: "next"
    to: "DispatchFormAction3"
    into: "in"
  - from: "DecisionNode20"
    via: "yes"
    to: "VerifyInteger8"
    into: "in"
