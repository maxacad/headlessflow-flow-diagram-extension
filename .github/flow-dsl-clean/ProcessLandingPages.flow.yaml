flow: "ProcessLandingPages"
kind: "process"

entries:
  - id: "Start2"
    name: "CreateDirectory"
    mode: "private"
    strict: false
    inputs:
      []
  - id: "Start3"
    name: "DeleteFile"
    mode: "private"
    strict: false
    inputs:
      []
  - id: "Start4"
    name: "Browse"
    mode: "private"
    strict: false
    inputs:
      []

steps:
  - id: "BrowseDirectory2"
    type: "pipelet"
    ref: "BrowseDirectory"
    config:
      UnitDirectory: "LANDING_PAGES_DIR"
  - id: "CheckStaticContent1"
    type: "pipelet"
    ref: "CheckStaticContent"
  - id: "CreateDirectory2"
    type: "pipelet"
    ref: "CreateDirectory"
    config:
      UnitDirectory: "LANDING_PAGES_DIR"
  - id: "DecisionNode1"
    type: "decision"
    condition: "DirectoryPath"
  - id: "DeleteFile3"
    type: "pipelet"
    ref: "DeleteFile"
    config:
      UnitDirectory: "LANDING_PAGES_DIR"
  - id: "End1"
    type: "end"
    strict: false
  - id: "End10"
    type: "end"
    strict: false
  - id: "End13"
    type: "end"
    strict: false
  - id: "End14"
    type: "end"
    strict: false
  - id: "End3"
    type: "end"
    strict: false
  - id: "End9"
    type: "end"
    strict: false
  - id: "EndNode1"
    type: "end"
    strict: false
  - id: "EndNode2"
    type: "end"
    strict: false
  - id: "JoinNode1"
    type: "join"
  - id: "VerifyFileName1"
    type: "pipelet"
    ref: "VerifyFileName"
    config:
      IsDirectoryName: true
    bindings:
      FileName: "DirectoryPath"

links:
  - from: "VerifyFileName1"
    via: "error"
    to: "EndNode2"
    into: "in"
  - from: "CheckStaticContent1"
    via: "error"
    to: "End1"
    into: "in"
  - from: "Start2"
    via: "next"
    to: "CreateDirectory2"
    into: "in"
  - from: "CreateDirectory2"
    via: "error"
    to: "End14"
    into: "in"
  - from: "Start4"
    via: "next"
    to: "CheckStaticContent1"
    into: "in"
  - from: "CreateDirectory2"
    via: "next"
    to: "End3"
    into: "in"
  - from: "DeleteFile3"
    via: "next"
    to: "End9"
    into: "in"
  - from: "DeleteFile3"
    via: "error"
    to: "End13"
    into: "in"
  - from: "Start3"
    via: "next"
    to: "DeleteFile3"
    into: "in"
  - from: "VerifyFileName1"
    via: "next"
    to: "JoinNode1"
    into: "in1"
  - from: "BrowseDirectory2"
    via: "next"
    to: "End10"
    into: "in"
  - from: "DecisionNode1"
    via: "no"
    to: "VerifyFileName1"
    into: "in"
  - from: "CheckStaticContent1"
    via: "next"
    to: "DecisionNode1"
    into: "in"
  - from: "DecisionNode1"
    via: "yes"
    to: "JoinNode1"
    into: "in2"
  - from: "BrowseDirectory2"
    via: "error"
    to: "EndNode1"
    into: "in"
  - from: "JoinNode1"
    via: "next"
    to: "BrowseDirectory2"
    into: "in"
