      CustomAttributes: "Catalog:AttributeValues"
  - id: "SetCatalogClassificationSystem1"
    type: "pipelet"
    ref: "SetCatalogClassificationSystem"
    bindings:
      Catalog: "SharedCatalogProxy"
      ClassificationSystem: "Catalog:ClassificationSystem"
  - id: "SetCatalogClassificationSystem2"
    type: "pipelet"
    ref: "SetCatalogClassificationSystem"
    bindings:
      Catalog: "Proxy"
      ClassificationSystem: "ClassificationCatalog:ClassificationSystem"
  - id: "SetDictionaryValue1"
    type: "pipelet"
    ref: "SetDictionaryValue"
    config:
      Name: "Error_Channel"
      Value: "CouldNotCreateDomainRelation MANAGED_SERVICE"
  - id: "SetDictionaryValue14"
    type: "pipelet"
    ref: "SetDictionaryValue"
    config:
      Name: "Error_Channel"
      Value: "CouldNotCreateDomainRelation SHIPPING_METHOD"
  - id: "SetDictionaryValue15"
    type: "pipelet"
    ref: "SetDictionaryValue"
    config:
      Name: "Error_Channel"
      Value: "CouldNotCreateDomainRelation PAYMENT_METHOD"
  - id: "SetDictionaryValue16"
    type: "pipelet"
    ref: "SetDictionaryValue"
    config:
      Name: "Error_Channel"
      Value: "CouldNotCreateDomainPreference 'ShippingCosts'"
  - id: "SetDictionaryValue5"
    type: "pipelet"
