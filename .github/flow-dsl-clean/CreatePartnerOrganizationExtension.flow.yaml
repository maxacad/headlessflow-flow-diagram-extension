    config:
      Name: "Error_Channel"
      Value: "CouldNotCreateDomainRelation TAX_CLASS"
  - id: "SetDictionaryValue7"
    type: "pipelet"
    ref: "SetDictionaryValue"
    config:
      Name: "TAX_DomainName"
      Value: "Operations"
  - id: "SetDictionaryValue8"
    type: "pipelet"
    ref: "SetDictionaryValue"
    config:
      Name: "Error_Channel"
      Value: "CouldNotCreateDomainRelation TAX_JURISDICTION"
  - id: "SetDictionaryValue9"
    type: "pipelet"
    ref: "SetDictionaryValue"
    config:
      Name: "UnitName"
      Value: "Operations"
  - id: "SetDomainPreference1"
    type: "pipelet"
    ref: "SetDomainPreference"
    config:
      DefaultPreferenceKey: "ShippingCosts"
      DefaultPreferenceValue: "Provided"
      Type: "String"
    bindings:
      PreferenceDomain: "Organization:Domain"
  - id: "SetDomainPreference7"
    type: "pipelet"
    ref: "SetDomainPreference"
    config:
      DefaultPreferenceKey: "InactivityPeriod"
      Type: "Integer"
      DefaultPreferenceValue: 90
    bindings:
      PreferenceDomain: "Organization:OrganizationDomain"
      PreferenceIntValue: "null"
      PreferenceDoubleValue: "null"
      PreferenceKey: "null"
      PreferenceStringValue: "null"
      PreferenceValue: "null"
  - id: "TextNode3"
    type: "text"

