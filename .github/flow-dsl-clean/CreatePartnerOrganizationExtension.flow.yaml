flow: "CreatePartnerOrganizationExtension"
kind: "extension"

entries:
  - id: "Start1"
    name: "Start"
    mode: "private"
    strict: true
    inputs:
      - key: "Organization"
        type: "com.intershop.component.organization.capi.Organization"
        required: true
      - key: "AdminUser"
        type: "com.intershop.beehive.core.capi.user.User"
        required: false
      - key: "Owner"
        type: "com.intershop.beehive.core.capi.domain.Domain"
        required: false

steps:
  - id: "AssignUserGroupToUserGroup1"
    type: "pipelet"
    ref: "AssignUserGroupToUserGroup"
    bindings:
      ChildUserGroup: "OrganizationUserGroup"
      UserGroup: "ChannelUserGroup"
  - id: "AssignUserToUserGroup1"
    type: "pipelet"
    ref: "AssignUserToUserGroup"
    config:
      UserGroupID: "SLD_AR_30_ADMINISTRATOR"
    bindings:
      CurrentDomain: "Organization:Domain"
      CurrentUser: "AdminUser"
  - id: "Call1"
    type: "call"
    ref: "AccessRoles-Create"
  - id: "CallNode1"
    type: "call"
    ref: "ProcessRepository-Create"
  - id: "CallNode2"
    type: "call"
    ref: "ProcessRepository-Create"
  - id: "CallNode3"
    type: "call"
    ref: "ProcessInitializeImages-CreateInstances"
    bindings:
      Domain: "Organization:Domain"
      ImageViewBORepository: "ApplicationBO:Extension(\"Image\"):ImageViewBORepository(Organization)"
      ImageTypeBORepository: "ApplicationBO:Extension(\"Image\"):ImageTypeBORepository(Organization)"
  - id: "CallNode4"
    type: "call"
    ref: "ProcessInitializeImages-CreateDefinitionDomainPreference"
    bindings:
      Domain: "Organization:Domain"
  - id: "CallNode6"
    type: "call"
    ref: "CreateSalesOrganizationExtension-CreateAttributeGroup"
    bindings:
      ID: "\"BACKOFFICE_SEARCH_ATTRIBUTES\""
      FixedFlag: "\"(Boolean)true\""
      Domain: "Organization:Domain"
      LocaleId: "null"
      Description: "null"
      DisplayName: "null"
      TypeCode: "null"
  - id: "CopyCustomAttributes1"
    type: "pipelet"
    ref: "CopyCustomAttributes"
    bindings:
      CustomAttributes: "ClassificationCatalog:CustomAttributes"
      ExtensibleObject: "Proxy"
  - id: "CreateAccessRoleID1"
    type: "pipelet"
    ref: "CreateAccessRoleID"
    config:
      DefaultPrefix: "SLD_AR"
      DefaultSeparator: "_"
      DefaultSuffix: "CATALOG_VIEWER"
    bindings:
      AccessRoleID: "ChannelUserGroupID"
      TypeCode: "ChannelRepository:TypeCode"
  - id: "CreateApplicationDomainRelation1"
    type: "pipelet"
    ref: "CreateApplicationDomainRelation"
    bindings:
      RelationName: "\"RecycleBinRepository\""
      Domain: "Repository:RepositoryDomain"
      Application: "ApplicationBO:Extension(\"PersistentObjectBOExtension\"):PersistentObject"
  - id: "CreateApplicationDomainRelation2"
    type: "pipelet"
    ref: "CreateApplicationDomainRelation"
    bindings:
      RelationName: "\"DefaultRepository\""
      Domain: "Repository:RepositoryDomain"
      Application: "ApplicationBO:Extension(\"PersistentObjectBOExtension\"):PersistentObject"
  - id: "CreateDomainRelation1"
    type: "pipelet"
    ref: "CreateDomainRelation"
    config:
      DefaultRelationName: "MANAGED_SERVICE"
      DefaultRoleName: "Role B"
    bindings:
      Source: "Organization:Domain"
      Target: "Organization:OwningDomain"
  - id: "CreateDomainRelation2"
    type: "pipelet"
    ref: "CreateDomainRelation"
    config:
      DefaultRelationName: "TAX_JURISDICTION"
      DefaultRoleName: "Role B"
    bindings:
      Source: "Organization:Domain"
      Target: "TAX_Domain"
  - id: "CreateDomainRelation3"
    type: "pipelet"
    ref: "CreateDomainRelation"
    config:
      DefaultRelationName: "TAX_CLASS"
      DefaultRoleName: "Role B"
    bindings:
      Source: "Organization:Domain"
      Target: "TAX_Domain"
  - id: "CreateDomainRelation4"
    type: "pipelet"
    ref: "CreateDomainRelation"
    config:
      DefaultRelationName: "PAYMENT_METHOD"
      DefaultRoleName: "Role B"
    bindings:
      Source: "Organization:Domain"
      Target: "TAX_Domain"
  - id: "CreateDomainRelation5"
    type: "pipelet"
    ref: "CreateDomainRelation"
    config:
      DefaultRelationName: "SHIPPING_METHOD"
      DefaultRoleName: "Role B"
    bindings:
      Source: "Organization:Domain"
      Target: "Repository:Domain"
  - id: "CreateProxyCatalog1"
    type: "pipelet"
    ref: "CreateProxyCatalog"
    bindings:
      CatalogID: "\"ServiceTypes\""
      CatalogType: "Catalog:TypeCode"
      Domain: "Organization:Domain"
      Proxy: "SharedCatalogProxy"
  - id: "CreateProxyCatalog2"
    type: "pipelet"
    ref: "CreateProxyCatalog"
    config:
      DefaultCatalogID: "eclass"
      DefaultCatalogType: 2
    bindings:
      Catalog: "ClassificationCatalog"
      Domain: "Organization:Domain"
      CatalogID: "ClassificationCatalog:Id"
      CatalogType: "ClassificationCatalog:TypeCode"
  - id: "Decision1"
    type: "decision"
    condition: "Organization:TypeCode"
  - id: "DecisionNode4"
    type: "decision"
    condition: "Catalog:ClassificationSystem"
  - id: "DetermineUnit1"
    type: "pipelet"
    ref: "DetermineUnit"
  - id: "End1"
    type: "end"
    strict: true
  - id: "End3"
    type: "end"
    strict: true
  - id: "End4"
    type: "end"
    strict: true
  - id: "EndNode1"
    type: "end"
    strict: true
  - id: "GetApplicationBO1"
    type: "pipelet"
    ref: "GetApplicationBO"
  - id: "GetCatalog1"
    type: "pipelet"
    ref: "GetCatalog"
    config:
      DefaultCatalogID: "ServiceTypes"
    bindings:
      OrganizationDomain: "ChannelRepository:OwningDomain"
  - id: "GetCatalogs1"
    type: "pipelet"
    ref: "GetCatalogs"
    config:
      CatalogType: "Classification Catalog"
      ProxyFilter: "ON - Exclude Proxy Catalogs"
    bindings:
      OrganizationDomain: "Unit"
      Catalogs: "ClassificationCatalogs"
  - id: "GetDomain2"
    type: "pipelet"
    ref: "GetDomain"
    bindings:
      StagingDomain: "TAX_Domain"
      StagingDomainName: "TAX_DomainName"
  - id: "GetRepositoryByRepositoryDomain1"
    type: "pipelet"
    ref: "GetRepositoryByRepositoryDomain"
    bindings:
      Repository: "ChannelRepository"
      RepositoryDomain: "Organization:OwningDomain"
  - id: "GetUserGroupByID1"
    type: "pipelet"
    ref: "GetUserGroupByID"
    config:
      DefaultUserGroupID: "SLD_AR_32_CATALOG_VIEWER"
    bindings:
      Domain: "Owner"
      UserGroup: "ChannelUserGroup"
  - id: "GetUserGroupByID2"
    type: "pipelet"
    ref: "GetUserGroupByID"
    config:
      DefaultUserGroupID: "Everyone"
    bindings:
      Domain: "Organization:Domain"
      UserGroup: "OrganizationUserGroup"
