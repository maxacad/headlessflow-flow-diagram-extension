    config:
      Name: "RepositoryID"
      Value: "RecycleBin"
  - id: "Pipelet2"
    type: "pipelet"
    ref: "SetDictionaryValue"
    config:
      Name: "RepositoryTypeCode"
      Value: 22
  - id: "Pipelet3"
    type: "pipelet"
    ref: "ConcatenateStrings"
    config:
      DefaultString2: "-RecycleBin"
    bindings:
      Concatenated: "DisplayName"
      String1: "Organization:Domain:DomainName"
  - id: "Pipelet4"
    type: "pipelet"
    ref: "SetDictionaryValue"
