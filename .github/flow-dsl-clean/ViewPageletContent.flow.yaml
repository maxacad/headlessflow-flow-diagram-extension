flow: "ViewPageletContent"
kind: "view"

entries:
  - id: "StartNode1"
    name: "Dispatch"
    mode: "private"
    strict: false
    inputs:
      []
  - id: "StartNode2"
    name: "View"
    mode: "private"
    strict: false
    inputs:
      []
  - id: "StartNode4"
    name: "TemplateCallback"
    mode: "private"
    strict: false
    inputs:
      []

steps:
  - id: "CallNode1"
    type: "call"
    ref: "ViewPagelet-IsTabSwitched"
    bindings:
      PageletUUID: "Pagelet:UUID"
      Flag: "IsTabSwitched"
  - id: "CallNode4"
    type: "call"
    ref: "ProcessClipboard-Delete"
  - id: "DecisionNode1"
    type: "decision"
    condition: "IsTabSwitched"
  - id: "DecisionNode2"
    type: "decision"
    condition: "ContextPipeline"
  - id: "DetermineLocales2"
    type: "pipelet"
    ref: "DetermineLocales"
  - id: "DispatchFormAction1"
    type: "pipelet"
    ref: "DispatchFormAction"
    config:
      OutValue_0: "This:View"
    bindings:
      SelectionKey: "JumpTarget"
      Key_0: "setLocale"
  - id: "EndNode6"
    type: "end"
    strict: false
  - id: "GetValuesFromContainer2"
    type: "pipelet"
    ref: "GetValuesFromContainer"
    config:
      OverwriteBehavior: true
    bindings:
      ContainerName: "Pagelet:UUID"
  - id: "JoinNode1"
    type: "join"
  - id: "JoinNode2"
    type: "join"
  - id: "JoinNode3"
    type: "join"
  - id: "JumpNode1"
    type: "jump"
    ref: "SecureJump-Start"
  - id: "JumpNode2"
    type: "jump"
    ref: "ViewPagelet-InternalView"
  - id: "JumpNode3"
    type: "jump"
  - id: "KeyMapper2"
    type: "pipelet"
    ref: "KeyMapper"
    bindings:
      InValue_1: "ContentRepository:RepositoryDomain:Site"
      OutValue_1: "CurrentSite"
  - id: "RemoveValuesContainer1"
    type: "pipelet"
    ref: "RemoveValuesContainer"
    bindings:
      ContainerName: "Pagelet:UUID"
  - id: "SetDictionaryValue1"
    type: "pipelet"
    ref: "SetDictionaryValue"
    config:
      Name: "SelectedTab"
      Value: "Content"

links:
  - from: "DispatchFormAction1"
    via: "next"
    to: "JoinNode2"
    into: "in1"
  - from: "SetDictionaryValue1"
    via: "next"
    to: "JumpNode2"
    into: "in"
  - from: "GetValuesFromContainer2"
    via: "next"
    to: "JoinNode1"
    into: "in1"
  - from: "GetValuesFromContainer2"
    via: "error"
    to: "JoinNode3"
    into: "in1"
  - from: "CallNode1"
    via: "next"
    to: "DecisionNode1"
    into: "in"
  - from: "DecisionNode1"
    via: "yes"
    to: "GetValuesFromContainer2"
    into: "in"
  - from: "JoinNode1"
    via: "next"
    to: "EndNode6"
    into: "in"
  - from: "JoinNode3"
    via: "next"
    to: "CallNode4"
    into: "in"
  - from: "StartNode2"
    via: "next"
    to: "DecisionNode2"
    into: "in"
  - from: "DecisionNode1"
    via: "no"
    to: "RemoveValuesContainer1"
    into: "in"
  - from: "RemoveValuesContainer1"
    via: "next"
    to: "JoinNode3"
    into: "in2"
  - from: "StartNode1"
    via: "next"
    to: "DispatchFormAction1"
    into: "in"
  - from: "DecisionNode2"
    via: "no"
    to: "SetDictionaryValue1"
    into: "in"
  - from: "DispatchFormAction1"
    via: "error"
    to: "JoinNode2"
    into: "in2"
  - from: "JoinNode2"
    via: "next"
    to: "JumpNode1"
    into: "in"
  - from: "DetermineLocales2"
    via: "next"
    to: "CallNode1"
    into: "in"
  - from: "DecisionNode2"
    via: "yes"
    to: "JumpNode3"
    into: "in"
  - from: "CallNode4"
    via: "next"
    to: "JoinNode1"
    into: "in3"
  - from: "StartNode4"
    via: "next"
    to: "KeyMapper2"
    into: "in"
  - from: "KeyMapper2"
    via: "next"
    to: "DetermineLocales2"
    into: "in"
