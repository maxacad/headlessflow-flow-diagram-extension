flow: "ViewAuctionEvaluation_52"
kind: "view"

entries:
  - id: "Start1"
    name: "Evaluate"
    mode: "private"
    strict: false
    inputs:
      []
  - id: "Start4"
    name: "Prefix"
    mode: "private"
    strict: false
    inputs:
      []
  - id: "Start5"
    name: "View"
    mode: "private"
    strict: false
    inputs:
      []

steps:
  - id: "Call1"
    type: "call"
    ref: "ViewAuctionEvaluation_52-Prefix"
  - id: "Call2"
    type: "call"
    ref: "ViewAuctionPrice_52-GetPriceDetails"
  - id: "Call4"
    type: "call"
    ref: "ViewAuctionEvaluation_52-Prefix"
  - id: "CallNode1"
    type: "call"
    ref: "ProcessAuction-CreateOrder"
  - id: "CreatePageableFromIterator1"
    type: "pipelet"
    ref: "CreatePageableFromIterator"
    config:
      Pagesize: 10
    bindings:
      Iterator: "AuctionBids"
      Pageable: "AuctionBids"
  - id: "Decision1"
    type: "decision"
    condition: "AuctionBid:BidValue:Value"
  - id: "Decision2"
    type: "decision"
    condition: "BestBidValue"
  - id: "Decision3"
    type: "decision"
    condition: "Auction:State"
  - id: "Decision4"
    type: "decision"
    condition: "Auction:State"
  - id: "End2"
    type: "end"
    strict: false
  - id: "EvaluateAuction1"
    type: "pipelet"
    ref: "EvaluateAuction"
    bindings:
      AuctionBid: "WinningBid"
  - id: "ExecutePipeline1"
    type: "pipelet"
    ref: "ExecutePipeline"
    config:
      PipelineDomainName: "CurrentDomain"
      PipelineName: "AuctionNotification"
      PipelineStartNode: "EvaluationInformationConsumer"
    bindings:
      PipelineDomain: "CurrentDomain"
      PipelineDomainID: "CurrentDomain:DomainID"
      PipelineDomainName: "CurrentDomain:DomainName"
      PipelineName: "not used"
      PipelineStartNode: "not used"
  - id: "GetAuction2"
    type: "pipelet"
    ref: "GetAuction"
  - id: "GetAuctionBid1"
    type: "pipelet"
    ref: "GetAuctionBid"
    bindings:
      AuctionBid: "WinningBid"
      AuctionBidUUID: "WinningBidUUID"
  - id: "GetBestAuctionBids1"
    type: "pipelet"
    ref: "GetBestAuctionBids"
    config:
      DefaultBidState: 4
      MaxCount: 5
      Mode: "Standard"
  - id: "InteractionEnd1"
    type: "interaction"
  - id: "InteractionEnd3"
    type: "interaction"
  - id: "Join1"
    type: "join"
  - id: "Join2"
    type: "join"
  - id: "Join3"
    type: "join"
  - id: "Join4"
    type: "join"
  - id: "Join5"
    type: "join"
  - id: "Join6"
    type: "join"
  - id: "JoinNode1"
    type: "join"
  - id: "JoinNode2"
    type: "join"
  - id: "KeyMapper1"
    type: "pipelet"
    ref: "KeyMapper"
    bindings:
      InValue_1: "CurrentProductRepository:RepositoryDomain"
      OutValue_1: "ProductDomain"
  - id: "KeyMapper2"
    type: "pipelet"
    ref: "KeyMapper"
    bindings:
      InValue_1: "Auction:WinningBid"
      OutValue_1: "WinningBid"
  - id: "KeyMapper3"
    type: "pipelet"
    ref: "KeyMapper"
    bindings:
      InValue_1: "AuctionBid:BidValue:Value"
      OutValue_1: "BestBidValue"
  - id: "Loop1"
    type: "loop"
  - id: "PrepareApplicationView1"
    type: "pipelet"
    ref: "PrepareApplicationView"
    config:
      SelectedMenuItem: "AuctionManagement"
      WorkingTemplate: "auction/AuctionEvaluation_52"
  - id: "PrepareApplicationView2"
    type: "pipelet"
    ref: "PrepareApplicationView"
    config:
      SelectedMenuItem: "AuctionManagement"
      WorkingTemplate: "auction/AuctionEvaluationProcess_52"

