flow: "ViewSuggestSearch"
kind: "view"

entries:
  - id: "StartNode8"
    name: "Suggest"
    mode: "private"
    strict: false
    inputs:
      []

steps:
  - id: "CallNode1"
    type: "call"
    ref: "ProcessSearchIndexFeature-IsSuggestEnabled"
    bindings:
      Domain: "CurrentOrganization:OwningDomain"
      Locale: "CurrentRequest:Locale"
  - id: "CreateSearchIndexQuery2"
    type: "pipelet"
    ref: "CreateSearchIndexQuery"
    bindings:
      SearchIndexQueryStr: "null"
      DefaultQueryTerm: "\"*\""
      QueryTerm: "SearchTerm"
  - id: "DecisionNode1"
    type: "decision"
    condition: "SearchResult"
  - id: "DecisionNode2"
    type: "decision"
    condition: "SearchTerm"
  - id: "DecisionNode6"
    type: "decision"
    condition: "SUGGEST_ENABLED"
  - id: "InteractionNode3"
    type: "interaction"
  - id: "JoinNode1"
    type: "join"
  - id: "JoinNode2"
    type: "join"
  - id: "JoinNode25"
    type: "join"
  - id: "JoinNode3"
    type: "join"
  - id: "JoinNode7"
    type: "join"
  - id: "KeyMapper1"
    type: "pipelet"
    ref: "KeyMapper"
    bindings:
      InValue_1: "SuggestSearchIndex:SuggestResult(SearchTerm)"
      OutValue_1: "SearchResult"
  - id: "KeyMapper7"
    type: "pipelet"
    ref: "KeyMapper"
    bindings:
      InValue_1: "SuggestSearchIndex:SuggestResult(SearchIndexQuery)"
      OutValue_1: "SearchResult"
  - id: "QuerySearchIndex2"
    type: "pipelet"
    ref: "QuerySearchIndex"
    bindings:
      SearchIndex: "SuggestSearchIndex"
  - id: "SetDictionaryValue1"
    type: "pipelet"
    ref: "SetDictionaryValue"
    config:
      Name: "ShowSuggest"
      Value: true
  - id: "SetSearchIndexQueryPageSize1"
    type: "pipelet"
    ref: "SetSearchIndexQueryPageSize"
    bindings:
      PageSize: "MaxAutoSuggestResults"

links:
  - from: "DecisionNode6"
    via: "yes"
    to: "KeyMapper7"
    into: "in"
  - from: "CallNode1"
    via: "NO_SUGGEST"
    to: "JoinNode25"
    into: "in1"
  - from: "SetSearchIndexQueryPageSize1"
    via: "next"
    to: "DecisionNode6"
    into: "in"
  - from: "JoinNode25"
    via: "next"
    to: "JoinNode7"
    into: "in1"
  - from: "JoinNode1"
    via: "next"
    to: "SetDictionaryValue1"
    into: "in"
  - from: "QuerySearchIndex2"
    via: "next"
    to: "JoinNode3"
    into: "in2"
  - from: "KeyMapper7"
    via: "next"
    to: "DecisionNode1"
    into: "in"
  - from: "DecisionNode6"
    via: "no"
    to: "QuerySearchIndex2"
    into: "in"
  - from: "CreateSearchIndexQuery2"
    via: "error"
    to: "JoinNode7"
    into: "in2"
  - from: "QuerySearchIndex2"
    via: "error"
    to: "JoinNode2"
    into: "in2"
  - from: "SetDictionaryValue1"
    via: "next"
    to: "InteractionNode3"
    into: "in"
  - from: "DecisionNode1"
    via: "yes"
    to: "JoinNode1"
    into: "in1"
  - from: "JoinNode2"
    via: "next"
    to: "JoinNode3"
    into: "in1"
  - from: "JoinNode3"
    via: "next"
    to: "JoinNode1"
    into: "in3"
  - from: "KeyMapper1"
    via: "next"
    to: "JoinNode1"
    into: "in1"
  - from: "DecisionNode2"
    via: "no"
    to: "CallNode1"
    into: "in"
  - from: "StartNode8"
    via: "next"
    to: "DecisionNode2"
    into: "in"
  - from: "DecisionNode1"
    via: "no"
    to: "KeyMapper1"
    into: "in"
  - from: "CallNode1"
    via: "next"
    to: "CreateSearchIndexQuery2"
    into: "in"
  - from: "CreateSearchIndexQuery2"
    via: "next"
    to: "SetSearchIndexQueryPageSize1"
    into: "in"
  - from: "JoinNode7"
    via: "next"
    to: "JoinNode2"
    into: "in1"
  - from: "DecisionNode2"
    via: "yes"
    to: "JoinNode25"
    into: "in1"
