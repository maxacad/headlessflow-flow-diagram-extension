flow: "ProcessSearchIndexImpex"
kind: "process"

entries:
  - id: "StartNode1"
    name: "ExportSynonimsCSV"
    mode: "private"
    strict: false
    inputs:
      []
  - id: "StartNode2"
    name: "PrepareSynonymsCSVExport"
    mode: "private"
    strict: false
    inputs:
      []

steps:
  - id: "CallNode1"
    type: "call"
    ref: "This:PrepareSynonymsCSVExport"
  - id: "CloseFile3"
    type: "pipelet"
    ref: "CloseFile"
    config:
      PipeletID: "CloseFile1"
      StreamID: "target"
      UIDescription: "CloseFile"
      Delete: true
  - id: "CloseFile4"
    type: "pipelet"
    ref: "CloseFile"
    config:
      PipeletID: "CloseFile1"
      StreamID: "target"
      UIDescription: "CloseFile"
  - id: "ConcatenateStrings2"
    type: "pipelet"
    ref: "ConcatenateStrings"
    config:
      DefaultString0: "searchindex"
      DefaultString1: "/"
    bindings:
      Concatenated: "ExportPath"
      String2: "ExportFileName"
  - id: "ConcatenateStrings3"
    type: "pipelet"
    ref: "ConcatenateStrings"
    config:
      DefaultString2: ".log"
      DefaultString0: "SynonymExport_"
    bindings:
      Concatenated: "LogFile"
      String1: "CurrentTimeStr"
  - id: "CreateDirectory2"
    type: "pipelet"
    ref: "CreateDirectory"
    config:
      DefaultDirectoryName: "searchindex"
      DefaultDirectoryPath: "export"
      UnitDirectory: "IMPEX_DIR"
    bindings:
      UnitDomain: "CurrentChannel:Domain"
  - id: "CreateFileLogger1"
    type: "pipelet"
    ref: "CreateFileLogger"
    config:
      BufferSize: 1024
      Facility: "default"
      FlushTime: 0
      Level: "ERROR | WARN"
      PipeletID: "CreateFileLogger1"
      RolloverSize: 1024000
      UIDescription: "CreateFileLogger"
    bindings:
      File: "LogFile"
  - id: "CreateImpexUnitFileStructure1"
    type: "pipelet"
    ref: "CreateImpexUnitFileStructure"
    bindings:
      DomainName: "CurrentChannel:Domain:DomainName"
  - id: "DetermineConfiguration2"
    type: "pipelet"
    ref: "DetermineConfiguration"
    config:
      Controller.Class: "com.intershop.beehive.core.capi.impex.Controller"
      PerformAccessControl: false
      PipeletID: "DetermineConfiguration1"
      UIDescription: "DetermineConfiguration"
    bindings:
      DomainName: "CurrentChannel:Domain:DomainName"
  - id: "EndNode1"
    type: "end"
    strict: false
  - id: "EndNode2"
    type: "end"
    strict: false
  - id: "EndNode3"
    type: "end"
    strict: false
  - id: "EndNode4"
    type: "end"
    strict: false
  - id: "Export2"
    type: "pipelet"
    ref: "Export"
    config:
      PipeletID: "Export1"
      TargetID: "target"
      UIDescription: "Export.Synonym"
      Template: "searchindex/SynonymCSVExport.isml"
  - id: "GetCurrentDate1"
    type: "pipelet"
    ref: "GetCurrentDate"
    bindings:
      CurrentDate: "ExportStartTime"
  - id: "GetCurrentDate2"
    type: "pipelet"
    ref: "GetCurrentDate"
    bindings:
      CurrentDate: "ExportEndTime"
  - id: "GetLongFromDate1"
    type: "pipelet"
    ref: "GetLongFromDate"
    bindings:
      StringObject: "CurrentTimeStr"
      DateObject: "ExportStartTime"
  - id: "JoinNode1"
    type: "join"
  - id: "JoinNode2"
    type: "join"
  - id: "JoinNode3"
    type: "join"
  - id: "KeyMapper1"
    type: "pipelet"
    ref: "KeyMapper"
    bindings:
      InValue_1: "SearchIndex:Configuration:Synonyms"
      OutValue_1: "Synonyms"
  - id: "OpenFile2"
    type: "pipelet"
    ref: "OpenFile"
    config:
      PipeletID: "OpenFileLinkExport1"
      StreamID: "target"
      Type: "TARGET"
      UIDescription: "OpenFile"
    bindings:
      File: "ExportPath"
  - id: "WriteImpexLogMessage2"
    type: "pipelet"
    ref: "WriteImpexLogMessage"
    config:
      PipeletID: "LogTemplateError"
    bindings:
      MessageKey: "\"core.impex.pipelet.Export_E_TEMPLATEPROCESSOR\""
      Level: "\"ERROR\""
      Parameter0: "Exception"

links:
  - from: "StartNode2"
    via: "next"
    to: "GetCurrentDate1"
    into: "in"
  - from: "CreateImpexUnitFileStructure1"
    via: "error"
    to: "JoinNode1"
    into: "in2"
  - from: "DetermineConfiguration2"
    via: "error"
    to: "JoinNode1"
    into: "in1"
  - from: "CreateImpexUnitFileStructure1"
    via: "next"
    to: "CreateDirectory2"
    into: "in"
  - from: "JoinNode2"
    via: "next"
    to: "EndNode2"
    into: "in"
  - from: "CreateDirectory2"
    via: "next"
    to: "ConcatenateStrings2"
    into: "in"
  - from: "CreateDirectory2"
    via: "error"
    to: "JoinNode2"
    into: "in1"
  - from: "Export2"
    via: "error"
    to: "CloseFile3"
    into: "in"
  - from: "GetCurrentDate1"
    via: "next"
    to: "DetermineConfiguration2"
    into: "in"
  - from: "OpenFile2"
    via: "error"
    to: "JoinNode3"
    into: "in1"
  - from: "JoinNode3"
    via: "next"
    to: "EndNode4"
    into: "in"
  - from: "Export2"
    via: "next"
    to: "CloseFile4"
    into: "in"
  - from: "CallNode1"
    via: "ERROR"
    to: "JoinNode3"
    into: "in1"
  - from: "ConcatenateStrings2"
    via: "next"
    to: "KeyMapper1"
    into: "in"
  - from: "CloseFile4"
    via: "next"
    to: "GetCurrentDate2"
    into: "in"
  - from: "CreateFileLogger1"
    via: "next"
    to: "EndNode3"
    into: "in"
  - from: "ConcatenateStrings3"
    via: "next"
    to: "CreateFileLogger1"
    into: "in"
  - from: "GetLongFromDate1"
    via: "next"
    to: "ConcatenateStrings3"
    into: "in"
  - from: "CloseFile3"
    via: "next"
    to: "WriteImpexLogMessage2"
    into: "in"
  - from: "WriteImpexLogMessage2"
    via: "next"
    to: "JoinNode3"
    into: "in2"
  - from: "GetCurrentDate2"
    via: "next"
    to: "EndNode1"
    into: "in"
  - from: "OpenFile2"
    via: "next"
    to: "Export2"
    into: "in"
  - from: "KeyMapper1"
    via: "next"
    to: "GetLongFromDate1"
    into: "in"
  - from: "StartNode1"
    via: "next"
    to: "CallNode1"
    into: "in"
  - from: "CallNode1"
    via: "next"
    to: "OpenFile2"
    into: "in"
  - from: "JoinNode1"
    via: "next"
    to: "JoinNode2"
    into: "in1"
  - from: "DetermineConfiguration2"
    via: "next"
    to: "CreateImpexUnitFileStructure1"
    into: "in"
