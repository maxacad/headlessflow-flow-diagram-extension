flow: "ViewPagelet_comp_promotion"
kind: "view"

entries:
  - id: "StartNode1"
    name: "GetPromotionAttachments"
    mode: "private"
    strict: true
    inputs:
      - key: "Promotion"
        type: "com.intershop.component.promotion.capi.PromotionBO"
        required: true

steps:
  - id: "EndNode1"
    type: "end"
    strict: true
    outputs:
      - key: "Additionals"
        type: "java.util.Iterator"
        guaranteed: false
  - id: "GetAdditionalContents1"
    type: "pipelet"
    ref: "GetAdditionalContents"
    bindings:
      AdditionalContentIterator: "Additionals"
      ExtensibleObject: "Promotion:Extension(\"PersistentObjectBOExtension\"):PersistentObject"
      Locale: "CurrentRequest:Locale"
      ContentType: "\"all\""

links:
  - from: "GetAdditionalContents1"
    via: "next"
    to: "EndNode1"
    into: "in"
  - from: "GetAdditionalContents1"
    via: "error"
    to: "EndNode1"
    into: "in"
  - from: "StartNode1"
    via: "next"
    to: "GetAdditionalContents1"
    into: "in"
