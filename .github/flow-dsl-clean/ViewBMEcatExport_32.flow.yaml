  - from: "JoinNode3"
    via: "next"
    to: "GetCatalogByDomain1"
    into: "in"
  - from: "SetDictionaryValue1"
    via: "next"
    to: "JoinNode1"
    into: "in3"
  - from: "UpdateWebForm1"
    via: "next"
    to: "ValidateWebForm1"
    into: "in"
  - from: "Call3"
    via: "next"
    to: "Call1"
