flow: "ViewBMEcatExport_32"
kind: "view"

entries:
  - id: "Start1"
    name: "Export"
    mode: "private"
    strict: false
    inputs:
      []
  - id: "Start2"
    name: "SelectCatalog"
    mode: "private"
    strict: false
    inputs:
      []
  - id: "StartNode1"
    name: "Dispatch"
    mode: "private"
    strict: false
    inputs:
      []
  - id: "StartNode2"
    name: "OverwriteFile"
    mode: "private"
    strict: false
    inputs:
      []
  - id: "StartNode3"
    name: "CancelOverwriteFile"
    mode: "private"
    strict: false
    inputs:
      []

steps:
  - id: "Call1"
    type: "call"
    ref: "ViewBMEcatExport-GetProducts"
  - id: "Call2"
    type: "call"
    ref: "ProcessImpexJob-Create"
  - id: "Call3"
    type: "call"
    ref: "ViewBMEcatExport-GetCategories"
  - id: "CallNode1"
    type: "call"
    ref: "ViewBMEcatExport-GetLocale"
  - id: "CallNode2"
    type: "call"
    ref: "ViewBMEcatExport-GetLocale"
  - id: "CallNode3"
    type: "call"
    ref: "ViewBMEcatExport-GetLocale"
  - id: "CallNode4"
    type: "call"
    ref: "ProcessImpexJob-IsFilenameTaken"
    bindings:
      Domain: "CurrentChannel:Domain"
      Filename: "BMEcatExportConfiguration:ExportFile:Value"
  - id: "CallNode5"
    type: "call"
    ref: "ViewBMEcatExport-GetLocale"
  - id: "CreateWebForm1"
    type: "pipelet"
    ref: "CreateWebForm"
    config:
      param.1.name: "ExportFile"
      param.1.required: true
      param.1.rule: "^[^.\\\\/:*?<>|\\s]([^\\\\/:*?<>|\\s]*[^.\\\\/:*?<>|\\s])?$"
      param.2.name: "CatalogDomainName"
      param.2.required: true
      webform-id: "BMEcatExportConfiguration"
      param.2.rule: ""
    bindings:
      WebForm: "BMEcatExportConfiguration"
  - id: "GetCatalogByDomain1"
    type: "pipelet"
    ref: "GetCatalogByDomain"
    bindings:
      CatalogDomainName: "BMEcatExportConfiguration_CatalogDomainName"
  - id: "GetWebForm1"
    type: "pipelet"
    ref: "GetWebForm"
    config:
      webform-id: "BMEcatExportConfiguration"
    bindings:
      WebForm: "BMEcatExportConfiguration"
  - id: "GetWebForm2"
    type: "pipelet"
    ref: "GetWebForm"
    config:
      webform-id: "BMEcatExportConfiguration"
    bindings:
      WebForm: "BMEcatExportConfiguration"
  - id: "GetWebForm3"
    type: "pipelet"
    ref: "GetWebForm"
    config:
      webform-id: "BMEcatExportConfiguration"
    bindings:
      WebForm: "BMEcatExportConfiguration"
  - id: "InteractionEnd2"
    type: "interaction"
  - id: "Join3"
    type: "join"
  - id: "JoinNode1"
    type: "join"
  - id: "JoinNode2"
    type: "join"
  - id: "JoinNode3"
    type: "join"
  - id: "JoinNode4"
    type: "join"
  - id: "Jump1"
    type: "jump"
    ref: "ViewCatalogImpex_32-Status"
  - id: "JumpNode1"
    type: "jump"
    ref: "SecureJump-Start"
  - id: "KeyMapper1"
    type: "pipelet"
    ref: "KeyMapper"
    bindings:
      InValue_1: "CurrentChannel:Domain"
      InValue_2: "CurrentChannel:Domain"
      OutValue_1: "ProcessOwningDomain"
      OutValue_2: "ProcessExecutionDomain"
      InValue_3: "CurrentApplication"
      OutValue_3: "Application"
  - id: "KeyMapper2"
    type: "pipelet"
    ref: "KeyMapper"
    config:
      ValueType: "Form Value"
    bindings:
      InValue_1: "Categories:ID"
      OutValue_1: "CategoriesID"
      InValue_3: "BMEcatExportConfiguration_ExportFile"
      OutValue_3: "SelectedFile"
      InValue_2: "Products:ID"
      OutValue_2: "ProductsID"
      InValue_4: "Locale:LocaleID"
      OutValue_4: "LocaleId"
      InValue_5: "Catalog:UUID"
      OutValue_5: "CatalogUUID"
      InValue_6: "CurrentOrganization:UUID"
      OutValue_6: "SupplyingOrganizationUUID"
  - id: "KeyMapper4"
    type: "pipelet"
    ref: "KeyMapper"
    config:
      ValueType: "Form Value"
    bindings:
      InValue_1: "\"ProcessBMEcatExport\""
      OutValue_1: "ProcessPipelineName"
      InValue_2: "\"Export\""
      OutValue_2: "ProcessPipelineStartNode"
      InValue_3: "\"ProcessCatalogImpex\""
      OutValue_3: "JobName"
  - id: "Pipelet1"
    type: "pipelet"
    ref: "DispatchFormAction"
    config:
      OutValue_0: "ViewBMEcatExport_32-SelectCatalog"
      OutValue_1: "ViewBMEcatExport_32-Export"
      OutValue_2: "ViewCatalogImpex_32-Status"
      OutValue_3: "ViewBMEcatExport_32-OverwriteFile"
      OutValue_4: "ViewBMEcatExport_32-CancelOverwriteFile"
    bindings:
      Key_0: "Start"
      Key_1: "Export"
      Key_2: "Cancel"
      SelectionKey: "JumpTarget"
      Key_3: "Overwrite"
      Key_4: "CancelOverwrite"
  - id: "Pipelet4"
    type: "pipelet"
    ref: "GetCatalogs"
    config:
      CatalogType: "Product Catalog"
      OnlineOnly: "False"
      ProxyFilter: "ON - Exclude Proxy Catalogs"
    bindings:
      Catalogs: "Catalogs"
      OrganizationDomain: "CurrentChannel:Domain"
  - id: "PrepareApplicationView2"
    type: "pipelet"
    ref: "PrepareApplicationView"
    config:
      SelectedMenuItem: "ChannelImportExport"
      WorkingTemplate: "impex/BMEcatExportSelectCatalog_32"
  - id: "SetDictionaryValue1"
    type: "pipelet"
    ref: "SetDictionaryValue"
    config:
      Name: "JumpTarget"
      ValueType: "Dictionary Value"
      Value: "ViewCatalogImpex_32-Status"
  - id: "SetDictionaryValue4"
    type: "pipelet"
    ref: "SetDictionaryValue"
    config:
      Name: "FILENAME_ALREADY_IN_USE"
      Value: true
  - id: "UpdateWebForm1"
    type: "pipelet"
    ref: "UpdateWebForm"
    config:
      mode: "update"
      webform-id: "BMEcatExportConfiguration"
    bindings:
      WebForm: "BMEcatExportConfiguration"
  - id: "UpdateWebForm2"
    type: "pipelet"
    ref: "UpdateWebForm"
    config:
      mode: "update"
      webform-id: "BMEcatExportConfiguration"
    bindings:
      WebForm: "BMEcatExportConfiguration"
  - id: "ValidateWebForm1"
    type: "pipelet"
    ref: "ValidateWebForm"
    bindings:
      WebForm: "BMEcatExportConfiguration"
  - id: "ValidateWebForm2"
    type: "pipelet"
    ref: "ValidateWebForm"
    bindings:
      WebForm: "BMEcatExportConfiguration"

