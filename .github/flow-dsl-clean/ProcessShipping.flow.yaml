flow: "ProcessShipping"
kind: "process"

entries:
  - id: "StartNode0"
    name: "IsDigitalOnly"
    mode: "private"
    strict: true
    inputs:
      - key: "CurrentCartBO"
        type: "com.intershop.component.basket.capi.BasketBO"
        required: true
  - id: "StartNode1"
    name: "PrepareShippingMethodUUID"
    mode: "private"
    strict: false
    inputs:
      []
  - id: "StartNode10"
    name: "ProcessGiftOptionMarkers"
    mode: "private"
    strict: false
    inputs:
      []
  - id: "StartNode12"
    name: "DefaultSettings"
    mode: "private"
    strict: true
    inputs:
      - key: "Cart"
        type: "com.intershop.beehive.bts.capi.orderprocess.basket.Basket"
        required: true
      - key: "User"
        type: "com.intershop.beehive.core.capi.user.User"
        required: true
      - key: "Domain"
        type: "com.intershop.beehive.core.capi.domain.Domain"
        required: true
      - key: "CurrentAppContext"
        type: "com.intershop.beehive.app.capi.AppContext"
        required: false
      - key: "BasketBORepository"
        type: "com.intershop.component.basket.capi.BasketBORepository"
        required: true
  - id: "StartNode13"
    name: "CheckDefaultSettings"
    mode: "private"
    strict: true
    inputs:
      - key: "Cart"
        type: "com.intershop.beehive.bts.capi.orderprocess.basket.Basket"
        required: true
      - key: "BasketBORepository"
        type: "com.intershop.component.basket.capi.BasketBORepository"
        required: true
  - id: "StartNode2"
    name: "SetShippingMethod"
    mode: "private"
    strict: true
    inputs:
      - key: "ShippingMethodUUID"
        type: "java.lang.String"
        required: true
      - key: "ShippingInstruction"
        type: "java.lang.String"
        required: false
      - key: "RequestedDeliveryDate"
        type: "java.lang.String"
        required: false
      - key: "ProductLineItemIDs"
        type: "java.util.HashMap$KeySet"
        required: true
  - id: "StartNode3"
    name: "CreateShippingForm"
    mode: "private"
    strict: false
    inputs:
      []
  - id: "StartNode4"
    name: "PrepareShippingInstruction"
    mode: "private"
    strict: false
    inputs:
      []
  - id: "StartNode5"
    name: "PrepareRequestedDeliveryDate"
    mode: "private"
    strict: false
    inputs:
      []
  - id: "StartNode6"
    name: "ValidateShippingForm"
    mode: "private"
    strict: false
    inputs:
      []
  - id: "StartNode7"
    name: "SetDefaultShippingMethod"
    mode: "private"
    strict: true
    inputs:
      - key: "Basket"
        type: "com.intershop.beehive.bts.capi.orderprocess.basket.Basket"
        required: true
  - id: "StartNode8"
    name: "SetShippingMethods"
    mode: "private"
    strict: false
    inputs:
      - key: "CurrentCartBO"
        type: "com.intershop.component.basket.capi.BasketBO"
        required: false
  - id: "StartNode9"
    name: "StartHook"
    mode: "private"
    strict: true
    inputs:
      - key: "Basket"
        type: "com.intershop.beehive.bts.capi.orderprocess.basket.Basket"
        required: false

steps:
  - id: "AddEntryToMap4"
    type: "pipelet"
    ref: "AddEntryToMap"
    bindings:
      Key: "\"maxLength\""
      Value: "\"180\""
      OutMap: "textLengthRule"
  - id: "AddFormParameterDefinition1"
    type: "pipelet"
    ref: "AddFormParameterDefinition"
    config:
      Type: "java.lang.String"
      Optional: true
    bindings:
      Form: "ShippingForm"
      Validator: "\"ProfanityCheckWebform-ProfanityChecker\""
      Name: "ShippingInstructionFormFieldName"
      ValidateProperties: "ProfanityCheckValidatorParameterMap"
  - id: "AddMultipleEntriesToMap2"
    type: "pipelet"
    ref: "AddMultipleEntriesToMap"
    config:
      Mode: "OverwriteValue"
    bindings:
      Value1: "\"CurrentOrganization:OwningDomain\""
      InMap: "ProfanityCheckValidatorParameterMap"
      Key1: "\"ProfanityCheckConfigurationDomainDictionaryKey\""
      Key2: "\"ProfanityCheckConfigurationID\""
      Value2: "\"Default\""
      OutMap: "ProfanityCheckValidatorParameterMap"
  - id: "AddObjectToVector1"
    type: "pipelet"
    ref: "AddObjectToVector"
    config:
      Mode: "Forbid Duplicates"
    bindings:
      Object: "ProductLineItem"
      InVector: "ProductLineItemsVector"
      Iterator: "ProductLineItems"
      OutVector: "ProductLineItemsVector"
  - id: "AddValidateDefinition1"
    type: "pipelet"
    ref: "AddValidateDefinition"
    bindings:
      Target: "ShippingForm:getParameter(ShippingInstructionFormFieldName)"
      Validator: "\"GlobalValidators-maxlength\""
      ValidationProperties: "textLengthRule"
  - id: "CallNode0"
    type: "call"
    ref: "ProcessShipping-IsDigitalOnly"
  - id: "CallNode1"
    type: "call"
    ref: "ProcessShipping-PrepareShippingMethodUUID"
  - id: "CallNode2"
    type: "call"
    ref: "ProcessShipping-PrepareShippingInstruction"
  - id: "CallNode3"
    type: "call"
    ref: "ProcessShipping-PrepareRequestedDeliveryDate"
  - id: "CallNode4"
    type: "call"
    ref: "ProcessShipping-SetShippingMethod"
    bindings:
      ProductLineItemIDs: "ProductLineItemIDMap:KeySet"
  - id: "CallNode5"
    type: "call"
    ref: "ProcessShipping-SetDefaultShippingMethod"
    bindings:
      Basket: "Cart"
  - id: "CallNode6"
    type: "call"
    ref: "ProcessShipping-CheckDefaultSettings"
  - id: "CallNode7"
    type: "call"
    ref: "ProcessShipping-CreateShippingForm"
  - id: "ConcatenateStrings1"
    type: "pipelet"
    ref: "ConcatenateStrings"
    bindings:
      String0: "\"ShippingInstruction_\""
      String1: "Bucket:ID"
      Concatenated: "ShippingInstructionFormFieldName"
  - id: "ConcatenateStrings2"
    type: "pipelet"
    ref: "ConcatenateStrings"
    bindings:
      String0: "\"ShippingMethodUUID_\""
      String1: "Bucket:ID"
      Concatenated: "ShippingMethodUUIDKey"
  - id: "ConcatenateStrings3"
    type: "pipelet"
    ref: "ConcatenateStrings"
    bindings:
      String0: "\"ShippingForm_ShippingInstruction_\""
      String1: "Bucket:ID"
      Concatenated: "ShippingInstructionKey"
  - id: "ConcatenateStrings6"
    type: "pipelet"
    ref: "ConcatenateStrings"
    config:
      DefaultString0: "giftOption_"
    bindings:
      String1: "PLI:ID"
      Concatenated: "giftOptionMarkerKey"
  - id: "CreateForm1"
    type: "pipelet"
    ref: "CreateForm"
    config:
      FormName: "ShippingForm"
      FormResource: "Shipping"
    bindings:
      Form: "ShippingForm"
  - id: "DecisionNode0"
    type: "decision"
    condition: "Bucket:SelectedBasketShippingMethodBO"
  - id: "DecisionNode1"
    type: "decision"
    condition: "ProductLineItemIDs"
  - id: "DecisionNode10"
