  - id: "DecisionNode2"
    type: "decision"
    condition: "toGiftingOption"
  - id: "DecisionNode3"
    type: "decision"
    condition: "ShippingMethodUUID"
  - id: "DecisionNode4"
    type: "decision"
    condition: "PLI:ShippingMethod"
  - id: "DecisionNode5"
