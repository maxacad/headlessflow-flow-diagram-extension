    to: "KeyMapper3"
    into: "in"
  - from: "KeyMapper3"
    via: "next"
    to: "CallNode1"
    into: "in"
  - from: "SetDictionaryValue2"
    via: "next"
    to: "JoinNode1"
    into: "in3"
  - from: "Start6"
    via: "next"
    to: "KeyMapper4"
    into: "in"
  - from: "Pipelet2"
    via: "next"
    to: "GetOrganizations1"
    into: "in"
  - from: "PrepareApplicationView1"
    via: "next"
    to: "InteractionEnd2"
    into: "in"
  - from: "UpdatePageSize1"
    via: "next"
    to: "CallNode3"
