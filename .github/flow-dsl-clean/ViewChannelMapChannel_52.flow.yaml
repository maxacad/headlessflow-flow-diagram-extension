flow: "ViewChannelMapChannel_52"
kind: "view"

entries:
  - id: "Start1"
    name: "Information"
    mode: "private"
    strict: false
    inputs:
      []
  - id: "Start4"
    name: "Dispatch"
    mode: "private"
    strict: false
    inputs:
      []
  - id: "Start5"
    name: "SelectCustomer"
    mode: "private"
    strict: false
    inputs:
      []
  - id: "Start6"
    name: "EditChannel"
    mode: "private"
    strict: false
    inputs:
      []

steps:
  - id: "Call2"
    type: "call"
    ref: "ProcessChannelPermission-GetAccessRoles"
  - id: "Call3"
    type: "call"
    ref: "ProcessUserList-ByFilter"
  - id: "CallNode1"
    type: "call"
    ref: "ViewChannel-ProcessSelect"
  - id: "CallNode2"
    type: "call"
    ref: "ViewChannel-ProcessSelect"
  - id: "CallNode3"
    type: "call"
    ref: "ProcessGlobalNavigationBar-GetChannelPermissions"
  - id: "DispatchFormAction1"
    type: "pipelet"
    ref: "DispatchFormAction"
    config:
      OutValue_0: "ViewChannelMapChannel_52-EditChannel"
      OutValue_1: "ViewChannelMapChannel_52-SelectCustomer"
      OutValue_2: "ViewChannelMap-ListAll"
    bindings:
      Key_0: "channelEdit"
      Key_1: "customerEdit"
      Key_2: "back"
      SelectionKey: "JumpTarget"
  - id: "ExecuteCountQuery1"
    type: "pipelet"
    ref: "ExecuteCountQuery"
    config:
      QueryName: "user/GetUsersByDomain"
      ParameterName_01: "Domain"
    bindings:
      ParameterValue_01: "Organization:OrganizationDomain"
      Count: "ConsumersCount"
  - id: "GetOrganizations1"
    type: "pipelet"
    ref: "GetOrganizations"
    bindings:
      OrganizationType: "null"
      Owner: "Repository:RepositoryDomain"
  - id: "InteractionEnd2"
    type: "interaction"
  - id: "JoinNode1"
    type: "join"
  - id: "Jump1"
    type: "jump"
    ref: "SecureJump-Start"
  - id: "Jump2"
    type: "jump"
    ref: "ViewUserList_52-List"
  - id: "Jump3"
    type: "jump"
    ref: "ViewOverview-Channel"
  - id: "KeyMapper1"
    type: "pipelet"
    ref: "KeyMapper"
    bindings:
      InValue_1: "AccessRoles"
      InValue_2: "Repository:OwningDomain"
      OutValue_1: "UserGroups"
      OutValue_2: "UserDomain"
  - id: "KeyMapper3"
    type: "pipelet"
    ref: "KeyMapper"
    config:
      ValueType: "Dictionary Value"
    bindings:
      InValue_1: "RepositoryUUID"
      OutValue_1: "ChannelID"
  - id: "KeyMapper4"
    type: "pipelet"
    ref: "KeyMapper"
    config:
      ValueType: "Dictionary Value"
    bindings:
      InValue_1: "RepositoryUUID"
      OutValue_1: "ChannelID"
  - id: "Pipelet1"
    type: "pipelet"
    ref: "GetFirstElementOfIterator"
    bindings:
      Iterator: "Organizations"
      FirstElement: "Organization"
  - id: "Pipelet2"
    type: "pipelet"
    ref: "GetChannelTypeByID"
    bindings:
      ChannelType: "RepositoryType"
      ChannelTypeID: "Repository:TypeCode"
  - id: "PrepareApplicationView1"
    type: "pipelet"
    ref: "PrepareApplicationView"
    config:
      SelectedMenuItem: "ChannelMap"
      WorkingTemplate: "channel/IncChannelInformation_52"
  - id: "SetDictionaryValue1"
    type: "pipelet"
    ref: "SetDictionaryValue"
    config:
      Name: "Filter"
      Value: "ProcessUserList-UserGroupsFilter"
  - id: "SetDictionaryValue2"
    type: "pipelet"
    ref: "SetDictionaryValue"
    config:
      Name: "ConsumersCount"
      Value: 0
  - id: "UpdatePageSize1"
    type: "pipelet"
    ref: "UpdatePageSize"
    config:
      DefaultPageSize: 1000
    bindings:
      PageSize: "null"
      PageableIterator: "Users"

links:
  - from: "GetOrganizations1"
    via: "next"
    to: "Pipelet1"
    into: "in"
  - from: "SetDictionaryValue1"
    via: "next"
    to: "Call3"
    into: "in"
  - from: "ExecuteCountQuery1"
    via: "error"
    to: "SetDictionaryValue2"
    into: "in"
  - from: "CallNode1"
    via: "next"
    to: "Jump2"
    into: "in"
  - from: "KeyMapper4"
    via: "next"
    to: "CallNode2"
    into: "in"
  - from: "CallNode2"
    via: "next"
    to: "Jump3"
    into: "in"
  - from: "CallNode3"
    via: "next"
    to: "PrepareApplicationView1"
    into: "in"
  - from: "Start1"
    via: "next"
    to: "Call2"
    into: "in"
  - from: "Pipelet1"
    via: "next"
    to: "ExecuteCountQuery1"
    into: "in"
  - from: "Call2"
    via: "next"
    to: "Pipelet2"
    into: "in"
  - from: "KeyMapper1"
    via: "next"
    to: "SetDictionaryValue1"
