flow: "ViewOrganization"
kind: "view"

entries:
  - id: "Start1"
    name: "Update"
    mode: "private"
    strict: false
    inputs:
      []
  - id: "Start2"
    name: "Dispatch"
    mode: "private"
    strict: false
    inputs:
      []
  - id: "Start3"
    name: "Edit"
    mode: "private"
    strict: false
    inputs:
      []

steps:
  - id: "Call1"
    type: "call"
    ref: "ProcessSessionLocale-SetLocale"
  - id: "CreateWebForm1"
    type: "pipelet"
    ref: "CreateWebForm"
    config:
      param.1.name: "OrganizationName"
      param.1.required: true
      param.2.name: "OrganizationDescription"
      param.2.required: false
      param.3.name: "OrganizationLocaleID"
      param.3.required: false
      param.4.name: "OrganizationCurrency"
      param.4.required: false
      param.5.required: false
      webform-id: "UpdateOrganization"
  - id: "DetermineLocales1"
    type: "pipelet"
    ref: "DetermineLocales"
  - id: "DispatchFormAction1"
    type: "pipelet"
    ref: "DispatchFormAction"
    config:
      OutValue_0: "ViewOrganization-Update"
      OutValue_1: "ViewOrganization-Edit"
    bindings:
      Key_0: "update"
      Key_1: "edit"
      SelectionKey: "JumpTarget"
  - id: "GetCurrencies1"
    type: "pipelet"
    ref: "GetCurrencies"
    config:
      Method: "Active Currencies"
    bindings:
      Domain: "OrganizationDomain"
  - id: "GetLocale1"
    type: "pipelet"
    ref: "GetLocale"
    config:
      LocaleFallback: "Lead Locale"
    bindings:
      Locale: "LeadLocale"
      LocaleId: "null"
  - id: "GetLocale2"
    type: "pipelet"
    ref: "GetLocale"
    config:
      LocaleFallback: "Lead Locale"
    bindings:
      LocaleId: "null"
      Locale: "LeadLocale"
  - id: "GetLocale3"
    type: "pipelet"
    ref: "GetLocale"
    config:
      LocaleFallback: "Request Locale"
    bindings:
      LocaleId: "null"
  - id: "GetWebForm1"
    type: "pipelet"
    ref: "GetWebForm"
    config:
      webform-id: "UpdateOrganization"
  - id: "InteractionEnd1"
    type: "interaction"
  - id: "Join1"
    type: "join"
  - id: "Join2"
    type: "join"
  - id: "Join3"
    type: "join"
  - id: "Jump1"
    type: "jump"
    ref: "ViewOrganization-Edit"
  - id: "Jump4"
    type: "jump"
    ref: "SecureJump-Start"
  - id: "KeyMapper1"
    type: "pipelet"
    ref: "KeyMapper"
    bindings:
      InValue_1: "WebForm:OrganizationName:Value"
      InValue_2: "WebForm:OrganizationDescription:Value"
      InValue_3: "WebForm:OrganizationLocaleID:Value"
      InValue_4: "WebForm:OrganizationCurrency:Value"
      OutValue_1: "DisplayName"
      OutValue_2: "ShortDescription"
      OutValue_3: "OrganizationPreferredLocale"
      OutValue_4: "OrganizationPreferredCurrency"
  - id: "PrepareApplicationView1"
    type: "pipelet"
    ref: "PrepareApplicationView"
    config:
      SelectedMenuItem: "Organization Profile"
      WorkingTemplate: "organization/OrganizationEdit.isml"
  - id: "SetSessionCurrency1"
    type: "pipelet"
    ref: "SetSessionCurrency"
    bindings:
      CurrencyMnemonic: "OrganizationPreferredCurrency"
  - id: "UpdateOrganization1"
    type: "pipelet"
    ref: "UpdateOrganization"
    bindings:
      Locale: "LeadLocale"
  - id: "UpdateWebForm1"
    type: "pipelet"
    ref: "UpdateWebForm"
    config:
      mode: "update"
      webform-id: "UpdateOrganization"
  - id: "ValidateWebForm1"
    type: "pipelet"
    ref: "ValidateWebForm"

links:
  - from: "PrepareApplicationView1"
    via: "next"
    to: "InteractionEnd1"
    into: "in"
  - from: "ValidateWebForm1"
    via: "error"
    to: "Join2"
    into: "in2"
  - from: "Start2"
    via: "next"
    to: "DispatchFormAction1"
    into: "in"
  - from: "DispatchFormAction1"
    via: "next"
    to: "Jump4"
    into: "in"
  - from: "DetermineLocales1"
    via: "next"
    to: "GetCurrencies1"
    into: "in"
  - from: "GetLocale1"
    via: "next"
    to: "UpdateOrganization1"
    into: "in"
  - from: "Start1"
    via: "next"
    to: "GetWebForm1"
    into: "in"
  - from: "Start3"
    via: "next"
    to: "Join3"
    into: "in1"
  - from: "Join2"
    via: "next"
    to: "DetermineLocales1"
    into: "in"
  - from: "Call1"
    via: "next"
    to: "SetSessionCurrency1"
    into: "in"
  - from: "GetWebForm1"
    via: "next"
    to: "UpdateWebForm1"
    into: "in"
  - from: "SetSessionCurrency1"
    via: "next"
    to: "Join1"
    into: "in1"
  - from: "Join1"
    via: "next"
    to: "Jump1"
    into: "in"
  - from: "SetSessionCurrency1"
    via: "error"
    to: "Join1"
    into: "in3"
  - from: "GetLocale2"
    via: "next"
    to: "PrepareApplicationView1"
    into: "in"
  - from: "GetCurrencies1"
    via: "next"
    to: "GetLocale3"
    into: "in"
  - from: "UpdateOrganization1"
    via: "next"
    to: "Call1"
    into: "in"
  - from: "UpdateWebForm1"
    via: "next"
    to: "ValidateWebForm1"
    into: "in"
  - from: "ValidateWebForm1"
    via: "next"
    to: "KeyMapper1"
    into: "in"
  - from: "GetWebForm1"
    via: "error"
    to: "Join3"
    into: "in2"
  - from: "KeyMapper1"
    via: "next"
    to: "GetLocale1"
    into: "in"
  - from: "GetLocale3"
    via: "next"
    to: "GetLocale2"
    into: "in"
  - from: "CreateWebForm1"
    via: "next"
    to: "Join2"
    into: "in1"
  - from: "Join3"
    via: "next"
    to: "CreateWebForm1"
    into: "in"
