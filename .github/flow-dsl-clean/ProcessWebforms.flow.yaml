    bindings:
      ID: "\"US\""
  - id: "GetIndirectDictValue1"
    type: "pipelet"
    ref: "GetIndirectDictValue"
    bindings:
      KeyNameHolder: "CountryCodeName"
      MappedEntry: "CountryCode"
  - id: "GetIndirectDictValue2"
    type: "pipelet"
    ref: "GetIndirectDictValue"
    bindings:
      KeyNameHolder: "CountryCodeName"
      MappedEntry: "CountryCode"
  - id: "GetIndirectDictValue3"
