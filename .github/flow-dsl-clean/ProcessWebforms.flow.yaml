flow: "ProcessWebforms"
kind: "process"

entries:
  - id: "StartNode1"
    name: "CreateCountrySpecificForm"
    mode: "private"
    strict: true
    inputs:
      - key: "FormName"
        type: "java.lang.String"
        required: true
      - key: "FormAlias"
        type: "java.lang.String"
        required: false
      - key: "CountryCode"
        type: "java.lang.String"
        required: false
      - key: "WebformPrefix"
        type: "java.lang.String"
        required: true
      - key: "ConfigurationPrefix"
        type: "java.lang.String"
        required: true
  - id: "StartNode2"
    name: "GetStates"
    mode: "private"
    strict: true
    inputs:
      - key: "CountryCode"
        type: "java.lang.String"
        required: false
  - id: "StartNode23"
    name: "GetWebFormInfosForCountry"
    mode: "private"
    strict: true
    inputs:
      - key: "CountryCode"
        type: "java.lang.String"
        required: false
      - key: "AddressFormPrefix"
        type: "java.lang.String"
        required: true
      - key: "ConfigurationPrefix"
        type: "java.lang.String"
        required: true
  - id: "StartNode3"
    name: "CreateRegisterFullAddressForm"
    mode: "private"
    strict: true
    inputs:
      - key: "FormName"
        type: "java.lang.String"
        required: true
      - key: "FormAlias"
        type: "java.lang.String"
        required: false
      - key: "Dictionary"
        type: "com.intershop.beehive.core.capi.pipeline.PipelineDictionary"
        required: true
  - id: "StartNode4"
    name: "CreateAccountAddressForm"
    mode: "private"
    strict: true
    inputs:
      - key: "FormName"
        type: "java.lang.String"
        required: true
      - key: "FormAlias"
        type: "java.lang.String"
        required: false
      - key: "Dictionary"
        type: "com.intershop.beehive.core.capi.pipeline.PipelineDictionary"
        required: true
  - id: "StartNode5"
    name: "CreateAddressForm"
    mode: "private"
    strict: true
    inputs:
      - key: "FormName"
        type: "java.lang.String"
        required: true
      - key: "FormAlias"
        type: "java.lang.String"
        required: false
      - key: "Dictionary"
        type: "com.intershop.beehive.core.capi.pipeline.PipelineDictionary"
        required: true

steps:
  - id: "CallNode1"
    type: "call"
    ref: "This:GetWebFormInfosForCountry"
    bindings:
      AddressFormPrefix: "WebformPrefix"
  - id: "CallNode11"
    type: "call"
    ref: "ProcessWebforms-GetStates"
    bindings:
      CountryCode: "CountryCode"
  - id: "CallNode2"
    type: "call"
    ref: "ProcessWebforms-CreateCountrySpecificForm"
    bindings:
      WebformPrefix: "\"Address\""
      ConfigurationPrefix: "\"WebFormSelectorSuffix\""
  - id: "CallNode3"
    type: "call"
    ref: "ProcessWebforms-CreateCountrySpecificForm"
    bindings:
      WebformPrefix: "\"RegistrationAddress\""
      ConfigurationPrefix: "\"WebFormSelectorSuffix\""
  - id: "CallNode4"
    type: "call"
    ref: "ProcessWebforms-CreateCountrySpecificForm"
    bindings:
      WebformPrefix: "\"AccountAddress\""
      ConfigurationPrefix: "\"WebFormSelectorSuffix\""
  - id: "ConcatenateStrings1"
    type: "pipelet"
    ref: "ConcatenateStrings"
    config:
      DefaultString1: "."
    bindings:
      String0: "ConfigurationPrefix"
      String2: "CountryCode"
      Concatenated: "WebFormSelectorName"
  - id: "ConcatenateStrings2"
    type: "pipelet"
    ref: "ConcatenateStrings"
    config:
      DefaultString2: "_CountryCode"
      DefaultString0: "Dictionary:"
    bindings:
      String1: "FormAlias"
      Concatenated: "CountryCodeName"
  - id: "ConcatenateStrings3"
    type: "pipelet"
    ref: "ConcatenateStrings"
    bindings:
      String1: "WebFormSelectorSuffix"
      String0: "AddressFormPrefix"
      Concatenated: "WebFormFileName"
  - id: "ConcatenateStrings4"
    type: "pipelet"
    ref: "ConcatenateStrings"
    config:
      DefaultString2: "_CountryCode"
      DefaultString0: "Dictionary:"
    bindings:
      String1: "FormAlias"
      Concatenated: "CountryCodeName"
  - id: "ConcatenateStrings5"
    type: "pipelet"
    ref: "ConcatenateStrings"
    config:
      DefaultString2: "_CountryCode"
      DefaultString0: "Dictionary:"
    bindings:
      String1: "FormAlias"
      Concatenated: "CountryCodeName"
  - id: "CreateForm2"
    type: "pipelet"
    ref: "CreateForm"
    bindings:
      FormResource: "WebFormFileName"
  - id: "DecisionNode1"
    type: "decision"
    condition: "CountryCode"
  - id: "DecisionNode16"
    type: "decision"
    condition: "StatesProvinces"
  - id: "DecisionNode17"
    type: "decision"
    condition: "CountryCode"
  - id: "DecisionNode2"
    type: "decision"
    condition: "CountryCode"
  - id: "DecisionNode3"
    type: "decision"
    condition: "Dictionary:Address"
  - id: "DecisionNode4"
    type: "decision"
    condition: "Dictionary:Address"
  - id: "DecisionNode5"
    type: "decision"
    condition: "CountryCode"
  - id: "DecisionNode9"
    type: "decision"
    condition: "WebFormSelectorSuffix"
  - id: "EndNode1"
    type: "end"
    strict: true
    outputs:
      - key: "Form"
        type: "com.intershop.beehive.core.capi.webform.Form"
        guaranteed: true
      - key: "WebFormFileName"
        type: "java.lang.String"
        guaranteed: true
  - id: "EndNode13"
    type: "end"
    strict: true
    outputs:
      - key: "WebFormFileName"
        type: "java.lang.String"
        guaranteed: true
  - id: "EndNode14"
    type: "end"
    strict: true
    outputs:
      - key: "Form"
        type: "com.intershop.beehive.core.capi.webform.Form"
        guaranteed: true
      - key: "ShippingCountries"
        type: "java.util.Iterator"
        guaranteed: false
      - key: "WebFormFileName"
        type: "java.lang.String"
        guaranteed: true
  - id: "EndNode2"
    type: "end"
    strict: true
    outputs:
      - key: "StatesProvinces"
        type: "com.intershop.beehive.core.capi.paging.PageableIterator"
        guaranteed: true
  - id: "EndNode3"
    type: "end"
    strict: true
  - id: "EndNode4"
    type: "end"
    strict: true
