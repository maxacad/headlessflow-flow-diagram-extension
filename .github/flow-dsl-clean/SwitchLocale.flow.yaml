flow: "SwitchLocale"
kind: "view"

entries:
  - id: "StartNode1"
    name: "Start"
    mode: "private"
    strict: false
    inputs:
      []
  - id: "StartNode2"
    name: "Language"
    mode: "private"
    strict: false
    inputs:
      []

steps:
  - id: "CallNode1"
    type: "call"
    ref: "ProcessCart-Calculate"
    bindings:
      Cart: "Basket"
  - id: "CallNode3"
    type: "call"
    ref: "ProcessCart-RemoveWarrantiesWithoutPrice"
  - id: "CallNode5"
    type: "call"
    ref: "ProcessCart-Calculate"
    bindings:
      Cart: "Basket"
  - id: "DecisionNode1"
    type: "decision"
    condition: "LocaleID"
  - id: "DecisionNode2"
    type: "decision"
    condition: "Basket"
  - id: "DecisionNode5"
    type: "decision"
    condition: "LocaleID"
  - id: "GetBasket1"
    type: "pipelet"
    ref: "GetBasket"
    config:
      BasketType: "REQUISITION"
    bindings:
      CurrentDomain: "CurrentOrganization:Domain"
  - id: "GetBasketBO1"
    type: "pipelet"
    ref: "GetBasketBO"
  - id: "GetDomainPreference2"
    type: "pipelet"
    ref: "GetDomainPreference"
    config:
      DefaultPreferenceKey: "TaxationPolicy"
      Type: "Integer"
    bindings:
      PreferenceDomain: "CurrentOrganization:OwningDomain"
      PreferenceIntValue: "TaxationPolicy"
  - id: "GetLocale1"
    type: "pipelet"
    ref: "GetLocale"
    bindings:
      LocaleId: "LocaleID"
  - id: "GetLocale2"
    type: "pipelet"
    ref: "GetLocale"
    bindings:
      LocaleId: "LocaleID"
  - id: "JoinNode1"
    type: "join"
  - id: "JoinNode2"
    type: "join"
  - id: "JoinNode3"
    type: "join"
  - id: "JoinNode4"
    type: "join"
  - id: "JoinNode5"
    type: "join"
  - id: "JoinNode8"
    type: "join"
  - id: "JumpNode2"
    type: "jump"
    ref: "ViewHomepage-DisplayCachedHomepage"
  - id: "JumpNode3"
    type: "jump"
    ref: "Redirect-Start"
  - id: "KeyMapper1"
    type: "pipelet"
    ref: "KeyMapper"
    bindings:
      InValue_1: "ApplicationBO:Extension(\"Basket\"):getBasketBORepository(CurrentDomain)"
      OutValue_1: "BasketBORepository"
  - id: "SetSessionCurrency1"
    type: "pipelet"
    ref: "SetSessionCurrency"
    bindings:
      CurrencyMnemonic: "Locale:CurrencyCode"
  - id: "SwitchLocale1"
    type: "pipelet"
    ref: "SwitchLocale"
    bindings:
      LocaleID: "Locale:LocaleID"
  - id: "SwitchLocale2"
    type: "pipelet"
    ref: "SwitchLocale"
    bindings:
      LocaleID: "Locale:LocaleID"

links:
  - from: "SetSessionCurrency1"
    via: "next"
    to: "GetBasket1"
    into: "in"
  - from: "CallNode1"
    via: "next"
    to: "KeyMapper1"
    into: "in"
  - from: "DecisionNode2"
    via: "yes"
    to: "GetDomainPreference2"
    into: "in"
  - from: "DecisionNode2"
    via: "no"
    to: "JoinNode3"
    into: "in2"
  - from: "GetBasketBO1"
    via: "next"
    to: "CallNode3"
    into: "in"
  - from: "GetDomainPreference2"
    via: "next"
    to: "CallNode1"
    into: "in"
  - from: "JoinNode8"
    via: "next"
    to: "JumpNode3"
    into: "in"
  - from: "DecisionNode5"
    via: "no"
    to: "JoinNode2"
    into: "in1"
  - from: "GetLocale1"
    via: "next"
    to: "SwitchLocale1"
    into: "in"
  - from: "StartNode2"
    via: "next"
    to: "DecisionNode1"
    into: "in"
  - from: "SwitchLocale1"
    via: "next"
    to: "SetSessionCurrency1"
    into: "in"
  - from: "GetLocale2"
    via: "next"
    to: "SwitchLocale2"
    into: "in"
  - from: "StartNode1"
    via: "next"
    to: "DecisionNode5"
    into: "in"
  - from: "JoinNode3"
    via: "next"
    to: "JoinNode5"
    into: "in1"
  - from: "CallNode3"
    via: "next"
    to: "CallNode5"
    into: "in"
  - from: "JoinNode5"
    via: "next"
    to: "JoinNode8"
    into: "in2"
  - from: "GetBasket1"
    via: "next"
    to: "DecisionNode2"
    into: "in"
  - from: "KeyMapper1"
    via: "next"
    to: "GetBasketBO1"
    into: "in"
  - from: "JoinNode2"
    via: "next"
    to: "JoinNode4"
    into: "in1"
  - from: "DecisionNode5"
    via: "yes"
    to: "GetLocale1"
    into: "in"
  - from: "GetBasket1"
    via: "error"
    to: "JoinNode4"
    into: "in2"
  - from: "CallNode5"
    via: "next"
    to: "JoinNode8"
    into: "in1"
  - from: "JoinNode4"
    via: "next"
    to: "JoinNode3"
    into: "in1"
  - from: "GetDomainPreference2"
    via: "error"
    to: "JoinNode5"
    into: "in2"
  - from: "SetSessionCurrency1"
    via: "error"
    to: "JoinNode2"
    into: "in2"
  - from: "SwitchLocale2"
    via: "next"
    to: "JoinNode1"
    into: "in1"
  - from: "DecisionNode1"
    via: "yes"
    to: "GetLocale2"
    into: "in"
  - from: "JoinNode1"
    via: "next"
    to: "JumpNode2"
    into: "in"
  - from: "DecisionNode1"
    via: "no"
    to: "JoinNode1"
    into: "in2"
