    via: "error"
    to: "Join5"
    into: "in2"
  - from: "RemoveJobInteractor2"
    via: "next"
    to: "Decision4"
    into: "in"
  - from: "WriteImpexLogMessage1"
    via: "next"
    to: "JoinNode1"
