flow: "ProcessExport"
kind: "process"

entries:
  - id: "Start1"
    name: "Prepare"
    mode: "private"
    strict: false
    inputs:
      []
  - id: "Start2"
    name: "RunExport"
    mode: "private"
    strict: false
    inputs:
      - key: "StoreName"
        type: "java.lang.String"
        required: false
      - key: "Interactor"
        type: "com.intershop.beehive.core.capi.impex.ImpexInteractor"
        required: false
      - key: "objects"
        type: "com.intershop.beehive.core.bos.util.IObjectRetriever"
        required: false
  - id: "Start3"
    name: "Export"
    mode: "private"
    strict: false
    inputs:
      []
  - id: "Start4"
    name: "Cleanup"
    mode: "private"
    strict: false
    inputs:
      []
  - id: "Start5"
    name: "Error"
    mode: "private"
    strict: false
    inputs:
      []

steps:
  - id: "Call1"
    type: "call"
    ref: "ProcessExport-Cleanup"
  - id: "Call2"
    type: "call"
    ref: "ProcessExport-RunExport"
  - id: "Call3"
    type: "call"
    ref: "ProcessExport-Prepare"
  - id: "Call4"
    type: "call"
    ref: "ProcessImpexJob-Finish"
  - id: "Call5"
    type: "call"
    ref: "ProcessExport-Error"
  - id: "Call6"
    type: "call"
    ref: "ProcessImpexJob-Finish"
  - id: "Call7"
    type: "call"
    ref: "ProcessExport-Error"
  - id: "CloseFile1"
    type: "pipelet"
    ref: "CloseFile"
    config:
      PipeletID: "CloseXMLFile1"
      StreamID: "target"
      UIDescription: "CloseExportFile"
  - id: "CloseFile2"
    type: "pipelet"
    ref: "CloseFile"
    config:
      PipeletID: "CloseXMLFile1"
      StreamID: "target"
      UIDescription: "CloseExportFile"
      Delete: true
  - id: "CloseFilter1"
    type: "pipelet"
    ref: "CloseFilter"
    config:
      FilterID: "targetfilter"
      PipeletID: "CloseFilter1"
  - id: "CloseFilter2"
    type: "pipelet"
    ref: "CloseFilter"
    config:
      FilterID: "targetfilter"
      PipeletID: "CloseFilter1"
  - id: "CloseLoggers1"
    type: "pipelet"
    ref: "CloseLoggers"
    config:
      PipeletID: "CloseLoggers1"
      UIDescription: "CloseLoggers"
  - id: "CloseLoggers2"
    type: "pipelet"
    ref: "CloseLoggers"
    config:
      PipeletID: "CloseLoggers1"
      UIDescription: "CloseLoggers"
  - id: "ConcatenateStrings1"
    type: "pipelet"
    ref: "ConcatenateStrings"
    config:
      DefaultString2: "/"
    bindings:
      Concatenated: "ExportPath"
      String1: "ExportDirectory"
      String3: "SelectedFile"
  - id: "ConcatenateStrings2"
    type: "pipelet"
    ref: "ConcatenateStrings"
    config:
      DefaultString2: ".log"
    bindings:
      Concatenated: "LogFile"
      String1: "JobConfiguration:UUID"
  - id: "CreateDirectory1"
    type: "pipelet"
    ref: "CreateDirectory"
    config:
      DefaultDirectoryPath: "export"
      UnitDirectory: "IMPEX_DIR"
    bindings:
      DirectoryName: "ExportDirectory"
      UnitDomain: "JobConfiguration:Domain"
  - id: "CreateFileLogger2"
    type: "pipelet"
    ref: "CreateFileLogger"
    config:
      BufferSize: 1024
      Facility: "default"
      FlushTime: 0
      Level: "ERROR | WARN"
      PipeletID: "CreateFileLogger1"
      RolloverSize: 1024000
      UIDescription: "CreateFileLogger"
    bindings:
      File: "LogFile"
  - id: "CreateImpexUnitFileStructure2"
    type: "pipelet"
    ref: "CreateImpexUnitFileStructure"
  - id: "CreateJobInteractor1"
    type: "pipelet"
    ref: "CreateJobInteractor"
  - id: "Decision2"
    type: "decision"
    condition: "JobConfiguration"
  - id: "Decision4"
    type: "decision"
    condition: "JobConfiguration"
  - id: "DetermineConfiguration2"
    type: "pipelet"
    ref: "DetermineConfiguration"
    config:
      Controller.Class: "com.intershop.beehive.core.capi.impex.Controller"
      PerformAccessControl: false
      PipeletID: "DetermineConfiguration1"
      UIDescription: "DetermineConfiguration"
  - id: "End1"
    type: "end"
    strict: false
  - id: "End2"
    type: "end"
    strict: false
  - id: "End4"
    type: "end"
    strict: false
  - id: "End5"
    type: "end"
    strict: false
  - id: "End6"
    type: "end"
    strict: false
  - id: "Export1"
    type: "pipelet"
    ref: "Export"
    config:
      PipeletID: "Export1"
      TargetID: "targetfilter"
      UIDescription: "XMLExport"
  - id: "GetJobConfiguration1"
    type: "pipelet"
    ref: "GetJobConfiguration"
    bindings:
      JobUUID: "JobConfigurationUUID"
  - id: "GetPageable1"
    type: "pipelet"
    ref: "GetPageable"
    bindings:
      PageableID: "ObjectsID"
      Pageable: "Objects"
  - id: "Join1"
    type: "join"
  - id: "Join10"
    type: "join"
  - id: "Join12"
    type: "join"
  - id: "Join13"
    type: "join"
  - id: "Join2"
    type: "join"
  - id: "Join4"
    type: "join"
  - id: "Join5"
    type: "join"
  - id: "Join6"
    type: "join"
  - id: "Join7"
    type: "join"
  - id: "Join8"
    type: "join"
  - id: "Join9"
    type: "join"
  - id: "JoinNode1"
    type: "join"
  - id: "OpenFile1"
    type: "pipelet"
    ref: "OpenFile"
    config:
      PipeletID: "OpenXMLFileOrderExport1"
      StreamID: "target"
      Type: "TARGET"
      UIDescription: "OpenExportFile"
    bindings:
      File: "ExportPath"
  - id: "OpenFilter1"
    type: "pipelet"
    ref: "OpenFilter"
    config:
      Filter.Class: "com.intershop.beehive.core.internal.impex.XMLExportFilter"
      FilterID: "targetfilter"
      PipeletID: "OpenFilter1"
      TargetID: "target"
  - id: "RemoveJobInteractor1"
    type: "pipelet"
    ref: "RemoveJobInteractor"
  - id: "RemoveJobInteractor2"
    type: "pipelet"
    ref: "RemoveJobInteractor"
  - id: "Stop1"
    type: "stop"
  - id: "Stop2"
    type: "stop"
  - id: "UpdateCustomAttribute1"
    type: "pipelet"
    ref: "UpdateCustomAttribute"
    config:
      DefaultAttributeName: "FinishedWithError"
      DefaultAttributeType: "String"
      DefaultAttributeValue: true
    bindings:
      ExtensibleObject: "JobConfiguration"
  - id: "WriteImpexLogMessage1"
    type: "pipelet"
    ref: "WriteImpexLogMessage"
    config:
      PipeletID: "LogTemplateError"
    bindings:
      MessageKey: "\"core.impex.pipelet.Export_E_TEMPLATEPROCESSOR\""
      Level: "\"ERROR\""
      Parameter0: "Exception"

