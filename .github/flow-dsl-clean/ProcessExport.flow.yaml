    to: "End6"
    into: "in"
  - from: "Export1"
    via: "error"
    to: "CloseFilter2"
    into: "in"
  - from: "Join1"
    via: "next"
    to: "RemoveJobInteractor1"
    into: "in"
  - from: "Start3"
