flow: "ViewChannelList"
kind: "view"

entries:
  - id: "Start1"
    name: "ListAll"
    mode: "private"
    strict: false
    inputs:
      []
  - id: "Start2"
    name: "Paging"
    mode: "private"
    strict: false
    inputs:
      []
  - id: "Start3"
    name: "Delete"
    mode: "private"
    strict: false
    inputs:
      []
  - id: "Start5"
    name: "Dispatch"
    mode: "private"
    strict: false
    inputs:
      []

steps:
  - id: "Call1"
    type: "call"
    ref: "ProcessClipboard-Update"
  - id: "Call3"
    type: "call"
    ref: "ProcessClipboard-DeleteAllEntries"
  - id: "Call4"
    type: "call"
    ref: "ProcessChannel-Delete"
  - id: "Call5"
    type: "call"
    ref: "ProcessChannelList-ListAll"
  - id: "Call6"
    type: "call"
    ref: "ProcessClipboard-Get"
  - id: "Call7"
    type: "call"
    ref: "ProcessChannelPermission-RemoveAllAccessRoles"
  - id: "CallNode1"
    type: "call"
    ref: "ProcessPersonalizationGroup-Update"
  - id: "Decision1"
    type: "decision"
    condition: "PageNumber"
  - id: "DispatchFormAction2"
    type: "pipelet"
    ref: "DispatchFormAction"
    config:
      OutValue_0: "ViewChannelList-Paging"
      OutValue_1: "ViewChannelList-Delete"
      OutValue_2: "ViewChannel-New"
      OutValue_3: "ViewChannelList-Paging"
      PagingPipeline: "ViewChannelList-Paging"
    bindings:
      Key_0: "confirmDelete"
      Key_1: "delete"
      Key_2: "new"
      Key_3: "cancelDelete"
      SelectionKey: "JumpTarget"
  - id: "GetChannelTypes1"
    type: "pipelet"
    ref: "GetChannelTypes"
  - id: "GetPageLocator1"
    type: "pipelet"
    ref: "GetPageLocator"
    config:
      RestorePageLocatorDictionary: "True"
  - id: "GetPageable1"
    type: "pipelet"
    ref: "GetPageable"
    bindings:
      Pageable: "Repositories"
      PageableID: "PageLocator:PageableID"
  - id: "InteractionEnd1"
    type: "interaction"
  - id: "Join1"
    type: "join"
  - id: "Join2"
    type: "join"
  - id: "Join3"
    type: "join"
  - id: "Join5"
    type: "join"
  - id: "JoinNode1"
    type: "join"
  - id: "Jump1"
    type: "jump"
    ref: "ViewChannelList-ListAll"
  - id: "Jump6"
    type: "jump"
    ref: "SecureJump-Start"
  - id: "KeyMapper1"
    type: "pipelet"
    ref: "KeyMapper"
    bindings:
      OutValue_1: "PermissionType"
      InValue_1: "\"User\""
      OutValue_2: "UserID"
      InValue_2: "CurrentUserProfile:UUID"
  - id: "Loop1"
    type: "loop"
  - id: "PrepareApplicationView1"
    type: "pipelet"
    ref: "PrepareApplicationView"
    config:
      SelectedMenuItem: "Channels"
      WorkingTemplate: "channel/ChannelList.isml"
  - id: "SetPage1"
    type: "pipelet"
    ref: "SetPage"
    bindings:
      Pageable: "Repositories"
  - id: "SetPage2"
    type: "pipelet"
    ref: "SetPage"
    config:
      DefaultPageNumber: 0
    bindings:
      PageNumber: "PageLocator:PageNumber"
      Pageable: "Repositories"
  - id: "SetPageLocator1"
    type: "pipelet"
    ref: "SetPageLocator"
    config:
      DefaultHandlerPipeline: "ViewChannelList-Paging"
      DefaultPageLocatorName: "ChannelList"
    bindings:
      Pageable: "Repositories"
  - id: "UpdatePageSize1"
    type: "pipelet"
    ref: "UpdatePageSize"
    config:
      DefaultPageSize: 15
    bindings:
      PageSize: "null"
      PageableIterator: "Repositories"
  - id: "VerifyInteger1"
    type: "pipelet"
    ref: "VerifyInteger"
    bindings:
      IntegerObject: "PageNumber"
      Locale: "null"
      LocalizedString: "PageNumber"
      Pattern: "null"

links:
  - from: "PrepareApplicationView1"
    via: "next"
    to: "InteractionEnd1"
    into: "in"
  - from: "GetPageable1"
    via: "error"
    to: "Join5"
    into: "in2"
  - from: "GetPageable1"
    via: "next"
    to: "Join3"
    into: "in2"
  - from: "Decision1"
    via: "no"
    to: "SetPage2"
    into: "in"
  - from: "SetPage1"
    via: "next"
    to: "Join1"
    into: "in2"
  - from: "Decision1"
    via: "yes"
    to: "VerifyInteger1"
    into: "in"
  - from: "VerifyInteger1"
    via: "next"
    to: "SetPage1"
    into: "in"
  - from: "SetPage2"
    via: "next"
    to: "Join1"
    into: "in3"
  - from: "VerifyInteger1"
    via: "error"
    to: "Join1"
    into: "in1"
  - from: "Join3"
    via: "next"
    to: "Decision1"
    into: "in"
  - from: "Join1"
    via: "next"
    to: "SetPageLocator1"
    into: "in"
  - from: "Start1"
    via: "next"
    to: "Call3"
    into: "in"
  - from: "SetPageLocator1"
    via: "next"
    to: "GetChannelTypes1"
    into: "in"
  - from: "Join2"
    via: "next"
    to: "Loop1"
    into: "loop"
  - from: "Loop1"
    via: "next"
    to: "CallNode1"
    into: "in"
  - from: "Start3"
    via: "next"
    to: "Call6"
    into: "in"
  - from: "Call7"
    via: "ERROR"
    to: "JoinNode1"
    into: "in1"
  - from: "Call4"
    via: "ERROR"
    to: "Join2"
    into: "in1"
  - from: "Call6"
    via: "next"
    to: "KeyMapper1"
    into: "in"
  - from: "Join5"
    via: "next"
    to: "Call5"
    into: "in"
  - from: "Call5"
    via: "next"
    to: "UpdatePageSize1"
    into: "in"
  - from: "GetChannelTypes1"
    via: "next"
    to: "PrepareApplicationView1"
    into: "in"
  - from: "UpdatePageSize1"
    via: "next"
    to: "Join3"
    into: "in1"
  - from: "CallNode1"
    via: "next"
    to: "Jump1"
    into: "in"
  - from: "Call4"
    via: "next"
    to: "Join2"
    into: "in1"
  - from: "Call7"
    via: "next"
    to: "JoinNode1"
    into: "in2"
  - from: "KeyMapper1"
    via: "next"
    to: "Loop1"
    into: "in"
  - from: "JoinNode1"
    via: "next"
    to: "Call4"
    into: "in"
  - from: "Loop1"
    via: "do"
    to: "Call7"
    into: "in"
  - from: "Start5"
    via: "next"
    to: "DispatchFormAction2"
    into: "in"
  - from: "DispatchFormAction2"
    via: "next"
    to: "Jump6"
    into: "in"
  - from: "GetPageLocator1"
    via: "next"
    to: "GetPageable1"
    into: "in"
  - from: "Call1"
    via: "next"
    to: "GetPageLocator1"
    into: "in"
  - from: "Start2"
    via: "next"
    to: "Call1"
    into: "in"
  - from: "Call3"
    via: "next"
    to: "Join5"
    into: "in1"
