flow: "ProcessProductSharing"
kind: "process"

entries:
  - id: "StartNode1"
    name: "DetermineDependentOrganizationsFromPartnerChannel"
    mode: "private"
    strict: true
    inputs:
      - key: "PartnerChannel"
        type: "com.intershop.component.mvc.capi.catalog.Repository"
        required: false
  - id: "StartNode10"
    name: "DetermineDependentOrganizations"
    mode: "private"
    strict: true
    inputs:
      - key: "MasterRepository"
        type: "com.intershop.component.mvc.capi.catalog.Repository"
        required: false
      - key: "Organizations"
        type: "java.util.Vector"
        required: false
  - id: "StartNode12"
    name: "CreateChannelSearchParameters"
    mode: "private"
    strict: true
    inputs:
      - key: "SearchChannelID"
        type: "java.lang.String"
        required: false
      - key: "SearchOrganizationID"
        type: "java.lang.String"
        required: false
  - id: "StartNode2"
    name: "DetermineAllProductsProductSet"
    mode: "private"
    strict: true
    inputs:
      - key: "Domain"
        type: "com.intershop.beehive.core.capi.domain.Domain"
        required: true
  - id: "StartNode3"
    name: "DetermineNoProductsProductSet"
    mode: "private"
    strict: true
    inputs:
      - key: "Domain"
        type: "com.intershop.beehive.core.capi.domain.Domain"
        required: true
  - id: "StartNode4"
    name: "DetermineChannelSharingType"
    mode: "private"
    strict: true
    inputs:
      - key: "Domain"
        type: "com.intershop.beehive.core.capi.domain.Domain"
        required: true
      - key: "Channel"
        type: "com.intershop.component.mvc.capi.catalog.Repository"
        required: true
  - id: "StartNode5"
    name: "CheckIsSharingEnableForChannel"
    mode: "private"
    strict: true
    inputs:
      - key: "RepositoryDomain"
        type: "com.intershop.beehive.core.capi.domain.Domain"
        required: false
  - id: "StartNode6"
    name: "TriggerUnshareConsequences"
    mode: "private"
    strict: true
    inputs:
      - key: "SingleProduct"
        type: "com.intershop.beehive.xcs.capi.product.Product"
        required: false
      - key: "MultipleProducts"
        type: "java.util.Collection"
        required: false
      - key: "FromSingleDomain"
        type: "com.intershop.beehive.core.capi.domain.Domain"
        required: false
      - key: "FromMultipleDomains"
        type: "java.util.Collection"
        required: false
      - key: "SourceDomain"
        type: "com.intershop.beehive.core.capi.domain.Domain"
        required: true
  - id: "StartNode7"
    name: "RemoveAllPEPAs"
    mode: "private"
    strict: true
    inputs:
      - key: "TargetRepository"
        type: "com.intershop.component.mvc.capi.catalog.Repository"
        required: true
      - key: "SourceRepository"
        type: "com.intershop.component.mvc.capi.catalog.Repository"
        required: true

steps:
  - id: "AddObjectToVector1"
    type: "pipelet"
    ref: "AddObjectToVector"
    bindings:
      OutVector: "Organizations"
      InVector: "Organizations"
      Object: "Organization"
      Objects: "null"
  - id: "AddObjectToVector2"
    type: "pipelet"
    ref: "AddObjectToVector"
    bindings:
      OutVector: "Organizations"
      InVector: "Organizations"
      Object: "null"
      Objects: "null"
  - id: "AddObjectToVector3"
    type: "pipelet"
    ref: "AddObjectToVector"
    bindings:
      OutVector: "Repositories"
      Object: "PartnerChannel"
      Objects: "null"
      InVector: "null"
  - id: "AddObjectToVector4"
    type: "pipelet"
    ref: "AddObjectToVector"
    bindings:
      OutVector: "Organizations"
      InVector: "null"
      Object: "null"
      Objects: "null"
  - id: "AddObjectToVector5"
    type: "pipelet"
    ref: "AddObjectToVector"
    config:
      Mode: "Forbid Duplicates"
    bindings:
      Object: "SingleProduct"
      Iterator: "ProductsIterator"
      Objects: "MultipleProducts"
  - id: "AddObjectToVector6"
    type: "pipelet"
    ref: "AddObjectToVector"
    config:
      Mode: "Forbid Duplicates"
    bindings:
      Object: "FromSingleDomain"
      Iterator: "FromDomainsIterator"
      Objects: "FromMultipleDomains"
  - id: "CallNode1"
    type: "call"
    ref: "ProcessProductConfigurationParameters-ProcessUnshare"
    bindings:
      TargetDomains: "FromDomainsIterator"
      SourceDomain: "SourceDomain"
      UnsharedProducts: "ProductsIterator"
  - id: "CallNode2"
    type: "call"
    ref: "ProcessPageletEntryPoint-DeletePageletEntryPointsByObject"
    bindings:
      ContextObject: "Product"
      Site: "CurrentDomain"
      Domain: "FromDomain"
  - id: "CallNode22"
    type: "call"
    ref: "ProcessPageletEntryPoint-DeletePageletEntryPointsByObject"
    bindings:
      Domain: "TargetRepository:RepositoryDomain"
      ContextObject: "Product"
      Site: "CurrentDomain"
  - id: "CallNode27"
    type: "call"
    ref: "ProcessProductDeletion-ProcessProductAlert"
    bindings:
      Product: "Product2"
  - id: "CallNode6"
    type: "call"
    ref: "ProcessProductSharing-DetermineDependentOrganizations"
    bindings:
      MasterRepository: "PartnerMasterRepository"
  - id: "CreateProductSet1"
    type: "pipelet"
    ref: "CreateProductSet"
    config:
      ProductSetType: "all"
    bindings:
      ProductSet: "AllProductsProductSet"
  - id: "CreateProductSet2"
    type: "pipelet"
    ref: "CreateProductSet"
    config:
      ProductSetType: "nothing"
    bindings:
      ProductSet: "NoProductsProductSet"
  - id: "CreateProductSharingHelper1"
    type: "pipelet"
    ref: "CreateProductSharingHelper"
    bindings:
      Domain: "RepositoryDomain"
  - id: "DecisionNode1"
    type: "decision"
    condition: "SearchOrganizationID"
  - id: "DecisionNode2"
    type: "decision"
    condition: "AllProductsProductSet"
  - id: "DecisionNode3"
    type: "decision"
    condition: "NoProductsProductSet"
  - id: "DecisionNode4"
    type: "decision"
    condition: "NoProductsProductSet"
  - id: "DecisionNode5"
    type: "decision"
    condition: "NoProductsProductSet:isInDomains(Channel:RepositoryDomain)"
  - id: "DecisionNode6"
    type: "decision"
    condition: "AllProductsProductSet"
  - id: "DecisionNode7"
    type: "decision"
    condition: "AllProductsProductSet:isInDomains(Channel:RepositoryDomain)"
  - id: "DecisionNode8"
    type: "decision"
    condition: "Label:Domain:UUID"
  - id: "DecisionNode9"
    type: "decision"
    condition: "ProductSet:DomainID"
  - id: "EndNode1"
    type: "end"
    strict: true
    outputs:
      - key: "AllProductsProductSet"
        type: "com.intershop.beehive.xcs.capi.productset.ProductSet"
        guaranteed: true
  - id: "EndNode2"
    type: "end"
    strict: true
    outputs:
      - key: "Organizations"
        type: "java.util.Vector"
        guaranteed: true
  - id: "EndNode3"
    type: "end"
    strict: true
    outputs:
      - key: "SearchChannelIDError"
        type: "java.lang.String"
        guaranteed: false
      - key: "SearchOrganizationIDError"
        type: "java.lang.String"
        guaranteed: false
      - key: "SearchParameters"
        type: "java.util.Map"
        guaranteed: true
  - id: "EndNode4"
    type: "end"
    strict: true
    outputs:
      - key: "NoProductsProductSet"
        type: "com.intershop.beehive.xcs.capi.productset.ProductSet"
        guaranteed: true
  - id: "EndNode5"
    type: "end"
    strict: true
    outputs:
      - key: "ChannelSharingType"
        type: "java.lang.Integer"
        guaranteed: true
  - id: "EndNode6"
    type: "end"
    strict: true
    outputs:
      - key: "SharingIsEnabled"
        type: "java.lang.Boolean"
        guaranteed: false
  - id: "EndNode7"
    type: "end"
    strict: true
  - id: "EndNode8"
    type: "end"
    strict: true
