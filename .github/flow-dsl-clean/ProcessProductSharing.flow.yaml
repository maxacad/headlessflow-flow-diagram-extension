      Domain: "TargetRepository:RepositoryDomain"
  - id: "GetDomainWideProductSets1"
    type: "pipelet"
    ref: "GetDomainWideProductSets"
    config:
      AllProducts: true
  - id: "GetDomainWideProductSets2"
    type: "pipelet"
    ref: "GetDomainWideProductSets"
    config:
      NoProducts: true
  - id: "GetDomainWideProductSets3"
    type: "pipelet"
    ref: "GetDomainWideProductSets"
