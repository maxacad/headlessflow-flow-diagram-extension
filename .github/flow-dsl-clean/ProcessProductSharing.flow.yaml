  - id: "UpdateProductSet1"
    type: "pipelet"
    ref: "UpdateProductSet"
    bindings:
      Name: "Domain:DomainName"
      Description: "\"All products\""
      ProductSet: "AllProductsProductSet"
  - id: "UpdateProductSet2"
