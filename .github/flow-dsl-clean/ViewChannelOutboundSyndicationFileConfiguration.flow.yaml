flow: "ViewChannelOutboundSyndicationFileConfiguration"
kind: "view"

entries:
  - id: "StartNode1"
    name: "Update"
    mode: "private"
    strict: true
    inputs:
      - key: "Syndication"
        type: "com.intershop.component.foundation.capi.syndication.Syndication"
        required: true
      - key: "FileWebForm"
        type: "com.intershop.beehive.core.capi.request.WebForm"
        required: false
      - key: "FileWebForm_FileName"
        type: "java.lang.String"
        required: false
      - key: "FileWebForm_CompressionLevel"
        type: "java.lang.String"
        required: false
  - id: "StartNode2"
    name: "Edit"
    mode: "private"
    strict: false
    inputs:
      []
  - id: "StartNode3"
    name: "Remove"
    mode: "private"
    strict: true
    inputs:
      - key: "Syndication"
        type: "com.intershop.component.foundation.capi.syndication.Syndication"
        required: true
  - id: "StartNode4"
    name: "CreateWebForm"
    mode: "private"
    strict: true
    inputs:
      []

steps:
  - id: "CallNode1"
    type: "call"
    ref: "ViewChannelOutboundSyndicationFileConfiguration-CreateWebForm"
  - id: "CallNode2"
    type: "call"
    ref: "ViewChannelOutboundSyndicationFileConfiguration-CreateWebForm"
  - id: "CallNode5"
    type: "call"
    ref: "ProcessChannelOutboundSyndication-EnforceAppropriateFileExtension"
    bindings:
      CompressionLevel: "FileWebForm:CompressionLevel:Value"
      FileName: "FileWebForm:FileName:Value"
  - id: "CreateWebForm1"
    type: "pipelet"
    ref: "CreateWebForm"
    config:
      webform-id: "FileWebForm"
      param.1.name: "FileName"
      param.1.rule: "^[^.\\\\/:*?<>|\\s]([^\\\\/:*?<>|\\s]*[^.\\\\/:*?<>|\\s])?$"
      param.1.required: true
      param.2.name: "CompressionLevel"
      param.2.rule: "^[0-9]$"
      param.2.required: true
    bindings:
      WebForm: "FileWebForm"
  - id: "EndNode1"
    type: "end"
    strict: true
    outputs:
      - key: "FileWebForm"
        type: "com.intershop.beehive.core.capi.request.WebForm"
        guaranteed: false
  - id: "EndNode2"
    type: "end"
    strict: true
  - id: "EndNode3"
    type: "end"
    strict: true
    outputs:
      - key: "FileWebForm"
        type: "com.intershop.beehive.core.capi.request.WebForm"
        guaranteed: false
  - id: "GetSyndicationByUUID1"
    type: "pipelet"
    ref: "GetSyndicationByUUID"
  - id: "GetWebForm1"
    type: "pipelet"
    ref: "GetWebForm"
    config:
      webform-id: "FileWebForm"
    bindings:
      WebForm: "FileWebForm"
  - id: "GetWebForm2"
    type: "pipelet"
    ref: "GetWebForm"
    config:
      webform-id: "FileWebForm"
    bindings:
      WebForm: "FileWebForm"
  - id: "InteractionNode1"
    type: "interaction"
  - id: "JoinNode1"
    type: "join"
  - id: "JoinNode2"
    type: "join"
  - id: "JoinNode3"
    type: "join"
  - id: "RemoveCustomAttribute1"
    type: "pipelet"
    ref: "RemoveCustomAttribute"
    bindings:
      LocaleInformation: "null"
      ExtensibleObject: "Syndication"
      AttributeName: "\"CompressionLevel\""
  - id: "RemoveCustomAttribute5"
    type: "pipelet"
    ref: "RemoveCustomAttribute"
    bindings:
      LocaleInformation: "null"
      ExtensibleObject: "Syndication"
      AttributeName: "\"FileName\""
  - id: "RemoveWebForm1"
    type: "pipelet"
    ref: "RemoveWebForm"
    config:
      webform-id: "FileWebForm"
  - id: "UpdateCustomAttributes1"
    type: "pipelet"
    ref: "UpdateCustomAttributes"
    config:
      Attribute_1_Name: "FileName"
      Attribute_1_Type: "String"
      Attribute_10_Name: "CompressionLevel"
      Attribute_10_Type: "String"
    bindings:
      Attribute_1_Value: "NewFileName"
      ExtensibleObject: "Syndication"
      Attribute_10_Value: "FileWebForm_CompressionLevel"
  - id: "UpdateWebForm2"
    type: "pipelet"
    ref: "UpdateWebForm"
    config:
      mode: "update"
      webform-id: "FileWebForm"
    bindings:
      WebForm: "FileWebForm"
  - id: "ValidateWebForm2"
    type: "pipelet"
    ref: "ValidateWebForm"
    bindings:
      WebForm: "FileWebForm"

links:
  - from: "GetSyndicationByUUID1"
    via: "next"
    to: "GetWebForm1"
    into: "in"
  - from: "StartNode3"
    via: "next"
    to: "RemoveWebForm1"
    into: "in"
  - from: "GetWebForm1"
    via: "error"
    to: "CallNode2"
    into: "in"
  - from: "GetWebForm1"
    via: "next"
    to: "JoinNode3"
    into: "in1"
  - from: "JoinNode1"
    via: "next"
    to: "EndNode1"
    into: "in"
  - from: "StartNode2"
    via: "next"
    to: "GetSyndicationByUUID1"
    into: "in"
  - from: "UpdateCustomAttributes1"
    via: "next"
    to: "JoinNode1"
    into: "in1"
  - from: "RemoveWebForm1"
    via: "next"
    to: "RemoveCustomAttribute5"
    into: "in"
  - from: "ValidateWebForm2"
    via: "error"
    to: "JoinNode2"
    into: "in2"
  - from: "JoinNode3"
    via: "next"
    to: "InteractionNode1"
    into: "in"
  - from: "StartNode4"
    via: "next"
    to: "CreateWebForm1"
    into: "in"
  - from: "UpdateWebForm2"
    via: "next"
    to: "ValidateWebForm2"
    into: "in"
  - from: "RemoveCustomAttribute1"
    via: "next"
    to: "EndNode2"
    into: "in"
  - from: "StartNode1"
    via: "next"
    to: "GetWebForm2"
    into: "in"
  - from: "ValidateWebForm2"
    via: "next"
    to: "CallNode5"
    into: "in"
  - from: "CallNode5"
    via: "next"
    to: "UpdateCustomAttributes1"
    into: "in"
  - from: "RemoveCustomAttribute5"
    via: "next"
    to: "RemoveCustomAttribute1"
    into: "in"
  - from: "JoinNode2"
    via: "next"
    to: "JoinNode1"
    into: "in3"
  - from: "CallNode2"
    via: "next"
    to: "JoinNode3"
    into: "in3"
  - from: "GetWebForm2"
    via: "next"
    to: "UpdateWebForm2"
    into: "in"
  - from: "CallNode1"
    via: "next"
    to: "JoinNode2"
    into: "in1"
  - from: "GetWebForm2"
    via: "error"
    to: "CallNode1"
    into: "in"
  - from: "CreateWebForm1"
    via: "next"
    to: "EndNode3"
    into: "in"
