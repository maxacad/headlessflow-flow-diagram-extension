flow: "ProcessFile"
kind: "process"

entries:
  - id: "StartNode3"
    name: "CopyFile"
    mode: "private"
    strict: true
    inputs:
      - key: "UnitDomain"
        type: "com.intershop.beehive.core.capi.domain.Domain"
        required: true
      - key: "TargetDirectoryPath"
        type: "java.lang.String"
        required: false
      - key: "Secure"
        type: "java.lang.String"
        required: false
      - key: "FileNames"
        type: "java.util.Iterator"
        required: true
  - id: "StartNode4"
    name: "UploadFile"
    mode: "private"
    strict: true
    inputs:
      - key: "UnitDomain"
        type: "com.intershop.beehive.core.capi.domain.Domain"
        required: true

steps:
  - id: "AddObjectToVector3"
    type: "pipelet"
    ref: "AddObjectToVector"
    config:
      Mode: "Forbid Duplicates"
    bindings:
      InVector: "ExistingFilesVector"
      OutVector: "ExistingFilesVector"
      Iterator: "ExistingFiles"
      Objects: "ExistingFiles"
  - id: "AddObjectToVector4"
    type: "pipelet"
    ref: "AddObjectToVector"
    config:
      Mode: "Forbid Duplicates"
    bindings:
      OutVector: "ExistingFilesVector"
      Iterator: "ExistingFiles"
  - id: "CheckForExistingFiles1"
    type: "pipelet"
    ref: "CheckForExistingFiles"
    config:
      Recursive: false
      SourceDirectoryPath: "upload"
      SourceUnitDirectory: "IMPEX_DIR"
    bindings:
      Locale: "null"
      Files: "ExistingFiles"
      SourceDirectoryPath: "null"
      SourceUnitDirectory: "null"
      SourceUnitDomain: "UnitDomain"
      TargetUnitDomain: "UnitDomain"
      TargetUnitDirectory: "TargetUnitDirectoryName"
  - id: "DecisionNode1"
    type: "decision"
    condition: "File:Extension"
  - id: "DecisionNode10"
    type: "decision"
    condition: "File:Size"
  - id: "DecisionNode11"
    type: "decision"
    condition: "File:Extension"
  - id: "DecisionNode13"
    type: "decision"
    condition: "Secure"
  - id: "DecisionNode14"
    type: "decision"
    condition: "Secure"
  - id: "DecisionNode8"
    type: "decision"
    condition: "Secure"
  - id: "DecisionNode9"
    type: "decision"
    condition: "ExistingFiles"
  - id: "DetermineLocales3"
    type: "pipelet"
    ref: "DetermineLocales"
  - id: "EndNode1"
    type: "end"
    strict: true
    outputs:
      - key: "ErrorCode"
        type: "java.lang.String"
        guaranteed: false
      - key: "Secure"
        type: "java.lang.String"
        guaranteed: false
      - key: "DirectoryPath"
        type: "java.lang.String"
        guaranteed: false
  - id: "EndNode2"
    type: "end"
    strict: true
    outputs:
      - key: "ErrorCode"
        type: "java.lang.String"
        guaranteed: false
      - key: "Secure"
        type: "java.lang.String"
        guaranteed: false
      - key: "DirectoryPath"
        type: "java.lang.String"
        guaranteed: false
      - key: "FileNames"
        type: "java.util.Iterator"
        guaranteed: false
  - id: "EndNode3"
    type: "end"
    strict: true
    outputs:
      - key: "DirectoryPath"
        type: "java.lang.String"
        guaranteed: false
      - key: "Secure"
        type: "java.lang.String"
        guaranteed: false
      - key: "FileNames"
        type: "java.util.Iterator"
        guaranteed: true
      - key: "Upload"
        type: "java.lang.String"
        guaranteed: false
  - id: "EndNode6"
    type: "end"
    strict: true
    outputs:
      - key: "ExistingFiles"
        type: "java.util.Iterator"
        guaranteed: true
      - key: "FileName"
        type: "java.lang.String"
        guaranteed: true
      - key: "Secure"
        type: "java.lang.String"
        guaranteed: false
      - key: "DirectoryPath"
        type: "java.lang.String"
        guaranteed: false
      - key: "Upload"
        type: "java.lang.String"
        guaranteed: false
      - key: "FileNames"
        type: "java.util.Iterator"
        guaranteed: false
  - id: "GetLocale3"
    type: "pipelet"
    ref: "GetLocale"
    config:
      LocaleFallback: "Session Locale"
  - id: "JoinNode1"
    type: "join"
  - id: "JoinNode12"
