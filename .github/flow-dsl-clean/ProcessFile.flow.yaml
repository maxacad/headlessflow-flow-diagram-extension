    ref: "KeyMapper"
    bindings:
      InValue_1: "DirectoryPath"
      OutValue_1: "TargetDirectoryPath"
  - id: "LoopNode1"
    type: "loop"
  - id: "LoopNode4"
    type: "loop"
  - id: "Pipelet1"
    type: "pipelet"
    ref: "CopyFile"
    config:
      DefaultSourceDirectoryPath: "upload"
      DefaultSourceUnitDirectory: "IMPEX_DIR"
      DefaultTargetUnitDirectory: "SECURE_STATIC_DIR"
    bindings:
      SourceFileName: "FileName"
      SourceUnitDomain: "UnitDomain"
      TargetFileName: "FileName"
      TargetUnitDomain: "UnitDomain"
  - id: "Pipelet11"
    type: "pipelet"
    ref: "VerifyZipFile"
    config:
      DefaultDirectoryPath: "upload"
      DefaultUnitDirectory: "IMPEX_DIR"
    bindings:
      UnitDomain: "UnitDomain"
      UnitDirectory: "null"
      DirectoryPath: "null"
      Locale: "null"
      ZipFile: "FileName"
  - id: "Pipelet12"
    type: "pipelet"
    ref: "ExtractCompressedFile"
    config:
      Overwrite: true
    bindings:
      SourceUnitDomain: "UnitDomain"
      TargetUnitDomain: "UnitDomain"
      FileName: "FileName"
      SourceDirectoryPath: "\"upload\""
      SourceUnitDirectory: "\"IMPEX_DIR\""
      TargetUnitDirectory: "\"SECURE_STATIC_DIR\""
  - id: "Pipelet13"
    type: "pipelet"
    ref: "ProcessMultipartRequest"
    config:
      DirectoryPath: "upload"
      MaxFileSize: 100
      UnitDirectory: "IMPEX_DIR"
  - id: "Pipelet2"
    type: "pipelet"
    ref: "CopyFile"
    config:
      DefaultSourceDirectoryPath: "upload"
      DefaultSourceUnitDirectory: "IMPEX_DIR"
      DefaultTargetUnitDirectory: "STATIC_CONTENT_DIR"
    bindings:
      SourceFileName: "FileName"
      SourceUnitDomain: "UnitDomain"
      TargetFileName: "FileName"
      TargetUnitDomain: "UnitDomain"
  - id: "Pipelet4"
    type: "pipelet"
    ref: "DeleteFile"
    config:
      DefaultDirectoryPath: "upload"
      UnitDirectory: "IMPEX_DIR"
    bindings:
      FileName: "FileName"
      Locale: "void"
      DirectoryPath: "null"
  - id: "Pipelet5"
    type: "pipelet"
    ref: "ExtractCompressedFile"
    config:
      Overwrite: true
    bindings:
