    config:
      DefaultDirectoryPath: "upload"
      DefaultUnitDirectory: "IMPEX_DIR"
    bindings:
      UnitDirectory: "null"
      DirectoryPath: "null"
      Locale: "null"
      ZipFile: "FileName"

