      TargetUnitDomain: "UnitDomain"
      FileName: "FileName"
      SourceDirectoryPath: "\"upload\""
      SourceUnitDirectory: "\"IMPEX_DIR\""
      TargetUnitDirectory: "\"STATIC_CONTENT_DIR\""
  - id: "ResolveFilename1"
    type: "pipelet"
    ref: "ResolveFilename"
    config:
      UnitDirectory: "IMPEX_DIR"
    bindings:
      DirectoryPath: "\"upload\""
  - id: "SetDictionaryValue10"
    type: "pipelet"
    ref: "SetDictionaryValue"
    config:
      Name: "TargetUnitDirectoryName"
      Value: "SECURE_STATIC_DIR"
      ValueType: "Dictionary Value"
  - id: "SetDictionaryValue11"
    type: "pipelet"
    ref: "SetDictionaryValue"
    config:
      Name: "TargetUnitDirectoryName"
      Value: "STATIC_CONTENT_DIR"
      ValueType: "Dictionary Value"
  - id: "SetDictionaryValue7"
    type: "pipelet"
    ref: "SetDictionaryValue"
    config:
      Name: "ErrorCode"
      Value: "ZeroFileLenght"
  - id: "SetDictionaryValue9"
    type: "pipelet"
    ref: "SetDictionaryValue"
    config:
      Name: "ErrorCode"
      Value: "FileUploadError"
  - id: "VerifyZipFile1"
    type: "pipelet"
