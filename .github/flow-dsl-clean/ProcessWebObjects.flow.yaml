flow: "ProcessWebObjects"
kind: "webservice"

entries:
  - id: "StartNode1"
    name: "Insert"
    mode: "private"
    strict: true
    inputs:
      - key: "StagingPermissionID"
        type: "java.lang.String"
        required: false
      - key: "WebObjects"
        type: "com.intershop.beehive.core.capi.staging.webservice.WebObject[]"
        required: false
      - key: "DownloadURL"
        type: "java.lang.String"
        required: false
      - key: "TargetSystem"
        type: "com.intershop.beehive.core.capi.staging.webservice.TargetSystemTransferType"
        required: true
      - key: "Parameters"
        type: "java.util.Map"
        required: true
  - id: "StartNode3"
    name: "RefreshCaches"
    mode: "private"
    strict: true
    inputs:
      - key: "CacheClearProcessID"
        type: "java.lang.String"
        required: true

steps:
  - id: "CallNode1"
    type: "call"
    ref: "ProcessBatchCacheClear-ClearCachesByProcessID"
  - id: "CallNode2"
    type: "call"
    ref: "ProcessBatchCacheClear-BatchForObjectsAndProcessID"
    bindings:
      Objects: "ORMObjects"
      CacheClearProcessID: "Parameters:CacheClearProcessID"
      Object: "null"
  - id: "CreateArrayFromIterator2"
    type: "pipelet"
    ref: "CreateArrayFromIterator"
    config:
      ComponentType: "java.lang.String"
    bindings:
      Iterator: "StatusMessages:Iterator"
      Array: "StatusMessagesArray"
  - id: "DecisionNode2"
    type: "decision"
    condition: "ORMObjects"
  - id: "DownloadDependendFiles1"
    type: "pipelet"
    ref: "DownloadDependendFiles"
  - id: "EndNode1"
    type: "end"
    strict: true
    outputs:
      - key: "StatusMessagesArray"
        type: "java.lang.String[]"
        guaranteed: false
  - id: "EndNode2"
    type: "end"
    strict: true
  - id: "IdentifyEditingSystem1"
    type: "pipelet"
    ref: "IdentifyEditingSystem"
  - id: "JoinNode1"
    type: "join"
  - id: "MergeWebObjects1"
    type: "pipelet"
    ref: "MergeWebObjects"
    bindings:
      AffectedORMObjects: "ORMObjects"
  - id: "ReleaseORMObjects1"
    type: "pipelet"
    ref: "ReleaseORMObjects"

links:
  - from: "CallNode1"
    via: "next"
    to: "EndNode2"
    into: "in"
  - from: "CallNode2"
    via: "next"
    to: "JoinNode1"
    into: "in1"
  - from: "CreateArrayFromIterator2"
    via: "next"
    to: "EndNode1"
    into: "in"
  - from: "DecisionNode2"
    via: "no"
    to: "JoinNode1"
    into: "in1"
  - from: "DecisionNode2"
    via: "yes"
    to: "ReleaseORMObjects1"
    into: "in"
  - from: "DownloadDependendFiles1"
    via: "next"
    to: "CallNode2"
    into: "in"
  - from: "IdentifyEditingSystem1"
    via: "next"
    to: "MergeWebObjects1"
    into: "in"
  - from: "JoinNode1"
    via: "next"
    to: "CreateArrayFromIterator2"
    into: "in"
  - from: "MergeWebObjects1"
    via: "next"
    to: "DecisionNode2"
    into: "in"
  - from: "ReleaseORMObjects1"
    via: "next"
    to: "DownloadDependendFiles1"
    into: "in"
  - from: "StartNode1"
    via: "next"
    to: "IdentifyEditingSystem1"
    into: "in"
  - from: "StartNode3"
    via: "next"
    to: "CallNode1"
    into: "in"
