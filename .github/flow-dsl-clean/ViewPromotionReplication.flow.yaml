flow: "ViewPromotionReplication"
kind: "view"

entries:
  - id: "StartNode12"
    name: "StartReplication"
    mode: "private"
    strict: false
    inputs:
      []
  - id: "StartNode14"
    name: "SelectTarget"
    mode: "private"
    strict: false
    inputs:
      []

steps:
  - id: "AddObjectToVector4"
    type: "pipelet"
    ref: "AddObjectToVector"
    bindings:
      Object: "Promotion"
      InVector: "Promotions"
      OutVector: "Promotions"
      Iterator: "PromotionsIterator"
  - id: "CallNode11"
    type: "call"
    ref: "ProcessClipboard-DeleteAllEntries"
  - id: "CallNode15"
    type: "call"
    ref: "ProcessClipboard-Get"
  - id: "CallNode20"
    type: "call"
    ref: "ProcessClipboard-Update"
  - id: "CallNode4"
    type: "call"
  - id: "ConcatenateStrings1"
    type: "pipelet"
    ref: "ConcatenateStrings"
    bindings:
      String0: "\"ViewProcessList_\""
      String2: "\"-CreateProcess\""
      String1: "CurrentChannel:TypeCode"
      Concatenated: "CreateProcessPipeline"
  - id: "ConcatenateStrings2"
    type: "pipelet"
    ref: "ConcatenateStrings"
    bindings:
      String0: "\"ViewProcessList_\""
      String2: "\"-ListAll\""
      String1: "CurrentChannel:TypeCode"
      Concatenated: "ListAllProcessPipeline"
  - id: "CreatePageableFromIterator1"
    type: "pipelet"
    ref: "CreatePageableFromIterator"
    bindings:
      Iterator: "PromotionsIterator"
      Pageable: "SelectedObjects"
  - id: "DecisionNode7"
    type: "decision"
    condition: "CurrentChannel"
  - id: "GetPromotionByUUID2"
    type: "pipelet"
    ref: "GetPromotionByUUID"
  - id: "GetTargetClusters1"
    type: "pipelet"
    ref: "GetTargetClusters"
  - id: "InteractionEnd12"
    type: "interaction"
  - id: "JoinNode3"
    type: "join"
  - id: "JumpNode3"
    type: "jump"
  - id: "JumpNode5"
    type: "jump"
    ref: "ViewPromotionList-Paging"
  - id: "JumpNode6"
    type: "jump"
    ref: "ViewProcessList-CreateProcess"
  - id: "KeyMapper3"
    type: "pipelet"
    ref: "KeyMapper"
    config:
      ValueType: "Form Value"
    bindings:
      InValue_1: "\"ProcessReplicateObjects-Init\""
      InValue_2: "\"ProcessReplicateObjects-Process\""
      InValue_3: "\"ProcessReplicateObjects-Post\""
      InValue_4: "\"Marketing_ReplicatePromotions\""
      InValue_5: "\"SelectedObjects\""
      InValue_6: "SelectedObjects:ID"
      OutValue_1: "InitPipeline"
      OutValue_2: "ProcessPipeline"
      OutValue_3: "PostPipeline"
      OutValue_4: "JobName"
      OutValue_5: "PageableName"
      OutValue_6: "PageableID"
  - id: "LoopNode2"
    type: "loop"
  - id: "Pipelet13"
    type: "pipelet"
    ref: "CheckForEmptyIterator"
    bindings:
      FilledIterator: "UUIDIterator"
  - id: "PrepareApplicationView12"
    type: "pipelet"
    ref: "PrepareApplicationView"
    config:
      WorkingTemplate: "replication/ReplicatePromotionsWizardSelectTarget"
      SelectedMenuItem: "OnlineMarketing"
  - id: "RegisterPageable1"
    type: "pipelet"
    ref: "RegisterPageable"
    bindings:
      PageableID: "SelectedObjects:ID"
      PageableName: "\"SelectedObjects\""
      see PageableName: "SelectedObjects"

links:
  - from: "AddObjectToVector4"
    via: "next"
    to: "JoinNode3"
    into: "in1"
  - from: "CallNode11"
    via: "next"
    to: "JumpNode3"
    into: "in"
  - from: "CallNode15"
    via: "next"
    to: "LoopNode2"
    into: "in"
  - from: "CallNode20"
    via: "next"
    to: "Pipelet13"
    into: "in"
  - from: "CallNode4"
    via: "next"
    to: "CallNode11"
    into: "in"
  - from: "ConcatenateStrings1"
    via: "next"
    to: "ConcatenateStrings2"
    into: "in"
  - from: "ConcatenateStrings2"
    via: "next"
    to: "CallNode4"
    into: "in"
  - from: "CreatePageableFromIterator1"
    via: "next"
    to: "RegisterPageable1"
    into: "in"
  - from: "DecisionNode7"
    via: "no"
    to: "JumpNode6"
    into: "in"
  - from: "DecisionNode7"
    via: "yes"
    to: "ConcatenateStrings1"
    into: "in"
  - from: "GetPromotionByUUID2"
    via: "error"
    to: "JoinNode3"
    into: "in1"
  - from: "GetPromotionByUUID2"
    via: "next"
    to: "AddObjectToVector4"
    into: "in"
  - from: "GetTargetClusters1"
    via: "next"
    to: "PrepareApplicationView12"
    into: "in"
  - from: "JoinNode3"
    via: "next"
    to: "LoopNode2"
    into: "loop"
  - from: "KeyMapper3"
    via: "next"
    to: "DecisionNode7"
    into: "in"
  - from: "LoopNode2"
    via: "do"
    to: "GetPromotionByUUID2"
    into: "in"
  - from: "LoopNode2"
    via: "next"
    to: "CreatePageableFromIterator1"
    into: "in"
  - from: "Pipelet13"
    via: "error"
    to: "JumpNode5"
    into: "in"
  - from: "Pipelet13"
    via: "next"
    to: "GetTargetClusters1"
    into: "in"
  - from: "PrepareApplicationView12"
    via: "next"
    to: "InteractionEnd12"
    into: "in"
  - from: "RegisterPageable1"
    via: "next"
    to: "KeyMapper3"
    into: "in"
  - from: "StartNode12"
    via: "next"
    to: "CallNode15"
    into: "in"
  - from: "StartNode14"
    via: "next"
    to: "CallNode20"
    into: "in"
