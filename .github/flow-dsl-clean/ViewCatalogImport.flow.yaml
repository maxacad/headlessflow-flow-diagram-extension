flow: "ViewCatalogImport"
kind: "view"

entries:
  - id: "Start1"
    name: "GetMappingTemplates"
    mode: "private"
    strict: false
    inputs:
      []
  - id: "Start2"
    name: "CreateCatalog"
    mode: "private"
    strict: false
    inputs:
      []
  - id: "Start3"
    name: "ValidateFileRefresh"
    mode: "private"
    strict: false
    inputs:
      []
  - id: "Start4"
    name: "ValidateFile"
    mode: "private"
    strict: false
    inputs:
      []
  - id: "Start5"
    name: "SelectCatalog"
    mode: "private"
    strict: false
    inputs:
      []
  - id: "Start6"
    name: "Import"
    mode: "private"
    strict: false
    inputs:
      []
  - id: "StartNode1"
    name: "Paging"
    mode: "private"
    strict: false
    inputs:
      []
  - id: "StartNode2"
    name: "SelectFile"
    mode: "private"
    strict: false
    inputs:
      []
  - id: "StartNode3"
    name: "Dispatch"
    mode: "private"
    strict: false
    inputs:
      []

steps:
  - id: "BrowseDirectory1"
    type: "pipelet"
    ref: "BrowseDirectory"
    config:
      DefaultDirectoryPath: "default/CSVMappingTemplates"
      UnitDirectory: "TEMPLATE_DIR"
    bindings:
      Directory: "MappingTemplateDirectory"
      UnitDomain: "CurrentDomain"
  - id: "Call1"
    type: "call"
    ref: "ProcessImpexJob-GetLogContent"
  - id: "Call2"
    type: "call"
    ref: "ViewCatalogImport-GetMappingTemplates"
  - id: "Call3"
    type: "call"
    ref: "ViewCatalog-CreateCatalog"
  - id: "Call4"
    type: "call"
    ref: "ProcessImpexJob-Create"
  - id: "Call5"
    type: "call"
    ref: "ProcessImpexJob-Create"
  - id: "Call6"
    type: "call"
    ref: "ViewCatalog-CreateCatalog"
  - id: "CallNode1"
    type: "call"
    ref: "ProcessClipboard-Delete"
  - id: "CallNode2"
    type: "call"
    ref: "ProcessClipboard-Update"
  - id: "CombineIterators1"
    type: "pipelet"
    ref: "CombineIterators"
    config:
      ProcessMethod: "Concatenate Iterators"
    bindings:
      Iterator: "Catalogs"
      Iterator1: "ProductCatalogs"
      Iterator2: "ClassificationCatalogs"
  - id: "CopyFile1"
    type: "pipelet"
    ref: "CopyFile"
    config:
      DefaultSourceDirectoryPath: "temp"
      DefaultSourceUnitDirectory: "IMPEX_DIR"
      DefaultTargetUnitDirectory: "IMPEX_SRC_DIR"
    bindings:
      SourceFileName: "JobConfiguration:TempXMLFile"
      SourceUnitDomain: "CurrentOrganization:Domain"
      TargetFileName: "JobConfiguration:TempXMLFile"
      TargetUnitDomain: "ProcessExecutionDomain"
  - id: "CopyFile2"
    type: "pipelet"
    ref: "CopyFile"
    config:
      DefaultSourceDirectoryPath: "catalog"
      DefaultSourceUnitDirectory: "IMPEX_SRC_DIR"
      DefaultTargetUnitDirectory: "IMPEX_SRC_DIR"
    bindings:
      SourceFileName: "SelectedFile"
      SourceUnitDomain: "CurrentOrganization:Domain"
      TargetFileName: "SelectedFile"
      TargetUnitDomain: "ProcessExecutionDomain"
  - id: "CreateDirectory1"
    type: "pipelet"
    ref: "CreateDirectory"
    config:
      DefaultDirectoryName: "CSVMappingTemplates"
      DefaultDirectoryPath: "default"
      UnitDirectory: "TEMPLATE_DIR"
    bindings:
      UnitDomain: "CurrentDomain"
  - id: "CreateWebForm1"
    type: "pipelet"
    ref: "CreateWebForm"
    config:
      param.1.name: "SelectedFile"
      param.1.required: true
      param.2.name: "MappingTemplate"
      param.2.required: true
      param.3.name: "FieldDelimiter"
      param.3.required: true
      param.4.name: "FormatLineNumber"
      param.4.required: false
      param.4.rule: "\\d{1,2}"
      param.5.name: "CustomFormatLine"
      param.5.required: false
      webform-id: "SelectFileForm"
    bindings:
      WebForm: "SelectFileForm"
  - id: "CreateWebForm2"
    type: "pipelet"
    ref: "CreateWebForm"
    config:
      param.1.name: "CatalogID"
      param.1.required: true
      param.1.rule: "^[a-zA-Z0-9\\-\\_]+$"
      webform-id: "CreateCatalogForm"
      param.2.name: "ClassificationType"
      param.2.rule: ""
      param.2.required: false
    bindings:
      WebForm: "CreateCatalogForm"
  - id: "CreateWebForm3"
    type: "pipelet"
    ref: "CreateWebForm"
    config:
      param.1.name: "SelectedFile"
      param.1.required: true
      webform-id: "SelectFileForm"
    bindings:
      WebForm: "SelectFileForm"
  - id: "Decision1"
    type: "decision"
    condition: "JobConfiguration"
  - id: "Decision2"
    type: "decision"
    condition: "JobConfiguration:Status"
  - id: "Decision3"
    type: "decision"
    condition: "JobConfiguration:TempXMLFile"
  - id: "Decision4"
    type: "decision"
    condition: "CategoryCSVImport"
  - id: "Decision5"
    type: "decision"
    condition: "JobConfiguration:LastExecutionTime:Time"
  - id: "Decision6"
    type: "decision"
    condition: "CategoryCSVImport"
  - id: "Decision7"
    type: "decision"
    condition: "SelectedCatalogName"
  - id: "Decision8"
    type: "decision"
    condition: "CategoryCSVImport"
  - id: "DecisionNode1"
    type: "decision"
    condition: "PageLocator"
  - id: "DecisionNode2"
    type: "decision"
    condition: "PageNumber"
  - id: "DecisionNode3"
    type: "decision"
    condition: "SelectedCatalogName"
  - id: "DecisionNode4"
    type: "decision"
    condition: "CustomCatalogType"
  - id: "DetermineUnit1"
    type: "pipelet"
    ref: "DetermineUnit"
    bindings:
      Unit: "ProcessExecutionDomain"
      UnitName: "SelectedCatalogName"
  - id: "End1"
    type: "end"
    strict: false
  - id: "End2"
    type: "end"
    strict: false
  - id: "ExecuteObjectsQuery1"
    type: "pipelet"
    ref: "ExecuteObjectsQuery"
    config:
      QueryName: "catalog/GetClassificationSystems"
      ParameterName_01: "DomainName"
      Datasource: "current ORM connection"
    bindings:
      SearchResult: "ClassificationSystems"
      ParameterValue_01: "\"Operations\""
  - id: "GetCatalog2"
    type: "pipelet"
    ref: "GetCatalog"
    bindings:
      CatalogID: "SelectedCatalogName"
      OrganizationDomain: "CurrentOrganization:Domain"
  - id: "GetCatalogs1"
    type: "pipelet"
    ref: "GetCatalogs"
    config:
      CatalogType: "Product Catalog"
      OnlineOnly: "False"
      ProxyFilter: "ON - Exclude Proxy Catalogs"
    bindings:
      Catalogs: "ProductCatalogs"
      OrganizationDomain: "CurrentOrganization:Domain"
  - id: "GetCatalogs2"
    type: "pipelet"
    ref: "GetCatalogs"
    config:
      CatalogType: "Classification Catalog"
      OnlineOnly: "False"
      ProxyFilter: "ON - Exclude Proxy Catalogs"
    bindings:
      Catalogs: "ClassificationCatalogs"
      OrganizationDomain: "CurrentOrganization:Domain"
  - id: "GetClassificationSystemByName1"
    type: "pipelet"
    ref: "GetClassificationSystemByName"
    bindings:
      DomainName: "\"Operations\""
  - id: "GetJobConfiguration1"
    type: "pipelet"
    ref: "GetJobConfiguration"
    bindings:
      JobUUID: "JobConfigurationUUID"
  - id: "GetJobConfiguration2"
    type: "pipelet"
    ref: "GetJobConfiguration"
    bindings:
      JobUUID: "JobConfigurationUUID"
  - id: "GetLocale1"
    type: "pipelet"
    ref: "GetLocale"
    config:
      LocaleFallback: "Lead Locale"
  - id: "GetLocale2"
    type: "pipelet"
    ref: "GetLocale"
  - id: "GetWebForm1"
    type: "pipelet"
    ref: "GetWebForm"
    config:
      webform-id: "SelectFileForm"
    bindings:
      WebForm: "SelectFileForm"
  - id: "GetWebForm2"
    type: "pipelet"
    ref: "GetWebForm"
    config:
      webform-id: "SelectFileForm"
    bindings:
      WebForm: "SelectFileForm"
  - id: "GetWebForm3"
    type: "pipelet"
    ref: "GetWebForm"
    config:
      webform-id: "CreateCatalogForm"
    bindings:
      WebForm: "CreateCatalogForm"
  - id: "InteractionNode1"
