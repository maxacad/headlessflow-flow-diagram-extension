      InValue_3: "\"ProcessCatalogImpex\""
      OutValue_3: "JobName"
  - id: "KeyMapper11"
    type: "pipelet"
    ref: "KeyMapper"
    config:
      ValueType: "Form Value"
    bindings:
      OutValue_1: "ProcessPipelineName"
      InValue_1: "\"ProcessCatalogImport\""
      OutValue_2: "ProcessPipelineStartNode"
      InValue_2: "\"Validate\""
      InValue_3: "\"ProcessCatalogImpex\""
