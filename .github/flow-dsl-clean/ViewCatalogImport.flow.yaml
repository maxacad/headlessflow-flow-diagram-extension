  - id: "Pipelet5"
    type: "pipelet"
    ref: "SetPage"
    bindings:
      PageNumber: "PageLocator:PageNumber"
      Pageable: "Files"
  - id: "Pipelet6"
    type: "pipelet"
    ref: "CreatePageableFromIterator"
    config:
      PageableName: "Files"
      Pagesize: 10
    bindings:
      Iterator: "Directory:Files"
      Pageable: "Files"
  - id: "Pipelet7"
    type: "pipelet"
    ref: "PrepareApplicationView"
    config:
      SelectedMenuItem: "Import & Export"
      WorkingTemplate: "impex/CatalogImportSelectFile"
  - id: "Pipelet8"
    type: "pipelet"
    ref: "DispatchFormAction"
