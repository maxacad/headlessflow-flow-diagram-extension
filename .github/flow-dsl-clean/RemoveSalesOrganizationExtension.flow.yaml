flow: "RemoveSalesOrganizationExtension"
kind: "extension"

entries:
  - id: "Start1"
    name: "Start"
    mode: "private"
    strict: true
    inputs:
      - key: "Organization"
        type: "com.intershop.component.organization.capi.Organization"
        required: true

steps:
  - id: "CreateStack1"
    type: "pipelet"
    ref: "CreateStack"
    bindings:
      Stack: "DeletionStack"
  - id: "Decision1"
    type: "decision"
    condition: "Organization:TypeCode"
  - id: "Decision2"
    type: "decision"
    condition: "DeletionStack"
  - id: "Decision4"
    type: "decision"
    condition: "DeleteRepository:isProxy"
  - id: "Decision5"
    type: "decision"
    condition: "DeleteRepository:TypeCode"
  - id: "Decision6"
    type: "decision"
    condition: "DeleteRepository:TypeCode"
  - id: "End1"
    type: "end"
    strict: true
  - id: "End2"
    type: "end"
    strict: true
  - id: "ExecuteCartridgePipelines1"
    type: "pipelet"
    ref: "ExecuteCartridgePipelines"
    config:
      Asynchronous: false
      PipelinePropertyName: "ChannelDeletionHook"
      ProcessReversely: true
  - id: "GetRepositories1"
    type: "pipelet"
    ref: "GetRepositories"
    bindings:
      OrganizationDomain: "Organization:Domain"
      Repositories: "DeleteRepositories"
  - id: "Join1"
    type: "join"
  - id: "Join3"
    type: "join"
  - id: "Join4"
    type: "join"
  - id: "Join5"
    type: "join"
  - id: "Join6"
    type: "join"
  - id: "Loop1"
    type: "loop"
  - id: "ManipulateStack1"
    type: "pipelet"
    ref: "ManipulateStack"
    config:
      ProcessMethod: "PUSH"
    bindings:
      AddElement: "Organization"
      Stack: "DeletionStack"
  - id: "ManipulateStack2"
    type: "pipelet"
    ref: "ManipulateStack"
    config:
      ProcessMethod: "PUSH"
    bindings:
      AddElement: "DeleteRepositories"
      Stack: "DeletionStack"
  - id: "ManipulateStack3"
    type: "pipelet"
    ref: "ManipulateStack"
    config:
      ProcessMethod: "PEEK"
    bindings:
      GetElement: "DeleteRepositories"
      Stack: "DeletionStack"
  - id: "ManipulateStack4"
    type: "pipelet"
    ref: "ManipulateStack"
    config:
      ProcessMethod: "POP"
    bindings:
      GetElement: "DeleteRepositories"
      Stack: "DeletionStack"
  - id: "ManipulateStack5"
    type: "pipelet"
    ref: "ManipulateStack"
    config:
      ProcessMethod: "POP"
    bindings:
      GetElement: "Organization"
      Stack: "DeletionStack"
  - id: "SetDomainStatus1"
    type: "pipelet"
    ref: "SetDomainStatus"
    config:
      DefaultStatus: "ToBeDeleted"
    bindings:
      Domain: "DeleteRepository:Domain:Site"

links:
  - from: "Decision4"
    via: "yes"
    to: "Decision5"
    into: "in"
  - from: "Loop1"
    via: "do"
    to: "ExecuteCartridgePipelines1"
    into: "in"
  - from: "ManipulateStack2"
    via: "next"
    to: "Loop1"
    into: "in"
  - from: "Decision1"
    via: "yes"
    to: "Decision2"
    into: "in"
  - from: "ExecuteCartridgePipelines1"
    via: "next"
    to: "ManipulateStack3"
    into: "in"
  - from: "Decision2"
    via: "yes"
    to: "CreateStack1"
    into: "in"
  - from: "Decision2"
    via: "no"
    to: "Join1"
    into: "in3"
  - from: "ManipulateStack4"
    via: "next"
    to: "ManipulateStack5"
    into: "in"
  - from: "CreateStack1"
    via: "next"
    to: "Join1"
    into: "in1"
  - from: "ManipulateStack3"
    via: "next"
    to: "Decision4"
    into: "in"
  - from: "Loop1"
    via: "next"
    to: "ManipulateStack4"
    into: "in"
  - from: "Join3"
    via: "next"
    to: "Join4"
    into: "in3"
  - from: "ManipulateStack1"
    via: "next"
    to: "GetRepositories1"
    into: "in"
  - from: "Start1"
    via: "next"
    to: "Decision1"
    into: "in"
  - from: "Join1"
    via: "next"
    to: "ManipulateStack1"
    into: "in"
  - from: "ManipulateStack5"
    via: "next"
    to: "End1"
    into: "in"
  - from: "Decision5"
    via: "no"
    to: "Join5"
    into: "in2"
  - from: "Decision6"
    via: "yes"
    to: "SetDomainStatus1"
    into: "in"
  - from: "Join6"
    via: "next"
    to: "Join3"
    into: "in1"
  - from: "Decision5"
    via: "yes"
    to: "Decision6"
    into: "in"
  - from: "Join4"
    via: "next"
    to: "Loop1"
    into: "loop"
  - from: "Decision1"
    via: "no"
    to: "End2"
    into: "in"
  - from: "Decision4"
    via: "no"
    to: "Join5"
    into: "in1"
  - from: "SetDomainStatus1"
    via: "next"
    to: "Join4"
    into: "in1"
  - from: "Join5"
    via: "next"
    to: "Join6"
    into: "in1"
  - from: "Decision6"
    via: "no"
    to: "Join6"
    into: "in2"
  - from: "GetRepositories1"
    via: "next"
    to: "ManipulateStack2"
    into: "in"
