flow: "ViewChannelOutboundSyndicationScheduling"
kind: "view"

entries:
  - id: "Start3"
    name: "Dispatch"
    mode: "private"
    strict: false
    inputs:
      []
  - id: "StartNode1"
    name: "Edit"
    mode: "private"
    strict: false
    inputs:
      []
  - id: "StartNode2"
    name: "Update"
    mode: "private"
    strict: false
    inputs:
      []

steps:
  - id: "CallNode1"
    type: "call"
    bindings:
      JobConfiguration: "Syndication:JobConfiguration"
  - id: "CallNode2"
    type: "call"
    ref: "ProcessProductOutboundSyndication-Validate"
  - id: "CallNode3"
    type: "call"
    ref: "ProcessProductOutboundSyndication-Validate"
  - id: "ConcatenateStrings1"
    type: "pipelet"
    ref: "ConcatenateStrings"
    bindings:
      String0: "\"ProcessJobScheduling\""
      String1: "\"-\""
      String2: "SchedulingType"
      Concatenated: "PipelineName"
  - id: "DispatchFormAction1"
    type: "pipelet"
    ref: "DispatchFormAction"
    config:
      OutValue_0: "ViewChannelOutboundSyndicationScheduling-Edit"
      OutValue_1: "ViewChannelOutboundSyndicationScheduling-Update"
      OutValue_2: "ViewChannelOutboundSyndicationList-Start"
    bindings:
      SelectionKey: "JumpTarget"
      Key_0: "Edit"
      Key_1: "Update"
      Key_2: "Back"
  - id: "GetFormRecord1"
    type: "pipelet"
    ref: "GetFormRecord"
    bindings:
      RecordID: "SchedulingType"
  - id: "GetSyndicationByUUID1"
    type: "pipelet"
    ref: "GetSyndicationByUUID"
  - id: "GetSyndicationByUUID3"
    type: "pipelet"
    ref: "GetSyndicationByUUID"
  - id: "InteractionEnd1"
    type: "interaction"
  - id: "InteractionEnd3"
    type: "interaction"
  - id: "Jump5"
    type: "jump"
    ref: "SecureJump-Start"
  - id: "PrepareApplicationView1"
    type: "pipelet"
    ref: "PrepareApplicationView"
    config:
      SelectedMenuItem: "ChannelCatalogs"
      WorkingTemplate: "syndication/ChannelOutboundSyndicationScheduling"
  - id: "PrepareApplicationView3"
    type: "pipelet"
    ref: "PrepareApplicationView"
    config:
      SelectedMenuItem: "ChannelCatalogs"
      WorkingTemplate: "syndication/ChannelOutboundSyndicationScheduling"

links:
  - from: "DispatchFormAction1"
    via: "next"
    to: "Jump5"
    into: "in"
  - from: "CallNode3"
    via: "next"
    to: "PrepareApplicationView1"
    into: "in"
  - from: "GetSyndicationByUUID1"
    via: "next"
    to: "GetFormRecord1"
    into: "in"
  - from: "GetFormRecord1"
    via: "next"
    to: "ConcatenateStrings1"
    into: "in"
  - from: "ConcatenateStrings1"
    via: "next"
    to: "CallNode1"
    into: "in"
  - from: "Start3"
    via: "next"
    to: "DispatchFormAction1"
    into: "in"
  - from: "PrepareApplicationView3"
    via: "next"
    to: "InteractionEnd3"
    into: "in"
  - from: "StartNode2"
    via: "next"
    to: "GetSyndicationByUUID1"
    into: "in"
  - from: "PrepareApplicationView1"
    via: "next"
    to: "InteractionEnd1"
    into: "in"
  - from: "StartNode1"
    via: "next"
    to: "GetSyndicationByUUID3"
    into: "in"
  - from: "CallNode1"
    via: "next"
    to: "CallNode3"
    into: "in"
  - from: "GetSyndicationByUUID3"
    via: "next"
    to: "CallNode2"
    into: "in"
  - from: "CallNode2"
