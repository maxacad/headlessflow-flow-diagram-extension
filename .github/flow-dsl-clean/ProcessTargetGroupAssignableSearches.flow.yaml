flow: "ProcessTargetGroupAssignableSearches"
kind: "process"

entries:
  - id: "Start7"
    name: "SearchAffiliates"
    mode: "private"
    strict: false
    inputs:
      []
  - id: "StartNode2"
    name: "SearchUserGroups"
    mode: "private"
    strict: false
    inputs:
      - key: "UserGroupDomain<com.intershop.beehive.core.capi.domain.Domain>"
        type: "com.intershop.beehive.core.capi.domain.Domain"
        required: false

steps:
  - id: "AddObjectToVector1"
    type: "pipelet"
    ref: "AddObjectToVector"
    config:
      Mode: "Allow Duplicates"
    bindings:
      InVector: "AffiliateGroupVector"
      Iterator: "Affiliates"
      Object: "AffiliateProgram"
      OutVector: "AffiliateGroupVector"
      Objects: "null"
  - id: "AddObjectToVector2"
    type: "pipelet"
    ref: "AddObjectToVector"
    config:
      Mode: "Allow Duplicates"
    bindings:
      InVector: "AffiliateGroupVector"
      Iterator: "Affiliates"
      Object: "AffiliatePartner"
      OutVector: "AffiliateGroupVector"
      Objects: "null"
  - id: "AddObjectToVector3"
    type: "pipelet"
    ref: "AddObjectToVector"
    config:
      Mode: "Allow Duplicates"
    bindings:
      InVector: "AffiliateGroupVector"
      Iterator: "Affiliates"
      OutVector: "AffiliateGroupVector"
      Object: "null"
      Objects: "null"
  - id: "CreatePageableFromIterator1"
    type: "pipelet"
    ref: "CreatePageableFromIterator"
    config:
      Pagesize: 15
    bindings:
      Iterator: "Affiliates"
      Pageable: "Affiliates"
  - id: "End2"
    type: "end"
    strict: false
  - id: "EndNode2"
    type: "end"
    strict: false
  - id: "ExecutePageableQuery1"
    type: "pipelet"
    ref: "ExecutePageableQuery"
    config:
      ParameterName_01: "Domain"
      Datasource: "default"
      DefaultPageSize: 15
      QueryName: "user/GetUserGroupList_52"
      ParameterName_02: "CosumerGroupExpression1"
      ParameterName_03: "CosumerGroupExpression2"
      ParameterName_04: "CosumerGroupExpression3"
      ParameterName_05: "LocaleInformation"
    bindings:
      ParameterValue_01: "UserGroupDomain"
      SearchResult: "UserGroups"
      ParameterValue_02: "CosumerGroupExpression1"
      ParameterValue_03: "CosumerGroupExpression2"
      ParameterValue_04: "CosumerGroupExpression3"
      ParameterValue_05: "CurrentRequest:Locale"
  - id: "GetAffiliatePartners1"
    type: "pipelet"
    ref: "GetAffiliatePartners"
    bindings:
      Domain: "AffiliateDomain"
  - id: "GetAffiliatePrograms1"
    type: "pipelet"
    ref: "GetAffiliatePrograms"
  - id: "Loop2"
    type: "loop"
  - id: "Loop3"
    type: "loop"
  - id: "TextNode1"
    type: "text"
  - id: "TextNode2"
    type: "text"
  - id: "VerifySearchTerm1"
    type: "pipelet"
    ref: "VerifySearchTerm"
    bindings:
      UserSearchTerm: "\"IG_*\""
      SearchExpression: "CosumerGroupExpression2"
  - id: "VerifySearchTerm2"
    type: "pipelet"
    ref: "VerifySearchTerm"
    bindings:
      UserSearchTerm: "\"CG_*\""
      SearchExpression: "CosumerGroupExpression1"
  - id: "VerifySearchTerm3"
    type: "pipelet"
    ref: "VerifySearchTerm"
    bindings:
      UserSearchTerm: "\"Everyone\""
      SearchExpression: "CosumerGroupExpression3"

links:
  - from: "Loop2"
    via: "next"
    to: "Loop3"
    into: "loop"
  - from: "AddObjectToVector3"
    via: "next"
    to: "Loop3"
    into: "in"
  - from: "Start7"
    via: "next"
    to: "GetAffiliatePartners1"
    into: "in"
  - from: "CreatePageableFromIterator1"
    via: "next"
    to: "End2"
    into: "in"
  - from: "GetAffiliatePrograms1"
    via: "next"
    to: "Loop2"
    into: "in"
  - from: "AddObjectToVector2"
    via: "next"
    to: "GetAffiliatePrograms1"
    into: "in"
  - from: "GetAffiliatePartners1"
    via: "next"
    to: "AddObjectToVector3"
    into: "in"
  - from: "Loop3"
    via: "do"
    to: "AddObjectToVector2"
    into: "in"
  - from: "Loop2"
    via: "do"
    to: "AddObjectToVector1"
    into: "in"
  - from: "AddObjectToVector1"
    via: "next"
    to: "Loop2"
    into: "loop"
  - from: "Loop3"
    via: "next"
    to: "CreatePageableFromIterator1"
    into: "in"
  - from: "ExecutePageableQuery1"
    via: "next"
    to: "EndNode2"
    into: "in"
  - from: "VerifySearchTerm1"
    via: "next"
    to: "VerifySearchTerm3"
    into: "in"
  - from: "StartNode2"
    via: "next"
    to: "VerifySearchTerm2"
    into: "in"
  - from: "VerifySearchTerm2"
    via: "next"
    to: "VerifySearchTerm1"
    into: "in"
  - from: "VerifySearchTerm3"
    via: "next"
    to: "ExecutePageableQuery1"
    into: "in"
