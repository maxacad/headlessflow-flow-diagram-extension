flow: "ViewChannelFreightClassExport"
kind: "view"

entries:
  - id: "Start4"
    name: "SelectConfiguration"
    mode: "private"
    strict: false
    inputs:
      []
  - id: "Start5"
    name: "Export"
    mode: "private"
    strict: false
    inputs:
      []
  - id: "StartNode1"
    name: "Dispatch"
    mode: "private"
    strict: false
    inputs:
      []
  - id: "StartNode2"
    name: "VerifyForm"
    mode: "private"
    strict: false
    inputs:
      []
  - id: "StartNode3"
    name: "Prepare"
    mode: "private"
    strict: false
    inputs:
      []
  - id: "StartNode4"
    name: "Cancel"
    mode: "public"
    strict: false
    inputs:
      []

steps:
  - id: "Call3"
    type: "call"
    ref: "ProcessImpexJob-Create"
  - id: "CallNode1"
    type: "call"
    ref: "ViewChannelFreightClassExport-VerifyForm"
  - id: "CallNode2"
    type: "call"
    ref: "ViewChannelFreightClassExport-Prepare"
  - id: "CreateForm3"
    type: "pipelet"
    ref: "CreateForm"
    config:
      FormName: "ShippingExportForm"
      FormResource: "ShippingExport"
    bindings:
      CurrentDomain: "CurrentDomain"
      Form: "ShippingExportForm"
  - id: "CreatePageableFromIterator1"
    type: "pipelet"
    ref: "CreatePageableFromIterator"
    config:
      Pagesize: 1000000
    bindings:
      Iterator: "FreightClassesIterator"
      Pageable: "FreightClasses"
  - id: "DispatchFormAction1"
    type: "pipelet"
    ref: "DispatchFormAction"
    config:
      OutValue_0: "ViewChannelFreightClassExport-SelectConfiguration"
      OutValue_1: "ViewChannelFreightClassExport-Export"
      OutValue_2: "ViewChannelFreightClassExport-Cancel"
    bindings:
      Key_0: "SelectConfiguration"
      Key_1: "Export"
      SelectionKey: "JumpTarget"
      Key_2: "Cancel"
  - id: "EndNode1"
    type: "end"
    strict: false
  - id: "EndNode2"
    type: "end"
    strict: false
  - id: "EndNode3"
    type: "end"
    strict: false
  - id: "GetAllFreightClasses2"
    type: "pipelet"
    ref: "GetAllFreightClasses"
    bindings:
      FreightClasses: "FreightClassesIterator"
  - id: "InteractionEnd2"
    type: "interaction"
  - id: "Join5"
    type: "join"
  - id: "JoinNode1"
    type: "join"
  - id: "Jump3"
    type: "jump"
  - id: "JumpNode1"
    type: "jump"
  - id: "JumpNode2"
    type: "jump"
    ref: "SecureJump-Start"
  - id: "KeyMapper3"
    type: "pipelet"
    ref: "KeyMapper"
    bindings:
      InValue_1: "ChannelRepository:Domain"
      InValue_2: "ChannelRepository:Domain"
      OutValue_1: "ProcessOwningDomain"
      OutValue_2: "ProcessExecutionDomain"
  - id: "KeyMapper4"
    type: "pipelet"
    ref: "KeyMapper"
    config:
      ValueType: "Form Value"
    bindings:
      InValue_1: "FreightClasses:ID"
      InValue_2: "ShippingExportForm:ExportFile:Value"
      OutValue_1: "ObjectsID"
      OutValue_2: "SelectedFile"
      InValue_3: "Locale:RegionalAttribute(DateTimePatternKey)"
      OutValue_3: "DateTimePattern"
  - id: "PrepareApplicationView2"
    type: "pipelet"
    ref: "PrepareApplicationView"
    config:
      SelectedMenuItem: "OrderStatistics"
      WorkingTemplate: "impex/FreightClassExportSelectConfiguration"
  - id: "SetDictionaryValue4"
    type: "pipelet"
    ref: "SetDictionaryValue"
    config:
      Name: "JobDescription"
      Value: "Export freight classes"
      ValueType: "Form Value"
  - id: "SetDictionaryValue5"
    type: "pipelet"
    ref: "SetDictionaryValue"
    config:
      Name: "ProcessPipelineName"
      Value: "ProcessExport"
      ValueType: "Form Value"
  - id: "SetDictionaryValue6"
    type: "pipelet"
    ref: "SetDictionaryValue"
    config:
      Name: "ProcessPipelineStartNode"
      Value: "Export"
      ValueType: "Form Value"
  - id: "SetDictionaryValue7"
    type: "pipelet"
    ref: "SetDictionaryValue"
    config:
      Name: "JobName"
      Value: "ProcessShippingImpex"
      ValueType: "Form Value"
  - id: "SortIteratorByComparator1"
    type: "pipelet"
    ref: "SortIteratorByComparator"
    config:
      DefaultSortingAttribute: "Id"
      DefaultSortingOrder: true
    bindings:
      Iterator: "FreightClassesIterator"
      SortedIterator: "FreightClassesIterator"
      SortingAttribute: "null"
      SortingOrder: "null"
  - id: "ValidateForm1"
    type: "pipelet"
    ref: "ValidateForm"
    bindings:
      Form: "ShippingExportForm"

links:
  - from: "SetDictionaryValue4"
    via: "next"
    to: "SetDictionaryValue5"
    into: "in"
  - from: "Join5"
    via: "next"
    to: "PrepareApplicationView2"
    into: "in"
  - from: "PrepareApplicationView2"
    via: "next"
    to: "InteractionEnd2"
    into: "in"
  - from: "StartNode3"
    via: "next"
    to: "SetDictionaryValue4"
    into: "in"
  - from: "SetDictionaryValue7"
    via: "next"
    to: "EndNode3"
    into: "in"
  - from: "CallNode1"
    via: "next"
    to: "CallNode2"
    into: "in"
  - from: "StartNode4"
    via: "next"
    to: "JumpNode1"
    into: "in"
  - from: "SortIteratorByComparator1"
    via: "next"
    to: "CreatePageableFromIterator1"
    into: "in"
  - from: "GetAllFreightClasses2"
    via: "next"
    to: "SortIteratorByComparator1"
    into: "in"
  - from: "StartNode2"
    via: "next"
    to: "CreateForm3"
    into: "in"
  - from: "Start5"
    via: "next"
    to: "CallNode1"
    into: "in"
  - from: "KeyMapper3"
    via: "next"
    to: "Call3"
    into: "in"
  - from: "CreateForm3"
    via: "next"
    to: "ValidateForm1"
    into: "in"
  - from: "Start4"
    via: "next"
    to: "Join5"
    into: "in1"
  - from: "StartNode1"
    via: "next"
    to: "DispatchFormAction1"
    into: "in"
  - from: "DispatchFormAction1"
    via: "error"
    to: "JoinNode1"
    into: "in2"
  - from: "DispatchFormAction1"
    via: "next"
    to: "JoinNode1"
    into: "in1"
  - from: "JoinNode1"
    via: "next"
    to: "JumpNode2"
    into: "in"
  - from: "SetDictionaryValue5"
    via: "next"
    to: "SetDictionaryValue6"
    into: "in"
  - from: "ValidateForm1"
    via: "error"
    to: "EndNode2"
    into: "in"
  - from: "ValidateForm1"
    via: "next"
    to: "EndNode1"
    into: "in"
  - from: "Call3"
    via: "next"
    to: "Jump3"
    into: "in"
  - from: "CallNode2"
    via: "next"
    to: "GetAllFreightClasses2"
    into: "in"
  - from: "KeyMapper4"
    via: "next"
    to: "KeyMapper3"
    into: "in"
  - from: "SetDictionaryValue6"
    via: "next"
    to: "SetDictionaryValue7"
    into: "in"
  - from: "CreatePageableFromIterator1"
    via: "next"
    to: "KeyMapper4"
    into: "in"
  - from: "CallNode1"
