    name: "GetProductCompareRefIDs"
    mode: "private"
    strict: true
    inputs:
      []

steps:
  - id: "Call12"
    type: "call"
    ref: "ViewProductCompare-Prefix"
  - id: "Call2"
    type: "call"
    ref: "ProcessClipboard-DeleteAllEntries"
  - id: "Call4"
    type: "call"
    ref: "ViewProductCompare-Prefix"
  - id: "Call5"
    type: "call"
    ref: "ViewProductCompare-Prefix"
  - id: "Call6"
    type: "call"
    ref: "ViewProductCompare-Prefix"
  - id: "Call7"
    type: "call"
    ref: "ViewProductCompare-Prefix"
  - id: "CallNode1"
    type: "call"
    ref: "ViewProductCompare-Prefix"
  - id: "CallNode10"
    type: "call"
    ref: "ProcessCart-GetProductsToAdd"
  - id: "CallNode2"
    type: "call"
    ref: "ViewProductCompare-GetProductCompareRefIDs"
  - id: "CallNode3"
    type: "call"
    ref: "ProcessSearchEngineAttributes-CreateRobotsIndexFollowMetaTag"
  - id: "CallNode4"
    type: "call"
    ref: "ViewProductCompare-GetProductCompareRefIDs"
  - id: "CallNode5"
    type: "call"
    ref: "ProcessCart-GetCurrentCart"
    bindings:
      Organization: "CurrentOrganization"
      User: "CurrentUser"
      BasketBORepository: "ApplicationBO:Extension(\"Basket\"):getBasketBORepository(CurrentOrganization)"
      TaxationPolicy: "null"
  - id: "CallNode6"
    type: "call"
    ref: "ProcessB2CProduct-GetProductBOs"
  - id: "CallNode7"
    type: "call"
    ref: "ProcessCart-AddProducts"
    bindings:
      Cart: "CurrentCart"
      PreferenceDomain: "CurrentProductRepository:Domain"
      BasketBO: "CurrentCartBO"
  - id: "CompareProducts1"
    type: "pipelet"
    ref: "CompareProducts"
    config:
      FilteredAttributes: "orderRequiredAttributes;SKU;shortDescription;longDescription;name;manufacturerName;manufacturerSKU;PID_*;AC_*;RC_*;news_*;report_*;advertisement_*;specification_*;eclass;unspsc;AttributeGroupID;BME_*"
    bindings:
      Products: "AllProducts"
  - id: "CreateProductIdentifierLookupHelper1"
    type: "pipelet"
    ref: "CreateProductIdentifierLookupHelper"
    config:
      LookupType: "ProductDomainLookup"
    bindings:
      ProductDomain: "CurrentProductRepository:RepositoryDomain"
  - id: "DecisionNode1"
    type: "decision"
    condition: "PageNumber"
  - id: "DecisionNode2"
    type: "decision"
    condition: "ProductBOs"
  - id: "DeterminePageable11"
    type: "pipelet"
    ref: "DeterminePageable"
    bindings:
      PageableName: "\"Products\""
  - id: "DispatchFormAction1"
    type: "pipelet"
    ref: "DispatchFormAction"
    config:
      OutValue_0: "ViewProductCompare-Show"
      OutValue_1: "ViewProductCompare-Add"
      OutValue_2: "ViewProductCompare-Delete"
      PagingPipeline: "ViewProductCompare-Paging"
      OutValue_3: "ViewProductCompare-DeleteAll"
      OutValue_4: "ViewProductCompare-AddToCart"
      OutValue_5: "ViewProductCompare-PreviousPage"
      OutValue_6: "ViewProductCompare-NextPage"
    bindings:
      Key_0: "show"
      Key_1: "add"
      Key_2: "delete"
      Key_3: "deleteAll"
      SelectionKey: "JumpTarget"
      Key_4: "addToCart"
      Key_5: "switchToPreviousPage"
      Key_6: "switchToNextPage"
  - id: "End1"
    type: "end"
    strict: false
  - id: "EndNode1"
    type: "end"
    strict: true
    outputs:
      - key: "ProductCompareClipboard"
        type: "com.intershop.component.foundation.capi.clipboard.Clipboard"
        guaranteed: false
      - key: "ProductCompareRefIDs"
        type: "java.util.Iterator"
        guaranteed: false
  - id: "GetClipboard1"
    type: "pipelet"
    ref: "GetClipboard"
    config:
      SessionRegistrationID: "ProductCompareClipboard"
      SetFormValues: "Yes"
    bindings:
      Clipboard: "ProductCompareClipboard"
      UUIDIterator: "ProductCompareRefIDs"
  - id: "GetFormSelection4"
    type: "pipelet"
    ref: "GetFormSelection"
    config:
      DefaultParameterName: "ProductRefID"
    bindings:
      Selection: "SelectedProductRefIDs"
  - id: "GetValuesFromRequest4"
    type: "pipelet"
    ref: "GetValuesFromRequest"
    config:
      Namespace: "ApplicationRepository"
    bindings:
      Namespace: "null"
      Key: "null"
  - id: "Join1"
    type: "join"
  - id: "Join2"
    type: "join"
  - id: "JoinNode1"
    type: "join"
  - id: "JoinNode2"
    type: "join"
  - id: "JoinNode3"
    type: "join"
