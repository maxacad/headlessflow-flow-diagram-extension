    strict: false
    inputs:
      []
  - id: "Start2"
    name: "Delete"
    mode: "public"
    strict: false
    inputs:
      []
  - id: "Start21"
    name: "Dispatch"
    mode: "private"
    strict: false
    inputs:
      []
  - id: "Start3"
    name: "AddToCart"
    mode: "public"
    strict: false
    inputs:
      []
  - id: "Start4"
    name: "Paging"
    mode: "private"
    strict: false
    inputs:
      []
  - id: "Start5"
    name: "Prefix"
    mode: "private"
    strict: false
    inputs:
      []
  - id: "Start6"
    name: "Show"
    mode: "private"
    strict: false
    inputs:
      []
  - id: "StartNode1"
    name: "DeleteAll"
    mode: "public"
    strict: false
    inputs:
      []
  - id: "StartNode2"
    name: "NextPage"
    mode: "private"
    strict: false
    inputs:
      []
  - id: "StartNode3"
    name: "PreviousPage"
    mode: "private"
    strict: false
    inputs:
      []
