  - id: "Jump2"
    type: "jump"
    ref: "ViewProductCompare-Show"
  - id: "Jump3"
    type: "jump"
    ref: "ViewProductCompare-Show"
  - id: "JumpNode1"
    type: "jump"
    ref: "ViewPage-Start"
  - id: "KeyMapper1"
    type: "pipelet"
    ref: "KeyMapper"
    config:
      ValueType: "Dictionary Value"
    bindings:
      InValue_1: "CurrentRequest:PipelineDictionary"
      OutValue_1: "Dictionary"
      InValue_3: "\"systempage.productComparision.pagelet2-systempage.productComparision\""
      OutValue_3: "PageletEntryPointID"
      InValue_2: "\"product/ProductCompare\""
      OutValue_2: "WorkingTemplate"
  - id: "KeyMapper2"
    type: "pipelet"
    ref: "KeyMapper"
    config:
      ValueType: "Form Value"
    bindings:
      OutValue_1: "PageNumber"
      InValue_1: "NextPage"
  - id: "KeyMapper3"
    type: "pipelet"
    ref: "KeyMapper"
    config:
      ValueType: "Form Value"
    bindings:
      OutValue_1: "PageNumber"
      InValue_1: "PreviousPage"
  - id: "Pipelet1"
    type: "pipelet"
    ref: "CheckForEmptyIterator"
    bindings:
      FilledIterator: "ProductCompareRefIDs"
  - id: "Pipelet2"
    type: "pipelet"
    ref: "GetProducts"
    bindings:
      ProductRefIterator: "ProductCompareRefIDs"
      ProductDomain: "CurrentProductRepository:RepositoryDomain"
  - id: "Pipelet3"
    type: "pipelet"
    ref: "RemoveClipboard"
    config:
      SessionRegistrationID: "ProductCompareClipboard"
  - id: "Pipelet6"
    type: "pipelet"
    ref: "GetAttributeGroupByID"
    bindings:
      Domain: "Repository:Domain"
      ID: "\"PRODUCT_DETAIL_ATTRIBUTES\""
  - id: "Pipelet7"
    type: "pipelet"
    ref: "GetProducts"
    bindings:
      ProductRefIterator: "ProductCompareRefIDs"
      Products: "AllProducts"
      ProductDomain: "CurrentProductRepository:RepositoryDomain"
  - id: "Pipelet8"
    type: "pipelet"
    ref: "DetermineInventoryForProducts"
    config:
      InventoryRequestContext: "ProductCompare"
    bindings:
      PreferenceDomain: "CurrentProductRepository:RepositoryDomain"
      ProductRefs: "null"
      ProductRefsWithAmount: "null"
      Products: "Products"
      ProductsWithAmount: "null"
      InventoryStatusMap: "InventoryStatusMap"
  - id: "RemoveClipboardEntry1"
    type: "pipelet"
    ref: "RemoveClipboardEntry"
    config:
      SessionRegistrationID: "ProductCompareClipboard"
    bindings:
      ObjectUUID: "ProductCompareRefID"
  - id: "SwitchPage2"
    type: "pipelet"
    ref: "SwitchPage"
    bindings:
      PageableName: "\"ProductBOs\""
  - id: "UpdateClipboard1"
    type: "pipelet"
    ref: "UpdateClipboard"
    config:
      SessionRegistrationID: "ProductCompareClipboard"
      StoreFormValues: "No"
    bindings:
      AllObjectUUIDs: "NULL"
      Clipboard: "ProductCompareClipboard"
      SelectedObjectUUIDs: "SelectedProductRefIDs"
      UUIDIterator: "ProductCompareRefIDs"
  - id: "UpdatePageSize1"
    type: "pipelet"
    ref: "UpdatePageSize"
    bindings:
      PageableIterator: "ProductBOs"
      PageSize: "\"(Integer)3\""

