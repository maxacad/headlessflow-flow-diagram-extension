  - id: "CallNode5"
    type: "call"
    ref: "ProcessClipboard-Update"
  - id: "CallNode6"
    type: "call"
    ref: "ProcessClipboard-Update"
  - id: "CreateWebForm1"
    type: "pipelet"
    ref: "CreateWebForm"
    config:
      webform-id: "ImageMetadataExportConfiguration"
      param.1.name: "SelectedFile"
      param.1.rule: ""
      param.1.required: true
      param.2.name: "ImageViews"
      param.2.rule: ""
      param.2.required: false
      param.3.name: "ImageTypes"
      param.3.rule: ""
      param.3.required: false
      param.4.name: "ImageSets"
      param.4.rule: ""
      param.4.required: false
    bindings:
      WebForm: "ImageMetadataExportConfiguration"
  - id: "DecisionNode1"
    type: "decision"
    condition: "ImageMetadataExportConfiguration_ImageViews"
  - id: "DecisionNode2"
    type: "decision"
    condition: "ImageMetadataExportConfiguration_ImageTypes"
  - id: "DecisionNode3"
    type: "decision"
    condition: "ImageMetadataExportConfiguration_ImageSets"
  - id: "DispatchFormAction1"
    type: "pipelet"
