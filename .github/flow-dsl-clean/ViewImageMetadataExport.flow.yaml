      InValue_1: "OrganizationDomain"
      InValue_2: "OrganizationDomain"
      OutValue_1: "ProcessOwningDomain"
      OutValue_2: "ProcessExecutionDomain"
  - id: "KeyMapper4"
    type: "pipelet"
    ref: "KeyMapper"
    config:
      ValueType: "Form Value"
    bindings:
      InValue_1: "ImageMetadataExportConfiguration_SelectedFile"
      OutValue_1: "SelectedFile"
      InValue_2: "OrganizationDomain:DomainID"
      OutValue_2: "ImageDefinitionDomainID"
      InValue_3: "ImageDefinitionDomain:UUID"
      OutValue_3: "ImageDefinitionDomainUUID"
  - id: "KeyMapper5"
    type: "pipelet"
    ref: "KeyMapper"
    config:
      ValueType: "Form Value"
    bindings:
      InValue_1: "\"ProcessImageMetadataExport\""
      OutValue_1: "ProcessPipelineName"
      InValue_2: "\"Export\""
      OutValue_2: "ProcessPipelineStartNode"
      InValue_3: "\"ProcessCatalogImpex\""
      OutValue_3: "JobName"
  - id: "PrepareApplicationView1"
    type: "pipelet"
    ref: "PrepareApplicationView"
    config:
      WorkingTemplate: "impex/ImageMetadataExportSelectConfiguration"
      SelectedMenuItem: "ImportExport"
  - id: "SetDictionaryValue1"
    type: "pipelet"
    ref: "SetDictionaryValue"
    config:
      Value: "Error-Start"
      Name: "JumpTarget"
      ValueType: "Dictionary Value"
  - id: "SetDictionaryValue4"
    type: "pipelet"
    ref: "SetDictionaryValue"
    config:
      Name: "FILENAME_ALREADY_IN_USE"
      Value: true
  - id: "UpdateWebForm1"
    type: "pipelet"
    ref: "UpdateWebForm"
    config:
      mode: "update"
      webform-id: "ImageMetadataExportConfiguration"
    bindings:
      WebForm: "ImageMetadataExportConfiguration"
  - id: "UpdateWebForm2"
    type: "pipelet"
    ref: "UpdateWebForm"
    config:
      mode: "update"
      webform-id: "ImageMetadataExportConfiguration"
    bindings:
      WebForm: "ImageMetadataExportConfiguration"
  - id: "ValidateWebForm1"
    type: "pipelet"
    ref: "ValidateWebForm"
    bindings:
      WebForm: "ImageMetadataExportConfiguration"
  - id: "ValidateWebForm2"
    type: "pipelet"
    ref: "ValidateWebForm"
    bindings:
      WebForm: "ImageMetadataExportConfiguration"

