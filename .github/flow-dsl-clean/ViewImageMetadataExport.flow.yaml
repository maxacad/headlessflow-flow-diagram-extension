      OutValue_0: "ViewImageMetadataExport-Validate"
      OutValue_1: "ViewCatalogImpex-Status"
      OutValue_2: "ViewImageMetadataExport-OverwriteFile"
      OutValue_3: "ViewImageMetadataExport-CancelOverwriteFile"
    bindings:
      SelectionKey: "JumpTarget"
      Key_0: "Export"
      Key_1: "Cancel"
      Key_2: "Overwrite"
      Key_3: "CancelOverwrite"
  - id: "GetWebForm1"
    type: "pipelet"
    ref: "GetWebForm"
    config:
      webform-id: "ImageMetadataExportConfiguration"
    bindings:
      WebForm: "ImageMetadataExportConfiguration"
  - id: "GetWebForm2"
