flow: "ViewImageMetadataExport"
kind: "view"

entries:
  - id: "Start2"
    name: "Dispatch"
    mode: "private"
    strict: false
    inputs:
      []
  - id: "StartNode1"
    name: "SelectConfiguration"
    mode: "private"
    strict: false
    inputs:
      []
  - id: "StartNode2"
    name: "Validate"
    mode: "private"
    strict: false
    inputs:
      []
  - id: "StartNode3"
    name: "OverwriteFile"
    mode: "private"
    strict: false
    inputs:
      []
  - id: "StartNode4"
    name: "CancelOverwriteFile"
    mode: "private"
    strict: false
    inputs:
      []

