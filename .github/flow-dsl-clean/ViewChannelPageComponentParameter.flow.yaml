flow: "ViewChannelPageComponentParameter"
kind: "view"

entries:
  - id: "Start9"
    name: "Dispatch"
    mode: "private"
    strict: false
    inputs:
      []
  - id: "StartNode19"
    name: "Prefix"
    mode: "private"
    strict: true
    inputs:
      - key: "PageletUUID"
        type: "java.lang.String"
        required: true
  - id: "StartNode23"
    name: "Lock"
    mode: "private"
    strict: false
    inputs:
      []
  - id: "StartNode25"
    name: "View"
    mode: "public"
    strict: false
    inputs:
      []
  - id: "StartNode29"
    name: "Unlock"
    mode: "private"
    strict: false
    inputs:
      []
  - id: "StartNode30"
    name: "CheckLock"
    mode: "private"
    strict: false
    inputs:
      []

steps:
  - id: "CallNode1"
    type: "call"
    ref: "ProcessPageletLock-Unlock"
    bindings:
      LockingDomain: "CurrentChannel:RepositoryDomain"
      User: "CurrentUser"
  - id: "CallNode16"
    type: "call"
    ref: "This:Prefix"
  - id: "CallNode18"
    type: "call"
    ref: "ProcessPageletLock-Lookup"
    bindings:
      PreferenceDomain: "CurrentChannel:RepositoryDomain"
      LockingDomain: "CurrentChannel:RepositoryDomain"
      User: "CurrentUser"
  - id: "CallNode2"
    type: "call"
    ref: "This:Prefix"
  - id: "CallNode3"
    type: "call"
    ref: "This:Prefix"
  - id: "CallNode7"
    type: "call"
    ref: "ProcessPageletLock-Lock"
    bindings:
      LockingDomain: "CurrentChannel:RepositoryDomain"
      PreferenceDomain: "CurrentChannel:RepositoryDomain"
      User: "CurrentUser"
  - id: "DetermineLocales1"
    type: "pipelet"
    ref: "DetermineLocales"
  - id: "DispatchFormAction1"
    type: "pipelet"
    ref: "DispatchFormAction"
    config:
      OutValue_1: "This:CheckLock"
      OutValue_0: "This:View"
      OutValue_2: "This:Lock"
      OutValue_3: "This:Unlock"
    bindings:
      SelectionKey: "JumpTarget"
      Key_1: "checkLock"
      Key_0: "SetLocale"
      Key_2: "lock"
      Key_3: "unlock"
  - id: "DispatchFormActionByBreadcrumb5"
    type: "pipelet"
    ref: "DispatchFormActionByBreadcrumb"
    config:
      SplitMode: "PipelineAndParameter"
    bindings:
      Key_0: "\"backToLastBreadcrumb\""
      SelectionKey: "JumpTarget"
      OutValue_0: "ApplicationState:LastBreadcrumb"
  - id: "EndNode6"
    type: "end"
    strict: true
    outputs:
      - key: "Pagelet"
        type: "com.intershop.component.pmc.capi.pagelet.Pagelet"
        guaranteed: true
  - id: "GetLocale5"
    type: "pipelet"
    ref: "GetLocale"
  - id: "GetPageletByUUID1"
    type: "pipelet"
    ref: "GetPageletByUUID"
  - id: "InteractionEnd6"
    type: "interaction"
  - id: "JoinNode1"
    type: "join"
  - id: "JoinNode2"
    type: "join"
  - id: "Jump1"
    type: "jump"
    ref: "SecureJump-Start"
  - id: "JumpNode1"
    type: "jump"
    ref: "This:View"
  - id: "JumpNode10"
    type: "jump"
    ref: "SecureJump-Start"
  - id: "PrepareApplicationView6"
    type: "pipelet"
    ref: "PrepareApplicationView"
    config:
      SelectedMenuItem: "ContentOverview"
      WorkingTemplate: "content/ChannelPageComponentContent"
  - id: "TextNode1"
    type: "text"

