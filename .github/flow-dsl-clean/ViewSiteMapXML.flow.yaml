flow: "ViewSiteMapXML"
kind: "view"

entries:
  - id: "StartNode1"
    name: "GetFallbackSyndication"
    mode: "private"
    strict: true
    inputs:
      - key: "Syndication"
        type: "com.intershop.component.foundation.capi.syndication.Syndication"
        required: true
  - id: "StartNode4"
    name: "ShowURL"
    mode: "private"
    strict: false
    inputs:
      []
  - id: "StartNode8"
    name: "Start"
    mode: "private"
    strict: true
    inputs:
      - key: "SiteMapFileNo"
        type: "java.lang.String"
        required: false
      - key: "FilePattern"
        type: "java.lang.String"
        required: false

steps:
  - id: "CallNode1"
    type: "call"
    ref: "ViewSiteMapXML-GetFallbackSyndication"
    bindings:
      Syndication: "FallbackSyndication"
  - id: "CreateURL1"
    type: "pipelet"
    ref: "CreateURL"
    config:
      SessionLess: true
      URLRewritten: true
    bindings:
      DomainName: "Syndication:Domain:Site:DomainName"
      LocaleID: "Syndication:LocaleID"
      CurrencyMnemonic: "Syndication:CurrencyMnemonic"
      Action: "Syndication:Target:Parameters:get(\"sitemapPipeline\")"
      Params: "null"
      Protocol: "\"http\""
      CreatedURL: "SiteMapURL"
  - id: "DecisionNode1"
    type: "decision"
    condition: "CurrentRequest:Locale:LocaleID"
  - id: "DecisionNode10"
    type: "decision"
    condition: "Syndication:Enabled"
  - id: "DecisionNode11"
    type: "decision"
    condition: "CurrentSyndication"
  - id: "DecisionNode2"
    type: "decision"
    condition: "Syndication:LocaleID"
  - id: "DecisionNode3"
    type: "decision"
    condition: "FallbackSyndication"
  - id: "DecisionNode5"
    type: "decision"
    condition: "Syndication:Target:ID"
  - id: "DecisionNode6"
    type: "decision"
    condition: "CurrentSyndication"
  - id: "DecisionNode7"
    type: "decision"
    condition: "FallbackSyndication"
  - id: "DecisionNode8"
    type: "decision"
    condition: "SyndicationID"
  - id: "DecisionNode9"
    type: "decision"
    condition: "SiteMapFileNo"
  - id: "EndNode1"
    type: "end"
    strict: true
    outputs:
      - key: "Syndication"
        type: "com.intershop.component.foundation.capi.syndication.Syndication"
        guaranteed: false
  - id: "EndNode2"
    type: "end"
    strict: false
  - id: "GetSiteDirectory1"
    type: "pipelet"
    ref: "GetSiteDirectory"
    bindings:
      Domain: "CurrentDomain"
  - id: "GetStringIndexOf1"
    type: "pipelet"
    ref: "GetStringIndexOf"
    bindings:
      MainString: "SiteMapURL"
      SubString: "Syndication:FileName"
  - id: "GetSyndications1"
    type: "pipelet"
    ref: "GetSyndications"
    bindings:
      Domain: "CurrentOrganization:OwningDomain"
  - id: "InteractionNode5"
    type: "interaction"
  - id: "InteractionNode6"
    type: "interaction"
  - id: "InteractionNode7"
    type: "interaction"
  - id: "JoinNode1"
    type: "join"
  - id: "JoinNode16"
    type: "join"
  - id: "JoinNode2"
    type: "join"
  - id: "JoinNode3"
    type: "join"
  - id: "JoinNode4"
    type: "join"
  - id: "JoinNode5"
    type: "join"
  - id: "JoinNode6"
    type: "join"
  - id: "JumpNode1"
    type: "jump"
    ref: "Error-NotFound"
  - id: "KeyMapper1"
    type: "pipelet"
    ref: "KeyMapper"
    bindings:
      InValue_1: "CurrentSyndication:File"
      OutValue_1: "SiteMapXMLFile"
  - id: "KeyMapper11"
    type: "pipelet"
    ref: "KeyMapper"
    bindings:
      InValue_1: "Syndication"
      OutValue_1: "CurrentSyndication"
  - id: "KeyMapper2"
    type: "pipelet"
    ref: "KeyMapper"
    bindings:
      InValue_1: "FallbackSyndication"
      OutValue_1: "CurrentSyndication"
  - id: "KeyMapper3"
    type: "pipelet"
    ref: "KeyMapper"
    bindings:
      InValue_1: "\"PipelineNotFound\""
      OutValue_1: "ErrorCode"
  - id: "LoopNode1"
    type: "loop"
  - id: "RemoveDictionaryValue1"
    type: "pipelet"
    ref: "RemoveDictionaryValue"
    config:
      Key: "CurrentSyndication"
      RemoveFormValues: true

links:
  - from: "DecisionNode6"
    via: "yes"
    to: "JoinNode2"
    into: "in1"
  - from: "StartNode8"
    via: "next"
    to: "RemoveDictionaryValue1"
    into: "in"
  - from: "LoopNode1"
    via: "next"
    to: "DecisionNode6"
    into: "in"
  - from: "DecisionNode5"
    via: "yes"
    to: "DecisionNode10"
    into: "in"
  - from: "DecisionNode7"
    via: "no"
    to: "CallNode1"
    into: "in"
  - from: "DecisionNode8"
    via: "yes"
    to: "KeyMapper11"
    into: "in"
  - from: "DecisionNode1"
    via: "no"
    to: "JoinNode1"
    into: "in2"
  - from: "DecisionNode9"
    via: "yes"
    to: "InteractionNode5"
    into: "in"
  - from: "DecisionNode7"
    via: "yes"
    to: "JoinNode5"
    into: "in2"
  - from: "DecisionNode6"
    via: "no"
    to: "DecisionNode3"
    into: "in"
  - from: "JoinNode5"
    via: "next"
    to: "JoinNode6"
    into: "in1"
  - from: "KeyMapper1"
    via: "next"
    to: "DecisionNode9"
    into: "in"
  - from: "KeyMapper11"
    via: "next"
    to: "DecisionNode11"
    into: "in"
  - from: "DecisionNode11"
    via: "yes"
    to: "JoinNode3"
    into: "in1"
  - from: "DecisionNode11"
    via: "no"
    to: "JoinNode2"
    into: "in2"
  - from: "JoinNode2"
    via: "next"
    to: "GetSiteDirectory1"
    into: "in"
  - from: "JoinNode6"
    via: "next"
    to: "JoinNode3"
    into: "in3"
  - from: "GetSyndications1"
    via: "next"
    to: "LoopNode1"
    into: "in"
  - from: "DecisionNode2"
    via: "yes"
    to: "DecisionNode1"
    into: "in"
  - from: "DecisionNode2"
    via: "no"
    to: "JoinNode1"
    into: "in1"
  - from: "JoinNode3"
    via: "next"
    to: "LoopNode1"
    into: "loop"
  - from: "DecisionNode10"
    via: "yes"
    to: "DecisionNode8"
    into: "in"
  - from: "StartNode4"
    via: "next"
    to: "InteractionNode7"
    into: "in"
  - from: "CreateURL1"
    via: "next"
    to: "GetStringIndexOf1"
    into: "in"
  - from: "StartNode1"
    via: "next"
    to: "DecisionNode2"
    into: "in"
  - from: "GetStringIndexOf1"
    via: "next"
    to: "EndNode1"
    into: "in"
  - from: "DecisionNode1"
    via: "yes"
    to: "CreateURL1"
    into: "in"
  - from: "DecisionNode3"
    via: "yes"
    to: "KeyMapper3"
    into: "in"
  - from: "DecisionNode3"
    via: "no"
    to: "KeyMapper2"
    into: "in"
  - from: "KeyMapper2"
    via: "next"
    to: "JoinNode2"
    into: "in1"
  - from: "JoinNode1"
    via: "next"
    to: "JoinNode4"
    into: "in1"
  - from: "GetStringIndexOf1"
    via: "error"
    to: "JoinNode4"
    into: "in1"
  - from: "DecisionNode8"
    via: "no"
    to: "DecisionNode7"
    into: "in"
  - from: "LoopNode1"
    via: "do"
    to: "DecisionNode5"
    into: "in"
  - from: "JoinNode16"
    via: "next"
    to: "JoinNode5"
    into: "in1"
  - from: "CallNode1"
    via: "next"
    to: "JoinNode6"
    into: "in2"
  - from: "JoinNode4"
    via: "next"
    to: "EndNode2"
    into: "in"
  - from: "KeyMapper3"
    via: "next"
    to: "JumpNode1"
    into: "in"
  - from: "RemoveDictionaryValue1"
    via: "next"
    to: "GetSyndications1"
    into: "in"
  - from: "DecisionNode5"
    via: "no"
