    type: "interaction"
  - id: "Join1"
    type: "join"
  - id: "Join2"
    type: "join"
  - id: "JoinNode1"
    type: "join"
  - id: "JoinNode2"
    type: "join"
  - id: "Jump1"
    type: "jump"
    ref: "Error-FileNotFound"
  - id: "Jump2"
    type: "jump"
    ref: "SecureJump-Start"
  - id: "Jump4"
    type: "jump"
    ref: "ViewOrganizationImpex-Status"
  - id: "KeyMapper1"
    type: "pipelet"
    ref: "KeyMapper"
    bindings:
      OutValue_1: "JobDomain"
      InValue_2: "\"ProcessUserImpex\""
      OutValue_2: "JobName"
      InValue_1: "OrganizationDomain"
  - id: "KeyMapper2"
    type: "pipelet"
    ref: "KeyMapper"
    bindings:
      InValue_1: "Jobs"
      OutValue_1: "ImpexJobs"
  - id: "Loop1"
    type: "loop"
  - id: "Pipelet1"
    type: "pipelet"
    ref: "DispatchFormAction"
    config:
      OutValue_0: "ViewOrganizationImpex-Status"
      OutValue_1: "ViewOrganizationImpex-DeleteImpexJobs"
      OutValue_2: "ViewOrganizationImpex-Status"
      OutValue_3: "ViewOrganizationImpex-Monitor"
      OutValue_4: "ViewOrganizationImpex-DownloadFile"
      OutValue_5: "ViewUserImport-SelectFile"
      OutValue_6: "ViewUserImport-SelectCSVFile"
      OutValue_7: "ViewUserExport-SimpleSearch"
      OutValue_8: "ViewOrganizationImportFiles-BrowseDirectory"
      OutValue_9: "ViewOrganizationExportFiles-BrowseDirectory"
    bindings:
      Key_0: "Status"
      Key_1: "DeleteImpexJobs"
      Key_2: "ConfirmDeleteImpexJobs"
      Key_3: "Monitor"
      Key_4: "DownloadFile"
      Key_5: "UserImport"
      Key_6: "UserCSVImport"
      Key_7: "UserExport"
      Key_8: "ImportFiles"
      Key_9: "ExportFiles"
      SelectionKey: "JumpTarget"
  - id: "PrepareApplicationView1"
    type: "pipelet"
    ref: "PrepareApplicationView"
    config:
      SelectedMenuItem: "OrganizationImpex"
      WorkingTemplate: "impex/OrganizationImpexOverview"
  - id: "PrepareApplicationView2"
    type: "pipelet"
    ref: "PrepareApplicationView"
    config:
      SelectedMenuItem: "OrganizationImpex"
      WorkingTemplate: "impex/OrganizationImpexMonitor"

