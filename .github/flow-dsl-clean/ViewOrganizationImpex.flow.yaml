flow: "ViewOrganizationImpex"
kind: "view"

entries:
  - id: "Start1"
    name: "Status"
    mode: "private"
    strict: false
    inputs:
      []
  - id: "Start2"
    name: "Dispatch"
    mode: "private"
    strict: false
    inputs:
      []
  - id: "Start3"
    name: "DeleteImpexJobs"
    mode: "private"
    strict: false
    inputs:
