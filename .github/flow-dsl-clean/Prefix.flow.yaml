flow: "Prefix"
kind: "view"

entries:
  - id: "Start1"
    name: "process"
    mode: "private"
    strict: false
    inputs:
      []
  - id: "Start2"
    name: "Start"
    mode: "private"
    strict: false
    inputs:
      []
  - id: "Start3"
    name: "backoffice"
    mode: "private"
    strict: false
    inputs:
      []
  - id: "Start4"
    name: "ProcessExceptions"
    mode: "private"
    strict: false
    inputs:
      []
  - id: "Start5"
    name: "CheckUserPermissions"
    mode: "private"
    strict: false
    inputs:
      - key: "CurrentUser"
        type: "com.intershop.beehive.core.capi.user.User"
        required: false
      - key: "CurrentPipelineName"
        type: "java.lang.String"
        required: false
      - key: "CurrentStartNodeName"
        type: "java.lang.String"
        required: false
      - key: "Organization"
        type: "com.intershop.component.organization.capi.Organization"
        required: false
      - key: "CurrentDomain"
        type: "com.intershop.beehive.core.capi.domain.Domain"
        required: false
      - key: "CurrentApplication"
        type: "com.intershop.beehive.core.capi.domain.Application"
        required: false
  - id: "Start6"
    name: "urlmapping"
    mode: "private"
    strict: false
    inputs:
      []
  - id: "StartNode0"
    name: "ErrorNoPermissions"
    mode: "private"
    strict: false
    inputs:
      []
  - id: "StartNode1"
    name: "CheckProtocol"
    mode: "private"
    strict: false
    inputs:
      []
  - id: "StartNode4"
    name: "CheckApplicationPermission"
    mode: "private"
    strict: true
    inputs:
      - key: "CurrentApplication"
        type: "com.intershop.beehive.core.capi.domain.Application"
        required: true
  - id: "StartNode7"
    name: "CheckPasswordExpired"
    mode: "private"
    strict: true
    inputs:
      []

steps:
  - id: "Call1"
    type: "call"
    ref: "Prefix-ProcessExceptions"
  - id: "Call2"
    type: "call"
    ref: "Prefix-CheckUserPermissions"
  - id: "CallNode1"
    type: "call"
    ref: "Prefix-CheckProtocol"
  - id: "CallNode2"
    type: "call"
    ref: "Prefix-CheckPasswordExpired"
  - id: "CallNode3"
    type: "call"
    ref: "Prefix-CheckApplicationPermission"
  - id: "CheckIsSiteLive1"
    type: "pipelet"
    ref: "CheckIsSiteLive"
  - id: "CheckUserLoggedIn1"
    type: "pipelet"
    ref: "CheckUserLoggedIn"
  - id: "CheckUserPermission3"
    type: "pipelet"
    ref: "CheckUserPermission"
    bindings:
      AuthorizationObject: "CurrentOrganization"
      Permission: "OrgPerm"
  - id: "Decision1"
    type: "decision"
    condition: "CurrentStartNodeName"
  - id: "Decision10"
    type: "decision"
    condition: "CurrentPipelineName"
  - id: "Decision2"
    type: "decision"
    condition: "CurrentOrganization:State"
  - id: "Decision3"
    type: "decision"
    condition: "CurrentPipelineName"
  - id: "Decision6"
    type: "decision"
    condition: "CurrentPipelineName"
  - id: "Decision7"
    type: "decision"
    condition: "CurrentStartNodeName"
  - id: "DecisionNode1"
    type: "decision"
    condition: "HTTPSRequiredForSite"
  - id: "DecisionNode12"
    type: "decision"
    condition: "PasswordExpired"
  - id: "DecisionNode3"
    type: "decision"
    condition: "CurrentApplication:UUID"
  - id: "DecisionNode9"
    type: "decision"
    condition: "CurrentStartNodeName"
  - id: "EnableCSRFGuard1"
    type: "pipelet"
    ref: "EnableCSRFGuard"
  - id: "End1"
    type: "end"
    strict: false
  - id: "End10"
    type: "end"
    strict: false
  - id: "End2"
    type: "end"
    strict: false
  - id: "End3"
    type: "end"
    strict: false
  - id: "End4"
    type: "end"
    strict: false
  - id: "End5"
    type: "end"
    strict: false
  - id: "End7"
    type: "end"
    strict: false
  - id: "End8"
    type: "end"
    strict: false
  - id: "EndNode1"
    type: "end"
    strict: false
  - id: "EndNode15"
    type: "end"
    strict: true
  - id: "EndNode2"
    type: "end"
    strict: false
  - id: "EndNode26"
    type: "end"
    strict: false
  - id: "EndNode5"
    type: "end"
    strict: true
  - id: "ExchangeSessionObject1"
    type: "pipelet"
    ref: "ExchangeSessionObject"
    config:
      ProcessMethod: "Get Object from Session"
      SessionObjectName: "PASSWORD_EXPIRED"
    bindings:
      LoadObject: "PasswordExpired"
  - id: "GetApplications1"
    type: "pipelet"
    ref: "GetApplications"
    bindings:
      Domain: "SystemDomain"
  - id: "GetOrganizationByUser1"
    type: "pipelet"
    ref: "GetOrganizationByUser"
    bindings:
      User: "CurrentUser"
      Organization: "CurrentOrganization"
      OrganizationDomain: "null"
  - id: "GetPermissionsByUser1"
    type: "pipelet"
    ref: "GetPermissionsByUser"
    bindings:
      User: "CurrentUser"
      Organization: "CurrentOrganization"
      AuthorizationObject: "null"
      PermissionMap: "CurrentUserPermissionMap"
  - id: "GetSystemDomain1"
    type: "pipelet"
    ref: "GetSystemDomain"
  - id: "InteractionEnd2"
    type: "interaction"
  - id: "InteractionNode0"
    type: "interaction"
  - id: "InteractionNode1"
    type: "interaction"
  - id: "Join10"
    type: "join"
  - id: "Join11"
    type: "join"
  - id: "Join2"
    type: "join"
  - id: "Join4"
    type: "join"
  - id: "Join5"
    type: "join"
  - id: "JoinNode2"
    type: "join"
  - id: "JoinNode3"
    type: "join"
  - id: "Jump1"
    type: "jump"
    ref: "ViewApplication-DisplayLogin"
  - id: "Jump2"
    type: "jump"
    ref: "ViewApplication-DisplayLogin"
  - id: "JumpNode0"
    type: "jump"
    ref: "This:ErrorNoPermissions"
