    type: "jump"
    ref: "This:ErrorNoPermissions"
  - id: "JumpNode3"
    type: "jump"
    ref: "ViewApplication-ViewPasswordChange"
  - id: "Loop3"
    type: "loop"
  - id: "LoopNode1"
    type: "loop"
  - id: "Pipelet1"
    type: "pipelet"
    ref: "AccessControl"
    config:
      PerformAccessControl: false
      PerformClientIPRangeCheck: false
      PerformServerGroupCheck: false
      PerformUserLoginCheck: false
      RequireHTTPS: true
    bindings:
      ErrorMessage: "null"
  - id: "Pipelet2"
    type: "pipelet"
    ref: "GetDomainPreference"
    config:
      DefaultPreferenceKey: "HTTPSRequired"
      Type: "String"
    bindings:
      PreferenceDomain: "CurrentDomain"
      PreferenceKey: "null"
      PreferenceStringValue: "HTTPSRequiredForSite"
      Preference: "null"
      PreferenceDoubleValue: "null"
      PreferenceIntValue: "null"
  - id: "Pipelet3"
    type: "pipelet"
    ref: "KeyMapper"
    bindings:
      InValue_1: "CurrentDomain:DomainName"
      OutValue_1: "RedirectedFromSite"
  - id: "Pipelet4"
    type: "pipelet"
    ref: "KeyMapper"
    bindings:
      InValue_1: "CurrentUserPermissionMap"
      InValue_10: "CurrentOrganization"
      InValue_2: "CurrentOrganization:OrganizationDomain"
      InValue_3: "CurrentUser:Profile"
      OutValue_1: "PermissionMap"
      OutValue_2: "OrganizationDomain"
      OutValue_10: "Organization"
      OutValue_3: "CurrentUserProfile"
  - id: "Pipelet5"
    type: "pipelet"
    ref: "GetPipelinePermissionsByContext"
    config:
      ExtendedSecurity: true
      DefaultContext: "Organization"
    bindings:
      PipelineName: "CurrentPipelineName"
      StartNodeName: "CurrentStartNodeName"
      Domain: "CurrentDomain"
      Context: "null"
      Application: "CurrentApplication"
      PermissionIDs: "OrgPerms"
  - id: "SetDictionaryValue0"
    type: "pipelet"
    ref: "SetDictionaryValue"
    config:
      Name: "ERROR_User"
      Value: "UserHasNotPermission"
  - id: "SetDictionaryValue3"
    type: "pipelet"
    ref: "SetDictionaryValue"
    config:
      Name: "ERROR_Organization"
      Value: "NotFound"
  - id: "SetDictionaryValue4"
    type: "pipelet"
    ref: "SetDictionaryValue"
    config:
      Name: "ERROR_Organization"
      Value: "IsOffline"
  - id: "SetDictionaryValue5"
    type: "pipelet"
    ref: "SetDictionaryValue"
    config:
      Name: "ERROR_Organization"
      Value: "SiteIsNotLive"
  - id: "TextNode1"
    type: "text"

