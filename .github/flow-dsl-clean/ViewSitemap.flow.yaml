flow: "ViewSitemap"
kind: "view"

entries:
  - id: "StartNode1"
    name: "BrowseCategory"
    mode: "private"
    strict: false
    inputs:
      []
  - id: "StartNode2"
    name: "BrowseCategoryRange"
    mode: "private"
    strict: false
    inputs:
      []
  - id: "StartNode3"
    name: "ProductList"
    mode: "private"
    strict: false
    inputs:
      []
  - id: "StartNode4"
    name: "ProductPaging"
    mode: "private"
    strict: false
    inputs:
      []

steps:
  - id: "AddObjectToVector1"
    type: "pipelet"
    ref: "AddObjectToVector"
    bindings:
      Iterator: "CategoryBOs"
      Object: "StandardCatalogBO:Root"
      InVector: "CategoryBOsVector"
      Objects: "null"
      OutVector: "CategoryBOsVector"
  - id: "CallNode1"
    type: "call"
    ref: "ProcessChannelCatalog-GetStandardCatalogs"
    bindings:
      Organization: "CurrentOrganization"
  - id: "CallNode2"
    type: "call"
    ref: "ProcessChannelCatalog-GetCategory"
    bindings:
      CategoryBO: "CategoryBO"
  - id: "CallNode3"
    type: "call"
    ref: "ProcessStandardCatalog-ProcessProductsPageable"
    bindings:
      Category: "null"
      CategoryBO: "CategoryBO"
      PageableID: "ListNavigationVO:GenericHandlerPipelineParams:PageableID"
  - id: "CallNode4"
    type: "call"
    ref: "ResolveUrlParameters-lookupCategory"
  - id: "CallNode5"
    type: "call"
    ref: "ProcessStandardCatalog-ProcessProductsPageable"
    bindings:
      Category: "null"
  - id: "CallNode6"
    type: "call"
    ref: "FireTrackingEvents-View"
    bindings:
      PageName: "\"sitemap\""
      PageType: "\"general\""
  - id: "CallNode7"
    type: "call"
    ref: "ProcessStandardCatalog-SearchAssignedProducts"
    bindings:
      Repository: "CurrentProductRepository"
      SearchQueryDefinitionID: "\"\""
  - id: "CallNode8"
    type: "call"
    ref: "FireTrackingEvents-View"
    bindings:
      PageName: "\"sitemap\""
      PageType: "\"general\""
  - id: "CallNode9"
    type: "call"
    ref: "FireTrackingEvents-View"
    bindings:
      PageName: "\"sitemap\""
      PageType: "\"general\""
  - id: "DetermineCatalogCategory2"
    type: "pipelet"
    ref: "DetermineCatalogCategory"
  - id: "GetCatalogCategoryBO1"
    type: "pipelet"
    ref: "GetCatalogCategoryBO"
    bindings:
      CatalogCategory: "Category"
      CatalogCategoryBO: "CategoryBO"
  - id: "GetFilterIterator1"
    type: "pipelet"
    ref: "GetFilterIterator"
    config:
      FilterConditionClassName: "com.intershop.sellside.application.b2c.internal.category.filterconditions.CatalogCategoryRangeFilterCondition"
    bindings:
      FilterConditionParam1: "Range"
      Iterator: "CategoryBOs"
      FilterIterator: "CategoryBOs"
  - id: "JoinNode1"
    type: "join"
  - id: "JoinNode3"
    type: "join"
  - id: "JoinNode5"
    type: "join"
  - id: "JumpNode1"
    type: "jump"
    ref: "ViewPage-Start"
  - id: "JumpNode2"
    type: "jump"
    ref: "ViewPage-Start"
  - id: "JumpNode3"
    type: "jump"
    ref: "ViewPage-Start"
  - id: "JumpNode4"
    type: "jump"
    ref: "Error-NotFound"
  - id: "KeyMapper1"
    type: "pipelet"
    ref: "KeyMapper"
    config:
      ValueType: "Dictionary Value"
    bindings:
      InValue_1: "CurrentRequest:PipelineDictionary"
      OutValue_1: "Dictionary"
      InValue_3: "\"systempage.sitemap.pagelet2-systempage.sitemap\""
      OutValue_3: "PageletEntryPointID"
  - id: "KeyMapper2"
    type: "pipelet"
    ref: "KeyMapper"
    config:
      ValueType: "Dictionary Value"
    bindings:
      InValue_1: "CurrentRequest:PipelineDictionary"
      OutValue_1: "Dictionary"
      InValue_3: "\"systempage.sitemap.productList.pagelet2-systempage.sitemap.productList\""
      OutValue_3: "PageletEntryPointID"
  - id: "KeyMapper3"
    type: "pipelet"
    ref: "KeyMapper"
    config:
      ValueType: "Dictionary Value"
    bindings:
      InValue_1: "CurrentRequest:PipelineDictionary"
      OutValue_1: "Dictionary"
      InValue_3: "\"systempage.sitemap.pagelet2-systempage.sitemap\""
      OutValue_3: "PageletEntryPointID"
  - id: "KeyMapper4"
    type: "pipelet"
    ref: "KeyMapper"
    bindings:
      InValue_1: "ApplicationBO:Extension(\"Catalog\"):CatalogBORepository(CurrentOrganization)"
      OutValue_1: "CatalogBORepository"
  - id: "KeyMapper9"
    type: "pipelet"
    ref: "KeyMapper"
    bindings:
      OutValue_1: "HandlerPipeline"
      InValue_1: "\"ViewSitemap\""
      OutValue_2: "PageSize"
      InValue_2: "\"200\""
      InValue_3: "ApplicationBO:Extension(\"Catalog\"):CatalogBORepository(CurrentOrganization)"
      OutValue_3: "CatalogBORepository"
  - id: "LoopNode1"
    type: "loop"
  - id: "RemoveDictionaryValue1"
    type: "pipelet"
    ref: "RemoveDictionaryValue"
    config:
      Key: "CategoryBO"
      RemoveFormValues: false
  - id: "TextNode1"
    type: "text"

links:
  - from: "CallNode1"
    via: "next"
    to: "LoopNode1"
    into: "in"
  - from: "CallNode4"
    via: "next"
    to: "DetermineCatalogCategory2"
    into: "in"
  - from: "RemoveDictionaryValue1"
    via: "next"
    to: "CallNode8"
    into: "in"
  - from: "StartNode1"
    via: "next"
    to: "KeyMapper4"
    into: "in"
  - from: "StartNode2"
    via: "next"
    to: "CallNode1"
    into: "in"
  - from: "KeyMapper3"
    via: "next"
    to: "JumpNode1"
    into: "in"
  - from: "AddObjectToVector1"
    via: "next"
    to: "LoopNode1"
    into: "loop"
  - from: "LoopNode1"
    via: "do"
    to: "AddObjectToVector1"
    into: "in"
  - from: "StartNode3"
    via: "next"
    to: "JoinNode1"
    into: "in1"
  - from: "GetFilterIterator1"
    via: "next"
    to: "JoinNode3"
    into: "in1"
  - from: "GetFilterIterator1"
    via: "error"
    to: "JoinNode3"
    into: "in2"
  - from: "KeyMapper2"
    via: "next"
    to: "JumpNode3"
    into: "in"
  - from: "KeyMapper4"
    via: "next"
    to: "CallNode2"
    into: "in"
  - from: "DetermineCatalogCategory2"
    via: "error"
    to: "JumpNode4"
    into: "in"
  - from: "JoinNode5"
    via: "next"
    to: "CallNode6"
    into: "in"
  - from: "CallNode2"
    via: "next"
    to: "CallNode9"
    into: "in"
  - from: "CallNode6"
    via: "next"
    to: "KeyMapper2"
    into: "in"
  - from: "CallNode5"
    via: "next"
    to: "JoinNode5"
    into: "in1"
  - from: "CallNode7"
    via: "next"
    to: "CallNode3"
    into: "in"
  - from: "CallNode3"
    via: "next"
    to: "JoinNode5"
    into: "in1"
  - from: "KeyMapper9"
    via: "next"
    to: "GetCatalogCategoryBO1"
    into: "in"
  - from: "CallNode5"
    via: "ERROR"
    to: "CallNode7"
    into: "in"
  - from: "JoinNode1"
    via: "next"
    to: "CallNode4"
    into: "in"
  - from: "CallNode8"
    via: "next"
    to: "KeyMapper1"
    into: "in"
  - from: "CallNode9"
    via: "next"
    to: "KeyMapper3"
    into: "in"
  - from: "LoopNode1"
    via: "next"
    to: "GetFilterIterator1"
    into: "in"
  - from: "GetCatalogCategoryBO1"
    via: "next"
    to: "CallNode5"
    into: "in"
  - from: "JoinNode3"
    via: "next"
    to: "RemoveDictionaryValue1"
    into: "in"
  - from: "StartNode4"
    via: "next"
    to: "JoinNode1"
    into: "in3"
  - from: "DetermineCatalogCategory2"
    via: "next"
    to: "KeyMapper9"
    into: "in"
  - from: "KeyMapper1"
    via: "next"
    to: "JumpNode2"
    into: "in"
