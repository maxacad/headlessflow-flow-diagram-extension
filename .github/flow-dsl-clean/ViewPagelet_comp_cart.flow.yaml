flow: "ViewPagelet_comp_cart"
kind: "view"

entries:
  - id: "Start1"
    name: "MiniCart"
    mode: "private"
    strict: false
    inputs:
      []
  - id: "Start6"
    name: "RunningCartTotal"
    mode: "private"
    strict: false
    inputs:
      []
  - id: "StartNode1"
    name: "DetailedSummary"
    mode: "private"
    strict: false
    inputs:
      []
  - id: "StartNode2"
    name: "RecommendedProductList"
    mode: "private"
    strict: true
    inputs:
      - key: "PageletConfigurationParameters"
        type: "java.util.Map"
        required: true
      - key: "ApplicationBO"
        type: "com.intershop.component.application.capi.ApplicationBO"
        required: false
  - id: "StartNode3"
    name: "GetAlternativeProducts"
    mode: "private"
    strict: true
    inputs:
      - key: "ApplicationBO"
        type: "com.intershop.component.application.capi.ApplicationBO"
        required: true
      - key: "CurrentOrganization"
        type: "com.intershop.component.organization.capi.Organization"
        required: true

steps:
  - id: "CallNode1"
    type: "call"
    ref: "ProcessChannelCatalog-GetCategory"
    bindings:
      CategoryName: "\"HotDeals\""
      CatalogName: "\"Specials\""
  - id: "CallNode2"
    type: "call"
    ref: "ViewPagelet_comp_cart-GetAlternativeProducts"
  - id: "CallNode3"
    type: "call"
    ref: "ProcessCart-GetCurrentCart"
    bindings:
      User: "CurrentUser"
      Organization: "CurrentOrganization"
      BasketBORepository: "ApplicationBO:Extension(\"Basket\"):getBasketBORepository(CurrentOrganization)"
  - id: "CallNode4"
    type: "call"
    ref: "ProcessCart-GetExistingCart"
    bindings:
      User: "CurrentUser"
      Organization: "CurrentOrganization"
      BasketBORepository: "ApplicationBO:Extension(\"Basket\"):getBasketBORepository(CurrentOrganization)"
  - id: "CallNode5"
    type: "call"
    ref: "ProcessChannelCatalog-GetAssignedProducts"
  - id: "CallNode9"
    type: "call"
    ref: "ProcessCart-GetExistingCart"
    bindings:
      User: "CurrentUser"
      Organization: "CurrentOrganization"
      BasketBORepository: "ApplicationBO:Extension(\"Basket\"):getBasketBORepository(CurrentOrganization)"
  - id: "DecisionNode1"
    type: "decision"
    condition: "CategoryBO"
  - id: "DecisionNode2"
    type: "decision"
    condition: "PageletConfigurationParameters:strategy"
  - id: "EndNode1"
    type: "end"
    strict: false
  - id: "EndNode2"
    type: "end"
    strict: true
    outputs:
      - key: "ProductBOs"
        type: "java.util.Iterator"
        guaranteed: false
  - id: "EndNode3"
    type: "end"
    strict: false
  - id: "EndNode4"
    type: "end"
    strict: true
    outputs:
      - key: "AlternativeProductBOCollection"
        type: "java.util.Collection"
        guaranteed: false
  - id: "GetApplicationBO0"
    type: "pipelet"
    ref: "GetApplicationBO"
  - id: "GetApplicationBO1"
    type: "pipelet"
    ref: "GetApplicationBO"
  - id: "GetApplicationBO2"
    type: "pipelet"
    ref: "GetApplicationBO"
  - id: "GetCrossSellProducts1"
    type: "pipelet"
    ref: "GetCrossSellProducts"
    bindings:
      Basket: "CurrentCart"
      Domain: "CurrentOrganization:OwningDomain"
      MaxNumberOfProducts: "PageletConfigurationParameters:maxNumberOfProducts"
      AlternativeCrossSellProducts: "AlternativeProductBOCollection"
      BasketBO: "CurrentCartBO"
      ProductBOs: "ProductBOCollection"
  - id: "GetRepositoryByRepositoryDomain1"
    type: "pipelet"
    ref: "GetRepositoryByRepositoryDomain"
    bindings:
      RepositoryDomain: "CurrentOrganization:OwningDomain"
  - id: "GetValuesFromRequest1"
    type: "pipelet"
    ref: "GetValuesFromRequest"
    config:
      Namespace: "Application"
    bindings:
      Key: "\"CurrentOrganization\""
      Namespace: "null"
  - id: "GetValuesFromRequest2"
    type: "pipelet"
    ref: "GetValuesFromRequest"
    config:
      Namespace: "Application"
    bindings:
      Key: "\"CurrentOrganization\""
      Namespace: "null"
  - id: "GetValuesFromRequest3"
    type: "pipelet"
    ref: "GetValuesFromRequest"
    config:
      Namespace: "Application"
    bindings:
      Key: "\"CurrentOrganization\""
      Namespace: "null"
  - id: "GetValuesFromRequest4"
    type: "pipelet"
    ref: "GetValuesFromRequest"
    config:
      Namespace: "Application"
    bindings:
      Key: "\"CurrentOrganization\""
      Namespace: "null"
  - id: "InteractionNode1"
    type: "interaction"
  - id: "JoinNode0"
    type: "join"
  - id: "JoinNode1"
    type: "join"
  - id: "JoinNode2"
    type: "join"
  - id: "KeyMapper2"
    type: "pipelet"
    ref: "KeyMapper"
    bindings:
      InValue_1: "\"(Integer)10\""
      InValue_2: "\"1\""
      OutValue_1: "PageNumber"
      OutValue_2: "PageSize"
  - id: "KeyMapper3"
    type: "pipelet"
    ref: "KeyMapper"
    bindings:
      InValue_1: "ProductBOCollection"
      OutValue_1: "AlternativeProductBOCollection"
  - id: "KeyMapper4"
    type: "pipelet"
    ref: "KeyMapper"
    bindings:
      InValue_1: "ApplicationBO:Extension(\"Catalog\"):CatalogBORepository(CurrentOrganization)"
      OutValue_1: "CatalogBORepository"
  - id: "KeyMapper5"
    type: "pipelet"
    ref: "KeyMapper"
    bindings:
      InValue_1: "ProductBOCollection:Iterator"
      OutValue_1: "ProductBOs"
  - id: "TextNode1"
    type: "text"
  - id: "VerifyInteger1"
    type: "pipelet"
    ref: "VerifyInteger"
    bindings:
      LocalizedString: "PageletConfigurationParameters:maxNumberOfProducts"
      IntegerObject: "MaxNumberCrossSellProducts"

links:
  - from: "CallNode1"
    via: "next"
    to: "KeyMapper2"
    into: "in"
  - from: "CallNode2"
    via: "next"
    to: "VerifyInteger1"
    into: "in"
  - from: "CallNode3"
    via: "next"
    to: "DecisionNode2"
    into: "in"
  - from: "CallNode4"
    via: "next"
    to: "InteractionNode1"
    into: "in"
  - from: "CallNode5"
    via: "next"
    to: "KeyMapper3"
    into: "in"
  - from: "CallNode9"
    via: "next"
    to: "EndNode1"
    into: "in"
  - from: "DecisionNode1"
    via: "no"
    to: "EndNode4"
    into: "in"
  - from: "DecisionNode1"
    via: "yes"
    to: "CallNode5"
    into: "in"
  - from: "DecisionNode2"
    via: "no"
    to: "JoinNode2"
    into: "in1"
  - from: "DecisionNode2"
    via: "yes"
    to: "CallNode2"
    into: "in"
  - from: "GetApplicationBO0"
    via: "next"
    to: "GetValuesFromRequest2"
    into: "in"
  - from: "GetApplicationBO1"
    via: "next"
    to: "GetValuesFromRequest3"
    into: "in"
  - from: "GetApplicationBO2"
    via: "next"
    to: "GetValuesFromRequest4"
    into: "in"
  - from: "GetCrossSellProducts1"
    via: "next"
    to: "KeyMapper5"
    into: "in"
  - from: "GetRepositoryByRepositoryDomain1"
    via: "next"
    to: "DecisionNode1"
    into: "in"
  - from: "GetValuesFromRequest1"
    via: "error"
    to: "EndNode3"
    into: "in"
  - from: "GetValuesFromRequest1"
    via: "next"
    to: "EndNode3"
    into: "in"
  - from: "GetValuesFromRequest2"
    via: "error"
    to: "JoinNode1"
    into: "in1"
  - from: "GetValuesFromRequest2"
    via: "next"
    to: "JoinNode1"
    into: "in1"
  - from: "GetValuesFromRequest3"
    via: "error"
    to: "JoinNode0"
    into: "in1"
  - from: "GetValuesFromRequest3"
    via: "next"
    to: "JoinNode0"
    into: "in1"
  - from: "GetValuesFromRequest4"
    via: "error"
    to: "CallNode3"
    into: "in"
  - from: "GetValuesFromRequest4"
    via: "next"
    to: "CallNode3"
    into: "in"
  - from: "JoinNode0"
    via: "next"
    to: "CallNode4"
    into: "in"
  - from: "JoinNode1"
    via: "next"
    to: "CallNode9"
    into: "in"
  - from: "JoinNode2"
    via: "next"
    to: "EndNode2"
    into: "in"
  - from: "KeyMapper2"
    via: "next"
    to: "GetRepositoryByRepositoryDomain1"
    into: "in"
  - from: "KeyMapper3"
    via: "next"
    to: "EndNode4"
    into: "in"
  - from: "KeyMapper4"
    via: "next"
    to: "CallNode1"
    into: "in"
  - from: "KeyMapper5"
    via: "next"
    to: "JoinNode2"
    into: "in1"
  - from: "Start1"
    via: "next"
    to: "GetApplicationBO1"
    into: "in"
  - from: "Start6"
    via: "next"
    to: "GetApplicationBO0"
    into: "in"
  - from: "StartNode1"
    via: "next"
    to: "GetValuesFromRequest1"
    into: "in"
  - from: "StartNode2"
    via: "next"
    to: "GetApplicationBO2"
    into: "in"
  - from: "StartNode3"
    via: "next"
    to: "KeyMapper4"
    into: "in"
  - from: "VerifyInteger1"
    via: "next"
    to: "GetCrossSellProducts1"
    into: "in"
