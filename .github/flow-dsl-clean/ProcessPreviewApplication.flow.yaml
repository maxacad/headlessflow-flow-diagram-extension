flow: "ProcessPreviewApplication"
kind: "process"

entries:
  - id: "StartNode8"
    name: "GetPreferredPreviewApplication"
    mode: "private"
    strict: true
    inputs:
      - key: "User"
        type: "com.intershop.beehive.core.capi.user.User"
        required: true
      - key: "ChannelRepository"
        type: "com.intershop.component.mvc.capi.catalog.Repository"
        required: true
      - key: "BackofficeApplicationBO"
        type: "com.intershop.component.application.capi.ApplicationBO"
        required: true
      - key: "CurrentOrganization"
        type: "com.intershop.component.organization.capi.Organization"
        required: false

steps:
  - id: "EndNode1"
    type: "end"
    strict: true
  - id: "EndNode14"
    type: "end"
    strict: true
    outputs:
      - key: "ApplicationBO"
        type: "com.intershop.component.application.capi.ApplicationBO"
        guaranteed: true
  - id: "GetPreferredPreviewApplicationBO1"
    type: "pipelet"
    ref: "GetPreferredPreviewApplicationBO"
    bindings:
      ApplicationBORepository: "BackofficeApplicationBO:getRepository(\"ApplicationBORepository\",ChannelRepository:RepositoryDomain:Site:UUID)"
      Repository: "ChannelRepository"
  - id: "JoinNode1"
    type: "join"
  - id: "TextNode1"
    type: "text"

links:
  - from: "GetPreferredPreviewApplicationBO1"
    via: "next"
    to: "EndNode14"
    into: "in"
  - from: "GetPreferredPreviewApplicationBO1"
    via: "error"
    to: "EndNode1"
    into: "in"
  - from: "JoinNode1"
    via: "next"
    to: "GetPreferredPreviewApplicationBO1"
    into: "in"
  - from: "StartNode8"
    via: "next"
    to: "JoinNode1"
    into: "in1"
