flow: "ViewChannelServices"
kind: "view"

entries:
  - id: "StartNode1"
    name: "ListAll"
    mode: "private"
    strict: false
    inputs:
      []
  - id: "StartNode2"
    name: "EnableServices"
    mode: "private"
    strict: false
    inputs:
      []
  - id: "StartNode3"
    name: "DisableServices"
    mode: "private"
    strict: false
    inputs:
      []
  - id: "StartNode4"
    name: "GetChannelSite"
    mode: "private"
    strict: true
    inputs:
      - key: "RepositoryUUID"
        type: "java.lang.String"
        required: true
  - id: "StartNode8"
    name: "Dispatch"
    mode: "private"
    strict: false
    inputs:
      []

steps:
  - id: "Call1"
    type: "call"
    ref: "ProcessChannel-Get"
  - id: "Call2"
    type: "call"
    ref: "ProcessChannel-Get"
  - id: "Call3"
    type: "call"
    ref: "ProcessChannel-Get"
  - id: "CallNode1"
    type: "call"
    ref: "ProcessService-UnassignServices"
    bindings:
      AssignedDomain: "Repository:RepositoryDomain"
      ServiceUUIDs: "SelectedObjectUUIDs"
  - id: "CallNode2"
    type: "call"
    ref: "ProcessClipboard-Update"
  - id: "CallNode3"
    type: "call"
    ref: "ProcessService-AssignServices"
    bindings:
      AssignedDomain: "Repository:RepositoryDomain"
      Domain: "CurrentOrganization:OrganizationDomain"
      ServiceUUIDs: "SelectedObjectUUIDs"
  - id: "CallNode4"
    type: "call"
    ref: "ProcessClipboard-Delete"
  - id: "CallNode5"
    type: "call"
    ref: "ProcessClipboard-Delete"
  - id: "CallNode6"
    type: "call"
    ref: "ProcessClipboard-Update"
  - id: "DispatchFormAction1"
    type: "pipelet"
    ref: "DispatchFormAction"
    config:
      OutValue_0: "ViewChannelServices-ListAll"
      OutValue_1: "ViewChannelServices-EnableServices"
      OutValue_2: "ViewChannelServices-DisableServices"
    bindings:
      Key_0: "ListAll"
      Key_1: "Enable"
      SelectionKey: "JumpTarget"
      Key_2: "Disable"
  - id: "EndNode2"
    type: "end"
    strict: true
    outputs:
      - key: "SiteDomain"
        type: "com.intershop.beehive.core.capi.domain.Domain"
        guaranteed: true
  - id: "EndNode3"
    type: "end"
    strict: true
  - id: "GetAllServiceGroups1"
    type: "pipelet"
    ref: "GetAllServiceGroups"
  - id: "GetDomainByUUID2"
    type: "pipelet"
    ref: "GetDomainByUUID"
    bindings:
      DomainUUID: "Repository:RepositoryDomain:UUID"
      Domain: "ChannelDomain"
  - id: "GetDomainByUUID3"
    type: "pipelet"
    ref: "GetDomainByUUID"
    bindings:
      DomainUUID: "ChannelDomain:SiteID"
      Domain: "SiteDomain"
  - id: "GetRepositoryByUUID1"
    type: "pipelet"
    ref: "GetRepositoryByUUID"
    bindings:
      UUID: "RepositoryUUID"
  - id: "GetServicesByDomain2"
    type: "pipelet"
    ref: "GetServicesByDomain"
    bindings:
      Domain: "CurrentOrganization:OrganizationDomain"
      AssignedDomain: "Repository:RepositoryDomain"
  - id: "InteractionNode1"
    type: "interaction"
  - id: "JoinNode3"
    type: "join"
  - id: "JoinNode4"
    type: "join"
  - id: "JoinNode5"
    type: "join"
  - id: "JumpNode1"
    type: "jump"
    ref: "ViewChannelServices-ListAll"
  - id: "JumpNode2"
    type: "jump"
  - id: "JumpNode3"
    type: "jump"
    ref: "ViewChannelServices-ListAll"
  - id: "PrepareApplicationView1"
    type: "pipelet"
    ref: "PrepareApplicationView"
    config:
      WorkingTemplate: "channel/ChannelServices"
      SelectedMenuItem: "Channels"

links:
  - from: "Call2"
    via: "next"
    to: "CallNode5"
    into: "in"
  - from: "CallNode6"
    via: "next"
    to: "CallNode1"
    into: "in"
  - from: "JoinNode3"
    via: "next"
    to: "JumpNode2"
    into: "in"
  - from: "DispatchFormAction1"
    via: "error"
    to: "JoinNode3"
    into: "in2"
  - from: "DispatchFormAction1"
    via: "next"
    to: "JoinNode3"
    into: "in1"
  - from: "StartNode3"
    via: "next"
    to: "Call2"
    into: "in"
  - from: "StartNode8"
    via: "next"
    to: "DispatchFormAction1"
    into: "in"
  - from: "CallNode1"
    via: "next"
    to: "JumpNode3"
    into: "in"
  - from: "StartNode1"
    via: "next"
    to: "Call3"
    into: "in"
  - from: "CallNode4"
    via: "next"
    to: "CallNode2"
    into: "in"
  - from: "CallNode2"
    via: "next"
    to: "CallNode3"
    into: "in"
  - from: "Call1"
    via: "next"
    to: "CallNode4"
    into: "in"
  - from: "StartNode4"
    via: "next"
    to: "GetRepositoryByUUID1"
    into: "in"
  - from: "GetRepositoryByUUID1"
    via: "next"
    to: "GetDomainByUUID2"
    into: "in"
  - from: "JoinNode4"
    via: "next"
    to: "JoinNode5"
    into: "in1"
  - from: "GetServicesByDomain2"
    via: "next"
    to: "GetAllServiceGroups1"
    into: "in"
  - from: "GetRepositoryByUUID1"
    via: "error"
    to: "JoinNode4"
    into: "in1"
  - from: "GetDomainByUUID2"
    via: "error"
    to: "JoinNode4"
    into: "in1"
  - from: "GetDomainByUUID3"
    via: "error"
    to: "JoinNode5"
    into: "in2"
  - from: "GetDomainByUUID2"
    via: "next"
    to: "GetDomainByUUID3"
    into: "in"
  - from: "GetDomainByUUID3"
    via: "next"
    to: "EndNode2"
    into: "in"
  - from: "JoinNode5"
    via: "next"
    to: "EndNode3"
    into: "in"
  - from: "StartNode2"
    via: "next"
    to: "Call1"
    into: "in"
  - from: "GetAllServiceGroups1"
    via: "next"
    to: "PrepareApplicationView1"
    into: "in"
  - from: "CallNode3"
    via: "next"
    to: "JumpNode1"
    into: "in"
  - from: "CallNode5"
    via: "next"
    to: "CallNode6"
    into: "in"
  - from: "PrepareApplicationView1"
    via: "next"
    to: "InteractionNode1"
    into: "in"
  - from: "Call3"
    via: "next"
    to: "GetServicesByDomain2"
    into: "in"
