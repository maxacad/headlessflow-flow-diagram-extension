      Value: "The application cannot be found"
  - id: "SetDictionaryValue2"
    type: "pipelet"
    ref: "SetDictionaryValue"
    config:
      Name: "ViewLegalContentMessage"
      Value: true
  - id: "SetFormParameterValue1"
    type: "pipelet"
    ref: "SetFormParameterValue"
    bindings:
      FormParameter: "LegalContentMessageForm:LegalMessage"
      Value: "LegalContentMessage:DomainValue"
  - id: "TextNode1"
    type: "text"
  - id: "UpdateLocalizedText1"
    type: "pipelet"
    ref: "UpdateLocalizedText"
    bindings:
      Domain: "ChannelRepository:Domain"
      DomainValue: "LegalContentMessageForm:LegalMessage:Value"
      Key: "\"promotion.message.legalcontent\""
  - id: "ValidateForm1"
    type: "pipelet"
    ref: "ValidateForm"
    bindings:
