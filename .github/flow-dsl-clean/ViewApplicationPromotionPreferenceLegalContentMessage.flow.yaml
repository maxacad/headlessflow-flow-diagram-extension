    config:
      Level: "Warn"
    bindings:
      MessageParam0: "LegalContentMessages"
      MessageText: "\"Warning: The iterator 'LegalContentMessages' is empty\""
  - id: "LogMessage2"
    type: "pipelet"
    ref: "LogMessage"
    config:
      Level: "Warn"
    bindings:
      MessageParam0: "LegalContentMessageForm"
      MessageText: "\"Validation of the 'LegalContentMessageForm' failed!\""
  - id: "PrepareApplicationView3"
    type: "pipelet"
