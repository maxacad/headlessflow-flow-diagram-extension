flow: "ViewPostalDataExport"
kind: "view"

entries:
  - id: "Start2"
    name: "SelectConfiguration"
    mode: "private"
    strict: false
    inputs:
      []
  - id: "Start3"
    name: "Export"
    mode: "private"
    strict: false
    inputs:
      []
  - id: "StartNode1"
    name: "Dispatch"
    mode: "private"
    strict: false
    inputs:
      []
  - id: "StartNode3"
    name: "Prepare"
    mode: "private"
    strict: false
    inputs:
      []

steps:
  - id: "Call2"
    type: "call"
    ref: "ProcessImpexJob-Create"
  - id: "CallNode1"
    type: "call"
    ref: "ViewPostalDataExport-Prepare"
  - id: "CreateWebForm1"
    type: "pipelet"
    ref: "CreateWebForm"
    config:
      param.1.name: "ExportFile"
      param.1.required: true
      param.1.rule: "^[^.\\\\/:*?<>|\\s]([^\\\\/:*?<>|\\s]*[^.\\\\/:*?<>|\\s])?$"
      webform-id: "SelectExportForm"
    bindings:
      WebForm: "SelectExportConfiguration"
  - id: "EndNode3"
    type: "end"
    strict: false
  - id: "GetWebForm1"
    type: "pipelet"
    ref: "GetWebForm"
    config:
      webform-id: "SelectExportForm"
    bindings:
      WebForm: "SelectExportForm"
  - id: "InteractionEnd1"
    type: "interaction"
  - id: "Join2"
    type: "join"
  - id: "Join3"
    type: "join"
  - id: "JoinNode1"
    type: "join"
  - id: "Jump3"
    type: "jump"
    ref: "ViewImpex-Start"
  - id: "JumpNode2"
    type: "jump"
    ref: "SecureJump-Start"
  - id: "KeyMapper1"
    type: "pipelet"
    ref: "KeyMapper"
    config:
      ValueType: "Form Value"
    bindings:
      InValue_2: "SelectExportForm_ExportFile"
      OutValue_2: "SelectedFile"
  - id: "KeyMapper2"
    type: "pipelet"
    ref: "KeyMapper"
    bindings:
      InValue_1: "CurrentOrganization:Domain"
      InValue_2: "CurrentOrganization:Domain"
      OutValue_1: "ProcessOwningDomain"
      OutValue_2: "ProcessExecutionDomain"
  - id: "Pipelet1"
    type: "pipelet"
    ref: "DispatchFormAction"
    config:
      OutValue_0: "ViewPostalDataExport-SelectConfiguration"
      OutValue_1: "ViewPostalDataExport-Export"
      OutValue_2: "ViewImpex-Start"
    bindings:
      Key_0: "Start"
      Key_1: "Export"
      Key_2: "Cancel"
      SelectionKey: "JumpTarget"
  - id: "PrepareApplicationView1"
    type: "pipelet"
    ref: "PrepareApplicationView"
    config:
      SelectedMenuItem: "Import & Export"
      WorkingTemplate: "impex/PostalDataExportSelectConfiguration"
  - id: "SetDictionaryValue4"
    type: "pipelet"
    ref: "SetDictionaryValue"
    config:
      Name: "JobDescription"
      Value: "Export postal data"
      ValueType: "Form Value"
  - id: "SetDictionaryValue5"
    type: "pipelet"
    ref: "SetDictionaryValue"
    config:
      Name: "ProcessPipelineName"
      Value: "ProcessGeoObjectExport"
      ValueType: "Form Value"
  - id: "SetDictionaryValue6"
    type: "pipelet"
    ref: "SetDictionaryValue"
    config:
      Name: "ProcessPipelineStartNode"
      Value: "Export"
      ValueType: "Form Value"
  - id: "SetDictionaryValue7"
    type: "pipelet"
    ref: "SetDictionaryValue"
    config:
      Name: "JobName"
      Value: "ProcessShippingImpex"
      ValueType: "Form Value"
  - id: "UpdateWebForm1"
    type: "pipelet"
    ref: "UpdateWebForm"
    config:
      mode: "update"
      webform-id: "SelectExportForm"
    bindings:
      WebForm: "SelectExportForm"
  - id: "ValidateWebForm1"
    type: "pipelet"
    ref: "ValidateWebForm"
    bindings:
      WebForm: "SelectExportForm"

links:
  - from: "GetWebForm1"
    via: "next"
    to: "UpdateWebForm1"
    into: "in"
  - from: "CreateWebForm1"
    via: "next"
    to: "Join3"
    into: "in1"
  - from: "SetDictionaryValue5"
    via: "next"
    to: "SetDictionaryValue6"
    into: "in"
  - from: "PrepareApplicationView1"
    via: "next"
    to: "InteractionEnd1"
    into: "in"
  - from: "KeyMapper2"
    via: "next"
    to: "Call2"
    into: "in"
  - from: "KeyMapper1"
    via: "next"
    to: "KeyMapper2"
    into: "in"
  - from: "Start2"
    via: "next"
    to: "Join2"
    into: "in1"
  - from: "Call2"
    via: "next"
    to: "Jump3"
    into: "in"
  - from: "SetDictionaryValue4"
    via: "next"
    to: "SetDictionaryValue5"
    into: "in"
  - from: "GetWebForm1"
    via: "error"
    to: "Join2"
    into: "in3"
  - from: "Pipelet1"
    via: "next"
    to: "JoinNode1"
    into: "in1"
  - from: "ValidateWebForm1"
    via: "error"
    to: "Join3"
    into: "in3"
  - from: "SetDictionaryValue6"
    via: "next"
    to: "SetDictionaryValue7"
    into: "in"
  - from: "SetDictionaryValue7"
    via: "next"
    to: "EndNode3"
    into: "in"
  - from: "StartNode3"
    via: "next"
    to: "SetDictionaryValue4"
    into: "in"
  - from: "ValidateWebForm1"
    via: "next"
    to: "CallNode1"
    into: "in"
  - from: "CallNode1"
    via: "next"
    to: "KeyMapper1"
    into: "in"
  - from: "UpdateWebForm1"
    via: "next"
    to: "ValidateWebForm1"
    into: "in"
  - from: "StartNode1"
    via: "next"
    to: "Pipelet1"
    into: "in"
  - from: "Join3"
    via: "next"
    to: "PrepareApplicationView1"
    into: "in"
  - from: "Join2"
    via: "next"
    to: "CreateWebForm1"
    into: "in"
  - from: "Start3"
    via: "next"
    to: "GetWebForm1"
    into: "in"
  - from: "JoinNode1"
    via: "next"
    to: "JumpNode2"
    into: "in"
  - from: "Pipelet1"
    via: "error"
    to: "JoinNode1"
    into: "in2"
