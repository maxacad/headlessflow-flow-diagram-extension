flow: "ProcessProductConfigurationValidators"
kind: "process"

entries:
  - id: "StartNode1"
    name: "IsNotVisible"
    mode: "private"
    strict: true
    inputs:
      []
  - id: "StartNode2"
    name: "IsDefaultValue"
    mode: "private"
    strict: false
    inputs:
      []
  - id: "StartNode3"
    name: "IsRequired"
    mode: "private"
    strict: true
    inputs:
      []
  - id: "StartNode4"
    name: "OR"
    mode: "private"
    strict: true
    inputs:
      []
  - id: "StartNode5"
    name: "WithProfanityCheck"
    mode: "private"
    strict: false
    inputs:
      []
  - id: "StartNode6"
    name: "WithValueList"
    mode: "private"
    strict: false
    inputs:
      - key: "ProductConfigurationSetBORepository"
        type: "com.intershop.component.productconfiguration.capi.set.ProductConfigurationSetBORepository"
        required: false
      - key: "ProductConfigurationValidatorValueListBORepository"
        type: "com.intershop.component.productconfiguration.capi.validator.ProductConfigurationValidatorValueListBORepository"
        required: false
  - id: "StartNode7"
    name: "RestrictedVariations"
    mode: "private"
    strict: false
