      DefaultAttributeName: "DefaultValue"
      DefaultAttributeType: "String"
    bindings:
      ExtensibleObject: "Rule:ValidatorPO"
      AttributeValue: "Value"
  - id: "VerifyBoolean1"
    type: "pipelet"
    ref: "VerifyBoolean"
    bindings:
      NoneLocalizedString: "allowedOrForbidden"
      BooleanValue: "EvaluateAllowedValues"
      ErrorCode: "ParseError: Could not parse the value of key 'allowedOrForbidden' to a Boolean."
  - id: "VerifyInteger1"
    type: "pipelet"
    ref: "VerifyInteger"
    bindings:
      LocalizedString: "DimensionNumberString"
