    ref: "ProcessProductConfigurationOptionSelection-DetermineOptionSelectionValue"
    bindings:
      Option: "Option"
  - id: "CallNode2"
    type: "call"
    ref: "ProcessProductConfigurationValidatorValueList-GetValidatorValueListByID"
    bindings:
      ID: "SelectedValueListID"
      Domain: "ProductDomain"
      ValueListError: "ConfigError"
  - id: "CallNode3"
    type: "call"
    ref: "ProcessProductConfigurationValidatorValueList-GetValidatorValueListByID"
    bindings:
      ID: "SelectedValueListID"
