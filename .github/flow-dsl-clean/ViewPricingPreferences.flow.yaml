flow: "ViewPricingPreferences"
kind: "view"

entries:
  - id: "Start1"
    name: "Dispatch"
    mode: "private"
    strict: false
    inputs:
      []
  - id: "Start2"
    name: "View"
    mode: "private"
    strict: false
    inputs:
      []
  - id: "StartNode1"
    name: "Apply"
    mode: "private"
    strict: false
    inputs:
      []

steps:
  - id: "CallNode1"
    type: "call"
    ref: "ProcessPricingPreferences-GetPricingPreferences"
    bindings:
      PreferenceDomain: "ChannelRepository:Domain"
  - id: "CallNode2"
    type: "call"
    ref: "ProcessPricingPreferences-SetPricingPreferences"
    bindings:
      PreferenceDomain: "ChannelRepository:Domain"
      PricingPreferencesForm: "null"
  - id: "CreateForm2"
    type: "pipelet"
    ref: "CreateForm"
    config:
      FormName: "PricingPreferencesForm"
      FormResource: "PricingPreferences"
    bindings:
      Form: "PricingPreferencesForm"
  - id: "DecisionNode0"
    type: "decision"
    condition: "PricingPreferencesForm:AllowProductPriceChangeEvents:Value"
  - id: "DispatchFormAction1"
    type: "pipelet"
    ref: "DispatchFormAction"
    config:
      OutValue_1: "ViewDomainPreference_52-Start"
      OutValue_0: "ViewPricingPreferences-Apply"
    bindings:
      Key_0: "updateSettings"
      Key_1: "backToPrefs"
      SelectionKey: "JumpTarget"
  - id: "InteractionEnd1"
    type: "interaction"
  - id: "JoinNode1"
    type: "join"
  - id: "JoinNode2"
    type: "join"
  - id: "Jump2"
    type: "jump"
    ref: "SecureJump-Start"
  - id: "Jump3"
    type: "jump"
    ref: "Error-Start"
  - id: "Jump4"
    type: "jump"
    ref: "Error-Start"
  - id: "JumpNode1"
    type: "jump"
    ref: "ViewPricingPreferences-View"
  - id: "JumpNode2"
    type: "jump"
    ref: "ViewPricingPreferences-View"
  - id: "PrepareApplicationView1"
    type: "pipelet"
    ref: "PrepareApplicationView"
    config:
      SelectedMenuItem: "ChannelDomainPreference"
      WorkingTemplate: "pricing/PricingPreferences"
  - id: "SetDictionaryValue0"
    type: "pipelet"
    ref: "SetDictionaryValue"
    config:
      Name: "AllowProductPriceChangeEvents"
      Value: true
      ValueType: "Dictionary Value"
  - id: "SetDictionaryValue1"
    type: "pipelet"
    ref: "SetDictionaryValue"
    config:
      Name: "AllowProductPriceChangeEvents"
      Value: false
      ValueType: "Dictionary Value"
  - id: "SetDictionaryValue6"
    type: "pipelet"
    ref: "SetDictionaryValue"
    config:
      Name: "JumpTarget"
      Value: "ViewPricingPreferences-View"
      ValueType: "Dictionary Value"
  - id: "ValidateForm1"
    type: "pipelet"
    ref: "ValidateForm"
    config:
      Trim: true
    bindings:
      Form: "PricingPreferencesForm"

links:
  - from: "CallNode1"
    via: "ERROR"
    to: "Jump4"
    into: "in"
  - from: "CallNode1"
    via: "next"
    to: "PrepareApplicationView1"
    into: "in"
  - from: "CallNode2"
    via: "ERROR"
    to: "Jump3"
    into: "in"
  - from: "CallNode2"
    via: "next"
    to: "JumpNode1"
    into: "in"
  - from: "CreateForm2"
    via: "next"
    to: "ValidateForm1"
    into: "in"
  - from: "DecisionNode0"
    via: "no"
    to: "SetDictionaryValue1"
    into: "in"
  - from: "DecisionNode0"
    via: "yes"
    to: "SetDictionaryValue0"
    into: "in"
  - from: "DispatchFormAction1"
    via: "error"
    to: "SetDictionaryValue6"
    into: "in"
  - from: "DispatchFormAction1"
    via: "next"
    to: "JoinNode1"
    into: "in1"
  - from: "JoinNode1"
    via: "next"
    to: "Jump2"
    into: "in"
  - from: "JoinNode2"
    via: "next"
    to: "CallNode2"
    into: "in"
  - from: "PrepareApplicationView1"
    via: "next"
    to: "InteractionEnd1"
    into: "in"
  - from: "SetDictionaryValue0"
    via: "next"
    to: "JoinNode2"
    into: "in1"
  - from: "SetDictionaryValue1"
    via: "next"
    to: "JoinNode2"
    into: "in1"
  - from: "SetDictionaryValue6"
    via: "next"
    to: "JoinNode1"
    into: "in1"
  - from: "Start1"
    via: "next"
    to: "DispatchFormAction1"
    into: "in"
  - from: "Start2"
    via: "next"
    to: "CallNode1"
    into: "in"
  - from: "StartNode1"
    via: "next"
    to: "CreateForm2"
    into: "in"
  - from: "ValidateForm1"
    via: "error"
    to: "JumpNode2"
    into: "in"
  - from: "ValidateForm1"
    via: "next"
    to: "DecisionNode0"
    into: "in"
