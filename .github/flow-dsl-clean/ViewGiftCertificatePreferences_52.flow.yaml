      Type: "String"
    bindings:
      PreferenceStringValue: "GiftCertificateEmailTemplate"
      PreferenceDomain: "ChannelRepository:Domain"
  - id: "GetWebForm2"
    type: "pipelet"
    ref: "GetWebForm"
    config:
      webform-id: "GiftCertificateWebForm"
    bindings:
      WebForm: "GiftCertificateWebForm"
  - id: "InteractionEnd1"
