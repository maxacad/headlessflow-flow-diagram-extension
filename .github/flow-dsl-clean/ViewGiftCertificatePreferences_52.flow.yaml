      param.1.required: true
      param.2.name: "EmailTemplate"
      param.2.required: true
      param.3.name: "EmailFrom"
      param.3.required: true
      param.3.rule: "^([0-9,a-z,A-Z]+)([.,_,-]([0-9,a-z,A-Z]+))*[@]([0-9,a-z,A-Z]+)([.,_,-]([0-9,a-z,A-Z]+))*[.]([a-z,A-Z]){2,3}([a-z,A-Z])?$"
      webform-id: "GiftCertificateWebForm"
      param.1.rule: ""
      param.2.rule: ""
    bindings:
      WebForm: "GiftCertificateWebForm"
  - id: "DispatchFormAction1"
    type: "pipelet"
    ref: "DispatchFormAction"
    config:
      OutValue_1: "ViewGiftCertificatePreferences_52-Update"
      OutValue_3: "ViewDomainPreference_52-Start"
    bindings:
      Key_1: "updateSettings"
      Key_3: "backToPrefs"
      SelectionKey: "JumpTarget"
  - id: "GetDomainPreference1"
    type: "pipelet"
    ref: "GetDomainPreference"
    config:
      DefaultPreferenceKey: "GiftCertificateEmailFrom"
