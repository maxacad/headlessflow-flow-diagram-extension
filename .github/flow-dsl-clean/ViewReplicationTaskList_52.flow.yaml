  - id: "CallNode1"
    type: "call"
    ref: "GetReplicationTasks-ByDomain"
  - id: "CallNode2"
    type: "call"
    ref: "ProcessClipboard-Delete"
  - id: "CallNode3"
    type: "call"
    ref: "ProcessClipboard-Update"
  - id: "CheckForEmptyString1"
    type: "pipelet"
    ref: "CheckForEmptyString"
    bindings:
      FilledString: "State"
  - id: "DecisionNode1"
    type: "decision"
    condition: "PageNumber"
  - id: "DecisionNode2"
    type: "decision"
    condition: "PageLocator"
  - id: "GetReplicationGroupConfiguration1"
    type: "pipelet"
    ref: "GetReplicationGroupConfiguration"
  - id: "GetReplicationTaskStates1"
    type: "pipelet"
    ref: "GetReplicationTaskStates"
    bindings:
      DomainID: "CurrentChannel:RepositoryDomain:UUID"
  - id: "InteractionNode1"
    type: "interaction"
  - id: "Join1"
    type: "join"
  - id: "Join2"
    type: "join"
  - id: "JoinNode1"
    type: "join"
  - id: "JoinNode2"
    type: "join"
  - id: "JoinNode3"
    type: "join"
  - id: "JoinNode4"
