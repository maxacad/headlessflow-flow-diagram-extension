  - id: "JumpNode1"
    type: "jump"
    ref: "SecureJump-Start"
  - id: "KeyMapper1"
    type: "pipelet"
    ref: "KeyMapper"
    bindings:
      InValue_1: "PageLocator:Dictionary:State"
      OutValue_1: "State"
  - id: "Pipelet1"
    type: "pipelet"
    ref: "PrepareApplicationView"
    config:
      SelectedMenuItem: "MassDataTasks"
      WorkingTemplate: "replication/ReplicationTaskList_52"
  - id: "Pipelet10"
    type: "pipelet"
    ref: "SetPage"
    bindings:
      PageNumber: "PageLocator:PageNumber"
      Pageable: "ReplicationTasks"
  - id: "Pipelet12"
    type: "pipelet"
    ref: "SetPageLocator"
    config:
      DefaultHandlerPipeline: "ViewReplicationTaskList_52-Paging"
      DefaultPageLocatorName: "TaskList"
    bindings:
      Pageable: "ReplicationTasks"
  - id: "Pipelet2"
    type: "pipelet"
    ref: "DispatchFormAction"
    config:
      OutValue_0: "ViewReplicationTask_52-New"
      OutValue_1: "ViewReplicationTaskList_52-List"
      OutValue_2: "ViewReplicationTask_52-Discard"
      OutValue_3: "ViewReplicationTaskList_52-Paging"
      OutValue_4: "ViewReplicationTaskList_52-Paging"
      OutValue_5: "ViewReplicationTask_52-Remove"
      OutValue_6: "ViewReplicationTaskList_52-List"
      OutValue_7: "ViewReplicationTaskList_52-Paging"
      OutValue_8: "ViewReplicationTask_52-Publish"
      PagingPipeline: "ViewReplicationTaskList_52-Paging"
    bindings:
      Key_0: "New"
      Key_1: "Search"
      Key_2: "Discard"
      Key_3: "ConfirmDelete"
      Key_4: "ConfirmDiscard"
      Key_5: "Delete"
      Key_6: "Cancel"
      Key_7: "ConfirmPublish"
      Key_8: "Publish"
      SelectionKey: "JumpTarget"
  - id: "Pipelet3"
    type: "pipelet"
    ref: "KeyMapper"
    bindings:
      InValue_1: "CurrentChannel:RepositoryDomain"
      OutValue_1: "Domain"
  - id: "Pipelet4"
    type: "pipelet"
    ref: "GetPageable"
    bindings:
      Pageable: "ReplicationTasks"
      PageableID: "PageLocator:PageableID"
  - id: "Pipelet5"
    type: "pipelet"
    ref: "VerifyInteger"
    bindings:
      IntegerObject: "PageNumber"
      LocalizedString: "PageNumber"
  - id: "Pipelet6"
    type: "pipelet"
    ref: "SetPage"
    bindings:
      Pageable: "ReplicationTasks"
  - id: "Pipelet7"
    type: "pipelet"
    ref: "GetPageLocator"
    config:
      DefaultPageLocatorName: "TaskList"
      RestorePageLocatorDictionary: "False"
  - id: "SetPageLocatorParameter1"
    type: "pipelet"
    ref: "SetPageLocatorParameter"
    bindings:
      ParameterName: "\"State\""
      ParameterValue: "State"

links:
