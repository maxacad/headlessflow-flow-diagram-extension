flow: "ViewReplicationTaskList_52"
kind: "process"

entries:
  - id: "StartNode1"
    name: "Paging"
    mode: "private"
    strict: false
    inputs:
      []
  - id: "StartNode2"
    name: "List"
    mode: "private"
    strict: false
    inputs:
      []
  - id: "StartNode3"
    name: "Dispatch"
    mode: "private"
    strict: false
    inputs:
      []

