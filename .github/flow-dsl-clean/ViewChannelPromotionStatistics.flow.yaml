flow: "ViewChannelPromotionStatistics"
kind: "view"

entries:
  - id: "StartNode1"
    name: "Start"
    mode: "private"
    strict: false
    inputs:
      []
  - id: "StartNode2"
    name: "Prefix"
    mode: "private"
    strict: false
    inputs:
      []
  - id: "StartNode3"
    name: "StartUpdate"
    mode: "private"
    strict: false
    inputs:
      []

steps:
  - id: "CallNode1"
    type: "call"
    ref: "ViewChannelPromotionStatistics-Prefix"
  - id: "CallNode2"
    type: "call"
    ref: "UpdateObjectStatisticsRealtime-UpdateAsync"
  - id: "CallNode3"
    type: "call"
    ref: "ViewChannelPromotionStatistics-Prefix"
  - id: "CallNode4"
    type: "call"
    ref: "ProcessPromotion-GetPromotionDomainByChannel"
    bindings:
      Channel: "CurrentChannel"
  - id: "CallNode5"
    type: "call"
    ref: "ProcessPromotionSearch-CreateForm"
  - id: "CallNode6"
    type: "call"
    ref: "UpdateObjectStatisticsRealtime-GetResource"
  - id: "DecisionNode2"
    type: "decision"
    condition: "ObjectStatisticsGroup"
  - id: "EndNode1"
    type: "end"
    strict: false
  - id: "GetObjectStatisticsGroup2"
    type: "pipelet"
    ref: "GetObjectStatisticsGroup"
    config:
      GroupName: "Promotion"
    bindings:
      ObjectDomain: "ObjectDomain"
      ObjectStatisticsGroup: "ObjectStatisticsGroup"
  - id: "GetObjectStatisticsGroup3"
    type: "pipelet"
    ref: "GetObjectStatisticsGroup"
  - id: "GetStagingSystemType1"
    type: "pipelet"
    ref: "GetStagingSystemType"
  - id: "InteractionEnd1"
    type: "interaction"
  - id: "JoinNode1"
    type: "join"
  - id: "JoinNode2"
    type: "join"
  - id: "JoinNode3"
    type: "join"
  - id: "KeyMapper1"
    type: "pipelet"
    ref: "KeyMapper"
    bindings:
      InValue_1: "PromotionDomain"
      OutValue_1: "ObjectDomain"
  - id: "PrepareApplicationView1"
    type: "pipelet"
    ref: "PrepareApplicationView"
    config:
      SelectedMenuItem: "Marketing"
      WorkingTemplate: "objectstatistics/ChannelPromotionStatistics"
  - id: "SetDictionaryValue1"
    type: "pipelet"
    ref: "SetDictionaryValue"
    config:
      Name: "Refresh"
      ValueType: "Dictionary Value"
      Value: true

links:
  - from: "CallNode6"
    via: "Running"
    to: "JoinNode2"
    into: "in2"
  - from: "DecisionNode2"
    via: "no"
    to: "JoinNode3"
    into: "in2"
  - from: "CallNode6"
    via: "next"
    to: "JoinNode3"
    into: "in1"
  - from: "SetDictionaryValue1"
    via: "next"
    to: "JoinNode1"
    into: "in3"
  - from: "JoinNode3"
    via: "next"
    to: "JoinNode1"
    into: "in1"
  - from: "JoinNode1"
    via: "next"
    to: "PrepareApplicationView1"
    into: "in"
  - from: "CallNode1"
    via: "next"
    to: "CallNode2"
    into: "in"
  - from: "CallNode4"
    via: "next"
    to: "KeyMapper1"
    into: "in"
  - from: "KeyMapper1"
    via: "next"
    to: "GetStagingSystemType1"
    into: "in"
  - from: "CallNode5"
    via: "next"
    to: "EndNode1"
    into: "in"
  - from: "GetObjectStatisticsGroup3"
    via: "next"
    to: "JoinNode2"
    into: "in1"
  - from: "StartNode2"
    via: "next"
    to: "CallNode4"
    into: "in"
  - from: "GetStagingSystemType1"
    via: "next"
    to: "CallNode5"
    into: "in"
  - from: "JoinNode2"
    via: "next"
    to: "SetDictionaryValue1"
    into: "in"
  - from: "PrepareApplicationView1"
    via: "next"
    to: "InteractionEnd1"
    into: "in"
  - from: "StartNode3"
    via: "next"
    to: "CallNode1"
    into: "in"
  - from: "CallNode2"
    via: "next"
    to: "GetObjectStatisticsGroup3"
    into: "in"
  - from: "CallNode3"
    via: "next"
    to: "GetObjectStatisticsGroup2"
    into: "in"
  - from: "StartNode1"
    via: "next"
    to: "CallNode3"
    into: "in"
  - from: "GetObjectStatisticsGroup2"
    via: "next"
    to: "DecisionNode2"
    into: "in"
  - from: "DecisionNode2"
    via: "yes"
    to: "CallNode6"
    into: "in"
