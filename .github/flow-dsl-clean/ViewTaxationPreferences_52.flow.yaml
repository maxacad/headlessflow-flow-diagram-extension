flow: "ViewTaxationPreferences_52"
kind: "view"

entries:
  - id: "StartNode1"
    name: "Start"
    mode: "private"
    strict: false
    inputs:
      []
  - id: "StartNode2"
    name: "Update"
    mode: "private"
    strict: false
    inputs:
      []

steps:
  - id: "CreateWebForm1"
    type: "pipelet"
    ref: "CreateWebForm"
    config:
      param.1.name: "TaxationPolicy"
      param.1.required: true
      webform-id: "RegFormUpdateDomainPreference"
    bindings:
      WebForm: "RegFormUpdateDomainPreference"
  - id: "GetDomainPreference1"
    type: "pipelet"
    ref: "GetDomainPreference"
    config:
      DefaultPreferenceKey: "TaxationPolicy"
      Type: "Integer"
    bindings:
      PreferenceDomain: "ChannelRepository:Domain"
      PreferenceIntValue: "TaxationPolicy"
  - id: "GetWebForm1"
    type: "pipelet"
    ref: "GetWebForm"
    config:
      webform-id: "RegFormUpdateDomainPreference"
    bindings:
      WebForm: "RegFormUpdateDomainPreference"
  - id: "InteractionEnd1"
    type: "interaction"
  - id: "InvalidatePageCache1"
    type: "pipelet"
    ref: "InvalidatePageCache"
    bindings:
      Site: "ChannelRepository:RepositoryDomain:Site"
  - id: "Join1"
    type: "join"
  - id: "Join2"
    type: "join"
  - id: "Join3"
    type: "join"
  - id: "Join4"
    type: "join"
  - id: "Join5"
    type: "join"
  - id: "JoinNode1"
    type: "join"
  - id: "Pipelet1"
    type: "pipelet"
    ref: "SetDomainPreference"
    config:
      DefaultPreferenceKey: "TaxationPolicy"
      DefaultPreferenceValue: 0
      Type: "Integer"
    bindings:
      PreferenceDomain: "ChannelRepository:Domain"
      PreferenceIntValue: "TaxationPolicy"
  - id: "PrepareApplicationView1"
    type: "pipelet"
    ref: "PrepareApplicationView"
    config:
      SelectedMenuItem: "ChannelDomainPreference"
      WorkingTemplate: "channel/ChannelTaxationPreference_52"
  - id: "UpdateWebForm1"
    type: "pipelet"
    ref: "UpdateWebForm"
    config:
      mode: "update"
      webform-id: "RegFormUpdateDomainPreference"
    bindings:
      WebForm: "RegFormUpdateDomainPreference"
  - id: "ValidateWebForm1"
    type: "pipelet"
    ref: "ValidateWebForm"
    bindings:
      WebForm: "RegFormUpdateDomainPreference"
  - id: "VerifyInteger1"
    type: "pipelet"
    ref: "VerifyInteger"
    bindings:
      IntegerObject: "TaxationPolicy"
      LocalizedString: "RegFormUpdateDomainPreference_TaxationPolicy"

links:
  - from: "PrepareApplicationView1"
    via: "next"
    to: "InteractionEnd1"
    into: "in"
  - from: "UpdateWebForm1"
    via: "next"
    to: "ValidateWebForm1"
    into: "in"
  - from: "ValidateWebForm1"
    via: "next"
    to: "VerifyInteger1"
    into: "in"
  - from: "Join3"
    via: "next"
    to: "CreateWebForm1"
    into: "in"
  - from: "Join4"
    via: "next"
    to: "Join5"
    into: "in1"
  - from: "ValidateWebForm1"
    via: "error"
    to: "Join4"
    into: "in2"
  - from: "VerifyInteger1"
    via: "next"
    to: "Pipelet1"
    into: "in"
  - from: "VerifyInteger1"
    via: "error"
    to: "Join5"
    into: "in2"
  - from: "GetDomainPreference1"
    via: "next"
    to: "JoinNode1"
    into: "in3"
  - from: "Join5"
    via: "next"
    to: "Join1"
    into: "in1"
  - from: "Join1"
    via: "next"
    to: "GetDomainPreference1"
    into: "in"
  - from: "JoinNode1"
    via: "next"
    to: "Join2"
    into: "in1"
  - from: "Join2"
    via: "next"
    to: "PrepareApplicationView1"
    into: "in"
  - from: "GetDomainPreference1"
    via: "error"
    to: "Join2"
    into: "in3"
  - from: "Pipelet1"
    via: "next"
    to: "InvalidatePageCache1"
    into: "in"
  - from: "InvalidatePageCache1"
    via: "next"
    to: "JoinNode1"
    into: "in1"
  - from: "StartNode2"
    via: "next"
    to: "GetWebForm1"
    into: "in"
  - from: "Pipelet1"
    via: "error"
    to: "Join1"
    into: "in2"
  - from: "StartNode1"
    via: "next"
    to: "Join3"
    into: "in1"
  - from: "CreateWebForm1"
    via: "next"
    to: "Join4"
    into: "in1"
  - from: "GetWebForm1"
    via: "next"
    to: "UpdateWebForm1"
    into: "in"
  - from: "GetWebForm1"
    via: "error"
    to: "Join3"
    into: "in2"
