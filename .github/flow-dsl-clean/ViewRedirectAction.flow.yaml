    ref: "GetCategoryByUUID"
  - id: "Pipelet2"
    type: "pipelet"
    ref: "GetProductByUUID"
    bindings:
      ProductUUID: "ProductID"
      ProductDomain: "CurrentProductRepository:RepositoryDomain"
  - id: "Pipelet3"
    type: "pipelet"
    ref: "GetPageletEntryPointByUUID"

