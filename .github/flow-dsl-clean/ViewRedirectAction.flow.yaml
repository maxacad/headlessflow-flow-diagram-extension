    strict: false
    inputs:
      - key: "CatalogCategoryID"
        type: "java.lang.String"
        required: true
      - key: "CurrentChannel"
        type: "com.intershop.component.mvc.capi.catalog.Repository"
        required: true
  - id: "StartNode38"
    name: "EditProduct"
    mode: "private"
