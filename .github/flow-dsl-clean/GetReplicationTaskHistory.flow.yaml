flow: "GetReplicationTaskHistory"
kind: "process"

entries:
  - id: "StartNode1"
    name: "ByReplicationTask"
    mode: "private"
    strict: false
    inputs:
      []

steps:
  - id: "EndNode1"
    type: "end"
    strict: false
  - id: "EndNode2"
    type: "end"
    strict: false
  - id: "ExecutePageableQuery1"
    type: "pipelet"
    ref: "ExecutePageableQuery"
    config:
      QueryName: "replication/GetHistoryEntriesByReplicationTask"
      Datasource: "default"
      DefaultPageSize: 10
      ParameterName_01: "ReplicationTaskID"
    bindings:
      SearchResult: "ReplicationTaskHistoryEntries"
      ParameterValue_01: "ReplicationTask:UUID"

links:
  - from: "StartNode1"
    via: "next"
    to: "ExecutePageableQuery1"
    into: "in"
  - from: "ExecutePageableQuery1"
    via: "error"
    to: "EndNode1"
    into: "in"
  - from: "ExecutePageableQuery1"
    via: "next"
    to: "EndNode2"
    into: "in"
