flow: "ViewSyndication"
kind: "view"

entries:
  - id: "Start1"
    name: "Dispatch"
    mode: "private"
    strict: false
    inputs:
      []
  - id: "Start2"
    name: "Start"
    mode: "private"
    strict: false
    inputs:
      []
  - id: "Start3"
    name: "ProductDetails"
    mode: "private"
    strict: false
    inputs:
      []
  - id: "Start4"
    name: "SelectProductSource"
    mode: "private"
    strict: false
    inputs:
      []
  - id: "Start5"
    name: "SelectCatalogSource"
    mode: "private"
    strict: false
    inputs:
      []
  - id: "Start6"
    name: "DispatchSelectCatalogSource"
    mode: "private"
    strict: false
    inputs:
      []
  - id: "Start7"
    name: "DispatchSelectProductSource"
    mode: "private"
    strict: false
    inputs:
      []
  - id: "StartNode2"
    name: "GetProductLinks"
    mode: "private"
    strict: false
    inputs:
      []

steps:
  - id: "Call1"
    type: "call"
    ref: "DetermineRepositories-Suppliers"
  - id: "Call2"
    type: "call"
    ref: "DetermineRepositories-ParentChannel"
  - id: "Call3"
    type: "call"
    ref: "DetermineRepositories-Suppliers"
  - id: "Call4"
    type: "call"
    ref: "MVCProcessProduct-Start"
  - id: "Call5"
    type: "call"
    ref: "DetermineRepositories-ParentChannel"
  - id: "CallNode1"
    type: "call"
    ref: "ViewSyndication-GetProductLinks"
  - id: "CallNode2"
    type: "call"
    ref: "DetermineProduct-ParentChannelRepositoryProduct"
  - id: "CallNode3"
    type: "call"
    ref: "DetermineProduct-SupplierProduct"
  - id: "CreateProductIdentifierLookupHelper1"
    type: "pipelet"
    ref: "CreateProductIdentifierLookupHelper"
    config:
      LookupType: "ProductDomainLookup"
    bindings:
      ProductDomain: "Repository:RepositoryDomain"
  - id: "Decision1"
    type: "decision"
    condition: "SourceRepositoryID"
  - id: "Decision3"
    type: "decision"
    condition: "Organization:TypeCode"
  - id: "Decision4"
    type: "decision"
    condition: "SourceRepositoryID"
  - id: "DetermineLocales1"
    type: "pipelet"
    ref: "DetermineLocales"
  - id: "DispatchFormAction1"
    type: "pipelet"
    ref: "DispatchFormAction"
    config:
      OutValue_0: "ViewSyndication-DispatchSelectProductSource"
      OutValue_1: "ViewSyndication-DispatchSelectCatalogSource"
      OutValue_2: "ViewSyndication-Start"
    bindings:
      Key_0: "selectProductSource"
      Key_1: "selectCatalogSource"
      Key_2: "cancel"
      SelectionKey: "JumpTarget"
  - id: "EndNode3"
    type: "end"
    strict: false
  - id: "ExecuteObjectsQuery1"
    type: "pipelet"
    ref: "ExecuteObjectsQuery"
    config:
      Datasource: "current ORM connection"
      QueryName: "product/GetOutgoingProductLinksByProductUUID"
      ParameterName_01: "Product"
    bindings:
      ParameterValue_01: "Product"
  - id: "GetAdditionalContents1"
    type: "pipelet"
    ref: "GetAdditionalContents"
    bindings:
      AdditionalContentIterator: "Additionals"
      ExtensibleObject: "Product"
  - id: "GetCurrencies1"
    type: "pipelet"
    ref: "GetCurrencies"
    config:
      Method: "Active Currencies"
    bindings:
      Domain: "OrganizationDomain"
  - id: "GetLocale2"
    type: "pipelet"
    ref: "GetLocale"
  - id: "GetSortedAttributes1"
    type: "pipelet"
    ref: "GetSortedAttributes"
    config:
      Prefix: "Attrib"
    bindings:
      AttributeNames: "CustomAttributeNames"
      AttributeValues: "CustomAttributeValues"
      ExtensibleObject: "Product"
  - id: "InteractionEnd1"
    type: "interaction"
  - id: "InteractionEnd2"
    type: "interaction"
  - id: "InteractionEnd3"
    type: "interaction"
  - id: "InteractionEnd4"
    type: "interaction"
  - id: "Join1"
    type: "join"
  - id: "JoinNode2"
    type: "join"
  - id: "JoinNode5"
    type: "join"
  - id: "Jump1"
    type: "jump"
    ref: "SecureJump-Start"
  - id: "Jump2"
    type: "jump"
    ref: "ViewSyndication-SelectCatalogSource"
  - id: "Jump3"
    type: "jump"
    ref: "ViewSyndication-SelectProductSource"
  - id: "Jump4"
    type: "jump"
    ref: "ViewSyndicationCatalogs-Start"
  - id: "Jump7"
    type: "jump"
    ref: "ViewSyndicationProducts-Search"
  - id: "JumpNode1"
    type: "jump"
    ref: "ViewProduct-ErrorProductNotAvailable"
  - id: "KeyMapper1"
    type: "pipelet"
    ref: "KeyMapper"
    bindings:
      InValue_1: "ProductRepository"
      OutValue_1: "Repository"
  - id: "KeyMapper14"
    type: "pipelet"
    ref: "KeyMapper"
    bindings:
      InValue_1: "ParentChannelRepository"
      OutValue_1: "Repository"
  - id: "PrepareApplicationView1"
    type: "pipelet"
    ref: "PrepareApplicationView"
    config:
      SelectedMenuItem: "Syndication"
      WorkingTemplate: "syndication/SyndicationOverview"
  - id: "PrepareApplicationView2"
    type: "pipelet"
    ref: "PrepareApplicationView"
    config:
      SelectedMenuItem: "Syndication"
      WorkingTemplate: "syndication/SyndicationProductDetails"
  - id: "PrepareApplicationView3"
    type: "pipelet"
    ref: "PrepareApplicationView"
    config:
      SelectedMenuItem: "Syndication"
      WorkingTemplate: "syndication/SyndicationSelectProductSource"
  - id: "PrepareApplicationView4"
    type: "pipelet"
    ref: "PrepareApplicationView"
    config:
      SelectedMenuItem: "Syndication"
      WorkingTemplate: "syndication/SyndicationSelectCatalogSource"
  - id: "SetDictionaryValue1"
    type: "pipelet"
    ref: "SetDictionaryValue"
    config:
      Name: "ContentType"
      Value: "All"

links:
  - from: "PrepareApplicationView1"
    via: "next"
    to: "InteractionEnd1"
    into: "in"
  - from: "GetSortedAttributes1"
