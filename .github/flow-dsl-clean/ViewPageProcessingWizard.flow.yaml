flow: "ViewPageProcessingWizard"
kind: "view"

entries:
  - id: "Start1"
    name: "SelectAction"
    mode: "private"
    strict: false
    inputs:
      []
  - id: "Start3"
    name: "SelectNextStep"
    mode: "private"
    strict: false
    inputs:
      []
  - id: "Start9"
    name: "Dispatch"
    mode: "private"
    strict: false
    inputs:
      []
  - id: "StartNode11"
    name: "FinishDeletePages"
    mode: "private"
    strict: false
    inputs:
      []
  - id: "StartNode2"
    name: "BackToSelectAction"
    mode: "private"
    strict: false
    inputs:
      []
  - id: "StartNode3"
    name: "ProcessValuesInContainer"
    mode: "private"
    strict: true
    inputs:
      - key: "ContentRepositoryUUID"
        type: "java.lang.String"
        required: false
      - key: "PagePageableID"
        type: "java.lang.String"
        required: false
      - key: "ActionID"
        type: "java.lang.String"
        required: false
      - key: "SelectedObjects"
        type: "java.lang.String"
        required: false
      - key: "UniquePEPSearchID"
        type: "java.lang.String"
        required: false
  - id: "StartNode8"
    name: "RemoveContainer"
    mode: "private"
    strict: true
    inputs:
      []

steps:
  - id: "CallNode1"
    type: "call"
    ref: "ViewPageProcessingWizard-RemoveContainer"
  - id: "CallNode2"
    type: "call"
    ref: "ViewPageProcessingWizard-ProcessValuesInContainer"
  - id: "CallNode3"
    type: "call"
    ref: "ViewPageProcessingWizard-ProcessValuesInContainer"
  - id: "CallNode4"
    type: "call"
    ref: "ViewPageProcessingWizard-ProcessValuesInContainer"
  - id: "CallNode6"
    type: "call"
    ref: "ViewPageProcessingWizard-RemoveContainer"
  - id: "CallNode7"
    type: "call"
    ref: "ViewPageProcessingWizard-RemoveContainer"
  - id: "CallNode8"
    type: "call"
    ref: "ProcessContentWizard-GetSelectedMenuItem"
  - id: "CallNode9"
    type: "call"
    ref: "ProcessContentWizard-GetSelectedMenuItem"
  - id: "CheckForEmptyString1"
    type: "pipelet"
    ref: "CheckForEmptyString"
    bindings:
      FilledString: "ActionID"
  - id: "DecisionNode1"
    type: "decision"
    condition: "ActionID"
  - id: "DecisionNode2"
    type: "decision"
    condition: "ActionID"
  - id: "DecisionNode7"
    type: "decision"
    condition: "ActionID"
  - id: "DecisionNode8"
    type: "decision"
    condition: "ActionID"
  - id: "DispatchFormAction1"
    type: "pipelet"
    ref: "DispatchFormAction"
    config:
      OutValue_0: "ViewPageProcessingWizard-SelectNextStep"
      OutValue_1: "ViewPageProcessingWizard-BackToSelectAction"
      OutValue_2: "ViewPageProcessingWizard-BackToSelectAction"
      OutValue_3: "ViewPageProcessingWizard-FinishDeletePages"
    bindings:
      Key_0: "selectNextStep"
      Key_1: "backToSelectAction"
      Key_2: "cancelDeletePages"
      Key_3: "deletePages"
      SelectionKey: "JumpTarget"
  - id: "DispatchFormActionByBreadcrumb1"
    type: "pipelet"
    ref: "DispatchFormActionByBreadcrumb"
    config:
      SplitMode: "PipelineAndParameter"
    bindings:
      Key_0: "cancel"
      OutValue_0: "ApplicationState:LastListView"
      SelectionKey: "JumpTarget"
  - id: "EndNode1"
    type: "end"
    strict: true
    outputs:
      - key: "ActionID"
        type: "java.lang.String"
        guaranteed: false
      - key: "PagePageableID"
        type: "java.lang.String"
        guaranteed: false
      - key: "SelectedObjects"
        type: "java.lang.String"
        guaranteed: false
      - key: "ContentRepositoryUUID"
        type: "java.lang.String"
        guaranteed: false
      - key: "UniquePEPSearchID"
        type: "java.lang.String"
        guaranteed: false
  - id: "EndNode2"
    type: "end"
    strict: true
  - id: "GetValuesFromContainer2"
    type: "pipelet"
    ref: "GetValuesFromContainer"
    config:
      OverwriteBehavior: false
    bindings:
      ContainerName: "\"Container_PEPProcessing\""
  - id: "InteractionEnd1"
    type: "interaction"
  - id: "JoinNode1"
    type: "join"
  - id: "JoinNode3"
    type: "join"
  - id: "JoinNode4"
    type: "join"
  - id: "JoinNode5"
    type: "join"
  - id: "Jump10"
    type: "jump"
    ref: "SecureJump-Start"
  - id: "JumpNode1"
    type: "jump"
    ref: "ViewPageProcessingWizard-BackToSelectAction"
  - id: "JumpNode2"
    type: "jump"
    ref: "ProcessContentWizard-CreateProcess"
  - id: "JumpNode3"
    type: "jump"
    ref: "ViewContentProcessingWizardCreateLabelAssignment-SelectLabel"
  - id: "JumpNode5"
    type: "jump"
    ref: "ViewPagePageVariantAssignmentCreationWizard-Start"
  - id: "JumpNode6"
    type: "jump"
    ref: "Error-Start"
  - id: "JumpNode7"
    type: "jump"
    ref: "ViewPageProcessingWizard-BackToSelectAction"
  - id: "JumpNode8"
    type: "jump"
    ref: "ViewPageSetParentWizard-Start"
  - id: "KeyMapper1"
    type: "pipelet"
    ref: "KeyMapper"
    config:
      ValueType: "Dictionary Value"
    bindings:
      InValue_1: "PagePageableID"
      InValue_2: "\"Page\""
      OutValue_1: "PageableID"
      OutValue_2: "ContextObject"
  - id: "KeyMapper2"
    type: "pipelet"
    ref: "KeyMapper"
    bindings:
      InValue_1: "RepositoryUUID"
      InValue_2: "UniquePageletSearchID"
      InValue_3: "PageableID"
      OutValue_1: "ContentRepositoryUUID"
      OutValue_2: "UniquePEPSearchID"
      OutValue_3: "PagePageableID"
  - id: "KeyMapper4"
    type: "pipelet"
    ref: "KeyMapper"
    config:
      ValueType: "Form Value"
    bindings:
      InValue_1: "\"BatchProcessPageletEntryPoints-DeletePageletEntryPoints\""
      InValue_2: "\"BatchProcessPageletEntryPoints-Init\""
      InValue_3: "\"BatchProcessPageletEntryPoints-Finish\""
      InValue_4: "\"MasterContent\""
      InValue_5: "\"MasterContent\""
      InValue_6: "PagePageableID"
      OutValue_1: "ProcessPipeline"
      OutValue_2: "InitPipeline"
      OutValue_3: "PostPipeline"
      OutValue_4: "JobName"
      OutValue_5: "JobNamePrefix"
      OutValue_6: "PageableID"
  - id: "PrepareApplicationView1"
    type: "pipelet"
    ref: "PrepareApplicationView"
    config:
      WorkingTemplate: "content/pageletentrypoint/wizard/PageletEntryPointSelectAction"
  - id: "RemoveValuesContainer1"
    type: "pipelet"
    ref: "RemoveValuesContainer"
    bindings:
      ContainerName: "\"Container_PEPProcessing\""
  - id: "SetDictionaryValue1"
    type: "pipelet"
    ref: "SetDictionaryValue"
    config:
      Name: "ERROR_ACTION_NOT_SELECTED"
      Value: true
      ValueType: "Dictionary Value"
  - id: "SetDictionaryValue3"
    type: "pipelet"
    ref: "SetDictionaryValue"
    config:
      Name: "ConfirmDeletePages"
      Value: true
      ValueType: "Dictionary Value"
  - id: "SetValuesToContainer2"
    type: "pipelet"
    ref: "SetValuesToContainer"
    bindings:
      ContainerName: "\"Container_PEPProcessing\""
      DictionaryKeys: "\"ContentRepositoryUUID;PagePageableID;ActionID;SelectedObjects;UniquePEPSearchID\""
  - id: "TextNode2"
    type: "text"

