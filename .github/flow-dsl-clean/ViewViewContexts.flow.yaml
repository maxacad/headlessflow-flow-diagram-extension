flow: "ViewViewContexts"
kind: "view"

entries:
  - id: "StartNode1"
    name: "Dispatch"
    mode: "private"
    strict: false
    inputs:
      []
  - id: "StartNode2"
    name: "List"
    mode: "private"
    strict: false
    inputs:
      []
  - id: "StartNode3"
    name: "Delete"
    mode: "private"
    strict: false
    inputs:
      []
  - id: "StartNode4"
    name: "Internal"
    mode: "private"
    strict: false
    inputs:
      []
  - id: "StartNode5"
    name: "SelectTarget"
    mode: "private"
    strict: false
    inputs:
      []
  - id: "StartNode6"
    name: "StartReplication"
    mode: "private"
    strict: false
    inputs:
      []
  - id: "StartNode8"
    name: "Prefix"
    mode: "private"
    strict: false
    inputs:
      []

steps:
  - id: "AddObjectToVector1"
    type: "pipelet"
    ref: "AddObjectToVector"
    config:
      Mode: "Forbid Duplicates"
    bindings:
      InVector: "ViewContextVector"
      OutVector: "ViewContextVector"
      Object: "ViewContext"
      Objects: "null"
      Iterator: "ViewContexts"
  - id: "Call9"
    type: "call"
    ref: "ProcessBatchJob-Create"
    bindings:
      ProcessDescription: "\"Replicate Content\""
  - id: "CallNode1"
    type: "call"
    ref: "ViewViewContexts-Prefix"
  - id: "CallNode14"
    type: "call"
    ref: "ViewViewContextSearch-UpdateClipboard"
  - id: "CallNode15"
    type: "call"
    ref: "Prefix-GetPipelineName"
    bindings:
      PipelineName: "\"ViewProcessList\""
      StartNode: "\"ListAll\""
  - id: "CallNode18"
    type: "call"
    ref: "ProcessReplicateObjects-GetTargetClusters"
  - id: "CallNode2"
    type: "call"
    ref: "ViewViewContextSearch-UpdateClipboard"
  - id: "CallNode3"
    type: "call"
    ref: "ViewViewContexts-Prefix"
  - id: "CallNode4"
    type: "call"
    ref: "ProcessViewContext-Delete"
  - id: "CallNode5"
    type: "call"
    ref: "This:Prefix"
  - id: "CallNode6"
    type: "call"
    ref: "ViewViewContextSearch-UpdateClipboard"
  - id: "CallNode7"
    type: "call"
    ref: "This:Prefix"
  - id: "CreatePageableFromIterator2"
    type: "pipelet"
    ref: "CreatePageableFromIterator"
    config:
      Pagesize: 15
    bindings:
      Iterator: "ViewContexts"
      Pageable: "ViewContexts"
  - id: "DecisionNode1"
    type: "decision"
    condition: "ViewContext:SystemManaged"
  - id: "DecisionNode2"
    type: "decision"
    condition: "SelectedViewContextsUUIDIterator"
  - id: "DecisionNode3"
    type: "decision"
    condition: "ViewContext:DomainID"
  - id: "DispatchFormAction1"
    type: "pipelet"
    ref: "DispatchFormAction"
    config:
      OutValue_0: "ViewViewContext-New"
      OutValue_1: "ViewViewContexts-Internal"
      OutValue_2: "ViewViewContexts-Delete"
      OutValue_3: "ViewViewContexts-Internal"
      PagingPipeline: "ViewViewContexts-Internal"
      OutValue_4: "ViewViewContexts-SelectTarget"
      OutValue_5: "ViewViewContexts-List"
      OutValue_6: "ViewViewContexts-StartReplication"
    bindings:
      SelectionKey: "JumpTarget"
      Key_0: "new"
      Key_1: "confirmDelete"
      Key_2: "delete"
      Key_3: "cancel"
      Key_4: "selectStagingTarget"
      Key_5: "cancelStaging"
      Key_6: "confirmStaging"
  - id: "EndNode2"
    type: "end"
    strict: false
  - id: "GetClipboard1"
    type: "pipelet"
    ref: "GetClipboard"
    config:
      SetFormValues: "No"
      SessionRegistrationID: "ViewContextClipboard"
    bindings:
      UUIDIterator: "ViewContextUUIDs"
  - id: "GetLocale2"
    type: "pipelet"
    ref: "GetLocale"
    config:
      LocaleFallback: "Request Locale"
  - id: "GetRepositoryByUUID2"
    type: "pipelet"
    ref: "GetRepositoryByUUID"
    bindings:
      UUID: "ContentRepositoryUUID"
      Repository: "ContentRepository"
  - id: "GetViewContextByUUID1"
    type: "pipelet"
    ref: "GetViewContextByUUID"
    bindings:
      PageletUUID: "PageComponentUUID"
  - id: "GetViewContextByUUID2"
    type: "pipelet"
    ref: "GetViewContextByUUID"
  - id: "InteractionEnd12"
    type: "interaction"
  - id: "InteractionNode2"
    type: "interaction"
  - id: "JoinNode1"
    type: "join"
  - id: "JoinNode2"
    type: "join"
  - id: "JoinNode3"
    type: "join"
  - id: "JoinNode4"
    type: "join"
  - id: "JoinNode5"
    type: "join"
  - id: "JoinNode6"
    type: "join"
  - id: "JoinNode9"
    type: "join"
  - id: "Jump2"
    type: "jump"
    ref: "This:Internal"
  - id: "JumpNode15"
    type: "jump"
  - id: "JumpNode2"
    type: "jump"
    ref: "ViewViewContexts-List"
  - id: "JumpNode5"
    type: "jump"
    ref: "SecureJump-Start"
  - id: "KeyMapper15"
    type: "pipelet"
    ref: "KeyMapper"
    bindings:
      InValue_1: "CurrentSelectedChannel:Domain"
      OutValue_1: "ProcessOwningDomain"
      OutValue_2: "ProcessExecutionDomain"
      InValue_2: "CurrentDomain"
  - id: "KeyMapper4"
    type: "pipelet"
    ref: "KeyMapper"
    config:
      ValueType: "Form Value"
    bindings:
      InValue_1: "\"ProcessReplicateObjects-Init\""
      InValue_2: "\"ProcessReplicateObjects-Process\""
      InValue_3: "\"ProcessReplicateObjects-Post\""
      InValue_4: "\"MasterContentReplication\""
      InValue_5: "\"ViewContexts\""
      OutValue_1: "InitPipeline"
      OutValue_2: "ProcessPipeline"
      OutValue_3: "PostPipeline"
      OutValue_4: "JobName"
      OutValue_5: "PageableName"
  - id: "KeyMapper5"
    type: "pipelet"
    ref: "KeyMapper"
    config:
      ValueType: "Form Value"
    bindings:
      InValue_1: "JobName"
      OutValue_1: "JobNamePrefix"
      InValue_2: "\"ContentOverview\""
      OutValue_2: "SelectedMenuItem"
  - id: "LoopNode1"
    type: "loop"
  - id: "LoopNode3"
    type: "loop"
  - id: "Pipelet2"
    type: "pipelet"
    ref: "KeyMapper"
    bindings:
      InValue_1: "\"ViewViewContexts-Internal\""
      OutValue_1: "JumpTarget"
  - id: "PrepareApplicationView12"
    type: "pipelet"
    ref: "PrepareApplicationView"
    config:
      SelectedMenuItem: "ContentOverview"
      WorkingTemplate: "content/viewcontext/ViewContextSelectPublishingTarget"
  - id: "PrepareApplicationView2"
    type: "pipelet"
    ref: "PrepareApplicationView"
    config:
      WorkingTemplate: "content/viewcontext/ViewContextList"
      SelectedMenuItem: "ContentOverview"
  - id: "RegisterPageable2"
    type: "pipelet"
    ref: "RegisterPageable"
    bindings:
      PageableName: "\"ViewContexts\""
      see PageableName: "ViewContexts"
      PageableID: "PageableID"
  - id: "RemoveClipboard1"
    type: "pipelet"
    ref: "RemoveClipboard"
    config:
      SessionRegistrationID: "ViewContextClipboard"
  - id: "RemoveClipboard2"
    type: "pipelet"
    ref: "RemoveClipboard"
    config:
      SessionRegistrationID: "ViewContextClipboard"
  - id: "RemoveDictionaryValue1"
    type: "pipelet"
    ref: "RemoveDictionaryValue"
    config:
      Key: "ViewContext"
  - id: "SetDictionaryValue2"
    type: "pipelet"
    ref: "SetDictionaryValue"
    config:
      Name: "PerformSearch"
      Value: true
  - id: "SetDictionaryValue3"
    type: "pipelet"
    ref: "SetDictionaryValue"
    config:
      Name: "StartFlag"
      Value: true

