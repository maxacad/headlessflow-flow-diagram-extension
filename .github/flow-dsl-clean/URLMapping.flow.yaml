flow: "URLMapping"
kind: "urlmapping"

entries:
  - id: "Start1"
    name: "Resolve"
    mode: "private"
    strict: false
    inputs:
      []
  - id: "Start2"
    name: "CheckLinkDate"
    mode: "private"
    strict: false
    inputs:
      []
  - id: "StartNode1"
    name: "Expand"
    mode: "public"
    strict: false
    inputs:
      []
  - id: "StartNode2"
    name: "RewriteRequest"
    mode: "private"
    strict: true
    inputs:
      - key: "Request"
        type: "com.intershop.beehive.core.capi.request.Request"
        required: true
      - key: "RequestString"
        type: "java.lang.String"
        required: false
  - id: "StartNode3"
    name: "RewriteShortLink"
    mode: "private"
    strict: true
    inputs:
      - key: "ShortLink"
        type: "com.intershop.component.foundation.capi.link.ShortLink"
        required: true
      - key: "RequestString"
        type: "java.lang.String"
        required: true
      - key: "UrlErrorMode"
        type: "java.lang.String"
        required: false
  - id: "StartNode4"
    name: "HandleRewriteFailure"
    mode: "private"
    strict: true
    inputs:
      - key: "RequestString"
        type: "java.lang.String"
        required: false

steps:
  - id: "Call1"
    type: "call"
    ref: "URLMapping-CheckLinkDate"
  - id: "Call2"
    type: "call"
    ref: "URLMapping-CheckLinkDate"
  - id: "CallNode1"
    type: "call"
    ref: "This:RewriteRequest"
    bindings:
      Request: "CurrentRequest"
  - id: "CallNode2"
    type: "call"
    ref: "This:RewriteShortLink"
    bindings:
      UrlErrorMode: "null"
  - id: "CallNode3"
    type: "call"
    ref: "URLMapping-HandleRewriteFailure"
  - id: "CallNode4"
    type: "call"
    ref: "URLMapping-HandleRewriteFailure"
  - id: "CallNode5"
    type: "call"
    ref: "URLMapping-RewriteShortLink"
    bindings:
      UrlErrorMode: "\"true\""
  - id: "CheckURLFormat1"
    type: "pipelet"
    ref: "CheckURLFormat"
    bindings:
      URL: "TargetURL"
  - id: "ConcatenateStrings2"
    type: "pipelet"
    ref: "ConcatenateStrings"
    bindings:
      Concatenated: "ShortLinkURLError"
      String0: "HomeURL"
      String1: "\"/urlerror\""
  - id: "ConcatenateStrings3"
    type: "pipelet"
    ref: "ConcatenateStrings"
    bindings:
      Concatenated: "TargetURL"
      String0: "TargetURL"
      String1: "CurrentRequest:Object(\"_SCRIPT_NAME\")"
  - id: "Decision1"
    type: "decision"
    condition: "CurrentDate:Time"
  - id: "Decision2"
    type: "decision"
    condition: "ShortLink:EndDate"
  - id: "Decision3"
    type: "decision"
