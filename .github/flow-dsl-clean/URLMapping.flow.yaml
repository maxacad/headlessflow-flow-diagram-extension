  - id: "GetShortLinkByURL4"
    type: "pipelet"
    ref: "GetShortLinkByURL"
    bindings:
      ShortURL: "ShortLinkURLError"
  - id: "GetStringSubstitution3"
    type: "pipelet"
    ref: "GetStringSubstitution"
    config:
      DefaultPattern: "(http.?://[^/]*)(.*)"
      DefaultSubstitutionPattern: "\\1"
    bindings:
      OutputString: "HomeURL"
      InputString: "RequestString"
      Pattern: "null"
      SubstitutionPattern: "null"
