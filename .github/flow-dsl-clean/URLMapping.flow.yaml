  - id: "DecisionNode3"
    type: "decision"
    condition: "UrlErrorMode"
  - id: "DecisionNode4"
    type: "decision"
    condition: "RequestString"
  - id: "DecisionNode5"
    type: "decision"
    condition: "HomeURL"
  - id: "DetermineRequestString1"
