flow: "ProcessUserActivationCheck"
kind: "process"

entries:
  - id: "StartNode1"
    name: "IsActivated"
    mode: "private"
    strict: false
    inputs:
      - key: "User<com.intershop.beehive.core.capi.user.User>"
        type: "java.lang.Object"
        required: false
  - id: "StartNode2"
    name: "FilterForActiveUsers"
    mode: "private"
    strict: false
    inputs:
      - key: "Users<java.util.Iterator>"
        type: "java.util.Iterator"
        required: false

steps:
  - id: "AddObjectToVector1"
    type: "pipelet"
    ref: "AddObjectToVector"
    config:
      Mode: "Allow Duplicates"
    bindings:
      InVector: "null"
      Object: "null"
      Objects: "null"
      Iterator: "null"
      OutVector: "FilteredUsers"
  - id: "AddObjectToVector2"
    type: "pipelet"
    ref: "AddObjectToVector"
    config:
      Mode: "Allow Duplicates"
    bindings:
      InVector: "FilteredUsers"
      Object: "User"
      Objects: "null"
      Iterator: "null"
      OutVector: "FilteredUsers"
  - id: "AddObjectToVector3"
    type: "pipelet"
    ref: "AddObjectToVector"
    config:
      Mode: "Allow Duplicates"
    bindings:
      InVector: "FilteredUsers"
      Object: "null"
      Objects: "null"
      Iterator: "Users"
      OutVector: "null"
  - id: "CallNode1"
    type: "call"
    ref: "ProcessUserActivationCheck-IsActivated"
  - id: "DecisionNode1"
    type: "decision"
    condition: "User:Profile:Credentials:isDisabled"
  - id: "EndNode1"
    type: "end"
    strict: false
  - id: "EndNode2"
    type: "end"
    strict: false
  - id: "EndNode3"
    type: "end"
    strict: false
  - id: "JoinNode1"
    type: "join"
  - id: "LoopNode1"
    type: "loop"

links:
  - from: "StartNode1"
    via: "next"
    to: "DecisionNode1"
    into: "in"
  - from: "JoinNode1"
    via: "next"
    to: "LoopNode1"
    into: "loop"
  - from: "LoopNode1"
    via: "next"
    to: "AddObjectToVector3"
    into: "in"
  - from: "AddObjectToVector3"
    via: "next"
    to: "EndNode3"
    into: "in"
  - from: "DecisionNode1"
    via: "yes"
    to: "EndNode1"
    into: "in"
  - from: "DecisionNode1"
    via: "no"
    to: "EndNode2"
    into: "in"
  - from: "StartNode2"
    via: "next"
    to: "AddObjectToVector1"
    into: "in"
  - from: "AddObjectToVector1"
    via: "next"
    to: "LoopNode1"
    into: "in"
  - from: "LoopNode1"
    via: "do"
    to: "CallNode1"
    into: "in"
  - from: "CallNode1"
    via: "YES"
    to: "AddObjectToVector2"
    into: "in"
  - from: "CallNode1"
    via: "NO"
    to: "JoinNode1"
    into: "in2"
  - from: "AddObjectToVector2"
    via: "next"
    to: "JoinNode1"
    into: "in1"
