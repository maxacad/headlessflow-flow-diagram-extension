    type: "join"
  - id: "JoinNode7"
    type: "join"
  - id: "JoinNode8"
    type: "join"
  - id: "JoinNode9"
    type: "join"
  - id: "JumpNode1"
    type: "jump"
    ref: "SecureJump-Start"
  - id: "JumpNode2"
    type: "jump"
    ref: "ViewApplicationPromotionPreferenceBudgetNotification-Edit"
  - id: "LogMessage1"
    type: "pipelet"
    ref: "LogMessage"
    config:
      Level: "Warn"
    bindings:
      MessageParam0: "ApplicationUUID"
      MessageText: "\"Unable to find an Application with UUID {}. This will probably cause problems in the following!\""
  - id: "LogMessage2"
    type: "pipelet"
    ref: "LogMessage"
    config:
      Level: "Warn"
    bindings:
      MessageText: "\"Something went wrong during attempt of setting budget notification form values!\""
  - id: "LogMessage3"
    type: "pipelet"
    ref: "LogMessage"
    config:
      Level: "Warn"
    bindings:
      MessageText: "\"Some Email Notification parameter could not be updated!\""
  - id: "LogMessage5"
    type: "pipelet"
    ref: "LogMessage"
    config:
      Level: "Warn"
    bindings:
      MessageText: "\"form validation fails!\""
  - id: "Pipelet1"
    type: "pipelet"
    ref: "CreateLocalizationContextFromApplication"
    bindings:
      LocaleInformation: "SelectedLocale"
  - id: "PrepareApplicationView3"
    type: "pipelet"
    ref: "PrepareApplicationView"
    config:
      SelectedMenuItem: "Applications"
      WorkingTemplate: "app/ApplicationPromotionPreferences"
    bindings:
      WorkingTemplateSuffix: "CurrentChannel:TypeCode"
  - id: "SetApplicationPreference1"
    type: "pipelet"
    ref: "SetApplicationPreference"
    config:
      DefaultApplicationPreferenceKey: "BudgetNotificationEmailFrom"
      Type: "String"
    bindings:
      ApplicationPreferenceStringValue: "NotificationSettings:AddressEmailFrom:Value"
  - id: "SetApplicationPreference2"
    type: "pipelet"
    ref: "SetApplicationPreference"
    config:
      Type: "String"
      DefaultApplicationPreferenceKey: "BudgetNotificationEmailTemplateExhausted"
    bindings:
      ApplicationPreferenceStringValue: "NotificationSettings:BudgetExhaustedEmailTemplate:Value"
  - id: "SetApplicationPreference3"
    type: "pipelet"
    ref: "SetApplicationPreference"
    config:
      DefaultApplicationPreferenceKey: "BudgetNotificationEmailTemplatePercentage"
      Type: "String"
    bindings:
      ApplicationPreferenceStringValue: "NotificationSettings:BudgetThresholdReachedEmailTemplate:Value"
  - id: "SetDictionaryValue2"
    type: "pipelet"
    ref: "SetDictionaryValue"
    config:
      Name: "ViewBudgetNotification"
      Value: true
  - id: "SetFormParameterValues1"
    type: "pipelet"
    ref: "SetFormParameterValues"
  - id: "UpdateLocalizedText1"
    type: "pipelet"
    ref: "UpdateLocalizedText"
    config:
      DefaultApplicationPreferenceKey: "BudgetExhaustedEmailSubject"
      Type: "String"
    bindings:
      ApplicationPreferenceStringValue: "BudgetExhaustedEmailSubject"
      Key: "\"promotion.budget.exhausted.email.subject\""
      Domain: "ChannelRepository:Domain"
      DomainValue: "NotificationSettings:BudgetExhaustedEmailSubject:Value"
  - id: "UpdateLocalizedText2"
    type: "pipelet"
    ref: "UpdateLocalizedText"
    bindings:
      Key: "\"promotion.budget.threshold.email.subject\""
      Domain: "ChannelRepository:Domain"
      DomainValue: "NotificationSettings:BudgetThresholdEmailSubject:Value"
  - id: "ValidateForm1"
    type: "pipelet"
    ref: "ValidateForm"
    config:
      Trim: true
    bindings:
      Form: "NotificationSettings"

