flow: "ViewApplicationPromotionPreferenceBudgetNotification"
kind: "view"

entries:
  - id: "StartNode1"
    name: "Start"
    mode: "private"
    strict: false
    inputs:
      - key: "ApplicationUUID"
        type: "java.lang.String"
        required: true
  - id: "StartNode2"
    name: "Prefix"
    mode: "private"
    strict: false
    inputs:
      - key: "ApplicationUUID"
        type: "java.lang.String"
        required: true
  - id: "StartNode3"
    name: "Edit"
    mode: "private"
    strict: false
    inputs:
      - key: "ApplicationUUID"
        type: "java.lang.String"
        required: true
  - id: "StartNode4"
    name: "SetFormValues"
    mode: "private"
    strict: false
    inputs:
      - key: "ChannelRepository"
        type: "com.intershop.component.mvc.capi.catalog.Repository"
        required: true
      - key: "NotificationSettings"
        type: "com.intershop.beehive.core.capi.webform.Form"
        required: true
      - key: "CurrentChannel"
        type: "java.lang.Object"
        required: true
      - key: "Locale"
        type: "com.intershop.beehive.core.capi.localization.LocaleInformation"
        required: true
  - id: "StartNode5"
    name: "Dispatch"
    mode: "private"
    strict: false
    inputs:
      - key: "ApplicationUUID"
        type: "java.lang.String"
        required: true
  - id: "StartNode6"
    name: "Update"
    mode: "private"
    strict: false
    inputs:
      - key: "ApplicationUUID"
        type: "java.lang.String"
        required: true
  - id: "StartNode7"
    name: "UpdatePreferences"
    mode: "private"
    strict: false
    inputs:
      - key: "ChannelRepository"
        type: "com.intershop.component.mvc.capi.catalog.Repository"
        required: true
      - key: "NotificationSettings"
        type: "com.intershop.beehive.core.capi.webform.Form"
        required: true
      - key: "CurrentChannel"
        type: "java.lang.Object"
        required: true
      - key: "Locale"
        type: "com.intershop.beehive.core.capi.localization.LocaleInformation"
        required: true

steps:
  - id: "AddMultipleEntriesToMap1"
    type: "pipelet"
    ref: "AddMultipleEntriesToMap"
    config:
      Mode: "OverwriteValue"
    bindings:
      Key1: "NotificationSettings:AddressEmailFrom"
      Key2: "NotificationSettings:BudgetExhaustedEmailSubject"
      Key3: "NotificationSettings:BudgetThresholdEmailSubject"
      Key4: "NotificationSettings:BudgetExhaustedEmailTemplate"
      Key5: "NotificationSettings:BudgetThresholdReachedEmailTemplate"
      Value1: "AddressEmailFrom"
      Value2: "BudgetExhaustedEmailSubject:DomainValue"
      Value3: "BudgetThresholdEmailSubject:DomainValue"
      Value4: "BudgetExhaustedEmailTemplate"
      Value5: "BudgetThresholdReachedEmailTemplate"
      OutMap: "FormParameterValuesMap"
  - id: "CallNode1"
    type: "call"
    ref: "ViewApplicationPromotionPreferenceBudgetNotification-Prefix"
  - id: "CallNode2"
    type: "call"
    ref: "ViewApplicationPromotionPreferenceBudgetNotification-SetFormValues"
  - id: "CallNode3"
    type: "call"
    ref: "ViewApplicationPromotionPreferenceBudgetNotification-Prefix"
  - id: "CallNode4"
    type: "call"
    ref: "ViewApplicationPromotionPreferenceBudgetNotification-UpdatePreferences"
  - id: "CreateForm1"
    type: "pipelet"
    ref: "CreateForm"
    config:
      FormName: "BudgetNotificationSettings"
      FormResource: "BudgetNotificationSettings"
    bindings:
      Form: "NotificationSettings"
      FormName: "null"
      FormResource: "null"
  - id: "DecisionNode5"
    type: "decision"
    condition: "ViewBudgetNotification"
  - id: "DetermineLocales1"
    type: "pipelet"
    ref: "DetermineLocales"
    bindings:
      Locales: "AllLocales"
  - id: "DetermineLocalizedTextByLocale1"
    type: "pipelet"
    ref: "DetermineLocalizedTextByLocale"
    bindings:
      SearchedKey: "\"promotion.budget.exhausted.email.subject\""
      LocalizationTexts: "BudgetExhaustedEmailSubjects"
  - id: "DetermineLocalizedTextByLocale2"
    type: "pipelet"
    ref: "DetermineLocalizedTextByLocale"
    bindings:
      LocalizationTexts: "BudgetThresholdEmailSubjects"
      SearchedKey: "\"promotion.budget.threshold.email.subject\""
  - id: "DispatchFormAction1"
    type: "pipelet"
    ref: "DispatchFormAction"
    config:
      OutValue_0: "ViewApplicationPromotionPreferenceBudgetNotification-Update"
      OutValue_1: "ViewApplicationPromotionPreferenceBudgetNotification-Edit"
    bindings:
      Key_0: "apply"
      SelectionKey: "JumpTarget"
      Key_1: "setLocale"
  - id: "EndNode1"
    type: "end"
    strict: false
  - id: "EndNode2"
    type: "end"
    strict: false
  - id: "EndNode3"
    type: "end"
    strict: false
  - id: "GetApplicationByUUID1"
    type: "pipelet"
    ref: "GetApplicationByUUID"
  - id: "GetApplicationPreference1"
    type: "pipelet"
    ref: "GetApplicationPreference"
    config:
      DefaultApplicationPreferenceKey: "BudgetNotificationEmailFrom"
      Type: "String"
      DefaultPreferenceKey: "BudgetNotificationEmailFrom"
    bindings:
      ApplicationPreferenceStringValue: "AddressEmailFrom"
      DomainPreference: "ChannelRepository:Domain"
      PreferenceStringValue: "AddressEmailFrom"
      PreferenceDomain: "ChannelRepository:Domain"
      PreferenceKey: "null"
      ApplicationPreferenceKey: "AddressEmailFrom"
  - id: "GetApplicationPreference2"
    type: "pipelet"
    ref: "GetApplicationPreference"
    config:
      DefaultApplicationPreferenceKey: "BudgetNotificationEmailTemplateExhausted"
      Type: "String"
    bindings:
      DomainPreference: "ChannelRepository:Domain"
      ApplicationPreferenceStringValue: "BudgetExhaustedEmailTemplate"
      ApplicationPreferenceKey: "null"
  - id: "GetApplicationPreference3"
    type: "pipelet"
    ref: "GetApplicationPreference"
    config:
      Type: "String"
      DefaultApplicationPreferenceKey: "BudgetNotificationEmailTemplatePercentage"
    bindings:
      DomainPreference: "ChannelRepository:Domain"
      ApplicationPreferenceStringValue: "BudgetThresholdReachedEmailTemplate"
      ApplicationPreferenceKey: "null"
  - id: "GetFirstElementOfIterator1"
    type: "pipelet"
    ref: "GetFirstElementOfIterator"
    bindings:
      Iterator: "BudgetExhaustedEmailSubjects"
      FirstElement: "BudgetExhaustedEmailSubject"
  - id: "GetFirstElementOfIterator2"
    type: "pipelet"
    ref: "GetFirstElementOfIterator"
    bindings:
      Iterator: "BudgetThresholdEmailSubjects"
      FirstElement: "BudgetThresholdEmailSubject"
  - id: "GetLocale1"
    type: "pipelet"
    ref: "GetLocale"
    config:
      LocaleFallback: "Request Locale"
    bindings:
      Locale: "SelectedLocale"
      LocaleId: "LocaleID"
  - id: "InteractionEnd2"
    type: "interaction"
  - id: "JoinNode1"
    type: "join"
  - id: "JoinNode10"
