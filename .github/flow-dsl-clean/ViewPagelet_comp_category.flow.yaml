flow: "ViewPagelet_comp_category"
kind: "view"

entries:
  - id: "StartNode1"
    name: "CategoryList"
    mode: "private"
    strict: true
    inputs:
      - key: "CategoryBO"
        type: "java.lang.Object"
        required: false

steps:
  - id: "EndNode1"
    type: "end"
    strict: true
    outputs:
      - key: "CategoryBOs"
        type: "java.util.List"
        guaranteed: true
  - id: "GetValuesFromRequest1"
    type: "pipelet"
    ref: "GetValuesFromRequest"
    config:
      Namespace: "Application"
    bindings:
      Key: "\"CurrentOrganization\""
      Namespace: "null"
  - id: "KeyMapper2"
    type: "pipelet"
    ref: "KeyMapper"
    config:
      ValueType: "Dictionary Value"
    bindings:
      InValue_1: "CategoryBO:OnlineMenuSubCategories(CurrentUser, CurrentOrganization)"
      OutValue_1: "CategoryBOs"

links:
  - from: "GetValuesFromRequest1"
    via: "error"
    to: "KeyMapper2"
    into: "in"
  - from: "KeyMapper2"
    via: "next"
    to: "EndNode1"
    into: "in"
  - from: "StartNode1"
    via: "next"
    to: "GetValuesFromRequest1"
    into: "in"
  - from: "GetValuesFromRequest1"
    via: "next"
    to: "KeyMapper2"
    into: "in"
