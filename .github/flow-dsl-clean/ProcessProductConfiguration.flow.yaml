  - from: "KeyMapper2"
    via: "next"
    to: "LoopNode1"
    into: "in"
  - from: "GetEntryFromMap1"
    via: "next"
    to: "CallNode2"
    into: "in"
  - from: "GetProductConfigurationSetBOByID1"
    via: "error"
    to: "JoinNode1"
    into: "in1"
  - from: "CallNode2"
    via: "next"
    to: "LoopNode1"
    into: "loop"
  - from: "GetProductConfigurationSetBOByID1"
    via: "next"
    to: "JoinNode2"
    into: "in3"
  - from: "CreateProductPreConfiguration1"
    via: "error"
    to: "EndNode6"
    into: "in"
  - from: "GetProductConfigurationSetBOByID2"
    via: "next"
    to: "JoinNode2"
    into: "in1"
  - from: "DecisionNode1"
    via: "yes"
    to: "GetProductConfigurationSetBOByID1"
    into: "in"
  - from: "JoinNode1"
    via: "next"
    to: "EndNode10"
    into: "in"
  - from: "JoinNode2"
    via: "next"
    to: "CallNode1"
    into: "in"
  - from: "GetProductConfigurationSetBOByID2"
    via: "error"
    to: "GetApplicationBO1"
    into: "in"
  - from: "StartNode2"
    via: "next"
    to: "DecisionNode2"
    into: "in"
  - from: "DecisionNode2"
    via: "yes"
    to: "CreateProductConfiguration1"
    into: "in"
  - from: "SetDictionaryValue1"
    via: "next"
    to: "EndNode4"
    into: "in"
  - from: "StartNode4"
    via: "next"
    to: "DecisionNode3"
    into: "in"
  - from: "DecisionNode3"
    via: "yes"
    to: "CreateProductPreConfiguration1"
    into: "in"
  - from: "DecisionNode2"
    via: "no"
    to: "SetDictionaryValue1"
    into: "in"
  - from: "SetDictionaryValue2"
    via: "next"
    to: "EndNode6"
    into: "in"
  - from: "SetDictionaryValue3"
    via: "next"
    to: "EndNode10"
    into: "in"
  - from: "StartNode7"
    via: "next"
    to: "DecisionNode4"
    into: "in"
  - from: "DecisionNode4"
    via: "no"
    to: "JoinNode3"
    into: "in1"
  - from: "DecisionNode4"
    via: "yes"
    to: "DecisionNode5"
    into: "in"
  - from: "DecisionNode5"
    via: "yes"
    to: "GetProductConfigurationSetBOByID2"
    into: "in"
  - from: "JoinNode3"
    via: "next"
    to: "SetDictionaryValue3"
    into: "in"
  - from: "CreateProductConfiguration1"
