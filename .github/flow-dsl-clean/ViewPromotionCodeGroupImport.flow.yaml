flow: "ViewPromotionCodeGroupImport"
kind: "view"

entries:
  - id: "StartNode0"
    name: "Prefix"
    mode: "private"
    strict: true
    inputs:
      - key: "CurrentChannel"
        type: "java.lang.Object"
        required: false
  - id: "StartNode1"
    name: "Dispatch"
    mode: "private"
    strict: false
    inputs:
      []
  - id: "StartNode2"
    name: "Start"
    mode: "private"
    strict: false
    inputs:
      []
  - id: "StartNode3"
    name: "BrowseDirectory"
    mode: "private"
    strict: false
    inputs:
      []
  - id: "StartNode4"
    name: "Paging"
    mode: "private"
    strict: false
    inputs:
      []
  - id: "StartNode5"
    name: "ValidateFile"
    mode: "private"
    strict: false
    inputs:
      []
  - id: "StartNode6"
    name: "ValidateFileRefresh"
    mode: "private"
    strict: false
    inputs:
      []
  - id: "StartNode7"
    name: "Validate"
    mode: "private"
    strict: false
    inputs:
      []
  - id: "StartNode8"
    name: "SelectMode"
    mode: "private"
    strict: false
    inputs:
      []
  - id: "StartNode9"
    name: "Import"
    mode: "private"
    strict: false
    inputs:
      []

steps:
  - id: "BrowseDirectory0"
    type: "pipelet"
    ref: "BrowseDirectory"
    config:
      DefaultDirectoryPath: "src/marketing"
      UnitDirectory: "IMPEX_DIR"
    bindings:
      UnitDomain: "ChannelRepository:Domain"
  - id: "CallNode0"
    type: "call"
    ref: "ProcessPromotion-GetPromotionDomainByChannel"
    bindings:
      Channel: "CurrentChannel"
  - id: "CallNode1"
    type: "call"
    ref: "This:Prefix"
  - id: "CallNode10"
    type: "call"
    ref: "ProcessImpexJob-Create"
  - id: "CallNode2"
    type: "call"
    ref: "ProcessClipboard-Delete"
  - id: "CallNode3"
    type: "call"
    ref: "This:Prefix"
  - id: "CallNode4"
    type: "call"
    ref: "ProcessClipboard-Update"
  - id: "CallNode5"
    type: "call"
    ref: "ViewPromotionImpex-PutKeyValueInWizardMap"
    bindings:
      Value: "SelectedFile"
      Key: "\"SelectedFile\""
      WizardMapID: "\"PromotionCodeGroupWizardMap\""
  - id: "CallNode6"
    type: "call"
    ref: "ProcessImpexJob-Create"
  - id: "CallNode7"
    type: "call"
    ref: "ProcessImpexJob-GetLogContent"
  - id: "CallNode8"
    type: "call"
    ref: "ViewPromotionImpex-GetValueFromWizardMap"
    bindings:
      WizardMapID: "\"PromotionCodeGroupWizardMap\""
      Key: "\"SelectedFile\""
      Value: "SelectedFile"
  - id: "CallNode9"
    type: "call"
    ref: "This:Prefix"
  - id: "CreatePageableFromIterator0"
    type: "pipelet"
    ref: "CreatePageableFromIterator"
    config:
      PageableName: "Files"
      Pagesize: 10
    bindings:
      Iterator: "Directory:Files"
      Pageable: "Files"
  - id: "CreateWebForm0"
    type: "pipelet"
    ref: "CreateWebForm"
    config:
      param.1.name: "SelectedFile"
      param.1.required: true
      param.2.required: false
      param.3.required: false
      param.4.required: false
      param.5.required: false
      webform-id: "SelectFileForm"
      param.1.rule: ""
      param.2.rule: ""
      param.3.rule: ""
      param.5.rule: ""
    bindings:
      WebForm: "SelectFileForm"
  - id: "DecisionNode0"
    type: "decision"
    condition: "PageNumber"
  - id: "DecisionNode1"
    type: "decision"
    condition: "PageLocator"
  - id: "DecisionNode2"
    type: "decision"
    condition: "JobConfiguration:LastExecutionTime:Time"
  - id: "DecisionNode3"
    type: "decision"
    condition: "JobConfiguration"
  - id: "DecisionNode4"
    type: "decision"
    condition: "JobConfiguration:Status"
  - id: "DecisionNode6"
    type: "decision"
    condition: "ProfanityCheck"
  - id: "DispatchFormAction0"
    type: "pipelet"
    ref: "DispatchFormAction"
    config:
      OutValue_0: "ViewPromotionCodeImpex-Status"
      OutValue_1: "ViewPromotionCodeGroupImport-ValidateFile"
      OutValue_3: "ViewPromotionCodeGroupImport-SelectMode"
      OutValue_4: "ViewPromotionCodeGroupImport-Paging"
      OutValue_2: "ViewPromotionCodeGroupImport-Import"
      OutValue_5: "ViewPromotionCodeGroupImport-ValidateFileRefresh"
    bindings:
      Key_0: "Cancel"
      Key_1: "ValidateFile"
      Key_3: "SelectMode"
      Key_4: "Paging"
      Key_2: "Import"
      Key_5: "ValidateFileRefresh"
      SelectionKey: "JumpTarget"
  - id: "EndNode0"
    type: "end"
    strict: true
    outputs:
      - key: "PromotionDomain"
        type: "com.intershop.beehive.core.capi.domain.Domain"
        guaranteed: true
  - id: "GetJobConfiguration0"
    type: "pipelet"
    ref: "GetJobConfiguration"
    bindings:
      JobUUID: "JobConfigurationUUID"
  - id: "GetPageLocator0"
    type: "pipelet"
    ref: "GetPageLocator"
    config:
      DefaultPageLocatorName: "ImportPCGFiles"
      RestorePageLocatorDictionary: "True"
  - id: "GetPageable0"
    type: "pipelet"
    ref: "GetPageable"
    bindings:
      PageableID: "PageLocator:PageableID"
      Pageable: "Files"
  - id: "GetWebForm0"
    type: "pipelet"
    ref: "GetWebForm"
    config:
      webform-id: "SelectFileForm"
    bindings:
      WebForm: "SelectFileForm"
  - id: "InteractionNode0"
    type: "interaction"
  - id: "InteractionNode1"
    type: "interaction"
  - id: "InteractionNode2"
    type: "interaction"
  - id: "InteractionNode3"
    type: "interaction"
