      ValueType: "Form Value"
    bindings:
      InValue_1: "\"ProcessPCGImport\""
      InValue_2: "\"Validate\""
      InValue_3: "\"ProcessMarketingImpex\""
      OutValue_1: "ProcessPipelineName"
      OutValue_2: "ProcessPipelineStartNode"
      OutValue_3: "JobName"
  - id: "KeyMapper1"
    type: "pipelet"
    ref: "KeyMapper"
    bindings:
      InValue_1: "ChannelRepository:Domain"
      InValue_2: "ChannelRepository:Domain"
      OutValue_1: "ProcessOwningDomain"
      OutValue_2: "ProcessExecutionDomain"
  - id: "KeyMapper2"
    type: "pipelet"
    ref: "KeyMapper"
    config:
      ValueType: "Form Value"
    bindings:
      InValue_1: "SelectFileForm:SelectedFile:Value"
      OutValue_1: "SelectedFile"
  - id: "KeyMapper3"
    type: "pipelet"
    ref: "KeyMapper"
    config:
      ValueType: "Form Value"
    bindings:
      InValue_1: "\"1\""
      OutValue_1: "PromotionCodeProfanityCheck"
  - id: "KeyMapper4"
    type: "pipelet"
    ref: "KeyMapper"
    bindings:
      InValue_1: "ChannelRepository:Domain"
      InValue_2: "ChannelRepository:Domain"
      OutValue_1: "ProcessOwningDomain"
      OutValue_2: "ProcessExecutionDomain"
  - id: "KeyMapper5"
    type: "pipelet"
    ref: "KeyMapper"
    config:
      ValueType: "Form Value"
    bindings:
      InValue_1: "\"ProcessPCGImport\""
      InValue_2: "\"Import\""
      InValue_3: "\"ProcessPromotionCodeGroupImport\""
      OutValue_1: "ProcessPipelineName"
      OutValue_2: "ProcessPipelineStartNode"
      OutValue_3: "JobName"
  - id: "PrepareApplicationView0"
    type: "pipelet"
    ref: "PrepareApplicationView"
    config:
      SelectedMenuItem: "OnlineMarketing"
      WorkingTemplate: "impex/import/PCGImportValidateFile"
  - id: "PrepareApplicationView1"
    type: "pipelet"
    ref: "PrepareApplicationView"
    config:
      RenderingType: "HTML"
      SelectedMenuItem: "OnlineMarketing"
      WorkingTemplate: "impex/import/PCGImportSelectFile"
  - id: "PrepareApplicationView2"
    type: "pipelet"
    ref: "PrepareApplicationView"
    config:
      SelectedMenuItem: "OnlineMarketing"
      WorkingTemplate: "impex/import/PCGImportValidateFile"
  - id: "PrepareApplicationView3"
    type: "pipelet"
    ref: "PrepareApplicationView"
    config:
      SelectedMenuItem: "OnlineMarketing"
      WorkingTemplate: "impex/import/PCGImportSelectMode"
  - id: "SetPage0"
    type: "pipelet"
    ref: "SetPage"
    bindings:
      PageNumber: "PageLocator:PageNumber"
      Pageable: "Files"
  - id: "SetPage1"
    type: "pipelet"
    ref: "SetPage"
    bindings:
      Pageable: "Files"
  - id: "SetPageLocator0"
    type: "pipelet"
    ref: "SetPageLocator"
    config:
      DefaultHandlerPipeline: "ViewPromotionCodeGroupImport-Paging"
      DefaultPageLocatorName: "ImportPGCFiles"
    bindings:
      Pageable: "Files"
  - id: "UpdateWebForm0"
    type: "pipelet"
    ref: "UpdateWebForm"
    config:
      mode: "update"
      webform-id: "SelectFileForm"
    bindings:
      WebForm: "SelectFileForm"
  - id: "ValidateWebForm0"
    type: "pipelet"
    ref: "ValidateWebForm"
    bindings:
      WebForm: "SelectFileForm"
  - id: "VerifyInteger0"
    type: "pipelet"
    ref: "VerifyInteger"
    bindings:
      LocalizedString: "PageNumber"
      IntegerObject: "PageNumber"

