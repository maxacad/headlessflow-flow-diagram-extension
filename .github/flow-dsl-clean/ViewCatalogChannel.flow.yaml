  - id: "Decision1"
    type: "decision"
    condition: "PageNumber"
  - id: "Decision7"
    type: "decision"
    condition: "deleteConfirm"
  - id: "DispatchFormAction1"
    type: "pipelet"
    ref: "DispatchFormAction"
    config:
      OutValue_0: "ViewCatalogChannel-New"
      OutValue_1: "ViewCatalogChannel-Create"
      OutValue_2: "ViewCatalogChannel-Remove"
      OutValue_3: "ViewCatalogChannelList-Refresh"
      OutValue_4: "ViewCatalogChannel-Remove"
      OutValue_5: "ViewCatalogChannelList-Refresh"
      OutValue_6: "ViewCatalogList-ListAll"
      PagingPipeline: "ViewCatalogChannel-Paging"
    bindings:
      Key_0: "new"
      Key_1: "create"
      Key_2: "deleteConfirm"
      Key_3: "cancelConfirm"
      Key_4: "delete"
      Key_5: "cancel"
      Key_6: "backToList"
      SelectionKey: "JumpTarget"
  - id: "End1"
    type: "end"
    strict: true
    outputs:
      - key: "Catalog"
        type: "com.intershop.component.mvc.capi.catalog.Catalog"
        guaranteed: true
  - id: "ExecutePageableQuery1"
    type: "pipelet"
    ref: "ExecutePageableQuery"
    config:
      DefaultPageSize: 15
      ParameterName_01: "Catalog"
      QueryName: "catalog/GetAssignableChannels"
    bindings:
      SearchResult: "UnassignedChannels"
      ParameterValue_01: "Catalog"
  - id: "GetCatalogByUUID1"
    type: "pipelet"
    ref: "GetCatalogByUUID"
  - id: "GetPageLocator1"
    type: "pipelet"
    ref: "GetPageLocator"
    config:
      RestorePageLocatorDictionary: "True"
      DefaultPageLocatorName: "ChannelList"
  - id: "GetPageable1"
    type: "pipelet"
    ref: "GetPageable"
    bindings:
      Pageable: "UnassignedChannels"
      PageableID: "PageLocator:PageableID"
  - id: "InteractionEnd1"
    type: "interaction"
  - id: "Join1"
    type: "join"
  - id: "Join2"
    type: "join"
  - id: "JoinNode1"
    type: "join"
  - id: "JoinNode2"
    type: "join"
  - id: "Jump11"
    type: "jump"
    ref: "ViewCatalogChannelList-Refresh"
  - id: "Jump12"
    type: "jump"
    ref: "SecureJump-Start"
  - id: "Jump4"
    type: "jump"
