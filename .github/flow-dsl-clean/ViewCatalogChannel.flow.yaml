  - id: "JumpNode1"
    type: "jump"
    ref: "ViewCatalogChannel-Paging"
  - id: "JumpNode2"
    type: "jump"
    ref: "ViewCatalogChannel-New"
  - id: "KeyMapper2"
    type: "pipelet"
    ref: "KeyMapper"
    config:
      ValueType: "Form Value"
    bindings:
      InValue_1: "CurrentPageNumber"
      OutValue_1: "PageNumber"
      OutValue_2: "ErrorNoChannelSelected"
      InValue_2: "\"true\""
  - id: "PrepareApplicationView1"
    type: "pipelet"
    ref: "PrepareApplicationView"
    config:
      SelectedMenuItem: "Catalogs"
      WorkingTemplate: "catalog/CatalogChannelSelect"
  - id: "SetPage1"
    type: "pipelet"
    ref: "SetPage"
    bindings:
      Pageable: "UnassignedChannels"
  - id: "SetPage2"
    type: "pipelet"
    ref: "SetPage"
    config:
      DefaultPageNumber: 0
    bindings:
      PageNumber: "PageLocator:PageNumber"
      Pageable: "UnassignedChannels"
  - id: "SetPageLocator1"
    type: "pipelet"
    ref: "SetPageLocator"
    config:
      DefaultHandlerPipeline: "ViewCatalogChannel-Paging"
      DefaultPageLocatorName: "ChannelList"
    bindings:
      Pageable: "UnassignedChannels"
  - id: "VerifyInteger1"
    type: "pipelet"
    ref: "VerifyInteger"
    bindings:
      IntegerObject: "PageNumber"
      Locale: "null"
      LocalizedString: "PageNumber"
      Pattern: "null"

