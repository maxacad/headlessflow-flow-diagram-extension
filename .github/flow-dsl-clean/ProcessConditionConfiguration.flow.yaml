flow: "ProcessConditionConfiguration"
kind: "process"

entries:
  - id: "StartNode1"
    name: "UpdateConfigurationParameters"
    mode: "private"
    strict: true
    inputs:
      - key: "EditCondition"
        type: "com.intershop.beehive.core.capi.domain.ExtensibleObject"
        required: true
      - key: "ConditionForm"
        type: "com.intershop.beehive.core.capi.webform.Form"
        required: true
      - key: "ConditionDescriptorRegistry"
        type: "com.intershop.component.foundation.capi.condition.ConditionDescriptorRegistry"
        required: false
  - id: "StartNode10"
    name: "RemoveCondition"
    mode: "private"
    strict: true
    inputs:
      - key: "Condition"
        type: "com.intershop.component.foundation.capi.condition.Condition"
        required: true
      - key: "ConditionRepository"
        type: "com.intershop.component.foundation.capi.condition.ConditionRepository"
        required: true
  - id: "StartNode11"
    name: "UngroupConditions"
    mode: "private"
    strict: true
    inputs:
      - key: "SelectedConditions"
        type: "java.util.HashMap"
        required: false
      - key: "ConditionRepository"
        type: "com.intershop.component.foundation.capi.condition.ConditionRepository"
        required: true
      - key: "ConditionDescriptorRegistry"
        type: "com.intershop.component.foundation.capi.condition.ConditionDescriptorRegistry"
        required: true
  - id: "StartNode15"
    name: "CreateConditionForm"
    mode: "private"
    strict: false
    inputs:
      - key: "EditCondition"
        type: "com.intershop.component.foundation.capi.condition.Condition"
        required: false
      - key: "ConditionDescriptorRegistry"
        type: "com.intershop.component.foundation.capi.condition.ConditionDescriptorRegistry"
        required: true
      - key: "FormName"
        type: "java.lang.String"
        required: false
      - key: "FormResource"
        type: "java.lang.String"
        required: false
  - id: "StartNode2"
    name: "RemoveConditionsByIterator"
    mode: "private"
    strict: true
    inputs:
      - key: "SelectedConditions"
        type: "java.util.Iterator"
        required: false
      - key: "ConditionRepository"
        type: "com.intershop.component.foundation.capi.condition.ConditionRepository"
        required: true
  - id: "StartNode3"
    name: "GroupConditions"
    mode: "private"
    strict: true
    inputs:
      - key: "SelectedConditions"
        type: "java.util.HashMap"
        required: false
      - key: "ConditionRepository"
        type: "com.intershop.component.foundation.capi.condition.ConditionRepository"
        required: true
      - key: "ConditionDescriptorRegistry"
        type: "com.intershop.component.foundation.capi.condition.ConditionDescriptorRegistry"
        required: true
  - id: "StartNode4"
    name: "ChangeOperator"
    mode: "private"
    strict: true
    inputs:
      - key: "ConditionDescriptorRegistry"
        type: "com.intershop.component.foundation.capi.condition.ConditionDescriptorRegistry"
        required: false
      - key: "ConditionRepository"
        type: "com.intershop.component.foundation.capi.condition.ConditionRepository"
        required: false
      - key: "Operators"
        type: "java.util.Map<java.lang.String, java.lang.String>"
        required: false
  - id: "StartNode5"
    name: "CreateCondition"
    mode: "private"
    strict: true
    inputs:
      - key: "ConditionForm"
        type: "com.intershop.beehive.core.capi.webform.Form"
        required: true
      - key: "Owner"
        type: "com.intershop.beehive.core.capi.domain.PersistentObject"
        required: true
      - key: "ConditionRepository"
        type: "com.intershop.component.foundation.capi.condition.ConditionRepository"
        required: false
      - key: "ConditionDescriptorRegistry"
        type: "com.intershop.component.foundation.capi.condition.ConditionDescriptorRegistry"
        required: false
      - key: "TargetConditionID"
        type: "java.lang.String"
        required: false
      - key: "EditConditionTypeGroup"
        type: "com.intershop.component.foundation.capi.condition.Condition"
        required: false
  - id: "StartNode6"
    name: "PrepareDescriptors"
    mode: "private"
    strict: true
    inputs:
      - key: "ConditionDescriptorRegistry"
        type: "com.intershop.component.foundation.capi.condition.ConditionDescriptorRegistry"
        required: false
  - id: "StartNode7"
    name: "MoveUpCondition"
    mode: "private"
    strict: true
    inputs:
      - key: "SelectedConditions"
        type: "java.util.HashMap"
        required: false
      - key: "ConditionRepository"
        type: "com.intershop.component.foundation.capi.condition.ConditionRepository"
        required: true
  - id: "StartNode8"
    name: "MoveDownCondition"
    mode: "private"
    strict: true
    inputs:
      - key: "SelectedConditions"
        type: "java.util.HashMap"
        required: false
      - key: "ConditionRepository"
        type: "com.intershop.component.foundation.capi.condition.ConditionRepository"
        required: true
  - id: "StartNode9"
    name: "ResolveConditionDescriptor"
    mode: "private"
    strict: true
    inputs:
      - key: "ConditionForm"
        type: "com.intershop.beehive.core.capi.webform.Form"
        required: true
      - key: "ConditionDescriptors"
        type: "java.util.Iterator"
        required: true
      - key: "ConditionDescriptorRegistry"
        type: "com.intershop.component.foundation.capi.condition.ConditionDescriptorRegistry"
        required: true

steps:
  - id: "AddEntryToMap2"
    type: "pipelet"
    ref: "AddEntryToMap"
    bindings:
      InMap: "FormParameterValuesMap"
      OutMap: "FormParameterValuesMap"
      Key: "ConditionForm:get(Param:Name)"
      Value: "EditCondition:getAttribute(Param:Name)"
  - id: "AddEntryToMap3"
    type: "pipelet"
    ref: "AddEntryToMap"
    bindings:
      InMap: "ConditionTypesMap"
      Key: "ConditionDescriptor:Type"
      Value: "ConditionDescriptor:TypeName"
      OutMap: "ConditionTypesMap"
      Keys: "ConditionTypes"
  - id: "AddEntryToMap4"
    type: "pipelet"
    ref: "AddEntryToMap"
    bindings:
      InMap: "ConditionDescriptorMap"
      Key: "ConditionDescriptor:ID"
      Value: "ConditionDescriptor"
      OutMap: "ConditionDescriptorMap"
  - id: "AddFormFieldDefinition1"
    type: "pipelet"
    ref: "AddFormFieldDefinition"
    bindings:
      FormParameter: "ConditionForm:get(Param:Name)"
      Name: "Field:Name"
      MessageID: "Field:MessageID"
      FormatProperties: "Field:FormatProperties"
      Formatter: "Field:Formatter"
  - id: "AddFormParameterDefinition2"
    type: "pipelet"
    ref: "AddFormParameterDefinition"
    config:
      Optional: true
    bindings:
      Form: "ConditionForm"
      FormatProperties: "Param:FormatProperties"
      Formatter: "Param:Formatter"
      MessageID: "Param:MessageID"
      Name: "Param:Name"
      Type: "Param:Type"
      Optional: "Param:Optional"
  - id: "AddMultipleEntriesToMap1"
    type: "pipelet"
    ref: "AddMultipleEntriesToMap"
    config:
      Mode: "OverwriteValue"
    bindings:
      OutMap: "FormParameterValuesMap"
      Key1: "ConditionForm:ConditionType"
      Key2: "ConditionForm:ConditionDescriptorID"
      Key3: "ConditionForm:ConditionID"
      Value1: "EditCondition:Descriptor:Type"
      Value2: "EditCondition:ConditionDescriptorID"
      Value3: "EditCondition:UUID"
  - id: "AddObjectToVector1"
    type: "pipelet"
    ref: "AddObjectToVector"
    config:
      Mode: "Forbid Duplicates"
    bindings:
      Object: "Condition"
      Objects: "Conditions"
      Iterator: "Conditions"
  - id: "AddObjectToVector2"
    type: "pipelet"
    ref: "AddObjectToVector"
    config:
      Mode: "Forbid Duplicates"
    bindings:
      Object: "Condition"
      Objects: "Conditions"
      Iterator: "Conditions"
  - id: "AddValidateDefinition1"
    type: "pipelet"
    ref: "AddValidateDefinition"
    bindings:
      Target: "ConditionForm:get(Param:Name)"
      Validator: "ValidatorID"
      ValidationProperties: "Param:ValidatorProperties(ValidatorID)"
  - id: "AddValidateDefinition2"
    type: "pipelet"
    ref: "AddValidateDefinition"
    bindings:
      Target: "ConditionForm:get(Param:Name):get(Field:Name)"
      Validator: "ValidatorID"
      ValidationProperties: "Field:ValidatorProperties(ValidatorID)"
  - id: "CallNode1"
    type: "call"
    ref: "ProcessConditionConfiguration-RemoveCondition"
  - id: "CallNode2"
    type: "call"
    ref: "This:ResolveConditionDescriptor"
  - id: "CreateCondition1"
    type: "pipelet"
    ref: "CreateCondition"
    config:
      TypeGroupCondition: true
    bindings:
      ConditionDescriptorID: "ConditionForm:ConditionDescriptorID:Value"
      CurrentDomain: "Owner:Domain"
      TargetCondition: "EditConditionTypeGroup"
  - id: "CreateCondition2"
    type: "pipelet"
    ref: "CreateCondition"
    config:
      TypeGroupCondition: false
    bindings:
      ConditionDescriptorID: "ConditionForm:ConditionDescriptorID:Value"
      CurrentDomain: "Owner:Domain"
  - id: "CreateForm4"
    type: "pipelet"
    ref: "CreateForm"
    config:
      FormResource: "ConditionConfiguration"
      FormName: "ConditionConfiguration"
    bindings:
      Form: "ConditionForm"
  - id: "DecisionNode1"
    type: "decision"
    condition: "TargetConditionID"
  - id: "DecisionNode10"
    type: "decision"
    condition: "EditConditionTypeGroup"
  - id: "DecisionNode11"
    type: "decision"
    condition: "ConditionDescriptorRegistry:TypeGroupingEnabled(EditConditionTypeGroup)"
  - id: "DecisionNode12"
    type: "decision"
    condition: "ConditionDescriptorRegistry:TypeGroupingEnabled(Condition)"
  - id: "DecisionNode13"
    type: "decision"
    condition: "ConditionForm:ConditionDescriptorID:ValueMissing"
  - id: "DecisionNode14"
    type: "decision"
    condition: "Size"
  - id: "DecisionNode15"
    type: "decision"
    condition: "EditConditionTypeGroup:TypeGroupOperator"
  - id: "DecisionNode16"
    type: "decision"
    condition: "SelectedConditions:KeySet"
  - id: "DecisionNode17"
    type: "decision"
    condition: "SelectedConditions:KeySet"
  - id: "DecisionNode18"
    type: "decision"
    condition: "SelectedConditions:KeySet"
  - id: "DecisionNode19"
    type: "decision"
    condition: "SelectedConditions:KeySet"
  - id: "DecisionNode2"
    type: "decision"
    condition: "Conditions"
  - id: "DecisionNode20"
    type: "decision"
    condition: "Condition:ParentCondition"
  - id: "DecisionNode21"
    type: "decision"
    condition: "Condition:ParentCondition:TypeGroupOperator"
  - id: "DecisionNode3"
    type: "decision"
    condition: "Conditions"
  - id: "DecisionNode4"
    type: "decision"
    condition: "ConditionForm:ConditionType:ValueMissing"
  - id: "DecisionNode5"
    type: "decision"
    condition: "ConditionDescriptor"
  - id: "DecisionNode6"
    type: "decision"
    condition: "ConditionType"
  - id: "DecisionNode7"
    type: "decision"
    condition: "EditCondition:ConditionDescriptorID"
  - id: "DecisionNode8"
    type: "decision"
    condition: "EditConditionTypeGroup"
  - id: "DecisionNode9"
    type: "decision"
    condition: "EditCondition:getAttribute(Param:Name)"
  - id: "EndNode1"
    type: "end"
    strict: true
  - id: "EndNode10"
    type: "end"
    strict: true
  - id: "EndNode11"
    type: "end"
    strict: true
    outputs:
      - key: "ERRORMoveCondition"
        type: "java.lang.String"
        guaranteed: false
  - id: "EndNode12"
    type: "end"
    strict: true
  - id: "EndNode13"
    type: "end"
    strict: true
    outputs:
      - key: "ConditionDescriptor"
        type: "com.intershop.component.foundation.capi.condition.ConditionDescriptor"
        guaranteed: false
  - id: "EndNode14"
    type: "end"
    strict: true
  - id: "EndNode15"
    type: "end"
    strict: true
  - id: "EndNode16"
    type: "end"
    strict: true
    outputs:
      - key: "ERRORUngroupConditions"
        type: "java.lang.String"
        guaranteed: false
  - id: "EndNode17"
    type: "end"
    strict: true
    outputs:
      - key: "ERRORMoveCondition"
        type: "java.lang.String"
        guaranteed: false
  - id: "EndNode2"
    type: "end"
    strict: true
  - id: "EndNode3"
    type: "end"
    strict: true
  - id: "EndNode4"
    type: "end"
    strict: true
    outputs:
      - key: "ConditionForm"
        type: "com.intershop.beehive.core.capi.webform.Form"
        guaranteed: true
      - key: "FormParameterValuesMap"
        type: "java.util.Map"
        guaranteed: false
  - id: "EndNode5"
    type: "end"
    strict: true
  - id: "EndNode6"
    type: "end"
    strict: true
  - id: "EndNode7"
    type: "end"
    strict: true
    outputs:
      - key: "Condition"
        type: "com.intershop.component.foundation.capi.condition.Condition"
        guaranteed: true
      - key: "EditConditionTypeGroup"
        type: "com.intershop.component.foundation.capi.condition.Condition"
        guaranteed: false
  - id: "EndNode8"
    type: "end"
    strict: true
    outputs:
      - key: "ConditionDescriptorMap"
        type: "java.util.Map"
        guaranteed: false
      - key: "ConditionDescriptors"
        type: "java.util.Iterator"
        guaranteed: false
      - key: "ConditionOperators"
        type: "java.util.Iterator"
        guaranteed: false
      - key: "ConditionTypesMap"
        type: "java.util.Map"
        guaranteed: false
      - key: "ConditionTypes"
        type: "java.util.Iterator"
        guaranteed: false
  - id: "EndNode9"
    type: "end"
    strict: true
    outputs:
      - key: "ERRORGroupConditions"
        type: "java.lang.String"
        guaranteed: false
  - id: "GetCondition1"
    type: "pipelet"
    ref: "GetCondition"
    bindings:
      Owner: "null"
  - id: "GetCondition2"
    type: "pipelet"
    ref: "GetCondition"
    bindings:
      ConditionID: "TargetConditionID"
      Owner: "null"
      Condition: "TargetCondition"
  - id: "GetCondition3"
    type: "pipelet"
    ref: "GetCondition"
    bindings:
      Owner: "null"
  - id: "GetCondition4"
    type: "pipelet"
    ref: "GetCondition"
    bindings:
      Owner: "null"
  - id: "GetCondition5"
    type: "pipelet"
    ref: "GetCondition"
    bindings:
      Owner: "null"
  - id: "GetCondition6"
    type: "pipelet"
    ref: "GetCondition"
    bindings:
      Owner: "null"
  - id: "GetConditionDescriptorByID1"
    type: "pipelet"
    ref: "GetConditionDescriptorByID"
    bindings:
      ConditionDescriptorID: "EditCondition:ConditionDescriptorID"
  - id: "GetConditionDescriptorByID3"
    type: "pipelet"
    ref: "GetConditionDescriptorByID"
    bindings:
      ConditionDescriptorID: "EditCondition:ConditionDescriptorID"
  - id: "GetConditionDescriptorByID4"
    type: "pipelet"
    ref: "GetConditionDescriptorByID"
    bindings:
      ConditionDescriptorID: "ConditionForm:ConditionDescriptorID:Value"
  - id: "GetConditionDescriptorByID5"
    type: "pipelet"
    ref: "GetConditionDescriptorByID"
    bindings:
      ConditionDescriptorID: "ConditionForm:ConditionDescriptorID:Value"
  - id: "GetConditionDescriptors1"
    type: "pipelet"
    ref: "GetConditionDescriptors"
    config:
      SortByName: true
  - id: "GetConditionDescriptors3"
    type: "pipelet"
    ref: "GetConditionDescriptors"
    config:
      SortByName: true
  - id: "GetFilterIterator1"
    type: "pipelet"
    ref: "GetFilterIterator"
    config:
      FilterConditionClassName: "com.intershop.component.foundation.internal.application.ConfigurationDescriptorTypeFilter"
    bindings:
      FilterConditionParam1: "ConditionForm:ConditionType:Value"
      Iterator: "ConditionDescriptors"
  - id: "GetFirstElementOfIterator1"
    type: "pipelet"
    ref: "GetFirstElementOfIterator"
    bindings:
      Iterator: "FilterIterator"
      FirstElement: "ConditionDescriptor"
  - id: "GetIteratorSize1"
    type: "pipelet"
    ref: "GetIteratorSize"
    bindings:
      Iterator: "FilterIterator"
  - id: "GroupConditions1"
    type: "pipelet"
    ref: "GroupConditions"
  - id: "JoinNode1"
    type: "join"
  - id: "JoinNode10"
    type: "join"
  - id: "JoinNode11"
    type: "join"
  - id: "JoinNode12"
    type: "join"
  - id: "JoinNode13"
    type: "join"
  - id: "JoinNode14"
    type: "join"
  - id: "JoinNode15"
    type: "join"
  - id: "JoinNode16"
    type: "join"
  - id: "JoinNode17"
    type: "join"
  - id: "JoinNode18"
    type: "join"
  - id: "JoinNode19"
