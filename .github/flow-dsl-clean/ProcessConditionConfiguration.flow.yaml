  - id: "JoinNode24"
    type: "join"
  - id: "JoinNode25"
    type: "join"
  - id: "JoinNode26"
    type: "join"
  - id: "JoinNode27"
    type: "join"
  - id: "JoinNode28"
    type: "join"
  - id: "JoinNode29"
    type: "join"
  - id: "JoinNode3"
    type: "join"
  - id: "JoinNode30"
    type: "join"
  - id: "JoinNode32"
    type: "join"
  - id: "JoinNode33"
    type: "join"
  - id: "JoinNode4"
    type: "join"
  - id: "JoinNode5"
    type: "join"
  - id: "JoinNode6"
    type: "join"
  - id: "JoinNode7"
    type: "join"
  - id: "JoinNode8"
    type: "join"
  - id: "JoinNode9"
    type: "join"
  - id: "KeyMapper1"
    type: "pipelet"
    ref: "KeyMapper"
    bindings:
      InValue_1: "Condition:ParentCondition"
      OutValue_1: "EditConditionTypeGroup"
  - id: "KeyMapper2"
    type: "pipelet"
    ref: "KeyMapper"
    bindings:
      InValue_1: "\"error.NoElementSelected\""
      OutValue_1: "ERRORUngroupConditions"
  - id: "KeyMapper3"
    type: "pipelet"
    ref: "KeyMapper"
    bindings:
      InValue_1: "\"error.NoElementSelected\""
      OutValue_1: "ERRORGroupConditions"
  - id: "KeyMapper4"
    type: "pipelet"
    ref: "KeyMapper"
    bindings:
      InValue_1: "\"error.NoElementSelected\""
      OutValue_1: "ERRORMoveCondition"
  - id: "KeyMapper5"
    type: "pipelet"
    ref: "KeyMapper"
    bindings:
      InValue_1: "\"error.NoElementSelected\""
      OutValue_1: "ERRORMoveCondition"
  - id: "KeyMapper6"
    type: "pipelet"
    ref: "KeyMapper"
    bindings:
      InValue_1: "Condition:ParentCondition"
