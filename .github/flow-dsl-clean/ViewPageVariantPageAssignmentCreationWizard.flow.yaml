  - id: "RemoveValuesContainer2"
    type: "pipelet"
    ref: "RemoveValuesContainer"
    bindings:
      ContainerName: "\"Container_PageletsAssignToPages\""
  - id: "RemoveValuesContainer3"
    type: "pipelet"
    ref: "RemoveValuesContainer"
    bindings:
