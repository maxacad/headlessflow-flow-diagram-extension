      PagingPipeline: "ViewPageVariantPageAssignmentCreationWizard-SelectPages"
      OutValue_1: "This:Finish"
      OutValue_2: "This:Cancel"
      OutValue_3: "This:SelectPages"
      OutValue_4: "ViewPageVariantProcessingWizard-BackToSelectAction"
    bindings:
      SelectionKey: "JumpTarget"
      Key_0: "SelectVisibility"
      Key_1: "Finish"
      Key_2: "Cancel"
      Key_3: "BackToSelectPages"
      Key_4: "BackToSelectAction"
  - id: "DispatchFormActionByBreadcrumb1"
    type: "pipelet"
    ref: "DispatchFormActionByBreadcrumb"
    config:
      SplitMode: "PipelineAndParameter"
    bindings:
      Key_0: "Cancel"
      SelectionKey: "JumpTarget"
      OutValue_0: "ApplicationState:LastListView"
  - id: "EndNode1"
    type: "end"
    strict: true
    outputs:
      - key: "PageEntryPointDefinitions"
        type: "java.util.Collection"
        guaranteed: true
  - id: "EndNode2"
    type: "end"
    strict: true
  - id: "EndNode3"
    type: "end"
    strict: true
  - id: "EndNode4"
    type: "end"
    strict: false
  - id: "EndNode5"
    type: "end"
    strict: true
    outputs:
      - key: "UniquePageletSearchID"
        type: "java.lang.String"
        guaranteed: false
      - key: "StepCounter"
        type: "java.lang.Integer"
        guaranteed: false
  - id: "EndNode6"
    type: "end"
    strict: true
