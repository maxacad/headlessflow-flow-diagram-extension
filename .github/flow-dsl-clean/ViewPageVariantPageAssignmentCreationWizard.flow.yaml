  - id: "SetDictionaryValue1"
    type: "pipelet"
    ref: "SetDictionaryValue"
    config:
      Name: "UniquePageletSearchID"
      ValueType: "Form Value"
      Value: "PageVariantAssignToPage"
  - id: "SetDictionaryValue6"
    type: "pipelet"
    ref: "SetDictionaryValue"
