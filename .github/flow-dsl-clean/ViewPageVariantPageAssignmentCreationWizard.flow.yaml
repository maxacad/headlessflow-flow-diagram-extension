flow: "ViewPageVariantPageAssignmentCreationWizard"
kind: "view"

entries:
  - id: "StartNode1"
    name: "GetAllowedPageEntryPointDefs"
    mode: "private"
    strict: true
    inputs:
      - key: "PageletDefinition"
        type: "com.intershop.component.pmc.capi.definition.pagelet.PageletDefinition"
        required: true
      - key: "Domain"
        type: "com.intershop.beehive.core.capi.domain.Domain"
        required: true
  - id: "StartNode10"
    name: "StoreErrors"
    mode: "private"
    strict: true
    inputs:
      - key: "ErrorNoPagesSelected"
        type: "java.lang.String"
        required: false
  - id: "StartNode11"
    name: "RestoreErrors"
    mode: "private"
    strict: true
    inputs:
      []
  - id: "StartNode12"
    name: "Dispatch"
    mode: "private"
    strict: false
    inputs:
      []
  - id: "StartNode13"
    name: "SelectPages"
    mode: "private"
    strict: false
    inputs:
      []
  - id: "StartNode14"
    name: "RemoveErrors"
    mode: "private"
    strict: true
    inputs:
      []
  - id: "StartNode20"
    name: "Cancel"
    mode: "private"
    strict: false
    inputs:
      []
  - id: "StartNode21"
    name: "SelectVisibilityAndPriority"
    mode: "private"
    strict: false
    inputs:
      []
  - id: "StartNode24"
    name: "Finish"
    mode: "private"
    strict: false
    inputs:
      []
  - id: "StartNode3"
    name: "Start"
    mode: "private"
    strict: false
    inputs:
      []
  - id: "StartNode7"
    name: "ProcessValuesInContainerIntern"
    mode: "private"
    strict: true
    inputs:
      - key: "UniquePageletSearchID"
        type: "java.lang.String"
        required: false
      - key: "StepCounter"
        type: "java.lang.Integer"
        required: false
  - id: "StartNode8"
    name: "RemoveContainer"
    mode: "private"
    strict: true
    inputs:
      []
  - id: "StartNode9"
    name: "ProcessValuesInContainer"
    mode: "private"
    strict: false
    inputs:
      []

steps:
  - id: "AddObjectToVector1"
    type: "pipelet"
    ref: "AddObjectToVector"
    config:
      Mode: "Forbid Duplicates"
    bindings:
      OutVector: "PageEntryPointDefinitions"
      InVector: "OutVector"
      Objects: "PageletModelUtils:ExtendingSystemPageEntryPointDefinitions(PageletDefinition,Domain)"
  - id: "AddObjectToVector2"
    type: "pipelet"
    ref: "AddObjectToVector"
    config:
      Mode: "Forbid Duplicates"
    bindings:
      Objects: "PageletModelUtils:ExtendingNonSystemPageEntryPointDefinitions(PageletDefinition,Domain)"
  - id: "AddObjectToVector3"
    type: "pipelet"
    ref: "AddObjectToVector"
    config:
      Mode: "Forbid Duplicates"
    bindings:
      OutVector: "PageEntryPointDefinitions"
      Object: "null"
      Objects: "null"
  - id: "CalculateInteger1"
    type: "pipelet"
    ref: "CalculateInteger"
    config:
      Operation: "+"
      Operand2: 1
    bindings:
      Operand1: "StepCounter"
      Result: "StepCounter"
  - id: "CallNode1"
    type: "call"
    ref: "ViewPageVariantPageAssignmentCreationWizard-ProcessValuesInContainerIntern"
  - id: "CallNode10"
    type: "call"
    ref: "ProcessContentWizard-RemoveClipboard"
    bindings:
      UniqueSearchID: "UniquePageletSearchID"
  - id: "CallNode11"
    type: "call"
    ref: "ViewPageVariantPageAssignmentCreationWizard-StoreErrors"
    bindings:
      ErrorNoPagesSelected: "\"true\""
  - id: "CallNode12"
    type: "call"
    ref: "ViewPageVariantPageAssignmentCreationWizard-ProcessValuesInContainer"
  - id: "CallNode13"
    type: "call"
    ref: "ViewPageVariantPageAssignmentCreationWizard-RemoveErrors"
  - id: "CallNode14"
    type: "call"
    ref: "ViewPageVariantProcessingWizard-RemoveContainer"
  - id: "CallNode15"
    type: "call"
    ref: "ProcessContentWizard-GetSelectedMenuItem"
  - id: "CallNode16"
    type: "call"
    ref: "ViewPageVariantPageAssignmentCreationWizard-GetAllowedPageEntryPointDefs"
    bindings:
      Domain: "ContentRepository:RepositoryDomain"
      PageletDefinition: "Pagelet:PageletDefinition(ContentRepository:RepositoryDomain:Site)"
  - id: "CallNode17"
    type: "call"
    ref: "ProcessContentWizard-UpdateClipboard"
  - id: "CallNode19"
    type: "call"
    ref: "ProcessStorefrontEditing-GetWorkingContextTime"
    bindings:
      ContentRepository: "ContentRepository"
  - id: "CallNode2"
    type: "call"
    ref: "ViewPageVariantPageAssignmentCreationWizard-ProcessValuesInContainer"
  - id: "CallNode20"
    type: "call"
    ref: "ViewPageVariantProcessingWizard-ProcessValuesInContainer"
  - id: "CallNode22"
    type: "call"
    ref: "ViewPageVariantPageAssignmentCreationWizard-RemoveContainer"
  - id: "CallNode23"
    type: "call"
    ref: "ViewPageVariantPageAssignmentCreationWizard-ProcessValuesInContainer"
  - id: "CallNode3"
    type: "call"
    ref: "ProcessPageletAssignmentProperties-Validate"
  - id: "CallNode30"
    type: "call"
    ref: "ViewPageVariantPageAssignmentCreationWizard-ProcessValuesInContainer"
  - id: "CallNode39"
    type: "call"
    ref: "ProcessContentWizard-ResolvePagelet"
    bindings:
      Object: "FirstElement"
  - id: "CallNode4"
    type: "call"
    ref: "ProcessContentWizard-GetClipboard"
    bindings:
      UniqueSearchID: "UniquePageletSearchID"
      UUIDs: "PEPUUIDs"
      Clipboard: "null"
  - id: "CallNode5"
    type: "call"
    ref: "ProcessContentWizard-UpdateClipboard"
  - id: "CallNode6"
    type: "call"
    ref: "ProcessDate-ConvertPeriodToString"
    bindings:
      ValidFromDate: "AssignmentFrom"
      ValidToDate: "AssignmentTo"
      ValidFromString: "AssignmentFromString"
      ValidToString: "AssignmentToString"
  - id: "CallNode7"
    type: "call"
    ref: "ViewPageVariantPageAssignmentCreationWizard-RemoveErrors"
  - id: "CallNode8"
    type: "call"
    ref: "ProcessContentWizard-GetSelectedMenuItem"
  - id: "CallNode9"
    type: "call"
    ref: "ViewPageVariantPageAssignmentCreationWizard-RemoveContainer"
  - id: "CreateArrayFromIterator2"
    type: "pipelet"
    ref: "CreateArrayFromIterator"
