      ComponentType: "java.lang.String"
    bindings:
      Iterator: "PEPUUIDs"
      Array: "PEPUUIDsArray"
  - id: "DecisionNode1"
    type: "decision"
    condition: "PageletClipboard:ObjectUUIDsIterator"
  - id: "DecisionNode2"
    type: "decision"
    condition: "Pageable:ElementCount"
  - id: "DecisionNode3"
    type: "decision"
    condition: "ActionID"
  - id: "DispatchFormAction2"
    type: "pipelet"
