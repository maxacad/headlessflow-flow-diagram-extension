flow: "ProcessOrderExportJob"
kind: "process"

entries:
  - id: "StartNode1"
    name: "UpdateOrderStatus"
    mode: "private"
    strict: true
    inputs:
      - key: "OrderBO"
        type: "com.intershop.component.order.capi.OrderBO"
        required: true
      - key: "newOrderStatus"
        type: "java.lang.String"
        required: true
      - key: "currentOrderStatus"
        type: "java.lang.String"
        required: true
  - id: "StartNode2"
    name: "UpdateOrderPLIStatus"
    mode: "private"
    strict: true
    inputs:
      - key: "OrderBO"
        type: "com.intershop.component.order.capi.OrderBO"
        required: true
      - key: "newPLIStatus"
        type: "java.lang.String"
        required: true
      - key: "currentPLIStatus"
        type: "java.lang.String"
        required: true
  - id: "StartNode6"
    name: "GetAllPermittedDomains"
    mode: "private"
    strict: true
    inputs:
      - key: "Config"
        type: "com.intershop.component.orderimpex.capi.export.scenario.ExportScenario"
        required: true
  - id: "StartNode8"
    name: "RunExportActions"
    mode: "private"
    strict: true
    inputs:
      - key: "Config"
        type: "com.intershop.component.orderimpex.capi.export.scenario.ExportScenario"
        required: true
      - key: "DataPushObjects"
        type: "com.intershop.component.service.capi.push.DataPushResult"
        required: false
  - id: "StartNode9"
    name: "GetOrderBORepository"
    mode: "private"
    strict: true
    inputs:
      - key: "Config"
        type: "com.intershop.component.orderimpex.capi.export.scenario.ExportScenario"
        required: true

steps:
  - id: "AddObjectToVector1"
    type: "pipelet"
    ref: "AddObjectToVector"
    config:
      Mode: "Allow Duplicates"
    bindings:
      Object: "Config:JobConfiguration:Domain"
      Iterator: "null"
      InVector: "null"
      Objects: "null"
      OutVector: "OrderDomains"
  - id: "AddObjectToVector2"
    type: "pipelet"
    ref: "AddObjectToVector"
    bindings:
      Object: "Repository:RepositoryDomain"
      Iterator: "null"
      InVector: "OrderDomains"
      OutVector: "OrderDomains"
  - id: "AddObjectToVector3"
    type: "pipelet"
    ref: "AddObjectToVector"
    config:
      Mode: "Allow Duplicates"
    bindings:
      Iterator: "null"
      OutVector: "OrderDomains"
  - id: "CallNode1"
    type: "call"
    ref: "ProcessChannelList-ListAll"
  - id: "CallNode2"
    type: "call"
    ref: "This:UpdateOrderStatus"
    bindings:
      newOrderStatus: "\"CANCELLEDANDEXPORTED\""
      currentOrderStatus: "\"CANCELLED\""
  - id: "CallNode3"
    type: "call"
    ref: "This:UpdateOrderStatus"
    bindings:
      newOrderStatus: "\"INPROGRESS\""
      currentOrderStatus: "\"NEW\""
  - id: "CallNode4"
    type: "call"
    ref: "This:UpdateOrderPLIStatus"
    bindings:
      newPLIStatus: "\"CANCELLEDANDEXPORTED\""
      currentPLIStatus: "\"CANCELLED\""
  - id: "CallNode5"
    type: "call"
    ref: "This:UpdateOrderPLIStatus"
    bindings:
      newPLIStatus: "\"INPROGRESS\""
      currentPLIStatus: "\"NEW\""
  - id: "DecisionNode10"
    type: "decision"
    condition: "Config:Actions:LINewToInProgress"
  - id: "DecisionNode2"
    type: "decision"
    condition: "OrderProductLineItemBO:FulfillmentStatus"
  - id: "DecisionNode5"
    type: "decision"
    condition: "Config:Actions:CanceledToCanceledExported"
  - id: "DecisionNode6"
    type: "decision"
    condition: "OrderBO:Status"
  - id: "DecisionNode8"
    type: "decision"
    condition: "Config:Actions:NewToInProgress"
  - id: "DecisionNode9"
    type: "decision"
    condition: "Config:Actions:LICanceledToCanceledExported"
  - id: "EndNode1"
    type: "end"
    strict: true
  - id: "EndNode4"
    type: "end"
    strict: true
  - id: "EndNode6"
    type: "end"
    strict: true
  - id: "EndNode7"
    type: "end"
    strict: true
    outputs:
      - key: "OrderDomains"
        type: "java.util.Collection"
        guaranteed: true
  - id: "EndNode9"
    type: "end"
    strict: true
    outputs:
      - key: "OrderBORepository"
        type: "com.intershop.component.order.capi.OrderBORepository"
        guaranteed: true
  - id: "GetApplicationBO1"
    type: "pipelet"
    ref: "GetApplicationBO"
  - id: "GetOrganizationByDomain1"
    type: "pipelet"
    ref: "GetOrganizationByDomain"
    bindings:
      OrganizationDomain: "Config:JobConfiguration:Domain"
      Organization: "CurrentOrganization"
  - id: "JoinNode1"
    type: "join"
  - id: "JoinNode10"
    type: "join"
  - id: "JoinNode12"
    type: "join"
  - id: "JoinNode2"
    type: "join"
  - id: "JoinNode5"
    type: "join"
  - id: "JoinNode7"
    type: "join"
  - id: "JoinNode9"
    type: "join"
  - id: "KeyMapper2"
    type: "pipelet"
    ref: "KeyMapper"
    bindings:
      OutValue_1: "OrderBORepository"
      InValue_1: "ApplicationBO:Extension(\"Order\"):OrderBORepositoryOfOwningRepository"
  - id: "LoopNode1"
    type: "loop"
  - id: "LoopNode5"
    type: "loop"
  - id: "LoopNode9"
    type: "loop"
  - id: "UpdateOrderBOStatus3"
    type: "pipelet"
    ref: "UpdateOrderBOStatus"
    config:
      StatusGroup: "OrderStatus"
      newOrderStatus: "CANCELLEDANDEXPORTED"
  - id: "UpdateOrderProductLineItemBOStatus3"
    type: "pipelet"
    ref: "UpdateOrderProductLineItemBOStatus"
    config:
      newStatusName: "CANCELLEDANDEXPORTED"
      StatusGroup: "SellerOrderProductLineItemStatus"
    bindings:
      newStatusName: "newPLIStatus"

links:
  - from: "GetOrganizationByDomain1"
    via: "next"
    to: "CallNode1"
    into: "in"
  - from: "AddObjectToVector2"
    via: "next"
    to: "LoopNode1"
    into: "loop"
  - from: "CallNode1"
    via: "next"
    to: "AddObjectToVector3"
    into: "in"
  - from: "AddObjectToVector3"
    via: "next"
    to: "LoopNode1"
    into: "in"
  - from: "KeyMapper2"
    via: "next"
    to: "EndNode9"
    into: "in"
  - from: "DecisionNode5"
    via: "yes"
    to: "CallNode2"
    into: "in"
  - from: "DecisionNode10"
    via: "yes"
    to: "CallNode5"
    into: "in"
  - from: "JoinNode10"
    via: "next"
    to: "DecisionNode9"
    into: "in"
  - from: "JoinNode12"
    via: "next"
    to: "LoopNode5"
    into: "loop"
  - from: "JoinNode9"
    via: "next"
    to: "DecisionNode8"
    into: "in"
  - from: "DecisionNode9"
    via: "yes"
    to: "CallNode4"
    into: "in"
  - from: "DecisionNode10"
    via: "no"
    to: "JoinNode12"
    into: "in2"
  - from: "DecisionNode8"
    via: "yes"
    to: "CallNode3"
    into: "in"
  - from: "CallNode3"
    via: "next"
    to: "JoinNode10"
    into: "in1"
  - from: "LoopNode5"
    via: "do"
    to: "DecisionNode5"
    into: "in"
  - from: "DecisionNode2"
    via: "yes"
    to: "UpdateOrderProductLineItemBOStatus3"
    into: "in"
  - from: "DecisionNode9"
    via: "no"
    to: "JoinNode2"
    into: "in2"
  - from: "CallNode2"
    via: "next"
    to: "JoinNode9"
    into: "in1"
  - from: "StartNode2"
    via: "next"
    to: "LoopNode9"
    into: "in"
  - from: "CallNode4"
    via: "next"
    to: "JoinNode2"
    into: "in1"
  - from: "AddObjectToVector1"
    via: "next"
    to: "JoinNode1"
    into: "in3"
  - from: "JoinNode2"
    via: "next"
    to: "DecisionNode10"
    into: "in"
  - from: "JoinNode1"
    via: "next"
    to: "EndNode7"
    into: "in"
  - from: "DecisionNode2"
    via: "no"
    to: "JoinNode5"
    into: "in2"
  - from: "CallNode5"
    via: "next"
    to: "JoinNode12"
    into: "in1"
  - from: "DecisionNode5"
    via: "no"
    to: "JoinNode9"
    into: "in1"
  - from: "DecisionNode8"
    via: "no"
    to: "JoinNode10"
    into: "in2"
  - from: "StartNode8"
    via: "next"
    to: "LoopNode5"
    into: "in"
  - from: "LoopNode5"
    via: "next"
    to: "EndNode6"
    into: "in"
  - from: "StartNode6"
    via: "next"
    to: "GetOrganizationByDomain1"
    into: "in"
  - from: "LoopNode9"
    via: "do"
    to: "DecisionNode2"
    into: "in"
  - from: "LoopNode9"
    via: "next"
    to: "EndNode4"
    into: "in"
  - from: "StartNode9"
    via: "next"
    to: "GetApplicationBO1"
    into: "in"
  - from: "StartNode1"
    via: "next"
    to: "DecisionNode6"
    into: "in"
  - from: "JoinNode7"
    via: "next"
    to: "EndNode1"
    into: "in"
  - from: "GetOrganizationByDomain1"
    via: "error"
    to: "AddObjectToVector1"
    into: "in"
  - from: "DecisionNode6"
    via: "yes"
    to: "UpdateOrderBOStatus3"
    into: "in"
  - from: "UpdateOrderBOStatus3"
    via: "next"
    to: "JoinNode7"
    into: "in1"
  - from: "DecisionNode6"
    via: "no"
    to: "JoinNode7"
    into: "in2"
  - from: "UpdateOrderProductLineItemBOStatus3"
    via: "next"
    to: "JoinNode5"
    into: "in1"
  - from: "GetApplicationBO1"
    via: "next"
    to: "KeyMapper2"
    into: "in"
  - from: "JoinNode5"
    via: "next"
    to: "LoopNode9"
    into: "loop"
  - from: "LoopNode1"
    via: "do"
    to: "AddObjectToVector2"
    into: "in"
  - from: "LoopNode1"
    via: "next"
    to: "JoinNode1"
    into: "in1"
