  - from: "DecisionNode2"
    via: "yes"
    to: "KeyMapper2"
    into: "in"
  - from: "KeyMapper2"
    via: "next"
    to: "CalculateDouble1"
    into: "in"
  - from: "VerifyDouble2"
    via: "next"
    to: "EndNode1"
    into: "in"
  - from: "CalculateDouble3"
    via: "next"
    to: "JoinNode4"
    into: "in3"
  - from: "VerifyDouble4"
    via: "next"
    to: "KeyMapper1"
    into: "in"
  - from: "KeyMapper1"
    via: "next"
    to: "DecisionNode5"
    into: "in"
  - from: "KeyMapper3"
    via: "next"
    to: "DecisionNode5"
    into: "in"
  - from: "DecisionNode5"
    via: "no"
    to: "CalculateDouble3"
    into: "in"
  - from: "DecisionNode5"
    via: "yes"
    to: "CalculateDouble2"
    into: "in"
  - from: "CalculateDouble2"
    via: "next"
    to: "KeyMapper3"
    into: "in"
  - from: "DecisionNode4"
    via: "no"
    to: "JoinNode4"
    into: "in1"
  - from: "GetValuesFromRequest1"
    via: "error"
    to: "VerifyDouble1"
    into: "in"
  - from: "JoinNode4"
    via: "next"
    to: "DecisionNode1"
    into: "in"
  - from: "GetValuesFromRequest1"
    via: "next"
    to: "VerifyDouble1"
