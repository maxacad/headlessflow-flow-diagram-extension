flow: "ViewPagelet_comp_navigation_secondarynavigation"
kind: "view"

entries:
  - id: "StartNode1"
    name: "SecondaryNavigationComponent"
    mode: "private"
    strict: true
    inputs:
      - key: "CategoryBO"
        type: "com.intershop.component.catalog.capi.CatalogCategoryBO"
        required: true
      - key: "PageletConfigurationParameters"
        type: "java.lang.Object"
        required: true

steps:
  - id: "CalculateDouble1"
    type: "pipelet"
    ref: "CalculateDouble"
    config:
      Operation: "-"
    bindings:
      Operand1: "offset"
      Operand2: "OneDouble"
      Result: "offset"
  - id: "CalculateDouble2"
    type: "pipelet"
    ref: "CalculateDouble"
    config:
      Operation: "+"
    bindings:
      Operand1: "categoryDepth"
      Operand2: "OneDouble"
      Result: "categoryDepth"
  - id: "CalculateDouble3"
    type: "pipelet"
    ref: "CalculateDouble"
    config:
      Operation: "-"
    bindings:
      Operand1: "categoryDepth"
      Operand2: "offset"
      Result: "offset"
  - id: "DecisionNode1"
    type: "decision"
    condition: "offset"
  - id: "DecisionNode2"
    type: "decision"
    condition: "CategoryBO:Parent"
  - id: "DecisionNode3"
    type: "decision"
    condition: "offset"
  - id: "DecisionNode4"
    type: "decision"
    condition: "PageletConfigurationParameters:offsetType"
  - id: "DecisionNode5"
    type: "decision"
    condition: "CountingCategoryBO:Parent"
  - id: "EndNode1"
    type: "end"
    strict: true
    outputs:
      - key: "CurrentOrganization"
        type: "com.intershop.component.organization.capi.Organization"
        guaranteed: true
      - key: "CategoryBO"
        type: "com.intershop.component.catalog.capi.CatalogCategoryBO"
        guaranteed: true
      - key: "CurrentCategoryBO"
        type: "com.intershop.component.catalog.capi.CatalogCategoryBO"
        guaranteed: false
      - key: "offset"
        type: "java.lang.Double"
        guaranteed: false
  - id: "GetValuesFromRequest1"
    type: "pipelet"
    ref: "GetValuesFromRequest"
    config:
      Namespace: "Application"
    bindings:
      Key: "\"CurrentOrganization\""
      Namespace: "null"
  - id: "JoinNode1"
    type: "join"
  - id: "JoinNode2"
    type: "join"
  - id: "JoinNode3"
    type: "join"
  - id: "JoinNode4"
    type: "join"
  - id: "KeyMapper1"
    type: "pipelet"
    ref: "KeyMapper"
    bindings:
      InValue_1: "CategoryBO"
      OutValue_1: "CountingCategoryBO"
  - id: "KeyMapper2"
    type: "pipelet"
    ref: "KeyMapper"
    bindings:
      InValue_1: "CategoryBO:Parent"
      OutValue_1: "CategoryBO"
  - id: "KeyMapper3"
    type: "pipelet"
    ref: "KeyMapper"
    bindings:
      InValue_1: "CountingCategoryBO:Parent"
      OutValue_1: "CountingCategoryBO"
  - id: "KeyMapper8"
    type: "pipelet"
    ref: "KeyMapper"
    bindings:
      InValue_1: "CategoryBO"
      OutValue_1: "CurrentCategoryBO"
  - id: "VerifyDouble1"
    type: "pipelet"
    ref: "VerifyDouble"
    bindings:
      Locale: "null"
      Pattern: "null"
      LocalizedString: "PageletConfigurationParameters:offset"
      DoubleValue: "offset"
  - id: "VerifyDouble2"
    type: "pipelet"
    ref: "VerifyDouble"
    bindings:
      Locale: "null"
      Pattern: "null"
      LocalizedString: "PageletConfigurationParameters:offset"
      DoubleValue: "offset"
  - id: "VerifyDouble3"
    type: "pipelet"
    ref: "VerifyDouble"
    bindings:
      Locale: "null"
      LocalizedString: "\"1\""
      Pattern: "null"
      DoubleValue: "OneDouble"
  - id: "VerifyDouble4"
    type: "pipelet"
    ref: "VerifyDouble"
    bindings:
      LocalizedString: "\"1\""
      Locale: "null"
      Pattern: "null"
      DoubleValue: "categoryDepth"

links:
  - from: "StartNode1"
    via: "next"
    to: "GetValuesFromRequest1"
    into: "in"
  - from: "VerifyDouble1"
    via: "error"
    to: "JoinNode2"
    into: "in1"
  - from: "DecisionNode4"
    via: "yes"
    to: "VerifyDouble4"
    into: "in"
  - from: "DecisionNode2"
    via: "no"
    to: "JoinNode1"
    into: "in2"
  - from: "DecisionNode3"
    via: "no"
    to: "JoinNode2"
    into: "in2"
  - from: "VerifyDouble2"
    via: "error"
    to: "EndNode1"
    into: "in"
  - from: "DecisionNode1"
    via: "no"
    to: "JoinNode3"
    into: "in2"
  - from: "DecisionNode3"
    via: "yes"
    to: "KeyMapper8"
    into: "in"
  - from: "JoinNode2"
