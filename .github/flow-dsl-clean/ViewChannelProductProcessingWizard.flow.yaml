flow: "ViewChannelProductProcessingWizard"
kind: "view"

entries:
  - id: "StartNode1"
    name: "CheckLabelAction"
    mode: "private"
    strict: false
    inputs:
      []
  - id: "StartNode2"
    name: "SelectLabel"
    mode: "private"
    strict: false
    inputs:
      []
  - id: "StartNode3"
    name: "AddLabel"
    mode: "private"
    strict: false
    inputs:
      []

steps:
  - id: "CallNode1"
    type: "call"
    ref: "ProcessLabel-GetLabelsByDomain"
    bindings:
      Domain: "CurrentChannel:RepositoryDomain"
  - id: "CallNode2"
    type: "call"
    ref: "ProcessLabel-GetCSVStringFromIterator"
    bindings:
      CSVIterator: "LabelIDs"
      CSVString: "LabelIDsCSVString"
  - id: "CallNode3"
    type: "call"
    ref: "ProcessLabel-Create"
    bindings:
      Domain: "CurrentChannel:RepositoryDomain"
      User: "CurrentUser"
  - id: "CallNode4"
    type: "call"
  - id: "CallNode5"
    type: "call"
    ref: "ProcessLabel-GetLabelNamesByID"
  - id: "ConcatenateStrings1"
    type: "pipelet"
    ref: "ConcatenateStrings"
    bindings:
      String0: "\"ViewProcessList_\""
      String1: "CurrentChannel:TypeCode"
      String2: "\"-CreateProcess\""
      Concatenated: "CreateProcessPipeline"
  - id: "ConcatenateStrings2"
    type: "pipelet"
    ref: "ConcatenateStrings"
    bindings:
      String0: "\"ViewProcessList_\""
      String1: "CurrentChannel:TypeCode"
      String2: "\"-ListAll\""
      Concatenated: "ListAllProcessPipeline"
  - id: "ConcatenateStrings3"
    type: "pipelet"
    ref: "ConcatenateStrings"
    bindings:
      String0: "ProcessDescription"
      String1: "\" ( \""
      String2: "LabelNames"
      Concatenated: "ProcessDescription"
      String3: "\" )\""
  - id: "DecisionNode1"
    type: "decision"
    condition: "LabelID"
  - id: "DecisionNode2"
    type: "decision"
    condition: "LabelName"
  - id: "GetFormSelection1"
    type: "pipelet"
    ref: "GetFormSelection"
    bindings:
      ParameterName: "\"LabelID\""
      Selection: "LabelIDs"
  - id: "GetLocale1"
    type: "pipelet"
    ref: "GetLocale"
    config:
      LocaleFallback: "Session Locale"
  - id: "InteractionEnd11"
    type: "interaction"
  - id: "JoinNode2"
    type: "join"
  - id: "JoinNode3"
    type: "join"
  - id: "JumpNode1"
    type: "jump"
  - id: "JumpNode3"
    type: "jump"
    ref: "ViewChannelProductProcessingWizard-SelectLabel"
  - id: "KeyMapper14"
    type: "pipelet"
    ref: "KeyMapper"
    config:
      ValueType: "Form Value"
    bindings:
      OutValue_1: "ProcessPipeline"
      InValue_1: "\"ProcessLabel-BatchProcessAssign\""
      OutValue_4: "JobName"
      InValue_4: "\"Catalog\""
      OutValue_5: "JobNamePrefix"
      InValue_5: "\"Catalog\""
      InValue_6: "\"Assign Labels to Products\""
      OutValue_6: "ProcessDescription"
  - id: "KeyMapper5"
    type: "pipelet"
    ref: "KeyMapper"
    config:
      ValueType: "Form Value"
    bindings:
      InValue_1: "Label:UUID"
      OutValue_1: "LabelID"
  - id: "KeyMapper6"
    type: "pipelet"
    ref: "KeyMapper"
    config:
      ValueType: "Form Value"
    bindings:
      InValue_1: "LabelIDsCSVString"
      OutValue_1: "LabelID"
  - id: "PrepareApplicationView11"
    type: "pipelet"
    ref: "PrepareApplicationView"
    config:
      SelectedMenuItem: "ChannelProducts"
      WorkingTemplate: "product/ChannelAssignLabelAction"
      Dynamic: true
  - id: "SetDictionaryValue2"
    type: "pipelet"
    ref: "SetDictionaryValue"
    config:
      Name: "ErrorCode"
      Value: "NoLabelSelected"
  - id: "SetDictionaryValue3"
    type: "pipelet"
    ref: "SetDictionaryValue"
    config:
      Name: "ErrorCode"
      Value: "LabelExists"

links:
  - from: "StartNode2"
    via: "next"
    to: "CallNode1"
    into: "in"
  - from: "CallNode2"
    via: "next"
    to: "CallNode5"
    into: "in"
  - from: "SetDictionaryValue2"
    via: "next"
    to: "JoinNode2"
    into: "in1"
  - from: "CallNode3"
    via: "next"
    to: "KeyMapper5"
    into: "in"
  - from: "DecisionNode2"
    via: "no"
    to: "GetLocale1"
    into: "in"
  - from: "StartNode1"
    via: "next"
    to: "DecisionNode1"
    into: "in"
  - from: "JoinNode2"
    via: "next"
    to: "JumpNode3"
    into: "in"
  - from: "KeyMapper5"
    via: "next"
    to: "JoinNode2"
    into: "in1"
  - from: "StartNode3"
    via: "next"
    to: "DecisionNode2"
    into: "in"
  - from: "CallNode3"
    via: "Error"
    to: "SetDictionaryValue3"
    into: "in"
  - from: "JoinNode3"
    via: "next"
    to: "SetDictionaryValue2"
    into: "in"
  - from: "CallNode1"
    via: "next"
    to: "PrepareApplicationView11"
    into: "in"
  - from: "DecisionNode2"
    via: "yes"
    to: "JoinNode3"
    into: "in1"
  - from: "ConcatenateStrings3"
    via: "next"
    to: "KeyMapper6"
    into: "in"
  - from: "ConcatenateStrings2"
    via: "next"
    to: "CallNode4"
    into: "in"
  - from: "CallNode5"
    via: "next"
    to: "KeyMapper14"
    into: "in"
  - from: "ConcatenateStrings1"
    via: "next"
    to: "ConcatenateStrings2"
    into: "in"
  - from: "CallNode4"
    via: "next"
    to: "JumpNode1"
    into: "in"
  - from: "KeyMapper6"
    via: "next"
    to: "ConcatenateStrings1"
    into: "in"
  - from: "PrepareApplicationView11"
    via: "next"
    to: "InteractionEnd11"
    into: "in"
  - from: "KeyMapper14"
    via: "next"
    to: "ConcatenateStrings3"
    into: "in"
  - from: "GetFormSelection1"
    via: "next"
    to: "CallNode2"
    into: "in"
  - from: "GetLocale1"
    via: "next"
    to: "CallNode3"
    into: "in"
  - from: "DecisionNode1"
    via: "no"
    to: "JoinNode3"
    into: "in2"
  - from: "SetDictionaryValue3"
    via: "next"
    to: "JoinNode2"
    into: "in2"
  - from: "DecisionNode1"
    via: "yes"
    to: "GetFormSelection1"
    into: "in"
