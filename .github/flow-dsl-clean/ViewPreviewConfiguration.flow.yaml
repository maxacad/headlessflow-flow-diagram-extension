  - from: "DecisionNode3"
    via: "yes"
    to: "DecisionNode4"
    into: "in"
  - from: "DecisionNode4"
    via: "no"
    to: "GetCurrentDate1"
    into: "in"
  - from: "DecisionNode4"
    via: "yes"
    to: "CallNode5"
    into: "in"
  - from: "GetCurrentDate1"
    via: "next"
    to: "CallNode7"
    into: "in"
  - from: "GetPreviewConfigurationAttribute1"
    via: "next"
    to: "DecisionNode2"
    into: "in"
  - from: "GetPreviewConfigurationAttribute2"
    via: "next"
    to: "LoopNode1"
    into: "in"
  - from: "JoinNode12"
    via: "next"
    to: "JoinNode3"
    into: "in1"
  - from: "JoinNode1"
    via: "next"
    to: "Pipelet4"
    into: "in"
  - from: "JoinNode2"
    via: "next"
    to: "EndNode2"
    into: "in"
  - from: "JoinNode3"
    via: "next"
    to: "LoopNode1"
    into: "loop"
  - from: "JoinNode4"
    via: "next"
    to: "EndNode3"
    into: "in"
  - from: "JoinNode5"
    via: "next"
    to: "InteractionNode1"
    into: "in"
  - from: "JoinNode6"
    via: "next"
    to: "JoinNode7"
