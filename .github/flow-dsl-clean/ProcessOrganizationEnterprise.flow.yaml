flow: "ProcessOrganizationEnterprise"
kind: "process"

entries:
  - id: "Start1"
    name: "Remove"
    mode: "private"
    strict: false
    inputs:
      - key: "DeleteOrganizationEnterprise"
        type: "com.intershop.component.organization.capi.Organization"
        required: false
  - id: "Start6"
    name: "Create"
    mode: "private"
    strict: false
    inputs:
      []
  - id: "StartNode1"
    name: "ListAll"
    mode: "private"
    strict: false
    inputs:
      []

steps:
  - id: "AddObjectToVector7"
    type: "pipelet"
    ref: "AddObjectToVector"
    bindings:
      Object: "\"20\""
      Iterator: "TypeCodes"
  - id: "Call1"
    type: "call"
    ref: "Organization-Remove"
    bindings:
      RemoveOrganizationDomainSite: "\"true\""
  - id: "Call4"
    type: "call"
    ref: "Organization-CreateSite"
  - id: "Call5"
    type: "call"
    ref: "Organization-Create"
  - id: "CheckForEmptyString1"
    type: "pipelet"
    ref: "CheckForEmptyString"
    bindings:
      FilledString: "OrganizationState"
  - id: "Decision1"
    type: "decision"
    condition: "OrganizationID"
  - id: "Decision2"
    type: "decision"
    condition: "AdminPassword"
  - id: "End1"
    type: "end"
    strict: false
  - id: "End2"
    type: "end"
    strict: false
  - id: "End3"
    type: "end"
    strict: false
  - id: "End4"
    type: "end"
    strict: false
  - id: "EndNode1"
    type: "end"
    strict: false
  - id: "EndNode2"
    type: "end"
    strict: false
  - id: "ExecutePageableQuery1"
    type: "pipelet"
    ref: "ExecutePageableQuery"
    config:
      Datasource: "default"
      DefaultPageSize: 10
      QueryName: "organization/GetOrganizationsByOwningDomain"
      ParameterName_01: "OwningDomain"
      ParameterName_02: "TypeCodes"
      ParameterName_03: "SortBy"
    bindings:
      ParameterValue_01: "CurrentOrganization:Domain"
      ParameterValue_02: "TypeCodes"
      ParameterValue_03: "\"ID\""
      SearchResult: "EnterpriseOrganizations"
  - id: "GetOrganization1"
    type: "pipelet"
    ref: "GetOrganization"
    config:
      Source: "PipelineDictionary"
  - id: "Join1"
    type: "join"
  - id: "Join2"
    type: "join"
  - id: "Join3"
    type: "join"
  - id: "Join4"
    type: "join"
  - id: "Join5"
    type: "join"
  - id: "Join6"
    type: "join"
  - id: "Join7"
    type: "join"
  - id: "Join8"
    type: "join"
  - id: "Join9"
    type: "join"
  - id: "KeyMapper4"
    type: "pipelet"
    ref: "KeyMapper"
    bindings:
      InValue_1: "SiteDomain"
      InValue_2: "Organization:Domain"
      OutValue_1: "Site"
      OutValue_2: "Owner"
  - id: "RemoveDomainFileStructure1"
    type: "pipelet"
    ref: "RemoveDomainFileStructure"
    bindings:
      Domain: "SiteDomain"
  - id: "SetDictionaryValue2"
    type: "pipelet"
    ref: "SetDictionaryValue"
    config:
      Name: "ErrorCode"
      Value: "PasswordConfirmationDoesNotMatchWithPassword"
  - id: "SetDictionaryValue3"
    type: "pipelet"
    ref: "SetDictionaryValue"
    config:
      Name: "ParentDomainName"
      Value: "root"
  - id: "SetDictionaryValue4"
    type: "pipelet"
    ref: "SetDictionaryValue"
    config:
      Name: "ORG_VALIDATION_ERROR"
      Value: "Sitenname EQ OrganizationID"
  - id: "SetDictionaryValue5"
    type: "pipelet"
    ref: "SetDictionaryValue"
    config:
      Name: "OrganizationState"
      Value: 0
  - id: "SetDictionaryValue8"
    type: "pipelet"
    ref: "SetDictionaryValue"
    config:
      Name: "SITE_CREATION_ERROR"
      Value: "ID in use"
  - id: "VerifyInteger1"
    type: "pipelet"
    ref: "VerifyInteger"
    bindings:
      LocalizedString: "ApplicationTypeID"
      IntegerObject: "ApplicationTypeID"
  - id: "VerifyInteger2"
    type: "pipelet"
    ref: "VerifyInteger"
    bindings:
      LocalizedString: "OrganizationType"
      IntegerObject: "OrganizationType"
  - id: "VerifyInteger3"
    type: "pipelet"
    ref: "VerifyInteger"
    bindings:
      LocalizedString: "OrganizationState"
      IntegerObject: "OrganizationState"

links:
  - from: "AddObjectToVector7"
    via: "next"
    to: "ExecutePageableQuery1"
    into: "in"
  - from: "Call1"
    via: "ERROR"
    to: "Join7"
    into: "in1"
  - from: "Call1"
    via: "next"
    to: "End3"
    into: "in"
  - from: "Call4"
