    to: "CheckForEmptyString1"
    into: "in"
  - from: "Decision2"
    via: "no"
    to: "SetDictionaryValue2"
    into: "in"
  - from: "Decision2"
    via: "yes"
    to: "VerifyInteger1"
    into: "in"
  - from: "ExecutePageableQuery1"
    via: "error"
    to: "EndNode2"
    into: "in"
  - from: "ExecutePageableQuery1"
    via: "next"
    to: "EndNode1"
    into: "in"
  - from: "GetOrganization1"
    via: "error"
    to: "Join7"
    into: "in1"
  - from: "GetOrganization1"
    via: "next"
