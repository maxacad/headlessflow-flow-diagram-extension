flow: "SynchronizeFileResources"
kind: "job"

entries:
  - id: "StartNode1"
    name: "Start"
    mode: "private"
    strict: false
    inputs:
      []
  - id: "StartNode2"
    name: "Error"
    mode: "private"
    strict: false
    inputs:
      []
  - id: "StartNode4"
    name: "GetSiteMap"
    mode: "private"
    strict: true
    inputs:
      []

steps:
  - id: "AddEntryToMap1"
    type: "pipelet"
    ref: "AddEntryToMap"
    bindings:
      InMap: "SiteMap"
      OutMap: "SiteMap"
      Key: "Site:DomainInformation:DomainName"
      Value: "Site"
  - id: "CallNode2"
    type: "call"
    ref: "SynchronizeFileResources-GetSiteMap"
  - id: "CreateSiteIterator2"
    type: "pipelet"
    ref: "CreateSiteIterator"
  - id: "DecisionNode1"
    type: "decision"
    condition: "SiteMap:get(SiteDir:Name)"
  - id: "DecisionNode2"
    type: "decision"
    condition: "JobConfigurationUUID"
  - id: "EndNode1"
    type: "end"
    strict: false
  - id: "EndNode3"
    type: "end"
    strict: false
  - id: "EndNode4"
    type: "end"
    strict: true
    outputs:
      - key: "SiteMap"
        type: "java.util.Map"
        guaranteed: false
  - id: "GetJobConfiguration1"
    type: "pipelet"
    ref: "GetJobConfiguration"
    bindings:
      JobUUID: "JobConfigurationUUID"
  - id: "GetResourceByName1"
    type: "pipelet"
    ref: "GetResourceByName"
    bindings:
      ResourceName: "\"Share\""
      Domain: "SystemDomain"
      Resource: "Share"
  - id: "GetResourceByName3"
    type: "pipelet"
    ref: "GetResourceByName"
    bindings:
      ResourceName: "\"sites\""
      ParentResource: "Share"
      Domain: "SystemDomain"
      Resource: "SitesDir"
  - id: "GetSystemDomain1"
    type: "pipelet"
    ref: "GetSystemDomain"
  - id: "JoinNode1"
    type: "join"
  - id: "JoinNode2"
    type: "join"
  - id: "JoinNode3"
    type: "join"
  - id: "JoinNode4"
    type: "join"
  - id: "JoinNode5"
    type: "join"
  - id: "JumpNode1"
    type: "jump"
    ref: "SynchronizeFileResources-Error"
  - id: "LoopNode1"
    type: "loop"
  - id: "LoopNode2"
    type: "loop"
  - id: "RefreshCache1"
    type: "pipelet"
    ref: "RefreshCache"
    config:
      PersistentClassName_0: "com.intershop.beehive.core.internal.locking.ResourcePO"
  - id: "RemoveOutdatedFileResources1"
    type: "pipelet"
    ref: "RemoveOutdatedFileResources"
    bindings:
      Site: "SiteMap:get(SiteDir:Name)"
      SiteResource: "SiteDir"
  - id: "UpdateCustomAttribute1"
    type: "pipelet"
    ref: "UpdateCustomAttribute"
    config:
      DefaultAttributeName: "FinishedWithError"
      DefaultAttributeType: "String"
      DefaultAttributeValue: true
    bindings:
      ExtensibleObject: "JobConfiguration"
  - id: "UpdateMapping1"
    type: "pipelet"
    ref: "UpdateMapping"
    config:
      Mode: "Add"
    bindings:
      OutMap: "SiteMap"

links:
  - from: "StartNode1"
    via: "next"
    to: "CallNode2"
    into: "in"
  - from: "GetSystemDomain1"
    via: "next"
    to: "GetResourceByName1"
    into: "in"
  - from: "LoopNode1"
    via: "do"
    to: "DecisionNode1"
    into: "in"
  - from: "GetResourceByName3"
    via: "next"
    to: "LoopNode1"
    into: "in"
  - from: "StartNode4"
    via: "next"
    to: "CreateSiteIterator2"
    into: "in"
  - from: "CreateSiteIterator2"
    via: "next"
    to: "UpdateMapping1"
    into: "in"
  - from: "LoopNode1"
    via: "next"
    to: "RefreshCache1"
    into: "in"
  - from: "JoinNode1"
    via: "next"
    to: "LoopNode1"
    into: "loop"
  - from: "LoopNode2"
    via: "next"
    to: "EndNode4"
    into: "in"
  - from: "UpdateMapping1"
    via: "next"
    to: "LoopNode2"
    into: "in"
  - from: "AddEntryToMap1"
    via: "next"
    to: "LoopNode2"
    into: "loop"
  - from: "CallNode2"
    via: "next"
    to: "GetSystemDomain1"
    into: "in"
  - from: "RefreshCache1"
    via: "next"
    to: "EndNode1"
    into: "in"
  - from: "JoinNode2"
    via: "next"
    to: "JumpNode1"
    into: "in"
  - from: "GetJobConfiguration1"
    via: "next"
    to: "UpdateCustomAttribute1"
    into: "in"
  - from: "UpdateCustomAttribute1"
    via: "next"
    to: "JoinNode3"
    into: "in1"
  - from: "DecisionNode2"
    via: "yes"
    to: "GetJobConfiguration1"
    into: "in"
  - from: "GetJobConfiguration1"
    via: "error"
    to: "JoinNode4"
    into: "in2"
  - from: "JoinNode3"
    via: "next"
    to: "EndNode3"
    into: "in"
  - from: "DecisionNode2"
    via: "no"
    to: "JoinNode4"
    into: "in1"
  - from: "UpdateCustomAttribute1"
    via: "error"
    to: "JoinNode5"
    into: "in2"
  - from: "LoopNode2"
    via: "do"
    to: "AddEntryToMap1"
    into: "in"
  - from: "JoinNode4"
    via: "next"
    to: "JoinNode5"
    into: "in1"
  - from: "JoinNode5"
    via: "next"
    to: "JoinNode3"
    into: "in2"
  - from: "StartNode2"
    via: "next"
    to: "DecisionNode2"
    into: "in"
  - from: "DecisionNode1"
    via: "yes"
    to: "RemoveOutdatedFileResources1"
    into: "in"
  - from: "GetResourceByName3"
    via: "error"
    to: "JoinNode2"
    into: "in2"
  - from: "GetResourceByName1"
    via: "next"
    to: "GetResourceByName3"
    into: "in"
  - from: "DecisionNode1"
    via: "no"
    to: "JoinNode1"
    into: "in2"
  - from: "GetResourceByName1"
    via: "error"
    to: "JoinNode2"
    into: "in1"
  - from: "RemoveOutdatedFileResources1"
    via: "next"
    to: "JoinNode1"
    into: "in1"
