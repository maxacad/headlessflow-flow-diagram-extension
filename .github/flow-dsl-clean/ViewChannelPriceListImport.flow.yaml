      PageableName: "Files"
      Pagesize: 10
    bindings:
      Iterator: "Directory:Files"
      Pageable: "Files"
  - id: "Pipelet7"
    type: "pipelet"
    ref: "DispatchFormAction"
    config:
      OutValue_0: "ViewChannelPriceListImport-SelectFile"
      OutValue_1: "ViewChannelPriceListImport-Paging"
