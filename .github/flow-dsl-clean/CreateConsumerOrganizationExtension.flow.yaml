flow: "CreateConsumerOrganizationExtension"
kind: "extension"

entries:
  - id: "Start1"
    name: "Start"
    mode: "private"
    strict: true
    inputs:
      - key: "Organization"
        type: "com.intershop.component.organization.capi.Organization"
        required: true
      - key: "DefaultDomainName"
        type: "java.lang.String"
        required: false
      - key: "Owner"
        type: "com.intershop.beehive.core.capi.domain.Domain"
        required: false

steps:
  - id: "AssignUserGroupToUserGroup1"
    type: "pipelet"
    ref: "AssignUserGroupToUserGroup"
    bindings:
      ChildUserGroup: "OrganizationUserGroup"
      UserGroup: "ChannelUserGroup"
  - id: "Call1"
    type: "call"
    ref: "AccessRoles-Create"
  - id: "CreateDomainRelation1"
    type: "pipelet"
    ref: "CreateDomainRelation"
    config:
      DefaultRelationName: "HANDLING_METHOD"
      DefaultRoleName: "Role B"
    bindings:
      RelationName: "null"
      Source: "Organization:Domain"
      Target: "Organization:OwningDomain:Domain"
  - id: "CreateDomainRelation2"
    type: "pipelet"
    ref: "CreateDomainRelation"
    config:
      DefaultRelationName: "TAX_JURISDICTION"
      DefaultRoleName: "Role B"
    bindings:
      RelationName: "null"
      Source: "Organization:Domain"
      Target: "TAX_Domain"
  - id: "CreateDomainRelation3"
    type: "pipelet"
    ref: "CreateDomainRelation"
    config:
      DefaultRelationName: "TAX_CLASS"
      DefaultRoleName: "Role B"
    bindings:
      RelationName: "null"
      Source: "Organization:Domain"
      Target: "TAX_Domain"
  - id: "CreateDomainRelation4"
    type: "pipelet"
    ref: "CreateDomainRelation"
    config:
      DefaultRelationName: "PAYMENT_METHOD"
      DefaultRoleName: "Role B"
    bindings:
      RelationName: "null"
      Source: "Organization:Domain"
      Target: "TAX_Domain"
  - id: "CreateDomainRelation5"
    type: "pipelet"
    ref: "CreateDomainRelation"
    config:
      DefaultRelationName: "SHIPPING_METHOD"
      DefaultRoleName: "Role B"
    bindings:
      RelationName: "null"
      Source: "Organization:Domain"
      Target: "Organization:OwningDomain:Domain"
  - id: "CreateDomainRelation6"
    type: "pipelet"
    ref: "CreateDomainRelation"
    config:
      DefaultRoleName: "Role B"
      DefaultRelationName: "MANAGED_SERVICE"
    bindings:
      RelationName: "null"
      Source: "Organization:Domain"
      Target: "Organization:OwningDomain:Domain"
  - id: "Decision1"
    type: "decision"
    condition: "Organization:TypeCode"
  - id: "Decision2"
    type: "decision"
    condition: "AdminUser"
  - id: "End1"
    type: "end"
    strict: true
  - id: "End3"
    type: "end"
    strict: true
  - id: "End7"
    type: "end"
    strict: true
  - id: "End9"
    type: "end"
    strict: true
  - id: "EndNode1"
    type: "end"
    strict: true
  - id: "EndNode2"
    type: "end"
    strict: true
  - id: "EndNode3"
    type: "end"
    strict: true
  - id: "EndNode4"
    type: "end"
    strict: true
  - id: "GetDomain2"
    type: "pipelet"
    ref: "GetDomain"
    bindings:
      StagingDomainName: "TAX_DomainName"
      StagingDomain: "TAX_Domain"
  - id: "GetUserGroupByID1"
    type: "pipelet"
    ref: "GetUserGroupByID"
    config:
      DefaultUserGroupID: "Everyone"
    bindings:
      Domain: "Organization:Domain"
      UserGroupID: "null"
      UserGroup: "OrganizationUserGroup"
  - id: "GetUserGroupByID2"
    type: "pipelet"
    ref: "GetUserGroupByID"
    config:
      DefaultUserGroupID: "SLD_AR_52_CATALOG_VIEWER"
    bindings:
      Domain: "Owner"
      UserGroupID: "ChannelUserGroupID"
      UserGroup: "ChannelUserGroup"
  - id: "Join1"
    type: "join"
  - id: "Join10"
    type: "join"
  - id: "Join12"
    type: "join"
  - id: "Join2"
    type: "join"
  - id: "Join5"
    type: "join"
  - id: "Join8"
    type: "join"
  - id: "JoinNode1"
    type: "join"
  - id: "JoinNode2"
    type: "join"
  - id: "JoinNode3"
    type: "join"
  - id: "JoinNode4"
    type: "join"
  - id: "JoinNode5"
    type: "join"
  - id: "Pipelet1"
    type: "pipelet"
    ref: "CreateConsumerGroup"
    config:
      Fix: true
    bindings:
      ConsumerGroupID: "\"IG_NewUsers\""
      Domain: "Organization:Domain"
      UserGroup: "null"
  - id: "Pipelet10"
    type: "pipelet"
    ref: "CreateConsumerGroup"
    config:
      Fix: true
    bindings:
      ConsumerGroupID: "\"IG_RegisteredUsers\""
      Domain: "Organization:Domain"
      UserGroup: "null"
  - id: "Pipelet13"
    type: "pipelet"
    ref: "CreateConsumerGroup"
    config:
      Fix: true
    bindings:
      ConsumerGroupID: "\"IG_UnregisteredUsers\""
      Domain: "Organization:Domain"
      UserGroup: "null"
  - id: "Pipelet5"
    type: "pipelet"
    ref: "CreateConsumerGroup"
    bindings:
      ConsumerGroupID: "null"
      Domain: "null"
      UserGroup: "OrganizationUserGroup"
  - id: "Pipelet6"
    type: "pipelet"
    ref: "CreateConsumerGroup"
    config:
      Fix: true
    bindings:
      ConsumerGroupID: "\"IG_RecurringUsers\""
      Domain: "Organization:Domain"
      UserGroup: "null"
  - id: "SetDictionaryValue1"
    type: "pipelet"
    ref: "SetDictionaryValue"
    config:
      Name: "Error_Channel"
      Value: "CouldNotCreateDomainRelation HANDLING_METHOD"
  - id: "SetDictionaryValue2"
    type: "pipelet"
    ref: "SetDictionaryValue"
    config:
      Name: "Error_Channel"
      Value: "CouldNotCreateDomainRelation MANAGED_SERVICE"
  - id: "SetDictionaryValue3"
    type: "pipelet"
    ref: "SetDictionaryValue"
    config:
      Name: "TAX_DomainName"
      Value: "Operations"
  - id: "SetDictionaryValue4"
    type: "pipelet"
    ref: "SetDictionaryValue"
    config:
      Name: "Error_Channel"
      Value: "CouldNotCreateDomainRelation TAX_CLASS"
  - id: "SetDictionaryValue5"
    type: "pipelet"
    ref: "SetDictionaryValue"
    config:
      Name: "Error_Channel"
      Value: "CouldNotCreateDomainRelation TAX_JURISDICTION"
  - id: "SetDictionaryValue6"
    type: "pipelet"
    ref: "SetDictionaryValue"
    config:
      Name: "Error_Channel"
      Value: "CouldNotCreateDomainRelation PAYMENT_METHOD"
  - id: "SetDictionaryValue7"
    type: "pipelet"
    ref: "SetDictionaryValue"
    config:
      Name: "Error_Channel"
      Value: "CouldNotCreateDomainRelation SHIPPING_METHOD"
  - id: "SetDomainPreference1"
    type: "pipelet"
    ref: "SetDomainPreference"
    config:
      DefaultPreferenceKey: "ShippingCosts"
      DefaultPreferenceValue: "Provided"
      Type: "String"
    bindings:
      PreferenceDomain: "Organization:Domain"
  - id: "SetDomainPreference2"
    type: "pipelet"
    ref: "SetDomainPreference"
    config:
      DefaultPreferenceKey: "BasketAddProductBehaviour"
      DefaultPreferenceValue: "MergeQuantities"
      Type: "String"
    bindings:
      PreferenceDomain: "Organization:Domain"
  - id: "SetDomainPreference3"
    type: "pipelet"
    ref: "SetDomainPreference"
    config:
      DefaultPreferenceKey: "PasswordValidators"
      DefaultPreferenceValue: "PasswordExpressionValidator"
      Type: "String"
    bindings:
      PreferenceDomain: "Organization:Domain"
      PreferenceDoubleValue: "null"
      PreferenceIntValue: "null"
      PreferenceKey: "null"
      PreferenceStringValue: "null"
      PreferenceValue: "null"
  - id: "TextNode1"
    type: "text"
  - id: "TextNode2"
    type: "text"
  - id: "TextNode3"
    type: "text"
  - id: "TextNode4"
    type: "text"
  - id: "TextNode5"
    type: "text"
  - id: "UpdateLocalizableAttributesByResources1"
    type: "pipelet"
    ref: "UpdateLocalizableAttributesByResources"
    bindings:
      Object: "OrganizationUserGroup:UserGroupInformation"
      ResourceBundleName: "\"resources.implicitgroups.Everyone\""
  - id: "UpdateLocalizableAttributesByResources2"
    type: "pipelet"
    ref: "UpdateLocalizableAttributesByResources"
    bindings:
      Object: "ConsumerGroup:UserGroup:UserGroupInformation"
      ResourceBundleName: "\"resources.implicitgroups.RegisteredUsers\""
  - id: "UpdateLocalizableAttributesByResources3"
    type: "pipelet"
    ref: "UpdateLocalizableAttributesByResources"
    bindings:
      Object: "ConsumerGroup:UserGroup:UserGroupInformation"
      ResourceBundleName: "\"resources.implicitgroups.UnregisteredUsers\""
  - id: "UpdateLocalizableAttributesByResources4"
    type: "pipelet"
    ref: "UpdateLocalizableAttributesByResources"
    bindings:
      Object: "ConsumerGroup:UserGroup:UserGroupInformation"
      ResourceBundleName: "\"resources.implicitgroups.NewUsers\""
  - id: "UpdateLocalizableAttributesByResources5"
    type: "pipelet"
    ref: "UpdateLocalizableAttributesByResources"
    bindings:
      Object: "ConsumerGroup:UserGroup:UserGroupInformation"
      ResourceBundleName: "\"resources.implicitgroups.RecurringUsers\""
  - id: "UpdateUserCredentials1"
    type: "pipelet"
    ref: "UpdateUserCredentials"
    bindings:
      IsActive: "\"false\""
      User: "AdminUser"

