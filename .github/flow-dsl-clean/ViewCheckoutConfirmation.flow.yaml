flow: "ViewCheckoutConfirmation"
kind: "view"

entries:
  - id: "StartNode1"
    name: "Start"
    mode: "private"
    strict: false
    inputs:
      []
  - id: "StartNode13"
    name: "FromRedirect"
    mode: "private"
    strict: false
    inputs:
      - key: "AuthorizationStatus"
        type: "java.lang.String"
        required: true
      - key: "Order"
        type: "com.intershop.beehive.bts.capi.orderprocess.fulfillment.Order"
        required: true
  - id: "StartNode2"
    name: "Failed"
    mode: "private"
    strict: false
    inputs:
      []
  - id: "StartNode3"
    name: "Cancel"
    mode: "private"
    strict: false
    inputs:
      []
  - id: "StartNode4"
    name: "RegisterAccount"
    mode: "private"
    strict: false
    inputs:
      []
  - id: "StartNode5"
    name: "Dispatch"
    mode: "private"
    strict: false
    inputs:
      []
  - id: "StartNode6"
    name: "ViewHook"
    mode: "private"
    strict: false
    inputs:
      []

