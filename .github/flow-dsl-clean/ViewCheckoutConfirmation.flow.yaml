    ref: "Prefix-Start"
  - id: "CallNode3"
    type: "call"
    ref: "ViewData-SecureForBrowserBack"
  - id: "CallNode4"
    type: "call"
    ref: "ProcessOrders-GetOrderBO"
  - id: "CallNode5"
    type: "call"
    ref: "ViewUserAccount-GetRegistrationSimpleForm"
    bindings:
      RegisterUserForm: "CredentialForm"
  - id: "CheckUserLoggedIn1"
    type: "pipelet"
    ref: "CheckUserLoggedIn"
  - id: "DecisionNode1"
    type: "decision"
    condition: "OrderBO"
  - id: "DecisionNode11"
    type: "decision"
    condition: "AuthorizationStatus"
  - id: "DecisionNode13"
    type: "decision"
