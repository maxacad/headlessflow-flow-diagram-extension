    type: "decision"
    condition: "Order:Status"
  - id: "DetermineOrderByID1"
    type: "pipelet"
    ref: "DetermineOrderByID"
    config:
      CurrentUserOnly: true
    bindings:
      OrderIDs: "null"
      OrderRefID: "null"
      OrderRefIDs: "null"
      Orders: "null"
  - id: "DispatchFormAction1"
    type: "pipelet"
    ref: "DispatchFormAction"
    config:
      OutValue_0: "ViewCheckoutConfirmation-RegisterAccount"
    bindings:
      Key_0: "register"
      SelectionKey: "JumpTarget"
  - id: "GetDomainPreference2"
    type: "pipelet"
    ref: "GetDomainPreference"
    config:
      DefaultPreferenceKey: "TaxationPolicy"
      Type: "Integer"
    bindings:
      PreferenceDomain: "CurrentOrganization:OwningDomain"
      PreferenceIntValue: "TaxationPolicy"
  - id: "GetDomainPreference3"
    type: "pipelet"
    ref: "GetDomainPreference"
    config:
      DefaultPreferenceKey: "BasketEmailOptIn"
      Type: "String"
    bindings:
      PreferenceDomain: "CurrentOrganization:OrganizationDomain"
      PreferenceStringValue: "BasketEmailOptIn"
  - id: "GetUserByLogin1"
    type: "pipelet"
    ref: "GetUserByLogin"
    bindings:
      Login: "OrderBO:NotificationEMail"
      Domain: "CurrentOrganization:OrganizationDomain"
