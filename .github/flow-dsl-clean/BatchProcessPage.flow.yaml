  - from: "Pipelet8"
    via: "next"
    to: "SetDictionaryValue4"
    into: "in"
  - from: "SetDictionaryValue4"
    via: "next"
    to: "CallNode2"
    into: "in"
  - from: "CloseJDBCConnection1"
    via: "next"
