    to: "GetDomainByUUID1"
    into: "in"
  - from: "ExecuteBatchProcessor1"
    via: "next"
    to: "DecisionNode2"
    into: "in"
  - from: "GetDomainByUUID2"
    via: "error"
    to: "JoinNode2"
    into: "in1"
  - from: "JoinNode2"
    via: "next"
    to: "JoinNode1"
