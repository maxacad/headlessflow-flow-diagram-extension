  - id: "GetAuction1"
    type: "pipelet"
    ref: "GetAuction"
  - id: "GetAuction2"
    type: "pipelet"
    ref: "GetAuction"
    bindings:
      Auction: "Parent"
      AuctionUUID: "ParentID"
  - id: "InteractionEnd1"
    type: "interaction"
  - id: "Join1"
    type: "join"
  - id: "Join2"
    type: "join"
  - id: "Join4"
    type: "join"
  - id: "Jump1"
    type: "jump"
    ref: "ViewAuctions_52-DispatchList"
  - id: "KeyMapper1"
    type: "pipelet"
    ref: "KeyMapper"
    bindings:
      InValue_1: "Auction:ParentID"
      OutValue_1: "ParentID"
  - id: "PrepareApplicationView1"
    type: "pipelet"
    ref: "PrepareApplicationView"
    config:
      SelectedMenuItem: "AuctionManagement"
      WorkingTemplate: "auction/AuctionViewRecurrence_52"

links:
  - from: "Start1"
    via: "next"
    to: "Call1"
    into: "in"
  - from: "DeterminePageable1"
    via: "error"
    to: "Join2"
    into: "in3"
  - from: "GetAuction1"
    via: "error"
    to: "Jump1"
    into: "in"
  - from: "GetAuction1"
    via: "next"
    to: "KeyMapper1"
    into: "in"
  - from: "CheckForEmptyString1"
