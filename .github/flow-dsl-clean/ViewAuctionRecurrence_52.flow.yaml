  - id: "Call2"
    type: "call"
    ref: "ViewAuctionRecurrence_52-Prefix"
  - id: "CheckForEmptyString1"
    type: "pipelet"
    ref: "CheckForEmptyString"
    bindings:
      FilledString: "ParentID"
  - id: "CreatePageableFromIterator1"
    type: "pipelet"
    ref: "CreatePageableFromIterator"
    config:
      Pagesize: 10
    bindings:
      Iterator: "Auction:ChildAuctions"
      Pageable: "ChildAuctions"
  - id: "DeterminePageable1"
    type: "pipelet"
    ref: "DeterminePageable"
