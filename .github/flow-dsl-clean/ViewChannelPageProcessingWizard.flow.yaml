flow: "ViewChannelPageProcessingWizard"
kind: "view"

entries:
  - id: "Start1"
    name: "SelectAction"
    mode: "private"
    strict: false
    inputs:
      []
  - id: "Start3"
    name: "SelectNextStep"
    mode: "private"
    strict: false
    inputs:
      []
  - id: "Start9"
    name: "Dispatch"
    mode: "private"
    strict: false
    inputs:
      []
  - id: "StartNode1"
    name: "Finish"
    mode: "public"
    strict: false
    inputs:
      []

steps:
  - id: "CallNode1"
    type: "call"
  - id: "CheckForEmptyString1"
    type: "pipelet"
    ref: "CheckForEmptyString"
    bindings:
      FilledString: "ActionID"
  - id: "ConcatenateStrings1"
    type: "pipelet"
    ref: "ConcatenateStrings"
    bindings:
      String0: "\"ViewProcessList_\""
      String2: "\"-CreateProcess\""
      String1: "CurrentChannel:TypeCode"
      Concatenated: "ProcessListPipeline"
  - id: "ConcatenateStrings2"
    type: "pipelet"
    ref: "ConcatenateStrings"
    bindings:
      String0: "\"ViewProcessList_\""
      String2: "\"-ListAll\""
      String1: "CurrentChannel:TypeCode"
      Concatenated: "ProcessListAllPipeline"
  - id: "Decision1"
    type: "decision"
    condition: "ActionID"
  - id: "DispatchFormAction1"
    type: "pipelet"
    ref: "DispatchFormAction"
    config:
      OutValue_0: "ViewChannelPageProcessingWizard-SelectNextStep"
      OutValue_1: "ViewChannelPageProcessingWizard-Finish"
      OutValue_2: "ViewChannelPages-Paging"
      OutValue_3: "ViewChannelPageProcessingWizard-SelectAction"
    bindings:
      SelectionKey: "JumpTarget"
      Key_0: "selectNextStep"
      Key_1: "finish"
      Key_2: "cancel"
      Key_3: "selectAction"
  - id: "GetLocale1"
    type: "pipelet"
    ref: "GetLocale"
    config:
      LocaleFallback: "Session Locale"
    bindings:
      LocaleId: "null"
  - id: "InteractionEnd1"
    type: "interaction"
  - id: "InteractionEnd3"
    type: "interaction"
  - id: "Jump10"
    type: "jump"
    ref: "SecureJump-Start"
  - id: "JumpNode1"
    type: "jump"
    ref: "This:SelectAction"
  - id: "JumpNode2"
    type: "jump"
    ref: "This:SelectAction"
  - id: "JumpNode4"
    type: "jump"
  - id: "KeyMapper2"
    type: "pipelet"
    ref: "KeyMapper"
    config:
      ValueType: "Form Value"
    bindings:
      OutValue_1: "ProcessPipeline"
      InValue_1: "\"BatchProcessPage-Process\""
      OutValue_2: "InitPipeline"
      InValue_2: "\"BatchProcessPage-Init\""
      InValue_3: "\"CatalogSetPageType\""
      OutValue_3: "JobName"
      InValue_4: "\"BatchProcessPage-Finish\""
      OutValue_4: "PostPipeline"
      InValue_5: "\"Catalog\""
      OutValue_5: "JobNamePrefix"
  - id: "LoadPageletDefinitions2"
    type: "pipelet"
    ref: "LoadPageletDefinitions"
    config:
      DefaultType: "Page"
    bindings:
      Site: "CurrentChannel:Domain:Site"
  - id: "PrepareApplicationView1"
    type: "pipelet"
    ref: "PrepareApplicationView"
    config:
      SelectedMenuItem: "ChannelStorefront"
      WorkingTemplate: "content/ChannelPageProcessingSelectAction"
  - id: "PrepareApplicationView3"
    type: "pipelet"
    ref: "PrepareApplicationView"
    config:
      SelectedMenuItem: "ChannelStorefront"
      WorkingTemplate: "content/ChannelPageProcessingSelectPageType"
  - id: "SetDictionaryValue1"
    type: "pipelet"
    ref: "SetDictionaryValue"
    config:
      Name: "ERROR_ACTION_NOT_SELECTED"
      Value: true
      ValueType: "Dictionary Value"

links:
  - from: "Decision1"
    via: "yes"
    to: "GetLocale1"
    into: "in"
  - from: "CheckForEmptyString1"
    via: "error"
    to: "SetDictionaryValue1"
    into: "in"
  - from: "LoadPageletDefinitions2"
    via: "next"
    to: "PrepareApplicationView3"
    into: "in"
  - from: "SetDictionaryValue1"
    via: "next"
    to: "JumpNode1"
    into: "in"
  - from: "Start3"
    via: "next"
    to: "CheckForEmptyString1"
    into: "in"
  - from: "ConcatenateStrings1"
    via: "next"
    to: "ConcatenateStrings2"
    into: "in"
  - from: "Decision1"
    via: "no"
    to: "JumpNode2"
    into: "in"
  - from: "ConcatenateStrings2"
    via: "next"
    to: "CallNode1"
    into: "in"
  - from: "StartNode1"
    via: "next"
    to: "KeyMapper2"
    into: "in"
  - from: "CallNode1"
    via: "next"
    to: "JumpNode4"
    into: "in"
  - from: "PrepareApplicationView1"
    via: "next"
    to: "InteractionEnd1"
    into: "in"
  - from: "GetLocale1"
    via: "next"
    to: "LoadPageletDefinitions2"
    into: "in"
  - from: "Start9"
    via: "next"
    to: "DispatchFormAction1"
    into: "in"
  - from: "DispatchFormAction1"
    via: "next"
    to: "Jump10"
    into: "in"
  - from: "Start1"
    via: "next"
    to: "PrepareApplicationView1"
    into: "in"
  - from: "KeyMapper2"
    via: "next"
    to: "ConcatenateStrings1"
    into: "in"
  - from: "PrepareApplicationView3"
    via: "next"
    to: "InteractionEnd3"
    into: "in"
  - from: "CheckForEmptyString1"
    via: "next"
    to: "Decision1"
    into: "in"
