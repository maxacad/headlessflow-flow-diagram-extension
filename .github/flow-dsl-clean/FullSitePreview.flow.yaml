flow: "FullSitePreview"
kind: "view"

entries:
  - id: "StartNode1"
    name: "SecuredStart"
    mode: "private"
    strict: false
    inputs:
      []
  - id: "StartNode17"
    name: "GetTargetApplicationBO"
    mode: "private"
    strict: false
    inputs:
      - key: "ApplicationBO"
        type: "com.intershop.component.application.capi.ApplicationBO"
        required: true
      - key: "Repository"
        type: "com.intershop.component.mvc.capi.catalog.Repository"
        required: true
      - key: "CurrentUser"
        type: "com.intershop.beehive.core.capi.user.User"
        required: true
  - id: "StartNode2"
    name: "Render"
    mode: "private"
    strict: false
    inputs:
      []
  - id: "StartNode4"
    name: "Prefix"
    mode: "private"
    strict: true
    inputs:
      - key: "LocaleId"
        type: "java.lang.String"
        required: false
      - key: "TargetSiteUUID"
        type: "java.lang.String"
        required: true

steps:
  - id: "CallNode1"
    type: "call"
    ref: "FullSitePreview-Prefix"
  - id: "CallNode2"
    type: "call"
    ref: "FullSitePreview-GetTargetApplicationBO"
  - id: "CallNode3"
    type: "call"
    ref: "ProcessPreviewContext-Get"
    bindings:
      ApplicationBO: "TargetApplicationBO"
  - id: "CallNode4"
    type: "call"
    ref: "ProcessFullSitePreviewContextBO-Create"
    bindings:
      ApplicationBO: "TargetApplicationBO"
  - id: "CallNode5"
    type: "call"
    ref: "ProcessFullSitePreviewContextBO-Get"
  - id: "CreateApplicationPreviewContext1"
    type: "pipelet"
    ref: "CreateApplicationPreviewContext"
    bindings:
      PreviewContextBO: "FullSitePreviewContextBO"
      ApplicationPreviewContextBO: "PreviewContextBO"
  - id: "DecisionNode1"
    type: "decision"
    condition: "CurrentChannel"
  - id: "DecisionNode2"
    type: "decision"
    condition: "Repository"
  - id: "DecryptString1"
    type: "pipelet"
    ref: "DecryptString"
    bindings:
      Value: "EncryptedFullSitePreviewContextBOID"
      DecryptedValue: "FullSitePreviewContextBOID"
  - id: "EncryptString1"
    type: "pipelet"
    ref: "EncryptString"
    bindings:
      Value: "FullSitePreviewContextBO:ID"
      EncryptedValue: "EncryptedFullSitePreviewContextBOID"
  - id: "EndNode11"
    type: "end"
    strict: false
    outputs:
      - key: "TargetApplicationBO"
        type: "com.intershop.component.application.capi.ApplicationBO"
        guaranteed: true
  - id: "EndNode3"
    type: "end"
    strict: true
    outputs:
      - key: "Locale"
        type: "com.intershop.beehive.core.capi.localization.LocaleInformation"
        guaranteed: true
      - key: "TargetSite"
        type: "com.intershop.beehive.core.capi.domain.Domain"
        guaranteed: true
  - id: "EndNode4"
    type: "end"
    strict: false
  - id: "GetDomainByUUID1"
    type: "pipelet"
    ref: "GetDomainByUUID"
    bindings:
      DomainUUID: "TargetSiteUUID"
      Domain: "TargetSite"
  - id: "GetLocale1"
    type: "pipelet"
    ref: "GetLocale"
    config:
      LocaleFallback: "Session Locale"
  - id: "GetPreferredPreviewApplicationBO1"
    type: "pipelet"
    ref: "GetPreferredPreviewApplicationBO"
    bindings:
      User: "CurrentUser"
      ApplicationBORepository: "ApplicationBO:getRepository(\"ApplicationBORepository\",Repository:RepositoryDomain:Site:UUID)"
      ApplicationBO: "TargetApplicationBO"
  - id: "GetRepositoryByUUID1"
    type: "pipelet"
    ref: "GetRepositoryByUUID"
    bindings:
      UUID: "ContentRepositoryUUID"
  - id: "InteractionNode0"
    type: "interaction"
  - id: "InteractionNode1"
    type: "interaction"
  - id: "InteractionNode2"
    type: "interaction"
  - id: "JoinNode1"
    type: "join"
  - id: "JoinNode2"
    type: "join"
  - id: "JoinNode3"
    type: "join"
  - id: "KeyMapper1"
    type: "pipelet"
    ref: "KeyMapper"
    bindings:
      InValue_1: "CurrentChannel"
      OutValue_1: "Repository"

links:
  - from: "CallNode1"
    via: "next"
    to: "DecisionNode1"
    into: "in"
  - from: "CallNode2"
    via: "next"
    to: "CallNode3"
    into: "in"
  - from: "CallNode3"
    via: "next"
    to: "CallNode4"
    into: "in"
  - from: "CallNode4"
    via: "next"
    to: "EncryptString1"
    into: "in"
  - from: "CallNode5"
    via: "ERROR"
    to: "InteractionNode0"
    into: "in"
  - from: "CallNode5"
    via: "next"
    to: "CreateApplicationPreviewContext1"
    into: "in"
  - from: "CreateApplicationPreviewContext1"
    via: "next"
    to: "InteractionNode2"
    into: "in"
  - from: "DecisionNode1"
    via: "no"
    to: "DecisionNode2"
    into: "in"
  - from: "DecisionNode1"
    via: "yes"
    to: "KeyMapper1"
    into: "in"
  - from: "DecisionNode2"
    via: "no"
    to: "GetRepositoryByUUID1"
    into: "in"
  - from: "DecisionNode2"
    via: "yes"
    to: "JoinNode2"
    into: "in1"
  - from: "DecryptString1"
    via: "next"
    to: "CallNode5"
    into: "in"
  - from: "EncryptString1"
    via: "next"
    to: "InteractionNode1"
    into: "in"
  - from: "GetDomainByUUID1"
    via: "error"
    to: "JoinNode3"
    into: "in1"
  - from: "GetDomainByUUID1"
    via: "next"
    to: "JoinNode3"
    into: "in1"
  - from: "GetLocale1"
    via: "next"
    to: "EndNode3"
    into: "in"
  - from: "GetPreferredPreviewApplicationBO1"
    via: "error"
    to: "EndNode4"
    into: "in"
  - from: "GetPreferredPreviewApplicationBO1"
    via: "next"
    to: "EndNode11"
    into: "in"
  - from: "GetRepositoryByUUID1"
    via: "next"
    to: "JoinNode2"
    into: "in1"
  - from: "JoinNode1"
    via: "next"
    to: "CallNode2"
    into: "in"
  - from: "JoinNode2"
    via: "next"
    to: "JoinNode1"
    into: "in1"
  - from: "JoinNode3"
    via: "next"
    to: "GetLocale1"
    into: "in"
  - from: "KeyMapper1"
    via: "next"
    to: "JoinNode1"
    into: "in1"
  - from: "StartNode17"
    via: "next"
    to: "GetPreferredPreviewApplicationBO1"
    into: "in"
  - from: "StartNode1"
    via: "next"
    to: "CallNode1"
    into: "in"
  - from: "StartNode2"
    via: "next"
    to: "DecryptString1"
    into: "in"
  - from: "StartNode4"
    via: "next"
    to: "GetDomainByUUID1"
    into: "in"
