    ref: "ProcessGlobalRequisitionTemplate-GetRTUserOfOrg"
  - id: "CreateProductList1"
    type: "pipelet"
    ref: "CreateProductList"
    config:
      DefaultTypeCode: 3
    bindings:
      Domain: "OrganizationDomain"
      ProductList: "ReqTemplate"
      Scope: "GlobalRTUserOfOrganization:Profile"
  - id: "CreateProductListItem1"
    type: "pipelet"
    ref: "CreateProductListItem"
    bindings:
      ProductList: "ReqTemplate"
  - id: "DecisionNode1"
    type: "decision"
    condition: "ProductDomain"
  - id: "DecisionNode2"
    type: "decision"
    condition: "CurrentProductRepository"
  - id: "DetermineUser1"
    type: "pipelet"
    ref: "DetermineUser"
    bindings:
      User: "GlobalRTUserOfOrganization"
      UserID: "Organization:Profile:ProfileID"
  - id: "End2"
    type: "end"
    strict: false
  - id: "End3"
    type: "end"
    strict: false
  - id: "End5"
    type: "end"
    strict: false
  - id: "End6"
    type: "end"
    strict: false
  - id: "End7"
    type: "end"
    strict: false
  - id: "End8"
    type: "end"
    strict: false
  - id: "GetFormRecord1"
    type: "pipelet"
    ref: "GetFormRecord"
    bindings:
      RecordID: "ProductListItemUUID"
  - id: "GetFormSelection1"
    type: "pipelet"
    ref: "GetFormSelection"
    config:
      DefaultParameterName: "ProductUUIDs"
    bindings:
      Selection: "SelectedUUIDs"
  - id: "GetFormSelection3"
    type: "pipelet"
    ref: "GetFormSelection"
    config:
      DefaultParameterName: "ProductListItemUUIDs"
  - id: "GetLocale1"
    type: "pipelet"
    ref: "GetLocale"
    config:
      LocaleFallback: "Lead Locale"
  - id: "GetLocale2"
    type: "pipelet"
    ref: "GetLocale"
    config:
      LocaleFallback: "Lead Locale"
  - id: "GetLocale3"
    type: "pipelet"
    ref: "GetLocale"
    config:
      LocaleFallback: "Lead Locale"
  - id: "GetLocale4"
    type: "pipelet"
