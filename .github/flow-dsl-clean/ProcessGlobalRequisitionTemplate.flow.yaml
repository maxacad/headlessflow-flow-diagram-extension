    type: "join"
  - id: "Join3"
    type: "join"
  - id: "Join5"
    type: "join"
  - id: "JoinNode1"
    type: "join"
  - id: "JoinNode2"
    type: "join"
  - id: "KeyMapper1"
    type: "pipelet"
    ref: "KeyMapper"
    bindings:
      InValue_1: "ProductListItem:Quantity"
      OutValue_1: "QuantityValue"
  - id: "Loop1"
    type: "loop"
  - id: "LoopNode1"
    type: "loop"
  - id: "RemoveProductList1"
    type: "pipelet"
    ref: "RemoveProductList"
  - id: "UpdateProductList1"
    type: "pipelet"
    ref: "UpdateProductList"
    bindings:
