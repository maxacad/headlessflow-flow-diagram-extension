flow: "ProcessGlobalRequisitionTemplate"
kind: "process"

entries:
  - id: "Start2"
    name: "Remove"
    mode: "private"
    strict: false
    inputs:
      - key: "ProductListID"
        type: "java.lang.String"
        required: false
  - id: "Start3"
    name: "AddProducts"
    mode: "private"
    strict: false
    inputs:
      []
  - id: "Start4"
    name: "Update"
    mode: "private"
    strict: false
    inputs:
      []
  - id: "Start6"
    name: "GetRTUserOfOrg"
    mode: "private"
    strict: false
    inputs:
      []
  - id: "Start7"
    name: "New"
    mode: "private"
    strict: false
    inputs:
      []
  - id: "Start8"
    name: "UpdateQuantity"
    mode: "private"
    strict: false
    inputs:
      []

