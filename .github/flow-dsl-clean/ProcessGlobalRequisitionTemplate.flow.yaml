      ProductList: "ReqTemplate"
      ShortDescription: "ReqTemplateForm_Description"
  - id: "UpdateProductList2"
    type: "pipelet"
    ref: "UpdateProductList"
    bindings:
      DisplayName: "ReqTemplateForm_Name"
      IsPublic: "NULL"
      ProductList: "ReqTemplate"
      ShortDescription: "ReqTemplateForm_Description"
      TypeCode: "NULL"
  - id: "UpdateProductListItem1"
    type: "pipelet"
    ref: "UpdateProductListItem"
    bindings:
      Description: "Product:ShortDescription"
      DisplayName: "Product:Name"
      Quantity: "Product:MinOrderQuantity"
  - id: "UpdateProductListItem2"
    type: "pipelet"
    ref: "UpdateProductListItem"
    bindings:
      Quantity: "QuantityValue"
      ProductLineItem: "ProductListItem:ProductLineItem"
  - id: "VerifyQuantity1"
    type: "pipelet"
    ref: "VerifyQuantity"
    bindings:
      LocalizedString: "FormRecord:QUANTITY"

