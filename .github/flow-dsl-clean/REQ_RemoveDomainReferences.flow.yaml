flow: "REQ_RemoveDomainReferences"
kind: "process"

entries:
  - id: "Start1"
    name: "Start"
    mode: "private"
    strict: false
    inputs:
      []

steps:
  - id: "EndNode1"
    type: "end"
    strict: false
  - id: "EndNode2"
    type: "end"
    strict: false
  - id: "ExecuteStoredProcedure5"
    type: "pipelet"
    ref: "ExecuteStoredProcedure"
    config:
      AllowNullParameter: false
      ParameterDefinition: "ToBeRemovedDomainID=string"
      StoredProcedure: "sp_deleteReqAWFByDomain"
  - id: "JoinNode1"
    type: "join"
  - id: "JoinNode4"
    type: "join"
  - id: "Pipelet1"
    type: "pipelet"
    ref: "ExecuteStoredProcedure"
    config:
      AllowNullParameter: false
      ParameterDefinition: "ToBeRemovedDomainID=string"
      StoredProcedure: "sp_deleteDeliveryNoteByDomain"
  - id: "Pipelet4"
    type: "pipelet"
    ref: "ExecuteStoredProcedure"
    config:
      AllowNullParameter: false
      ParameterDefinition: "ToBeRemovedDomainID=string"
      StoredProcedure: "sp_deleteRecurringReqByDomain"
  - id: "Text1"
    type: "text"

links:
  - from: "Pipelet4"
    via: "error"
    to: "JoinNode4"
    into: "in2"
  - from: "Pipelet4"
    via: "next"
    to: "EndNode1"
    into: "in"
  - from: "JoinNode4"
    via: "next"
    to: "EndNode2"
    into: "in"
  - from: "ExecuteStoredProcedure5"
    via: "next"
    to: "Pipelet1"
    into: "in"
  - from: "Start1"
    via: "next"
    to: "ExecuteStoredProcedure5"
    into: "in"
  - from: "Pipelet1"
    via: "next"
    to: "Pipelet4"
    into: "in"
  - from: "JoinNode1"
    via: "next"
    to: "JoinNode4"
    into: "in1"
  - from: "Pipelet1"
    via: "error"
    to: "JoinNode1"
    into: "in2"
  - from: "ExecuteStoredProcedure5"
    via: "error"
    to: "JoinNode1"
    into: "in1"
