flow: "ProcessPromotionBudget"
kind: "process"

entries:
  - id: "StartNode1"
    name: "OnCreateOrder"
    mode: "private"
    strict: true
    inputs:
      - key: "Organization"
        type: "com.intershop.component.organization.capi.Organization"
        required: true
      - key: "ApplicationBO"
        type: "com.intershop.component.application.capi.ApplicationBO"
        required: true
      - key: "OrderBO"
        type: "com.intershop.component.order.capi.OrderBO"
        required: true
  - id: "StartNode2"
    name: "CreateAccountTransaction"
    mode: "private"
    strict: true
    inputs:
      - key: "OrderBO"
        type: "com.intershop.component.order.capi.OrderBO"
        required: true
      - key: "AppliedRebateBO"
        type: "com.intershop.component.promotion.capi.AppliedRebateBO"
        required: true
      - key: "TransactionMode"
        type: "java.lang.String"
        required: false
      - key: "Domain"
        type: "com.intershop.beehive.core.capi.domain.Domain"
        required: true
  - id: "StartNode3"
    name: "OnCancelOrder"
    mode: "private"
    strict: true
    inputs:
      - key: "Organization"
        type: "com.intershop.component.organization.capi.Organization"
        required: true
      - key: "ApplicationBO"
        type: "com.intershop.component.application.capi.ApplicationBO"
        required: true
      - key: "OrderBO"
        type: "com.intershop.component.order.capi.OrderBO"
        required: true
  - id: "StartNode4"
    name: "SendBudgetNotificationMail"
    mode: "private"
    strict: true
    inputs:
      - key: "AppliedRebateBO"
        type: "com.intershop.component.promotion.capi.AppliedRebateBO"
        required: true
      - key: "Organization"
        type: "com.intershop.component.organization.capi.Organization"
        required: true
      - key: "OrderBO"
        type: "com.intershop.component.order.capi.OrderBO"
        required: true
      - key: "ApplicationBO"
        type: "com.intershop.component.application.capi.ApplicationBO"
        required: true

steps:
  - id: "AddMultipleEntriesToMap2"
    type: "pipelet"
    ref: "AddMultipleEntriesToMap"
    config:
      Mode: "OverwriteValue"
    bindings:
      Key1: "\"{{PROMOTION}}\""
      Key2: "\"{{BUDGET}}\""
      Key3: "\"{{THRESHOLD}}\""
      Value1: "AppliedRebateBO:Rebate:Promotion:DisplayName"
      Value2: "AppliedRebateBO:Rebate:Promotion:BudgetAmount"
      Value3: "AppliedRebateBO:Rebate:Promotion:BudgetNotificationThreshold"
      OutMap: "Placeholders"
  - id: "CallNode3"
    type: "call"
    ref: "This:CreateAccountTransaction"
    bindings:
      Domain: "Organization:OwningDomain"
      AppliedRebateBO: "AppliedRebateBO"
  - id: "CallNode4"
    type: "call"
    ref: "This:SendBudgetNotificationMail"
  - id: "CheckForEmptyString1"
    type: "pipelet"
    ref: "CheckForEmptyString"
    bindings:
      FilledString: "MailTemplate"
  - id: "CheckForEmptyString2"
    type: "pipelet"
    ref: "CheckForEmptyString"
    bindings:
      FilledString: "MailTemplate"
  - id: "CheckForEmptyString5"
    type: "pipelet"
    ref: "CheckForEmptyString"
    bindings:
      FilledString: "RawMailSubject:DomainValue"
  - id: "CheckForEmptyString6"
    type: "pipelet"
    ref: "CheckForEmptyString"
    bindings:
      FilledString: "RawMailSubject:DomainValue"
  - id: "CheckForEmptyString8"
    type: "pipelet"
    ref: "CheckForEmptyString"
    bindings:
      FilledString: "AppliedRebateBO:Rebate:Promotion:BudgetNotificationEmail"
  - id: "CheckPromotionBudgetNotificationRequired1"
    type: "pipelet"
    ref: "CheckPromotionBudgetNotificationRequired"
    bindings:
      PromotionBO: "AppliedRebateBO"
  - id: "CheckPromotionBudgetNotificationRequired2"
    type: "pipelet"
    ref: "CheckPromotionBudgetNotificationRequired"
    config:
      Scope: "BudgetPercentage"
    bindings:
      PromotionBO: "AppliedRebateBO"
  - id: "CheckPromotionBudgetNotificationRequired3"
    type: "pipelet"
    ref: "CheckPromotionBudgetNotificationRequired"
    config:
      Scope: "BudgetExhausted"
    bindings:
      PromotionBO: "AppliedRebateBO"
  - id: "CreateAccountTransaction1"
    type: "pipelet"
    ref: "CreateAccountTransaction"
    bindings:
      Owner: "Domain"
      TypeCode: "TransactionTypeCode"
  - id: "DecisionNode1"
    type: "decision"
    condition: "TransactionMode"
  - id: "DecisionNode2"
    type: "decision"
    condition: "AppliedRebateBO:Rebate:Promotion:Budget"
  - id: "DisablePromotionByBudgetEvent1"
    type: "pipelet"
    ref: "DisablePromotionByBudgetEvent"
    config:
      BudgetEvent: "BudgetReached"
    bindings:
      PromotionBO: "AppliedRebateBO:Rebate:Promotion"
  - id: "End21"
    type: "end"
    strict: true
  - id: "EndNode1"
    type: "end"
    strict: true
  - id: "EndNode2"
    type: "end"
    strict: true
  - id: "EndNode3"
    type: "end"
    strict: true
  - id: "EndNode4"
    type: "end"
    strict: true
  - id: "FormatString1"
    type: "pipelet"
    ref: "FormatString"
    bindings:
      InputString: "RawMailSubject:DomainValue"
      OutputString: "MailSubject"
  - id: "FormatString3"
    type: "pipelet"
    ref: "FormatString"
    bindings:
      InputString: "RawMailSubject:DomainValue"
      OutputString: "MailSubject"
  - id: "GetDomainPreference1"
    type: "pipelet"
    ref: "GetDomainPreference"
    config:
      DefaultPreferenceKey: "TaxationPolicy"
      Type: "Integer"
    bindings:
      PreferenceDomain: "Organization:OwningDomain"
      PreferenceIntValue: "TaxationPolicy"
  - id: "GetDomainPreference2"
    type: "pipelet"
    ref: "GetDomainPreference"
    config:
      DefaultPreferenceKey: "BudgetNotificationEmailTemplatePercentage"
      Type: "String"
    bindings:
      PreferenceStringValue: "MailTemplate"
      PreferenceDomain: "Organization:OwningDomain"
      PreferenceKey: "null"
  - id: "GetDomainPreference3"
    type: "pipelet"
    ref: "GetDomainPreference"
    config:
      DefaultPreferenceKey: "BudgetNotificationEmailTemplateExhausted"
      Type: "String"
    bindings:
      PreferenceStringValue: "MailTemplate"
      PreferenceDomain: "Organization:OwningDomain"
      PreferenceKey: "null"
  - id: "GetDomainPreference4"
    type: "pipelet"
    ref: "GetDomainPreference"
    config:
      DefaultPreferenceKey: "BudgetNotificationEmailFrom"
      Type: "String"
    bindings:
      PreferenceStringValue: "MailFrom"
      PreferenceDomain: "Organization:OwningDomain"
      PreferenceKey: "null"
  - id: "GetFirstElementOfIterator1"
    type: "pipelet"
