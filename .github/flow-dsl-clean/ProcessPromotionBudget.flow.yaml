      UseErrorConnector: true
    bindings:
      MailTo: "AppliedRebateBO:Rebate:Promotion:BudgetNotificationEmail"
      Domain: "Organization:OwningDomain"
      LocaleID: "Locale:LocaleID"
      MailSubject: "MailSubject"
  - id: "SetDictionaryValue1"
    type: "pipelet"
    ref: "SetDictionaryValue"
    config:
      Name: "TransactionMode"
      Value: "credit"
      ValueType: "Dictionary Value"
  - id: "SetDictionaryValue2"
    type: "pipelet"
    ref: "SetDictionaryValue"
    config:
      Name: "TransactionMode"
      Value: "debit"
      ValueType: "Dictionary Value"
  - id: "UpdateAccountTransaction1"
    type: "pipelet"
    ref: "UpdateAccountTransaction"
    config:
      AmountUpdatePolicy: "AlwaysNegative"
    bindings:
      Amount: "AppliedRebateBO:Amount"
      AmountCurrency: "null"
      AmountValue: "null"
      TimeStamp: "null"
  - id: "UpdateAccountTransaction4"
    type: "pipelet"
    ref: "UpdateAccountTransaction"
    config:
      AmountUpdatePolicy: "AlwaysPositive"
    bindings:
      Amount: "AppliedRebateBO:Amount"
      AmountCurrency: "null"
      TimeStamp: "null"
      AmountValue: "null"
  - id: "UpdateCustomAttributes4"
    type: "pipelet"
    ref: "UpdateCustomAttributes"
    config:
      Attribute_1_Name: "OrderUUID"
      Attribute_1_Type: "String"
      Attribute_2_Name: "PromotionUUID"
      Attribute_2_Type: "String"
    bindings:
      Attribute_1_Value: "OrderBO:ID"
      ExtensibleObject: "AccountTransaction"
      Attribute_2_Value: "AppliedRebateBO:Rebate:Promotion:Extension(\"PersistentObjectBOExtension\"):PersistentObject:UUID"

