    bindings:
      Application: "ApplicationBO:Extension(\"PersistentObjectBOExtension\"):PersistentObject"
      LocaleInformation: "Locale"
  - id: "Pipelet2"
    type: "pipelet"
    ref: "DetermineLocalizedTextByLocale"
    bindings:
      SearchedKey: "\"promotion.budget.threshold.email.subject\""
      LocalizationTexts: "MailSubjects"
  - id: "Pipelet3"
    type: "pipelet"
    ref: "DetermineLocalizedTextByLocale"
    bindings:
      SearchedKey: "\"promotion.budget.exhausted.email.subject\""
      LocalizationTexts: "MailSubjects"
  - id: "Pipelet34"
    type: "pipelet"
    ref: "BindAccountTransaction"
    bindings:
      Account: "AppliedRebateBO:Rebate:Promotion:Budget:Account"
  - id: "Pipelet4"
    type: "pipelet"
    ref: "CreateLocalizationContextFromApplication"
    bindings:
      Application: "ApplicationBO:Extension(\"PersistentObjectBOExtension\"):PersistentObject"
      LocaleInformation: "Locale"
  - id: "ProcessMail1"
    type: "pipelet"
    ref: "ProcessMail"
    config:
      WaitForResult: true
      UseErrorConnector: true
    bindings:
      MailTo: "AppliedRebateBO:Rebate:Promotion:BudgetNotificationEmail"
      Domain: "Organization:OwningDomain"
      LocaleID: "Locale:LocaleID"
      MailSubject: "MailSubject"
  - id: "ProcessMail2"
    type: "pipelet"
