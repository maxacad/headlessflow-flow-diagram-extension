  - id: "Start1"
    name: "ValidateFile"
    mode: "private"
    strict: false
    inputs:
      []
  - id: "Start12"
    name: "Import"
    mode: "private"
    strict: false
    inputs:
      []
  - id: "Start2"
    name: "ValidateFileRefresh"
    mode: "private"
    strict: false
    inputs:
      []
  - id: "Start4"
    name: "CreateCatalog"
    mode: "private"
    strict: false
    inputs:
      []
  - id: "Start5"
    name: "SelectCatalog"
    mode: "private"
    strict: false
    inputs:
      []
  - id: "StartNode1"
    name: "Dispatch"
    mode: "private"
    strict: false
