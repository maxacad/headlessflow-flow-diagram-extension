flow: "ViewPagelet_comp_endcaps"
kind: "view"

entries:
  - id: "StartNode1"
    name: "Simple"
    mode: "private"
    strict: false
    inputs:
      - key: "CategoryBO"
        type: "com.intershop.component.catalog.capi.CatalogCategoryBO"
        required: false
      - key: "SearchTerm"
        type: "java.lang.String"
        required: false
  - id: "StartNode2"
    name: "RenderEndcapView"
    mode: "private"
    strict: false
    inputs:
      - key: "CurrentDomain"
        type: "com.intershop.beehive.core.capi.domain.Domain"
        required: false
      - key: "CategoryBO"
        type: "com.intershop.component.catalog.capi.CatalogCategoryBO"
        required: false
      - key: "SearchTerm"
        type: "java.lang.String"
        required: false
  - id: "StartNode3"
    name: "GetProducts"
    mode: "private"
    strict: true
    inputs:
      - key: "ProductFilterName"
        type: "java.lang.String"
        required: true
      - key: "EndcapScope"
        type: "java.lang.String"
        required: true
      - key: "CategoryBO"
        type: "com.intershop.component.catalog.capi.CatalogCategoryBO"
        required: false
      - key: "SearchTerm"
        type: "java.lang.String"
        required: false
  - id: "StartNode4"
    name: "RenderViewAll"
    mode: "private"
    strict: true
    inputs:
      - key: "CategoryBO"
        type: "com.intershop.component.catalog.capi.CatalogCategoryBO"
        required: false
      - key: "PageSize"
        type: "java.lang.String"
        required: false
      - key: "PageNumber"
        type: "java.lang.String"
        required: false
      - key: "EndcapMasterPageletUUID"
        type: "java.lang.String"
        required: false
      - key: "CatalogCategoryID"
        type: "java.lang.String"
        required: false
      - key: "SearchTerm"
        type: "java.lang.String"
        required: false
      - key: "SortingAttribute"
        type: "java.lang.String"
        required: false
  - id: "StartNode7"
    name: "GetMasterPageletConfiguration"
    mode: "private"
    strict: true
    inputs:
      - key: "EndcapMasterPageletUUID"
        type: "java.lang.String"
        required: true

steps:
  - id: "AddMultipleEntriesToMap1"
    type: "pipelet"
    ref: "AddMultipleEntriesToMap"
    config:
      Mode: "OverwriteValue"
    bindings:
      Key1: "\"CatalogCategoryID\""
      Value1: "Category:UUID"
      OutMap: "GenericHandlerPipelineParams"
      Value3: "SearchTerm"
      Key3: "\"SearchTerm\""
      Key2: "\"EndcapMasterPageletUUID\""
      Value2: "EndcapMasterPageletUUID"
      Key4: "\"SortingAttribute\""
      Value4: "SortingAttribute"
  - id: "CalculateInteger1"
    type: "pipelet"
    ref: "CalculateInteger"
    config:
      Operation: "+"
      Operand2: 1
    bindings:
      Result: "Page"
      Operand1: "PageNumber"
  - id: "CallNode1"
    type: "call"
    ref: "ViewPagelet_comp_endcaps-GetProducts"
    bindings:
      ProductFilterName: "PageletConfigurationParameters:predefinedFilter"
      EndcapScope: "PageletConfigurationParameters:endcapScope"
  - id: "CallNode10"
    type: "call"
    ref: "ProcessB2CProduct-GetProductBOs"
  - id: "CallNode11"
    type: "call"
    ref: "ProcessSearchQueryDefinitionBySearchIndex-GetProducts"
    bindings:
      SearchQueryDefinitionID: "ProductFilterName"
      ProductDomain: "CurrentOrganization:OwningDomain"
      CatalogDomain: "CurrentOrganization:OwningDomain"
      CatalogCategory: "Category"
  - id: "CallNode3"
    type: "call"
    ref: "ProcessSearchQueryDefinitionBySearchIndex-GetProducts"
    bindings:
      SearchQueryDefinitionID: "ProductFilterName"
      ProductDomain: "CurrentOrganization:OwningDomain"
      CatalogDomain: "CurrentOrganization:OwningDomain"
      Page: "Page"
      PageSize: "PageSize"
      CatalogCategory: "ContextCategory"
  - id: "CallNode5"
    type: "call"
    ref: "ViewPagelet_comp_endcaps-GetMasterPageletConfiguration"
    bindings:
      EndcapTitle: "Title"
  - id: "CallNode7"
    type: "call"
    ref: "ProcessB2CProduct-GetProductBOs"
  - id: "CallNode8"
    type: "call"
    ref: "ProcessChannelCatalog-GetCategoryBO"
  - id: "CallNode9"
    type: "call"
    ref: "ViewPagelet_comp_endcaps-GetProducts"
    bindings:
      ProductFilterName: "PageletConfigurationParameters:predefinedFilter"
      EndcapScope: "PageletConfigurationParameters:endcapScope"
  - id: "CreateSearchIndexCategoryNavigationList1"
    type: "pipelet"
    ref: "CreateSearchIndexCategoryNavigationList"
    bindings:
      HandlerPipeline: "\"ViewAllEndcaps\""
  - id: "DecisionNode1"
    type: "decision"
    condition: "EndcapScope"
  - id: "DecisionNode2"
    type: "decision"
    condition: "CatalogCategoryID"
  - id: "DecisionNode3"
    type: "decision"
    condition: "ConfigurationParameterMap:MaximumNumberOfProducts"
  - id: "DecisionNode4"
    type: "decision"
    condition: "PageNumber"
  - id: "DecisionNode5"
    type: "decision"
    condition: "PageSize"
  - id: "DecisionNode6"
    type: "decision"
    condition: "EndcapScope"
  - id: "DecisionNode7"
    type: "decision"
