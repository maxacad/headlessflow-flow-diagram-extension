      - key: "ProductBOs"
        type: "java.util.Iterator"
        guaranteed: false
      - key: "Title"
        type: "java.lang.String"
        guaranteed: false
      - key: "CategoryBO"
        type: "com.intershop.component.catalog.capi.CatalogCategoryBO"
        guaranteed: false
      - key: "SearchTerm"
