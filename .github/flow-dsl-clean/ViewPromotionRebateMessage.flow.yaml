      Mode: "OverwriteValue"
      ValueSeparatorChar: ","
    bindings:
      InMap: "FormParameters"
      OutMap: "FormParameters"
      Value1: "Promotion:AttributeValue(\"LongTitle\",SelectedLocale):TextValue"
      Value2: "Promotion:AttributeValue(\"ConditionalProductDescription\",SelectedLocale):TextValue"
      Value3: "Promotion:AttributeValue(\"DiscountedProductDescription\",SelectedLocale):TextValue"
      Value4: "Promotion:AttributeValue(\"RuleDescription\",SelectedLocale):TextValue"
      Value5: "Promotion:AttributeValue(\"LegalContentMessage\",SelectedLocale):TextValue"
      Key1: "PromotionMessagingForm:LongTitle"
      Key2: "PromotionMessagingForm:ConditionalProductDescription"
      Key3: "PromotionMessagingForm:DiscountedProductDescription"
      Key4: "PromotionMessagingForm:RuleDescription"
      Key5: "PromotionMessagingForm:LegalContentMessage"
  - id: "AddMultipleEntriesToMap3"
