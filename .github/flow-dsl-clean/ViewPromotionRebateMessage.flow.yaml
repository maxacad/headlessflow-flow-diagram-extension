      DiscountedProductDescription: "PromotionMessagingForm:DiscountedProductDescription:Value"
      Icon: "PromotionMessagingForm:Icon:Value"
      LegalContentMessage: "PromotionMessagingForm:LegalContentMessage:Value"
      LongTitle: "PromotionMessagingForm:LongTitle:Value"
      RuleDescription: "PromotionMessagingForm:RuleDescription:Value"
      Title: "PromotionMessagingForm:Title:Value"
      ExternalDetailsURL: "PromotionMessagingForm:ExternalDetailsURL:Value"
