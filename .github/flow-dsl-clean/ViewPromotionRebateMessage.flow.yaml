      Key2: "PromotionMessagingForm:UseExternalURL"
      Value1: "Promotion:AttributeValue(\"ExternalDetailsURL\",SelectedLocale):StringValue"
      Value2: "Promotion:AttributeValue(\"UseExternalURL\",SelectedLocale):BooleanValue"
      Key4: "PromotionMessagingForm:Icon"
      Value4: "Promotion:AttributeValue(\"Icon\",SelectedLocale):TextValue"
      Key5: "PromotionMessagingForm:Title"
      Value5: "Promotion:AttributeValue(\"Title\",SelectedLocale):TextValue"
