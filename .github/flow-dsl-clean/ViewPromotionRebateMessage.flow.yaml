      OutMap: "FormParameters"
      Key1: "PromotionMessagingForm:DisableMessages"
      Value1: "Promotion:AttributeValue(\"DisableMessages\"):BooleanValue"
  - id: "AddMultipleEntriesToMap4"
    type: "pipelet"
