  - id: "StartNode1"
    name: "Update"
    mode: "private"
    strict: false
    inputs:
      []
  - id: "StartNode2"
    name: "UpdatePromotion"
    mode: "private"
    strict: true
    inputs:
      - key: "ExternalDetailsURL"
        type: "java.lang.String"
        required: true
      - key: "UseExternalURL"
        type: "java.lang.Boolean"
        required: true
      - key: "Icon"
        type: "java.lang.String"
        required: true
      - key: "Title"
        type: "java.lang.String"
        required: true
      - key: "LongTitle"
        type: "java.lang.String"
        required: true
      - key: "RuleDescription"
        type: "java.lang.String"
        required: true
      - key: "LegalContentMessage"
        type: "java.lang.String"
        required: true
      - key: "SelectedLocale"
        type: "com.intershop.beehive.core.capi.localization.LocaleInformation"
        required: true
      - key: "Promotion"
        type: "com.intershop.beehive.core.capi.domain.ExtensibleObject"
        required: true
      - key: "LocaleId"
        type: "java.lang.String"
        required: true
      - key: "DisableMessages"
        type: "java.lang.Boolean"
        required: true
