flow: "ProcessLogin"
kind: "process"

entries:
  - id: "Start2"
    name: "LoginUser"
    mode: "private"
    strict: true
    inputs:
      - key: "Login"
        type: "java.lang.String"
        required: true
      - key: "Password"
        type: "java.lang.String"
        required: true
      - key: "CurrentOrganization"
        type: "com.intershop.component.organization.capi.Organization"
        required: true
      - key: "CurrentRequest"
        type: "com.intershop.beehive.core.capi.request.Request"
        required: true
      - key: "CurrentAppContext"
        type: "com.intershop.beehive.app.capi.AppContext"
        required: false
      - key: "MergeWithExistingBaskets"
        type: "java.lang.String"
        required: false
      - key: "ApplicationBO"
        type: "com.intershop.component.application.capi.ApplicationBO"
        required: true
  - id: "StartNode1"
    name: "LogoutUser"
    mode: "private"
    strict: true
    inputs:
      - key: "CurrentUser"
        type: "com.intershop.beehive.core.capi.user.User"
        required: true
      - key: "CurrentOrganization"
        type: "com.intershop.component.organization.capi.Organization"
        required: true
  - id: "StartNode2"
    name: "ProcessLoginUser"
    mode: "private"
    strict: true
    inputs:
      - key: "CurrentDomain"
        type: "com.intershop.beehive.core.capi.domain.Domain"
        required: false
      - key: "CurrentOrganization"
        type: "com.intershop.component.organization.capi.Organization"
        required: false
      - key: "CurrentRequest"
        type: "com.intershop.beehive.core.capi.request.Request"
        required: false
      - key: "CurrentUser"
        type: "com.intershop.beehive.core.capi.user.User"
        required: false
      - key: "Login"
        type: "java.lang.String"
        required: false
      - key: "Password"
        type: "java.lang.String"
        required: false
  - id: "StartNode3"
    name: "PostLoginHook"
    mode: "private"
    strict: false
    inputs:
      []

steps:
  - id: "AcceptExistingBasket1"
    type: "pipelet"
    ref: "AcceptExistingBasket"
    config:
      BasketType: "REQUISITION"
      Mode: "MergeExistingWithCurrent"
    bindings:
      CurrentDomain: "CurrentOrganization:OrganizationDomain"
  - id: "AcceptExistingBasket2"
    type: "pipelet"
    ref: "AcceptExistingBasket"
    config:
      BasketType: "REQUISITION"
      Mode: "ReplaceExistingWithCurrent"
    bindings:
      CurrentDomain: "CurrentOrganization:OrganizationDomain"
  - id: "CallNode0"
    type: "call"
    ref: "ProcessABTesting-LogBasketCreationEvent"
  - id: "CallNode1"
    type: "call"
    ref: "ProcessCart-GetExistingCart"
    bindings:
      User: "CurrentUser"
      Organization: "CurrentOrganization"
      BasketBORepository: "ApplicationBO:Extension(\"Basket\"):getBasketBORepository(CurrentOrganization)"
  - id: "CallNode10"
    type: "call"
    ref: "ProcessLogin-PostLoginHook"
  - id: "CallNode23"
    type: "call"
    ref: "ProcessUserGroups-GetCurrentUserUserGroups"
  - id: "CallNode4"
    type: "call"
    ref: "ProcessPersonalizationGroup-UpdatePersonalizationGroup"
  - id: "CallNode5"
    type: "call"
    ref: "ProcessCart-GetExistingCart"
    bindings:
      User: "CurrentUser"
      Organization: "CurrentOrganization"
      BasketBORepository: "ApplicationBO:Extension(\"Basket\"):getBasketBORepository(CurrentOrganization)"
      CurrentCart: "OldRequisition"
  - id: "CallNode6"
    type: "call"
    ref: "ProcessPromotionCodeForBasket-ValidateAllPromotionCodesFromBasket"
    bindings:
      Organization: "CurrentOrganization"
      Requisition: "CurrentCart"
      Consumer: "CurrentUser"
      ValidationTime: "CurrentSession:CreationTime"
      ApplicationID: "CurrentAppContext:Variables:Application:UUID"
  - id: "CallNode7"
    type: "call"
    ref: "ProcessPersonalizationGroup-UpdatePersonalizationGroup"
  - id: "CallNode8"
    type: "call"
    ref: "ProcessPromotionCodeForBasket-ValidateAllPromotionCodesFromBasket"
    bindings:
      Organization: "CurrentOrganization"
      Requisition: "CurrentCart"
      Consumer: "CurrentUser"
      ValidationTime: "CurrentSession:CreationTime"
      ApplicationID: "CurrentAppContext:Variables:Application:UUID"
  - id: "CallNode9"
    type: "call"
    ref: "ProcessLogin-ProcessLoginUser"
  - id: "ClearAllRecentlyViewedItems1"
    type: "pipelet"
    ref: "ClearAllRecentlyViewedItems"
    bindings:
      Domain: "CurrentDomain"
  - id: "DecisionNode0"
    type: "decision"
    condition: "CurrentSession:getObject(\"T_ABTestMode\")"
  - id: "DecisionNode1"
    type: "decision"
    condition: "CurrentSession:getObject(\"T_ABTestMode\")"
  - id: "DecisionNode2"
    type: "decision"
    condition: "MergeWithExistingBaskets"
  - id: "End1"
    type: "end"
    strict: true
    outputs:
      - key: "ERROR_User"
        type: "java.lang.String"
        guaranteed: true
      - key: "LockedUser"
        type: "com.intershop.beehive.core.capi.user.User"
        guaranteed: false
  - id: "End5"
    type: "end"
    strict: true
    outputs:
      - key: "LastUser"
        type: "com.intershop.beehive.core.capi.user.User"
        guaranteed: true
      - key: "CurrentUser"
        type: "com.intershop.beehive.core.capi.user.User"
        guaranteed: true
      - key: "CurrentCart"
        type: "com.intershop.beehive.bts.capi.orderprocess.basket.Basket"
        guaranteed: false
  - id: "EndNode1"
    type: "end"
    strict: true
    outputs:
      - key: "CurrentUser"
        type: "com.intershop.beehive.core.capi.user.User"
        guaranteed: true
  - id: "EndNode2"
    type: "end"
    strict: true
    outputs:
      - key: "ERROR_User"
        type: "java.lang.String"
        guaranteed: false
      - key: "LastUser"
        type: "com.intershop.beehive.core.capi.user.User"
        guaranteed: true
      - key: "LockedUser"
        type: "com.intershop.beehive.core.capi.user.User"
        guaranteed: false
      - key: "Profile"
        type: "com.intershop.beehive.core.capi.profile.Profile"
        guaranteed: true
      - key: "CurrentUser"
        type: "com.intershop.beehive.core.capi.user.User"
        guaranteed: true
  - id: "EndNode3"
    type: "end"
    strict: true
    outputs:
      - key: "ERROR_User"
        type: "java.lang.String"
        guaranteed: false
      - key: "LockedUser"
        type: "com.intershop.beehive.core.capi.user.User"
        guaranteed: false
  - id: "EndNode4"
    type: "end"
    strict: true
  - id: "JoinNode0"
    type: "join"
  - id: "JoinNode1"
    type: "join"
  - id: "JoinNode2"
    type: "join"
  - id: "JoinNode3"
    type: "join"
  - id: "JoinNode5"
    type: "join"
  - id: "LoginUser1"
    type: "pipelet"
    ref: "LoginUser"
    bindings:
      RegistrationDomain: "CurrentOrganization:OrganizationDomain:DomainName"
  - id: "LogoutUser1"
    type: "pipelet"
    ref: "LogoutUser"
  - id: "Pipelet1"
    type: "pipelet"
    ref: "ExchangeSessionObject"
    config:
      ProcessMethod: "Put Object to Session"
      SessionObjectName: "T_UserGroupKeyCollection"
    bindings:
      SaveObject: "UserGroupKeyCollection"
  - id: "RemovePersonalDataFromBasket1"
    type: "pipelet"
    ref: "RemovePersonalDataFromBasket"
    config:
      KeepShippingMethod: "TRUE"
    bindings:
      Basket: "OldRequisition"
  - id: "SwitchLocale3"
    type: "pipelet"
    ref: "SwitchLocale"
    bindings:
      LocaleID: "Profile:PreferredLocale"
  - id: "Text0"
    type: "text"

links:
  - from: "AcceptExistingBasket1"
    via: "next"
    to: "JoinNode1"
    into: "in1"
  - from: "AcceptExistingBasket2"
    via: "next"
    to: "JoinNode1"
    into: "in1"
  - from: "CallNode0"
    via: "next"
    to: "JoinNode0"
    into: "in1"
  - from: "CallNode10"
    via: "next"
    to: "End5"
    into: "in"
  - from: "CallNode1"
    via: "ERROR"
    to: "JoinNode3"
    into: "in1"
  - from: "CallNode1"
    via: "next"
    to: "DecisionNode0"
    into: "in"
  - from: "CallNode23"
    via: "next"
    to: "CallNode1"
    into: "in"
  - from: "CallNode4"
    via: "next"
    to: "CallNode23"
    into: "in"
  - from: "CallNode5"
    via: "ERROR"
    to: "JoinNode2"
    into: "in1"
  - from: "CallNode5"
    via: "next"
    to: "RemovePersonalDataFromBasket1"
    into: "in"
  - from: "CallNode6"
    via: "next"
    to: "JoinNode3"
    into: "in1"
  - from: "CallNode7"
    via: "next"
    to: "Pipelet1"
    into: "in"
  - from: "CallNode8"
    via: "next"
    to: "JoinNode3"
    into: "in1"
  - from: "CallNode9"
    via: "ERROR"
    to: "End1"
    into: "in"
  - from: "CallNode9"
    via: "next"
    to: "DecisionNode2"
    into: "in"
  - from: "ClearAllRecentlyViewedItems1"
    via: "next"
    to: "EndNode1"
    into: "in"
  - from: "DecisionNode0"
    via: "no"
    to: "JoinNode0"
    into: "in1"
  - from: "DecisionNode0"
    via: "yes"
    to: "CallNode0"
    into: "in"
  - from: "DecisionNode1"
    via: "no"
    to: "CallNode6"
    into: "in"
  - from: "DecisionNode1"
    via: "yes"
    to: "CallNode8"
    into: "in"
  - from: "DecisionNode2"
    via: "no"
    to: "AcceptExistingBasket1"
    into: "in"
  - from: "DecisionNode2"
    via: "yes"
    to: "AcceptExistingBasket2"
    into: "in"
  - from: "JoinNode0"
    via: "next"
    to: "DecisionNode1"
    into: "in"
  - from: "JoinNode1"
    via: "next"
    to: "CallNode4"
    into: "in"
  - from: "JoinNode2"
    via: "next"
    to: "CallNode9"
    into: "in"
  - from: "JoinNode3"
    via: "next"
    to: "SwitchLocale3"
    into: "in"
  - from: "JoinNode5"
    via: "next"
    to: "ClearAllRecentlyViewedItems1"
    into: "in"
  - from: "LoginUser1"
    via: "error"
    to: "EndNode3"
    into: "in"
  - from: "LoginUser1"
    via: "next"
    to: "EndNode2"
    into: "in"
  - from: "LogoutUser1"
    via: "next"
    to: "CallNode7"
    into: "in"
  - from: "Pipelet1"
    via: "error"
    to: "JoinNode5"
    into: "in1"
  - from: "Pipelet1"
    via: "next"
    to: "JoinNode5"
    into: "in1"
  - from: "RemovePersonalDataFromBasket1"
    via: "next"
    to: "JoinNode2"
    into: "in1"
  - from: "Start2"
    via: "next"
    to: "CallNode5"
    into: "in"
  - from: "StartNode1"
    via: "next"
    to: "LogoutUser1"
    into: "in"
  - from: "StartNode2"
    via: "next"
    to: "LoginUser1"
    into: "in"
  - from: "StartNode3"
    via: "next"
    to: "EndNode4"
    into: "in"
  - from: "SwitchLocale3"
    via: "next"
    to: "CallNode10"
    into: "in"
