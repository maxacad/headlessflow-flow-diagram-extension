flow: "ViewUserAccessRoles"
kind: "view"

entries:
  - id: "Start1"
    name: "AddRoles"
    mode: "private"
    strict: false
    inputs:
      - key: "RoleID_Add_Iterator<java.util.Iterator>"
        type: "java.util.Iterator"
        required: false
      - key: "RoleID_Remove_Iterator<java.util.Iterator>"
        type: "java.util.Iterator"
        required: false
  - id: "Start2"
    name: "RemoveRoles"
    mode: "private"
    strict: false
    inputs:
      - key: "RoleID_Add_Iterator<java.util.Iterator>"
        type: "java.util.Iterator"
        required: false
      - key: "RoleID_Remove_Iterator<java.util.Iterator>"
        type: "java.util.Iterator"
        required: false
  - id: "Start3"
    name: "Update"
    mode: "private"
    strict: false
    inputs:
      []
  - id: "Start4"
    name: "Show"
    mode: "private"
    strict: false
    inputs:
      []
  - id: "Start6"
    name: "Dispatch"
    mode: "private"
    strict: false
    inputs:
      []

steps:
  - id: "Call1"
    type: "call"
    ref: "ViewUserAccessRoles-AddRoles"
  - id: "Call2"
    type: "call"
    ref: "ViewUserAccessRoles-RemoveRoles"
  - id: "Call3"
    type: "call"
    ref: "ProcessUserAccessRoles-RemoveRole"
  - id: "Call4"
    type: "call"
    ref: "ProcessUserAccessRoles-UpdatePrefix"
  - id: "Call5"
    type: "call"
    ref: "ProcessUserAccessRoles-AddRole"
  - id: "Call6"
    type: "call"
    ref: "ProcessUserAccessRoles-Show"
  - id: "CombineIterators1"
    type: "pipelet"
    ref: "CombineIterators"
    config:
      ProcessMethod: "Subtract Iterators"
    bindings:
      Iterator1: "RoleID_Remove_Iterator"
      Iterator: "Remove_Iterator"
      Iterator2: "RoleID_Add_Iterator"
  - id: "CombineIterators2"
    type: "pipelet"
    ref: "CombineIterators"
    config:
      ProcessMethod: "Subtract Iterators"
    bindings:
      Iterator1: "RoleID_Add_Iterator"
      Iterator: "Add_Iterator"
      Iterator2: "RoleID_Remove_Iterator"
  - id: "CreateIteratorForPrefix3"
    type: "pipelet"
    ref: "CreateIteratorForPrefix"
    config:
      Prefix: "RemoveRole"
    bindings:
      PrefixIterator: "RoleID_Remove_Iterator"
  - id: "CreateIteratorForPrefix4"
    type: "pipelet"
    ref: "CreateIteratorForPrefix"
    config:
      Prefix: "AddRole"
    bindings:
      PrefixIterator: "RoleID_Add_Iterator"
  - id: "DispatchFormAction1"
    type: "pipelet"
    ref: "DispatchFormAction"
    config:
      OutValue_0: "ViewUserAccessRoles-Update"
      OutValue_1: "ViewUserAccessRoles-Show"
      OutValue_2: "ViewUserList-List"
    bindings:
      Key_0: "update"
      Key_1: "reset"
      Key_2: "back"
      SelectionKey: "JumpTarget"
  - id: "End1"
    type: "end"
    strict: false
  - id: "End2"
    type: "end"
    strict: false
  - id: "InteractionEnd1"
    type: "interaction"
  - id: "Jump1"
    type: "jump"
    ref: "ViewUserAccessRoles-Show"
  - id: "Jump5"
    type: "jump"
    ref: "SecureJump-Start"
  - id: "Loop1"
    type: "loop"
  - id: "Loop2"
    type: "loop"
  - id: "PrepareApplicationView1"
    type: "pipelet"
    ref: "PrepareApplicationView"
    config:
      SelectedMenuItem: "Users"
      WorkingTemplate: "user/UserAccessRoles"

