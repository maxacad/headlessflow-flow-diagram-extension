flow: "ViewOrderExportScheduling_52"
kind: "view"

entries:
  - id: "Start1"
    name: "Dispatch"
    mode: "private"
    strict: false
    inputs:
      []
  - id: "StartNode3"
    name: "Update"
    mode: "private"
    strict: false
    inputs:
      []
  - id: "StartNode4"
    name: "Edit"
    mode: "private"
    strict: false
    inputs:
      []

steps:
  - id: "CallNode4"
    type: "call"
    ref: "ViewOrderExportGeneral_52-Prefix"
  - id: "CallNode5"
    type: "call"
    ref: "ProcessJobScheduling-Update"
  - id: "CallNode6"
    type: "call"
    ref: "ViewOrderExportGeneral_52-Prefix"
  - id: "DecisionNode1"
    type: "decision"
    condition: "SchedulingType"
  - id: "DispatchFormAction2"
    type: "pipelet"
    ref: "DispatchFormAction"
    config:
      OutValue_1: "ViewOrderExportScheduling_52-Update"
      OutValue_2: "ViewOrderExportScheduling_52-Edit"
    bindings:
      SelectionKey: "JumpTarget"
      Key_1: "update"
      Key_2: "reset"
  - id: "InteractionEnd1"
    type: "interaction"
  - id: "JoinNode1"
    type: "join"
  - id: "Jump1"
    type: "jump"
    ref: "SecureJump-Start"
  - id: "JumpNode1"
    type: "jump"
    ref: "ViewOrderExportScheduling_52-Edit"
  - id: "KeyMapper2"
    type: "pipelet"
    ref: "KeyMapper"
    bindings:
      InValue_1: "Config:JobConfiguration"
      OutValue_1: "JobConfiguration"
  - id: "KeyMapper3"
    type: "pipelet"
    ref: "KeyMapper"
    bindings:
      InValue_1: "\"Manually\""
      OutValue_1: "SchedulingType"
  - id: "PrepareApplicationView1"
    type: "pipelet"
    ref: "PrepareApplicationView"
    config:
      SelectedMenuItem: "Orders"
      WorkingTemplate: "order/OrderExportScheduling_52"
  - id: "RemoveCustomAttribute1"
    type: "pipelet"
    ref: "RemoveCustomAttribute"
    config:
      DefaultAttributeName: "executeOnOrderCreation"
    bindings:
      AttributeName: "null"
      ExtensibleObject: "Config:JobConfiguration"
      LocaleInformation: "null"
  - id: "TextNode1"
    type: "text"
  - id: "UpdateCustomAttribute1"
    type: "pipelet"
    ref: "UpdateCustomAttribute"
    config:
      DefaultAttributeName: "executeOnOrderCreation"
      DefaultAttributeType: "Boolean"
      DefaultAttributeValue: true
    bindings:
      AttributeName: "null"
      AttributeType: "null"
      AttributeValue: "null"
      ExtensibleObject: "Config:JobConfiguration"
      LocaleInformation: "null"

links:
  - from: "KeyMapper2"
    via: "next"
    to: "DecisionNode1"
    into: "in"
  - from: "RemoveCustomAttribute1"
    via: "next"
    to: "JoinNode1"
    into: "in2"
  - from: "StartNode3"
    via: "next"
    to: "CallNode6"
    into: "in"
  - from: "StartNode4"
    via: "next"
    to: "CallNode4"
    into: "in"
  - from: "PrepareApplicationView1"
    via: "next"
    to: "InteractionEnd1"
    into: "in"
  - from: "DispatchFormAction2"
    via: "next"
    to: "Jump1"
    into: "in"
  - from: "Start1"
    via: "next"
    to: "DispatchFormAction2"
    into: "in"
  - from: "DecisionNode1"
    via: "no"
    to: "RemoveCustomAttribute1"
    into: "in"
  - from: "CallNode6"
    via: "next"
    to: "KeyMapper2"
    into: "in"
  - from: "UpdateCustomAttribute1"
    via: "next"
    to: "KeyMapper3"
    into: "in"
  - from: "DecisionNode1"
    via: "yes"
    to: "UpdateCustomAttribute1"
    into: "in"
  - from: "JoinNode1"
    via: "next"
    to: "CallNode5"
    into: "in"
  - from: "KeyMapper3"
    via: "next"
    to: "JoinNode1"
    into: "in1"
  - from: "CallNode5"
    via: "next"
    to: "JumpNode1"
    into: "in"
  - from: "CallNode4"
    via: "next"
    to: "PrepareApplicationView1"
    into: "in"
