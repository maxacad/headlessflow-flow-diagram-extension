flow: "ViewChannelLinkExportFiles"
kind: "view"

entries:
  - id: "Start1"
    name: "BrowseDirectory"
    mode: "private"
    strict: false
    inputs:
      []
  - id: "Start2"
    name: "Paging"
    mode: "private"
    strict: false
    inputs:
      []
  - id: "Start3"
    name: "Back"
    mode: "private"
    strict: false
    inputs:
      []
  - id: "Start4"
    name: "DownloadFile"
    mode: "private"
    strict: false
    inputs:
      []
  - id: "Start5"
    name: "Dispatch"
    mode: "private"
    strict: false
    inputs:
      []
  - id: "Start6"
    name: "DeleteFiles"
    mode: "private"
    strict: false
    inputs:
      []

steps:
  - id: "BrowseDirectory1"
    type: "pipelet"
    ref: "BrowseDirectory"
    config:
      DefaultDirectoryPath: "export/shortlink"
      UnitDirectory: "IMPEX_DIR"
    bindings:
      UnitDomain: "ChannelRepository:Domain"
  - id: "Call1"
    type: "call"
    ref: "ProcessClipboard-Update"
  - id: "Call2"
    type: "call"
    ref: "ProcessClipboard-Get"
  - id: "Call3"
    type: "call"
    ref: "ProcessClipboard-Delete"
  - id: "Call4"
    type: "call"
    ref: "ProcessClipboard-Update"
  - id: "CreatePageableFromIterator1"
    type: "pipelet"
    ref: "CreatePageableFromIterator"
    config:
      PageableName: "Files"
      Pagesize: 10
    bindings:
      Iterator: "Directory:Files"
      Pageable: "Files"
  - id: "Decision1"
    type: "decision"
    condition: "PageLocator"
  - id: "Decision2"
    type: "decision"
    condition: "PageNumber"
  - id: "DeleteFile1"
    type: "pipelet"
    ref: "DeleteFile"
    config:
      DefaultDirectoryPath: "export/shortlink"
      UnitDirectory: "IMPEX_DIR"
    bindings:
      UnitDomain: "ChannelRepository:Domain"
  - id: "DispatchFormAction1"
    type: "pipelet"
    ref: "DispatchFormAction"
    config:
      OutValue_0: "ViewChannelLinkExportFiles-BrowseDirectory"
      OutValue_1: "ViewChannelLinkExportFiles-Paging"
      OutValue_2: "ViewChannelLinkExportFiles-DeleteFiles"
      OutValue_3: "ViewChannelLinkExportFiles-DownloadFile"
      OutValue_4: "ViewChannelLinkExportFiles-Back"
      PagingPipeline: "ViewChannelLinkExportFiles-Paging"
    bindings:
      Key_0: "BrowseDirectory"
      Key_1: "Paging"
      Key_2: "DeleteFiles"
      Key_3: "DownloadFile"
      Key_4: "ConfirmDeleteFiles"
      SelectionKey: "JumpTarget"
  - id: "GetBinaryFileContent1"
    type: "pipelet"
    ref: "GetBinaryFileContent"
    config:
      UnitDirectory: "IMPEX_DIR"
    bindings:
      DirectoryPath: "\"export/shortlink\""
      UnitDomain: "ChannelRepository:Domain"
  - id: "GetPageLocator1"
    type: "pipelet"
    ref: "GetPageLocator"
    config:
      DefaultPageLocatorName: "LinkExportFilesPageLocator"
      RestorePageLocatorDictionary: "True"
  - id: "GetPageLocator2"
    type: "pipelet"
    ref: "GetPageLocator"
    config:
      DefaultPageLocatorName: "LinkExportFilesPageLocator"
      RestorePageLocatorDictionary: "True"
  - id: "GetPageable1"
    type: "pipelet"
    ref: "GetPageable"
    bindings:
      Pageable: "Files"
      PageableID: "PageLocator:PageableID"
  - id: "InteractionEnd1"
    type: "interaction"
  - id: "InteractionEnd2"
    type: "interaction"
  - id: "InteractionEnd3"
    type: "interaction"
  - id: "Join1"
    type: "join"
  - id: "Join2"
    type: "join"
  - id: "Join3"
    type: "join"
  - id: "Join4"
    type: "join"
  - id: "Join5"
    type: "join"
  - id: "Join6"
    type: "join"
  - id: "JoinNode1"
    type: "join"
  - id: "Jump1"
    type: "jump"
    ref: "Error-Start"
  - id: "Jump2"
    type: "jump"
    ref: "ViewChannelLinkExportFiles-BrowseDirectory"
  - id: "Jump3"
    type: "jump"
  - id: "Jump4"
    type: "jump"
    ref: "Error-FileNotFound"
  - id: "Jump5"
    type: "jump"
    ref: "SecureJump-Start"
  - id: "Jump7"
    type: "jump"
    ref: "ViewChannelLinkExportFiles-BrowseDirectory"
  - id: "Loop1"
    type: "loop"
  - id: "PrepareApplicationView1"
    type: "pipelet"
    ref: "PrepareApplicationView"
    config:
      RenderingType: "HTML"
      SelectedMenuItem: "OnlineMarketing"
      WorkingTemplate: "impex/ChannelLinkExportFiles"
  - id: "PrepareApplicationView2"
    type: "pipelet"
    ref: "PrepareApplicationView"
    config:
      RenderingType: "HTML"
      SelectedMenuItem: "OnlineMarketing"
      WorkingTemplate: "impex/ChannelLinkExportFiles"
  - id: "SetDictionaryValue1"
    type: "pipelet"
    ref: "SetDictionaryValue"
    config:
      ValueType: "Dictionary Value"
      Name: "JumpTarget"
      Value: "Error-Start"
  - id: "SetPage1"
    type: "pipelet"
    ref: "SetPage"
    bindings:
      PageNumber: "PageLocator:PageNumber"
      Pageable: "Files"
  - id: "SetPage2"
    type: "pipelet"
    ref: "SetPage"
    bindings:
      Pageable: "Files"
  - id: "SetPageLocator1"
    type: "pipelet"
    ref: "SetPageLocator"
    config:
      DefaultHandlerPipeline: "ViewChannelLinkExportFiles-Paging"
      DefaultPageLocatorName: "LinkExportFilesPageLocator"
    bindings:
      Pageable: "Files"
  - id: "VerifyInteger1"
    type: "pipelet"
    ref: "VerifyInteger"
    bindings:
      IntegerObject: "PageNumber"
      LocalizedString: "PageNumber"

links:
  - from: "GetBinaryFileContent1"
    via: "error"
    to: "Jump4"
    into: "in"
  - from: "VerifyInteger1"
    via: "next"
    to: "SetPage2"
    into: "in"
  - from: "SetPage2"
    via: "next"
    to: "Join6"
    into: "in1"
  - from: "Join6"
    via: "next"
    to: "Join3"
    into: "in1"
  - from: "VerifyInteger1"
    via: "error"
    to: "Join6"
    into: "in3"
  - from: "Decision2"
    via: "no"
    to: "Decision1"
    into: "in"
  - from: "Decision1"
    via: "yes"
    to: "SetPage1"
    into: "in"
  - from: "Join3"
    via: "next"
    to: "SetPageLocator1"
    into: "in"
  - from: "SetPage1"
    via: "next"
    to: "Join2"
    into: "in1"
  - from: "Join2"
    via: "next"
    to: "Join3"
    into: "in3"
  - from: "Decision1"
    via: "no"
    to: "Join2"
    into: "in3"
  - from: "GetBinaryFileContent1"
    via: "next"
    to: "InteractionEnd2"
    into: "in"
  - from: "Start1"
    via: "next"
    to: "Call3"
    into: "in"
  - from: "Start2"
    via: "next"
    to: "Call4"
    into: "in"
  - from: "Call4"
    via: "next"
    to: "GetPageLocator1"
    into: "in"
  - from: "GetPageLocator1"
    via: "next"
    to: "GetPageable1"
    into: "in"
  - from: "GetPageable1"
    via: "next"
    to: "Join5"
    into: "in2"
  - from: "Call3"
    via: "next"
    to: "Join1"
    into: "in1"
  - from: "Join1"
    via: "next"
    to: "Join4"
    into: "in1"
  - from: "GetPageLocator1"
    via: "error"
    to: "Join1"
    into: "in2"
  - from: "Join4"
    via: "next"
    to: "BrowseDirectory1"
    into: "in"
  - from: "BrowseDirectory1"
    via: "next"
    to: "CreatePageableFromIterator1"
    into: "in"
  - from: "Start3"
    via: "next"
    to: "GetPageLocator2"
    into: "in"
  - from: "CreatePageableFromIterator1"
    via: "next"
    to: "Join5"
    into: "in1"
  - from: "SetPageLocator1"
    via: "next"
    to: "PrepareApplicationView2"
    into: "in"
  - from: "Call1"
    via: "next"
    to: "Call2"
    into: "in"
  - from: "Call2"
    via: "next"
    to: "Loop1"
    into: "in"
  - from: "Start6"
    via: "next"
    to: "Call1"
    into: "in"
  - from: "Loop1"
    via: "next"
    to: "Jump7"
    into: "in"
  - from: "Loop1"
    via: "do"
    to: "DeleteFile1"
    into: "in"
  - from: "DeleteFile1"
    via: "next"
    to: "Loop1"
    into: "loop"
  - from: "DeleteFile1"
    via: "error"
    to: "Jump1"
    into: "in"
  - from: "PrepareApplicationView1"
    via: "next"
    to: "InteractionEnd3"
    into: "in"
  - from: "GetPageLocator2"
    via: "next"
    to: "Jump3"
    into: "in"
  - from: "BrowseDirectory1"
    via: "error"
    to: "PrepareApplicationView1"
    into: "in"
  - from: "Start4"
    via: "next"
    to: "GetBinaryFileContent1"
    into: "in"
  - from: "Start5"
    via: "next"
    to: "DispatchFormAction1"
    into: "in"
  - from: "SetDictionaryValue1"
    via: "next"
    to: "JoinNode1"
    into: "in3"
  - from: "DispatchFormAction1"
    via: "next"
    to: "JoinNode1"
    into: "in1"
  - from: "DispatchFormAction1"
    via: "error"
    to: "SetDictionaryValue1"
    into: "in"
  - from: "JoinNode1"
    via: "next"
    to: "Jump5"
    into: "in"
  - from: "GetPageLocator2"
    via: "error"
    to: "Jump2"
    into: "in"
  - from: "PrepareApplicationView2"
    via: "next"
    to: "InteractionEnd1"
    into: "in"
  - from: "GetPageable1"
