flow: "ProcessPayment"
kind: "process"

entries:
  - id: "Start1"
    name: "GetActivePaymentMethods"
    mode: "private"
    strict: true
    inputs:
      - key: "CurrentUserUserGroups"
        type: "java.util.Iterator"
        required: false
      - key: "Organization"
        type: "com.intershop.component.organization.capi.Organization"
        required: true
      - key: "CurrencyMnemonic"
        type: "java.lang.String"
        required: false
      - key: "User"
        type: "com.intershop.beehive.core.capi.user.User"
        required: false
      - key: "CurrentApplication"
        type: "com.intershop.beehive.core.capi.domain.Application"
        required: true
  - id: "StartNode1"
    name: "SetDefaultPaymentMethod"
    mode: "private"
    strict: true
    inputs:
      - key: "PaymentInstrumentInfoUUID"
        type: "java.lang.String"
        required: false
      - key: "User"
        type: "com.intershop.beehive.core.capi.user.User"
        required: true
      - key: "PaymentInstrumentInfo"
        type: "com.intershop.beehive.bts.capi.payment.PaymentInstrumentInfo"
        required: false
  - id: "StartNode10"
    name: "AssignPIItoUser"
    mode: "private"
    strict: true
    inputs:
      - key: "PaymentInstrumentInfo"
        type: "com.intershop.beehive.bts.capi.payment.PaymentInstrumentInfo"
        required: false
      - key: "User"
        type: "com.intershop.beehive.core.capi.user.User"
        required: false
  - id: "StartNode11"
    name: "CreatePaymentInstrumentInfoByUser"
    mode: "private"
    strict: true
    inputs:
      - key: "User"
        type: "com.intershop.beehive.core.capi.user.User"
        required: true
      - key: "PaymentServiceConfigurationUUID"
        type: "java.lang.String"
        required: true
      - key: "PIIDataMap"
        type: "java.util.Map<java.lang.String, java.lang.String>"
        required: false
  - id: "StartNode12"
    name: "GetPaymentInstrumentInfoByID"
    mode: "private"
    strict: true
    inputs:
      - key: "PaymentInstrumentInfoUUID"
        type: "java.lang.String"
        required: true
  - id: "StartNode13"
    name: "AssignPIItoCart"
    mode: "private"
    strict: true
    inputs:
      - key: "Cart"
        type: "com.intershop.beehive.bts.capi.orderprocess.LineItemCtnr"
        required: false
      - key: "PaymentInstrumentInfo"
        type: "com.intershop.beehive.bts.capi.payment.PaymentInstrumentInfo"
        required: true
  - id: "StartNode14"
    name: "RemovePaymentInstrumentInfo"
    mode: "private"
    strict: true
    inputs:
      - key: "PaymentInstrumentInfo"
        type: "com.intershop.beehive.bts.capi.payment.PaymentInstrumentInfo"
        required: true
  - id: "StartNode15"
    name: "VerifyPaymentInstrumentInfo"
    mode: "private"
    strict: true
    inputs:
      - key: "PaymentInstrumentInfo"
        type: "com.intershop.beehive.bts.capi.payment.PaymentInstrumentInfo"
        required: true
  - id: "StartNode16"
    name: "SetReturningCustomerPayment"
    mode: "private"
    strict: true
    inputs:
      - key: "Cart"
        type: "com.intershop.beehive.bts.capi.orderprocess.basket.Basket"
        required: true
      - key: "User"
        type: "com.intershop.beehive.core.capi.user.User"
        required: true
      - key: "CurrentAppContext"
        type: "com.intershop.beehive.app.capi.AppContext"
        required: true
  - id: "StartNode17"
    name: "UpdatePII"
    mode: "private"
    strict: true
    inputs:
      - key: "PaymentInstrumentInfo"
        type: "com.intershop.beehive.bts.capi.payment.PaymentInstrumentInfo"
        required: true
      - key: "PIIData"
        type: "java.util.Map<java.lang.String,java.lang.String>"
        required: false
  - id: "StartNode18"
    name: "CheckSelectedPayment"
    mode: "private"
    strict: true
    inputs:
      - key: "Cart"
        type: "com.intershop.beehive.bts.capi.orderprocess.basket.Basket"
        required: true
  - id: "StartNode19"
    name: "CheckDefaultSettings"
    mode: "private"
    strict: true
    inputs:
      - key: "Cart"
        type: "com.intershop.beehive.bts.capi.orderprocess.basket.Basket"
        required: true
      - key: "CurrentAppContext"
        type: "com.intershop.beehive.app.capi.AppContext"
        required: true
      - key: "BasketBORepository"
        type: "com.intershop.component.basket.capi.BasketBORepository"
        required: true
  - id: "StartNode2"
    name: "EnsurePaymentSelectionAvailable"
    mode: "private"
    strict: true
    inputs:
      - key: "Cart"
        type: "com.intershop.beehive.bts.capi.orderprocess.basket.Basket"
        required: true
      - key: "UserGroups"
        type: "java.util.Iterator"
        required: true
      - key: "Organization"
        type: "com.intershop.component.organization.capi.Organization"
        required: true
      - key: "User"
        type: "com.intershop.beehive.core.capi.user.User"
        required: true
      - key: "CurrentApplication"
        type: "com.intershop.beehive.core.capi.domain.Application"
        required: true
  - id: "StartNode20"
    name: "DefaultSettings"
    mode: "private"
    strict: true
    inputs:
      - key: "Cart"
        type: "com.intershop.beehive.bts.capi.orderprocess.basket.Basket"
        required: true
      - key: "User"
        type: "com.intershop.beehive.core.capi.user.User"
        required: true
      - key: "CurrentAppContext"
        type: "com.intershop.beehive.app.capi.AppContext"
        required: true
  - id: "StartNode21"
    name: "RemoveAssignedOpenTenders"
    mode: "private"
    strict: true
    inputs:
      - key: "Cart"
        type: "com.intershop.beehive.bts.capi.orderprocess.basket.Basket"
        required: true
      - key: "CurrentAppContext"
        type: "com.intershop.beehive.app.capi.AppContext"
        required: true
  - id: "StartNode22"
    name: "ClonePII"
    mode: "private"
    strict: true
    inputs:
      - key: "PaymentInstrumentInfo"
        type: "com.intershop.beehive.bts.capi.payment.PaymentInstrumentInfo"
        required: true
  - id: "StartNode23"
    name: "ReverseAuthorization"
    mode: "private"
    strict: true
    inputs:
      - key: "PaymentTransactionIterator"
        type: "java.util.Iterator"
        required: false
      - key: "Order"
        type: "com.intershop.beehive.bts.capi.orderprocess.fulfillment.Order"
        required: true
  - id: "StartNode24"
    name: "CheckPaymentOnDeliveryCompatibility"
    mode: "private"
    strict: true
    inputs:
      - key: "Cart"
        type: "com.intershop.beehive.bts.capi.orderprocess.basket.Basket"
        required: true
  - id: "StartNode25"
    name: "CheckIfCartHasDigitalFreight"
    mode: "private"
    strict: true
    inputs:
      - key: "Cart"
        type: "com.intershop.beehive.bts.capi.orderprocess.basket.Basket"
        required: true
  - id: "StartNode26"
    name: "ValidateCheckoutData"
    mode: "private"
    strict: true
    inputs:
      - key: "AllFormValues"
        type: "java.util.Map<java.lang.String,java.lang.String[]>"
        required: false
      - key: "PaymentInstrumentInfo"
        type: "com.intershop.beehive.bts.capi.payment.PaymentInstrumentInfo"
        required: false
  - id: "StartNode27"
    name: "CheckPaymentServiceAssignable"
    mode: "private"
    strict: true
    inputs:
      - key: "ActivePaymentServices"
        type: "java.util.List<com.intershop.beehive.bts.capi.payment.PaymentService>"
        required: true
      - key: "CartBO"
        type: "com.intershop.component.basket.capi.BasketBO"
        required: true
      - key: "ActivePaymentConfigurations"
        type: "java.util.List<com.intershop.beehive.bts.capi.payment.PaymentConfiguration>"
        required: true
      - key: "Cart"
        type: "com.intershop.beehive.bts.capi.orderprocess.basket.Basket"
        required: true
      - key: "ServiceToBeChecked"
        type: "com.intershop.beehive.bts.capi.payment.PaymentService"
        required: true
  - id: "StartNode28"
    name: "ReplaceOpenTenderPaymentInstrumentForBasket"
    mode: "private"
    strict: true
    inputs:
      - key: "OpenTenderPaymentInstrumentInfo"
        type: "com.intershop.beehive.bts.capi.payment.PaymentInstrumentInfo"
        required: true
      - key: "Cart"
        type: "com.intershop.beehive.bts.capi.orderprocess.basket.Basket"
        required: true
      - key: "CartBO"
        type: "com.intershop.component.basket.capi.BasketBO"
        required: true
      - key: "ActivePaymentServices"
        type: "java.util.List<com.intershop.beehive.bts.capi.payment.PaymentService>"
        required: true
      - key: "ActivePaymentConfigurations"
        type: "java.util.List<com.intershop.beehive.bts.capi.payment.PaymentConfiguration>"
        required: true
      - key: "CurrentAppContext"
        type: "com.intershop.beehive.app.capi.AppContext"
        required: true
  - id: "StartNode29"
    name: "CreatePaymentInstrumentInWallet"
    mode: "private"
    strict: true
    inputs:
      - key: "PIIDataMap"
        type: "java.util.Map<java.lang.String,java.lang.String>"
        required: false
      - key: "Domain"
        type: "com.intershop.beehive.core.capi.domain.Domain"
        required: true
      - key: "PaymentService"
        type: "com.intershop.beehive.bts.capi.payment.PaymentService"
        required: true
      - key: "CurrencyMnemonic"
        type: "java.lang.String"
        required: true
      - key: "ActivePaymentConfigurations"
        type: "java.util.List<com.intershop.beehive.bts.capi.payment.PaymentConfiguration>"
        required: true
      - key: "User"
        type: "com.intershop.beehive.core.capi.user.User"
        required: true
      - key: "SetAsDefault"
        type: "java.lang.String"
        required: false
  - id: "StartNode3"
    name: "Start"
    mode: "private"
    strict: true
    inputs:
      - key: "Order"
        type: "com.intershop.beehive.bts.capi.orderprocess.fulfillment.Order"
        required: false
      - key: "Orders"
        type: "java.util.Iterator"
        required: false
      - key: "AllFormValues"
        type: "java.util.Map<java.lang.String, java.lang.String[]>"
        required: true
  - id: "StartNode30"
    name: "GetAssignedOpenTenderPaymentInstrument"
    mode: "private"
    strict: true
    inputs:
      - key: "Cart"
        type: "com.intershop.beehive.bts.capi.orderprocess.basket.Basket"
        required: true
  - id: "StartNode31"
    name: "GroupPaymentInstrumentInfosByService"
    mode: "private"
    strict: true
    inputs:
      - key: "PaymentInstrumentInfos"
        type: "java.util.Iterator<com.intershop.sellside.appbase.b2c.capi.order.PaymentInstrumentInfoBO>"
        required: true
  - id: "StartNode32"
    name: "CloneFromWalletOrCreatePaymentInstrument"
    mode: "private"
    strict: true
    inputs:
      - key: "PIIDataMap"
        type: "java.util.Map<java.lang.String,java.lang.String>"
        required: false
      - key: "Domain"
        type: "com.intershop.beehive.core.capi.domain.Domain"
        required: true
      - key: "PaymentService"
        type: "com.intershop.beehive.bts.capi.payment.PaymentService"
        required: true
      - key: "CurrencyMnemonic"
        type: "java.lang.String"
        required: true
      - key: "WalletPaymentInstrumentInfo"
        type: "com.intershop.beehive.bts.capi.payment.PaymentInstrumentInfo"
        required: false
  - id: "StartNode33"
    name: "GetWalletContents"
    mode: "private"
    strict: true
    inputs:
      - key: "User"
        type: "com.intershop.beehive.core.capi.user.User"
        required: true
  - id: "StartNode34"
    name: "PaymentInstrumentInfoPOToBOIterator"
    mode: "private"
    strict: true
    inputs:
      - key: "PaymentInstrumentInfos"
        type: "java.util.Iterator<com.intershop.beehive.bts.capi.payment.PaymentInstrumentInfo>"
        required: true
      - key: "CurrentCartBO"
        type: "com.intershop.component.basket.capi.BasketBO"
        required: true
  - id: "StartNode4"
    name: "CheckPaymentServicesAssignable"
    mode: "private"
    strict: true
    inputs:
      - key: "ActivePaymentServices"
        type: "java.util.List<com.intershop.beehive.bts.capi.payment.PaymentService>"
        required: true
      - key: "CartBO"
        type: "com.intershop.component.basket.capi.BasketBO"
        required: true
      - key: "ActivePaymentConfigurations"
        type: "java.util.List<com.intershop.beehive.bts.capi.payment.PaymentConfiguration>"
        required: true
      - key: "Cart"
        type: "com.intershop.beehive.bts.capi.orderprocess.basket.Basket"
        required: true
  - id: "StartNode5"
    name: "CheckPayment"
    mode: "private"
    strict: true
    inputs:
      - key: "Cart"
        type: "com.intershop.beehive.bts.capi.orderprocess.basket.Basket"
        required: true
      - key: "Organization"
        type: "com.intershop.component.organization.capi.Organization"
        required: true
      - key: "UserGroups"
        type: "java.util.Iterator"
        required: false
      - key: "User"
        type: "com.intershop.beehive.core.capi.user.User"
        required: true
      - key: "Request"
        type: "com.intershop.beehive.core.capi.request.Request"
        required: true
      - key: "CurrentApplication"
        type: "com.intershop.beehive.core.capi.domain.Application"
        required: true
  - id: "StartNode6"
    name: "GroupPaymentMethodsByOpenTender"
    mode: "private"
    strict: true
    inputs:
      - key: "PaymentServices"
        type: "java.util.List<com.intershop.beehive.bts.capi.payment.PaymentService>"
        required: true
  - id: "StartNode7"
    name: "StartSingle"
    mode: "private"
    strict: true
    inputs:
      - key: "Order"
        type: "com.intershop.beehive.bts.capi.orderprocess.fulfillment.Order"
        required: true
      - key: "AllFormValues"
        type: "java.util.Map<java.lang.String, java.lang.String[]>"
        required: true
  - id: "StartNode8"
    name: "GetPaymentConfigurationsIndexedByService"
    mode: "private"
    strict: true
    inputs:
      - key: "ActivePaymentConfigurations"
        type: "java.util.List"
        required: true
  - id: "StartNode9"
    name: "GetDefaultPaymentInstrumentInfoByUser"
    mode: "private"
    strict: true
    inputs:
      - key: "User"
        type: "com.intershop.beehive.core.capi.user.User"
        required: true

steps:
  - id: "AddEntryToMap2"
    type: "pipelet"
    ref: "AddEntryToMap"
    bindings:
      InMap: "PaymentConfigurationsIndexedByService"
      Key: "PaymentConfigurationBO:PaymentService:ID"
      Value: "PaymentConfigurationBO"
      OutMap: "PaymentConfigurationsIndexedByService"
  - id: "AddEntryToMap4"
    type: "pipelet"
    ref: "AddEntryToMap"
    bindings:
      InMap: "PaymentInstrumentMap"
      Key: "PII:PaymentService"
      Value: "CurrentPIIs"
      OutMap: "PaymentInstrumentMap"
  - id: "AddMultipleEntriesToMap1"
    type: "pipelet"
    ref: "AddMultipleEntriesToMap"
    config:
      Mode: "OverwriteValue"
    bindings:
      InMap: "null"
      Key1: "null"
      Key2: "null"
      Key3: "null"
      Key4: "null"
      Key5: "null"
      Value1: "null"
      Value2: "null"
      Value3: "null"
      Value4: "null"
      Value5: "null"
      OutMap: "PaymentInstrumentMap"
  - id: "AddObjectToVector1"
    type: "pipelet"
    ref: "AddObjectToVector"
    config:
      Mode: "Allow Duplicates"
    bindings:
      InVector: "AutorizationOrders"
      Object: "Order"
      OutVector: "AuthorizationOrders"
      Iterator: "AuthorizationOrderIterator"
  - id: "AddObjectToVector10"
    type: "pipelet"
    ref: "AddObjectToVector"
    bindings:
      InVector: "null"
      Object: "null"
      Objects: "null"
      OutVector: "LimitedTenderPaymentServices"
      Iterator: "null"
  - id: "AddObjectToVector11"
    type: "pipelet"
    ref: "AddObjectToVector"
    config:
      Mode: "Allow Duplicates"
    bindings:
      InVector: "LimitedTenderPaymentServices"
      Objects: "null"
      Object: "PaymentService"
      Iterator: "null"
      OutVector: "LimitedTenderPaymentServices"
  - id: "AddObjectToVector13"
    type: "pipelet"
    ref: "AddObjectToVector"
    bindings:
      InVector: "null"
      Object: "PII"
      Objects: "null"
      OutVector: "CurrentPIIs"
      Iterator: "null"
  - id: "AddObjectToVector14"
    type: "pipelet"
    ref: "AddObjectToVector"
    bindings:
      InVector: "CurrentPIIs"
      Object: "PII"
      Objects: "null"
      OutVector: "CurrentPIIs"
      Iterator: "null"
  - id: "AddObjectToVector15"
    type: "pipelet"
    ref: "AddObjectToVector"
    bindings:
      InVector: "null"
      Object: "PII"
      Objects: "null"
      OutVector: "CurrentPIIs"
      Iterator: "null"
  - id: "AddObjectToVector2"
    type: "pipelet"
    ref: "AddObjectToVector"
    config:
      Mode: "Allow Duplicates"
    bindings:
      InVector: "PaymentTransactionVector"
      Object: "PaymentTransaction"
      OutVector: "PaymentTransactionVector"
      Iterator: "PaymentTransactionIterator"
  - id: "AddObjectToVector3"
    type: "pipelet"
    ref: "AddObjectToVector"
    config:
      Mode: "Allow Duplicates"
    bindings:
      InVector: "PaymentReduceResults"
      Object: "PaymentReduceResult"
      OutVector: "PaymentReduceResults"
      Iterator: "PaymentReduceResultsIterator"
  - id: "AddObjectToVector4"
    type: "pipelet"
    ref: "AddObjectToVector"
    config:
      Mode: "Allow Duplicates"
    bindings:
      InVector: "AutorizationResults"
      Object: "AuthorizationResult"
      OutVector: "AuthorizationResults"
      Iterator: "AuthorizationResultsIterator"
  - id: "AddObjectToVector5"
    type: "pipelet"
    ref: "AddObjectToVector"
    config:
      Mode: "Allow Duplicates"
    bindings:
      InVector: "AutorizationResults"
      Object: "AuthorizationResult"
      OutVector: "AuthorizationResults"
      Iterator: "AuthorizationResultsIterator"
  - id: "AddObjectToVector6"
    type: "pipelet"
    ref: "AddObjectToVector"
    config:
      Mode: "Allow Duplicates"
    bindings:
      InVector: "PaymentRefundResults"
      Object: "PaymentRefundResult"
      OutVector: "PaymentRefundResults"
      Iterator: "PaymentRefundResultsIterator"
  - id: "AddObjectToVector7"
    type: "pipelet"
    ref: "AddObjectToVector"
    config:
      Mode: "Allow Duplicates"
    bindings:
      InVector: "PaymentCancelResults"
      Object: "PaymentCancelResult"
      OutVector: "PaymentCancelResults"
      Iterator: "PaymentCancelResultsIterator"
  - id: "AddObjectToVector8"
    type: "pipelet"
    ref: "AddObjectToVector"
    bindings:
      InVector: "null"
      Object: "null"
      Objects: "null"
      OutVector: "OpenTenderPaymentServices"
      Iterator: "null"
  - id: "AddObjectToVector9"
    type: "pipelet"
    ref: "AddObjectToVector"
    config:
      Mode: "Allow Duplicates"
    bindings:
      InVector: "OpenTenderPaymentServices"
      Objects: "null"
      Object: "PaymentService"
      Iterator: "null"
      OutVector: "OpenTenderPaymentServices"
  - id: "Call1"
    type: "call"
    ref: "ProcessPayment-GetActivePaymentMethods"
    bindings:
      CurrencyMnemonic: "Cart:PurchaseCurrencyCode"
      User: "CurrentUser"
      CurrentApplication: "CurrentAppContext:Variables:Application"
  - id: "CallNode1"
    type: "call"
    ref: "ProcessPaymentInstrument-CreatePaymentInstrumentInfoByUser"
    bindings:
      PaymentService: "PaymentServiceConfiguration:PaymentService"
      CurrentUser: "User"
  - id: "CallNode10"
    type: "call"
    ref: "ProcessPaymentInstrument-GetDefaultPaymentInstrumentInfoByUser"
  - id: "CallNode11"
    type: "call"
    ref: "ProcessCart-Calculate"
    bindings:
      Cart: "Cart"
  - id: "CallNode12"
    type: "call"
    ref: "ProcessPaymentInstrument-DetermineTenderBalance"
    bindings:
      PII: "PaymentInstrumentInfo"
  - id: "CallNode13"
    type: "call"
    ref: "ProcessPaymentInstrument-RemovePaymentInstrumentInfo"
  - id: "CallNode14"
    type: "call"
    ref: "CheckPaymentMethodApplicable-Start"
    bindings:
      Basket: "Cart"
      PaymentConfigurations: "ActivePaymentConfigurations"
  - id: "CallNode15"
    type: "call"
    ref: "ProcessPaymentInstrument-VerifyPaymentInstrumentInfo"
  - id: "CallNode16"
    type: "call"
    ref: "ProcessPayment-VerifyPaymentInstrumentInfo"
  - id: "CallNode17"
    type: "call"
    ref: "This:GetPaymentInstrumentInfosByUser"
  - id: "CallNode18"
    type: "call"
    ref: "ProcessPaymentInstrument-IsPaymentMethodAvailableForUser"
    bindings:
      OwningDomain: "Organization:OwningDomain"
      CurrentUserUserGroups: "UserGroups"
  - id: "CallNode19"
    type: "call"
    ref: "ProcessPayment-ClonePII"
    bindings:
      PaymentInstrumentInfo: "DefaultPaymentInstrumentInfo"
  - id: "CallNode2"
    type: "call"
    ref: "ProcessPaymentInstrument-GetActivePaymentMethodsForUser"
    bindings:
      OwningDomain: "Organization:OwningDomain"
  - id: "CallNode20"
    type: "call"
    ref: "This:CheckIfCartHasDigitalFreight"
  - id: "CallNode21"
    type: "call"
    ref: "ProcessPayment-RemovePaymentInstrumentInfo"
    bindings:
      PaymentInstrumentInfo: "PII"
  - id: "CallNode22"
    type: "call"
    ref: "This:CheckPaymentOnDeliveryCompatibility"
  - id: "CallNode23"
    type: "call"
    ref: "ProcessPaymentInstrument-VerifyPaymentInstrumentInfo"
    bindings:
      PaymentInstrumentInfo: "NewPII"
  - id: "CallNode24"
    type: "call"
    ref: "ProcessPaymentInstrument-ValidateCheckoutData"
  - id: "CallNode25"
    type: "call"
    ref: "ProcessUserGroups-GetCurrentUserUserGroups"
    bindings:
      CurrentOrganization: "Organization"
      CurrentUser: "User"
  - id: "CallNode26"
    type: "call"
    ref: "This:SetReturningCustomerPayment"
  - id: "CallNode27"
    type: "call"
    ref: "This:CheckSelectedPayment"
  - id: "CallNode28"
    type: "call"
    ref: "This:CheckSelectedPayment"
  - id: "CallNode29"
    type: "call"
    ref: "This:RemoveAssignedOpenTenders"
  - id: "CallNode3"
    type: "call"
    ref: "ProcessCart-GetCurrentCartBO"
    bindings:
      Basket: "Cart"
  - id: "CallNode30"
    type: "call"
    ref: "ProcessPayment-GetDefaultPaymentInstrumentInfoByUser"
  - id: "CallNode31"
    type: "call"
    ref: "ProcessPayment-AssignPIItoCart"
    bindings:
      PaymentInstrumentInfo: "ClonedPaymentInstrumentInfo"
  - id: "CallNode32"
    type: "call"
    ref: "This:ReverseAuthorization"
