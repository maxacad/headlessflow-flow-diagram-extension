flow: "ViewOrderExportScheduling"
kind: "view"

entries:
  - id: "Start1"
    name: "Dispatch"
    mode: "private"
    strict: false
    inputs:
      []
  - id: "StartNode3"
    name: "Update"
    mode: "private"
    strict: false
    inputs:
      []
  - id: "StartNode4"
    name: "Edit"
    mode: "private"
    strict: false
    inputs:
      []

steps:
  - id: "CallNode4"
    type: "call"
    ref: "ViewOrderExport-Prefix"
  - id: "CallNode5"
    type: "call"
    ref: "ProcessJobScheduling-Update"
  - id: "CallNode6"
    type: "call"
    ref: "ViewOrderExport-Prefix"
  - id: "DispatchFormAction2"
    type: "pipelet"
    ref: "DispatchFormAction"
    config:
      OutValue_1: "ViewOrderExportScheduling-Update"
      OutValue_2: "ViewOrderExportScheduling-Edit"
    bindings:
      SelectionKey: "JumpTarget"
      Key_1: "update"
      Key_2: "reset"
  - id: "InteractionEnd1"
    type: "interaction"
  - id: "Jump1"
    type: "jump"
    ref: "SecureJump-Start"
  - id: "JumpNode1"
    type: "jump"
    ref: "ViewOrderExportScheduling-Edit"
  - id: "KeyMapper2"
    type: "pipelet"
    ref: "KeyMapper"
    bindings:
      InValue_1: "Config:JobConfiguration"
      OutValue_1: "JobConfiguration"
  - id: "PrepareApplicationView1"
    type: "pipelet"
    ref: "PrepareApplicationView"
    config:
      SelectedMenuItem: "Orders"
      WorkingTemplate: "order/OrderExportScheduling"

links:
  - from: "Start1"
    via: "next"
    to: "DispatchFormAction2"
    into: "in"
  - from: "StartNode4"
    via: "next"
    to: "CallNode4"
    into: "in"
  - from: "CallNode4"
    via: "next"
    to: "PrepareApplicationView1"
    into: "in"
  - from: "CallNode5"
    via: "next"
    to: "JumpNode1"
    into: "in"
  - from: "KeyMapper2"
    via: "next"
    to: "CallNode5"
    into: "in"
  - from: "CallNode6"
    via: "next"
    to: "KeyMapper2"
    into: "in"
  - from: "PrepareApplicationView1"
    via: "next"
    to: "InteractionEnd1"
    into: "in"
  - from: "DispatchFormAction2"
    via: "next"
    to: "Jump1"
    into: "in"
  - from: "StartNode3"
    via: "next"
    to: "CallNode6"
    into: "in"
