flow: "ViewOrganizationSearchIndexConfiguration"
kind: "view"

entries:
  - id: "StartNode1"
    name: "Start"
    mode: "private"
    strict: false
    inputs:
      []
  - id: "StartNode3"
    name: "UpdatePreferences"
    mode: "private"
    strict: false
    inputs:
      []
  - id: "StartNode5"
    name: "UpdateCommonPreferences"
    mode: "private"
    strict: false
    inputs:
      []

steps:
  - id: "CallNode1"
    type: "call"
    ref: "ProcessSearchIndexConfiguration-UpdatePreferences"
  - id: "CallNode2"
    type: "call"
    ref: "ProcessSearchIndexConfiguration-Start"
  - id: "InteractionEnd3"
    type: "interaction"
  - id: "JoinNode8"
    type: "join"
  - id: "JumpNode2"
    type: "jump"
    ref: "This:Start"
  - id: "JumpNode3"
    type: "jump"
    ref: "This:Start"
  - id: "KeyMapper2"
    type: "pipelet"
    ref: "KeyMapper"
    bindings:
      InValue_1: "MasterRepository:OwningDomain"
      OutValue_1: "RepositoryDomain"
  - id: "KeyMapper3"
    type: "pipelet"
    ref: "KeyMapper"
    bindings:
      InValue_1: "MasterRepository:OwningDomain:Site"
      OutValue_1: "PreferenceDomain"
  - id: "PrepareApplicationView4"
    type: "pipelet"
    ref: "PrepareApplicationView"
    config:
      SelectedMenuItem: "Services"
      WorkingTemplate: "searchindex/OrganizationSearchIndexConfiguration"
  - id: "SetDomainPreference6"
    type: "pipelet"
    ref: "SetDomainPreference"
    config:
      Type: "Integer"
      DefaultPreferenceKey: "BrowseBySearchCategoryLevel"
      DefaultPreferenceValue: 1
    bindings:
      PreferenceDomain: "MasterRepository:OwningDomain:Site"
      PreferenceDoubleValue: "null"
      PreferenceKey: "null"
      PreferenceValue: "BrowseBySearchCategoryLevel"
      PreferenceIntValue: "null"
      PreferenceStringValue: "null"

links:
  - from: "CallNode1"
    via: "next"
    to: "JumpNode3"
    into: "in"
  - from: "CallNode2"
    via: "next"
    to: "PrepareApplicationView4"
    into: "in"
  - from: "JoinNode8"
    via: "next"
    to: "JumpNode2"
    into: "in"
  - from: "KeyMapper2"
    via: "next"
    to: "CallNode2"
    into: "in"
  - from: "KeyMapper3"
    via: "next"
    to: "CallNode1"
    into: "in"
  - from: "PrepareApplicationView4"
    via: "next"
    to: "InteractionEnd3"
    into: "in"
  - from: "SetDomainPreference6"
    via: "error"
    to: "JoinNode8"
    into: "in1"
  - from: "SetDomainPreference6"
    via: "next"
    to: "JoinNode8"
    into: "in1"
  - from: "StartNode1"
    via: "next"
    to: "KeyMapper2"
    into: "in"
  - from: "StartNode3"
    via: "next"
    to: "KeyMapper3"
    into: "in"
  - from: "StartNode5"
    via: "next"
    to: "SetDomainPreference6"
    into: "in"
