    bindings:
      ProductConfigurationSections: "Sections"
      RemoveDescriptionIfBlank: "\"(Boolean)false\""
      Validator: "Validator"
      ProductConfigurationOptions: "null"
      ProductConfigurationValues: "null"
      ID: "null"
      Description: "null"
      OverwriteSectionsIfNull: "\"(Boolean)true\""
  - id: "UpdateProductConfigurationValidator3"
