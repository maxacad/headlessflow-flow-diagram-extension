flow: "ProcessProductConfigurationValidator"
kind: "process"

entries:
  - id: "StartNode1"
    name: "CreateValidator"
    mode: "private"
    strict: true
    inputs:
      - key: "TypeCodeName"
        type: "java.lang.String"
        required: true
      - key: "ID"
        type: "java.lang.String"
        required: true
      - key: "ProductConfigurationSet"
        type: "com.intershop.component.productconfiguration.capi.set.ProductConfigurationSetBO"
        required: true
      - key: "Product"
        type: "com.intershop.component.product.capi.ProductBO"
        required: true
      - key: "ProductConfigurationValidatorBORepository"
        type: "com.intershop.component.productconfiguration.capi.validator.ProductConfigurationValidatorBORepository"
        required: true
  - id: "StartNode10"
    name: "MultipleRemove"
    mode: "private"
    strict: true
    inputs:
      - key: "ValidatorIDs"
        type: "java.util.Iterator"
        required: true
      - key: "ProductConfigurationValidatorBORepository"
        type: "com.intershop.component.productconfiguration.capi.validator.ProductConfigurationValidatorBORepository"
        required: true
  - id: "StartNode2"
    name: "GetAllValidatorTypes"
    mode: "private"
    strict: true
    inputs:
      []
  - id: "StartNode3"
    name: "RemoveValidator"
    mode: "private"
    strict: true
    inputs:
      - key: "Validator"
        type: "com.intershop.component.productconfiguration.capi.validator.ProductConfigurationValidatorBO"
        required: true
      - key: "ProductConfigurationValidatorBORepository"
        type: "com.intershop.component.productconfiguration.capi.validator.ProductConfigurationValidatorBORepository"
        required: true
  - id: "StartNode4"
    name: "CreateAssignments"
    mode: "private"
    strict: true
    inputs:
      - key: "SectionRefIDs"
        type: "java.util.Collection"
        required: false
      - key: "OptionRefIDs"
        type: "java.util.Collection"
        required: false
      - key: "ValueRefIDs"
        type: "java.util.Collection"
        required: false
      - key: "Validator"
        type: "com.intershop.component.productconfiguration.capi.validator.ProductConfigurationValidatorBO"
        required: true
      - key: "Domain"
        type: "com.intershop.beehive.core.capi.domain.Domain"
        required: true
  - id: "StartNode5"
    name: "GetValidatorByID"
    mode: "private"
    strict: true
    inputs:
      - key: "ID"
        type: "java.lang.String"
        required: true
      - key: "ProductConfigurationValidatorBORepository"
        type: "com.intershop.component.productconfiguration.capi.validator.ProductConfigurationValidatorBORepository"
        required: true
  - id: "StartNode6"
    name: "CreateSectionAssignments"
    mode: "private"
    strict: true
    inputs:
      - key: "Validator"
        type: "com.intershop.component.productconfiguration.capi.validator.ProductConfigurationValidatorBO"
        required: true
      - key: "SectionRefIDs"
        type: "java.util.Collection"
        required: false
      - key: "ProductConfigurationSetBORepository"
        type: "com.intershop.component.productconfiguration.capi.set.ProductConfigurationSetBORepository"
        required: true
  - id: "StartNode7"
    name: "UpdateValidator"
    mode: "private"
    strict: true
    inputs:
      - key: "Validator"
        type: "com.intershop.component.productconfiguration.capi.validator.ProductConfigurationValidatorBO"
        required: true
      - key: "Description"
        type: "java.lang.String"
        required: false
      - key: "ProductConfigurationOptions"
        type: "java.util.Collection<com.intershop.component.productconfiguration.capi.set.ProductConfigurationOptionBO>"
        required: false
      - key: "ProductConfigurationSections"
        type: "java.util.Collection<com.intershop.component.productconfiguration.capi.set.ProductConfigurationSectionBO>"
        required: false
      - key: "ProductConfigurationValues"
        type: "java.util.Collection<com.intershop.component.productconfiguration.capi.set.ProductConfigurationValueBO>"
        required: false
      - key: "RemoveDescriptionIfBlank"
        type: "java.lang.Boolean"
        required: true
      - key: "ID"
        type: "java.lang.String"
        required: false
