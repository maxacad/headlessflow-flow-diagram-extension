steps:
  - id: "AddObjectToVector1"
    type: "pipelet"
    ref: "AddObjectToVector"
    config:
      Mode: "Allow Duplicates"
    bindings:
      InVector: "Sections"
      Object: "Section"
      OutVector: "Sections"
      Objects: "null"
  - id: "AddObjectToVector2"
    type: "pipelet"
    ref: "AddObjectToVector"
    config:
      Mode: "Allow Duplicates"
    bindings:
      InVector: "Options"
      Object: "Option"
      OutVector: "Options"
      Objects: "null"
  - id: "AddObjectToVector3"
    type: "pipelet"
    ref: "AddObjectToVector"
    config:
      Mode: "Allow Duplicates"
    bindings:
      InVector: "Values"
      Object: "Value"
      OutVector: "Values"
      Objects: "null"
  - id: "AssignValidatorToProductConfigurationSet1"
    type: "pipelet"
    ref: "AssignValidatorToProductConfigurationSet"
    bindings:
      ProductConfigurationValidator: "Validator"
  - id: "CallNode1"
    type: "call"
    ref: "ProcessProductConfigurationValidator-RemoveValidator"
    bindings:
      Validator: "Validator"
  - id: "CallNode2"
    type: "call"
    ref: "ProcessProductConfigurationValidator-CreateSectionAssignments"
    bindings:
      Validator: "Validator"
      Domain: "Domain"
      SectionRefIDs: "SectionRefIDs"
  - id: "CallNode3"
    type: "call"
    ref: "ProcessProductConfigurationValidator-CreateOptionAssignments"
    bindings:
      Domain: "Domain"
      OptionRefIDs: "OptionRefIDs"
      Validator: "Validator"
  - id: "CallNode4"
    type: "call"
    ref: "ProcessProductConfigurationValidator-CreateValueAssignments"
    bindings:
      Domain: "Domain"
      Validator: "Validator"
      ValueRefIDs: "ValueRefIDs"
  - id: "CreateIteratorFromConfigValues1"
    type: "pipelet"
    ref: "CreateIteratorFromConfigValues"
    config:
      Values: "ValidatorOptionIsDefaultvalue;ValidatorOptionIsNotVisible;ValidatorOptionIsRequired;ValidatorOptionWithProfanityCheck;ValidatorOptionWithValueList"
    bindings:
      ValuesIterator: "AllValidatorTypes"
  - id: "CreateProductConfigurationValidator1"
    type: "pipelet"
    ref: "CreateProductConfigurationValidator"
  - id: "DecisionNode1"
    type: "decision"
    condition: "ID"
  - id: "DecisionNode2"
    type: "decision"
    condition: "ID"
  - id: "EndNode1"
    type: "end"
    strict: true
    outputs:
      - key: "Validator"
        type: "com.intershop.component.productconfiguration.capi.validator.ProductConfigurationValidatorBO"
        guaranteed: true
  - id: "EndNode10"
    type: "end"
    strict: true
  - id: "EndNode11"
    type: "end"
    strict: true
    outputs:
      - key: "Validator"
        type: "com.intershop.component.productconfiguration.capi.validator.ProductConfigurationValidatorBO"
        guaranteed: true
  - id: "EndNode12"
    type: "end"
    strict: true
    outputs:
      - key: "ERROR_VALIDATOR_NOT_UPDATED"
        type: "java.lang.String"
        guaranteed: true
  - id: "EndNode13"
    type: "end"
    strict: true
  - id: "EndNode14"
    type: "end"
    strict: true
  - id: "EndNode15"
    type: "end"
    strict: true
  - id: "EndNode16"
