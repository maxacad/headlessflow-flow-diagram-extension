    ref: "GetProductConfigurationValueByRef"
    bindings:
      ProductConfigurationValue: "Value"
      Domain: "Domain"
      ProductConfigurationValueRefID: "ValueRefID"
  - id: "JoinNode1"
    type: "join"
  - id: "JoinNode2"
    type: "join"
  - id: "JoinNode3"
    type: "join"
  - id: "JoinNode4"
    type: "join"
  - id: "JoinNode5"
    type: "join"
  - id: "JoinNode6"
