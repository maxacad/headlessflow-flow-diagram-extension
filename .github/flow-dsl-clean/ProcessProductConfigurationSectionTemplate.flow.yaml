        required: false
      - key: "Description"
        type: "java.lang.String"
        required: false
      - key: "MessageType"
        type: "java.lang.String"
        required: false
      - key: "ProductConfigurationSectionTemplate"
        type: "com.intershop.component.productconfiguration.capi.orm.template.ProductConfigurationSectionTemplate"
        required: true
  - id: "StartNode3"
    name: "GetSectionTemplatesSorted"
    mode: "private"
    strict: true
    inputs:
      - key: "Domain"
        type: "com.intershop.beehive.core.capi.domain.Domain"
        required: true
      - key: "SortAttribute"
        type: "java.lang.String"
        required: false
      - key: "SortOrder"
        type: "java.lang.String"
        required: false
      - key: "PageSize"
        type: "java.lang.Integer"
        required: false
  - id: "StartNode4"
    name: "Remove"
    mode: "private"
    strict: true
    inputs:
      - key: "ProductConfigurationSectionTemplate"
        type: "com.intershop.component.productconfiguration.capi.orm.template.ProductConfigurationSectionTemplate"
        required: false
  - id: "StartNode5"
    name: "Copy"
    mode: "private"
    strict: true
    inputs:
      - key: "ProductConfigurationSectionTemplate"
        type: "com.intershop.component.productconfiguration.capi.orm.template.ProductConfigurationSectionTemplate"
        required: true
      - key: "Domain"
        type: "com.intershop.beehive.core.capi.domain.Domain"
        required: false
  - id: "StartNode6"
    name: "MultipleCopy"
    mode: "private"
    strict: true
    inputs:
      - key: "Domain"
        type: "com.intershop.beehive.core.capi.domain.Domain"
        required: true
      - key: "SectionTemplateIDs"
        type: "java.util.Iterator"
        required: true
      - key: "TargetDomain"
        type: "com.intershop.beehive.core.capi.domain.Domain"
        required: false

steps:
  - id: "CallNode1"
    type: "call"
    ref: "ProcessProductConfigurationSectionTemplate-Remove"
  - id: "CallNode2"
    type: "call"
    ref: "ProcessProductConfigurationSectionTemplate-Copy"
    bindings:
      Domain: "TargetDomain"
  - id: "CheckForEmptyString1"
    type: "pipelet"
    ref: "CheckForEmptyString"
    bindings:
      FilledString: "SortAttribute"
