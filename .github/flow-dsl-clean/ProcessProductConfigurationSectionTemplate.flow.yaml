        type: "com.intershop.component.productconfiguration.capi.orm.template.ProductConfigurationSectionTemplate"
        guaranteed: true
  - id: "EndNode12"
    type: "end"
    strict: true
  - id: "EndNode17"
    type: "end"
    strict: true
  - id: "EndNode2"
