      AttributeType: "null"
      ExtensibleObject: "ProductConfigurationSectionTemplate"
      AttributeValue: "MessageType"
  - id: "UpdateDictionary2"
    type: "pipelet"
    ref: "UpdateDictionary"
    config:
      Name_01: "Domain"
      Name_02: "SortOrder"
      Name_03: "SortAttribute"
    bindings:
      Value_01: "Domain"
      OutDictionary: "ImageViewSearchParameters"
      InDictionary: "null"
      Value_02: "SortOrder"
      Value_03: "SortAttribute"
  - id: "UpdateProductConfigurationSectionTemplate1"
    type: "pipelet"
    ref: "UpdateProductConfigurationSectionTemplate"
    bindings:
