        required: true
      - key: "Domain"
        type: "com.intershop.beehive.core.capi.domain.Domain"
        required: true
      - key: "SectionGroup"
        type: "java.lang.String"
        required: false
      - key: "Description"
        type: "java.lang.String"
        required: false
      - key: "MessageType"
        type: "java.lang.String"
        required: false
  - id: "StartNode10"
    name: "MultipleRemove"
    mode: "private"
    strict: true
    inputs:
      - key: "Domain"
        type: "com.intershop.beehive.core.capi.domain.Domain"
        required: true
      - key: "SectionTemplateIDs"
        type: "java.util.Iterator"
        required: true
  - id: "StartNode2"
    name: "Update"
    mode: "private"
    strict: true
