  - id: "SetPage2"
    type: "pipelet"
    ref: "SetPage"
    config:
      DefaultPageNumber: 0
    bindings:
      PageNumber: "PageLocator:PageNumber"
      Pageable: "Repositories"
  - id: "SetPageLocator1"
    type: "pipelet"
    ref: "SetPageLocator"
    config:
      DefaultHandlerPipeline: "ViewContentPreferences-Paging"
      DefaultPageLocatorName: "ChannelList"
    bindings:
      Pageable: "Repositories"
  - id: "UpdateDictionary3"
    type: "pipelet"
    ref: "UpdateDictionary"
    config:
      Name_01: "OwningDomain"
      Name_02: "TypeCodes"
      Name_03: "SortBy"
      Name_04: "SortDirection"
      Name_05: "Locale"
    bindings:
      Value_01: "OrganizationDomain"
      InDictionary: "null"
      OutDictionary: "QueryParameters"
      Value_02: "TypeCodeIterator"
      Value_03: "SortBy"
      Value_04: "SortDirection"
      Value_05: "CurrentSession:Locale"
  - id: "VerifyInteger1"
    type: "pipelet"
    ref: "VerifyInteger"
    bindings:
      IntegerObject: "PageNumber"
      Locale: "null"
      LocalizedString: "PageNumber"
      Pattern: "null"
  - id: "VerifyInteger2"
    type: "pipelet"
    ref: "VerifyInteger"
    bindings:
