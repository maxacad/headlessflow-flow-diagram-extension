flow: "ViewContentPreferences"
kind: "view"

entries:
  - id: "Start1"
    name: "ChannelList"
    mode: "private"
    strict: false
    inputs:
      []
  - id: "Start2"
    name: "Paging"
    mode: "private"
    strict: false
    inputs:
      []
  - id: "Start5"
    name: "Dispatch"
    mode: "private"
    strict: false
    inputs:
      []
  - id: "StartNode1"
    name: "Start"
    mode: "private"
    strict: false
    inputs:
      []
  - id: "StartNode2"
    name: "SelectChannel"
    mode: "private"
    strict: false
    inputs:
      []
  - id: "StartNode3"
    name: "GetTypeCodes"
    mode: "private"
    strict: true
    inputs:
      - key: "TypeCodes"
        type: "java.lang.String"
        required: false
  - id: "StartNode4"
    name: "GetContentSharingChannel"
    mode: "private"
    strict: true
    inputs:
      - key: "OrganizationDomain"
        type: "com.intershop.beehive.core.capi.domain.Domain"
        required: true

steps:
  - id: "AddObjectToVector1"
    type: "pipelet"
    ref: "AddObjectToVector"
    bindings:
      Object: "IntegerObject"
      InVector: "TypeCodeVector"
      OutVector: "TypeCodeVector"
      Iterator: "TypeCodeIterator"
      Objects: "null"
  - id: "CallNode1"
    type: "call"
    ref: "ProcessStorefrontEditing-GetContentSharingChannel"
  - id: "CallNode2"
    type: "call"
    ref: "This:GetTypeCodes"
    bindings:
      TypeCodes: "\"42;52\""
  - id: "CreateIteratorFromConfigValues1"
    type: "pipelet"
    ref: "CreateIteratorFromConfigValues"
    config:
      Delimiters: ";"
    bindings:
      ValuesString: "TypeCodes"
      ValuesIterator: "TypeCodeStringIterator"
  - id: "Decision1"
    type: "decision"
    condition: "PageNumber"
  - id: "DecisionNode1"
    type: "decision"
    condition: "SelectedChannelDomainName"
  - id: "DecisionNode2"
    type: "decision"
    condition: "MasterPageEditing_Switch"
  - id: "DecisionNode3"
    type: "decision"
    condition: "ReadonlyIfFuture_Switch"
  - id: "DecisionNode6"
    type: "decision"
    condition: "TypeCodes"
  - id: "DispatchFormAction2"
    type: "pipelet"
    ref: "DispatchFormAction"
    config:
      OutValue_0: "ViewContentPreferences-Start"
      OutValue_1: "ViewContentPreferences-ChannelList"
      OutValue_2: "ViewContentPreferences-Paging"
      PagingPipeline: "ViewContentPreferences-Paging"
      OutValue_3: "ViewContentPreferences-Start"
      OutValue_4: "ViewContentPreferences-SelectChannel"
    bindings:
      SelectionKey: "JumpTarget"
      Key_0: "Start"
      Key_1: "ChannelList"
      Key_2: "Paging"
      Key_3: "Cancel"
      Key_4: "SelectChannel"
  - id: "EndNode1"
    type: "end"
    strict: true
    outputs:
      - key: "ContentSharingChannel"
        type: "com.intershop.component.mvc.capi.catalog.Repository"
        guaranteed: false
  - id: "EndNode4"
    type: "end"
    strict: true
    outputs:
      - key: "TypeCodeIterator"
        type: "java.util.Iterator"
        guaranteed: false
  - id: "ExecutePageableQuery2"
    type: "pipelet"
    ref: "ExecutePageableQuery"
    config:
      QueryName: "repository/GetRepositoriesByOwningDomain"
      DefaultPageSize: 15
    bindings:
      Query: "null"
      Connection: "null"
      PageSize: "null"
      SearchResult: "Repositories"
      Parameters: "QueryParameters"
      ErrorCode: "SearchExecutionError"
  - id: "GetChannelTypes1"
    type: "pipelet"
    ref: "GetChannelTypes"
  - id: "GetDomainPreference1"
    type: "pipelet"
    ref: "GetDomainPreference"
    config:
      Type: "String"
    bindings:
      PreferenceDomain: "OrganizationDomain"
      PreferenceKey: "\"ContentSharingChannel\""
      Preference: "ContentSharingChannelPreference"
  - id: "GetDomainPreference2"
    type: "pipelet"
    ref: "GetDomainPreference"
    config:
      Type: "String"
      DefaultPreferenceKey: "MasterPageEditing"
    bindings:
      PreferenceDomain: "OrganizationDomain"
      Preference: "MasterPageEditinglPreference"
  - id: "GetDomainPreference3"
    type: "pipelet"
    ref: "GetDomainPreference"
    config:
      DefaultPreferenceKey: "MasterPageEditing"
      Type: "String"
    bindings:
      PreferenceDomain: "OrganizationDomain"
      PreferenceStringValue: "PreviousMasterPageEditingValue"
  - id: "GetDomainPreference4"
    type: "pipelet"
    ref: "GetDomainPreference"
    config:
      Type: "String"
      DefaultPreferenceKey: "SFEReadonlyIfFuture"
    bindings:
      PreferenceDomain: "OrganizationDomain"
      Preference: "ReadonlyIfFuturePreference"
  - id: "GetPageLocator1"
    type: "pipelet"
    ref: "GetPageLocator"
    config:
      RestorePageLocatorDictionary: "True"
  - id: "GetPageable1"
    type: "pipelet"
    ref: "GetPageable"
    bindings:
      Pageable: "Repositories"
      PageableID: "PageLocator:PageableID"
  - id: "InteractionEnd1"
    type: "interaction"
  - id: "InteractionEnd2"
    type: "interaction"
  - id: "Join1"
    type: "join"
  - id: "Join5"
    type: "join"
  - id: "JoinNode1"
    type: "join"
  - id: "JoinNode14"
    type: "join"
  - id: "JoinNode15"
