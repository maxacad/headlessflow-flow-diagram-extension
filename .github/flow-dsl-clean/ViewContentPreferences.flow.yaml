      WorkingTemplate: "content/ChannelSelectionPreference"
  - id: "SetDomainPreference1"
    type: "pipelet"
    ref: "SetDomainPreference"
    config:
      Type: "String"
    bindings:
      PreferenceDomain: "OrganizationDomain"
      PreferenceStringValue: "SelectedChannelDomainName"
      PreferenceKey: "\"ContentSharingChannel\""
  - id: "SetDomainPreference2"
    type: "pipelet"
    ref: "SetDomainPreference"
    config:
      Type: "String"
      DefaultPreferenceKey: "MasterPageEditing"
    bindings:
      PreferenceDomain: "OrganizationDomain"
      PreferenceStringValue: "MasterPageEditing_Switch"
  - id: "SetDomainPreference3"
    type: "pipelet"
    ref: "SetDomainPreference"
    config:
      Type: "String"
      DefaultPreferenceKey: "MasterPageEditing"
      DefaultPreferenceValue: true
    bindings:
      PreferenceDomain: "OrganizationDomain"
  - id: "SetDomainPreference4"
    type: "pipelet"
