  - id: "CallNode9"
    type: "call"
    ref: "ProcessLocalizations-GetContextApp"
  - id: "DecisionNode1"
    type: "decision"
    condition: "LocalizationRepositories"
  - id: "DetermineLocales1"
    type: "pipelet"
    ref: "DetermineLocales"
  - id: "EndNode3"
    type: "end"
    strict: false
  - id: "GetLocale2"
    type: "pipelet"
    ref: "GetLocale"
    config:
      LocaleFallback: "Session Locale"
    bindings:
      LocaleId: "search_LocaleId"
      Locale: "DefaultLocale"
  - id: "InteractionNode1"
    type: "interaction"
  - id: "InteractionNode2"
    type: "interaction"
  - id: "JoinNode1"
    type: "join"
  - id: "JoinNode2"
    type: "join"
  - id: "JoinNode3"
    type: "join"
  - id: "JoinNode4"
    type: "join"
  - id: "JoinNode5"
    type: "join"
  - id: "JoinNode6"
