  - id: "JumpNode1"
    type: "jump"
    ref: "SecureJump-Start"
  - id: "JumpNode4"
    type: "jump"
    ref: "Error-Start"
  - id: "KeyMapper0"
    type: "pipelet"
    ref: "KeyMapper"
    bindings:
      InValue_1: "ApplicationBO:DefaultLocale:LocaleID"
      InValue_2: "null"
      InValue_10: "null"
      InValue_3: "null"
      InValue_4: "null"
      InValue_5: "null"
      InValue_6: "null"
      InValue_7: "null"
      InValue_9: "null"
