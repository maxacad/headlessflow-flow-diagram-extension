      OutValue_10: "null"
      OutValue_2: "null"
      OutValue_3: "null"
      OutValue_4: "null"
      OutValue_5: "null"
      OutValue_6: "null"
      OutValue_7: "null"
      OutValue_8: "null"
      OutValue_9: "null"
  - id: "KeyMapper4"
    type: "pipelet"
    ref: "KeyMapper"
    bindings:
      InValue_1: "PageLocator:PageNumber"
      OutValue_1: "_PageNumber"
  - id: "Pipelet1"
    type: "pipelet"
    ref: "PrepareApplicationView"
    config:
      SelectedMenuItem: "Localization"
      WorkingTemplate: "localization/LocalizationOverview"
  - id: "Pipelet10"
    type: "pipelet"
    ref: "KeyMapper"
    bindings:
      InValue_1: 0
      OutValue_1: "PageNumber"
  - id: "Pipelet11"
    type: "pipelet"
    ref: "GetPageLocator"
    config:
      DefaultPageLocatorName: "LocalizationTextsLocator"
      RestorePageLocatorDictionary: "True"
      UsePageLocatorHistory: false
  - id: "Pipelet12"
    type: "pipelet"
    ref: "GetPageable"
    bindings:
      PageableID: "\"LocalizationTextsPageableID\""
      Pageable: "LocalizationTexts"
  - id: "Pipelet13"
    type: "pipelet"
    ref: "CreateLocalizationContextFromApp"
    bindings:
      App: "ContextApp"
      LocaleInformation: "Locale"
      OwningDomain: "CurrentOrganization:Domain"
  - id: "Pipelet2"
    type: "pipelet"
    ref: "GetPageLocator"
    config:
      DefaultPageLocatorName: "LocalizationTextsLocator"
      RestorePageLocatorDictionary: "True"
      UsePageLocatorHistory: false
  - id: "Pipelet4"
    type: "pipelet"
    ref: "DispatchFormAction"
    config:
      OutValue_0: "ViewLocalizations-Management"
      OutValue_1: "ViewLocalizations-Management"
      OutValue_2: "ViewLocalizations-Save"
      OutValue_3: "ViewLocalizations-Management"
    bindings:
      Key_0: "Apply"
      Key_1: "Find"
      Key_2: "Save"
      Key_3: "CancelUpdate"
      SelectionKey: "JumpTarget"
  - id: "Pipelet5"
    type: "pipelet"
    ref: "FireReloadLocalizationEvent"
  - id: "Pipelet6"
    type: "pipelet"
    ref: "SetDictionaryValue"
    config:
      Name: "JumpTarget"
      Value: "ViewLocalization-Management"
      ValueType: "Dictionary Value"
  - id: "Pipelet7"
    type: "pipelet"
    ref: "GetLocale"
    config:
      LocaleFallback: "Lead Locale"
  - id: "PrepareApplicationView1"
    type: "pipelet"
    ref: "PrepareApplicationView"
    config:
      SelectedMenuItem: "Localization"
      WorkingTemplate: "localization/LocalizationManagement"
  - id: "PrepareApplicationView2"
    type: "pipelet"
    ref: "PrepareApplicationView"
    config:
      SelectedMenuItem: "Localization"
      WorkingTemplate: "localization/LocalizationManagement"
  - id: "ToString1"
    type: "pipelet"
    ref: "ToString"
    bindings:
      Object1: "_PageNumber"
      String1: "PageNumber"

