flow: "ABTestSearch"
kind: "process"

entries:
  - id: "Start1"
    name: "GetSelectionFromClipboard"
    mode: "private"
    strict: true
    inputs:
      - key: "ABTestSearchForm"
        type: "com.intershop.beehive.core.capi.webform.Form"
        required: false
      - key: "PageNames"
        type: "com.intershop.beehive.foundation.util.ResettableIterator"
        required: false
      - key: "ComponentNames"
        type: "com.intershop.beehive.foundation.util.ResettableIterator"
        required: false
      - key: "PromotionNames"
        type: "com.intershop.beehive.foundation.util.ResettableIterator"
        required: false
  - id: "Start2"
    name: "UpdateComponentSelection"
    mode: "private"
    strict: true
    inputs:
      - key: "UUIDIterator"
        type: "java.util.Iterator"
        required: true
  - id: "Start5"
    name: "PreparePromotionSearchString"
    mode: "private"
    strict: true
    inputs:
      - key: "ClipboardName"
        type: "java.lang.String"
        required: false
      - key: "UUIDIterator"
        type: "java.util.Iterator"
        required: false
      - key: "SelectedPromotionUUID"
        type: "java.lang.String[]"
        required: false
      - key: "AllPromotionUUIDs"
        type: "java.lang.String[]"
        required: false
  - id: "Start6"
    name: "UpdatePageSelection"
    mode: "private"
    strict: true
    inputs:
      - key: "UUIDIterator"
        type: "java.util.Iterator"
        required: true
  - id: "Start7"
    name: "UpdatePromotionSelection"
    mode: "private"
    strict: true
    inputs:
      - key: "UUIDIterator"
        type: "java.util.Iterator"
        required: true
  - id: "StartNode1"
    name: "AdvancedSearch"
    mode: "private"
    strict: false
    inputs:
      []
  - id: "StartNode10"
    name: "PrepareContentSearchString"
    mode: "private"
    strict: true
    inputs:
      - key: "ClipboardName"
        type: "java.lang.String"
        required: false
      - key: "CurrentChannel"
        type: "com.intershop.component.mvc.capi.catalog.Repository"
        required: false
      - key: "AllPageletUUIDs"
        type: "java.lang.String[]"
        required: false
      - key: "ContentRepository"
        type: "com.intershop.component.mvc.capi.catalog.Repository"
        required: false
      - key: "SelectedPageletUUID"
        type: "java.lang.String[]"
        required: false
      - key: "UniquePageletSearchID"
        type: "java.lang.String"
        required: false
      - key: "UUIDIterator"
        type: "java.util.Iterator"
        required: false
  - id: "StartNode2"
    name: "Sort"
    mode: "private"
    strict: false
    inputs:
      []
  - id: "StartNode3"
    name: "VerifySearchTerm"
    mode: "private"
    strict: true
    inputs:
      - key: "SearchTerm"
        type: "java.lang.String"
        required: false
  - id: "StartNode4"
    name: "SearchAll"
    mode: "private"
    strict: true
    inputs:
      - key: "QueryParameters"
        type: "java.util.Map"
        required: false
      - key: "SortBy"
        type: "java.lang.String"
        required: false
      - key: "SortDirection"
        type: "java.lang.String"
        required: false
      - key: "CurrentChannel"
        type: "com.intershop.component.mvc.capi.catalog.Repository"
        required: false
      - key: "ABTestSearchForm"
        type: "com.intershop.beehive.core.capi.webform.Form"
        required: false
      - key: "ComponentNames"
        type: "java.util.Iterator"
        required: false
      - key: "PageNames"
        type: "java.util.Iterator"
        required: false
      - key: "PromotionNames"
        type: "java.util.Iterator"
        required: false
  - id: "StartNode6"
    name: "PrepareSelectObjectSearch"
    mode: "private"
    strict: true
    inputs:
      - key: "ClipboardName"
        type: "java.lang.String"
        required: false
      - key: "CurrentChannel"
        type: "com.intershop.component.mvc.capi.catalog.Repository"
        required: false
      - key: "AllPageletUUIDs"
        type: "java.lang.String[]"
        required: false
      - key: "ContentRepository"
        type: "com.intershop.component.mvc.capi.catalog.Repository"
        required: false
      - key: "SelectedPageletUUID"
        type: "java.lang.String[]"
        required: false
      - key: "UniquePageletSearchID"
        type: "java.lang.String"
        required: false
      - key: "UUIDIterator"
        type: "java.util.Iterator"
        required: false
      - key: "AllPromotionUUIDs"
        type: "java.lang.String[]"
        required: false
      - key: "SelectedPromotionUUID"
        type: "java.lang.String[]"
        required: false
      - key: "ABTestSearchForm"
        type: "com.intershop.beehive.core.capi.webform.Form"
        required: false
      - key: "PageNames"
        type: "com.intershop.beehive.foundation.util.ResettableIterator"
        required: false
      - key: "ComponentNames"
        type: "com.intershop.beehive.foundation.util.ResettableIterator"
        required: false
      - key: "PromotionNames"
        type: "com.intershop.beehive.foundation.util.ResettableIterator"
        required: false
      - key: "PageFlag"
        type: "java.lang.String"
        required: false
  - id: "StartNode7"
    name: "PrepareForm"
    mode: "private"
    strict: true
    inputs:
      - key: "ABTestSearchForm"
        type: "com.intershop.beehive.core.capi.webform.Form"
        required: false
      - key: "CurrentDomain"
        type: "com.intershop.beehive.core.capi.domain.Domain"
        required: false
      - key: "ABTestSearch_ABTestName"
        type: "java.lang.String"
        required: false
      - key: "ABTestSearch_ComponentName"
        type: "java.lang.String"
        required: false
      - key: "ABTestSearch_EndDate"
        type: "java.lang.String"
        required: false
      - key: "ABTestSearch_Page"
        type: "java.lang.String"
        required: false
      - key: "ABTestSearch_PageName"
        type: "java.lang.String"
        required: false
      - key: "ABTestSearch_PromotionName"
        type: "java.lang.String"
        required: false
      - key: "ABTestSearch_StartDate"
        type: "java.lang.String"
        required: false
      - key: "ABTestSearch_Status"
        type: "java.lang.String"
        required: false
      - key: "ABTestSearch_Component"
        type: "java.lang.String"
        required: false
      - key: "ABTestSearch_Promotion"
        type: "java.lang.String"
        required: false
      - key: "ABTestSearch_Type"
        type: "java.lang.String"
        required: false
      - key: "ABTestSearch_Enabled"
        type: "java.lang.String"
        required: false

steps:
  - id: "AddObjectToVector1"
    type: "pipelet"
    ref: "AddObjectToVector"
    config:
      Mode: "Forbid Duplicates"
    bindings:
      Object: "Pagelet"
      InVector: "ContentsVector"
      Iterator: "ContentsIterator"
      OutVector: "ContentsVector"
  - id: "AddObjectToVector2"
    type: "pipelet"
    ref: "AddObjectToVector"
    config:
      Mode: "Forbid Duplicates"
    bindings:
      Object: "Promotion"
      InVector: "PromotionVector"
      Iterator: "PromotionIterator"
      OutVector: "PromotionVector"
  - id: "CallNode1"
    type: "call"
    ref: "ABTestSearch-UpdatePageSelection"
  - id: "CallNode11"
    type: "call"
    ref: "ProcessPageletSearch-RemoveCurrentClipboard"
  - id: "CallNode15"
    type: "call"
    ref: "ABTestSearch-PrepareContentSearchString"
  - id: "CallNode18"
    type: "call"
    ref: "ProcessPageletSearch-UpdateClipboard"
  - id: "CallNode19"
    type: "call"
    ref: "ProcessPageletSearch-GetContentRepository"
  - id: "CallNode2"
    type: "call"
    ref: "ABTestSearch-GetSelectionFromClipboard"
  - id: "CallNode21"
    type: "call"
    ref: "ABTestSearch-PreparePromotionSearchString"
  - id: "CallNode4"
    type: "call"
    ref: "ABTestSearch-UpdateComponentSelection"
  - id: "CallNode5"
    type: "call"
    ref: "ABTestSearch-PrepareSelectObjectSearch"
  - id: "CallNode6"
    type: "call"
    ref: "ABTestSearch-PrepareForm"
  - id: "CallNode7"
    type: "call"
    ref: "ABTestSearch-UpdatePromotionSelection"
  - id: "CallNode8"
    type: "call"
    ref: "ABTestSearch-VerifySearchTerm"
    bindings:
      SearchTerm: "ABTestSearch_ABTestName"
      SearchExpression: "ABTestNameExpression"
  - id: "CallNode9"
    type: "call"
    ref: "ABTestSearch-SearchAll"
  - id: "CheckForEmptyIterator1"
    type: "pipelet"
    ref: "CheckForEmptyIterator"
    bindings:
      FilledIterator: "UUIDIterator"
  - id: "CheckForEmptyIterator3"
    type: "pipelet"
    ref: "CheckForEmptyIterator"
    bindings:
      FilledIterator: "UUIDIterator"
  - id: "CheckForEmptyString1"
    type: "pipelet"
    ref: "CheckForEmptyString"
    bindings:
      FilledString: "ABTestSearchForm:PageName:FormattedValue"
  - id: "CheckForEmptyString2"
    type: "pipelet"
    ref: "CheckForEmptyString"
    bindings:
      FilledString: "ABTestSearchForm:ComponentName:FormattedValue"
  - id: "CheckForEmptyString4"
    type: "pipelet"
    ref: "CheckForEmptyString"
    bindings:
      FilledString: "ABTestSearchForm:PromotionName:FormattedValue"
  - id: "CreateForm1"
    type: "pipelet"
    ref: "CreateForm"
    config:
      FormName: "ABTestSearch"
      FormResource: "ABTestSearch"
    bindings:
      Form: "ABTestSearchForm"
  - id: "DecisionNode1"
    type: "decision"
    condition: "PageNames"
  - id: "DecisionNode2"
    type: "decision"
    condition: "ABTestSearchForm"
  - id: "DecisionNode3"
    type: "decision"
    condition: "PageFlag"
  - id: "DecisionNode4"
    type: "decision"
    condition: "ABTestSearchForm:Submitted"
  - id: "DecisionNode5"
    type: "decision"
    condition: "ComponentNames"
  - id: "DecisionNode6"
    type: "decision"
    condition: "PromotionNames"
  - id: "DecisionNode7"
    type: "decision"
    condition: "QueryParameters"
  - id: "DecisionNode8"
    type: "decision"
    condition: "SearchTerm"
  - id: "DecisionNode9"
    type: "decision"
    condition: "SearchTerm"
  - id: "EndNode1"
    type: "end"
    strict: true
  - id: "EndNode10"
    type: "end"
    strict: true
    outputs:
      - key: "PromotionIterator"
        type: "java.util.Iterator"
        guaranteed: false
      - key: "UUIDIterator"
        type: "java.util.Iterator"
        guaranteed: false
  - id: "EndNode11"
    type: "end"
    strict: true
  - id: "EndNode12"
    type: "end"
    strict: true
    outputs:
      - key: "PageIDs"
        type: "java.util.Iterator"
        guaranteed: false
      - key: "ComponentIDs"
        type: "java.util.Iterator"
        guaranteed: false
      - key: "PromotionIDs"
        type: "java.util.Iterator"
        guaranteed: false
  - id: "EndNode13"
    type: "end"
    strict: true
    outputs:
      - key: "ComponentIDsClipboard"
        type: "com.intershop.component.foundation.capi.clipboard.Clipboard"
        guaranteed: false
  - id: "EndNode14"
    type: "end"
    strict: false
  - id: "EndNode15"
    type: "end"
    strict: true
    outputs:
      - key: "ABTests"
        type: "com.intershop.beehive.core.capi.paging.PageableIterator"
        guaranteed: false
  - id: "EndNode16"
    type: "end"
    strict: true
    outputs:
      - key: "PromotionIDsClipboard"
        type: "com.intershop.component.foundation.capi.clipboard.Clipboard"
        guaranteed: false
  - id: "EndNode17"
    type: "end"
    strict: true
    outputs:
      - key: "ABTestSearchForm"
        type: "com.intershop.beehive.core.capi.webform.Form"
        guaranteed: false
  - id: "EndNode2"
    type: "end"
    strict: false
  - id: "EndNode3"
    type: "end"
    strict: true
    outputs:
      - key: "PromotionNames"
        type: "java.util.Iterator"
        guaranteed: false
      - key: "ComponentNames"
        type: "java.util.Iterator"
        guaranteed: false
      - key: "PageNames"
        type: "java.util.Iterator"
        guaranteed: false
  - id: "EndNode4"
    type: "end"
    strict: true
    outputs:
      - key: "PageIDsClipboard"
        type: "com.intershop.component.foundation.capi.clipboard.Clipboard"
        guaranteed: false
  - id: "EndNode5"
    type: "end"
    strict: true
  - id: "EndNode6"
    type: "end"
    strict: true
    outputs:
      - key: "SearchExpression"
        type: "com.intershop.component.foundation.capi.search.SearchExpression"
        guaranteed: false
  - id: "EndNode7"
    type: "end"
    strict: true
    outputs:
      - key: "ContentsIterator"
        type: "java.util.Iterator"
        guaranteed: false
      - key: "UUIDIterator"
        type: "java.util.Iterator"
        guaranteed: false
  - id: "EndNode8"
    type: "end"
    strict: true
    outputs:
      - key: "ABTestSearchForm"
        type: "com.intershop.beehive.core.capi.webform.Form"
        guaranteed: false
  - id: "ExecutePageableQuery1"
    type: "pipelet"
    ref: "ExecutePageableQuery"
    config:
      DefaultPageSize: 15
      QueryName: "marketing/AdvancedABTestSearch"
      Datasource: "default"
    bindings:
      Parameters: "QueryParameters"
      SearchResult: "ABTests"
  - id: "GetClipboard1"
    type: "pipelet"
    ref: "GetClipboard"
    config:
      SetFormValues: "No"
    bindings:
      SessionRegistrationID: "ClipboardName"
  - id: "GetClipboard2"
    type: "pipelet"
    ref: "GetClipboard"
    config:
      SetFormValues: "No"
      SessionRegistrationID: "ComponentIDsClipboard"
    bindings:
      SessionRegistrationID: "\"ComponentIDsClipboard\""
      UUIDIterator: "ComponentIDs"
  - id: "GetClipboard5"
    type: "pipelet"
    ref: "GetClipboard"
    config:
      SetFormValues: "No"
      SessionRegistrationID: "PageIDsClipboard"
    bindings:
      SessionRegistrationID: "\"PageIDsClipboard\""
      UUIDIterator: "PageIDs"
  - id: "GetClipboard6"
    type: "pipelet"
    ref: "GetClipboard"
    config:
      SetFormValues: "No"
      SessionRegistrationID: "PromotionIDsClipboard"
    bindings:
      SessionRegistrationID: "\"PromotionIDsClipboard\""
      UUIDIterator: "PromotionIDs"
  - id: "GetFormSelection1"
    type: "pipelet"
    ref: "GetFormSelection"
    config:
      DefaultParameterName: "SelectedPromotionUUID"
    bindings:
      Selection: "SelectedPromotionsUUIDIterator"
  - id: "GetFormSelection2"
    type: "pipelet"
    ref: "GetFormSelection"
    config:
      DefaultParameterName: "AllPromotionUUIDs"
    bindings:
      Selection: "PromotionsUUIDIterator"
  - id: "GetLocale1"
    type: "pipelet"
    ref: "GetLocale"
    config:
      LocaleFallback: "Lead Locale"
    bindings:
      LocaleId: "CurrentRequest:Locale:LocaleID"
      Locale: "Locale"
  - id: "GetPageletByUUID1"
    type: "pipelet"
    ref: "GetPageletByUUID"
    bindings:
      PageletUUID: "ObjectUUID"
  - id: "GetPromotionByUUID6"
    type: "pipelet"
    ref: "GetPromotionByUUID"
    bindings:
      PromotionUUID: "ObjectUUID"
  - id: "GetStringSubstitution1"
    type: "pipelet"
    ref: "GetStringSubstitution"
    config:
      DefaultPattern: "\\\""
    bindings:
      InputString: "SearchTerm"
      OutputString: "SearchTerm"
  - id: "JoinNode1"
    type: "join"
  - id: "JoinNode10"
    type: "join"
  - id: "JoinNode11"
    type: "join"
  - id: "JoinNode12"
    type: "join"
  - id: "JoinNode16"
    type: "join"
  - id: "JoinNode17"
    type: "join"
  - id: "JoinNode18"
    type: "join"
  - id: "JoinNode19"
    type: "join"
  - id: "JoinNode2"
    type: "join"
  - id: "JoinNode3"
    type: "join"
  - id: "JoinNode34"
    type: "join"
  - id: "JoinNode35"
    type: "join"
  - id: "JoinNode37"
    type: "join"
  - id: "JoinNode4"
    type: "join"
  - id: "JoinNode5"
    type: "join"
  - id: "JoinNode6"
    type: "join"
  - id: "JoinNode7"
    type: "join"
  - id: "JoinNode8"
    type: "join"
  - id: "JoinNode9"
    type: "join"
  - id: "KeyMapper1"
    type: "pipelet"
    ref: "KeyMapper"
    bindings:
      InValue_1: "PromotionIterator"
      OutValue_1: "PromotionNames"
  - id: "KeyMapper3"
    type: "pipelet"
    ref: "KeyMapper"
    bindings:
      InValue_1: "ContentsIterator"
      OutValue_1: "PageNames"
  - id: "KeyMapper4"
    type: "pipelet"
    ref: "KeyMapper"
    bindings:
      InValue_1: "ContentsIterator"
      OutValue_1: "ComponentNames"
  - id: "Loop2"
    type: "loop"
  - id: "Loop3"
    type: "loop"
  - id: "RemoveClipboard1"
    type: "pipelet"
    ref: "RemoveClipboard"
    bindings:
      SessionRegistrationID: "\"PageIDsClipboard\""
  - id: "RemoveClipboard2"
    type: "pipelet"
    ref: "RemoveClipboard"
    bindings:
      SessionRegistrationID: "\"PromotionIDsClipboard\""
  - id: "RemoveClipboard3"
    type: "pipelet"
    ref: "RemoveClipboard"
    bindings:
      SessionRegistrationID: "\"ComponentIDsClipboard\""
  - id: "RemoveClipboard4"
    type: "pipelet"
    ref: "RemoveClipboard"
    bindings:
      SessionRegistrationID: "\"PageIDsClipboard\""
  - id: "RemoveClipboard5"
    type: "pipelet"
    ref: "RemoveClipboard"
    bindings:
      SessionRegistrationID: "\"PromotionIDsClipboard\""
  - id: "RemoveClipboard7"
    type: "pipelet"
    ref: "RemoveClipboard"
    bindings:
      SessionRegistrationID: "\"ComponentIDsClipboard\""
  - id: "UpdateClipboard2"
    type: "pipelet"
    ref: "UpdateClipboard"
    config:
      StoreFormValues: "No"
      SessionRegistrationID: "PageIDsClipboard"
    bindings:
      AllObjectUUIDs: "null"
      SelectedObjectUUIDs: "UUIDIterator"
      SessionRegistrationID: "\"PageIDsClipboard\""
      Clipboard: "PageIDsClipboard"
  - id: "UpdateClipboard3"
    type: "pipelet"
    ref: "UpdateClipboard"
    config:
      StoreFormValues: "No"
      SessionRegistrationID: "ComponentIDsClipboard"
    bindings:
      AllObjectUUIDs: "null"
      SelectedObjectUUIDs: "UUIDIterator"
      SessionRegistrationID: "\"ComponentIDsClipboard\""
      Clipboard: "ComponentIDsClipboard"
  - id: "UpdateClipboard4"
    type: "pipelet"
    ref: "UpdateClipboard"
    config:
      StoreFormValues: "No"
      SessionRegistrationID: "PromotionIDsClipboard"
    bindings:
      AllObjectUUIDs: "null"
      SelectedObjectUUIDs: "UUIDIterator"
      SessionRegistrationID: "PromotionIDsClipboard"
      Clipboard: "PromotionIDsClipboard"
  - id: "UpdateDictionary1"
    type: "pipelet"
    ref: "UpdateDictionary"
    config:
      Name_01: "Status"
      Name_02: "StartDate"
      Name_03: "EndDate"
      Name_04: "Page"
      Name_05: "Component"
      Name_06: "Promotion"
      Name_07: "Type"
      Name_08: "Enabled"
    bindings:
      Value_01: "ABTestSearchForm:Status:Value"
      InDictionary: "QueryParameters"
      Value_02: "ABTestSearchForm:StartDate:Value"
      Value_03: "ABTestSearchForm:EndDate:Value"
      Value_04: "ABTestSearchForm:Page:Value"
      Value_05: "ABTestSearchForm:Component:Value"
      Value_06: "ABTestSearchForm:Promotion:Value"
      Value_07: "ABTestSearchForm:Type:Value"
      Value_08: "ABTestSearchForm:Enabled:Value"
      OutDictionary: "QueryParameters"
  - id: "UpdateDictionary3"
    type: "pipelet"
    ref: "UpdateDictionary"
    config:
      Name_01: "ABTestName"
    bindings:
      Value_01: "ABTestNameExpression"
      OutDictionary: "QueryParameters"
  - id: "UpdateDictionary5"
    type: "pipelet"
    ref: "UpdateDictionary"
    config:
      Name_01: "SortBy"
      Name_02: "SortDirection"
      Name_04: "Domain"
      Name_03: "Locale"
      Name_05: "PageIDs"
      Name_06: "ComponentIDs"
      Name_07: "PromotionIDs"
    bindings:
      Value_01: "SortBy"
      Value_02: "SortDirection"
      Value_04: "CurrentChannel:RepositoryDomain"
      Value_03: "Locale"
      InDictionary: "QueryParameters"
      Value_05: "PageIDs"
      Value_06: "ComponentIDs"
      Value_07: "PromotionIDs"
      OutDictionary: "QueryParameters"
  - id: "UpdateDictionary6"
    type: "pipelet"
    ref: "UpdateDictionary"
    config:
      Name_01: "SortBy"
      Name_02: "SortDirection"
      Name_04: "Domain"
      Name_03: "Locale"
      Name_05: "PageIDs"
      Name_06: "ComponentIDs"
      Name_07: "PromotionIDs"
    bindings:
      Value_01: "SortBy"
      Value_02: "SortDirection"
      Value_04: "CurrentChannel:RepositoryDomain"
      Value_03: "Locale"
      Value_07: "PromotionIDs"
      Value_06: "ComponentIDs"
      Value_05: "PageIDs"
      OutDictionary: "QueryParameters"
  - id: "ValidateForm1"
    type: "pipelet"
    ref: "ValidateForm"
    bindings:
      Form: "ABTestSearchForm"
  - id: "VerifySearchTerm3"
    type: "pipelet"
    ref: "VerifySearchTerm"
    config:
      AllowExclusions: true
      AllowFuzzySearch: true
      AllowSubOperator: "default"
      AllowWildcards: "Multi & Single"
      DefaultOperator: "AND"
      RequiredCharactersBeforeWildcard: 3
    bindings:
      UserSearchTerm: "SearchTerm"
      ErrorCode: "null"

links:
  - from: "AddObjectToVector1"
    via: "next"
    to: "JoinNode10"
    into: "in1"
  - from: "AddObjectToVector2"
    via: "next"
    to: "JoinNode34"
    into: "in1"
  - from: "CallNode11"
    via: "next"
    to: "CheckForEmptyIterator1"
    into: "in"
  - from: "CallNode15"
    via: "Error"
    to: "JoinNode37"
    into: "in1"
  - from: "CallNode15"
    via: "next"
    to: "DecisionNode3"
    into: "in"
  - from: "CallNode18"
    via: "next"
    to: "GetClipboard1"
    into: "in"
  - from: "CallNode19"
    via: "next"
    to: "CallNode18"
    into: "in"
  - from: "CallNode1"
    via: "next"
    to: "KeyMapper3"
    into: "in"
  - from: "CallNode21"
    via: "Error"
    to: "JoinNode11"
    into: "in1"
  - from: "CallNode21"
    via: "next"
    to: "CallNode7"
    into: "in"
  - from: "CallNode2"
    via: "next"
    to: "DecisionNode7"
    into: "in"
