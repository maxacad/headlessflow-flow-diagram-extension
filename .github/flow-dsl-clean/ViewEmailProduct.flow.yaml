flow: "ViewEmailProduct"
kind: "view"

entries:
  - id: "StartNode1"
    name: "Start"
    mode: "private"
    strict: false
    inputs:
      []
  - id: "StartNode2"
    name: "Dispatch"
    mode: "private"
    strict: false
    inputs:
      []
  - id: "StartNode3"
    name: "SendMail"
    mode: "private"
    strict: false
    inputs:
      []
  - id: "StartNode5"
    name: "GetEmailAFriendForm"
    mode: "private"
    strict: true
    inputs:
      []

steps:
  - id: "CallNode1"
    type: "call"
    ref: "ProcessB2CProduct-GetProduct"
    bindings:
      ProductDomain: "CurrentProductRepository:RepositoryDomain"
  - id: "CallNode2"
    type: "call"
    ref: "ProcessB2CProduct-GetProduct"
    bindings:
      ProductDomain: "CurrentProductRepository:RepositoryDomain"
  - id: "CallNode3"
    type: "call"
    ref: "ProcessB2CProduct-GetProductBO"
  - id: "CallNode4"
    type: "call"
    ref: "ProcessB2CProduct-GetProductBO"
  - id: "CallNode5"
    type: "call"
    ref: "ViewEmailProduct-GetEmailAFriendForm"
  - id: "CallNode6"
    type: "call"
    ref: "ViewEmailProduct-GetEmailAFriendForm"
  - id: "CallNode7"
    type: "call"
    ref: "ProcessRecommendProduct-SendMail"
    bindings:
      MailFrom: "EmailAFriendForm:UserEmail:Value"
      MailTo: "EmailAFriendForm:FriendsEmail:Value"
  - id: "CreateForm2"
    type: "pipelet"
    ref: "CreateForm"
    config:
      FormName: "EmailAFriendForm"
      FormResource: "EmailAFriend"
    bindings:
      FormAlias: "null"
      FormName: "null"
      FormResource: "null"
      Form: "EmailAFriendForm"
  - id: "DispatchFormAction1"
    type: "pipelet"
    ref: "DispatchFormAction"
    config:
      OutValue_0: "ViewEmailProduct-SendMail"
    bindings:
      SelectionKey: "JumpTarget"
      Key_0: "sendMail"
  - id: "EndNode1"
    type: "end"
    strict: true
    outputs:
      - key: "EmailAFriendForm"
        type: "com.intershop.beehive.core.capi.webform.Form"
        guaranteed: true
  - id: "InteractionNode1"
    type: "interaction"
  - id: "JoinNode1"
    type: "join"
  - id: "JoinNode2"
    type: "join"
  - id: "JoinNode3"
    type: "join"
  - id: "Jump1"
    type: "jump"
    ref: "SecureJump-Start"
  - id: "JumpNode1"
    type: "jump"
    ref: "ViewEmailProduct-Start"
  - id: "ValidateForm1"
    type: "pipelet"
    ref: "ValidateForm"
    bindings:
      Form: "EmailAFriendForm"

links:
  - from: "StartNode2"
    via: "next"
    to: "DispatchFormAction1"
    into: "in"
  - from: "CreateForm2"
    via: "next"
    to: "EndNode1"
    into: "in"
  - from: "CallNode2"
    via: "next"
    to: "CallNode5"
    into: "in"
  - from: "CallNode6"
    via: "next"
    to: "JoinNode2"
    into: "in1"
  - from: "CallNode5"
    via: "next"
    to: "ValidateForm1"
    into: "in"
  - from: "JoinNode2"
    via: "next"
    to: "CallNode3"
    into: "in"
  - from: "CallNode7"
    via: "next"
    to: "JoinNode1"
    into: "in1"
  - from: "JoinNode3"
    via: "next"
    to: "JoinNode1"
    into: "in3"
  - from: "StartNode1"
    via: "next"
    to: "CallNode1"
    into: "in"
  - from: "JoinNode1"
    via: "next"
    to: "InteractionNode1"
    into: "in"
  - from: "ValidateForm1"
    via: "next"
    to: "CallNode4"
    into: "in"
  - from: "CallNode4"
    via: "next"
    to: "CallNode7"
    into: "in"
  - from: "CallNode3"
    via: "next"
    to: "JoinNode3"
    into: "in1"
  - from: "ValidateForm1"
    via: "error"
    to: "JoinNode2"
    into: "in1"
  - from: "DispatchFormAction1"
    via: "error"
    to: "JumpNode1"
    into: "in"
  - from: "DispatchFormAction1"
    via: "next"
    to: "Jump1"
    into: "in"
  - from: "StartNode5"
    via: "next"
    to: "CreateForm2"
    into: "in"
  - from: "StartNode3"
    via: "next"
    to: "CallNode2"
    into: "in"
  - from: "CallNode7"
    via: "ERROR"
    to: "JoinNode3"
    into: "in1"
  - from: "CallNode1"
    via: "next"
    to: "CallNode6"
    into: "in"
