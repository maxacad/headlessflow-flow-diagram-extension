flow: "GetExternalizedStrings"
kind: "include"

entries:
  - id: "StartNode1"
    name: "Start"
    mode: "private"
    strict: false
    inputs:
      []

steps:
  - id: "AddObjectToVector1"
    type: "pipelet"
    ref: "AddObjectToVector"
    config:
      Mode: "Forbid Duplicates"
    bindings:
      Objects: "TmpLocalizationTexts"
      InVector: "LocalizationTextsVector"
      OutVector: "LocalizationTextsVector"
      Iterator: "LocalizationTexts"
      Object: "null"
  - id: "DecisionNode2"
    type: "decision"
    condition: "LocalizationTexts"
  - id: "DecisionNode3"
    type: "decision"
    condition: "SearchedKeys"
  - id: "DetermineLocalizedTextByLocale3"
    type: "pipelet"
    ref: "DetermineLocalizedTextByLocale"
    bindings:
      Domain: "CurrentDomain"
      LocalizationTexts: "TmpLocalizationTexts"
      SearchedKey: "TmpSearchedKey"
  - id: "DetermineLocalizedTextByLocale4"
    type: "pipelet"
    ref: "DetermineLocalizedTextByLocale"
    bindings:
      Domain: "CurrentDomain"
      LocalizationTexts: "LocalizationTexts"
  - id: "GetFormSelection1"
    type: "pipelet"
    ref: "GetFormSelection"
    config:
      DefaultParameterName: "SearchedKey"
    bindings:
      ParameterName: "null"
      Selection: "SearchedKeys"
  - id: "GetLocale1"
    type: "pipelet"
    ref: "GetLocale"
    config:
      LocaleFallback: "Lead Locale"
    bindings:
      LocaleId: "CurrentSession:Locale:LocaleID"
  - id: "InteractionNode1"
    type: "interaction"
  - id: "JoinNode2"
    type: "join"
  - id: "JoinNode3"
    type: "join"
  - id: "KeyMapper3"
    type: "pipelet"
    ref: "KeyMapper"
    bindings:
      InValue_1: "\"fieldFailureMessage\""
      OutValue_1: "SearchedKey"
      InValue_2: "\"(Boolean)true\""
      OutValue_2: "SearchedKeyFallback"
  - id: "KeyMapper4"
    type: "pipelet"
    ref: "KeyMapper"
    bindings:
      InValue_2: "\"(Boolean)false\""
      OutValue_2: "SearchedKeyFallback"
  - id: "LoopNode1"
    type: "loop"
  - id: "Pipelet1"
    type: "pipelet"
    ref: "CreateLocalizationContextFromApplication"
    bindings:
      Application: "CurrentApplication"
      LocaleInformation: "Locale"
  - id: "Pipelet3"
    type: "pipelet"
    ref: "DetermineLocalizedTextByLocale"
    bindings:
      SearchedKey: "\"fieldFailureMessageDefault\""

links:
  - from: "KeyMapper4"
    via: "next"
    to: "LoopNode1"
    into: "in"
  - from: "DecisionNode2"
    via: "yes"
    to: "JoinNode2"
    into: "in1"
  - from: "JoinNode2"
    via: "next"
    to: "InteractionNode1"
    into: "in"
  - from: "AddObjectToVector1"
    via: "next"
    to: "LoopNode1"
    into: "loop"
  - from: "DecisionNode3"
    via: "no"
    to: "KeyMapper3"
    into: "in"
  - from: "DecisionNode3"
    via: "yes"
    to: "KeyMapper4"
    into: "in"
  - from: "LoopNode1"
    via: "do"
    to: "DetermineLocalizedTextByLocale3"
    into: "in"
  - from: "DetermineLocalizedTextByLocale4"
    via: "next"
    to: "JoinNode3"
    into: "in2"
  - from: "GetLocale1"
    via: "next"
    to: "Pipelet1"
    into: "in"
  - from: "DecisionNode2"
    via: "no"
    to: "Pipelet3"
    into: "in"
  - from: "JoinNode3"
    via: "next"
    to: "DecisionNode2"
    into: "in"
  - from: "Pipelet1"
    via: "next"
    to: "GetFormSelection1"
    into: "in"
  - from: "DetermineLocalizedTextByLocale3"
    via: "next"
    to: "AddObjectToVector1"
    into: "in"
  - from: "KeyMapper3"
    via: "next"
    to: "DetermineLocalizedTextByLocale4"
    into: "in"
  - from: "LoopNode1"
    via: "next"
    to: "JoinNode3"
    into: "in1"
  - from: "StartNode1"
    via: "next"
    to: "GetLocale1"
    into: "in"
  - from: "GetFormSelection1"
    via: "next"
    to: "DecisionNode3"
    into: "in"
  - from: "Pipelet3"
    via: "next"
    to: "JoinNode2"
    into: "in3"
