    into: "in"
  - from: "CallNode3"
    via: "next"
    to: "CallNode6"
    into: "in"
  - from: "DecisionNode2"
    via: "no"
    to: "DecisionNode3"
    into: "in"
  - from: "DispatchFormAction1"
    via: "next"
    to: "JoinNode3"
    into: "in1"
  - from: "JoinNode1"
    via: "next"
    to: "KeyMapper1"
    into: "in"
  - from: "JoinNode3"
    via: "next"
    to: "Jump1"
    into: "in"
  - from: "DispatchFormActionByBreadcrumb1"
    via: "error"
    to: "DispatchFormAction1"
    into: "in"
  - from: "Pipelet2"
    via: "next"
    to: "JumpNode2"
    into: "in"
  - from: "KeyMapper1"
    via: "next"
    to: "PrepareApplicationView1"
    into: "in"
  - from: "DecisionNode2"
    via: "yes"
    to: "Pipelet2"
    into: "in"
  - from: "Pipelet1"
    via: "next"
    to: "JumpNode3"
    into: "in"
  - from: "DecisionNode3"
    via: "yes"
    to: "Pipelet1"
