      PreferenceDomain: "ContentRepository:RepositoryDomain"
      User: "CurrentUser"
      PageletEntryPoint: "ViewContext"
  - id: "CallNode38"
    type: "call"
    ref: "ProcessPageletEntryPointLock-Unlock"
    bindings:
      LockingDomain: "ContentRepository:RepositoryDomain"
      User: "CurrentUser"
      PageletEntryPoint: "ViewContext"
  - id: "CallNode4"
    type: "call"
    ref: "ProcessViewContext-Create"
    bindings:
      Domain: "ContentRepository:RepositoryDomain"
      ID: "ViewContextForm:Id:Value"
      Description: "ViewContextForm:Description:Value"
      DisplayName: "ViewContextForm:DisplayName:Value"
  - id: "CallNode5"
    type: "call"
    ref: "This:CreateFlagName"
    bindings:
      ObjectUUID: "ViewContextUUID"
  - id: "CallNode6"
    type: "call"
    ref: "ViewViewContext-IsTabSwitched"
    bindings:
      ObjectUUID: "ViewContext:UUID"
  - id: "CallNode7"
    type: "call"
    ref: "This:Prefix"
  - id: "ConcatenateStrings5"
    type: "pipelet"
    ref: "ConcatenateStrings"
    config:
      DefaultString0: "ObjectTabSwitched@"
    bindings:
      String1: "ObjectUUID"
      Concatenated: "FlagName"
  - id: "CreateForm1"
    type: "pipelet"
    ref: "CreateForm"
    config:
      FormName: "ViewContext"
      FormResource: "ViewContext"
    bindings:
      Form: "ViewContextForm"
  - id: "CreateForm5"
    type: "pipelet"
    ref: "CreateForm"
