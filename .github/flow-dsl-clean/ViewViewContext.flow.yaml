    type: "decision"
    condition: "IsTabSwitched"
  - id: "DecisionNode2"
    type: "decision"
    condition: "ViewContextUUID"
  - id: "DetermineLocales1"
    type: "pipelet"
    ref: "DetermineLocales"
  - id: "DetermineLocales2"
    type: "pipelet"
    ref: "DetermineLocales"
  - id: "DispatchFormAction1"
    type: "pipelet"
    ref: "DispatchFormAction"
