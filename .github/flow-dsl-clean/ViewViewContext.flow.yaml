  - id: "CallNode3"
    type: "call"
    ref: "ViewViewContext-Prefix"
  - id: "CallNode36"
    type: "call"
    ref: "This:Prefix"
  - id: "CallNode37"
    type: "call"
    ref: "ProcessPageletEntryPointLock-Lock"
    bindings:
