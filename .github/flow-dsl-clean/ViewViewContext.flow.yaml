    ref: "ViewViewContext-Prefix"
  - id: "CallNode21"
    type: "call"
    ref: "This:CreateFlagName"
  - id: "CallNode22"
    type: "call"
    ref: "ViewPageletEntryPointAssignments-DetermineGetPipeline"
