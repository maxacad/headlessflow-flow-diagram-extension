      OutValue_0: "ViewViewContext-Create"
      OutValue_2: "ViewViewContext-View"
      OutValue_1: "ViewViewContext-Update"
      OutValue_3: "ViewViewContext-Lock"
      OutValue_4: "ViewViewContext-Unlock"
      OutValue_5: "ViewViewContext-CheckLock"
      OutValue_6: "ViewViewContext-New"
    bindings:
      Key_0: "create"
      Key_1: "cancel"
      Key_2: "setLocale"
      Key_3: "lock"
      Key_4: "unlock"
      Key_5: "checkLock"
      Key_6: "setLocaleForNew"
      SelectionKey: "JumpTarget"
  - id: "DispatchFormActionByBreadcrumb1"
    type: "pipelet"
    ref: "DispatchFormActionByBreadcrumb"
    config:
      SplitMode: "PipelineAndParameter"
    bindings:
      Key_0: "cancel"
      OutValue_0: "ApplicationState:LastListView"
      OutValue_1: "ApplicationState:LastButOneBreadcrumb"
      Key_1: "back"
      SelectionKey: "JumpTarget"
  - id: "DispatchFormActionByBreadcrumb5"
