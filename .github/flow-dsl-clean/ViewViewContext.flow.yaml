        guaranteed: false
      - key: "ViewContextLockLifetime"
        type: "java.lang.Integer"
        guaranteed: false
      - key: "ViewContextLocking"
        type: "java.lang.String"
        guaranteed: false
      - key: "ViewContextLockOwner"
        type: "com.intershop.beehive.core.capi.user.User"
        guaranteed: false
      - key: "Resource"
        type: "com.intershop.beehive.core.capi.locking.Resource"
        guaranteed: false
  - id: "EndNode5"
    type: "end"
    strict: true
