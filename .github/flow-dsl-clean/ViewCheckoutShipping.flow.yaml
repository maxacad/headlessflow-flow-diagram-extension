  - id: "CallNode15"
    type: "call"
    ref: "ProcessShipping-SetShippingMethods"
  - id: "CallNode16"
    type: "call"
    ref: "ProcessGiftingPreferences-GetGiftingPreferences"
    bindings:
      PreferenceDomain: "Repository:Domain"
  - id: "CallNode17"
    type: "call"
    ref: "ProcessCheckout-AdjustJumpStep"
  - id: "CallNode18"
    type: "call"
    ref: "FireTrackingEvents-View"
    bindings:
      PageName: "\"shipping\""
      PageType: "\"checkout\""
