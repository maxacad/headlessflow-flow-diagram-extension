    type: "call"
    ref: "ViewData-SecureForBrowserBack"
  - id: "DispatchFormAction1"
    type: "pipelet"
    ref: "DispatchFormAction"
    config:
      OutValue_0: "ViewCheckoutShipping-ContinueCheckout"
      OutValue_1: "ViewCheckoutShipping-Update"
    bindings:
      Key_0: "continue"
      Key_1: "update"
      SelectionKey: "JumpTarget"
  - id: "EndNode1"
    type: "end"
    strict: false
  - id: "JoinNode1"
    type: "join"
  - id: "JoinNode2"
    type: "join"
  - id: "JoinNode3"
    type: "join"
  - id: "JoinNode4"
