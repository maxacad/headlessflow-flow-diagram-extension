  - id: "JumpNode5"
    type: "jump"
    ref: "ViewPage-Start"
  - id: "KeyMapper2"
    type: "pipelet"
    ref: "KeyMapper"
    config:
      ValueType: "Dictionary Value"
    bindings:
      InValue_1: "CurrentRequest:PipelineDictionary"
      InValue_3: "\"systempage.checkout.shipping.pagelet2-systempage.checkout.shipping\""
      InValue_2: "\"checkout/shipping/CheckoutShipping\""
      OutValue_1: "Dictionary"
      OutValue_3: "PageletEntryPointID"
      OutValue_2: "WorkingTemplate"
  - id: "Pipelet1"
    type: "pipelet"
    ref: "SetDictionaryValue"
    config:
      Name: "JumpStep"
      Value: 2
      ValueType: "Dictionary Value"
  - id: "SetDictionaryValue9"
    type: "pipelet"
    ref: "SetDictionaryValue"
    config:
      Name: "JumpTarget"
      Value: "ViewCheckoutShipping-Review"
  - id: "VerifyInteger2"
    type: "pipelet"
    ref: "VerifyInteger"
    bindings:
      LocalizedString: "\"2\""
      IntegerObject: "CurrentStep"

