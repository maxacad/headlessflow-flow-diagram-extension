flow: "ProcessCatalogList"
kind: "process"

entries:
  - id: "Start1"
    name: "ListAll"
    mode: "private"
    strict: false
    inputs:
      []
  - id: "Start2"
    name: "GetStandardCatalogs"
    mode: "private"
    strict: false
    inputs:
      []
  - id: "Start3"
    name: "GetClassificationCatalogs"
    mode: "private"
    strict: false
    inputs:
      []
  - id: "StartNode1"
    name: "GetLocalCatalogs"
    mode: "private"
    strict: false
    inputs:
      - key: "CatalogOrganizationDomain<com.intershop.beehive.core.capi.domain.Domain>"
        type: "com.intershop.beehive.core.capi.domain.Domain"
        required: false
  - id: "StartNode2"
    name: "GetAllCatalogs"
    mode: "private"
    strict: true
    inputs:
      - key: "ProxyFlag"
        type: "java.lang.Integer"
        required: false
      - key: "SortBy"
        type: "java.lang.String"
        required: false
      - key: "SortDirection"
        type: "java.lang.String"
        required: false
      - key: "Locale"
        type: "com.intershop.beehive.core.capi.localization.LocaleInformation"
        required: false
      - key: "OwningDomain"
        type: "com.intershop.beehive.core.capi.domain.Domain"
        required: true
  - id: "StartNode3"
    name: "GetAllCatalogsByType"
    mode: "private"
    strict: true
    inputs:
      - key: "ProxyFlag"
        type: "java.lang.Integer"
        required: false
      - key: "SortBy"
        type: "java.lang.Object"
        required: false
      - key: "SortDirection"
        type: "java.lang.Object"
        required: false
      - key: "OwningDomain"
        type: "com.intershop.beehive.core.capi.domain.Domain"
        required: false
      - key: "Locale"
        type: "com.intershop.beehive.core.capi.localization.LocaleInformation"
        required: false
      - key: "TypeCodes"
        type: "java.lang.String"
        required: true

steps:
  - id: "AddObjectToVector3"
    type: "pipelet"
    ref: "AddObjectToVector"
    bindings:
      Object: "\"(Integer)1\""
      InVector: "null"
      Objects: "null"
      OutVector: "TypeCodes"
      Iterator: "null"
  - id: "AddObjectToVector4"
    type: "pipelet"
    ref: "AddObjectToVector"
    bindings:
      Object: "\"(Integer)2\""
      InVector: "TypeCodes"
      Objects: "null"
      OutVector: "TypeCodes"
      Iterator: "null"
  - id: "AddObjectToVector5"
    type: "pipelet"
    ref: "AddObjectToVector"
    bindings:
      Object: "\"(Integer)7\""
      InVector: "TypeCodes"
      Objects: "null"
      OutVector: "null"
      Iterator: "TypeCodes"
  - id: "Call2"
    type: "call"
    ref: "ProcessCatalogList-GetClassificationCatalogs"
  - id: "CallNode1"
    type: "call"
    ref: "ProcessCatalogList-GetStandardCatalogs"
  - id: "CombineIterators1"
    type: "pipelet"
    ref: "CombineIterators"
    config:
      ProcessMethod: "Concatenate Iterators"
    bindings:
      Iterator1: "SharedClassificationCatalogs"
      Iterator2: "LocalClassificationCatalogs"
      Iterator: "ClassificationCatalogs"
  - id: "End1"
    type: "end"
    strict: false
  - id: "End2"
    type: "end"
    strict: false
  - id: "End3"
    type: "end"
    strict: false
  - id: "End4"
    type: "end"
    strict: true
    outputs:
      - key: "Catalogs"
        type: "java.util.Iterator"
        guaranteed: true
  - id: "End5"
    type: "end"
    strict: true
    outputs:
      - key: "Catalogs"
        type: "java.util.Iterator"
        guaranteed: true
  - id: "EndNode1"
    type: "end"
    strict: false
  - id: "EndNode2"
    type: "end"
    strict: true
    outputs:
      - key: "ErrorCode"
        type: "java.lang.String"
        guaranteed: false
  - id: "EndNode3"
    type: "end"
    strict: true
    outputs:
      - key: "ErrorCode"
        type: "java.lang.String"
        guaranteed: false
  - id: "ExecuteObjectsQuery1"
    type: "pipelet"
    ref: "ExecuteObjectsQuery"
    config:
      QueryName: "catalog/GetCatalogsByOwningDomain"
      Datasource: "current ORM connection"
    bindings:
      Parameters: "CatalogSearchParameters"
      SearchResult: "Catalogs"
  - id: "ExecuteObjectsQuery3"
    type: "pipelet"
    ref: "ExecuteObjectsQuery"
    config:
      QueryName: "catalog/GetCatalogsByOwningDomain"
      Datasource: "current ORM connection"
    bindings:
      Parameters: "CatalogSearchParameters"
      SearchResult: "Catalogs"
  - id: "GetCatalogs4"
    type: "pipelet"
    ref: "GetCatalogs"
    config:
      CatalogType: "Product Catalog"
      OnlineOnly: "False"
      ProxyFilter: "ON - Proxy Catalogs only"
    bindings:
      Catalogs: "SharedStandardCatalogs"
  - id: "GetCatalogs5"
    type: "pipelet"
    ref: "GetCatalogs"
    config:
      CatalogType: "Classification Catalog"
      OnlineOnly: "False"
      ProxyFilter: "ON - Proxy Catalogs only"
    bindings:
      Catalogs: "SharedClassificationCatalogs"
  - id: "Pipelet1"
    type: "pipelet"
    ref: "GetCatalogs"
    config:
      CatalogType: "Classification Catalog"
      OnlineOnly: "False"
      ProxyFilter: "ON - Exclude Proxy Catalogs"
    bindings:
      Catalogs: "LocalClassificationCatalogs"
  - id: "Pipelet2"
    type: "pipelet"
    ref: "GetCatalogs"
    config:
      CatalogType: "Product Catalog"
      OnlineOnly: "False"
      ProxyFilter: "ON - Exclude Proxy Catalogs"
    bindings:
      Catalogs: "LocalStandardCatalogs"
      OrganizationDomain: "CatalogOrganizationDomain"
  - id: "Pipelet3"
    type: "pipelet"
    ref: "GetCatalogs"
    config:
      CatalogType: "Classification Catalog"
      OnlineOnly: "False"
      ProxyFilter: "ON - Exclude Proxy Catalogs"
    bindings:
      Catalogs: "LocalClassificationCatalogs"
      OrganizationDomain: "CatalogOrganizationDomain"
  - id: "Pipelet4"
    type: "pipelet"
    ref: "GetCatalogs"
    config:
      CatalogType: "Product Catalog"
      OnlineOnly: "False"
      ProxyFilter: "ON - Exclude Proxy Catalogs"
    bindings:
      Catalogs: "LocalStandardCatalogs"
  - id: "Pipelet5"
    type: "pipelet"
    ref: "CombineIterators"
    config:
      ProcessMethod: "Concatenate Iterators"
    bindings:
      Iterator1: "SharedStandardCatalogs"
      Iterator2: "LocalStandardCatalogs"
      Iterator: "StandardCatalogs"
  - id: "Pipelet6"
    type: "pipelet"
    ref: "CombineIterators"
    config:
      ProcessMethod: "Concatenate Iterators"
    bindings:
      Iterator1: "LocalStandardCatalogs"
      Iterator2: "LocalClassificationCatalogs"
      Iterator: "LocalCatalogs"
  - id: "SplitString1"
    type: "pipelet"
    ref: "SplitString"
    bindings:
      Delimeter: "\",\""
      ValuesString: "TypeCodes"
      ValuesIterator: "TypeCodes"
  - id: "UpdateDictionary1"
    type: "pipelet"
    ref: "UpdateDictionary"
    config:
      Name_01: "OwningDomainUUID"
      Name_02: "TypeCodes"
      Name_03: "ProxyFlag"
      Name_04: "SortBy"
      Name_05: "SortDirection"
      Name_06: "Locale"
    bindings:
      Value_01: "OwningDomain:UUID"
      OutDictionary: "CatalogSearchParameters"
      InDictionary: "null"
      Value_02: "TypeCodes"
      Value_03: "ProxyFlag"
      Value_04: "SortBy"
      Value_05: "SortDirection"
      Value_06: "Locale"
  - id: "UpdateDictionary3"
    type: "pipelet"
    ref: "UpdateDictionary"
    config:
      Name_01: "OwningDomainUUID"
      Name_02: "TypeCodes"
      Name_03: "ProxyFlag"
      Name_04: "SortBy"
      Name_05: "SortDirection"
      Name_06: "Locale"
    bindings:
      Value_01: "OwningDomain:UUID"
      OutDictionary: "CatalogSearchParameters"
      InDictionary: "null"
      Value_02: "TypeCodes"
      Value_03: "ProxyFlag"
      Value_04: "SortBy"
      Value_05: "SortDirection"
      Value_06: "Locale"

links:
  - from: "Pipelet4"
    via: "next"
    to: "Pipelet5"
    into: "in"
  - from: "Pipelet3"
    via: "next"
    to: "Pipelet6"
    into: "in"
  - from: "GetCatalogs5"
    via: "next"
    to: "Pipelet1"
    into: "in"
  - from: "Pipelet6"
    via: "next"
    to: "EndNode1"
    into: "in"
  - from: "CombineIterators1"
    via: "next"
    to: "End3"
    into: "in"
  - from: "Call2"
    via: "next"
    to: "End2"
    into: "in"
  - from: "UpdateDictionary3"
    via: "next"
    to: "ExecuteObjectsQuery3"
    into: "in"
  - from: "Pipelet5"
    via: "next"
    to: "End1"
    into: "in"
  - from: "ExecuteObjectsQuery3"
    via: "error"
    to: "EndNode2"
    into: "in"
  - from: "StartNode2"
    via: "next"
    to: "AddObjectToVector3"
    into: "in"
  - from: "AddObjectToVector5"
    via: "next"
    to: "UpdateDictionary3"
    into: "in"
  - from: "Start3"
    via: "next"
    to: "GetCatalogs5"
    into: "in"
  - from: "AddObjectToVector4"
    via: "next"
    to: "AddObjectToVector5"
    into: "in"
  - from: "AddObjectToVector3"
    via: "next"
    to: "AddObjectToVector4"
    into: "in"
  - from: "ExecuteObjectsQuery3"
    via: "next"
    to: "End4"
    into: "in"
  - from: "CallNode1"
    via: "next"
    to: "Call2"
    into: "in"
  - from: "UpdateDictionary1"
    via: "next"
    to: "ExecuteObjectsQuery1"
    into: "in"
  - from: "ExecuteObjectsQuery1"
    via: "next"
    to: "End5"
    into: "in"
  - from: "SplitString1"
    via: "next"
    to: "UpdateDictionary1"
    into: "in"
  - from: "StartNode3"
    via: "next"
    to: "SplitString1"
    into: "in"
  - from: "Start2"
    via: "next"
    to: "GetCatalogs4"
    into: "in"
  - from: "Pipelet1"
    via: "next"
    to: "CombineIterators1"
    into: "in"
  - from: "ExecuteObjectsQuery1"
    via: "error"
    to: "EndNode3"
    into: "in"
  - from: "Start1"
    via: "next"
    to: "CallNode1"
    into: "in"
  - from: "GetCatalogs4"
    via: "next"
    to: "Pipelet4"
    into: "in"
  - from: "StartNode1"
    via: "next"
    to: "Pipelet2"
    into: "in"
  - from: "Pipelet2"
    via: "next"
    to: "Pipelet3"
    into: "in"
