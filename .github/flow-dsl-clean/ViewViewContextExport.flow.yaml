flow: "ViewViewContextExport"
kind: "view"

entries:
  - id: "StartNode1"
    name: "Dispatch"
    mode: "private"
    strict: false
    inputs:
      []
  - id: "StartNode14"
    name: "GetContainerName"
    mode: "private"
    strict: true
    inputs:
      - key: "ContentRepositoryUUID"
        type: "java.lang.String"
        required: true
  - id: "StartNode17"
    name: "GetFormValues"
    mode: "private"
    strict: false
    inputs:
      []
  - id: "StartNode2"
    name: "List"
    mode: "private"
    strict: false
    inputs:
      []
  - id: "StartNode3"
    name: "SetFormValues"
    mode: "private"
    strict: false
    inputs:
      []
  - id: "StartNode4"
    name: "Internal"
    mode: "private"
    strict: false
    inputs:
      []
  - id: "StartNode5"
    name: "ExportSelectedViewContexts"
    mode: "private"
    strict: false
    inputs:
      []
  - id: "StartNode6"
    name: "ExportAllViewContexts"
    mode: "private"
    strict: false
    inputs:
      []

steps:
  - id: "AddObjectToVector3"
    type: "pipelet"
    ref: "AddObjectToVector"
    config:
      Mode: "Forbid Duplicates"
    bindings:
      InVector: "ViewContextVector"
      Iterator: "ViewContexts"
      Object: "ViewContext"
      Objects: "null"
      OutVector: "ViewContextVector"
  - id: "CallNode1"
    type: "call"
    ref: "ViewViewContexts-Prefix"
  - id: "CallNode10"
    type: "call"
    ref: "ViewPageletContentExport-RunExport"
    bindings:
      PageletType: "\"ViewContext\""
  - id: "CallNode11"
    type: "call"
    ref: "ViewViewContexts-Prefix"
  - id: "CallNode12"
    type: "call"
    ref: "ViewViewContexts-Prefix"
  - id: "CallNode2"
    type: "call"
    ref: "ViewViewContextSearch-UpdateClipboard"
  - id: "CallNode3"
    type: "call"
    ref: "This:GetContainerName"
  - id: "CallNode4"
    type: "call"
    ref: "This:GetContainerName"
  - id: "CallNode5"
    type: "call"
    ref: "ViewViewContextExport-SetFormValues"
  - id: "CallNode6"
    type: "call"
    ref: "ViewPageletContentExport-ValidateExportFileName"
  - id: "CallNode7"
    type: "call"
    ref: "ViewViewContextSearch-UpdateClipboard"
  - id: "CallNode8"
    type: "call"
    ref: "ViewPageletContentExport-ValidateExportFileName"
  - id: "CallNode9"
    type: "call"
    ref: "ViewPageletContentExport-GetExportExecutionDomain"
  - id: "ConcatenateStrings1"
    type: "pipelet"
    ref: "ConcatenateStrings"
    bindings:
      String0: "ContentRepositoryUUID"
      String1: "\"@ViewContextExport\""
      Concatenated: "ContainerName"
  - id: "CreatePageableFromIterator2"
    type: "pipelet"
    ref: "CreatePageableFromIterator"
    config:
      Pagesize: 1000000
    bindings:
      Iterator: "ViewContexts"
      Pageable: "Objects"
  - id: "DecisionNode1"
    type: "decision"
    condition: "ViewContextClipboard:ObjectUUIDsCount"
  - id: "DecisionNode2"
    type: "decision"
    condition: "ViewContextClipboard:ObjectUUIDsCount"
  - id: "DispatchFormAction1"
    type: "pipelet"
    ref: "DispatchFormAction"
    config:
      PagingPipeline: "ViewViewContextExport-Internal"
      OutValue_1: "This:ExportSelectedViewContexts"
      OutValue_2: "This:ExportAllViewContexts"
    bindings:
      SelectionKey: "JumpTarget"
      Key_1: "ExportSelectedViewContexts"
      Key_2: "ExportAllViewContexts"
      Key_0: "Cancel"
  - id: "DispatchFormActionByBreadcrumb1"
    type: "pipelet"
    ref: "DispatchFormActionByBreadcrumb"
    config:
      SplitMode: "PipelineAndParameter"
    bindings:
      Key_0: "Cancel"
      SelectionKey: "JumpTarget"
      OutValue_0: "ApplicationState:LastListView"
  - id: "DispatchFormActionByBreadcrumb2"
    type: "pipelet"
    ref: "DispatchFormActionByBreadcrumb"
    config:
      SplitMode: "PipelineAndParameter"
    bindings:
      Key_0: "\"Back\""
      SelectionKey: "JumpTarget"
      OutValue_0: "ApplicationState:LastListView"
  - id: "EndNode1"
    type: "end"
    strict: false
  - id: "EndNode8"
    type: "end"
    strict: true
    outputs:
      - key: "ContainerName"
        type: "java.lang.String"
        guaranteed: true
  - id: "EndNode9"
    type: "end"
    strict: false
  - id: "GetPageable1"
    type: "pipelet"
    ref: "GetPageable"
    bindings:
      PageableID: "ObjectsID"
      Pageable: "Objects"
  - id: "GetValuesFromContainer1"
    type: "pipelet"
    ref: "GetValuesFromContainer"
    config:
      OverwriteBehavior: true
    bindings:
      ContainerName: "ContainerName"
  - id: "InteractionNode2"
    type: "interaction"
  - id: "JoinNode1"
    type: "join"
  - id: "JoinNode14"
    type: "join"
  - id: "JoinNode2"
    type: "join"
  - id: "JoinNode3"
    type: "join"
  - id: "JoinNode4"
    type: "join"
  - id: "JoinNode5"
    type: "join"
  - id: "JoinNode6"
    type: "join"
  - id: "JumpNode2"
    type: "jump"
    ref: "This:List"
  - id: "JumpNode3"
    type: "jump"
    ref: "SecureJump-Start"
  - id: "JumpNode5"
    type: "jump"
    ref: "SecureJump-Start"
  - id: "Loop3"
    type: "loop"
  - id: "Pipelet1"
    type: "pipelet"
    ref: "GetViewContextByUUID"
    bindings:
      ViewContextUUID: "UUID"
  - id: "Pipelet2"
    type: "pipelet"
    ref: "KeyMapper"
    bindings:
      InValue_1: "\"ViewViewContextExport-Internal\""
      OutValue_1: "JumpTarget"
  - id: "PrepareApplicationView2"
    type: "pipelet"
    ref: "PrepareApplicationView"
    config:
      WorkingTemplate: "content/viewcontext/ViewContextExport"
      SelectedMenuItem: "ContentOverview"
  - id: "RemoveClipboard2"
    type: "pipelet"
    ref: "RemoveClipboard"
    config:
      SessionRegistrationID: "ViewContextClipboard"
  - id: "SetDictionaryValue2"
    type: "pipelet"
    ref: "SetDictionaryValue"
    config:
      Name: "PerformSearch"
      Value: true
  - id: "SetDictionaryValue3"
    type: "pipelet"
    ref: "SetDictionaryValue"
    config:
      Name: "StartFlag"
      Value: true
  - id: "SetValuesToContainer1"
    type: "pipelet"
    ref: "SetValuesToContainer"
    bindings:
      DictionaryKeys: "\"ViewContextClipboard;ExportFileNameNotDefined;ExportFileNameInvalid\""

