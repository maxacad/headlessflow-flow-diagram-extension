  - id: "JumpNode4"
    type: "jump"
    ref: "SecureJump-Start"
  - id: "Loop1"
    type: "loop"
  - id: "Pipelet2"
    type: "pipelet"
    ref: "DispatchFormAction"
    config:
      OutValue_0: "This:Status"
      OutValue_1: "This:DeleteImpexJobs"
      OutValue_2: "This:Status"
      OutValue_3: "This:Monitor"
      OutValue_4: "This:DownloadFile"
      OutValue_7: "ViewPromotionCodeExportFiles-BrowseDirectory"
      OutValue_8: "ViewPromotionCodeExportWizard-SelectDetails"
      OutValue_6: "ViewPromotionCodeImportUploadFile-BrowseDirectory"
      OutValue_9: "ViewPromotionCodeImportWizard-InitPromotionCodeImport"
    bindings:
      Key_0: "Status"
      Key_1: "DeleteImpexJobs"
      Key_2: "ConfirmDeleteImpexJobs"
      Key_3: "Monitor"
      Key_4: "DownloadFile"
      Key_7: "ExportFiles"
      Key_8: "PromotionCodeExport"
      Key_9: "PromotionCodeImport"
      Key_6: "UploadFiles"
      SelectionKey: "JumpTarget"
  - id: "PrepareApplicationView1"
    type: "pipelet"
    ref: "PrepareApplicationView"
    config:
      SelectedMenuItem: "OnlineMarketing"
      WorkingTemplate: "impex/PromotionCodeImpexMonitor"
  - id: "PrepareApplicationView2"
    type: "pipelet"
    ref: "PrepareApplicationView"
    config:
      SelectedMenuItem: "OnlineMarketing"
      WorkingTemplate: "impex/PromotionCodeImpexOverview"
    bindings:
      WorkingTemplateSuffix: "CurrentChannel:TypeCode"
  - id: "RemoveDictionaryValue0"
    type: "pipelet"
    ref: "RemoveDictionaryValue"
    config:
      Key: "JobName"
      RemoveFormValues: true
  - id: "SetDictionaryValue6"
    type: "pipelet"
    ref: "SetDictionaryValue"
    config:
      Name: "JumpTarget"
      Value: "Error-Start"
      ValueType: "Dictionary Value"

