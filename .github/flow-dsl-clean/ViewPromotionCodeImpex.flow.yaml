flow: "ViewPromotionCodeImpex"
kind: "view"

entries:
  - id: "Start1"
    name: "DownloadFile"
    mode: "private"
    strict: false
    inputs:
      []
  - id: "Start2"
    name: "Monitor"
    mode: "private"
    strict: false
    inputs:
      []
  - id: "Start3"
    name: "Status"
    mode: "private"
    strict: false
    inputs:
      []
  - id: "Start4"
    name: "DeleteImpexJobs"
    mode: "private"
    strict: false
    inputs:
      []
  - id: "Start5"
    name: "Prefix"
    mode: "private"
    strict: false
    inputs:
      []
  - id: "StartNode1"
    name: "Dispatch"
    mode: "private"
    strict: false
    inputs:
      []

steps:
  - id: "AddObjectToVector0"
    type: "pipelet"
    ref: "AddObjectToVector"
    bindings:
      Object: "\"ProcessPromotionCodeImpex\""
  - id: "AddObjectToVector1"
    type: "pipelet"
    ref: "AddObjectToVector"
    bindings:
      InVector: "OutVector"
      Object: "\"ProcessPromotionCodeGroupExport\""
  - id: "AddObjectToVector2"
    type: "pipelet"
    ref: "AddObjectToVector"
    bindings:
      InVector: "OutVector"
      Object: "\"ProcessPromotionCodeGroupImport\""
  - id: "Call1"
    type: "call"
    ref: "ProcessImpexJob-Delete"
  - id: "Call3"
    type: "call"
    ref: "ProcessImpexJob-GetLogContent"
  - id: "Call4"
    type: "call"
    ref: "ProcessClipboard-Delete"
  - id: "Call5"
    type: "call"
    ref: "ProcessClipboard-Update"
  - id: "Call6"
    type: "call"
    ref: "ProcessClipboard-Update"
  - id: "Call7"
    type: "call"
    ref: "ProcessClipboard-Get"
  - id: "CallNode0"
    type: "call"
    ref: "ProcessJobConfigurationSearch-Search"
    bindings:
      JobDomain: "ChannelRepository:Domain"
      JobNameIterator: "Iterator"
      Jobs: "ImpexJobs"
  - id: "CallNode1"
    type: "call"
    ref: "ViewPromotionCodeImpex-Prefix"
  - id: "CallNode2"
    type: "call"
    ref: "ViewPromotionCodeImpex-Prefix"
  - id: "CallNode3"
    type: "call"
    ref: "ProcessPromotion-GetPromotionDomainByChannel"
    bindings:
      Channel: "CurrentChannel"
      PromotionDomain: "Domain"
  - id: "CallNode4"
    type: "call"
    ref: "ViewPromotionCodeImpex-Prefix"
  - id: "Decision1"
    type: "decision"
    condition: "JobConfiguration:Status"
  - id: "Decision2"
    type: "decision"
    condition: "ConfirmDeleteImpexJobs"
  - id: "Decision3"
    type: "decision"
    condition: "PromotionCodeGroupID"
  - id: "Decision4"
    type: "decision"
    condition: "PromotionCodeGroup"
  - id: "DetermineUnit1"
    type: "pipelet"
    ref: "DetermineUnit"
    bindings:
      UnitName: "JobConfiguration:DomainName"
      Unit: "UnitDomain"
  - id: "DispatchFormAction0"
    type: "pipelet"
    ref: "DispatchFormAction"
    config:
      OutValue_0: "ViewPromotionExportList-ListAll"
      OutValue_1: "ViewPromotionCodeGroupExport-ListAll"
      OutValue_2: "ViewPromotionCodeGroupImport-Start"
    bindings:
      Key_0: "PromotionExport"
      Key_1: "PromotionCodeGroupExport"
      Key_2: "PromotionCodeGroupImport"
      SelectionKey: "JumpTarget"
  - id: "End1"
    type: "end"
    strict: false
  - id: "EndNode1"
    type: "end"
    strict: false
  - id: "GetBinaryFileContent1"
    type: "pipelet"
    ref: "GetBinaryFileContent"
    config:
      UnitDirectory: "IMPEX_DIR"
  - id: "GetJobConfiguration1"
    type: "pipelet"
    ref: "GetJobConfiguration"
    bindings:
      JobUUID: "JobConfigurationUUID"
  - id: "GetJobConfiguration2"
    type: "pipelet"
    ref: "GetJobConfiguration"
    bindings:
