flow: "MaintainBonusPoints"
kind: "process"

entries:
  - id: "StartNode1"
    name: "ActivatePendingPoints"
    mode: "private"
    strict: true
    inputs:
      []
  - id: "StartNode2"
    name: "GetAllBonusPointOwningChannels"
    mode: "private"
    strict: true
    inputs:
      []
  - id: "StartNode3"
    name: "PurgeOutdatedData"
    mode: "private"
    strict: true
    inputs:
      []

steps:
  - id: "CallNode1"
    type: "call"
    ref: "This:GetAllBonusPointOwningChannels"
  - id: "CallNode2"
    type: "call"
    ref: "This:GetAllBonusPointOwningChannels"
  - id: "ConcatenateStrings1"
    type: "pipelet"
    ref: "ConcatenateStrings"
    config:
      DefaultString0: "MaintainBonusPoints_"
    bindings:
      String0: "null"
      String1: "CurrentChannel:TypeCode"
      Concatenated: "Pipeline"
  - id: "ConcatenateStrings2"
    type: "pipelet"
    ref: "ConcatenateStrings"
    config:
      DefaultString0: "MaintainBonusPoints_"
    bindings:
      String0: "null"
      String1: "CurrentChannel:TypeCode"
      Concatenated: "Pipeline"
  - id: "EndNode1"
    type: "end"
    strict: true
  - id: "EndNode2"
    type: "end"
    strict: true
    outputs:
      - key: "Channels"
        type: "com.intershop.beehive.foundation.util.ResettableIterator"
        guaranteed: false
  - id: "EndNode3"
    type: "end"
    strict: true
  - id: "ExecuteObjectsQuery1"
    type: "pipelet"
    ref: "ExecuteObjectsQuery"
    config:
      QueryName: "channel/GetChannelsByTypeCode"
      Datasource: "current ORM connection"
      ParameterName_01: "TypeCodes"
    bindings:
      Connection: "null"
      Parameters: "null"
      ParameterValue_01: "\"52 42\""
      Query: "null"
      SearchResult: "Channels"
  - id: "ExecutePipeline1"
    type: "pipelet"
    ref: "ExecutePipeline"
    config:
      Asynchronous: false
      PipelineStartNode: "ActivatePendingPoints"
    bindings:
      PipelineDomain: "CurrentChannel:OwningDomain:Site"
      PipelineDomainID: "null"
      PipelineDomainName: "null"
      PipelineName: "Pipeline"
      PipelineStartNode: "null"
  - id: "ExecutePipeline2"
    type: "pipelet"
    ref: "ExecutePipeline"
    config:
      Asynchronous: false
      PipelineStartNode: "PurgeOutdatedData"
    bindings:
      PipelineDomain: "CurrentChannel:OwningDomain:Site"
      PipelineDomainID: "null"
      PipelineDomainName: "null"
      PipelineName: "Pipeline"
      PipelineStartNode: "null"
  - id: "JoinNode1"
    type: "join"
  - id: "JoinNode2"
    type: "join"
  - id: "LoopNode1"
    type: "loop"
  - id: "LoopNode2"
    type: "loop"

links:
  - from: "StartNode2"
    via: "next"
    to: "ExecuteObjectsQuery1"
    into: "in"
  - from: "JoinNode1"
    via: "next"
    to: "LoopNode1"
    into: "loop"
  - from: "ExecutePipeline1"
    via: "next"
    to: "JoinNode1"
    into: "in1"
  - from: "ExecutePipeline2"
    via: "next"
    to: "JoinNode2"
    into: "in1"
  - from: "ExecutePipeline1"
    via: "error"
    to: "JoinNode1"
    into: "in2"
  - from: "ConcatenateStrings2"
    via: "next"
    to: "ExecutePipeline2"
    into: "in"
  - from: "LoopNode1"
    via: "do"
    to: "ConcatenateStrings1"
    into: "in"
  - from: "ConcatenateStrings1"
    via: "next"
    to: "ExecutePipeline1"
    into: "in"
  - from: "LoopNode2"
    via: "do"
    to: "ConcatenateStrings2"
    into: "in"
  - from: "StartNode3"
    via: "next"
    to: "CallNode2"
    into: "in"
  - from: "ExecuteObjectsQuery1"
    via: "next"
    to: "EndNode2"
    into: "in"
  - from: "StartNode1"
    via: "next"
    to: "CallNode1"
    into: "in"
  - from: "JoinNode2"
    via: "next"
    to: "LoopNode2"
    into: "loop"
  - from: "CallNode2"
    via: "next"
    to: "LoopNode2"
    into: "in"
  - from: "LoopNode1"
    via: "next"
    to: "EndNode1"
    into: "in"
  - from: "CallNode1"
    via: "next"
    to: "LoopNode1"
    into: "in"
  - from: "ExecutePipeline2"
    via: "error"
    to: "JoinNode2"
    into: "in2"
  - from: "LoopNode2"
    via: "next"
    to: "EndNode3"
    into: "in"
