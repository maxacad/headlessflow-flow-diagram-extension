flow: "ViewPipelineComponent"
kind: "view"

entries:
  - id: "StartNode1"
    name: "StartComponent"
    mode: "private"
    strict: false
    inputs:
      - key: "PipelineComponentParameters"
        type: "java.util.Map"
        required: true
      - key: "PipelineComponentName"
        type: "java.lang.String"
        required: true
      - key: "PipelineComponentReturnPipeline"
        type: "java.lang.String"
        required: true
      - key: "PipelineComponentStartPipeline"
        type: "java.lang.String"
        required: true
      - key: "PipelineComponentReturnValueName"
        type: "java.lang.String"
        required: true
      - key: "PipelineComponentBackToPipeline"
        type: "java.lang.String"
        required: true
      - key: "PipelineComponentCaller"
        type: "java.lang.String"
        required: false
  - id: "StartNode14"
    name: "RestoreDictionary"
    mode: "private"
    strict: false
    inputs:
      []
  - id: "StartNode2"
    name: "EndComponent"
    mode: "private"
    strict: false
    inputs:
      - key: "PipelineComponentID"
        type: "java.lang.String"
        required: true
      - key: "PipelineComponentReturnValueName"
        type: "java.lang.String"
        required: false
      - key: "PipelineComponentReturnValue"
        type: "java.lang.String"
        required: true
  - id: "StartNode3"
    name: "GetPipelineName"
    mode: "private"
    strict: true
    inputs:
      - key: "CompletePipelineName"
        type: "java.lang.String"
        required: true
  - id: "StartNode4"
    name: "CreateComponentD"
    mode: "private"
    strict: true
    inputs:
      []
  - id: "StartNode5"
    name: "CallBackToPipeline"
    mode: "private"
    strict: false
    inputs:
      - key: "PipelineComponentID"
        type: "java.lang.String"
        required: true
  - id: "StartNode6"
    name: "GetParameter"
    mode: "private"
    strict: false
    inputs:
      - key: "PipelineComponentID"
        type: "java.lang.String"
        required: true
      - key: "ParameterName"
        type: "java.lang.String"
        required: true
  - id: "StartNode7"
    name: "CancelComponent"
    mode: "private"
    strict: false
    inputs:
      - key: "PipelineComponentID"
        type: "java.lang.String"
        required: true
  - id: "StartNode8"
    name: "GetParameters"
    mode: "private"
    strict: false
    inputs:
      - key: "PipelineComponentID"
        type: "java.lang.String"
        required: true
      - key: "ParameterNames"
        type: "java.util.Iterator"
        required: true
  - id: "StartNode9"
    name: "SetSelectedMenuItem"
    mode: "private"
    strict: true
    inputs:
      - key: "SelectedMenuItem"
        type: "java.lang.String"
        required: false
      - key: "CurrentChannel"
        type: "com.intershop.component.mvc.capi.catalog.Repository"
        required: false

steps:
  - id: "AddMultipleEntriesToMap1"
    type: "pipelet"
    ref: "AddMultipleEntriesToMap"
    config:
      Mode: "OverwriteValue"
    bindings:
      Key1: "\"PipelineComponentCaller\""
      Value1: "PipelineComponentCaller"
      InMap: "PipelineComponentMap"
      Value2: "PipelineComponentCancelPipeline"
      Key2: "\"PipelineComponentCancelPipeline\""
      OutMap: "PipelineComponentMap"
  - id: "AddMultipleEntriesToMap2"
    type: "pipelet"
    ref: "AddMultipleEntriesToMap"
    config:
      Mode: "OverwriteValue"
    bindings:
      Key1: "\"PipelineComponentName\""
      Key2: "\"PipelineComponentStartPipeline\""
      Value1: "PipelineComponentName"
      Value2: "PipelineComponentStartPipeline"
      Key3: "\"PipelineComponentReturnPipeline\""
      Value3: "PipelineComponentReturnPipeline"
      Value4: "PipelineComponentReturnValueName"
      Key4: "\"PipelineComponentReturnValueName\""
      Key5: "\"PipelineComponentBackToPipeline\""
      Value5: "PipelineComponentBackToPipeline"
      OutMap: "PipelineComponentMap"
  - id: "CallNode0"
    type: "call"
    ref: "Prefix-Start"
  - id: "CallNode1"
    type: "call"
    ref: "ViewPipelineComponent-GetPipelineName"
    bindings:
      CompletePipelineName: "PipelineComponentReturnPipeline"
      PipelineName: "CurrentPipelineName"
      StartNode: "CurrentStartNodeName"
  - id: "CallNode2"
    type: "call"
    ref: "ViewPipelineComponent-GetPipelineName"
    bindings:
      CompletePipelineName: "PipelineComponentStartPipeline"
      PipelineName: "CurrentPipelineName"
      StartNode: "CurrentStartNodeName"
  - id: "CallNode3"
    type: "call"
    ref: "ViewPipelineComponent-CreateComponentD"
  - id: "CallNode4"
    type: "call"
    ref: "ViewPipelineComponent-RestoreDictionary"
  - id: "CallNode5"
    type: "call"
    ref: "ViewPipelineComponent-RestoreDictionary"
  - id: "CallNode6"
    type: "call"
    ref: "ViewPipelineComponent-GetPipelineName"
    bindings:
      CompletePipelineName: "PipelineComponentBackToPipeline"
      PipelineName: "CurrentPipelineName"
      StartNode: "CurrentStartNodeName"
  - id: "CallNode7"
    type: "call"
    ref: "ViewPipelineComponent-RestoreDictionary"
  - id: "CallNode8"
    type: "call"
    ref: "ViewPipelineComponent-GetPipelineName"
    bindings:
      CompletePipelineName: "PipelineComponentCancelPipeline"
      PipelineName: "CurrentPipelineName"
      StartNode: "CurrentStartNodeName"
  - id: "CallNode9"
    type: "call"
    ref: "ViewPipelineComponent-GetPipelineName"
    bindings:
      CompletePipelineName: "PipelineComponentReturnPipeline"
      PipelineName: "CurrentPipelineName"
      StartNode: "CurrentStartNodeName"
  - id: "CombineMaps1"
    type: "pipelet"
    ref: "CombineMaps"
    config:
      ProcessMethod: "Concatenate HashMaps"
    bindings:
      Map1: "PipelineComponentMap"
      Map2: "PipelineComponentParameters"
      Map: "PipelineComponentMap"
  - id: "ConcatenateStrings1"
    type: "pipelet"
    ref: "ConcatenateStrings"
    config:
      DefaultString0: "PipelineComponent_"
    bindings:
      String1: "ComponentUUID"
      Concatenated: "PipelineComponentID"
  - id: "CreateUUID1"
    type: "pipelet"
    ref: "CreateUUID"
    bindings:
      UUID: "ComponentUUID"
  - id: "DecisionNode1"
    type: "decision"
    condition: "PipelineComponentCancelPipeline"
  - id: "DecisionNode2"
    type: "decision"
    condition: "SelectedMenuItem"
  - id: "DecisionNode5"
    type: "decision"
    condition: "PipelineComponentReturnValueName"
  - id: "DecisionNode8"
    type: "decision"
    condition: "CurrentChannel"
  - id: "EndNode1"
    type: "end"
    strict: true
    outputs:
      - key: "PipelineName"
        type: "java.lang.String"
        guaranteed: false
      - key: "StartNode"
        type: "java.lang.String"
        guaranteed: false
  - id: "EndNode2"
    type: "end"
    strict: true
    outputs:
      - key: "PipelineComponentID"
        type: "java.lang.String"
        guaranteed: true
  - id: "EndNode3"
    type: "end"
    strict: true
  - id: "EndNode4"
    type: "end"
    strict: true
  - id: "EndNode5"
    type: "end"
    strict: true
  - id: "EndNode6"
    type: "end"
    strict: false
  - id: "EndNode7"
    type: "end"
    strict: true
    outputs:
      - key: "SelectedMenuItem"
        type: "java.lang.String"
        guaranteed: true
  - id: "EndNode8"
    type: "end"
    strict: true
  - id: "ExchangeSessionObject1"
    type: "pipelet"
    ref: "ExchangeSessionObject"
    config:
      ProcessMethod: "Put Object to Session"
    bindings:
      SessionObjectName: "PipelineComponentID"
      SaveObject: "PipelineComponentMap"
  - id: "ExchangeSessionObject2"
    type: "pipelet"
    ref: "ExchangeSessionObject"
    config:
      ProcessMethod: "Get Object from Session"
    bindings:
      SessionObjectName: "PipelineComponentID"
      LoadObject: "PipelineComponentMap"
  - id: "ExchangeSessionObject3"
    type: "pipelet"
    ref: "ExchangeSessionObject"
    config:
      ProcessMethod: "Put Object to Session"
    bindings:
      SessionObjectName: "PipelineComponentID"
      SaveObject: "null"
      TargetSessionDomain: "null"
      TargetSessionID: "null"
  - id: "ExchangeSessionObject4"
    type: "pipelet"
    ref: "ExchangeSessionObject"
    config:
      ProcessMethod: "Get Object from Session"
    bindings:
      SessionObjectName: "PipelineComponentID"
      LoadObject: "PipelineComponentMap"
  - id: "ExchangeSessionObject6"
    type: "pipelet"
    ref: "ExchangeSessionObject"
    config:
      ProcessMethod: "Get Object from Session"
    bindings:
      SessionObjectName: "PipelineComponentID"
      LoadObject: "PipelineComponentMap"
  - id: "GetElementOfIterator1"
    type: "pipelet"
    ref: "GetElementOfIterator"
    bindings:
      Index: "\"(Integer)1\""
      Iterator: "PipelineNameParts"
      Element: "StartNode"
  - id: "GetEntryFromMap1"
    type: "pipelet"
    ref: "GetEntryFromMap"
    bindings:
      InMap: "PipelineComponentMap"
      Key: "ParameterName"
      Value: "TempValue"
  - id: "GetEntryFromMap2"
    type: "pipelet"
    ref: "GetEntryFromMap"
    bindings:
      InMap: "PipelineComponentMap"
      Key: "PipelineComponentMapKey"
      Value: "TempValue"
  - id: "GetEntryFromMap3"
    type: "pipelet"
    ref: "GetEntryFromMap"
    bindings:
      InMap: "PipelineComponentMap"
      Key: "ParameterName"
      Value: "TempValue"
  - id: "GetFirstElementOfIterator1"
    type: "pipelet"
    ref: "GetFirstElementOfIterator"
    bindings:
      Iterator: "PipelineNameParts"
      FirstElement: "PipelineName"
  - id: "JoinNode1"
    type: "join"
  - id: "JoinNode2"
    type: "join"
  - id: "JoinNode5"
    type: "join"
  - id: "JumpNode1"
    type: "jump"
  - id: "JumpNode2"
    type: "jump"
  - id: "JumpNode3"
    type: "jump"
  - id: "JumpNode4"
    type: "jump"
  - id: "JumpNode5"
    type: "jump"
  - id: "KeyMapper3"
    type: "pipelet"
    ref: "KeyMapper"
    bindings:
      InValue_2: "\"Catalogs\""
      OutValue_2: "SelectedMenuItem"
  - id: "KeyMapper6"
    type: "pipelet"
    ref: "KeyMapper"
    bindings:
      InValue_2: "\"ChannelCatalogs\""
      OutValue_2: "SelectedMenuItem"
  - id: "LoopNode1"
    type: "loop"
  - id: "LoopNode6"
    type: "loop"
  - id: "SetIndirectDictValue1"
    type: "pipelet"
    ref: "SetIndirectDictValue"
    bindings:
      KeyNameHolder: "PipelineComponentMapKey"
      MappedEntry: "TempValue"
  - id: "SetIndirectDictValue2"
    type: "pipelet"
    ref: "SetIndirectDictValue"
    bindings:
      KeyNameHolder: "ParameterName"
      MappedEntry: "TempValue"
  - id: "SetIndirectDictValue3"
    type: "pipelet"
    ref: "SetIndirectDictValue"
    bindings:
      KeyNameHolder: "ParameterName"
      MappedEntry: "TempValue"
  - id: "SetIndirectDictValue5"
    type: "pipelet"
    ref: "SetIndirectDictValue"
    bindings:
      KeyNameHolder: "PipelineComponentReturnValueName"
      MappedEntry: "PipelineComponentReturnValue"
  - id: "SplitString1"
    type: "pipelet"
    ref: "SplitString"
    bindings:
      Delimeter: "\"-\""
      ValuesString: "CompletePipelineName"
      ValuesIterator: "PipelineNameParts"

