flow: "ProcessReplicationPageCache_32"
kind: "process"

entries:
  - id: "Start1"
    name: "Start"
    mode: "private"
    strict: false
    inputs:
      []
  - id: "StartNode1"
    name: "GetAllSites"
    mode: "private"
    strict: true
    inputs:
      - key: "Channel"
        type: "com.intershop.component.mvc.capi.catalog.Repository"
        required: true

steps:
  - id: "AddObjectToVector1"
    type: "pipelet"
    ref: "AddObjectToVector"
    config:
      Mode: "Forbid Duplicates"
    bindings:
      InVector: "null"
      Iterator: "null"
      Object: "Channel:RepositoryDomain:Site:DomainName"
      Objects: "null"
      OutVector: "SiteNames"
  - id: "AddObjectToVector2"
    type: "pipelet"
    ref: "AddObjectToVector"
    config:
      Mode: "Forbid Duplicates"
    bindings:
      InVector: "null"
      Iterator: "null"
      Object: "null"
      Objects: "PartnerSiteNames"
      OutVector: "SiteNames"
  - id: "CallNode1"
    type: "call"
    ref: "This:GetAllSites"
    bindings:
      Channel: "CurrentChannel"
  - id: "CallNode2"
    type: "call"
    ref: "ProcessReplicationPageCache-GetAllSites"
    bindings:
      Organization: "Partner"
      SiteNames: "PartnerSiteNames"
  - id: "CallNode3"
    type: "call"
    ref: "ProcessOrganization_32-ListAll"
  - id: "CreateIteratorFromPageable1"
    type: "pipelet"
    ref: "CreateIteratorFromPageable"
    bindings:
      PageableIterator: "FilteredOrganizations"
      ResettableIterator: "Partners"
  - id: "End2"
    type: "end"
    strict: false
  - id: "EndNode1"
    type: "end"
    strict: true
    outputs:
      - key: "SiteNames"
        type: "java.util.Collection"
        guaranteed: true
  - id: "KeyMapper1"
    type: "pipelet"
    ref: "KeyMapper"
    bindings:
      InValue_1: "Channel"
      OutValue_1: "CurrentChannel"
  - id: "LoopNode2"
    type: "loop"
  - id: "UpdateCustomAttribute1"
    type: "pipelet"
    ref: "UpdateCustomAttribute"
    config:
      DefaultAttributeName: "PageCacheSiteNames"
      DefaultAttributeType: "MultipleString"
    bindings:
      AttributeName: "null"
      AttributeType: "null"
      AttributeValue: "SiteNames:Iterator"
      ExtensibleObject: "ReplicationTask"
      LocaleInformation: "null"

links:
  - from: "CallNode1"
    via: "next"
    to: "UpdateCustomAttribute1"
    into: "in"
  - from: "AddObjectToVector2"
    via: "next"
    to: "LoopNode2"
    into: "loop"
  - from: "StartNode1"
    via: "next"
    to: "AddObjectToVector1"
    into: "in"
  - from: "CallNode2"
    via: "next"
    to: "AddObjectToVector2"
    into: "in"
  - from: "LoopNode2"
    via: "next"
    to: "EndNode1"
    into: "in"
  - from: "KeyMapper1"
    via: "next"
    to: "CallNode3"
    into: "in"
  - from: "AddObjectToVector1"
    via: "next"
    to: "KeyMapper1"
    into: "in"
  - from: "LoopNode2"
    via: "do"
    to: "CallNode2"
    into: "in"
  - from: "CreateIteratorFromPageable1"
    via: "next"
    to: "LoopNode2"
    into: "in"
  - from: "CallNode3"
    via: "next"
    to: "CreateIteratorFromPageable1"
    into: "in"
  - from: "UpdateCustomAttribute1"
    via: "next"
    to: "End2"
    into: "in"
  - from: "Start1"
    via: "next"
    to: "CallNode1"
    into: "in"
