flow: "BatchProcessPageComponents"
kind: "process"

entries:
  - id: "StartNode1"
    name: "DeleteAssignments"
    mode: "private"
    strict: false
    inputs:
      []
  - id: "StartNode12"
    name: "ResolveAssignments"
    mode: "private"
    strict: true
    inputs:
      - key: "ContextObjectUUID"
        type: "java.lang.String"
        required: false
      - key: "Objects"
        type: "java.util.Iterator"
        required: true
  - id: "StartNode2"
    name: "InitBatch"
    mode: "private"
    strict: false
    inputs:
      []
  - id: "StartNode3"
    name: "PostBatch"
    mode: "private"
    strict: false
    inputs:
      []
  - id: "StartNode5"
    name: "CheckPublishingDates"
    mode: "private"
    strict: false
    inputs:
      []
  - id: "StartNode7"
    name: "AssignComponentsToSlots"
    mode: "private"
    strict: false
    inputs:
      []
  - id: "StartNode8"
    name: "GetNextPosition"
    mode: "private"
    strict: true
    inputs:
      - key: "Position"
        type: "java.lang.Integer"
        required: false
  - id: "StartNode9"
    name: "AssignComponentToSlots"
    mode: "private"
    strict: false
    inputs:
      []

steps:
  - id: "CalculateInteger1"
    type: "pipelet"
    ref: "CalculateInteger"
    config:
      Operation: "+"
      Operand2: 1
    bindings:
      Operand1: "Position"
      Result: "Position"
  - id: "CallNode1"
    type: "call"
    ref: "BatchProcessPageComponents-ResolveAssignments"
  - id: "CallNode11"
    type: "call"
    ref: "ProcessDate-ConvertPeriodToDate"
    bindings:
      ValidFromDate: "ValidFrom"
      ValidToDate: "ValidTo"
  - id: "CallNode12"
    type: "call"
    ref: "ViewPageletComponentAssignmentCreationWizard-CreateAssignments"
    bindings:
      ContentRepositoryUUID: "RepositoryUUID"
      SlotDefinitionQualifiedNames: "SelectedSlotDefinitionQualifiedNames"
      VisibleFrom: "ValidFrom"
      VisibleTo: "ValidTo"
      VisibilityFlag: "AssignmentFlagBoolean"
      ComponentUUID: "Component:UUID"
      PageletUUIDs: "SelectedPageletUUIDs"
      Position: "AssignmentPosition"
  - id: "CallNode14"
    type: "call"
    ref: "This:GetNextPosition"
  - id: "CallNode15"
    type: "call"
    ref: "ProcessDate-ConvertPeriodToDate"
    bindings:
      ValidFromDate: "ValidFrom"
      ValidToDate: "ValidTo"
  - id: "CallNode16"
    type: "call"
    ref: "ViewPageletComponentAssignmentCreationWizard-CreateAssignments"
    bindings:
      ContentRepositoryUUID: "RepositoryUUID"
      SlotDefinitionQualifiedNames: "SelectedSlotDefinitionQualifiedNames"
      VisibleFrom: "ValidFrom"
      VisibleTo: "ValidTo"
      VisibilityFlag: "AssignmentFlagBoolean"
      ComponentUUID: "SelectedPageletUUID"
      Position: "AssignmentPosition"
  - id: "CallNode25"
    type: "call"
    ref: "BatchProcessLog-LogPageletResult"
  - id: "CallNode3"
    type: "call"
    ref: "BatchProcessLog-PrepareLogger"
  - id: "CallNode4"
    type: "call"
    ref: "BatchProcessLog-CleanLogger"
  - id: "CallNode5"
    type: "call"
    ref: "ProcessDate-VerifyPeriod"
    bindings:
      PeriodFlag: "OnlineFlag"
  - id: "CallNode6"
    type: "call"
    ref: "BatchProcessLog-LogPageletResult"
  - id: "CallNode8"
    type: "call"
    ref: "BatchProcessPageComponents-ResolveAssignments"
  - id: "CreateMappingIterator1"
    type: "pipelet"
    ref: "CreateMappingIterator"
    config:
      ObjectMapperClass: "com.intershop.component.foundation.internal.util.PersistentObjectUUIDMapper"
    bindings:
      SourceIterator: "SelectedComponents"
      TargetIterator: "PageletUUIDs"
  - id: "DecisionNode1"
    type: "decision"
    condition: "Assignment:DomainID"
  - id: "DecisionNode2"
    type: "decision"
    condition: "AssignmentPosition"
  - id: "DecisionNode3"
    type: "decision"
    condition: "AssignmentPositioning"
  - id: "DecisionNode4"
    type: "decision"
    condition: "ContextObjectUUID"
  - id: "DecisionNode5"
    type: "decision"
    condition: "ErrorPeriodIncorrect"
  - id: "DecisionNode6"
    type: "decision"
    condition: "ErrorValidToIncorrect"
  - id: "DecisionNode7"
    type: "decision"
    condition: "ErrorValidFromIncorrect"
  - id: "DecisionNode8"
    type: "decision"
    condition: "Position"
  - id: "DecisionNode9"
    type: "decision"
    condition: "AssignmentPositioning"
  - id: "DeleteAssignment1"
    type: "pipelet"
    ref: "DeleteAssignment"
    bindings:
      Assignment: "Assignment"
      AssignmentFactory: "AssignmentStrategy:getAssignmentFactoryByTo(Assignment:To)"
      Domain: "Assignment:Domain"
  - id: "EndNode1"
    type: "end"
    strict: false
  - id: "EndNode10"
    type: "end"
    strict: false
  - id: "EndNode13"
    type: "end"
    strict: true
    outputs:
      - key: "SelectedComponents"
        type: "java.util.Iterator"
        guaranteed: true
  - id: "EndNode2"
    type: "end"
    strict: false
  - id: "EndNode3"
    type: "end"
    strict: false
  - id: "EndNode5"
    type: "end"
    strict: false
  - id: "EndNode6"
    type: "end"
    strict: false
  - id: "EndNode8"
    type: "end"
    strict: false
  - id: "EndNode9"
    type: "end"
    strict: true
    outputs:
      - key: "Position"
        type: "java.lang.Integer"
        guaranteed: false
  - id: "GetAssignmentStrategy1"
    type: "pipelet"
    ref: "GetAssignmentStrategy"
    bindings:
      Site: "ContextDomain:Site"
      To: "Assignment:To"
      From: "Assignment:From"
  - id: "GetFormSelection1"
    type: "pipelet"
    ref: "GetFormSelection"
    config:
      DefaultParameterName: "SelectedSlotDefinitionQualifiedName"
    bindings:
      Selection: "SelectedSlotDefinitionQualifiedNames"
  - id: "GetFormSelection2"
    type: "pipelet"
    ref: "GetFormSelection"
    config:
      DefaultParameterName: "PageletUUIDs"
    bindings:
      Selection: "SelectedPageletUUIDs"
  - id: "GetFormSelection4"
    type: "pipelet"
    ref: "GetFormSelection"
    config:
      DefaultParameterName: "SelectedSlotDefinitionQualifiedName"
    bindings:
      Selection: "SelectedSlotDefinitionQualifiedNames"
