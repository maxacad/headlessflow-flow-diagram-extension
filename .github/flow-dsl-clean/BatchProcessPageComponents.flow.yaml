  - id: "JoinNode2"
    type: "join"
  - id: "JoinNode3"
    type: "join"
  - id: "JoinNode6"
    type: "join"
  - id: "JoinNode8"
    type: "join"
  - id: "JoinNode9"
    type: "join"
  - id: "KeyMapper10"
    type: "pipelet"
    ref: "KeyMapper"
    bindings:
      InValue_1: "Objects"
      OutValue_1: "SelectedComponents"
  - id: "KeyMapper2"
    type: "pipelet"
    ref: "KeyMapper"
    bindings:
      InValue_1: "JobConfiguration:Domain"
      OutValue_1: "ContextDomain"
  - id: "KeyMapper6"
    type: "pipelet"
    ref: "KeyMapper"
    bindings:
      InValue_1: "\"(Integer)1\""
      OutValue_1: "Position"
  - id: "KeyMapper7"
    type: "pipelet"
    ref: "KeyMapper"
    bindings:
      InValue_1: "\"1\""
      OutValue_1: "AssignmentPosition"
  - id: "LoopNode2"
    type: "loop"
  - id: "LoopNode3"
    type: "loop"
  - id: "Pipelet4"
    type: "pipelet"
    ref: "SetDictionaryValue"
    config:
      Name: "Result"
      ValueType: "Dictionary Value"
      Value: "ErrorValidFromIncorrect"
  - id: "Pipelet40"
    type: "pipelet"
    ref: "RemoveDictionaryValue"
    config:
      Key: "Result"
  - id: "Pipelet5"
    type: "pipelet"
    ref: "SetDictionaryValue"
    config:
      Name: "Result"
      ValueType: "Dictionary Value"
      Value: "ErrorValidToIncorrect"
  - id: "Pipelet6"
    type: "pipelet"
    ref: "SetDictionaryValue"
    config:
      Name: "Result"
      ValueType: "Dictionary Value"
      Value: "ErrorPeriodIncorrect"
  - id: "ResolveAssignment3"
    type: "pipelet"
    ref: "ResolveAssignment"
    config:
      Mode: "From"
    bindings:
      ResolvedObjects: "SelectedComponents"
      Assignments: "Objects"
  - id: "SetDictionaryValue1"
    type: "pipelet"
    ref: "SetDictionaryValue"
    config:
      Name: "Result"
      Value: "Shared"
      ValueType: "Dictionary Value"
  - id: "ToString1"
    type: "pipelet"
    ref: "ToString"
    bindings:
      String1: "AssignmentPosition"
      Object1: "Position"
  - id: "VerifyBoolean1"
    type: "pipelet"
    ref: "VerifyBoolean"
    bindings:
      BooleanValue: "AssignmentFlagBoolean"
      NoneLocalizedString: "AssignmentFlag"
  - id: "VerifyBoolean2"
    type: "pipelet"
    ref: "VerifyBoolean"
    bindings:
      BooleanValue: "AssignmentFlagBoolean"
      NoneLocalizedString: "AssignmentFlag"
  - id: "VerifyInteger1"
    type: "pipelet"
    ref: "VerifyInteger"
    bindings:
      LocalizedString: "AssignmentPosition"
      IntegerObject: "Position"

