flow: "ProcessRecentlyViewedItems"
kind: "process"

entries:
  - id: "StartNode1"
    name: "AddRecentlyViewedItem"
    mode: "private"
    strict: true
    inputs:
      - key: "Domain"
        type: "com.intershop.beehive.core.capi.domain.Domain"
        required: true
      - key: "RecentlyViewedItemType"
        type: "java.lang.String"
        required: true
      - key: "RecentlyViewedItemValue"
        type: "java.lang.String"
        required: true
  - id: "StartNode10"
    name: "RemoveRecentlyViewProduct"
    mode: "private"
    strict: true
    inputs:
      - key: "Domain"
        type: "com.intershop.beehive.core.capi.domain.Domain"
        required: true
      - key: "ProductUUID"
        type: "java.lang.String"
        required: true
  - id: "StartNode2"
    name: "GetAllTrackedItemsForDomain"
    mode: "private"
    strict: true
    inputs:
      - key: "CatalogBORepository"
        type: "com.intershop.component.catalog.capi.CatalogBORepository"
        required: true
      - key: "ProductBORepository"
        type: "com.intershop.component.product.capi.ProductBORepository"
        required: true
      - key: "Domain"
        type: "com.intershop.beehive.core.capi.domain.Domain"
        required: true
  - id: "StartNode3"
    name: "AddRecentlyViewedProduct"
    mode: "private"
    strict: true
    inputs:
      - key: "ProductDomain"
        type: "com.intershop.beehive.core.capi.domain.Domain"
        required: true
      - key: "ProductUUID"
        type: "java.lang.String"
        required: true
  - id: "StartNode4"
    name: "AddRecentlyViewedSearchTerm"
    mode: "private"
    strict: true
    inputs:
      - key: "Domain"
        type: "com.intershop.beehive.core.capi.domain.Domain"
        required: false
      - key: "SearchTerm"
        type: "java.lang.String"
        required: true
  - id: "StartNode5"
    name: "AddRecentlyViewedCategory"
    mode: "private"
    strict: true
    inputs:
      - key: "Domain"
        type: "com.intershop.beehive.core.capi.domain.Domain"
        required: false
      - key: "CategoryName"
        type: "java.lang.String"
        required: false
      - key: "CategoryDomainName"
        type: "java.lang.String"
        required: false

steps:
  - id: "AddObjectToVector1"
    type: "pipelet"
    ref: "AddObjectToVector"
    bindings:
      Object: "ProductVariation:ID"
      InVector: "ProductVariationUUIDs"
      OutVector: "ProductVariationUUIDs"
  - id: "AddObjectToVector2"
    type: "pipelet"
    ref: "AddObjectToVector"
    bindings:
      InVector: "ProductVariationUUIDs"
      Iterator: "ProductVariationUUIDIterator"
  - id: "AddRecentlyViewedItem1"
    type: "pipelet"
    ref: "AddRecentlyViewedItem"
  - id: "CallNode1"
    type: "call"
    ref: "DetermineOrganizations-Current"
  - id: "CallNode10"
    type: "call"
    ref: "ProcessB2CProduct-GetProductBO"
  - id: "CallNode2"
    type: "call"
    ref: "DetermineOrganizations-Current"
  - id: "CallNode20"
    type: "call"
    ref: "ProcessRecentlyViewedItems-AddRecentlyViewedItem"
    bindings:
      RecentlyViewedItemType: "\"KEYWORD_SEARCHES\""
      RecentlyViewedItemValue: "SearchTerm"
      Domain: "Repository:Domain"
  - id: "CallNode25"
    type: "call"
    ref: "ProcessRecentlyViewedItems-AddRecentlyViewedItem"
    bindings:
      RecentlyViewedItemType: "\"CATEGORIES\""
      Domain: "Repository:Domain"
  - id: "CallNode3"
    type: "call"
    ref: "ProcessRecentlyViewedItems-RemoveRecentlyViewProduct"
    bindings:
      Domain: "ProductDomain"
  - id: "CallNode46"
    type: "call"
    ref: "ProcessRecentlyViewedItems-AddRecentlyViewedItem"
    bindings:
      RecentlyViewedItemType: "\"PRODUCTS\""
      RecentlyViewedItemValue: "ProductUUID"
      Domain: "ProductDomain"
  - id: "CallNode5"
    type: "call"
    ref: "ProcessB2CProduct-GetProduct"
    bindings:
      ProductDomain: "Domain"
  - id: "ConcatenateStrings1"
    type: "pipelet"
    ref: "ConcatenateStrings"
    config:
      DefaultString1: "@"
    bindings:
      String0: "CategoryName"
      String2: "CategoryDomainName"
      Concatenated: "RecentlyViewedItemValue"
  - id: "DecisionNode10"
    type: "decision"
    condition: "ProductBO:isProductMaster"
  - id: "EndNode1"
    type: "end"
    strict: true
  - id: "EndNode12"
    type: "end"
    strict: true
  - id: "EndNode2"
    type: "end"
    strict: true
    outputs:
      - key: "KeywordSearches"
        type: "java.util.Iterator"
        guaranteed: false
      - key: "CategoryBOs"
        type: "java.util.Collection<com.intershop.component.catalog.capi.CatalogCategoryBO>"
        guaranteed: false
      - key: "ProductBOs"
        type: "java.util.Collection<com.intershop.component.product.capi.ProductBO>"
        guaranteed: false
  - id: "EndNode3"
    type: "end"
    strict: true
  - id: "EndNode4"
    type: "end"
    strict: true
  - id: "EndNode5"
    type: "end"
    strict: true
  - id: "GetRecentlyViewedItems1"
    type: "pipelet"
    ref: "GetRecentlyViewedItems"
    bindings:
      RecentlyViewedItemType: "null"
  - id: "GetRepositoryByRepositoryDomain1"
    type: "pipelet"
    ref: "GetRepositoryByRepositoryDomain"
    bindings:
      RepositoryDomain: "CurrentOrganization:OwningDomain"
  - id: "GetRepositoryByRepositoryDomain2"
    type: "pipelet"
    ref: "GetRepositoryByRepositoryDomain"
    bindings:
      RepositoryDomain: "CurrentOrganization:OwningDomain"
  - id: "JoinNode8"
    type: "join"
  - id: "KeyMapper3"
    type: "pipelet"
    ref: "KeyMapper"
    bindings:
      InValue_1: "ProductBO:MasteredProducts"
      OutValue_1: "ProductVariations"
  - id: "KeyMapper4"
    type: "pipelet"
    ref: "KeyMapper"
    bindings:
      InValue_1: "ProductBO:ProductMaster"
      OutValue_1: "ProductBO"
  - id: "LoopNode1"
    type: "loop"
  - id: "RemoveRecentlyViewedItems1"
    type: "pipelet"
    ref: "RemoveRecentlyViewedItems"
    bindings:
      ItemsToDelete: "ProductVariationUUIDIterator"
      RecentlyViewType: "\"PRODUCTS\""

links:
  - from: "AddObjectToVector1"
    via: "next"
    to: "LoopNode1"
    into: "loop"
  - from: "AddObjectToVector2"
    via: "next"
    to: "RemoveRecentlyViewedItems1"
    into: "in"
  - from: "AddRecentlyViewedItem1"
    via: "next"
    to: "EndNode1"
    into: "in"
  - from: "CallNode10"
    via: "next"
    to: "DecisionNode10"
    into: "in"
  - from: "CallNode1"
    via: "next"
    to: "GetRepositoryByRepositoryDomain1"
    into: "in"
  - from: "CallNode20"
    via: "next"
    to: "EndNode5"
    into: "in"
  - from: "CallNode25"
    via: "next"
    to: "EndNode4"
    into: "in"
  - from: "CallNode2"
    via: "next"
    to: "GetRepositoryByRepositoryDomain2"
    into: "in"
  - from: "CallNode3"
    via: "next"
    to: "CallNode46"
    into: "in"
  - from: "CallNode46"
    via: "next"
    to: "EndNode3"
    into: "in"
  - from: "CallNode5"
    via: "next"
    to: "CallNode10"
    into: "in"
  - from: "ConcatenateStrings1"
    via: "next"
    to: "CallNode1"
    into: "in"
  - from: "DecisionNode10"
    via: "no"
    to: "KeyMapper4"
    into: "in"
  - from: "DecisionNode10"
    via: "yes"
    to: "JoinNode8"
    into: "in1"
  - from: "GetRecentlyViewedItems1"
    via: "next"
    to: "EndNode2"
    into: "in"
  - from: "GetRepositoryByRepositoryDomain1"
    via: "next"
    to: "CallNode25"
    into: "in"
  - from: "GetRepositoryByRepositoryDomain2"
    via: "next"
    to: "CallNode20"
    into: "in"
  - from: "JoinNode8"
    via: "next"
    to: "KeyMapper3"
    into: "in"
  - from: "KeyMapper3"
    via: "next"
    to: "LoopNode1"
    into: "in"
  - from: "KeyMapper4"
    via: "next"
    to: "JoinNode8"
    into: "in1"
  - from: "LoopNode1"
    via: "do"
    to: "AddObjectToVector1"
    into: "in"
  - from: "LoopNode1"
    via: "next"
    to: "AddObjectToVector2"
    into: "in"
  - from: "RemoveRecentlyViewedItems1"
    via: "next"
    to: "EndNode12"
    into: "in"
  - from: "StartNode10"
    via: "next"
    to: "CallNode5"
    into: "in"
  - from: "StartNode1"
    via: "next"
    to: "AddRecentlyViewedItem1"
    into: "in"
  - from: "StartNode2"
    via: "next"
    to: "GetRecentlyViewedItems1"
    into: "in"
  - from: "StartNode3"
    via: "next"
    to: "CallNode3"
    into: "in"
  - from: "StartNode4"
    via: "next"
    to: "CallNode2"
    into: "in"
  - from: "StartNode5"
    via: "next"
    to: "ConcatenateStrings1"
    into: "in"
