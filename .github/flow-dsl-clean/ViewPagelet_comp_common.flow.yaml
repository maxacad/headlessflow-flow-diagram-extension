  - from: "GetValuesFromRequest3"
    via: "next"
    to: "DecisionNode1"
    into: "in"
  - from: "GetValuesFromRequest2"
    via: "error"
    to: "GetRepositoryByRepositoryDomain2"
    into: "in"
  - from: "GetValuesFromRequest3"
    via: "error"
    to: "DecisionNode1"
    into: "in"
  - from: "DetermineRequestString1"
    via: "next"
    to: "ConcatenateStrings1"
    into: "in"
  - from: "DecisionNode4"
    via: "yes"
    to: "DetermineRequestString1"
