    into: "in2"
  - from: "ReadSyndFeed1"
    via: "next"
    to: "EndNode9"
    into: "in"
  - from: "DetermineRequestString1"
    via: "error"
    to: "JoinNode8"
    into: "in2"
  - from: "DecisionNode4"
    via: "no"
    to: "JoinNode8"
