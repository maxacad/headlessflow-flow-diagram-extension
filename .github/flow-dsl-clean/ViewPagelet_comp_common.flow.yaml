  - from: "CallNode9"
    via: "ERROR"
    to: "JoinNode5"
    into: "in2"
  - from: "GetRepositoryByRepositoryDomain2"
    via: "error"
    to: "JoinNode5"
    into: "in1"
  - from: "JoinNode3"
    via: "next"
    to: "CallNode11"
    into: "in"
  - from: "StartNode2"
    via: "next"
    to: "GetSyndicationByID1"
    into: "in"
  - from: "JoinNode6"
    via: "next"
    to: "EndNode8"
    into: "in"
  - from: "CallNode11"
    via: "next"
    to: "JoinNode6"
