    to: "GetValuesFromRequest3"
    into: "in"
  - from: "DecisionNode1"
    via: "no"
    to: "JoinNode2"
    into: "in2"
  - from: "DecisionNode1"
    via: "yes"
    to: "Pipelet1"
    into: "in"
  - from: "CallNode3"
    via: "next"
    to: "JoinNode2"
    into: "in1"
  - from: "DecisionNode2"
    via: "no"
    to: "VerifyInteger1"
    into: "in"
  - from: "GetSyndicationByID1"
    via: "next"
    to: "JoinNode1"
    into: "in1"
  - from: "VerifyInteger1"
    via: "error"
    to: "JoinNode9"
    into: "in2"
  - from: "GetRepositoryByRepositoryDomain2"
    via: "next"
    to: "CallNode9"
    into: "in"
  - from: "DecisionNode2"
    via: "yes"
    to: "JoinNode3"
    into: "in1"
  - from: "CallNode12"
    via: "next"
    to: "DecisionNode2"
    into: "in"
  - from: "StartNode5"
    via: "next"
    to: "KeyMapper1"
    into: "in"
  - from: "VerifyInteger1"
    via: "next"
    to: "JoinNode9"
    into: "in1"
  - from: "CallNode1"
    via: "next"
    to: "AddObjectToVector1"
    into: "in"
  - from: "Pipelet2"
    via: "next"
    to: "EndNode6"
    into: "in"
  - from: "StartNode6"
    via: "next"
    to: "Pipelet2"
    into: "in"
  - from: "AddObjectToVector1"
    via: "next"
    to: "EndNode1"
    into: "in"
  - from: "CallNode9"
    via: "next"
    to: "CallNode12"
