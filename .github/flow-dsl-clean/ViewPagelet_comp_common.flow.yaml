  - from: "StartNode8"
    via: "next"
    to: "GetValuesFromRequest2"
    into: "in"
  - from: "JoinNode9"
    via: "next"
    to: "JoinNode3"
    into: "in3"
  - from: "GetValuesFromRequest2"
    via: "next"
    to: "GetRepositoryByRepositoryDomain2"
    into: "in"
  - from: "JoinNode5"
    via: "next"
    to: "JoinNode6"
