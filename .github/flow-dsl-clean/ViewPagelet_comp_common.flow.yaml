flow: "ViewPagelet_comp_common"
kind: "view"

entries:
  - id: "StartNode1"
    name: "CompareListSummary"
    mode: "include"
    strict: true
    inputs:
      []
  - id: "StartNode2"
    name: "DataFeed"
    mode: "private"
    strict: false
    inputs:
      []
  - id: "StartNode3"
    name: "CategoryProductList"
    mode: "private"
    strict: true
    inputs:
      - key: "PageletConfigurationParameters"
        type: "java.util.Map"
        required: true
  - id: "StartNode5"
    name: "FeaturedCategoryList"
    mode: "private"
    strict: true
    inputs:
      - key: "PageletConfigurationParameters"
        type: "java.util.Map"
        required: true
  - id: "StartNode6"
    name: "FeaturedProductList"
    mode: "private"
    strict: true
    inputs:
      - key: "PageletConfigurationParameters"
        type: "java.util.Map"
        required: true
  - id: "StartNode8"
    name: "PromotionList"
    mode: "private"
    strict: false
    inputs:
      []
  - id: "StartNode9"
    name: "ReadSyndFeed"
    mode: "private"
    strict: false
    inputs:
      []

steps:
  - id: "AddObjectToVector1"
    type: "pipelet"
    ref: "AddObjectToVector"
    bindings:
      Objects: "ProductCompareRefIDs"
      OutVector: "ProductCompareRefIDs"
  - id: "CallNode1"
    type: "call"
    ref: "ViewProductCompare-GetProductCompareRefIDs"
  - id: "CallNode11"
    type: "call"
    ref: "ProcessPromotion-GetApplicablePromotions"
    bindings:
      ApplicationID: "CurrentAppContext:Variables:Application:UUID"
  - id: "CallNode12"
    type: "call"
    ref: "ProcessUserGroups-GetCurrentUserUserGroups"
  - id: "CallNode3"
    type: "call"
    ref: "ProcessChannelCatalog-GetAssignedProducts"
  - id: "CallNode9"
    type: "call"
    ref: "ProcessB2CProduct-GetProduct"
    bindings:
      ProductDomain: "CurrentProductRepository:RepositoryDomain"
      ProductUUID: "ProductBO:ID"
  - id: "ConcatenateStrings1"
    type: "pipelet"
    ref: "ConcatenateStrings"
    config:
      DefaultString1: "&url="
    bindings:
      String0: "SyndFeedURL"
      Concatenated: "SyndFeedURL"
      String2: "RequestString"
  - id: "DecisionNode1"
    type: "decision"
    condition: "PageletConfigurationParameters:category"
  - id: "DecisionNode2"
    type: "decision"
    condition: "PageletConfigurationParameters:maxCount"
  - id: "DecisionNode4"
    type: "decision"
    condition: "appendRequestURL"
  - id: "DetermineRequestString1"
    type: "pipelet"
    ref: "DetermineRequestString"
    config:
      useShortURI: true
      addQuery: true
  - id: "EndNode1"
    type: "end"
    strict: true
    outputs:
      - key: "ProductCompareRefIDs"
        type: "java.util.Vector"
        guaranteed: false
  - id: "EndNode2"
    type: "end"
    strict: false
    outputs:
      - key: "Syndication"
        type: "com.intershop.component.foundation.capi.syndication.Syndication"
        guaranteed: false
  - id: "EndNode3"
    type: "end"
    strict: true
    outputs:
      - key: "ProductBOs"
        type: "com.intershop.beehive.core.capi.paging.PageableIterator"
        guaranteed: false
      - key: "CategoryBO"
        type: "com.intershop.component.catalog.capi.CatalogCategoryBO"
        guaranteed: false
  - id: "EndNode5"
    type: "end"
    strict: true
    outputs:
      - key: "CategoryBOs"
        type: "java.util.Collection"
        guaranteed: false
  - id: "EndNode6"
    type: "end"
    strict: true
    outputs:
      - key: "ProductBOs"
        type: "java.util.Collection"
        guaranteed: false
  - id: "EndNode8"
    type: "end"
    strict: false
    outputs:
      - key: "ApplicablePromotions"
        type: "java.util.Iterator"
        guaranteed: true
  - id: "EndNode9"
    type: "end"
    strict: false
  - id: "GetRepositoryByRepositoryDomain2"
    type: "pipelet"
    ref: "GetRepositoryByRepositoryDomain"
    bindings:
      RepositoryDomain: "CurrentOrganization:OwningDomain"
      Repository: "CurrentProductRepository"
  - id: "GetSyndicationByID1"
    type: "pipelet"
    ref: "GetSyndicationByID"
    bindings:
      Domain: "Pagelet:Domain"
      ID: "PageletConfigurationParameters:datafeed"
  - id: "GetValuesFromRequest1"
    type: "pipelet"
    ref: "GetValuesFromRequest"
    config:
      Namespace: "Application"
    bindings:
      Key: "\"CurrentOrganization\""
      Namespace: "null"
  - id: "GetValuesFromRequest2"
    type: "pipelet"
    ref: "GetValuesFromRequest"
    config:
      Namespace: "Application"
    bindings:
      Key: "\"CurrentOrganization\""
      Namespace: "null"
  - id: "GetValuesFromRequest3"
    type: "pipelet"
    ref: "GetValuesFromRequest"
    config:
      Namespace: "ApplicationRepository"
    bindings:
      Namespace: "null"
      Key: "null"
  - id: "JoinNode1"
    type: "join"
  - id: "JoinNode2"
    type: "join"
  - id: "JoinNode3"
    type: "join"
  - id: "JoinNode5"
    type: "join"
  - id: "JoinNode6"
    type: "join"
  - id: "JoinNode7"
    type: "join"
  - id: "JoinNode8"
    type: "join"
  - id: "JoinNode9"
    type: "join"
  - id: "KeyMapper1"
    type: "pipelet"
    ref: "KeyMapper"
    bindings:
      InValue_1: "PageletConfigurationParameters:categories"
      OutValue_1: "CategoryBOs"
  - id: "KeyMapper2"
    type: "pipelet"
    ref: "KeyMapper"
    bindings:
      InValue_1: "PageletConfigurationParameters:syndFeedURL"
      OutValue_1: "SyndFeedURL"
      InValue_2: "PageletConfigurationParameters:headerText"
      OutValue_2: "HeaderText"
      InValue_3: "PageletConfigurationParameters:maxItems"
      OutValue_3: "maxItems"
      InValue_4: "PageletConfigurationParameters:appendRequestURL"
      OutValue_4: "appendRequestURL"
      InValue_5: "PageletConfigurationParameters:displayOptions"
      OutValue_5: "DisplayOptions"
  - id: "Pipelet1"
    type: "pipelet"
    ref: "KeyMapper"
    bindings:
      InValue_1: "PageletConfigurationParameters:category"
      OutValue_1: "CategoryBO"
  - id: "Pipelet2"
    type: "pipelet"
    ref: "KeyMapper"
    bindings:
      InValue_1: "PageletConfigurationParameters:products"
      OutValue_1: "ProductBOs"
  - id: "ReadSyndFeed1"
    type: "pipelet"
    ref: "ReadSyndFeed"
    config:
      UseFeedCache: "yes"
  - id: "VerifyInteger1"
    type: "pipelet"
    ref: "VerifyInteger"
    bindings:
      LocalizedString: "PageletConfigurationParameters:maxCount"
      IntegerObject: "PromotionLimit"

links:
  - from: "StartNode1"
    via: "next"
    to: "CallNode1"
    into: "in"
  - from: "JoinNode2"
    via: "next"
    to: "EndNode3"
    into: "in"
  - from: "Pipelet1"
    via: "next"
    to: "CallNode3"
    into: "in"
  - from: "KeyMapper1"
    via: "next"
    to: "EndNode5"
    into: "in"
  - from: "GetValuesFromRequest1"
