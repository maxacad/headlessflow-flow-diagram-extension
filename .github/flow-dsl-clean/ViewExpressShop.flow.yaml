flow: "ViewExpressShop"
kind: "view"

entries:
  - id: "StartNode1"
    name: "Dispatch"
    mode: "private"
    strict: false
    inputs:
      []
  - id: "StartNode2"
    name: "ViewCart"
    mode: "private"
    strict: false
    inputs:
      - key: "ConfigurationPageletUUID"
        type: "java.lang.String"
        required: true
  - id: "StartNode3"
    name: "ViewProduct"
    mode: "private"
    strict: true
    inputs:
      - key: "SKU"
        type: "java.lang.String"
        required: true
      - key: "CategoryID"
        type: "java.lang.String"
        required: false
      - key: "ConfigurationPageletUUID"
        type: "java.lang.String"
        required: true
  - id: "StartNode4"
    name: "GetDefaultVariationProduct"
    mode: "private"
    strict: false
    inputs:
      []
  - id: "StartNode5"
    name: "AddProduct"
    mode: "private"
    strict: false
    inputs:
      - key: "ApplicationBO"
        type: "com.intershop.component.application.capi.ApplicationBO"
        required: false
  - id: "StartNode6"
    name: "AddGiftCertificate"
    mode: "private"
    strict: false
    inputs:
      []

steps:
  - id: "CallNode1"
    type: "call"
    ref: "ProcessB2CProduct-GetProduct"
    bindings:
      ProductDomain: "CurrentProductRepository:RepositoryDomain"
  - id: "CallNode10"
    type: "call"
    ref: "ProcessUserGroups-GetCurrentUserUserGroups"
  - id: "CallNode11"
    type: "call"
    ref: "ProcessPromotion-GetApplicablePromotions"
    bindings:
      ApplicationID: "CurrentAppContext:Variables:Application:UUID"
  - id: "CallNode12"
    type: "call"
    ref: "GetCatalogFilters-IsProductVisible"
  - id: "CallNode13"
    type: "call"
    ref: "GetCatalogFilters-GetFiltersByUser"
    bindings:
      CatalogFilterDomain: "CurrentOrganization:OwningDomain"
      UseFallbackToEveryoneDomain: "\"true\""
      EveryoneDomain: "CurrentOrganization:OrganizationDomain"
  - id: "CallNode14"
    type: "call"
    ref: "FireTrackingEvents-ViewProduct"
    bindings:
      CurrentProduct: "Product"
  - id: "CallNode15"
    type: "call"
    ref: "ProcessPagelet-GetPageletConfiguration"
    bindings:
      PageletUUID: "ConfigurationPageletUUID"
      ConfigurationParameterMap: "ConfigurationMap"
  - id: "CallNode16"
    type: "call"
    ref: "ProcessPagelet-GetPageletConfiguration"
    bindings:
      PageletUUID: "ConfigurationPageletUUID"
      ConfigurationParameterMap: "ConfigurationMap"
  - id: "CallNode18"
    type: "call"
    ref: "ViewGiftCertificates-Update"
    bindings:
      aaa: "[Enter Alias]"
  - id: "CallNode19"
    type: "call"
    ref: "ProcessGiftCard-IsDigitalCertificate"
  - id: "CallNode2"
    type: "call"
    ref: "DetermineRepositories-Channel"
  - id: "CallNode20"
    type: "call"
    ref: "ProcessGiftCard-IsDigitalCertificate"
  - id: "CallNode3"
    type: "call"
    ref: "ProcessB2CProduct-GetProductBO"
    bindings:
      SelectedAttributesMap: "SelectedVariationAttributesMap"
  - id: "CallNode4"
    type: "call"
    ref: "ProcessCart-GetProductsToAdd"
  - id: "CallNode45"
    type: "call"
    ref: "ProcessCart-CreateGiftCardStaticAddress"
    bindings:
      Cart: "CurrentCart"
      GiftCardParameters: "GiftCertificateFormParams"
  - id: "CallNode5"
    type: "call"
    ref: "ProcessCart-GetCurrentCart"
    bindings:
      User: "CurrentUser"
      Organization: "CurrentOrganization"
      BasketBORepository: "ApplicationBO:Extension(\"Basket\"):getBasketBORepository(CurrentOrganization)"
  - id: "CallNode6"
    type: "call"
    ref: "ProcessCart-GetCurrentCartBO"
    bindings:
      Basket: "CurrentCart"
      BasketBORepository: "ApplicationBO:Extension(\"Basket\"):getBasketBORepository(CurrentOrganization)"
      BasketBO: "CurrentCartBO"
  - id: "CallNode7"
    type: "call"
    ref: "ViewExpressShop-GetDefaultVariationProduct"
    bindings:
      SelectedAttributesMap: "SelectedVariationAttributesMap"
  - id: "CallNode8"
    type: "call"
    ref: "ProcessB2CProduct-GetProduct"
    bindings:
      ProductDomain: "CurrentProductRepository:RepositoryDomain"
      ProductUUID: "Product:DefaultProductVariation:ProductID"
  - id: "CallNode9"
    type: "call"
    ref: "ProcessCart-AddProducts"
    bindings:
      Cart: "CurrentCart"
      PreferenceDomain: "CurrentProductRepository:Domain"
      BasketBO: "CurrentCartBO"
  - id: "ConcatenateStrings2"
    type: "pipelet"
    ref: "ConcatenateStrings"
    bindings:
      Concatenated: "QuantityKey"
      String0: "\"Quantity_\""
      String1: "SKU"
  - id: "DecisionNode1"
    type: "decision"
    condition: "ConfigurationMap:addToCartBehavior"
  - id: "DecisionNode2"
    type: "decision"
    condition: "Product:DefaultProductVariation"
  - id: "DecisionNode3"
    type: "decision"
    condition: "GiftCertificateFormParams:EntrySet:Iterator"
  - id: "DecisionNode4"
    type: "decision"
    condition: "Product:DomainID"
  - id: "DecisionNode5"
    type: "decision"
    condition: "DependentSKUMap:EntrySet:Iterator"
  - id: "DecisionNode6"
    type: "decision"
    condition: "ProductBO:Online"
  - id: "DispatchFormAction3"
    type: "pipelet"
    ref: "DispatchFormAction"
    config:
      OutValue_0: "ViewExpressShop-AddProduct"
      OutValue_1: "ViewWishlist-AddItems"
      OutValue_2: "ViewExpressShop-AddGiftCertificate"
    bindings:
      SelectionKey: "JumpTarget"
      Key_0: "addProduct"
      Key_1: "addToWishlistProduct"
      Key_2: "addGiftCertificate"
  - id: "EndNode2"
    type: "end"
    strict: false
  - id: "GetIndirectDictValue2"
    type: "pipelet"
    ref: "GetIndirectDictValue"
    bindings:
      KeyNameHolder: "QuantityKey"
      MappedEntry: "NewQuantity"
  - id: "InteractionNode1"
    type: "interaction"
  - id: "InteractionNode2"
    type: "interaction"
  - id: "InteractionNode3"
    type: "interaction"
  - id: "JoinNode1"
    type: "join"
  - id: "JoinNode2"
    type: "join"
  - id: "JoinNode3"
    type: "join"
  - id: "JoinNode4"
    type: "join"
  - id: "JoinNode5"
    type: "join"
  - id: "JoinNode6"
    type: "join"
  - id: "JoinNode7"
    type: "join"
  - id: "JoinNode8"
    type: "join"
  - id: "Jump2"
    type: "jump"
  - id: "JumpNode1"
    type: "jump"
    ref: "ViewCart-View"
  - id: "JumpNode2"
    type: "jump"
    ref: "ViewHomepage-DisplayCachedHomepage"
  - id: "JumpNode3"
    type: "jump"
    ref: "Error-Start"
  - id: "JumpNode4"
    type: "jump"
    ref: "Error-Start"
  - id: "JumpNode5"
    type: "jump"
    ref: "ViewGiftCertificates-ViewGiftCertificateForm"
  - id: "KeyMapper1"
    type: "pipelet"
    ref: "KeyMapper"
    bindings:
      InValue_1: "CurrentRequest:PipelineDictionary"
      OutValue_1: "Dictionary"
  - id: "KeyMapper2"
    type: "pipelet"
    ref: "KeyMapper"
    bindings:
      InValue_1: "QuantityKey"
      OutValue_1: "QuantityName"
      OutValue_2: "QuantityValue"
      InValue_2: "NewQuantity"
  - id: "SetDictionaryValue1"
    type: "pipelet"
    ref: "SetDictionaryValue"
    config:
      Name: "PRODUCTNOTFOUND"
      Value: true
  - id: "SetDictionaryValue2"
    type: "pipelet"
    ref: "SetDictionaryValue"
    config:
      Name: "IsExpressShop"
      Value: true
  - id: "SetDictionaryValue4"
    type: "pipelet"
    ref: "SetDictionaryValue"
    config:
      Name: "ForceAllowRepeats"
      Value: true
  - id: "SetDictionaryValue5"
    type: "pipelet"
    ref: "SetDictionaryValue"
    config:
      Name: "IsExpressShop"
      Value: true

