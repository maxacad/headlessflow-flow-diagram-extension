  - id: "Jump3"
    type: "jump"
    ref: "SecureJump-Start"
  - id: "JumpNode1"
    type: "jump"
    ref: "Error-Start"
  - id: "JumpNode2"
    type: "jump"
    ref: "ViewChannelLabelItems-List"
  - id: "JumpNode3"
    type: "jump"
    ref: "ViewChannelLabelItems-List"
  - id: "LoopNode1"
    type: "loop"
  - id: "LoopNode2"
    type: "loop"
  - id: "PrepareApplicationView3"
    type: "pipelet"
    ref: "PrepareApplicationView"
    config:
      SelectedMenuItem: "MassDataTasks"
      WorkingTemplate: "labeling/ChannelLabelItemList"
  - id: "RemoveClipboard2"
    type: "pipelet"
    ref: "RemoveClipboard"
    config:
      SessionRegistrationID: "CB_LabelAssignments"
  - id: "RemoveDictionaryValue2"
    type: "pipelet"
    ref: "RemoveDictionaryValue"
    config:
      Key: "LabelAssignments"
  - id: "RemoveLabelAssignment1"
    type: "pipelet"
    ref: "RemoveLabelAssignment"
    bindings:
      LabelAssignmentUUID: "null"
  - id: "SetDictionaryValue3"
    type: "pipelet"
    ref: "SetDictionaryValue"
    config:
      Name: "JumpTarget"
      Value: "ViewChannelLabelItems-Paging"
      ValueType: "Dictionary Value"
  - id: "SetPage1"
    type: "pipelet"
    ref: "SetPage"
    config:
      DefaultPageNumber: 0
    bindings:
      Pageable: "LabelAssignments"
  - id: "SetPageLocator2"
    type: "pipelet"
    ref: "SetPageLocator"
    config:
      DefaultHandlerPipeline: "ViewChannelLabelItems-Paging"
      DefaultPageLocatorName: "LabelAssignments"
    bindings:
      Pageable: "LabelAssignments"
      HandlerPipeline: "null"
      PageLocatorName: "null"
  - id: "SwitchToNextPage1"
    type: "pipelet"
    ref: "SwitchToNextPage"
    bindings:
      PageableIterator: "LabelAssignments"
  - id: "UpdateClipboard2"
    type: "pipelet"
    ref: "UpdateClipboard"
    config:
      SessionRegistrationID: "CB_LabelAssignments"
      StoreFormValues: "No"
    bindings:
      AllObjectUUIDs: "LabelAssignmentUUIDIterator"
      SelectedObjectUUIDs: "SelectedLabelAssignmentUUIDIterator"
      SessionRegistrationID: "null"
  - id: "UpdateMapping1"
    type: "pipelet"
    ref: "UpdateMapping"
    config:
      Mode: "Remove"
    bindings:
      InMap: "SelectedLabelAssignmentsMap"
      Key: "LabelAssignmentUUIDToRemove"
      OutMap: "SelectedLabelAssignmentsMap"
      Keys: "SelectedLabelAssignmentKeys"
      Value: "LabelAssignmentUUIDToRemove"
  - id: "UpdatePageSize2"
    type: "pipelet"
    ref: "UpdatePageSize"
    config:
      DefaultPageSize: 15
    bindings:
      PageableIterator: "LabelAssignments"

