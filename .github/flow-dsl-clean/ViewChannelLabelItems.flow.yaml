flow: "ViewChannelLabelItems"
kind: "view"

entries:
  - id: "Start5"
    name: "Dispatch"
    mode: "private"
    strict: false
    inputs:
      []
  - id: "Start6"
    name: "UpdateClipboard"
    mode: "private"
    strict: false
    inputs:
      []
  - id: "StartNode1"
    name: "Prefix"
    mode: "private"
    strict: false
    inputs:
      []
  - id: "StartNode2"
    name: "Unassign"
    mode: "public"
    strict: false
    inputs:
      []
  - id: "StartNode7"
    name: "List"
    mode: "private"
    strict: false
    inputs:
      []
  - id: "StartNode9"
    name: "Paging"
    mode: "private"
    strict: false
    inputs:
      []

steps:
  - id: "AddEntryToMap1"
    type: "pipelet"
    ref: "AddEntryToMap"
    bindings:
      InMap: "SelectedLabelAssignmentsMap"
      Key: "SelectedLabelAssignmentUUID"
      Value: "SelectedLabelAssignmentUUID"
      OutMap: "SelectedLabelAssignmentsMap"
      Keys: "null"
  - id: "CallNode1"
    type: "call"
    ref: "ViewChannelLabelItems-Prefix"
  - id: "CallNode2"
    type: "call"
    ref: "ViewChannelLabelItems-Prefix"
  - id: "CallNode3"
    type: "call"
    ref: "ViewChannelLabelItems-UpdateClipboard"
  - id: "CallNode4"
    type: "call"
    ref: "ProcessPaging-SetPageNumber"
    bindings:
      Pageable: "LabelAssignments"
  - id: "CallNode5"
    type: "call"
    ref: "ProcessPaging-GetPageLocatorPageable"
    bindings:
      PageLocatorName: "\"LabelAssignments\""
      Pageable: "LabelAssignments"
  - id: "CallNode6"
    type: "call"
    ref: "ProcessPaging-GetPageLocatorPageable"
    bindings:
      PageLocatorName: "\"LabelAssignments\""
      Pageable: "LabelAssignments"
  - id: "CallNode7"
    type: "call"
    ref: "ProcessLabel-GetLabelAssignments"
    bindings:
      LabelAssignments: "UnfilteredLabelAssignments"
  - id: "CreatePageableFromIterator1"
    type: "pipelet"
    ref: "CreatePageableFromIterator"
    bindings:
      Iterator: "FilteredLabelAssigments"
      Pageable: "LabelAssignments"
  - id: "DecisionNode1"
    type: "decision"
    condition: "SelectedLabelAssignmentsMap:get(LabelAssignment:UUID)"
  - id: "DecisionNode2"
    type: "decision"
    condition: "SelectedLabelAssignmentKeys"
  - id: "DispatchFormAction1"
    type: "pipelet"
    ref: "DispatchFormAction"
    config:
      OutValue_0: "ViewChannelLabelItems-Unassign"
      PagingPipeline: "ViewChannelLabelItems-Paging"
      OutValue_1: "ViewChannelLabelItems-Paging"
      OutValue_2: "ViewChannelLabelAction-SelectAction"
    bindings:
      SelectionKey: "JumpTarget"
      Key_0: "unassign"
      Key_1: "confirmUnassign"
      Key_2: "selectAction"
  - id: "End2"
    type: "end"
    strict: false
  - id: "EndNode1"
    type: "end"
    strict: false
  - id: "FilterIterator2"
    type: "pipelet"
    ref: "FilterIterator"
    config:
      PredicateClass: "com.intershop.sellside.channel.base.internal.label.LabelAssignmentPredicate"
    bindings:
      Iterator: "UnfilteredLabelAssignments"
      FilteredIterator: "FilteredLabelAssigments"
  - id: "GetClipboard1"
    type: "pipelet"
    ref: "GetClipboard"
    config:
      SessionRegistrationID: "CB_LabelAssignments"
      SetFormValues: "No"
    bindings:
      UUIDIterator: "SelectedLabelAssignmentUUIDs"
  - id: "GetFormSelection3"
    type: "pipelet"
    ref: "GetFormSelection"
    config:
      DefaultParameterName: "LabelAssignmentUUID"
    bindings:
      Selection: "LabelAssignmentUUIDIterator"
  - id: "GetFormSelection4"
    type: "pipelet"
    ref: "GetFormSelection"
    config:
      DefaultParameterName: "SelectedLabelAssignmentUUID"
    bindings:
      Selection: "SelectedLabelAssignmentUUIDIterator"
  - id: "GetLabel2"
    type: "pipelet"
    ref: "GetLabel"
  - id: "InteractionEnd3"
    type: "interaction"
  - id: "InvalidatePageLocatorPageable1"
    type: "pipelet"
    ref: "InvalidatePageLocatorPageable"
