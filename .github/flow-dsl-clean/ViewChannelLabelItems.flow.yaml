      DefaultPageLocatorName: "LabelAssignments"
    bindings:
      PageLocatorName: "null"
  - id: "JoinNode10"
    type: "join"
  - id: "JoinNode2"
    type: "join"
  - id: "JoinNode3"
    type: "join"
  - id: "JoinNode4"
    type: "join"
  - id: "JoinNode7"
    type: "join"
  - id: "Jump1"
    type: "jump"
