      UnitDirectory: "IMPEX_DIR"
      IncludeParentDirectories: false
    bindings:
      UnitDomain: "CurrentChannel:Domain:Site"
  - id: "Pipelet21"
    type: "pipelet"
    ref: "ExtractCompressedFile"
    config:
      Overwrite: true
      Excludes: "${File.separator}"
    bindings:
      SourceUnitDomain: "CurrentChannel:Domain:Site"
      TargetUnitDomain: "CurrentChannel:Domain:Site"
      TargetUnitDirectory: "\"IMPEX_SRC_DIR\""
      TargetDirectoryPath: "\"localization\""
      SourceDirectoryPath: "\"upload\""
      SourceUnitDirectory: "\"IMPEX_DIR\""
