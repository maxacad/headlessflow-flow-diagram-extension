    bindings:
      Object: "ActionDescriptor"
      Objects: "TypeActionDescriptors"
      Iterator: "TypeActionDescriptors"
  - id: "CallNode1"
    type: "call"
    ref: "ViewRuleActionConfiguration-DeleteActionClipboard"
  - id: "CallNode19"
    type: "call"
    ref: "ProcessActionConfiguration-CreateActionForm"
  - id: "CallNode22"
    type: "call"
    ref: "ProcessActionConfiguration-CreateAction"
    bindings:
      Owner: "ActionOwner"
  - id: "CallNode24"
    type: "call"
    ref: "ProcessActionConfiguration-CreateActionForm"
  - id: "CallNode25"
    type: "call"
    ref: "ProcessActionConfiguration-CreateActionForm"
  - id: "CallNode26"
    type: "call"
    ref: "ProcessActionConfiguration-UpdateConfigurationParameters"
  - id: "CallNode28"
    type: "call"
    ref: "ProcessActionConfiguration-RemoveAction"
  - id: "CallNode30"
    type: "call"
    ref: "ProcessActionConfiguration-CreateActionForm"
  - id: "DecisionNode16"
    type: "decision"
    condition: "ActionForm:Invalid"
  - id: "DecisionNode5"
    type: "decision"
    condition: "ActionDescriptor:Type"
  - id: "DecisionNode7"
    type: "decision"
    condition: "ActionForm:ActionType:ValueMissing"
  - id: "DecisionNode8"
    type: "decision"
    condition: "FormParameterValuesMap"
  - id: "End1"
    type: "end"
    strict: false
  - id: "End2"
