      ActionID: "EditActionID"
  - id: "GetActionByID2"
    type: "pipelet"
    ref: "GetActionByID"
    bindings:
      ActionID: "EditActionID"
      Action: "EditAction"
  - id: "GetClipboard2"
    type: "pipelet"
    ref: "GetClipboard"
    config:
      SessionRegistrationID: "Actions"
      SetFormValues: "No"
    bindings:
      UUIDIterator: "SelectedActions"
  - id: "GetFormRecord1"
    type: "pipelet"
    ref: "GetFormRecord"
