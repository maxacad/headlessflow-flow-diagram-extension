  - id: "Start2"
    name: "DeleteActionClipboard"
    mode: "private"
    strict: false
    inputs:
      []
  - id: "Start6"
    name: "UpdateActionClipboard"
    mode: "private"
    strict: false
    inputs:
      []
  - id: "StartNode10"
    name: "NewAction"
    mode: "private"
    strict: false
    inputs:
      []
  - id: "StartNode11"
    name: "CreateAction"
    mode: "private"
    strict: false
    inputs:
      - key: "ActionOwner"
        type: "com.intershop.beehive.core.capi.domain.PersistentObject"
        required: true
  - id: "StartNode12"
    name: "UpdateAction"
    mode: "private"
    strict: false
    inputs:
      - key: "PromotionUUID"
        type: "java.lang.String"
        required: true
      - key: "EditActionID"
        type: "java.lang.String"
        required: true
  - id: "StartNode13"
    name: "EditAction"
    mode: "private"
    strict: false
    inputs:
      - key: "PromotionUUID"
        type: "java.lang.String"
        required: true
      - key: "EditActionID"
        type: "java.lang.String"
        required: true
  - id: "StartNode15"
    name: "RemoveAction"
    mode: "private"
    strict: false
    inputs:
      - key: "PromotionUUID"
        type: "java.lang.String"
        required: false

