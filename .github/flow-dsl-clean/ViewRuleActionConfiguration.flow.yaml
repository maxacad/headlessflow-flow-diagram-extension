    type: "loop"
  - id: "RemoveClipboard3"
    type: "pipelet"
    ref: "RemoveClipboard"
    config:
      SessionRegistrationID: "Actions"
  - id: "RemoveDictionaryValue2"
    type: "pipelet"
    ref: "RemoveDictionaryValue"
    config:
      Key: "EditAction"
  - id: "SetFormParameterValues3"
    type: "pipelet"
    ref: "SetFormParameterValues"
  - id: "SetFormParameterValues4"
    type: "pipelet"
    ref: "SetFormParameterValues"
  - id: "UpdateClipboard1"
    type: "pipelet"
    ref: "UpdateClipboard"
    config:
      SessionRegistrationID: "Actions"
      StoreFormValues: "No"
    bindings:
      AllObjectUUIDs: "SelectedActions:KeySet:Iterator"
      SelectedObjectUUIDs: "SelectedActions:KeySet:Iterator"
