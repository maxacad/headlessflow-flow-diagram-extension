flow: "ViewPagelet_comp_search"
kind: "view"

entries:
  - id: "StartNode1"
    name: "TermSpecificContent"
    mode: "private"
    strict: true
    inputs:
      - key: "SearchTerm"
        type: "java.lang.Object"
        required: false
      - key: "Slot"
        type: "java.lang.Object"
        required: true
      - key: "Pagelet"
        type: "java.lang.Object"
        required: true
      - key: "StaticContext"
        type: "java.lang.Object"
        required: true

steps:
  - id: "DecisionNode2"
    type: "decision"
    condition: "PageletAssignments"
  - id: "EndNode1"
    type: "end"
    strict: true
    outputs:
      - key: "Pagelets"
        type: "java.util.Iterator"
        guaranteed: false
      - key: "Slot"
        type: "java.lang.Object"
        guaranteed: true
      - key: "Pagelet"
        type: "java.lang.Object"
        guaranteed: true
      - key: "PageletAssignments"
        type: "java.util.Iterator"
        guaranteed: false
      - key: "SearchTerm"
        type: "java.lang.Object"
        guaranteed: true
  - id: "ExecuteObjectsQuery1"
    type: "pipelet"
    ref: "ExecuteObjectsQuery"
    config:
      QueryName: "pagelet/GetTermSpecificContent"
      Datasource: "current ORM connection"
    bindings:
      SearchResult: "PageletAssignments"
      Parameters: "QueryParameters"
      ParameterValue_01: "SearchTermIterator"
  - id: "ExecuteObjectsQuery2"
    type: "pipelet"
    ref: "ExecuteObjectsQuery"
    config:
      QueryName: "pagelet/GetTermSpecificContent"
      Datasource: "current ORM connection"
    bindings:
      SearchResult: "PageletAssignments"
      Parameters: "QueryParameters"
      ParameterValue_01: "SearchTermIterator"
  - id: "GetCurrentDate1"
    type: "pipelet"
    ref: "GetCurrentDate"
  - id: "JoinNode1"
    type: "join"
  - id: "JoinNode2"
    type: "join"
  - id: "JoinNode4"
    type: "join"
  - id: "JoinNode5"
    type: "join"
  - id: "JoinNode6"
    type: "join"
  - id: "UpdateDictionary1"
    type: "pipelet"
    ref: "UpdateDictionary"
    config:
      Name_01: "Date"
      Name_02: "Locale"
      Name_03: "RepositoryDomain"
      Name_04: "VerifiedSearchTerm"
      Name_05: "ParentPageletUUID"
      Name_06: "StaticContext"
    bindings:
      OutDictionary: "QueryParameters"
      InDictionary: "null"
      Value_01: "CurrentDate"
      Value_02: "CurrentSession:Locale"
      Value_03: "Slot:Domain"
      Value_04: "VerifiedSearchTerm"
      Value_05: "Pagelet:UUID"
      Value_06: "StaticContext"
  - id: "UpdateDictionary2"
    type: "pipelet"
    ref: "UpdateDictionary"
    config:
      Name_04: "VerifiedSearchTerm"
    bindings:
      OutDictionary: "QueryParameters"
      InDictionary: "QueryParameters"
      Value_04: "null"
  - id: "VerifySearchTerm1"
    type: "pipelet"
    ref: "VerifySearchTerm"
    config:
      AllowFuzzySearch: false
      DefaultOperator: "OR"
    bindings:
      UserSearchTerm: "SearchTerm"
      SearchExpression: "VerifiedSearchTerm"
  - id: "VerifySearchTerm2"
    type: "pipelet"
    ref: "VerifySearchTerm"
    config:
      AllowFuzzySearch: false
    bindings:
      UserSearchTerm: "\"\""

links:
  - from: "StartNode1"
    via: "next"
    to: "GetCurrentDate1"
    into: "in"
  - from: "GetCurrentDate1"
    via: "next"
    to: "VerifySearchTerm1"
    into: "in"
  - from: "UpdateDictionary2"
    via: "next"
    to: "ExecuteObjectsQuery2"
    into: "in"
  - from: "VerifySearchTerm2"
    via: "next"
    to: "UpdateDictionary2"
    into: "in"
  - from: "ExecuteObjectsQuery1"
    via: "next"
    to: "DecisionNode2"
    into: "in"
  - from: "DecisionNode2"
    via: "yes"
    to: "JoinNode2"
    into: "in1"
  - from: "JoinNode1"
    via: "next"
    to: "JoinNode4"
    into: "in1"
  - from: "ExecuteObjectsQuery2"
    via: "next"
    to: "JoinNode5"
    into: "in2"
  - from: "ExecuteObjectsQuery2"
    via: "error"
    to: "JoinNode6"
    into: "in2"
  - from: "JoinNode5"
    via: "next"
    to: "JoinNode2"
    into: "in3"
  - from: "JoinNode4"
    via: "next"
    to: "JoinNode6"
    into: "in1"
  - from: "JoinNode6"
    via: "next"
    to: "JoinNode5"
    into: "in1"
  - from: "ExecuteObjectsQuery1"
    via: "error"
    to: "JoinNode1"
    into: "in1"
  - from: "VerifySearchTerm1"
    via: "error"
    to: "JoinNode1"
    into: "in2"
  - from: "VerifySearchTerm2"
    via: "error"
    to: "JoinNode4"
    into: "in2"
  - from: "VerifySearchTerm1"
    via: "next"
    to: "UpdateDictionary1"
    into: "in"
  - from: "UpdateDictionary1"
    via: "next"
    to: "ExecuteObjectsQuery1"
    into: "in"
  - from: "DecisionNode2"
    via: "no"
    to: "VerifySearchTerm2"
    into: "in"
  - from: "JoinNode2"
    via: "next"
    to: "EndNode1"
    into: "in"
