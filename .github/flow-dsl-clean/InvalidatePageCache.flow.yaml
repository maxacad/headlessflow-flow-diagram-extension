flow: "InvalidatePageCache"
kind: "job"

entries:
  - id: "StartNode2"
    name: "Start"
    mode: "private"
    strict: false
    inputs:
      []
  - id: "StartNode3"
    name: "GetSiteIterator"
    mode: "private"
    strict: true
    inputs:
      - key: "Sites"
        type: "java.lang.String"
        required: true

steps:
  - id: "Call1"
    type: "call"
    ref: "This:GetSiteIterator"
  - id: "DecisionNode1"
    type: "decision"
    condition: "Sites"
  - id: "EndNode2"
    type: "end"
    strict: false
  - id: "EndNode20"
    type: "end"
    strict: true
    outputs:
      - key: "SiteIterator"
        type: "java.util.Vector"
        guaranteed: false
  - id: "GetDomain2"
    type: "pipelet"
    ref: "GetDomain"
    bindings:
      StagingDomainName: "SiteName"
      StagingDomain: "SiteDomain"
  - id: "InvalidatePageCache2"
    type: "pipelet"
    ref: "InvalidatePageCache"
    bindings:
      Site: "SiteDomain"
  - id: "JoinNode1"
    type: "join"
  - id: "LoopNode7"
    type: "loop"
  - id: "Pipelet4"
    type: "pipelet"
    ref: "CreateStringSplitter"
    config:
      Mode: "First Occurrence"
      Separator: ","
  - id: "Pipelet5"
    type: "pipelet"
    ref: "KeyMapper"
    bindings:
      InValue_1: "Splitter:Begin(Sites)"
      OutValue_1: "Token"
  - id: "Pipelet6"
    type: "pipelet"
    ref: "KeyMapper"
    bindings:
      InValue_1: "Splitter:End(Sites)"
      OutValue_1: "Sites"
  - id: "Pipelet7"
    type: "pipelet"
    ref: "AddObjectToVector"
    config:
      Mode: "Forbid Duplicates"
    bindings:
      Object: "Token"
      Iterator: "SiteIterator"
      InVector: "SiteVector"
      Objects: "null"
      OutVector: "SiteVector"

links:
  - from: "LoopNode7"
    via: "do"
    to: "GetDomain2"
    into: "in"
  - from: "Pipelet6"
    via: "next"
    to: "Pipelet7"
    into: "in"
  - from: "DecisionNode1"
    via: "yes"
    to: "EndNode20"
    into: "in"
  - from: "Pipelet4"
    via: "next"
    to: "JoinNode1"
    into: "in1"
  - from: "JoinNode1"
    via: "next"
    to: "DecisionNode1"
    into: "in"
  - from: "StartNode2"
    via: "next"
    to: "Call1"
    into: "in"
  - from: "InvalidatePageCache2"
    via: "next"
    to: "LoopNode7"
    into: "loop"
  - from: "LoopNode7"
    via: "next"
    to: "EndNode2"
    into: "in"
  - from: "GetDomain2"
    via: "next"
    to: "InvalidatePageCache2"
    into: "in"
  - from: "Pipelet7"
    via: "next"
    to: "JoinNode1"
    into: "in3"
  - from: "Call1"
    via: "next"
    to: "LoopNode7"
    into: "in"
  - from: "StartNode3"
    via: "next"
    to: "Pipelet4"
    into: "in"
  - from: "DecisionNode1"
    via: "no"
    to: "Pipelet5"
    into: "in"
  - from: "Pipelet5"
    via: "next"
    to: "Pipelet6"
    into: "in"
