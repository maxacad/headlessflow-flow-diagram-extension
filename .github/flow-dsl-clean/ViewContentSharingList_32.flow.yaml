        guaranteed: true
      - key: "Organization"
        type: "com.intershop.component.organization.capi.Organization"
        guaranteed: true
  - id: "EndNode2"
    type: "end"
    strict: true
    outputs:
      - key: "ParterMasterRepositoriesByPartnerUUID"
        type: "java.util.Map"
        guaranteed: false
  - id: "ExecutePageableQuery1"
    type: "pipelet"
    ref: "ExecutePageableQuery"
    config:
