    ref: "This:GetMasterRepository"
    bindings:
      OrganizationUUID: "SelectedOrganizationUUID"
      MasterRepository: "SharedMasterRepository"
  - id: "CallNode4"
    type: "call"
    ref: "This:GetMasterRepository"
