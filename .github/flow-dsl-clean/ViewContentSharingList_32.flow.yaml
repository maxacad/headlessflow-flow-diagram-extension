      OutDictionary: "QueryParameter"
      Value_01: "SharedMasterRepository"
      Value_02: "CurrentChannel"
      Value_03: "\"(Boolean)false\""
      Value_04: "SortBy"
      Value_05: "SortDirection"
      Value_06: "CurrentSession:Locale"
  - id: "UpdateDictionary2"
