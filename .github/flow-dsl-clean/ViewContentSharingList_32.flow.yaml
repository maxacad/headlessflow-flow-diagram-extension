      Name_02: "SortBy"
      Name_03: "SortDirection"
      Name_04: "Locale"
    bindings:
      InDictionary: "null"
      OutDictionary: "QueryParameter"
      Value_01: "CurrentChannel:RepositoryDomain"
      Value_03: "SortDirection"
      Value_02: "SortBy"
      Value_04: "CurrentSession:Locale"

