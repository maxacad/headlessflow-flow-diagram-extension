      DefaultPageSize: 15
    bindings:
      Connection: "null"
      Parameters: "QueryParameter"
      Query: "null"
      ErrorCode: "SearchError"
      SearchResult: "PartnersWithSharedContent"
  - id: "ExecutePageableQuery2"
    type: "pipelet"
    ref: "ExecutePageableQuery"
    config:
      QueryName: "content/GetContentSharingOrganizationList"
      DefaultPageSize: 0
    bindings:
      Connection: "null"
      Parameters: "QueryParameter"
      Query: "null"
      ErrorCode: "SearchError"
      SearchResult: "ContentSourceOrganizations"
  - id: "GetOrganization3"
    type: "pipelet"
