flow: "ProcessPaymentInstrument"
kind: "process"

entries:
  - id: "Start1"
    name: "GetActivePaymentMethodsForUser"
    mode: "private"
    strict: true
    inputs:
      - key: "CurrentUserUserGroups"
        type: "java.util.Iterator"
        required: true
      - key: "OwningDomain"
        type: "com.intershop.beehive.core.capi.domain.Domain"
        required: true
      - key: "Currency"
        type: "com.intershop.beehive.core.capi.currency.Currency"
        required: true
      - key: "CurrentApplication"
        type: "com.intershop.beehive.core.capi.domain.Application"
        required: true
  - id: "Start2"
    name: "GetActivePaymentMethodsForOrganization"
    mode: "private"
    strict: true
    inputs:
      - key: "Currency"
        type: "com.intershop.beehive.core.capi.currency.Currency"
        required: true
      - key: "Organization"
        type: "com.intershop.component.organization.capi.Organization"
        required: true
      - key: "OwningDomain"
        type: "com.intershop.beehive.core.capi.domain.Domain"
        required: true
  - id: "StartNode1"
    name: "IsPaymentMethodAvailableForUser"
    mode: "private"
    strict: true
    inputs:
      - key: "CurrentUserUserGroups"
        type: "java.util.Iterator"
        required: true
      - key: "OwningDomain"
        type: "com.intershop.beehive.core.capi.domain.Domain"
        required: true
      - key: "Currency"
        type: "com.intershop.beehive.core.capi.currency.Currency"
        required: true
      - key: "PaymentService"
        type: "com.intershop.beehive.bts.capi.payment.PaymentService"
        required: true
      - key: "CurrentApplication"
        type: "com.intershop.beehive.core.capi.domain.Application"
        required: true
  - id: "StartNode10"
    name: "CreatePaymentInstrumentInfo"
    mode: "private"
    strict: true
    inputs:
      - key: "PIIDataMap"
        type: "java.util.Map<java.lang.String,java.lang.String>"
        required: false
      - key: "Domain"
        type: "com.intershop.beehive.core.capi.domain.Domain"
        required: true
      - key: "PaymentService"
        type: "com.intershop.beehive.bts.capi.payment.PaymentService"
        required: true
      - key: "CurrencyMnemonic"
        type: "java.lang.String"
        required: true
  - id: "StartNode11"
    name: "CreatePaymentInstrumentInfoByUser"
    mode: "private"
    strict: true
    inputs:
      - key: "CurrentUser"
        type: "com.intershop.beehive.core.capi.user.User"
        required: true
      - key: "PIIDataMap"
        type: "java.util.Map<java.lang.String,java.lang.String>"
        required: false
      - key: "CurrentDomain"
        type: "com.intershop.beehive.core.capi.domain.Domain"
        required: true
      - key: "PaymentService"
        type: "com.intershop.beehive.bts.capi.payment.PaymentService"
        required: true
  - id: "StartNode12"
    name: "GetPaymentInstrumentInfoByID"
    mode: "private"
    strict: true
    inputs:
      - key: "PaymentInstrumentInfoUUID"
        type: "java.lang.String"
        required: true
  - id: "StartNode13"
    name: "CopyPaymentInstrumentInfo"
    mode: "private"
    strict: true
    inputs:
      - key: "Source"
        type: "com.intershop.beehive.bts.capi.orderprocess.LineItemCtnr"
        required: true
      - key: "Target"
        type: "com.intershop.beehive.bts.capi.orderprocess.LineItemCtnr"
        required: true
  - id: "StartNode14"
    name: "RemovePaymentInstrumentInfo"
    mode: "private"
    strict: true
    inputs:
      - key: "PaymentInstrumentInfo"
        type: "com.intershop.beehive.bts.capi.payment.PaymentInstrumentInfo"
        required: true
  - id: "StartNode15"
    name: "VerifyPaymentInstrumentInfo"
    mode: "private"
    strict: true
    inputs:
      - key: "PaymentInstrumentInfo"
        type: "com.intershop.beehive.bts.capi.payment.PaymentInstrumentInfo"
        required: true
  - id: "StartNode16"
    name: "ValidateCheckoutData"
    mode: "private"
    strict: true
    inputs:
      - key: "PaymentInstrumentInfo"
        type: "com.intershop.beehive.bts.capi.payment.PaymentInstrumentInfo"
        required: true
      - key: "AllFormValues"
        type: "java.util.Map<java.lang.String,java.lang.String[]>"
        required: true
  - id: "StartNode17"
    name: "DetermineTenderBalance"
    mode: "private"
    strict: true
    inputs:
      - key: "PII"
        type: "com.intershop.beehive.bts.capi.payment.PaymentInstrumentInfo"
        required: false
  - id: "StartNode2"
    name: "IsPaymentMethodAvailableForOrganization"
    mode: "private"
    strict: true
    inputs:
      - key: "Currency"
        type: "com.intershop.beehive.core.capi.currency.Currency"
        required: true
      - key: "Organization"
        type: "com.intershop.component.organization.capi.Organization"
        required: true
      - key: "OwningDomain"
        type: "com.intershop.beehive.core.capi.domain.Domain"
        required: true
      - key: "PaymentService"
        type: "com.intershop.beehive.bts.capi.payment.PaymentService"
        required: true
  - id: "StartNode3"
    name: "CreatePaymentInstrumentInfoByRequisition"
    mode: "private"
    strict: true
    inputs:
      - key: "PIIDataMap"
        type: "java.util.Map<java.lang.String,java.lang.String>"
        required: false
      - key: "Requisition"
        type: "com.intershop.beehive.bts.capi.orderprocess.basket.Basket"
        required: true
      - key: "CurrentDomain"
        type: "com.intershop.beehive.core.capi.domain.Domain"
        required: true
      - key: "PaymentService"
        type: "com.intershop.beehive.bts.capi.payment.PaymentService"
        required: true
  - id: "StartNode4"
    name: "GetDefaultPaymentInstrumentInfoByDomain"
    mode: "private"
    strict: true
    inputs:
      - key: "Domain"
        type: "com.intershop.beehive.core.capi.domain.Domain"
        required: true
  - id: "StartNode5"
    name: "GetPaymentInstrumentInfosByRequisition"
    mode: "private"
    strict: true
    inputs:
      - key: "Requisition"
        type: "com.intershop.beehive.bts.capi.orderprocess.basket.Basket"
        required: true
  - id: "StartNode6"
    name: "GetPaymentInstrumentInfosByOrganization"
    mode: "private"
    strict: true
    inputs:
      - key: "Organization"
        type: "com.intershop.component.organization.capi.Organization"
        required: true
  - id: "StartNode7"
    name: "CreatePaymentInstrumentInfoByOrganization"
    mode: "private"
    strict: true
    inputs:
      - key: "PIIDataMap"
        type: "java.util.Map"
        required: false
      - key: "CurrentOrganization"
        type: "com.intershop.component.organization.capi.Organization"
        required: true
      - key: "PaymentService"
        type: "com.intershop.beehive.bts.capi.payment.PaymentService"
        required: true
  - id: "StartNode8"
    name: "GetPaymentInstrumentInfosByUser"
    mode: "private"
    strict: true
    inputs:
      - key: "CurrentUser"
        type: "com.intershop.beehive.core.capi.user.User"
        required: true
  - id: "StartNode9"
    name: "GetDefaultPaymentInstrumentInfoByUser"
    mode: "private"
    strict: true
    inputs:
      - key: "User"
        type: "com.intershop.beehive.core.capi.user.User"
        required: true

steps:
  - id: "AddEntryToMap1"
    type: "pipelet"
    ref: "AddEntryToMap"
    bindings:
      InMap: "ActivePIIMap"
      Key: "PII:PaymentService:ID"
      Value: "OutVector"
      OutMap: "ActivePIIMap"
  - id: "AddEntryToMap2"
    type: "pipelet"
    ref: "AddEntryToMap"
    bindings:
      InMap: "WalletPIIMap"
      Key: "PII:PaymentService"
      Value: "PII"
      OutMap: "WalletPIIMap"
  - id: "AddEntryToMap3"
    type: "pipelet"
    ref: "AddEntryToMap"
    bindings:
      InMap: "ActivePIIMap"
      Key: "ActivePII:PaymentService"
      Value: "PaymentInstrumentInfos"
      OutMap: "ActivePIIMap"
  - id: "AddObjectToVector1"
    type: "pipelet"
    ref: "AddObjectToVector"
    bindings:
      InVector: "ActivePIIMap:get(PII:PaymentService:ID)"
      Object: "PII"
  - id: "AddObjectToVector4"
    type: "pipelet"
    ref: "AddObjectToVector"
    config:
      Mode: "Allow Duplicates"
    bindings:
      InVector: "null"
      Objects: "null"
      Object: "ActivePII"
      OutVector: "null"
      Iterator: "PaymentInstrumentInfos"
  - id: "AddObjectToVector5"
    type: "pipelet"
    ref: "AddObjectToVector"
    config:
      Mode: "Allow Duplicates"
    bindings:
      InVector: "null"
      Objects: "PaymentInstrumentInfos"
      Object: "ActivePII"
      OutVector: "null"
      Iterator: "PaymentInstrumentInfos"
  - id: "AddObjectToVector6"
    type: "pipelet"
    ref: "AddObjectToVector"
    config:
      Mode: "Allow Duplicates"
    bindings:
      Object: "UserGroup"
      Iterator: "UserGroups"
  - id: "AddObjectToVector7"
    type: "pipelet"
    ref: "AddObjectToVector"
    config:
      Mode: "Allow Duplicates"
    bindings:
      Objects: "ParentUserGroups"
      InVector: "OutVector"
      Iterator: "UserGroups"
  - id: "CallNode1"
    type: "call"
    ref: "ProcessPaymentInstrument-CreatePaymentInstrumentInfo"
    bindings:
      Domain: "CurrentDomain"
  - id: "CallNode3"
    type: "call"
    ref: "ProcessPaymentInstrument-CreatePaymentInstrumentInfo"
    bindings:
      Domain: "CurrentDomain"
      CurrencyMnemonic: "Requisition:PurchaseCurrencyCode"
  - id: "CallNode4"
    type: "call"
    ref: "ProcessPaymentInstrument-GetActivePaymentMethodsForUser"
  - id: "CallNode5"
    type: "call"
    ref: "ProcessPaymentInstrument-CreatePaymentInstrumentInfo"
    bindings:
      Domain: "CurrentOrganization:OrganizationDomain"
  - id: "CallNode6"
    type: "call"
    ref: "ProcessPaymentInstrument-GetActivePaymentMethodsForOrganization"
  - id: "ClonePaymentInstrumentInfo1"
    type: "pipelet"
    ref: "ClonePaymentInstrumentInfo"
    bindings:
      OriginalPaymentInstrumentInfo: "PII"
      Domain: "Target:Domain"
      ClonedPaymentInstrumentInfo: "NewPII"
  - id: "ConcatenateStrings1"
    type: "pipelet"
    ref: "ConcatenateStrings"
    config:
      DefaultString0: "PII_UPDATE_FAILURE"
    bindings:
      Concatenated: "PIIDataVerificationResult:Error"
  - id: "DecisionNode1"
    type: "decision"
    condition: "PaymentService:Configuration:UUID"
  - id: "DecisionNode2"
    type: "decision"
    condition: "PaymentService:Configuration:UUID"
  - id: "DecisionNode4"
    type: "decision"
    condition: "ActivePIIMap:get(ActivePII:PaymentService)"
  - id: "DecisionNode7"
    type: "decision"
    condition: "ActivePII:PaymentService"
  - id: "DetermineTenderBalance1"
    type: "pipelet"
    ref: "DetermineTenderBalance"
  - id: "DetermineUserGroup1"
    type: "pipelet"
    ref: "DetermineUserGroup"
    config:
      Config_UserGroupID: "Everyone"
    bindings:
      UserGroupID: "null"
      CurrentDomain: "Organization:OrganizationDomain"
  - id: "EndNode1"
    type: "end"
    strict: true
  - id: "EndNode10"
    type: "end"
    strict: true
    outputs:
      - key: "PaymentInstrumentInfo"
        type: "com.intershop.beehive.bts.capi.payment.PaymentInstrumentInfo"
        guaranteed: true
  - id: "EndNode11"
    type: "end"
    strict: true
    outputs:
      - key: "ActivePIIMap"
        type: "java.util.Map"
        guaranteed: false
  - id: "EndNode12"
    type: "end"
    strict: true
    outputs:
      - key: "PIIDataVerificationResult"
        type: "com.intershop.beehive.bts.capi.payment.PIIDataVerificationResult"
        guaranteed: false
  - id: "EndNode13"
    type: "end"
    strict: true
    outputs:
      - key: "PaymentInstrumentInfo"
        type: "com.intershop.beehive.bts.capi.payment.PaymentInstrumentInfo"
        guaranteed: true
  - id: "EndNode14"
    type: "end"
    strict: true
    outputs:
      - key: "WalletPIIs"
        type: "java.util.Iterator"
        guaranteed: false
      - key: "WalletPIIMap"
        type: "java.util.Map"
        guaranteed: false
  - id: "EndNode15"
    type: "end"
    strict: true
    outputs:
      - key: "DefaultPaymentInstrumentInfo"
        type: "com.intershop.beehive.bts.capi.payment.PaymentInstrumentInfo"
        guaranteed: true
  - id: "EndNode16"
    type: "end"
    strict: true
  - id: "EndNode17"
    type: "end"
    strict: true
    outputs:
      - key: "ActivePaymentServices"
        type: "java.util.List<com.intershop.beehive.bts.capi.payment.PaymentService>"
        guaranteed: true
      - key: "ActivePaymentConfigurations"
        type: "java.util.List<com.intershop.beehive.bts.capi.payment.PaymentConfiguration>"
        guaranteed: true
  - id: "EndNode18"
    type: "end"
    strict: true
    outputs:
      - key: "PaymentInstrumentInfo"
        type: "com.intershop.beehive.bts.capi.payment.PaymentInstrumentInfo"
        guaranteed: true
  - id: "EndNode19"
    type: "end"
    strict: true
    outputs:
      - key: "PIIDataVerificationResult"
        type: "com.intershop.beehive.bts.capi.payment.PIIDataVerificationResult"
        guaranteed: false
  - id: "EndNode2"
    type: "end"
    strict: true
  - id: "EndNode20"
    type: "end"
    strict: true
    outputs:
      - key: "PaymentInstrumentInfo"
        type: "com.intershop.beehive.bts.capi.payment.PaymentInstrumentInfo"
        guaranteed: true
  - id: "EndNode21"
    type: "end"
    strict: true
    outputs:
      - key: "PIIDataVerificationResult"
        type: "com.intershop.beehive.bts.capi.payment.PIIDataVerificationResult"
        guaranteed: false
  - id: "EndNode22"
    type: "end"
    strict: true
    outputs:
      - key: "PaymentInstrumentInfo"
        type: "com.intershop.beehive.bts.capi.payment.PaymentInstrumentInfo"
        guaranteed: true
  - id: "EndNode23"
    type: "end"
    strict: true
  - id: "EndNode24"
    type: "end"
    strict: true
  - id: "EndNode25"
    type: "end"
    strict: true
  - id: "EndNode26"
    type: "end"
    strict: true
  - id: "EndNode27"
    type: "end"
    strict: true
  - id: "EndNode28"
    type: "end"
    strict: true
    outputs:
      - key: "PIIDataVerificationResult"
        type: "com.intershop.beehive.bts.capi.payment.PIIDataVerificationResult"
        guaranteed: true
  - id: "EndNode29"
    type: "end"
    strict: true
  - id: "EndNode3"
    type: "end"
    strict: true
    outputs:
      - key: "ActivePaymentServices"
        type: "java.util.List<com.intershop.beehive.bts.capi.payment.PaymentService>"
        guaranteed: true
      - key: "ActivePaymentConfigurations"
        type: "java.util.List<com.intershop.beehive.bts.capi.payment.PaymentConfiguration>"
        guaranteed: true
  - id: "EndNode30"
    type: "end"
    strict: true
    outputs:
      - key: "PaymentTenderBalanceResult"
        type: "com.intershop.beehive.bts.capi.payment.TenderBalanceResult"
        guaranteed: true
  - id: "EndNode4"
    type: "end"
    strict: true
  - id: "EndNode5"
    type: "end"
    strict: true
  - id: "EndNode6"
    type: "end"
    strict: true
    outputs:
      - key: "PaymentInstrumentInfo"
        type: "com.intershop.beehive.bts.capi.payment.PaymentInstrumentInfo"
        guaranteed: true
  - id: "EndNode7"
    type: "end"
    strict: true
    outputs:
      - key: "PIIDataVerificationResult"
        type: "com.intershop.beehive.bts.capi.payment.PIIDataVerificationResult"
        guaranteed: false
  - id: "EndNode8"
    type: "end"
    strict: true
  - id: "EndNode9"
    type: "end"
    strict: true
    outputs:
      - key: "ActivePIIMap"
        type: "java.util.Map"
        guaranteed: false
  - id: "EndSafeChangesBlock0"
    type: "pipelet"
    ref: "EndSafeChangesBlock"
  - id: "GetActivePaymentConfigurations1"
    type: "pipelet"
    ref: "GetActivePaymentConfigurations"
    bindings:
      Currency: "Currency"
      Domain: "OwningDomain"
      UserGroups: "CurrentUserUserGroups"
      Application: "CurrentApplication"
      PaymentServices: "ActivePaymentServices"
      PaymentConfigurations: "ActivePaymentConfigurations"
  - id: "GetActivePaymentConfigurations2"
    type: "pipelet"
    ref: "GetActivePaymentConfigurations"
    bindings:
      Currency: "Currency"
      Domain: "OwningDomain"
      UserGroups: "UserGroups"
      PaymentServices: "ActivePaymentServices"
      PaymentConfigurations: "ActivePaymentConfigurations"
  - id: "GetDefaultPaymentInstrumentInfoByUser2"
    type: "pipelet"
    ref: "GetDefaultPaymentInstrumentInfoByUser"
    bindings:
      PaymentInstrumentInfo: "DefaultPaymentInstrumentInfo"
  - id: "GetDefaultPaymentInstrumentInfoForDomain1"
    type: "pipelet"
    ref: "GetDefaultPaymentInstrumentInfoForDomain"
  - id: "GetFormRecord3"
    type: "pipelet"
    ref: "GetFormRecord"
    bindings:
      RecordID: "PaymentInstrumentInfo:PaymentService:ID"
      FormRecord: "PIIDataMap"
  - id: "GetParentUserGroups1"
    type: "pipelet"
    ref: "GetParentUserGroups"
    config:
      Membership: "All"
    bindings:
      UserGroups: "ParentUserGroups"
  - id: "GetPaymentInstrumentInfoByUUID1"
    type: "pipelet"
    ref: "GetPaymentInstrumentInfoByUUID"
  - id: "GetPaymentInstrumentInfosByDomain1"
    type: "pipelet"
    ref: "GetPaymentInstrumentInfosByDomain"
    bindings:
      Domain: "Organization:OrganizationDomain"
      PaymentInstrumentInfos: "ActivePIIs"
  - id: "GetPaymentInstrumentInfosByUser1"
    type: "pipelet"
    ref: "GetPaymentInstrumentInfosByUser"
    bindings:
      User: "CurrentUser"
      PaymentService: "null"
      PaymentInstrumentInfos: "WalletPIIs"
  - id: "JoinNode1"
    type: "join"
  - id: "JoinNode12"
    type: "join"
  - id: "JoinNode4"
    type: "join"
  - id: "KeyMapper1"
    type: "pipelet"
    ref: "KeyMapper"
    bindings:
      InValue_1: "ActivePIIMap:get(ActivePII:PaymentService)"
      OutValue_1: "PaymentInstrumentInfos"
  - id: "KeyMapper2"
    type: "pipelet"
    ref: "KeyMapper"
    bindings:
      InValue_1: "CurrentRequest:Currency:Mnemonic"
      OutValue_1: "CurrencyMnemonic"
  - id: "KeyMapper7"
    type: "pipelet"
    ref: "KeyMapper"
    bindings:
      InValue_1: "PaymentInstrumentInfo:PaymentService"
      OutValue_1: "PaymentService"
  - id: "LoopNode1"
    type: "loop"
  - id: "LoopNode2"
    type: "loop"
  - id: "LoopNode3"
    type: "loop"
  - id: "LoopNode4"
    type: "loop"
  - id: "LoopNode5"
    type: "loop"
  - id: "LoopNode6"
    type: "loop"
  - id: "Pipelet52"
    type: "pipelet"
    ref: "RemovePaymentInstrumentInfo"
  - id: "Pipelet54"
    type: "pipelet"
    ref: "CreatePaymentInstrumentInfo"
    bindings:
      Domain: "Domain"
      PaymentService: "PaymentService"
  - id: "RemovePaymentInstrumentInfo1"
    type: "pipelet"
    ref: "RemovePaymentInstrumentInfo"
  - id: "SetPaymentInstrumentInfoOwner1"
    type: "pipelet"
    ref: "SetPaymentInstrumentInfoOwner"
    bindings:
      Basket: "null"
      Domain: "CurrentOrganization:OrganizationDomain"
      User: "null"
  - id: "SetPaymentInstrumentInfoOwner2"
    type: "pipelet"
    ref: "SetPaymentInstrumentInfoOwner"
    bindings:
      Basket: "null"
      Domain: "null"
      User: "CurrentUser"
  - id: "SetPaymentInstrumentInfoOwner3"
    type: "pipelet"
    ref: "SetPaymentInstrumentInfoOwner"
    bindings:
      Basket: "Requisition"
      Domain: "null"
      User: "null"
  - id: "SetPaymentInstrumentInfoOwner5"
    type: "pipelet"
    ref: "SetPaymentInstrumentInfoOwner"
    bindings:
      Basket: "Target"
      Domain: "null"
      PaymentInstrumentInfo: "NewPII"
      User: "null"
  - id: "StartSafeChangesBlock0"
    type: "pipelet"
    ref: "StartSafeChangesBlock"
  - id: "UpdatePaymentInstrumentInfo1"
    type: "pipelet"
    ref: "UpdatePaymentInstrumentInfo"
    bindings:
      PIIData: "PIIDataMap"
  - id: "VerifyPaymentCheckoutData1"
    type: "pipelet"
    ref: "VerifyPaymentCheckoutData"
    bindings:
      PIIData: "PIIDataMap"
      VerificationResult: "PIIDataVerificationResult"
  - id: "VerifyPaymentInstrumentData1"
    type: "pipelet"
    ref: "VerifyPaymentInstrumentData"
    bindings:
      PIIData: "PIIDataMap"
      VerificationResult: "PIIDataVerificationResult"
  - id: "VerifyPaymentInstrumentInfo1"
    type: "pipelet"
    ref: "VerifyPaymentInstrumentInfo"

links:
  - from: "AddEntryToMap1"
    via: "next"
    to: "LoopNode1"
    into: "loop"
  - from: "AddEntryToMap2"
    via: "next"
    to: "LoopNode6"
    into: "loop"
  - from: "AddEntryToMap3"
    via: "next"
    to: "JoinNode4"
    into: "in1"
  - from: "AddObjectToVector1"
    via: "next"
    to: "AddEntryToMap1"
    into: "in"
  - from: "AddObjectToVector4"
    via: "next"
    to: "JoinNode1"
    into: "in1"
  - from: "AddObjectToVector5"
    via: "next"
    to: "JoinNode1"
    into: "in1"
  - from: "AddObjectToVector6"
    via: "next"
    to: "GetParentUserGroups1"
    into: "in"
  - from: "AddObjectToVector7"
    via: "next"
    to: "GetActivePaymentConfigurations2"
    into: "in"
  - from: "CallNode1"
    via: "ERROR"
    to: "EndNode21"
    into: "in"
  - from: "CallNode1"
    via: "next"
    to: "SetPaymentInstrumentInfoOwner2"
    into: "in"
  - from: "CallNode3"
    via: "ERROR"
    to: "EndNode7"
    into: "in"
  - from: "CallNode3"
    via: "next"
    to: "SetPaymentInstrumentInfoOwner3"
    into: "in"
  - from: "CallNode4"
    via: "next"
    to: "LoopNode2"
    into: "in"
  - from: "CallNode5"
    via: "ERROR"
    to: "EndNode12"
    into: "in"
  - from: "CallNode5"
    via: "next"
    to: "SetPaymentInstrumentInfoOwner1"
    into: "in"
  - from: "CallNode6"
    via: "next"
    to: "LoopNode3"
