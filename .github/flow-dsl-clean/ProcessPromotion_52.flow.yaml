flow: "ProcessPromotion_52"
kind: "process"

entries:
  - id: "StartNode1"
    name: "AddInitialTargetGroup"
    mode: "private"
    strict: true
    inputs:
      - key: "Promotion"
        type: "com.intershop.component.marketing.capi.rebate.Promotion"
        required: true
      - key: "CurrentChannel"
        type: "java.lang.Object"
        required: true
  - id: "StartNode2"
    name: "GetCouponsAllowed"
    mode: "private"
    strict: true
    inputs:
      - key: "Promotion"
        type: "com.intershop.component.marketing.capi.rebate.Promotion"
        required: false
      - key: "CurrentChannel"
        type: "java.lang.Object"
        required: false

steps:
  - id: "AddUserGroupToPromotionTargetGroup1"
    type: "pipelet"
    ref: "AddUserGroupToPromotionTargetGroup"
  - id: "CallNode1"
    type: "call"
    ref: "ViewPromotionList-Search"
  - id: "CallNode8"
    type: "call"
    ref: "ProcessOrganization_52-GetConsumerOrg"
  - id: "DecisionNode1"
    type: "decision"
    condition: "Promotion:UUID"
  - id: "EndNode1"
    type: "end"
    strict: true
  - id: "EndNode2"
    type: "end"
    strict: true
    outputs:
      - key: "CouponsAllowed"
        type: "java.lang.String"
        guaranteed: false
  - id: "GetUserGroupByID1"
    type: "pipelet"
    ref: "GetUserGroupByID"
    config:
      DefaultUserGroupID: "Everyone"
    bindings:
      Domain: "Organization:OrganizationDomain:Domain"
  - id: "JoinNode1"
    type: "join"
  - id: "JoinNode2"
    type: "join"
  - id: "LoopNode1"
    type: "loop"
  - id: "SetDictionaryValue1"
    type: "pipelet"
    ref: "SetDictionaryValue"
    config:
      Name: "CouponsAllowed"
      Value: true
  - id: "UpdatePageSize1"
    type: "pipelet"
    ref: "UpdatePageSize"
    config:
      DefaultPageSize: -1
    bindings:
      PageableIterator: "Promotions"
      PageSize: "Promotions:ElementCount"

links:
  - from: "SetDictionaryValue1"
    via: "next"
    to: "JoinNode1"
    into: "in1"
  - from: "JoinNode1"
    via: "next"
    to: "EndNode2"
    into: "in"
  - from: "StartNode2"
    via: "next"
    to: "CallNode1"
    into: "in"
  - from: "UpdatePageSize1"
    via: "next"
    to: "LoopNode1"
    into: "in"
  - from: "JoinNode2"
    via: "next"
    to: "EndNode1"
    into: "in"
  - from: "StartNode1"
    via: "next"
    to: "CallNode8"
    into: "in"
  - from: "CallNode8"
    via: "next"
    to: "GetUserGroupByID1"
    into: "in"
  - from: "AddUserGroupToPromotionTargetGroup1"
    via: "next"
    to: "JoinNode2"
    into: "in1"
  - from: "GetUserGroupByID1"
    via: "error"
    to: "JoinNode2"
    into: "in2"
  - from: "GetUserGroupByID1"
    via: "next"
    to: "AddUserGroupToPromotionTargetGroup1"
    into: "in"
  - from: "CallNode1"
    via: "next"
    to: "UpdatePageSize1"
    into: "in"
  - from: "LoopNode1"
    via: "next"
    to: "JoinNode1"
    into: "in2"
  - from: "LoopNode1"
    via: "do"
    to: "DecisionNode1"
    into: "in"
  - from: "DecisionNode1"
    via: "yes"
    to: "SetDictionaryValue1"
    into: "in"
  - from: "DecisionNode1"
    via: "no"
    to: "LoopNode1"
    into: "loop"
