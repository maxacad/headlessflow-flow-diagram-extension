flow: "ViewAuctionBidHistory_52"
kind: "view"

entries:
  - id: "Start1"
    name: "View"
    mode: "private"
    strict: false
    inputs:
      []
  - id: "Start2"
    name: "Prefix"
    mode: "private"
    strict: false
    inputs:
      []
  - id: "Start3"
    name: "Paging"
    mode: "private"
    strict: false
    inputs:
      []
  - id: "Start4"
    name: "CancelBid"
    mode: "private"
    strict: false
    inputs:
      []
  - id: "Start5"
    name: "CheckCancellationPolicy"
    mode: "private"
    strict: false
    inputs:
      []

steps:
  - id: "Call1"
    type: "call"
    ref: "ViewAuctionBidHistory_52-CheckCancellationPolicy"
  - id: "Call2"
    type: "call"
    ref: "ViewAuctionBidHistory_52-Prefix"
  - id: "Call3"
    type: "call"
    ref: "ViewAuctionBidHistory_52-Prefix"
  - id: "CombineIterators1"
    type: "pipelet"
    ref: "CombineIterators"
    config:
      ProcessMethod: "Concatenate Iterators"
    bindings:
      Iterator: "AuctionBids"
      Iterator1: "WinningBids"
      Iterator2: "PlacedBids"
  - id: "CreatePageableFromIterator1"
    type: "pipelet"
    ref: "CreatePageableFromIterator"
    config:
      Pagesize: 20
    bindings:
      Iterator: "AuctionBids"
      Pageable: "PageableAuctionBids"
  - id: "Decision1"
    type: "decision"
    condition: "BidCancelPolicy"
  - id: "Decision2"
    type: "decision"
    condition: "BidCancelPolicy"
  - id: "DeterminePageable1"
    type: "pipelet"
    ref: "DeterminePageable"
  - id: "End1"
    type: "end"
  - id: "End2"
    type: "end"
  - id: "GetAuction1"
    type: "pipelet"
    ref: "GetAuction"
  - id: "GetAuctionBid1"
    type: "pipelet"
    ref: "GetAuctionBid"
    bindings:
      AuctionBidUUID: "CancelBidUUID"
  - id: "GetAuctionBids1"
    type: "pipelet"
    ref: "GetAuctionBids"
    config:
      DefaultBidState: 4
    bindings:
      AuctionBids: "PlacedBids"
  - id: "GetAuctionBids2"
    type: "pipelet"
    ref: "GetAuctionBids"
    config:
      DefaultBidState: 32
    bindings:
      AuctionBids: "WinningBids"
  - id: "GetDomainPreference1"
    type: "pipelet"
    ref: "GetDomainPreference"
    config:
      DefaultPreferenceKey: "BidCancelPolicy"
      Type: "Integer"
    bindings:
      PreferenceDomain: "ChannelRepository:Domain"
      PreferenceIntValue: "BidCancelPolicy"
  - id: "InteractionEnd4"
    type: "interaction"
  - id: "Join1"
    type: "join"
  - id: "Join2"
    type: "join"
  - id: "Join3"
    type: "join"
  - id: "Join4"
    type: "join"
  - id: "Join5"
    type: "join"
  - id: "Jump1"
    type: "jump"
    ref: "ViewAuctionBidHistory_52-Paging"
  - id: "PrepareApplicationView2"
    type: "pipelet"
    ref: "PrepareApplicationView"
    config:
      SelectedMenuItem: "AuctionManagement"
      WorkingTemplate: "auction/AuctionBidHistory_52"
  - id: "RemoveAuctionBid1"
    type: "pipelet"
    ref: "RemoveAuctionBid"
  - id: "SetDictionaryValue1"
    type: "pipelet"
    ref: "SetDictionaryValue"
    config:
      Name: "CancellationPermitted"
      Value: true
  - id: "SwitchPage1"
    type: "pipelet"
    ref: "SwitchPage"

links:
  - from: "Start1"
    via: "next"
    to: "Call2"
    into: "in"
  - from: "PrepareApplicationView2"
    via: "next"
    to: "InteractionEnd4"
    into: "in"
  - from: "DeterminePageable1"
    via: "error"
    to: "Join2"
    into: "in3"
  - from: "Join1"
    via: "next"
    to: "SwitchPage1"
    into: "in"
  - from: "CreatePageableFromIterator1"
    via: "next"
    to: "Join1"
    into: "in1"
  - from: "DeterminePageable1"
    via: "next"
    to: "Join1"
    into: "in3"
  - from: "Start3"
    via: "next"
    to: "Call3"
    into: "in"
  - from: "Call2"
    via: "next"
    to: "Join2"
    into: "in1"
  - from: "Call3"
    via: "next"
    to: "DeterminePageable1"
    into: "in"
  - from: "Join2"
    via: "next"
    to: "GetAuctionBids1"
    into: "in"
  - from: "GetAuctionBids1"
    via: "next"
    to: "GetAuctionBids2"
    into: "in"
  - from: "SwitchPage1"
    via: "next"
    to: "Call1"
    into: "in"
  - from: "GetAuction1"
    via: "next"
    to: "End1"
    into: "in"
  - from: "Start2"
    via: "next"
    to: "GetAuction1"
    into: "in"
  - from: "GetAuctionBids2"
    via: "next"
    to: "CombineIterators1"
    into: "in"
  - from: "CombineIterators1"
    via: "next"
    to: "CreatePageableFromIterator1"
    into: "in"
  - from: "Start4"
    via: "next"
    to: "GetAuctionBid1"
    into: "in"
  - from: "GetAuctionBid1"
    via: "next"
    to: "RemoveAuctionBid1"
    into: "in"
  - from: "RemoveAuctionBid1"
    via: "next"
    to: "Jump1"
    into: "in"
  - from: "Call1"
    via: "next"
    to: "PrepareApplicationView2"
    into: "in"
  - from: "Start5"
    via: "next"
    to: "GetDomainPreference1"
    into: "in"
  - from: "GetDomainPreference1"
    via: "next"
    to: "Decision1"
    into: "in"
  - from: "Decision1"
    via: "yes"
    to: "Join3"
    into: "in1"
  - from: "Decision1"
    via: "no"
    to: "Decision2"
    into: "in"
  - from: "Join3"
    via: "next"
    to: "SetDictionaryValue1"
    into: "in"
  - from: "Decision2"
    via: "yes"
    to: "Join3"
    into: "in3"
  - from: "SetDictionaryValue1"
    via: "next"
    to: "Join4"
    into: "in1"
  - from: "Join4"
    via: "next"
    to: "End2"
    into: "in"
  - from: "GetDomainPreference1"
    via: "error"
    to: "Join5"
    into: "in1"
  - from: "Join5"
    via: "next"
    to: "Join4"
    into: "in3"
  - from: "Decision2"
    via: "no"
    to: "Join5"
    into: "in2"
