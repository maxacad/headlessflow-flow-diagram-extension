flow: "TriggerInitialStagingProcess"
kind: "process"

entries:
  - id: "Start1"
    name: "TriggerLive"
    mode: "private"
    strict: false
    inputs:
      []
  - id: "Start5"
    name: "Start"
    mode: "private"
    strict: false
    inputs:
      []
  - id: "StartNode1"
    name: "Error"
    mode: "private"
    strict: false
    inputs:
      []

steps:
  - id: "Call6"
    type: "call"
    ref: "StagingCleanUp-Start"
  - id: "CallNode1"
    type: "call"
    ref: "InitializeStagingContext-Start"
  - id: "DecisionNode2"
    type: "decision"
    condition: "SuppressInitialReplication"
  - id: "End2"
    type: "end"
    strict: false
  - id: "End4"
    type: "end"
    strict: false
  - id: "EndNode4"
    type: "end"
    strict: false
  - id: "ExecutePipeline1"
    type: "pipelet"
    ref: "ExecutePipeline"
    config:
      Asynchronous: true
      PipelineDomainName: "CurrentDomain"
      PipelineName: "TriggerInitialStagingProcess"
      PipelineStartNode: "TriggerLive"
  - id: "GetProperties1"
    type: "pipelet"
    ref: "GetProperties"
    config:
      DefaultValue1: false
      DictionaryKey1: "SuppressInitialReplication"
      PropertyName1: "staging.suppressInitialReplication"
  - id: "GrantStagingDatabasePrivsToTargetCluster2"
    type: "pipelet"
    ref: "GrantStagingDatabasePrivsToTargetCluster"
  - id: "InitializeStagingProcessors2"
    type: "pipelet"
    ref: "InitializeStagingProcessors"
  - id: "JoinNode1"
    type: "join"
  - id: "JoinNode10"
    type: "join"
  - id: "JoinNode12"
    type: "join"
  - id: "JoinNode17"
    type: "join"
  - id: "JoinNode18"
    type: "join"
  - id: "JoinNode3"
    type: "join"
  - id: "JoinNode4"
    type: "join"
  - id: "JoinNode9"
    type: "join"
  - id: "JumpNode1"
    type: "jump"
    ref: "TriggerStagingProcess-Error"
  - id: "JumpNode4"
    type: "jump"
    ref: "TriggerStagingProcess-HandleError"
  - id: "LoopNode2"
    type: "loop"
  - id: "LoopNode3"
    type: "loop"
  - id: "LoopNode4"
    type: "loop"
  - id: "Pipelet1"
    type: "pipelet"
    ref: "SetStagingState"
    config:
      StagingState: "ErrorCallingLivePipeline"
  - id: "Pipelet16"
    type: "pipelet"
    ref: "SetStagingState"
    config:
      StagingState: "ErrorCreatingLiveStagingProcess"
  - id: "Pipelet2"
    type: "pipelet"
    ref: "SetStagingState"
  - id: "Pipelet25"
    type: "pipelet"
    ref: "CopyStagingProcessToTargetSystem"
  - id: "Pipelet27"
    type: "pipelet"
    ref: "SetStagingState"
    config:
      StagingState: "ErrorInitializingStagingProcessors"
  - id: "Pipelet32"
    type: "pipelet"
    ref: "SetStagingState"
    config:
      StagingState: "ErrorUpdatingDeletionTrackingInLiveSystem"
  - id: "Pipelet34"
    type: "pipelet"
    ref: "ExecuteStoredProcedure"
    config:
      AllowNullParameter: false
      StoredProcedure: "sp_update_deletion_tracking"
      Parameters: "'DeltaDomainSpecificStagingProcessor'"
  - id: "Pipelet36"
    type: "pipelet"
    ref: "WaitForStagingProcessState"
    config:
      WaitForStagingState: "InitialReplicationSuccessfullyFinished"
      PollInterval: 10
      Timeout: 3600
      StagingDomainName: "system"
      StagingGroupName: "Domains"
      TimeoutPropertyKey: "staging.timeout.initialReplication"
  - id: "Pipelet37"
    type: "pipelet"
    ref: "CallPipelineInLiveSystem"
    config:
      PipelineName: "ReplaceDBContent"
      StartNode: "Start"
  - id: "Pipelet38"
    type: "pipelet"
    ref: "SetStagingState"
    config:
      StagingState: "ErrorEntireDBReplicationTimeoutReached"
  - id: "Pipelet5"
    type: "pipelet"
    ref: "SetStagingState"
    config:
      StagingState: "StagingInitialized"
  - id: "Pipelet8"
    type: "pipelet"
    ref: "SetStagingState"
    config:
      StagingState: "ErrorExecutingEditingStagingPipeline"
  - id: "PrepareStagingTables1"
    type: "pipelet"
    ref: "PrepareStagingTables"
  - id: "ProcessPreparation4"
    type: "pipelet"
    ref: "ProcessPreparation"
  - id: "TriggerStagingProcess1"
    type: "pipelet"
    ref: "TriggerStagingProcess"
  - id: "WaitForStagingProcessState1"
    type: "pipelet"
    ref: "WaitForStagingProcessState"
    config:
      PollInterval: 10
      Timeout: 3600
      WaitForStagingState: "StagingInitialized"
      TimeoutPropertyKey: "staging.timeout.waitingForState"

links:
  - from: "CallNode1"
    via: "error"
    to: "JoinNode4"
    into: "in1"
  - from: "Pipelet1"
    via: "next"
    to: "JoinNode3"
    into: "in2"
