flow: "ProcessLinkExport"
kind: "process"

entries:
  - id: "Start1"
    name: "RunExport"
    mode: "private"
    strict: false
    inputs:
      []
  - id: "Start2"
    name: "Prepare"
    mode: "private"
    strict: false
    inputs:
      []
  - id: "Start3"
    name: "Export"
    mode: "private"
    strict: false
    inputs:
      []
  - id: "Start4"
    name: "Error"
    mode: "private"
    strict: false
    inputs:
      []
  - id: "Start5"
    name: "Cleanup"
    mode: "private"
    strict: false
    inputs:
      []
  - id: "StartNode2"
    name: "GetObjects"
    mode: "private"
    strict: false
    inputs:
      - key: "PageableID"
        type: "java.lang.String"
        required: false
      - key: "DeterminePageablePipeline"
        type: "java.lang.String"
        required: false

steps:
  - id: "Call1"
    type: "call"
  - id: "Call4"
    type: "call"
    ref: "ProcessImpexJob-Finish"
  - id: "Call5"
    type: "call"
    ref: "ProcessLinkExport-Cleanup"
  - id: "Call6"
    type: "call"
    ref: "ProcessLinkExport-Cleanup"
  - id: "Call7"
    type: "call"
    ref: "ProcessImpexJob-Finish"
  - id: "CallNode1"
    type: "call"
    ref: "ProcessLinkExport-Prepare"
  - id: "CallNode2"
    type: "call"
    ref: "ProcessLinkExport-GetObjects"
  - id: "CallNode3"
    type: "call"
    ref: "ProcessLinkExport-RunExport"
  - id: "CallNode4"
    type: "call"
    ref: "ProcessLinkExport-Cleanup"
  - id: "CallNode6"
    type: "call"
    ref: "ProcessBatchJob-GetPageableSequence"
  - id: "CloseFile3"
    type: "pipelet"
    ref: "CloseFile"
    config:
      PipeletID: "CloseFile1"
      StreamID: "target"
      UIDescription: "CloseFile"
      Delete: true
  - id: "CloseFile4"
    type: "pipelet"
    ref: "CloseFile"
    config:
      PipeletID: "CloseFile1"
      StreamID: "target"
      UIDescription: "CloseFile"
  - id: "CloseLoggers3"
    type: "pipelet"
    ref: "CloseLoggers"
    config:
      PipeletID: "CloseLoggers1"
      UIDescription: "CloseLoggers"
  - id: "CloseLoggers4"
    type: "pipelet"
    ref: "CloseLoggers"
    config:
      PipeletID: "CloseLoggers1"
      UIDescription: "CloseLoggers"
  - id: "ConcatenateStrings2"
    type: "pipelet"
    ref: "ConcatenateStrings"
    config:
      DefaultString2: "/"
    bindings:
      Concatenated: "ExportPath"
      String1: "ExportDirectory"
      String3: "SelectedFile"
  - id: "ConcatenateStrings3"
    type: "pipelet"
    ref: "ConcatenateStrings"
    config:
      DefaultString2: ".log"
    bindings:
      Concatenated: "LogFile"
      String1: "JobConfiguration:UUID"
  - id: "CreateDirectory1"
    type: "pipelet"
    ref: "CreateDirectory"
    config:
      DefaultDirectoryPath: "export"
      UnitDirectory: "IMPEX_DIR"
    bindings:
      DirectoryName: "ExportDirectory"
      UnitDomain: "JobConfiguration:Domain"
  - id: "CreateFileLogger2"
    type: "pipelet"
    ref: "CreateFileLogger"
    config:
      BufferSize: 1024
      Facility: "default"
      FlushTime: 0
      Level: "ERROR | WARN"
      PipeletID: "CreateFileLogger1"
      RolloverSize: 1024000
      UIDescription: "CreateFileLogger"
    bindings:
      File: "LogFile"
  - id: "CreateImpexUnitFileStructure1"
    type: "pipelet"
    ref: "CreateImpexUnitFileStructure"
  - id: "CreateJobInteractor1"
    type: "pipelet"
    ref: "CreateJobInteractor"
  - id: "Decision1"
    type: "decision"
    condition: "JobConfiguration"
  - id: "Decision3"
    type: "decision"
    condition: "JobConfiguration"
  - id: "DecisionNode1"
    type: "decision"
    condition: "DeterminePageablePipeline"
  - id: "DetermineConfiguration2"
    type: "pipelet"
    ref: "DetermineConfiguration"
    config:
      Controller.Class: "com.intershop.beehive.core.capi.impex.Controller"
      PerformAccessControl: false
      PipeletID: "DetermineConfiguration1"
      UIDescription: "DetermineConfiguration"
  - id: "End1"
    type: "end"
    strict: false
  - id: "End3"
    type: "end"
    strict: false
  - id: "End5"
    type: "end"
    strict: false
  - id: "End6"
    type: "end"
    strict: false
  - id: "End7"
    type: "end"
    strict: false
  - id: "EndNode3"
    type: "end"
    strict: false
  - id: "Export2"
    type: "pipelet"
    ref: "Export"
    config:
      PipeletID: "Export1"
      TargetID: "target"
      UIDescription: "Export.Link"
    bindings:
      Template: "ExportTemplate"
  - id: "GetJobConfiguration1"
    type: "pipelet"
    ref: "GetJobConfiguration"
    bindings:
      JobUUID: "JobConfigurationUUID"
  - id: "Join11"
    type: "join"
  - id: "Join12"
    type: "join"
  - id: "Join13"
    type: "join"
  - id: "Join3"
    type: "join"
  - id: "Join4"
    type: "join"
  - id: "Join6"
    type: "join"
  - id: "Join7"
    type: "join"
  - id: "Join8"
    type: "join"
  - id: "Join9"
    type: "join"
  - id: "JoinNode1"
    type: "join"
  - id: "JoinNode2"
    type: "join"
  - id: "OpenFile2"
    type: "pipelet"
    ref: "OpenFile"
    config:
      PipeletID: "OpenFileLinkExport1"
      StreamID: "target"
      Type: "TARGET"
      UIDescription: "OpenFile"
    bindings:
      File: "ExportPath"
  - id: "RemoveJobInteractor1"
    type: "pipelet"
    ref: "RemoveJobInteractor"
  - id: "RemoveJobInteractor2"
    type: "pipelet"
    ref: "RemoveJobInteractor"
  - id: "Stop1"
    type: "stop"
  - id: "Stop2"
    type: "stop"
  - id: "UpdateCustomAttribute1"
    type: "pipelet"
    ref: "UpdateCustomAttribute"
    config:
      DefaultAttributeName: "FinishedWithError"
      DefaultAttributeType: "String"
      DefaultAttributeValue: true
    bindings:
      ExtensibleObject: "JobConfiguration"
  - id: "WriteImpexLogMessage2"
    type: "pipelet"
    ref: "WriteImpexLogMessage"
    config:
      PipeletID: "LogTemplateError"
    bindings:
      MessageKey: "\"core.impex.pipelet.Export_E_TEMPLATEPROCESSOR\""
      Level: "\"ERROR\""
      Parameter0: "Exception"

