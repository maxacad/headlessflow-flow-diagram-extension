flow: "ViewImageMapping"
kind: "view"

entries:
  - id: "Start1"
    name: "GetImageMappingRules"
    mode: "private"
    strict: false
    inputs:
      []
  - id: "Start2"
    name: "Prefix"
    mode: "private"
    strict: false
    inputs:
      []
  - id: "Start3"
    name: "Update"
    mode: "private"
    strict: false
    inputs:
      []

steps:
  - id: "Call1"
    type: "call"
    ref: "ViewImageMapping-Prefix"
  - id: "Call10"
    type: "call"
    ref: "ViewImageMapping-Prefix"
  - id: "Call2"
    type: "call"
    ref: "DetermineRepositories-Master"
  - id: "Call4"
    type: "call"
    ref: "ProcessProductDataMappingRule-DeleteRuleConstruct"
  - id: "Call5"
    type: "call"
    ref: "ProcessProductDataMappingRule-CreateRuleConstruct"
  - id: "CallNode1"
    type: "call"
    ref: "ViewImageMapping-GetImageMappingRules"
  - id: "Decision1"
    type: "decision"
    condition: "mappingEnabled"
  - id: "Decision2"
    type: "decision"
    condition: "ProductDataMappingRuleID"
  - id: "Decision3"
    type: "decision"
    condition: "ProductDataMappingRuleID"
  - id: "End1"
    type: "end"
    strict: false
  - id: "EndNode1"
    type: "end"
    strict: false
  - id: "GetProductDataMappingRuleSet1"
    type: "pipelet"
    ref: "GetProductDataMappingRuleSet"
    bindings:
      DeclaringDomain: "Repository:Domain"
      ProvidingDomain: "ProvidingRepository:Domain"
  - id: "GetProductDataMappingRules1"
    type: "pipelet"
    ref: "GetProductDataMappingRules"
    bindings:
      DeclaringDomain: "ProductDataMappingRuleSet:DeclaringDomain"
      ProvidingDomain: "ProductDataMappingRuleSet:ProvidingDomain"
      ProductDataMappingRulesMap: "null"
      ProductDataMappingRules: "ProductImageDataMappingRules"
      TypeCode: "\"13\""
  - id: "GetRepositoryByUUID1"
    type: "pipelet"
    ref: "GetRepositoryByUUID"
    bindings:
      Repository: "ProvidingRepository"
      UUID: "ProviderID"
  - id: "Join1"
    type: "join"
  - id: "JoinNode1"
    type: "join"
  - id: "JoinNode2"
    type: "join"
  - id: "JumpNode1"
    type: "jump"
    ref: "ViewProductAttributeMapping-Start"
  - id: "SetDictionaryValue1"
    type: "pipelet"
    ref: "SetDictionaryValue"
    config:
      Name: "FunctionClassName"
      Value: "com.intershop.component.mvc.capi.mapping.ProductImageMappingRule"
      ValueType: "Dictionary Value"
  - id: "SetDictionaryValue2"
    type: "pipelet"
    ref: "SetDictionaryValue"
    config:
      Name: "TypeCode"
      Value: 13
      ValueType: "Dictionary Value"

links:
  - from: "SetDictionaryValue1"
    via: "next"
    to: "SetDictionaryValue2"
    into: "in"
  - from: "Decision2"
    via: "no"
    to: "JoinNode2"
    into: "in2"
  - from: "Call10"
    via: "next"
    to: "Decision1"
    into: "in"
  - from: "SetDictionaryValue2"
    via: "next"
    to: "Call5"
    into: "in"
  - from: "Start3"
    via: "next"
    to: "Call10"
    into: "in"
  - from: "Decision1"
    via: "yes"
    to: "Decision3"
    into: "in"
  - from: "Call1"
    via: "next"
    to: "GetProductDataMappingRules1"
    into: "in"
  - from: "Call5"
    via: "next"
    to: "Join1"
    into: "in1"
  - from: "CallNode1"
    via: "next"
    to: "JumpNode1"
    into: "in"
  - from: "Decision2"
    via: "yes"
    to: "Call4"
    into: "in"
  - from: "JoinNode1"
    via: "next"
    to: "CallNode1"
    into: "in"
  - from: "Join1"
    via: "next"
    to: "JoinNode1"
    into: "in3"
  - from: "Start2"
    via: "next"
    to: "GetRepositoryByUUID1"
    into: "in"
  - from: "Start1"
    via: "next"
    to: "Call1"
    into: "in"
  - from: "GetProductDataMappingRules1"
    via: "next"
    to: "EndNode1"
    into: "in"
  - from: "GetRepositoryByUUID1"
    via: "next"
    to: "Call2"
    into: "in"
  - from: "Call2"
    via: "next"
    to: "GetProductDataMappingRuleSet1"
    into: "in"
  - from: "GetProductDataMappingRuleSet1"
    via: "next"
    to: "End1"
    into: "in"
  - from: "Decision3"
    via: "no"
    to: "SetDictionaryValue1"
    into: "in"
  - from: "Call4"
    via: "next"
    to: "JoinNode2"
    into: "in1"
  - from: "Decision1"
    via: "no"
    to: "Decision2"
