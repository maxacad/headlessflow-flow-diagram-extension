flow: "ViewSlotEditing"
kind: "view"

entries:
  - id: "StartNode13"
    name: "Dispatch"
    mode: "private"
    strict: false
    inputs:
      []
  - id: "StartNode23"
    name: "Lock"
    mode: "private"
    strict: false
    inputs:
      []
  - id: "StartNode29"
    name: "Unlock"
    mode: "private"
    strict: false
    inputs:
      []
  - id: "StartNode30"
    name: "CheckLock"
    mode: "private"
    strict: false
    inputs:
      []
  - id: "StartNode4"
    name: "Start"
    mode: "private"
    strict: false
    inputs:
      []

steps:
  - id: "CallNode1"
    type: "call"
    ref: "ViewPageletEditing-Prefix"
  - id: "CallNode37"
    type: "call"
    ref: "ProcessPageletLock-Lock"
    bindings:
      LockingDomain: "ContentRepository:RepositoryDomain"
      PreferenceDomain: "ContentRepository:RepositoryDomain"
      User: "CurrentUser"
  - id: "CallNode38"
    type: "call"
    ref: "ProcessPageletLock-Unlock"
    bindings:
      LockingDomain: "ContentRepository:RepositoryDomain"
      User: "CurrentUser"
  - id: "CallNode5"
    type: "call"
    ref: "ViewPageletEditing-Prefix"
  - id: "DispatchFormAction2"
    type: "pipelet"
    ref: "DispatchFormAction"
    config:
      OutValue_0: "ViewSlotEditing-Lock"
      OutValue_1: "ViewSlotEditing-Unlock"
      OutValue_2: "ViewSlotEditing-CheckLock"
    bindings:
      SelectionKey: "JumpTarget"
      Key_0: "lock"
      Key_1: "unlock"
      Key_2: "checkLock"
  - id: "GetLocale2"
    type: "pipelet"
    ref: "GetLocale"
    config:
      LocaleFallback: "Request Locale"
  - id: "GetRepositoryByUUID4"
    type: "pipelet"
    ref: "GetRepositoryByUUID"
    bindings:
      Repository: "ContentRepository"
      UUID: "ContentRepositoryUUID"
  - id: "GetSlotByUUID3"
    type: "pipelet"
    ref: "GetSlotByUUID"
  - id: "InteractionEnd2"
    type: "interaction"
  - id: "JoinNode1"
    type: "join"
  - id: "JoinNode2"
    type: "join"
  - id: "JoinNode6"
    type: "join"
  - id: "JumpNode5"
    type: "jump"
    ref: "SecureJump-Start"
  - id: "Pipelet2"
    type: "pipelet"
    ref: "KeyMapper"
    bindings:
      InValue_1: "id"
      OutValue_1: "SlotUUID"

links:
  - from: "GetRepositoryByUUID4"
    via: "next"
    to: "JoinNode2"
    into: "in1"
  - from: "CallNode1"
    via: "next"
    to: "CallNode38"
    into: "in"
  - from: "JoinNode1"
    via: "next"
    to: "JoinNode6"
    into: "in3"
  - from: "StartNode30"
    via: "next"
    to: "JoinNode1"
    into: "in3"
  - from: "JoinNode2"
    via: "next"
    to: "GetSlotByUUID3"
    into: "in"
  - from: "Pipelet2"
    via: "next"
    to: "GetLocale2"
    into: "in"
  - from: "GetLocale2"
    via: "next"
    to: "GetRepositoryByUUID4"
    into: "in"
  - from: "StartNode4"
    via: "next"
    to: "Pipelet2"
    into: "in"
  - from: "GetSlotByUUID3"
    via: "next"
    to: "InteractionEnd2"
    into: "in"
  - from: "DispatchFormAction2"
    via: "next"
    to: "JumpNode5"
    into: "in"
  - from: "JoinNode6"
    via: "next"
    to: "JoinNode2"
