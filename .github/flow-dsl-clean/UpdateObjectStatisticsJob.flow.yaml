flow: "UpdateObjectStatisticsJob"
kind: "job"

entries:
  - id: "StartNode1"
    name: "Start"
    mode: "private"
    strict: false
    inputs:
      []

steps:
  - id: "AddObjectToVector1"
    type: "pipelet"
    ref: "AddObjectToVector"
    bindings:
      Object: "\"20\""
      OutVector: "TypeCodes"
  - id: "AddObjectToVector2"
    type: "pipelet"
    ref: "AddObjectToVector"
    bindings:
      Object: "\"30\""
      OutVector: "TypeCodes"
      InVector: "TypeCodes"
  - id: "ConcatenateStrings1"
    type: "pipelet"
    ref: "ConcatenateStrings"
    config:
      DefaultString0: "UpdateObjectStatistics_"
    bindings:
      String1: "CurrentChannel:TypeCode"
      Concatenated: "PipelineName"
  - id: "EndNode2"
    type: "end"
    strict: false
  - id: "ExecuteObjectsQuery1"
    type: "pipelet"
    ref: "ExecuteObjectsQuery"
    config:
      QueryName: "channel/GetChannelsByTypeCode"
      Datasource: "current ORM connection"
      ParameterName_01: "TypeCodes"
    bindings:
      ParameterValue_01: "\"32 42 52\""
      SearchResult: "Channels"
  - id: "ExecuteObjectsQuery2"
    type: "pipelet"
    ref: "ExecuteObjectsQuery"
    config:
      QueryName: "organization/GetOrganizationsByTypeCode"
      Datasource: "current ORM connection"
      ParameterName_01: "TypeCodes"
    bindings:
      SearchResult: "Organizations"
      ParameterValue_01: "TypeCodes"
  - id: "ExecutePipeline1"
    type: "pipelet"
    ref: "ExecutePipeline"
    config:
      Asynchronous: false
      PipelineStartNode: "ProcessChannel"
    bindings:
      PipelineDomain: "CurrentChannel:OwningDomain:Site"
      PipelineDomainID: "null"
      PipelineDomainName: "null"
      PipelineName: "PipelineName"
      PipelineStartNode: "null"
  - id: "ExecutePipeline2"
    type: "pipelet"
    ref: "ExecutePipeline"
    config:
      Asynchronous: false
      PipelineName: "UpdateObjectStatistics"
      PipelineStartNode: "ProcessMaster"
    bindings:
      PipelineDomain: "CurrentOrganization:OrganizationDomain:Site"
      PipelineDomainID: "null"
      PipelineDomainName: "null"
      PipelineName: "null"
      PipelineStartNode: "null"
  - id: "JoinNode1"
    type: "join"
  - id: "JoinNode2"
    type: "join"
  - id: "LoopNode1"
    type: "loop"
  - id: "LoopNode2"
    type: "loop"
  - id: "TextNode1"
    type: "text"
  - id: "TextNode2"
    type: "text"

links:
  - from: "AddObjectToVector1"
    via: "next"
    to: "AddObjectToVector2"
    into: "in"
  - from: "LoopNode2"
    via: "do"
    to: "ExecutePipeline2"
    into: "in"
  - from: "ExecuteObjectsQuery2"
    via: "next"
    to: "LoopNode2"
    into: "in"
  - from: "JoinNode2"
    via: "next"
    to: "LoopNode2"
    into: "loop"
  - from: "LoopNode1"
    via: "next"
    to: "AddObjectToVector1"
    into: "in"
  - from: "LoopNode2"
    via: "next"
    to: "EndNode2"
    into: "in"
  - from: "ConcatenateStrings1"
    via: "next"
    to: "ExecutePipeline1"
    into: "in"
  - from: "AddObjectToVector2"
    via: "next"
    to: "ExecuteObjectsQuery2"
    into: "in"
  - from: "LoopNode1"
    via: "do"
    to: "ConcatenateStrings1"
    into: "in"
  - from: "ExecutePipeline1"
    via: "error"
    to: "JoinNode1"
    into: "in2"
  - from: "JoinNode1"
    via: "next"
    to: "LoopNode1"
    into: "loop"
  - from: "ExecutePipeline1"
    via: "next"
    to: "JoinNode1"
    into: "in1"
  - from: "StartNode1"
    via: "next"
    to: "ExecuteObjectsQuery1"
    into: "in"
  - from: "ExecuteObjectsQuery1"
    via: "next"
    to: "LoopNode1"
    into: "in"
  - from: "ExecutePipeline2"
    via: "error"
    to: "JoinNode2"
    into: "in2"
  - from: "ExecutePipeline2"
    via: "next"
    to: "JoinNode2"
    into: "in1"
