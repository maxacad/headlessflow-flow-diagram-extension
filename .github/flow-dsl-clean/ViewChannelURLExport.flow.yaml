      InMap: "ExpandedCategoriesMap"
      Key: "Catalog:Root:UUID"
      OutMap: "ExpandedCategoriesMap"
      Value: "Catalog:Root:UUID"
  - id: "UpdateMapping2"
    type: "pipelet"
