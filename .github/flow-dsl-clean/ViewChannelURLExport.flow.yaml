      SelectionKey: "JumpTarget"
      Key_2: "Cancel"
      Key_3: "URLExport"
      Key_1: "selectConfiguration"
      Key_4: "Back"
      Key_6: "selectConfigurationCategory"
      Key_5: "BackSelectCategory"
