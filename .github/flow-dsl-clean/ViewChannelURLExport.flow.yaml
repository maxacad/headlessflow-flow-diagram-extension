      ValueType: "Form Value"
    bindings:
      InValue_2: "URLExportForm_ExportFile"
      OutValue_2: "SelectedFile"
      InValue_3: "\"URLCSVExport\""
      OutValue_3: "ExportTemplate"
      InValue_4: "\"ProcessCatalogExport-GetURLExportObjects\""
