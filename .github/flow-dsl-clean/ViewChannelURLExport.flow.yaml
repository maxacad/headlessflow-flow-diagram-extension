steps:
  - id: "Call1"
    type: "call"
    ref: "ProcessImpexJob-Create"
  - id: "Call2"
    type: "call"
    ref: "ProcessClipboard-Update"
  - id: "Call3"
    type: "call"
    ref: "ProcessClipboard-Delete"
  - id: "Call4"
    type: "call"
    ref: "ProcessClipboard-Get"
  - id: "Call5"
    type: "call"
    ref: "ProcessClipboard-Get"
  - id: "Call6"
    type: "call"
    ref: "ProcessClipboard-Get"
  - id: "CombineIterators2"
    type: "pipelet"
    ref: "CombineIterators"
    config:
      ProcessMethod: "Concatenate Iterators"
    bindings:
      Iterator: "Catalogs"
      Iterator1: "LocalCatalogs"
      Iterator2: "GeneralPagesCatalogs"
  - id: "CombineIterators3"
    type: "pipelet"
    ref: "CombineIterators"
    config:
      ProcessMethod: "Concatenate Iterators"
    bindings:
      Iterator: "LocalCatalogs"
      Iterator1: "LocalStandardCatalogs"
      Iterator2: "LocalClassificationCatalogs"
  - id: "CreatePageableFromIterator1"
    type: "pipelet"
    ref: "CreatePageableFromIterator"
    config:
      PageableName: "URLExportCatalogCategories"
      Pagesize: 100
    bindings:
      Iterator: "Clipboard:ObjectUUIDs"
  - id: "CreateWebForm1"
    type: "pipelet"
    ref: "CreateWebForm"
    config:
      param.1.name: "ExportFile"
      param.1.required: true
      param.1.rule: "^[^.\\\\/:*?<>|\\s]([^\\\\/:*?<>|\\s]*[^.\\\\/:*?<>|\\s])?$"
      param.2.name: "ExportProductURLs"
      param.2.required: false
      webform-id: "URLExportForm"
      param.2.rule: ""
      param.3.name: "ExportRecursive"
      param.3.rule: ""
      param.3.required: false
    bindings:
      WebForm: "URLExportForm"
  - id: "DecisionNode1"
    type: "decision"
    condition: "Clipboard:ObjectUUIDs"
  - id: "ExchangeSessionObject4"
    type: "pipelet"
    ref: "ExchangeSessionObject"
    config:
      ProcessMethod: "Get Object from Session"
      SessionObjectName: "ExpandedCategoriesMap"
    bindings:
      LoadObject: "ExpandedCategoriesMap"
  - id: "ExchangeSessionObject5"
    type: "pipelet"
    ref: "ExchangeSessionObject"
    config:
      ProcessMethod: "Get Object from Session"
      SessionObjectName: "ExpandedCategoriesMap"
    bindings:
      LoadObject: "ExpandedCategoriesMap"
  - id: "ExchangeSessionObject6"
    type: "pipelet"
    ref: "ExchangeSessionObject"
    config:
      ProcessMethod: "Put Object to Session"
      SessionObjectName: "ExpandedCategoriesMap"
    bindings:
      SaveObject: "ExpandedCategoriesMap"
  - id: "GetCatalogByUUID1"
    type: "pipelet"
    ref: "GetCatalogByUUID"
  - id: "GetCatalogByUUID2"
    type: "pipelet"
    ref: "GetCatalogByUUID"
  - id: "GetCatalogByUUID3"
    type: "pipelet"
    ref: "GetCatalogByUUID"
  - id: "GetFormSelection1"
