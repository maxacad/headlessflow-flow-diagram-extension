      InValue_1: "Pageable:ID"
      OutValue_1: "PageableID"
      InValue_5: "ChannelRepository:Domain:UUID"
      OutValue_5: "ProductDomainUUID"
      InValue_6: "URLExportForm:ExportProductURLs:Value"
      OutValue_6: "ExportProducts"
      InValue_7: "URLExportForm:ExportRecursive:Value"
      OutValue_7: "ExportRecursive"
  - id: "KeyMapper5"
    type: "pipelet"
    ref: "KeyMapper"
    config:
      ValueType: "Dictionary Value"
    bindings:
      InValue_1: "\"NothingSelected\""
      OutValue_1: "ERROR"
  - id: "KeyMapper8"
    type: "pipelet"
    ref: "KeyMapper"
    config:
      ValueType: "Form Value"
    bindings:
      OutValue_1: "ProcessPipelineName"
      InValue_1: "\"ProcessLinkExport\""
      OutValue_2: "ProcessPipelineStartNode"
      InValue_2: "\"Export\""
      InValue_3: "\"ProcessLinkImpex\""
