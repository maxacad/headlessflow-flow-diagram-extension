      OutValue_2: "ProcessExecutionDomain"
      InValue_2: "ChannelRepository:Domain"
      InValue_3: "CurrentDomain"
      OutValue_3: "OldCurrentDomain"
  - id: "KeyMapper4"
    type: "pipelet"
    ref: "KeyMapper"
