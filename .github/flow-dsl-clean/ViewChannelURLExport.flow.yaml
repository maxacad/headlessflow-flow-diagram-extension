      CatalogType: "Product Catalog"
      OnlineOnly: "False"
      ProxyFilter: "OFF - All Catalogs"
    bindings:
      Catalogs: "LocalStandardCatalogs"
      OrganizationDomain: "CurrentChannel:Domain"
  - id: "Pipelet3"
    type: "pipelet"
    ref: "GetCatalogs"
    config:
      CatalogType: "Classification Catalog"
      OnlineOnly: "False"
      ProxyFilter: "OFF - All Catalogs"
    bindings:
      Catalogs: "LocalClassificationCatalogs"
      OrganizationDomain: "CurrentChannel:Domain"
  - id: "Pipelet5"
    type: "pipelet"
    ref: "GetCatalogs"
    config:
      CatalogType: "Custom"
      OnlineOnly: "False"
      ProxyFilter: "OFF - All Catalogs"
      CustomCatalogType: 7
    bindings:
      Catalogs: "GeneralPagesCatalogs"
      OrganizationDomain: "CurrentChannel:Domain"
  - id: "Pipelet7"
    type: "pipelet"
    ref: "DispatchFormAction"
