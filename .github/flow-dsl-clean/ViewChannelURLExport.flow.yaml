      Mode: "Add"
    bindings:
      Key: "SelectedObjectUUID"
      OutMap: "CheckedCategoryUUIDMap"
      Value: "SelectedObjectUUID"
      InMap: "CheckedCategoryUUIDMap"
  - id: "UpdateWebForm1"
    type: "pipelet"
    ref: "UpdateWebForm"
    config:
      mode: "update"
      webform-id: "URLExportForm"
    bindings:
      WebForm: "URLExportForm"
  - id: "UpdateWebForm2"
    type: "pipelet"
