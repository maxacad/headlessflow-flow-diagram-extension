      OutValue_0: "ViewChannelURLExport-SelectCatalog"
      OutValue_2: "ViewChannelLinkImpex-Status"
      OutValue_3: "ViewChannelURLExport-URLExport"
      OutValue_1: "ViewChannelURLExport-SelectConfiguration"
      OutValue_4: "ViewChannelURLExport-BackSelectCatalog"
      OutValue_5: "ViewChannelURLExport-BrowseCatalog"
      OutValue_6: "ViewChannelURLExport-SelectConfigurationCategory"
