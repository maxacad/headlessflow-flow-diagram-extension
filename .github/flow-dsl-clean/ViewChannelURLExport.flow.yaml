flow: "ViewChannelURLExport"
kind: "view"

entries:
  - id: "Start1"
    name: "Collapse"
    mode: "private"
    strict: false
    inputs:
      []
  - id: "Start2"
    name: "SelectCatalog"
    mode: "private"
    strict: false
    inputs:
      []
  - id: "Start3"
    name: "URLExport"
    mode: "private"
    strict: false
    inputs:
      []
  - id: "Start4"
    name: "Expand"
    mode: "private"
    strict: false
    inputs:
      []
  - id: "StartNode1"
    name: "SelectConfiguration"
    mode: "private"
    strict: false
    inputs:
      []
  - id: "StartNode2"
    name: "Dispatch"
    mode: "private"
    strict: false
    inputs:
      []
  - id: "StartNode3"
    name: "BackSelectCatalog"
    mode: "private"
    strict: false
    inputs:
      []
  - id: "StartNode4"
    name: "BrowseCatalog"
    mode: "private"
    strict: false
    inputs:
