flow: "CreateSalesOrganizationExtension"
kind: "extension"

entries:
  - id: "Start1"
    name: "Start"
    mode: "private"
    strict: true
    inputs:
      - key: "Organization"
        type: "com.intershop.component.organization.capi.Organization"
        required: true
      - key: "AdminUser"
        type: "com.intershop.beehive.core.capi.user.User"
        required: false
      - key: "Site"
        type: "com.intershop.beehive.core.capi.domain.Domain"
        required: false
  - id: "StartNode1"
    name: "CreateAttributeGroup"
    mode: "private"
    strict: true
    inputs:
      - key: "FixedFlag"
        type: "java.lang.Boolean"
        required: false
      - key: "ID"
        type: "java.lang.String"
        required: true
      - key: "Domain"
        type: "com.intershop.beehive.core.capi.domain.Domain"
        required: true
      - key: "TypeCode"
        type: "java.lang.Integer"
        required: false
      - key: "DisplayName"
        type: "java.lang.String"
        required: false
      - key: "Description"
        type: "java.lang.String"
        required: false
      - key: "LocaleId"
        type: "java.lang.String"
        required: false
  - id: "StartNode2"
    name: "UpdateAttributeGroup"
    mode: "private"
    strict: true
    inputs:
      - key: "AttributeGroup"
        type: "com.intershop.component.foundation.capi.attributegroup.AttributeGroup"
        required: true
      - key: "FixedFlag"
        type: "java.lang.Boolean"
        required: false
      - key: "Description"
        type: "java.lang.String"
        required: false
      - key: "LocaleId"
        type: "java.lang.String"
        required: false
      - key: "Domain"
        type: "com.intershop.beehive.core.capi.domain.Domain"
        required: true
      - key: "TypeCode"
        type: "java.lang.Integer"
        required: false
      - key: "DisplayName"
        type: "java.lang.String"
        required: false

steps:
  - id: "AssignUserToUserGroup1"
    type: "pipelet"
    ref: "AssignUserToUserGroup"
    config:
      UserGroupID: "SLD_AR_20_ADMINISTRATOR"
    bindings:
      CurrentDomain: "Organization:Domain"
      CurrentUser: "AdminUser"
  - id: "Call1"
    type: "call"
    ref: "AccessRoles-Create"
  - id: "CallNode1"
    type: "call"
    ref: "ProcessRepository-Create"
  - id: "CallNode2"
    type: "call"
    ref: "ProcessRepository-Create"
  - id: "CallNode3"
    type: "call"
    ref: "ProcessInitializeImages-CreateInstances"
    bindings:
      Domain: "Organization:Domain"
      ImageTypeBORepository: "ApplicationBO:Repository(\"ImageTypeBORepository\", Organization:Domain:UUID)"
      ImageViewBORepository: "ApplicationBO:Repository(\"ImageViewBORepository\", Organization:Domain:UUID)"
  - id: "CallNode4"
    type: "call"
    ref: "ProcessInitializeImages-CreateDefinitionDomainPreference"
    bindings:
      Domain: "Organization:Domain"
  - id: "CallNode5"
    type: "call"
    ref: "ManufacturerAliasesCleanUp-Create"
    bindings:
      Domain: "Organization:Domain"
  - id: "CallNode6"
    type: "call"
    ref: "CreateSalesOrganizationExtension-CreateAttributeGroup"
    bindings:
      ID: "\"BACKOFFICE_SEARCH_ATTRIBUTES\""
      FixedFlag: "\"(Boolean)true\""
      Domain: "Organization:Domain"
      LocaleId: "null"
      TypeCode: "null"
      Description: "null"
      DisplayName: "null"
  - id: "CopyCustomAttributes1"
    type: "pipelet"
    ref: "CopyCustomAttributes"
    bindings:
      CustomAttributes: "ClassificationCatalog:CustomAttributes"
      ExtensibleObject: "Proxy"
  - id: "CreateApplicationDomainRelation1"
    type: "pipelet"
    ref: "CreateApplicationDomainRelation"
    bindings:
      RelationName: "\"RecycleBinRepository\""
      Domain: "Repository:RepositoryDomain"
      Application: "ApplicationBO:Extension(\"PersistentObjectBOExtension\"):PersistentObject"
  - id: "CreateApplicationDomainRelation2"
    type: "pipelet"
    ref: "CreateApplicationDomainRelation"
    bindings:
      RelationName: "\"DefaultRepository\""
      Domain: "Repository:RepositoryDomain"
      Application: "ApplicationBO:Extension(\"PersistentObjectBOExtension\"):PersistentObject"
  - id: "CreateDomainRelation1"
    type: "pipelet"
    ref: "CreateDomainRelation"
    config:
      DefaultRelationName: "MANAGED_SERVICE"
      DefaultRoleName: "Role B"
    bindings:
      Source: "Organization:Domain"
      Target: "TAX_Domain"
  - id: "CreateDomainRelation2"
    type: "pipelet"
    ref: "CreateDomainRelation"
    config:
      DefaultRelationName: "TAX_CLASS"
      DefaultRoleName: "Role B"
    bindings:
      Source: "Organization:Domain"
      Target: "TAX_Domain"
  - id: "CreateDomainRelation3"
    type: "pipelet"
    ref: "CreateDomainRelation"
    config:
      DefaultRelationName: "TAX_JURISDICTION"
      DefaultRoleName: "Role B"
    bindings:
      Source: "Organization:Domain"
      Target: "TAX_Domain"
  - id: "CreateDomainRelation4"
    type: "pipelet"
    ref: "CreateDomainRelation"
    config:
      DefaultRelationName: "SHIPPING_METHOD"
      DefaultRoleName: "Role B"
    bindings:
      Source: "Organization:Domain"
      Target: "TAX_Domain"
  - id: "CreateDomainRelation5"
    type: "pipelet"
    ref: "CreateDomainRelation"
    config:
      DefaultRelationName: "PAYMENT_METHOD"
      DefaultRoleName: "Role B"
    bindings:
      Source: "Organization:Domain"
      Target: "TAX_Domain"
  - id: "CreateProxyCatalog2"
    type: "pipelet"
    ref: "CreateProxyCatalog"
    config:
      DefaultCatalogID: "eclass"
      DefaultCatalogType: 2
    bindings:
      Catalog: "ClassificationCatalog"
      Domain: "Organization:Domain"
      CatalogID: "ClassificationCatalog:Id"
      CatalogType: "ClassificationCatalog:TypeCode"
  - id: "Decision1"
    type: "decision"
    condition: "Organization:TypeCode"
  - id: "DecisionNode1"
    type: "decision"
    condition: "LocaleId"
  - id: "DecisionNode2"
    type: "decision"
    condition: "ClassificationCatalog:ClassificationSystem:Name"
  - id: "DetermineUnit1"
    type: "pipelet"
    ref: "DetermineUnit"
  - id: "End1"
    type: "end"
    strict: true
  - id: "End3"
    type: "end"
    strict: true
  - id: "EndNode1"
    type: "end"
    strict: true
    outputs:
      - key: "AttributeGroup"
        type: "com.intershop.component.foundation.capi.attributegroup.AttributeGroup"
        guaranteed: false
  - id: "EndNode2"
    type: "end"
    strict: true
  - id: "EndNode3"
    type: "end"
    strict: true
