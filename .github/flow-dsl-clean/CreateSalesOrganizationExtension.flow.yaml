      OrganizationDomain: "Unit"
      Catalogs: "ClassificationCatalogs"
  - id: "GetDomain2"
    type: "pipelet"
    ref: "GetDomain"
    bindings:
      StagingDomain: "TAX_Domain"
      StagingDomainName: "TAX_DomainName"
  - id: "GetLocale1"
    type: "pipelet"
    ref: "GetLocale"
  - id: "GetLocale2"
    type: "pipelet"
    ref: "GetLocale"
