      DefaultPreferenceKey: "InactivityPeriod"
      Type: "Integer"
      DefaultPreferenceValue: 90
    bindings:
      PreferenceDomain: "Organization:OrganizationDomain"
      PreferenceIntValue: "null"
      PreferenceDoubleValue: "null"
      PreferenceKey: "null"
      PreferenceStringValue: "null"
      PreferenceValue: "null"
