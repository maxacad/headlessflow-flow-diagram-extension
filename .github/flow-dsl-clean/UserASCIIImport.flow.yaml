      SkipLines: 1
      SourceID: "source"
      TargetID: "temp"
      UIDescription: "ASCIIConvert"
  - id: "AccessControl1"
    type: "pipelet"
    ref: "AccessControl"
    config:
      AccessControlPermission: "MANAGE_USERS"
