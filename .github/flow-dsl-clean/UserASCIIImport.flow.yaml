flow: "UserASCIIImport"
kind: "process"

entries:
  - id: "Start1"
    name: "Start"
    mode: "private"
    strict: false
    inputs:
      - key: "StoreName"
        type: "java.lang.String"
        required: false
      - key: "Interactor"
        type: "com.intershop.beehive.core.capi.impex.ImpexInteractor"
        required: false
  - id: "Start2"
    name: "Error"
    mode: "private"
    strict: false
    inputs:
      []

