flow: "ViewCatalogCategory"
kind: "view"

entries:
  - id: "StartNode1"
    name: "GetSubCategories"
    mode: "include"
    strict: true
    inputs:
      - key: "CatalogCategory"
        type: "com.intershop.beehive.xcs.capi.catalog.CatalogCategory"
        required: true
      - key: "Catalog"
        type: "com.intershop.component.mvc.capi.catalog.Catalog"
        required: false
      - key: "Locale"
        type: "com.intershop.beehive.core.capi.localization.LocaleInformation"
        required: false
      - key: "HideEmptyClassifications"
        type: "java.lang.String"
        required: false

steps:
  - id: "DecisionNode1"
    type: "decision"
    condition: "Locale"
  - id: "DecisionNode2"
    type: "decision"
    condition: "Catalog:ClassificationSystem:isGroupIDHierarchy"
  - id: "DecisionNode3"
    type: "decision"
    condition: "HideEmptyClassifications"
  - id: "DecisionNode4"
    type: "decision"
    condition: "Catalog:ClassificationSystem"
  - id: "EndNode1"
    type: "end"
    strict: true
    outputs:
      - key: "CatalogCategories"
        type: "java.util.Iterator"
        guaranteed: false
  - id: "EndNode2"
    type: "end"
    strict: false
  - id: "ExecuteObjectsQuery1"
    type: "pipelet"
    ref: "ExecuteObjectsQuery"
    config:
      QueryName: "catalog/GetCategoriesByParent"
      ParameterName_01: "LeadLocale"
      ParameterName_02: "LocaleInformation"
      ParameterName_03: "ParentCategory"
    bindings:
      Parameters: "SearchParams"
      SearchResult: "CatalogCategories"
      ParameterValue_02: "Locale"
      ParameterValue_01: "Locale"
      ParameterValue_03: "CatalogCategory"
  - id: "JoinNode1"
    type: "join"
  - id: "JoinNode2"
    type: "join"
  - id: "JoinNode3"
    type: "join"
  - id: "JoinNode5"
    type: "join"
  - id: "KeyMapper1"
    type: "pipelet"
    ref: "KeyMapper"
    bindings:
      OutValue_1: "Locale"
      InValue_1: "CurrentSession:Locale"
  - id: "SetDictionaryValue1"
    type: "pipelet"
    ref: "SetDictionaryValue"
    config:
      Name: "SortAttribute"
      Value: "name"
      ValueType: "Dictionary Value"
  - id: "SetDictionaryValue2"
    type: "pipelet"
    ref: "SetDictionaryValue"
    config:
      Name: "HideEmptyClassifications"
      Value: "on"
      ValueType: "Dictionary Value"
  - id: "UpdateDictionary1"
    type: "pipelet"
    ref: "UpdateDictionary"
    config:
      Name_01: "AssignedProductsCountFilter"
      Name_02: "ParentCategory"
      Name_03: "LocaleInformation"
      Name_04: "LeadLocale"
      Name_05: "SortAttribute"
      Name_06: "SortDirection"
      Name_07: "RepositoryDomainUUID"
    bindings:
      Value_01: "HideEmptyClassifications"
      InDictionary: "null"
      Value_02: "CatalogCategory"
      Value_03: "Locale"
      Value_04: "Locale"
      Value_07: "CatalogCategory:DomainID"
      Value_06: "\"ASC\""
      Value_05: "SortAttribute"
      OutDictionary: "SearchParams"

links:
  - from: "ExecuteObjectsQuery1"
    via: "error"
    to: "EndNode2"
    into: "in"
  - from: "SetDictionaryValue1"
    via: "next"
    to: "JoinNode5"
    into: "in2"
  - from: "DecisionNode4"
    via: "yes"
    to: "JoinNode2"
    into: "in1"
  - from: "DecisionNode4"
    via: "no"
    to: "DecisionNode3"
    into: "in"
  - from: "DecisionNode3"
    via: "no"
    to: "JoinNode3"
    into: "in2"
  - from: "JoinNode3"
    via: "next"
    to: "DecisionNode2"
    into: "in"
  - from: "DecisionNode3"
    via: "yes"
    to: "SetDictionaryValue2"
    into: "in"
  - from: "SetDictionaryValue2"
    via: "next"
    to: "JoinNode3"
    into: "in1"
  - from: "JoinNode1"
    via: "next"
    to: "UpdateDictionary1"
    into: "in"
  - from: "UpdateDictionary1"
    via: "next"
    to: "ExecuteObjectsQuery1"
    into: "in"
  - from: "JoinNode5"
    via: "next"
    to: "JoinNode2"
    into: "in2"
  - from: "JoinNode2"
    via: "next"
    to: "DecisionNode1"
    into: "in"
  - from: "ExecuteObjectsQuery1"
    via: "next"
    to: "EndNode1"
    into: "in"
  - from: "DecisionNode2"
    via: "yes"
    to: "SetDictionaryValue1"
    into: "in"
  - from: "DecisionNode1"
    via: "no"
    to: "JoinNode1"
    into: "in2"
  - from: "StartNode1"
    via: "next"
    to: "DecisionNode4"
    into: "in"
  - from: "DecisionNode1"
    via: "yes"
    to: "KeyMapper1"
    into: "in"
  - from: "KeyMapper1"
    via: "next"
    to: "JoinNode1"
    into: "in1"
  - from: "DecisionNode2"
    via: "no"
    to: "JoinNode5"
    into: "in1"
