flow: "ProcessPageViewContextProduct"
kind: "process"

entries:
  - id: "StartNode8"
    name: "GetPageletEntryPoint"
    mode: "private"
    strict: true
    inputs:
      - key: "ProductBO"
        type: "com.intershop.component.product.capi.ProductBO"
        required: true
      - key: "CategoryBO"
        type: "com.intershop.component.catalog.capi.CatalogCategoryBO"
        required: false
      - key: "ViewContext"
        type: "com.intershop.component.pmc.capi.viewcontext.ViewContext"
        required: true

steps:
  - id: "DecisionNode1"
    type: "decision"
    condition: "ProductBO:BundleInformationBO:BundledProductBOs"
  - id: "DecisionNode4"
    type: "decision"
    condition: "ProductBO:isProductBundle"
  - id: "DecisionNode5"
    type: "decision"
    condition: "ProductBO:isRetailSet"
  - id: "EndNode18"
    type: "end"
    strict: true
  - id: "EndNode3"
    type: "end"
    strict: true
  - id: "EndNode4"
    type: "end"
    strict: true
    outputs:
      - key: "PageletEntryPoint"
        type: "com.intershop.component.pmc.capi.pagelet.PageletEntryPoint"
        guaranteed: true
  - id: "GetPageletEntryPointByViewContext2"
    type: "pipelet"
    ref: "GetPageletEntryPointByViewContext"
    config:
      Strategy: "Product"
    bindings:
      Site: "CurrentDomain:Site"
      Domain: "Repository:RepositoryDomain"
  - id: "GetValuesFromRequest3"
    type: "pipelet"
    ref: "GetValuesFromRequest"
    config:
      Namespace: "ApplicationRepository"
    bindings:
      Namespace: "null"
      Key: "null"
  - id: "JoinNode1"
    type: "join"
  - id: "JoinNode3"
    type: "join"
  - id: "SetDictionaryValue1"
    type: "pipelet"
    ref: "SetDictionaryValue"
    config:
      Name: "ViewContextInclusionName"
      Value: "pageProduct"
  - id: "SetDictionaryValue3"
    type: "pipelet"
    ref: "SetDictionaryValue"
    config:
      Name: "ViewContextInclusionName"
      Value: "pageBundle"
  - id: "SetDictionaryValue4"
    type: "pipelet"
    ref: "SetDictionaryValue"
    config:
      Name: "ViewContextInclusionName"
      Value: "pageRetailSet"
  - id: "SetDictionaryValue6"
    type: "pipelet"
    ref: "SetDictionaryValue"
    config:
      Name: "ViewContextInclusionName"
      Value: "pageProduct"

links:
  - from: "SetDictionaryValue6"
    via: "next"
    to: "JoinNode3"
    into: "in1"
  - from: "GetValuesFromRequest3"
    via: "error"
    to: "EndNode18"
    into: "in"
  - from: "GetPageletEntryPointByViewContext2"
    via: "next"
    to: "EndNode4"
    into: "in"
  - from: "DecisionNode1"
    via: "yes"
    to: "SetDictionaryValue3"
    into: "in"
  - from: "GetPageletEntryPointByViewContext2"
    via: "error"
    to: "EndNode3"
    into: "in"
  - from: "DecisionNode1"
    via: "no"
    to: "SetDictionaryValue1"
    into: "in"
  - from: "DecisionNode4"
    via: "yes"
    to: "DecisionNode1"
    into: "in"
  - from: "DecisionNode5"
    via: "no"
    to: "SetDictionaryValue6"
    into: "in"
  - from: "JoinNode1"
    via: "next"
    to: "GetPageletEntryPointByViewContext2"
    into: "in"
  - from: "SetDictionaryValue4"
    via: "next"
    to: "JoinNode3"
    into: "in1"
  - from: "DecisionNode5"
    via: "yes"
    to: "SetDictionaryValue4"
    into: "in"
  - from: "JoinNode3"
    via: "next"
    to: "JoinNode1"
    into: "in3"
  - from: "StartNode8"
    via: "next"
    to: "GetValuesFromRequest3"
    into: "in"
  - from: "DecisionNode4"
    via: "no"
    to: "DecisionNode5"
    into: "in"
  - from: "SetDictionaryValue1"
    via: "next"
    to: "JoinNode1"
    into: "in1"
  - from: "GetValuesFromRequest3"
    via: "next"
    to: "DecisionNode4"
    into: "in"
  - from: "SetDictionaryValue3"
    via: "next"
    to: "JoinNode1"
    into: "in1"
