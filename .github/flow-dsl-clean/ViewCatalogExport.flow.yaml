flow: "ViewCatalogExport"
kind: "view"

entries:
  - id: "Start2"
    name: "SelectCatalog"
    mode: "private"
    strict: false
    inputs:
      []
  - id: "Start3"
    name: "Export"
    mode: "private"
    strict: false
    inputs:
      []
  - id: "StartNode1"
    name: "Dispatch"
    mode: "private"
    strict: false
    inputs:
      []

steps:
  - id: "Call2"
    type: "call"
    ref: "ProcessImpexJob-Create"
  - id: "CombineIterators2"
    type: "pipelet"
    ref: "CombineIterators"
    config:
      ProcessMethod: "Concatenate Iterators"
    bindings:
      Iterator: "Catalogs"
      Iterator1: "ProductCatalogs"
      Iterator2: "ClassificationCatalogs"
  - id: "CreateWebForm1"
    type: "pipelet"
    ref: "CreateWebForm"
    config:
      param.1.name: "ExportFile"
      param.1.required: true
      param.1.rule: "^[^.\\\\/:*?<>|\\s]([^\\\\/:*?<>|\\s]*[^.\\\\/:*?<>|\\s])?$"
      param.2.name: "CatalogDomainUUID"
      param.2.required: true
      webform-id: "CategoryExportForm"
      param.2.rule: ""
    bindings:
      WebForm: "CategoryExportConfiguration"
  - id: "GetCatalogs1"
    type: "pipelet"
    ref: "GetCatalogs"
    config:
      CatalogType: "Classification Catalog"
      OnlineOnly: "False"
      ProxyFilter: "ON - Exclude Proxy Catalogs"
    bindings:
      Catalogs: "ClassificationCatalogs"
      OrganizationDomain: "CurrentOrganization:Domain"
  - id: "GetCatalogs2"
    type: "pipelet"
    ref: "GetCatalogs"
    config:
      CatalogType: "Product Catalog"
      OnlineOnly: "False"
      ProxyFilter: "ON - Exclude Proxy Catalogs"
    bindings:
      Catalogs: "ProductCatalogs"
      OrganizationDomain: "CurrentOrganization:Domain"
  - id: "GetWebForm1"
    type: "pipelet"
    ref: "GetWebForm"
    config:
      webform-id: "CategoryExportForm"
    bindings:
      WebForm: "CategoryExportForm"
  - id: "InteractionEnd1"
    type: "interaction"
  - id: "Join2"
    type: "join"
  - id: "Join3"
    type: "join"
  - id: "Jump3"
    type: "jump"
    ref: "ViewImpex-Start"
  - id: "JumpNode2"
    type: "jump"
    ref: "SecureJump-Start"
  - id: "KeyMapper1"
    type: "pipelet"
    ref: "KeyMapper"
    config:
      ValueType: "Form Value"
    bindings:
      InValue_1: "CategoryExportForm_CatalogDomainUUID"
      InValue_2: "CategoryExportForm_ExportFile"
      OutValue_1: "CatalogDomainUUID"
      OutValue_2: "SelectedFile"
  - id: "KeyMapper2"
    type: "pipelet"
    ref: "KeyMapper"
    bindings:
      InValue_1: "CurrentOrganization:Domain"
      InValue_2: "CurrentOrganization:Domain"
      OutValue_1: "ProcessOwningDomain"
      OutValue_2: "ProcessExecutionDomain"
  - id: "KeyMapper3"
    type: "pipelet"
    ref: "KeyMapper"
    config:
      ValueType: "Form Value"
    bindings:
      OutValue_1: "ProcessPipelineName"
      InValue_1: "\"ProcessCatalogExport\""
      OutValue_2: "ProcessPipelineStartNode"
      InValue_2: "\"Export\""
      InValue_3: "\"ProcessCatalogImpex\""
      OutValue_3: "JobName"
  - id: "Pipelet1"
    type: "pipelet"
    ref: "DispatchFormAction"
    config:
      OutValue_0: "ViewCatalogExport-SelectCatalog"
      OutValue_1: "ViewCatalogExport-Export"
      OutValue_2: "ViewImpex-Start"
    bindings:
      Key_0: "Start"
      Key_1: "Export"
      Key_2: "Cancel"
      SelectionKey: "JumpTarget"
  - id: "PrepareApplicationView1"
    type: "pipelet"
    ref: "PrepareApplicationView"
    config:
      SelectedMenuItem: "Import & Export"
      WorkingTemplate: "impex/CatalogExportSelectCatalog"
  - id: "UpdateWebForm1"
    type: "pipelet"
    ref: "UpdateWebForm"
    config:
      mode: "update"
      webform-id: "CategoryExportForm"
    bindings:
      WebForm: "CategoryExportForm"
  - id: "ValidateWebForm1"
    type: "pipelet"
    ref: "ValidateWebForm"
    bindings:
      WebForm: "CategoryExportForm"

links:
  - from: "Pipelet1"
    via: "next"
    to: "JumpNode2"
    into: "in"
  - from: "PrepareApplicationView1"
    via: "next"
    to: "InteractionEnd1"
    into: "in"
  - from: "CreateWebForm1"
    via: "next"
    to: "Join3"
    into: "in1"
  - from: "Join2"
    via: "next"
    to: "CreateWebForm1"
    into: "in"
  - from: "GetWebForm1"
    via: "error"
    to: "Join2"
    into: "in3"
  - from: "ValidateWebForm1"
    via: "error"
    to: "Join3"
    into: "in3"
  - from: "KeyMapper3"
    via: "next"
    to: "Call2"
    into: "in"
  - from: "StartNode1"
    via: "next"
    to: "Pipelet1"
    into: "in"
  - from: "KeyMapper1"
    via: "next"
    to: "KeyMapper2"
    into: "in"
  - from: "Call2"
    via: "next"
    to: "Jump3"
    into: "in"
  - from: "CombineIterators2"
    via: "next"
    to: "PrepareApplicationView1"
    into: "in"
  - from: "GetCatalogs1"
    via: "next"
    to: "GetCatalogs2"
    into: "in"
  - from: "Join3"
    via: "next"
    to: "GetCatalogs1"
    into: "in"
  - from: "GetCatalogs2"
    via: "next"
    to: "CombineIterators2"
    into: "in"
  - from: "ValidateWebForm1"
    via: "next"
    to: "KeyMapper1"
    into: "in"
  - from: "GetWebForm1"
    via: "next"
    to: "UpdateWebForm1"
    into: "in"
  - from: "KeyMapper2"
    via: "next"
    to: "KeyMapper3"
    into: "in"
  - from: "UpdateWebForm1"
    via: "next"
    to: "ValidateWebForm1"
    into: "in"
  - from: "Start3"
    via: "next"
    to: "GetWebForm1"
    into: "in"
  - from: "Start2"
    via: "next"
    to: "Join2"
    into: "in1"
