      SourceDirectoryPath: "upload"
      SourceUnitDirectory: "IMPEX_DIR"
      TargetUnitDirectory: "IMPEX_SRC_DIR"
      TargetDirectoryPath: "catalog"
    bindings:
      Locale: "null"
      Files: "ExistingFiles"
      SourceDirectoryPath: "null"
      SourceUnitDirectory: "null"
      SourceUnitDomain: "CurrentOrganization:Domain"
      TargetUnitDomain: "CurrentOrganization:Domain"
      TargetDirectoryPath: "null"
      TargetUnitDirectory: "null"
  - id: "CopyFile1"
    type: "pipelet"
    ref: "CopyFile"
    config:
      DefaultSourceDirectoryPath: "temp"
      DefaultSourceUnitDirectory: "IMPEX_DIR"
      DefaultTargetUnitDirectory: "IMPEX_SRC_DIR"
    bindings:
      SourceFileName: "JobConfiguration:TempXMLFile"
      SourceUnitDomain: "CurrentOrganization:Domain"
      TargetFileName: "JobConfiguration:TempXMLFile"
      TargetUnitDomain: "ProcessExecutionDomain"
  - id: "CopyFile2"
    type: "pipelet"
    ref: "CopyFile"
    config:
      DefaultSourceDirectoryPath: "catalog"
      DefaultSourceUnitDirectory: "IMPEX_SRC_DIR"
      DefaultTargetUnitDirectory: "IMPEX_SRC_DIR"
    bindings:
      SourceFileName: "SelectedFile"
      SourceUnitDomain: "CurrentOrganization:Domain"
      TargetFileName: "SelectedFile"
      TargetUnitDomain: "ProcessExecutionDomain"
  - id: "CreateDirectory1"
    type: "pipelet"
    ref: "CreateDirectory"
    config:
      DefaultDirectoryName: "CSVMappingTemplates"
      DefaultDirectoryPath: "default"
      UnitDirectory: "TEMPLATE_DIR"
    bindings:
      UnitDomain: "CurrentDomain"
  - id: "CreateWebForm3"
    type: "pipelet"
    ref: "CreateWebForm"
    config:
      param.1.name: "SelectedFile"
      param.1.required: true
      webform-id: "SelectFileForm"
    bindings:
      WebForm: "SelectFileForm"
