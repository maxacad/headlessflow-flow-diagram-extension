flow: "AccessRoles"
kind: "process"

entries:
  - id: "Start1"
    name: "Create"
    mode: "private"
    strict: false
    inputs:
      []

steps:
  - id: "AssignPermissionGroupsToAccessRoles1"
    type: "pipelet"
    ref: "AssignPermissionGroupsToAccessRoles"
  - id: "CreateAccessRoles1"
    type: "pipelet"
    ref: "CreateAccessRoles"
  - id: "End1"
    type: "end"
  - id: "End2"
    type: "end"
  - id: "GetAccessPermissionGroups1"
    type: "pipelet"
    ref: "GetAccessPermissionGroups"
  - id: "Join1"
    type: "join"

links:
  - from: "GetAccessPermissionGroups1"
    via: "next"
    to: "CreateAccessRoles1"
    into: "in"
  - from: "CreateAccessRoles1"
    via: "next"
    to: "AssignPermissionGroupsToAccessRoles1"
    into: "in"
  - from: "Start1"
    via: "next"
    to: "GetAccessPermissionGroups1"
    into: "in"
  - from: "AssignPermissionGroupsToAccessRoles1"
    via: "next"
    to: "End1"
    into: "in"
  - from: "CreateAccessRoles1"
    via: "error"
    to: "Join1"
    into: "in1"
  - from: "AssignPermissionGroupsToAccessRoles1"
    via: "error"
    to: "Join1"
    into: "in2"
  - from: "Join1"
    via: "next"
    to: "End2"
    into: "in"
