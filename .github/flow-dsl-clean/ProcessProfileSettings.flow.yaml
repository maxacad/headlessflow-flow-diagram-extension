        type: "com.intershop.beehive.core.capi.user.User"
        required: true
      - key: "CurrentOrganization"
        type: "com.intershop.component.organization.capi.Organization"
        required: true
  - id: "StartNode6"
    name: "SendMailUpdatePassword"
    mode: "private"
    strict: true
    inputs:
