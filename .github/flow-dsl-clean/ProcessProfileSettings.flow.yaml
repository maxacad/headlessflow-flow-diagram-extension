flow: "ProcessProfileSettings"
kind: "process"

entries:
  - id: "StartNode1"
    name: "UpdatePassword"
    mode: "private"
    strict: true
    inputs:
      - key: "User"
        type: "com.intershop.beehive.core.capi.user.User"
        required: true
      - key: "OldPassword"
        type: "java.lang.String"
        required: true
      - key: "Password"
        type: "java.lang.String"
        required: true
      - key: "PasswordConfirmation"
        type: "java.lang.String"
        required: true
      - key: "SecurityQuestion"
        type: "java.lang.String"
        required: true
      - key: "PasswordReminder"
        type: "java.lang.String"
        required: true
  - id: "StartNode11"
    name: "CheckRightPassword"
    mode: "private"
    strict: true
    inputs:
      - key: "User"
        type: "com.intershop.beehive.core.capi.user.User"
        required: true
      - key: "Password"
        type: "java.lang.String"
        required: true
  - id: "StartNode12"
    name: "UpdateLogin"
    mode: "private"
    strict: true
    inputs:
      - key: "User"
        type: "com.intershop.beehive.core.capi.user.User"
        required: true
      - key: "Login"
        type: "java.lang.String"
        required: true
      - key: "Password"
        type: "java.lang.String"
        required: true
      - key: "PasswordConfirmation"
        type: "java.lang.String"
        required: true
  - id: "StartNode13"
    name: "UpdateEmailSettings"
    mode: "private"
    strict: true
    inputs:
      - key: "User"
        type: "com.intershop.beehive.core.capi.user.User"
        required: true
      - key: "Email"
        type: "java.lang.String"
        required: false
      - key: "Password"
        type: "java.lang.String"
        required: false
      - key: "ReceiveOrderConfirmationMails"
        type: "java.lang.Boolean"
        required: true
      - key: "EmailFormat"
        type: "java.lang.String"
        required: true
      - key: "CurrentOrganization"
        type: "com.intershop.component.organization.capi.Organization"
        required: true
  - id: "StartNode2"
    name: "UpdateProfile"
    mode: "private"
    strict: true
    inputs:
      - key: "FirstName"
        type: "java.lang.String"
        required: true
      - key: "LastName"
        type: "java.lang.String"
        required: true
      - key: "BirthdayDate"
        type: "java.util.Date"
        required: false
      - key: "LocaleID"
        type: "java.lang.String"
        required: true
      - key: "User"
        type: "com.intershop.beehive.core.capi.user.User"
        required: true
      - key: "Gender"
        type: "java.lang.String"
        required: false
      - key: "Title"
        type: "java.lang.String"
        required: false
  - id: "StartNode3"
    name: "CheckLoginAvailable"
    mode: "private"
    strict: true
    inputs:
