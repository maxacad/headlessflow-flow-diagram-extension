        type: "java.lang.String"
        required: true
      - key: "Domain"
        type: "com.intershop.beehive.core.capi.domain.Domain"
        required: true
  - id: "StartNode4"
    name: "SendMail"
    mode: "private"
    strict: true
    inputs:
      - key: "MailTemplate"
        type: "java.lang.String"
        required: true
      - key: "MailFrom"
        type: "java.lang.String"
        required: true
      - key: "MailSubject"
        type: "java.lang.String"
        required: true
      - key: "User"
        type: "com.intershop.beehive.core.capi.user.User"
        required: true
      - key: "CurrentOrganization"
        type: "com.intershop.component.organization.capi.Organization"
        required: true
  - id: "StartNode5"
    name: "SendMailUpdateEmail"
    mode: "private"
    strict: true
    inputs:
