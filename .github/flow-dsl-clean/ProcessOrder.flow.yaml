flow: "ProcessOrder"
kind: "process"

entries:
  - id: "Start1"
    name: "CreateOrderCopyForBuyer"
    mode: "private"
    strict: false
    inputs:
      []
  - id: "Start2"
    name: "CreateOrders"
    mode: "private"
    strict: false
    inputs:
      []
  - id: "Start3"
    name: "InitSupplierOrders"
    mode: "private"
    strict: false
    inputs:
      []
  - id: "Start4"
    name: "CreateConsolidateOrders"
    mode: "private"
    strict: false
    inputs:
      []
  - id: "StartNode1"
    name: "CleanUpAVs"
    mode: "private"
    strict: false
    inputs:
      []

steps:
  - id: "AssignOrderDocumentNos1"
    type: "pipelet"
    ref: "AssignOrderDocumentNos"
    config:
      DomainSpecific: true
      NumberPattern: 00000000
      SeriesIdentifier: "PurchaseOrder"
    bindings:
      Orders: "ChildOrders"
  - id: "AssignOrderDocumentNos2"
    type: "pipelet"
    ref: "AssignOrderDocumentNos"
    config:
      DomainSpecific: true
      NumberPattern: 00000000
      SeriesIdentifier: "SupplierOrder"
    bindings:
      Orders: "SupplierOrders"
  - id: "Call1"
    type: "call"
    ref: "RequisitionProcessCalculation-Start"
  - id: "Call2"
    type: "call"
    ref: "RequisitionProcessCalculation-Start"
  - id: "Call3"
    type: "call"
    ref: "ProcessOrder-CreateOrderCopyForBuyer"
  - id: "Call4"
    type: "call"
    ref: "QueryRequisition-Search"
  - id: "Call5"
    type: "call"
    ref: "ProcessOrderCustomized-CreateOrders"
  - id: "CallNode1"
    type: "call"
    ref: "ProcessOrderCustomized-CreateConsolidateOrders"
  - id: "CallNode2"
    type: "call"
    ref: "ProcessOrder-CleanUpAVs"
  - id: "CreateOrderRef1"
    type: "pipelet"
    ref: "CreateOrderRef"
    bindings:
      Order: "SupplierOrder"
      OrderRefID: "SupplierOrderRefID"
  - id: "CreateOrderRef2"
    type: "pipelet"
    ref: "CreateOrderRef"
    bindings:
      Order: "PurchaseOrder"
      OrderRefID: "PurchaseOrderRefID"
  - id: "CreateOrdersFromOrder1"
    type: "pipelet"
    ref: "CreateOrdersFromOrder"
    config:
      OrderType: "SellerOrder"
      SelectionMode: "IgnoreSelected"
      SplitMode: "NoSplit"
    bindings:
      Order: "SupplierOrder"
      OrderDomain: "RequisitionDomain"
  - id: "Decision1"
    type: "decision"
    condition: "SupplierOrders"
  - id: "DecisionNode1"
    type: "decision"
    condition: "PLI:CostCenterUUID"
  - id: "DetermineUnit1"
    type: "pipelet"
    ref: "DetermineUnit"
    bindings:
      Unit: "RequisitionDomain"
  - id: "End1"
    type: "end"
    strict: false
  - id: "End2"
    type: "end"
    strict: false
  - id: "End4"
    type: "end"
    strict: false
  - id: "End5"
    type: "end"
    strict: false
  - id: "EndNode1"
    type: "end"
    strict: false
  - id: "Join3"
    type: "join"
  - id: "JoinNode1"
    type: "join"
  - id: "Jump1"
    type: "jump"
    ref: "ProcessOrder-InitSupplierOrders"
  - id: "Jump2"
    type: "jump"
    ref: "ProcessOrder-InitSupplierOrders"
  - id: "KeyMapper1"
    type: "pipelet"
    ref: "KeyMapper"
    bindings:
      InValue_1: "Requisition:Domain"
      OutValue_1: "RequisitionDomain"
  - id: "Loop1"
    type: "loop"
  - id: "Loop3"
    type: "loop"
  - id: "Loop4"
    type: "loop"
  - id: "LoopNode1"
    type: "loop"
  - id: "RemoveCustomAttribute1"
    type: "pipelet"
    ref: "RemoveCustomAttribute"
    bindings:
      ExtensibleObject: "PLI"
      AttributeName: "PLI:CostCenterUUID"
  - id: "SelectLineItemsByStatus1"
    type: "pipelet"
    ref: "SelectLineItemsByStatus"
    config:
      LineItemStatus: 3
  - id: "SelectLineItemsByStatus2"
    type: "pipelet"
    ref: "SelectLineItemsByStatus"
    config:
      LineItemStatus: 3
  - id: "SetupCalculationTarget1"
    type: "pipelet"
    ref: "SetupCalculationTarget"
    config:
      Name: "ChildOrders"
      Type: "Iterator"
  - id: "SetupCalculationTarget2"
    type: "pipelet"
    ref: "SetupCalculationTarget"
    config:
      Name: "SupplierOrders"
      Type: "Iterator"
  - id: "UpdateCustomAttributes1"
    type: "pipelet"
    ref: "UpdateCustomAttributes"
    config:
      Attribute_1_Name: "SellerOrderUUID"
      Attribute_1_Type: "String"
      Attribute_2_Name: "SellerOrderDocumentNo"
      Attribute_2_Type: "String"
      Attribute_3_Name: "PurchaseOrderRefID"
      Attribute_3_Type: "String"
    bindings:
      Attribute_1_Value: "PurchaseOrder:UUID"
      Attribute_2_Value: "PurchaseOrder:DocumentNo"
      Attribute_3_Value: "PurchaseOrderRefID"
      ExtensibleObject: "SupplierOrder"
  - id: "UpdateCustomAttributes2"
    type: "pipelet"
    ref: "UpdateCustomAttributes"
    config:
      Attribute_1_Name: "SupplierOrderUUID"
      Attribute_1_Type: "String"
      Attribute_2_Name: "SupplierOrderDocumentNo"
      Attribute_2_Type: "String"
      Attribute_3_Name: "SupplierOrderRefID"
      Attribute_3_Type: "String"
    bindings:
      Attribute_1_Value: "SupplierOrder:UUID"
      Attribute_2_Value: "SupplierOrder:DocumentNo"
      Attribute_3_Value: "SupplierOrderRefID"
      ExtensibleObject: "PurchaseOrder"
  - id: "UpdateCustomAttributes3"
    type: "pipelet"
    ref: "UpdateCustomAttributes"
    config:
      Attribute_1_Name: "SourceOrganisationName"
      Attribute_1_Type: "String"
    bindings:
      Attribute_1_Value: "RequisitionDomain:DomainName"
      ExtensibleObject: "SupplierOrder"
  - id: "UpdateCustomAttributes4"
    type: "pipelet"
    ref: "UpdateCustomAttributes"
    config:
      Attribute_1_Name: "SourceOrganisationName"
      Attribute_1_Type: "String"
    bindings:
      Attribute_1_Value: "RequisitionDomain:DomainName"
      ExtensibleObject: "PurchaseOrder"
  - id: "UpdateLineItemStatus1"
    type: "pipelet"
    ref: "UpdateLineItemStatus"
    config:
      StatusGroup: "Order"
      StatusID: 10
      StatusType: "Status"
    bindings:
      LineItemID: "NotAvailable"
      LineItemIDs: "NotAvailable"
      Order: "PurchaseOrder"
      Requisition: "NotAvailable"
  - id: "UpdateLineItemStatus2"
    type: "pipelet"
    ref: "UpdateLineItemStatus"
    config:
      StatusGroup: "Order"
      StatusID: 10
      StatusType: "Status2"
    bindings:
      LineItemID: "NotAvailable"
      LineItemIDs: "NotAvailable"
      Order: "SupplierOrder"
      Requisition: "NotAvailable"
  - id: "UpdateLineItemStatus3"
    type: "pipelet"
    ref: "UpdateLineItemStatus"
    config:
      StatusGroup: "Requisition"
      StatusID: 5
    bindings:
      InputStatusGroup: "NotAvailable"
      InputStatusID: "NotAvailable"
      LineItemID: "NotAvailable"
      LineItemIDs: "NotAvailable"
      Order: "SupplierOrder"
      Requisition: "NotAvailable"
  - id: "UpdateLineItemStatus4"
    type: "pipelet"
    ref: "UpdateLineItemStatus"
    config:
      StatusGroup: "Order"
      StatusID: 10
      StatusType: "Status"
    bindings:
      LineItemID: "NotAvailable"
      LineItemIDs: "NotAvailable"
      Order: "SupplierOrder"
      Requisition: "NotAvailable"
  - id: "UpdateLineItemStatus5"
    type: "pipelet"
    ref: "UpdateLineItemStatus"
    config:
      StatusGroup: "Order"
      StatusID: 10
      StatusType: "Status2"
    bindings:
      LineItemID: "NotAvailable"
      LineItemIDs: "NotAvailable"
      Order: "PurchaseOrder"
      Requisition: "NotAvailable"

links:
  - from: "Start1"
    via: "next"
    to: "CreateOrdersFromOrder1"
    into: "in"
  - from: "CallNode2"
    via: "next"
    to: "Call3"
    into: "in"
  - from: "StartNode1"
    via: "next"
    to: "LoopNode1"
    into: "in"
  - from: "Decision1"
    via: "yes"
    to: "Jump2"
    into: "in"
  - from: "Decision1"
    via: "no"
    to: "End5"
    into: "in"
  - from: "CreateOrdersFromOrder1"
    via: "next"
    to: "Loop1"
    into: "in"
  - from: "Start4"
    via: "next"
    to: "DetermineUnit1"
    into: "in"
  - from: "DetermineUnit1"
    via: "next"
    to: "Call4"
    into: "in"
  - from: "Call4"
    via: "next"
    to: "Loop3"
    into: "in"
  - from: "SetupCalculationTarget2"
    via: "next"
    to: "Call2"
    into: "in"
  - from: "Loop1"
    via: "next"
    to: "AssignOrderDocumentNos1"
    into: "in"
  - from: "AssignOrderDocumentNos1"
    via: "next"
    to: "CreateOrderRef2"
    into: "in"
  - from: "UpdateCustomAttributes1"
    via: "next"
    to: "SetupCalculationTarget1"
    into: "in"
  - from: "Loop1"
    via: "do"
    to: "CreateOrderRef1"
    into: "in"
  - from: "KeyMapper1"
    via: "next"
    to: "Jump1"
    into: "in"
  - from: "AssignOrderDocumentNos2"
    via: "next"
    to: "SetupCalculationTarget2"
    into: "in"
  - from: "Call2"
    via: "next"
    to: "Loop4"
    into: "in"
  - from: "Loop4"
    via: "next"
    to: "End1"
    into: "in"
  - from: "Loop4"
    via: "do"
    to: "UpdateLineItemStatus2"
    into: "in"
  - from: "UpdateLineItemStatus3"
    via: "next"
    to: "Loop4"
    into: "loop"
  - from: "SetupCalculationTarget1"
    via: "next"
    to: "Call1"
    into: "in"
  - from: "UpdateLineItemStatus2"
    via: "next"
    to: "UpdateLineItemStatus4"
    into: "in"
  - from: "LoopNode1"
    via: "do"
    to: "DecisionNode1"
    into: "in"
  - from: "UpdateLineItemStatus1"
    via: "next"
    to: "UpdateLineItemStatus5"
    into: "in"
  - from: "UpdateLineItemStatus5"
    via: "next"
    to: "Loop1"
    into: "loop"
  - from: "SelectLineItemsByStatus1"
    via: "error"
    to: "Join3"
    into: "in1"
  - from: "CreateOrderRef1"
    via: "next"
    to: "UpdateCustomAttributes2"
    into: "in"
  - from: "CreateOrderRef2"
    via: "next"
    to: "UpdateCustomAttributes1"
    into: "in"
  - from: "Loop3"
    via: "next"
    to: "CallNode1"
    into: "in"
  - from: "Join3"
    via: "next"
    to: "End4"
    into: "in"
  - from: "CallNode1"
    via: "next"
    to: "Decision1"
    into: "in"
  - from: "Call1"
    via: "next"
    to: "End2"
    into: "in"
  - from: "Start2"
    via: "next"
    to: "SelectLineItemsByStatus1"
    into: "in"
  - from: "Start3"
    via: "next"
    to: "AssignOrderDocumentNos2"
    into: "in"
  - from: "SelectLineItemsByStatus1"
    via: "next"
    to: "Call5"
    into: "in"
  - from: "Call5"
    via: "ERROR"
    to: "Join3"
    into: "in2"
  - from: "Call5"
    via: "next"
    to: "KeyMapper1"
    into: "in"
  - from: "Call3"
    via: "next"
    to: "UpdateCustomAttributes3"
    into: "in"
  - from: "UpdateCustomAttributes3"
    via: "next"
    to: "UpdateLineItemStatus3"
    into: "in"
  - from: "UpdateCustomAttributes2"
    via: "next"
    to: "UpdateCustomAttributes4"
    into: "in"
  - from: "UpdateCustomAttributes4"
    via: "next"
    to: "UpdateLineItemStatus1"
    into: "in"
  - from: "UpdateLineItemStatus4"
    via: "next"
    to: "CallNode2"
    into: "in"
  - from: "DecisionNode1"
    via: "yes"
    to: "RemoveCustomAttribute1"
    into: "in"
  - from: "DecisionNode1"
    via: "no"
    to: "JoinNode1"
    into: "in1"
  - from: "RemoveCustomAttribute1"
    via: "next"
    to: "JoinNode1"
    into: "in1"
  - from: "JoinNode1"
    via: "next"
    to: "LoopNode1"
    into: "loop"
  - from: "LoopNode1"
    via: "next"
    to: "EndNode1"
    into: "in"
  - from: "Loop3"
    via: "do"
    to: "SelectLineItemsByStatus2"
    into: "in"
  - from: "SelectLineItemsByStatus2"
    via: "next"
    to: "Loop3"
    into: "loop"
