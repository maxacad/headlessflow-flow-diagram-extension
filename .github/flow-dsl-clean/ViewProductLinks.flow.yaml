flow: "ViewProductLinks"
kind: "view"

entries:
  - id: "Start1"
    name: "Display"
    mode: "public"
    strict: false
    inputs:
      []
  - id: "Start3"
    name: "Start"
    mode: "public"
    strict: false
    inputs:
      []
  - id: "StartNode3"
    name: "CheckLock"
    mode: "private"
    strict: false
    inputs:
      []

steps:
  - id: "CallNode1"
    type: "call"
    ref: "ViewProductCategoryLinks-ProcessDisplayPreparer"
  - id: "CallNode15"
    type: "call"
    ref: "ViewProductProductLinks-ProcessStartPreparer"
  - id: "CallNode16"
    type: "call"
    ref: "ViewProductCategoryLinks-ProcessStartPreparer"
  - id: "CallNode2"
    type: "call"
    ref: "ViewProductProductLinks-ProcessDisplayPreparer"
  - id: "CallNode7"
    type: "call"
    ref: "ProcessProductLock-Check"
    bindings:
      LockingDomain: "ProductDomain"
      PreferenceDomain: "ProductDomain"
      User: "CurrentUser"
  - id: "EndNode4"
    type: "end"
    strict: false
  - id: "InteractionEnd1"
    type: "interaction"
  - id: "JoinNode1"
    type: "join"
  - id: "JumpNode1"
    type: "jump"
    ref: "ViewProductLinks-Start"
  - id: "PrepareApplicationView1"
    type: "pipelet"
    ref: "PrepareApplicationView"
    config:
      WorkingTemplate: "product/ProductLinkList"

links:
  - from: "CallNode7"
    via: "next"
    to: "EndNode4"
    into: "in"
  - from: "CallNode7"
    via: "NO_LOCK"
    to: "JumpNode1"
    into: "in"
  - from: "CallNode16"
    via: "next"
    to: "JoinNode1"
    into: "in1"
  - from: "StartNode3"
    via: "next"
    to: "CallNode7"
    into: "in"
  - from: "CallNode1"
    via: "next"
    to: "JoinNode1"
    into: "in3"
  - from: "PrepareApplicationView1"
    via: "next"
    to: "InteractionEnd1"
    into: "in"
  - from: "Start3"
    via: "next"
    to: "CallNode15"
    into: "in"
  - from: "CallNode15"
    via: "next"
    to: "CallNode16"
    into: "in"
  - from: "JoinNode1"
    via: "next"
    to: "PrepareApplicationView1"
    into: "in"
  - from: "CallNode2"
    via: "next"
    to: "CallNode1"
    into: "in"
  - from: "Start1"
    via: "next"
    to: "CallNode2"
    into: "in"
