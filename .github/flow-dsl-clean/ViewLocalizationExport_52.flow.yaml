      OutValue_1: "PageableID"
  - id: "KeyMapper3"
    type: "pipelet"
    ref: "KeyMapper"
    bindings:
      InValue_1: "CurrentChannel:Domain:Site"
      InValue_2: "CurrentChannel:Domain:Site"
      OutValue_1: "ProcessOwningDomain"
      OutValue_2: "ProcessExecutionDomain"
  - id: "KeyMapper4"
    type: "pipelet"
    ref: "KeyMapper"
    config:
      ValueType: "Form Value"
    bindings:
      InValue_1: "CurrentChannel:Domain:Site:UUID"
      OutValue_1: "LocalizationDomainUUID"
      OutValue_2: "SelectedFile"
      InValue_2: "LocalizationExportForm_ExportFileName"
      InValue_3: "\"localization\""
      OutValue_3: "ExportDirectory"
      InValue_4: "LocalizationContextSerial"
      OutValue_4: "LocalizationContextSerial"
  - id: "LoopNode2"
    type: "loop"
  - id: "Pipelet1"
    type: "pipelet"
    ref: "PrepareApplicationView"
    config:
      WorkingTemplate: "localization/LocalizationExportSelectApplication_52"
      SelectedMenuItem: "Localization"
  - id: "Pipelet2"
    type: "pipelet"
    ref: "SerializeToString"
    bindings:
      SerializeObject: "LocalizationContext"
      SerializedValue: "LocalizationContextSerial"
  - id: "Pipelet3"
    type: "pipelet"
    ref: "KeyMapper"
    bindings:
      OutValue_1: "ExportFileFormat"
      InValue_1: "\"xliff\""
  - id: "Pipelet4"
    type: "pipelet"
    ref: "KeyMapper"
    bindings:
      InValue_1: "\"properties\""
      OutValue_1: "ExportFileFormat"
  - id: "PrepareApplicationView1"
    type: "pipelet"
    ref: "PrepareApplicationView"
    config:
      SelectedMenuItem: "Localization"
      WorkingTemplate: "localization/LocalizationExportConfiguration_52"
  - id: "PrepareApplicationView2"
    type: "pipelet"
    ref: "PrepareApplicationView"
    config:
      SelectedMenuItem: "Localization"
      WorkingTemplate: "localization/LocalizationExportSearchLocale_52"
  - id: "UpdateWebForm1"
    type: "pipelet"
    ref: "UpdateWebForm"
    config:
      mode: "update"
      webform-id: "LocalizationExportForm"
    bindings:
      WebForm: "LocalizationExportForm"
  - id: "ValidateWebForm1"
    type: "pipelet"
    ref: "ValidateWebForm"
    bindings:
      WebForm: "LocalizationExportForm"

