flow: "ViewLocalizationExport_52"
kind: "view"

entries:
  - id: "Start2"
    name: "Dispatch"
    mode: "private"
    strict: false
    inputs:
      []
  - id: "StartNode1"
    name: "SearchLocale"
    mode: "private"
    strict: false
    inputs:
      []
  - id: "StartNode2"
    name: "SelectConfiguration"
    mode: "private"
    strict: false
    inputs:
      []
  - id: "StartNode3"
    name: "Export"
    mode: "private"
    strict: false
    inputs:
      []
  - id: "StartNode4"
    name: "ExportToXliff"
    mode: "private"
    strict: false
    inputs:
      []
  - id: "StartNode5"
    name: "SelectApplication"
    mode: "private"
    strict: false
    inputs:
      []
  - id: "StartNode6"
    name: "ExportToProperties"
    mode: "private"
    strict: false
    inputs:
      []

steps:
  - id: "AddEntryToMap1"
    type: "pipelet"
    ref: "AddEntryToMap"
    bindings:
      InMap: "LocalesMap"
      Key: "ModifiedLocaleHolder"
      Value: "LocaleID"
      OutMap: "LocalesMap"
  - id: "Call1"
    type: "call"
    ref: "ProcessClipboard-Get"
  - id: "CallNode1"
    type: "call"
    ref: "ProcessClipboard-Get"
  - id: "CallNode2"
    type: "call"
    ref: "ProcessClipboard-Update"
  - id: "CallNode4"
    type: "call"
    ref: "ProcessApplication-GetApplications"
  - id: "CallNode5"
    type: "call"
    ref: "ProcessLocalizations-GetContextApplication"
  - id: "CallNode8"
    type: "call"
    ref: "ProcessImpexJob-Create"
  - id: "CreateLocalizationContextFromApplication1"
    type: "pipelet"
    ref: "CreateLocalizationContextFromApplication"
    bindings:
      Application: "ContextApplication"
  - id: "CreateModifiedLocale1"
    type: "pipelet"
    ref: "CreateModifiedLocale"
    bindings:
      TargetLocaleID: "LocaleID"
      ModifiedTargetID: "FormRecord:ModifiedLocaleID"
  - id: "CreatePageableFromIterator2"
    type: "pipelet"
    ref: "CreatePageableFromIterator"
    config:
      Pagesize: 1000000
    bindings:
      Iterator: "LocalesMap:KeySet:Iterator"
      Pageable: "LocalesToExport"
  - id: "CreateWebForm1"
    type: "pipelet"
    ref: "CreateWebForm"
    config:
      param.1.name: "ExportFileName"
      param.1.required: true
      param.1.rule: "^[^.\\\\/:*?<>|\\s]([^\\\\/:*?<>|\\s]*[^.\\\\/:*?<>|\\s])?$"
      webform-id: "LocalizationExportForm"
      param.2.name: "CharacterSet"
      param.2.rule: "^[^.\\\\/:*?<>|\\s]([^\\\\/:*?<>|\\s]*[^.\\\\/:*?<>|\\s])?$"
      param.2.required: true
      param.3.name: "ExportSourceLanguage"
      param.3.rule: "^[^.\\\\/:*?|\\s]([^\\\\/:*?|\\s]*[^.\\\\/:*?|\\s])?$"
      param.3.required: true
    bindings:
      WebForm: "LocalizationExportForm"
  - id: "DecisionNode1"
    type: "decision"
    condition: "UUIDIterator"
  - id: "DetermineLocales1"
    type: "pipelet"
    ref: "DetermineLocales"
  - id: "DispatchFormAction1"
    type: "pipelet"
    ref: "DispatchFormAction"
    config:
      OutValue_0: "ViewLocalizationExport_52-SelectConfiguration"
      OutValue_1: "ViewLocalizationExport_52-Export"
      OutValue_2: "ViewLocalizationExport_52-SelectApplication"
      OutValue_3: "ViewLocalizationImpex_52-Status"
      OutValue_4: "ViewLocalizationExport_52-SearchLocale"
    bindings:
      SelectionKey: "JumpTarget"
      Key_0: "SelectConfiguration"
      Key_1: "LocalizationExport"
      Key_2: "SelectApplication"
      Key_3: "Cancel"
      Key_4: "SearchLocale"
  - id: "GetFormRecord1"
    type: "pipelet"
    ref: "GetFormRecord"
    bindings:
      RecordID: "LocaleID"
  - id: "GetWebForm1"
    type: "pipelet"
    ref: "GetWebForm"
    config:
      webform-id: "LocalizationExportForm"
    bindings:
      WebForm: "LocalizationExportForm"
  - id: "InteractionNode1"
    type: "interaction"
  - id: "JoinNode1"
    type: "join"
  - id: "JoinNode2"
    type: "join"
  - id: "JoinNode3"
    type: "join"
  - id: "JoinNode4"
    type: "join"
  - id: "Jump4"
    type: "jump"
    ref: "SecureJump-Start"
  - id: "JumpNode1"
    type: "jump"
    ref: "ViewLocalizationImpex_52-Status"
  - id: "JumpNode2"
    type: "jump"
    ref: "This:SelectApplication"
  - id: "JumpNode3"
    type: "jump"
    ref: "Error-Start"
  - id: "JumpNode4"
    type: "jump"
    ref: "This:SelectApplication"
  - id: "KeyMapper10"
    type: "pipelet"
    ref: "KeyMapper"
    config:
      ValueType: "Form Value"
    bindings:
      OutValue_1: "JobDescription"
      InValue_1: "\"Export Localizations\""
      InValue_2: "\"ProcessLocalizationImpex\""
      OutValue_2: "JobPipelineName"
      InValue_3: "\"Export\""
      OutValue_3: "JobPipelineStartNode"
      InValue_4: "\"ProcessLocalizationImpex\""
      OutValue_4: "JobName"
      InValue_5: "\"ProcessLocalizationImpex\""
      OutValue_5: "ProcessPipelineName"
      OutValue_6: "ProcessPipelineStartNode"
      InValue_6: "\"Export\""
  - id: "KeyMapper2"
    type: "pipelet"
