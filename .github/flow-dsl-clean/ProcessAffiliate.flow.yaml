    type: "decision"
    condition: "AffiliateProgram:isExpired"
  - id: "DecisionNode7"
    type: "decision"
    condition: "Order:AffiliatePartnerAccountID"
  - id: "DecisionNode8"
    type: "decision"
    condition: "Order:AffiliateProgramAccountID"
