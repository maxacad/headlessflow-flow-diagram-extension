      Attribute_1_Type: "String"
      Attribute_2_Type: "String"
      Attribute_2_Name: "AffiliatePartnerTransactionID"
      Attribute_3_Name: "AffiliateProgramAccountID"
      Attribute_3_Type: "String"
    bindings:
      Attribute_1_Value: "AffiliatePartnerAccount:UUID"
      Attribute_2_Value: "AccountTransaction:UUID"
      ExtensibleObject: "Order"
      Attribute_3_Value: "AffiliateProgramAccount:UUID"

