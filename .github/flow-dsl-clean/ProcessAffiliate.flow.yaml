flow: "ProcessAffiliate"
kind: "process"

entries:
  - id: "StartNode1"
    name: "GetProgramByRequest"
    mode: "private"
    strict: false
    inputs:
      []
  - id: "StartNode2"
    name: "GetProgramBySession"
    mode: "private"
    strict: false
    inputs:
      []
  - id: "StartNode3"
    name: "BookLead"
    mode: "private"
    strict: false
    inputs:
      []
  - id: "StartNode4"
    name: "RemoveRevenue"
    mode: "private"
    strict: true
    inputs:
      - key: "Order"
        type: "com.intershop.beehive.bts.capi.orderprocess.fulfillment.Order"
        required: false
  - id: "StartNode6"
    name: "BookRevenue"
    mode: "private"
    strict: false
    inputs:
      - key: "ApplicationBO"
        type: "com.intershop.component.application.capi.ApplicationBO"
        required: true

