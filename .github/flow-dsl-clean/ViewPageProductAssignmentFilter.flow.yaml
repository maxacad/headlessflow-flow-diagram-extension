    mode: "private"
    strict: false
    inputs:
      []
  - id: "Start7"
    name: "Search"
    mode: "private"
    strict: false
    inputs:
      []
  - id: "StartNode1"
    name: "Dispatch"
    mode: "private"
    strict: false
    inputs:
      []
  - id: "StartNode10"
    name: "GetCurrentRepository"
    mode: "private"
    strict: true
    inputs:
      - key: "CurrentChannel"
        type: "com.intershop.component.mvc.capi.catalog.Repository"
        required: false
  - id: "StartNode11"
    name: "Prefix"
    mode: "private"
    strict: false
    inputs:
      []
  - id: "StartNode2"
    name: "Create"
    mode: "private"
    strict: false
    inputs:
      []
  - id: "StartNode3"
    name: "Edit"
    mode: "private"
    strict: false
    inputs:
      []
  - id: "StartNode4"
    name: "Remove"
    mode: "private"
    strict: false
    inputs:
      []
  - id: "StartNode5"
    name: "Submit"
    mode: "private"
    strict: false
    inputs:
      []
  - id: "StartNode6"
    name: "Cancel"
    mode: "private"
    strict: false
