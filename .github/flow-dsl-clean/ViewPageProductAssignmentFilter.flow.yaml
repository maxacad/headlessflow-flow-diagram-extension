  - id: "CreateAssignmentFilter1"
    type: "pipelet"
    ref: "CreateAssignmentFilter"
  - id: "CreateProductIdentifierLookupHelper1"
    type: "pipelet"
    ref: "CreateProductIdentifierLookupHelper"
    config:
      LookupType: "ProductDomainLookup"
    bindings:
      ProductDomain: "CurrentMasterRepository:RepositoryDomain"
  - id: "Decision1"
    type: "decision"
    condition: "PageLocator"
  - id: "Decision2"
    type: "decision"
    condition: "PageNumber"
  - id: "DecisionNode1"
    type: "decision"
    condition: "AssignmentFilterConfiguration:Filter"
  - id: "DecisionNode4"
    type: "decision"
    condition: "CurrentChannel"
  - id: "DeleteAssignmentFilter1"
    type: "pipelet"
    ref: "DeleteAssignmentFilter"
    bindings:
      AssignmentFilterConfiguration: "SelectedAssignmentFilterConf"
  - id: "DispatchFormAction1"
    type: "pipelet"
    ref: "DispatchFormAction"
    config:
      OutValue_0: "This:Search"
      OutValue_1: "This:ParametricSearch"
      OutValue_2: "This:Paging"
      OutValue_3: "This:Submit"
      OutValue_4: "This:Cancel"
    bindings:
      Key_0: "findSimple"
      Key_1: "findParametric"
      Key_2: "paging"
      Key_3: "submitFilter"
      Key_4: "cancelFilter"
      SelectionKey: "JumpTarget"
  - id: "DispatchFormActionByBreadcrumb1"
    type: "pipelet"
    ref: "DispatchFormActionByBreadcrumb"
    config:
      SplitMode: "PipelineAndParameter"
    bindings:
      SelectionKey: "JumpTarget"
      OutValue_0: "ApplicationState:LastListView"
      Key_0: "\"Submit\""
  - id: "DispatchFormActionByBreadcrumb2"
    type: "pipelet"
    ref: "DispatchFormActionByBreadcrumb"
    config:
      SplitMode: "PipelineAndParameter"
    bindings:
      SelectionKey: "JumpTarget"
      OutValue_0: "ApplicationState:LastBreadcrumb"
      Key_0: "\"Remove\""
  - id: "EndNode4"
    type: "end"
    strict: false
  - id: "EndNode7"
    type: "end"
    strict: true
    outputs:
      - key: "Repository"
        type: "com.intershop.component.mvc.capi.catalog.Repository"
        guaranteed: true
      - key: "RepositoryUUID"
        type: "com.intershop.component.mvc.capi.catalog.Repository"
        guaranteed: true
  - id: "GetPageLocator1"
    type: "pipelet"
    ref: "GetPageLocator"
    config:
      DefaultPageLocatorName: "ProductList"
      RestorePageLocatorDictionary: "True"
  - id: "GetPageable1"
    type: "pipelet"
    ref: "GetPageable"
    bindings:
      Pageable: "Products"
      PageableID: "PageLocator:PageableID"
  - id: "InteractionNode1"
    type: "interaction"
  - id: "Join1"
    type: "join"
  - id: "Join2"
    type: "join"
  - id: "Join5"
    type: "join"
  - id: "JoinNode1"
    type: "join"
