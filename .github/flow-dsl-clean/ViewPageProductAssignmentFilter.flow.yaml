      OutValue_1: "Repository"
  - id: "KeyMapper3"
    type: "pipelet"
    ref: "KeyMapper"
    bindings:
      InValue_1: "Repository:UUID"
      OutValue_1: "RepositoryUUID"
  - id: "PrepareApplicationView1"
    type: "pipelet"
    ref: "PrepareApplicationView"
    config:
      WorkingTemplate: "content/assignment/filter/ProductFilter"
      SelectedMenuItem: "MasterComponents"
  - id: "SetDictionaryValue1"
    type: "pipelet"
    ref: "SetDictionaryValue"
    config:
      Name: "SearchType"
      Value: "parametric"
  - id: "SetPage1"
    type: "pipelet"
    ref: "SetPage"
    bindings:
      PageNumber: "PageLocator:PageNumber"
      Pageable: "Products"
  - id: "SetPage2"
    type: "pipelet"
    ref: "SetPage"
    bindings:
      Pageable: "Products"
  - id: "SetPageLocator1"
    type: "pipelet"
    ref: "SetPageLocator"
    config:
      DefaultHandlerPipeline: "ViewPageProductAssignmentFilter-Paging"
      DefaultPageLocatorName: "ProductList"
    bindings:
      Pageable: "Products"
      PageLocatorName: "null"
  - id: "UpdateAssignmentFilter1"
    type: "pipelet"
    ref: "UpdateAssignmentFilter"
    bindings:
      ParametersMap: "AdvancedSearchParameters"
  - id: "VerifyInteger1"
    type: "pipelet"
    ref: "VerifyInteger"
    bindings:
      IntegerObject: "PageNumber"
      LocalizedString: "PageNumber"

