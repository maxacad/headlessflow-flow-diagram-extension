    type: "call"
    ref: "ProcessAssignmentFilter-ClearFilterConfigFromSession"
  - id: "CallNode5"
    type: "call"
    ref: "ValidateWebForms-WFAdvancedSearch"
  - id: "CallNode6"
    type: "call"
    ref: "ValidateWebForms-WFSimpleSearch"
