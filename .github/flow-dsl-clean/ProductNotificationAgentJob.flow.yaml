flow: "ProductNotificationAgentJob"
kind: "process"

entries:
  - id: "Start1"
    name: "Start"
    mode: "private"
    strict: false
    inputs:
      []

steps:
  - id: "Call10"
    type: "call"
    ref: "GetRepositories-ChannelsReverse"
  - id: "CreateStack1"
    type: "pipelet"
    ref: "CreateStack"
    bindings:
      Stack: "ChannelStack"
  - id: "CreateStack2"
    type: "pipelet"
    ref: "CreateStack"
    bindings:
      Stack: "OrganizationStack"
  - id: "EndNode1"
    type: "end"
    strict: true
  - id: "EndNode2"
    type: "end"
    strict: false
  - id: "EndNode4"
    type: "end"
    strict: false
  - id: "EndNode5"
    type: "end"
    strict: true
  - id: "ExecutePipeline1"
    type: "pipelet"
    ref: "ExecutePipeline"
    config:
      PipelineName: "ProcessProductNotification"
      PipelineStartNode: "SendNotifications"
  - id: "GetApplication1"
    type: "pipelet"
    ref: "GetApplication"
    bindings:
      UrlIdentifier: "ChannelRepository:Id"
      Site: "ChannelRepository:OwningDomain:Site"
  - id: "GetCurrentDate3"
    type: "pipelet"
    ref: "GetCurrentDate"
    bindings:
      CurrentDate: "JobStartTime"
  - id: "GetOrganizationByName1"
    type: "pipelet"
    ref: "GetOrganizationByName"
    config:
      DefaultName: "Operations"
    bindings:
      Name: "null"
      Organization: "Operations"
      OrganizationDomain: "OperationsDomain"
  - id: "GetOrganizations1"
    type: "pipelet"
    ref: "GetOrganizations"
    bindings:
      Organizations: "Enterprises"
      Owner: "OperationsDomain"
  - id: "Join1"
    type: "join"
  - id: "JoinNode1"
    type: "join"
  - id: "Loop1"
    type: "loop"
  - id: "ManipulateStack1"
    type: "pipelet"
    ref: "ManipulateStack"
    config:
      ProcessMethod: "POP"
    bindings:
      GetElement: "ChannelRepository"
      Stack: "ChannelStack"
  - id: "ManipulateStack4"
    type: "pipelet"
    ref: "ManipulateStack"
    config:
      ProcessMethod: "PUSH"
    bindings:
      AddElement: "Enterprise"
      Stack: "OrganizationStack"

links:
  - from: "ManipulateStack1"
    via: "error"
    to: "EndNode2"
    into: "in"
  - from: "GetApplication1"
    via: "next"
    to: "ExecutePipeline1"
    into: "in"
  - from: "ExecutePipeline1"
    via: "next"
    to: "JoinNode1"
    into: "in1"
  - from: "JoinNode1"
    via: "next"
    to: "Join1"
    into: "in2"
  - from: "ExecutePipeline1"
    via: "error"
    to: "EndNode1"
    into: "in"
  - from: "Start1"
    via: "next"
    to: "GetCurrentDate3"
    into: "in"
  - from: "GetCurrentDate3"
    via: "next"
    to: "GetOrganizationByName1"
    into: "in"
  - from: "Call10"
    via: "next"
    to: "Join1"
    into: "in1"
  - from: "Join1"
    via: "next"
    to: "ManipulateStack1"
    into: "in"
  - from: "GetOrganizationByName1"
    via: "next"
    to: "GetOrganizations1"
    into: "in"
  - from: "ManipulateStack4"
    via: "next"
    to: "Loop1"
    into: "loop"
  - from: "Loop1"
    via: "next"
    to: "Call10"
    into: "in"
  - from: "GetApplication1"
    via: "error"
    to: "JoinNode1"
    into: "in2"
  - from: "ManipulateStack1"
    via: "next"
    to: "GetApplication1"
    into: "in"
  - from: "GetOrganizations1"
    via: "next"
    to: "CreateStack2"
    into: "in"
  - from: "ManipulateStack4"
    via: "error"
    to: "EndNode4"
    into: "in"
  - from: "GetOrganizationByName1"
    via: "error"
    to: "EndNode5"
    into: "in"
  - from: "CreateStack2"
    via: "next"
    to: "CreateStack1"
    into: "in"
  - from: "CreateStack1"
    via: "next"
    to: "Loop1"
    into: "in"
  - from: "Loop1"
    via: "do"
    to: "ManipulateStack4"
    into: "in"
