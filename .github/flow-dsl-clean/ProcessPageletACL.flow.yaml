flow: "ProcessPageletACL"
kind: "process"

entries:
  - id: "StartNode1"
    name: "CheckPageletEntryPointIsPublic"
    mode: "private"
    strict: true
    inputs:
      - key: "PageletEntryPoint"
        type: "com.intershop.component.pmc.capi.pagelet.PageletEntryPoint"
        required: false
      - key: "PageletEntryPointID"
        type: "java.lang.String"
        required: false
      - key: "PageletEntryPointUUID"
        type: "java.lang.String"
        required: false
  - id: "StartNode2"
    name: "CheckViewContextIsPublic"
    mode: "private"
    strict: true
    inputs:
      - key: "ViewContext"
        type: "com.intershop.component.pmc.capi.viewcontext.ViewContext"
        required: true

steps:
  - id: "CheckPageletEntryPointIsPublic1"
    type: "pipelet"
    ref: "CheckPageletEntryPointIsPublic"
  - id: "CheckViewContextIsPublic1"
    type: "pipelet"
    ref: "CheckViewContextIsPublic"
  - id: "DecisionNode1"
    type: "decision"
    condition: "PageletEntryPoint"
  - id: "DecisionNode2"
    type: "decision"
    condition: "PageletEntryPointID"
  - id: "DecisionNode3"
    type: "decision"
    condition: "PageletEntryPointUUID"
  - id: "End1"
    type: "end"
    strict: true
  - id: "End4"
    type: "end"
    strict: true
  - id: "EndNode1"
    type: "end"
    strict: true
  - id: "EndNode4"
    type: "end"
    strict: true
  - id: "GetPageletEntryPointByID1"
    type: "pipelet"
    ref: "GetPageletEntryPointByID"
    bindings:
      Domain: "Repository:RepositoryDomain"
      ID: "PageletEntryPointID"
  - id: "GetPageletEntryPointByUUID1"
    type: "pipelet"
    ref: "GetPageletEntryPointByUUID"
  - id: "GetValuesFromRequest3"
    type: "pipelet"
    ref: "GetValuesFromRequest"
    config:
      Namespace: "ApplicationRepository"
    bindings:
      Namespace: "null"
      Key: "null"
  - id: "JoinNode1"
    type: "join"
  - id: "JoinNode2"
    type: "join"
  - id: "JoinNode3"
    type: "join"
  - id: "JoinNode4"
    type: "join"
  - id: "JoinNode5"
    type: "join"
  - id: "JoinNode6"
    type: "join"

links:
  - from: "DecisionNode3"
    via: "yes"
    to: "GetPageletEntryPointByUUID1"
    into: "in"
  - from: "GetPageletEntryPointByID1"
    via: "next"
    to: "JoinNode2"
    into: "in1"
  - from: "DecisionNode1"
    via: "no"
    to: "DecisionNode2"
    into: "in"
  - from: "DecisionNode1"
    via: "yes"
    to: "JoinNode1"
    into: "in1"
  - from: "JoinNode6"
    via: "next"
    to: "JoinNode4"
    into: "in2"
  - from: "JoinNode4"
    via: "next"
    to: "JoinNode5"
    into: "in1"
  - from: "GetPageletEntryPointByUUID1"
    via: "error"
    to: "JoinNode4"
    into: "in1"
  - from: "CheckViewContextIsPublic1"
    via: "next"
    to: "EndNode4"
    into: "in"
  - from: "GetValuesFromRequest3"
    via: "error"
    to: "JoinNode6"
    into: "in2"
  - from: "CheckPageletEntryPointIsPublic1"
    via: "error"
    to: "JoinNode3"
    into: "in1"
  - from: "CheckViewContextIsPublic1"
    via: "error"
    to: "End1"
    into: "in"
  - from: "StartNode1"
    via: "next"
    to: "DecisionNode1"
    into: "in"
  - from: "GetPageletEntryPointByUUID1"
    via: "next"
    to: "JoinNode2"
    into: "in3"
  - from: "JoinNode5"
    via: "next"
    to: "JoinNode3"
    into: "in1"
  - from: "DecisionNode2"
    via: "no"
    to: "DecisionNode3"
    into: "in"
  - from: "JoinNode1"
    via: "next"
    to: "CheckPageletEntryPointIsPublic1"
    into: "in"
  - from: "CheckPageletEntryPointIsPublic1"
    via: "next"
    to: "EndNode1"
    into: "in"
  - from: "GetPageletEntryPointByID1"
    via: "error"
    to: "JoinNode5"
    into: "in2"
  - from: "JoinNode3"
    via: "next"
    to: "End4"
    into: "in"
  - from: "StartNode2"
    via: "next"
    to: "CheckViewContextIsPublic1"
    into: "in"
  - from: "DecisionNode3"
    via: "no"
    to: "JoinNode6"
    into: "in1"
  - from: "GetValuesFromRequest3"
    via: "next"
    to: "GetPageletEntryPointByID1"
    into: "in"
  - from: "DecisionNode2"
    via: "yes"
    to: "GetValuesFromRequest3"
    into: "in"
  - from: "JoinNode2"
    via: "next"
    to: "JoinNode1"
    into: "in3"
