      ErrorValidFromIncorrect: "ErrorPublishedFromSinceIncorrect"
      ErrorValidToIncorrect: "ErrorPublishedFromTillIncorrect"
      ErrorPeriodIncorrect: "ErrorPublishedFromPeriodIncorrect"
      ValidFrom: "PublishedFromSinceDate"
      ValidTo: "PublishedFromTillDate"
