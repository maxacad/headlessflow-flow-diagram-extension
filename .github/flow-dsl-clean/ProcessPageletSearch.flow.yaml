    ref: "ProcessDate-VerifyDatePeriod"
    bindings:
      ValidFrom_Day: "SearchParameters:EmptySlotsFromDate"
      ValidTo_Day: "SearchParameters:EmptySlotsToDate"
      ErrorValidFromIncorrect: "ErrorEmptySlotsFromIncorrect"
      ErrorValidToIncorrect: "ErrorEmptySlotsToIncorrect"
