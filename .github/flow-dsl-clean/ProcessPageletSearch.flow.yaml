      Value: "ErrorToDateIncorrect"
      InMap: "ErrorsMap"
      OutMap: "ErrorsMap"
  - id: "AddObjectToVector1"
    type: "pipelet"
    ref: "AddObjectToVector"
    bindings:
      InVector: "null"
      Objects: "null"
      Object: "PageletDefinition"
      Iterator: "SearchPageletTypes"
  - id: "AddObjectToVector2"
    type: "pipelet"
    ref: "AddObjectToVector"
    bindings:
      Object: "null"
      Objects: "PageletDefinitions"
      InVector: "null"
      Iterator: "SearchPageletTypes"
  - id: "AddObjectToVector3"
    type: "pipelet"
    ref: "AddObjectToVector"
    bindings:
      Objects: "ExcludedPageletUUIDs"
