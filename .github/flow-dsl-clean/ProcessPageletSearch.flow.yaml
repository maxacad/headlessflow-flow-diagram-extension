        type: "java.lang.String"
        required: false
      - key: "SearchSortDirection"
        type: "java.lang.String"
        required: false
      - key: "CurrentSearchParameters"
        type: "java.util.Map"
        required: true
      - key: "CompFilterSearchParameters"
        type: "java.util.Map"
        required: false
      - key: "PageFilterSearchParameters"
        type: "java.util.Map"
        required: false
      - key: "CompPageFilterSearchParameters"
        type: "java.util.Map"
        required: false
