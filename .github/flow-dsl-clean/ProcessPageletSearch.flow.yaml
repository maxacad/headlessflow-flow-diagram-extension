  - id: "CallNode30"
    type: "call"
    ref: "ProcessPageletSearch-ValidateAdvancedSearchParameters"
    bindings:
      SearchParameters: "PageFilterSearchParameters"
  - id: "CallNode31"
    type: "call"
    ref: "ProcessPageletSearch-ValidateAdvancedSearchParameters"
    bindings:
      SearchParameters: "CompPageFilterSearchParameters"
  - id: "CallNode32"
    type: "call"
    ref: "ProcessPageletSearch-GetExcludedPageletsKey"
  - id: "CallNode33"
    type: "call"
    ref: "ProcessPageletSearch-GetExcludedPageletsKey"
  - id: "CallNode34"
    type: "call"
