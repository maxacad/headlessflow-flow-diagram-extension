  - id: "CallNode47"
    type: "call"
    ref: "ProcessPageletSearch-AddDateErrorsToErrorMap"
    bindings:
      ErrorToDateIncorrect: "ErrorPublishedToTillIncorrect"
      ErrorPeriodIncorrectKey: "\"ErrorPublishedToPeriodIncorrect\""
