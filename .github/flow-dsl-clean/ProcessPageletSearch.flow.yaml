        type: "java.lang.String"
        required: false
      - key: "PageletDefinitions"
        type: "java.util.Iterator"
        required: true
      - key: "CurrentContainerName"
        type: "java.lang.String"
        required: true
      - key: "ExcludedPageletUUIDs"
