    type: "pipelet"
    ref: "AddEntryToMap"
    bindings:
      InMap: "CompPageFilterSearchParameters"
      Key: "\"PageletTypes\""
      Value: "SearchPageletTypes"
      OutMap: "CompPageFilterSearchParameters"
  - id: "AddEntryToMap7"
    type: "pipelet"
    ref: "AddEntryToMap"
    bindings:
      InMap: "ShareOrganizationsMap"
      Key: "Organization"
      Value: "MasterRepository"
      OutMap: "ShareOrganizationsMap"
  - id: "AddEntryToMap8"
    type: "pipelet"
    ref: "AddEntryToMap"
    bindings:
