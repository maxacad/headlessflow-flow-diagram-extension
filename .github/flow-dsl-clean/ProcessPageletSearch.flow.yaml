        required: false
      - key: "ErrorToDateIncorrect"
        type: "java.lang.String"
        required: false
      - key: "ErrorsMap"
        type: "java.util.Map"
        required: false
      - key: "ErrorPeriodIncorrectKey"
        type: "java.lang.String"
        required: true
      - key: "ErrorFromDateIncorrectKey"
        type: "java.lang.String"
        required: true
      - key: "ErrorToDateIncorrectKey"
        type: "java.lang.String"
        required: true
  - id: "StartNode29"
