    type: "pipelet"
    ref: "AddEntryToMap"
    bindings:
      InMap: "CurrentSearchParameters"
      Key: "\"PageletTypes\""
      Value: "SearchPageletTypes"
      OutMap: "CurrentSearchParameters"
  - id: "AddEntryToMap10"
    type: "pipelet"
    ref: "AddEntryToMap"
    bindings:
      Key: "ErrorPeriodIncorrectKey"
      Value: "ErrorPeriodIncorrect"
      InMap: "ErrorsMap"
      OutMap: "ErrorsMap"
  - id: "AddEntryToMap11"
    type: "pipelet"
    ref: "AddEntryToMap"
    bindings:
      Key: "\"ErrorNameExpression\""
      Value: "NameError"
      OutMap: "ErrorsMap"
  - id: "AddEntryToMap12"
    type: "pipelet"
    ref: "AddEntryToMap"
    bindings:
      Key: "\"ErrorConfigParamValueExpression\""
      InMap: "ErrorsMap"
      Value: "ConfigParamValueError"
      OutMap: "ErrorsMap"
  - id: "AddEntryToMap13"
    type: "pipelet"
    ref: "AddEntryToMap"
    bindings:
      Key: "\"ErrorNameOrContentExpression\""
      Value: "NameOrContentError"
      OutMap: "PageletSearchErrorsMap"
  - id: "AddEntryToMap2"
    type: "pipelet"
    ref: "AddEntryToMap"
    bindings:
