flow: "ViewChannelOutboundSynchronization"
kind: "view"

entries:
  - id: "Start1"
    name: "Start"
    mode: "private"
    strict: false
    inputs:
      []
  - id: "Start2"
    name: "Paging"
    mode: "private"
    strict: false
    inputs:
      []
  - id: "Start3"
    name: "Back"
    mode: "private"
    strict: false
    inputs:
      []
  - id: "Start5"
    name: "Dispatch"
    mode: "private"
    strict: false
    inputs:
      []
  - id: "StartNode1"
    name: "Download"
    mode: "private"
    strict: false
    inputs:
      []
  - id: "StartNode2"
    name: "Update"
    mode: "private"
    strict: false
    inputs:
      []
  - id: "StartNode3"
    name: "Synchronize"
    mode: "private"
    strict: false
    inputs:
      []

steps:
  - id: "Call1"
    type: "call"
    ref: "ProcessClipboard-Update"
  - id: "Call2"
    type: "call"
    ref: "ProcessClipboard-Update"
  - id: "Call3"
    type: "call"
    ref: "ProcessClipboard-Delete"
  - id: "Call4"
    type: "call"
    ref: "ProcessClipboard-Update"
  - id: "CreatePageableFromIterator1"
    type: "pipelet"
    ref: "CreatePageableFromIterator"
    config:
      PageableName: "Syndications"
      Pagesize: 10
    bindings:
      Iterator: "Syndications"
      Pageable: "Syndications"
  - id: "Decision1"
    type: "decision"
    condition: "PageLocator"
  - id: "Decision2"
    type: "decision"
    condition: "PageNumber"
  - id: "DecisionNode1"
    type: "decision"
    condition: "FormRecord:Interval"
  - id: "DispatchFormAction1"
    type: "pipelet"
    ref: "DispatchFormAction"
    config:
      OutValue_0: "ViewChannelOutboundSynchronization-Start"
      OutValue_1: "ViewChannelOutboundSynchronization-Paging"
      PagingPipeline: "ViewChannelOutboundSynchronization-Paging"
      OutValue_2: "ViewChannelOutboundSynchronization-Back"
      OutValue_3: "ViewChannelOutboundSynchronization-Update"
      OutValue_4: "ViewChannelOutboundSynchronization-Synchronize"
      OutValue_5: "ViewChannelOutboundSynchronization-Paging"
      OutValue_6: "ViewChannelOutboundSynchronization-Start"
    bindings:
      Key_0: "Start"
      Key_1: "Paging"
      SelectionKey: "JumpTarget"
      Key_2: "Back"
      Key_3: "Apply"
      Key_4: "Synchronize"
      Key_5: "ConfirmSynchronization"
      Key_6: "Cancel"
  - id: "ExecuteJob1"
    type: "pipelet"
    ref: "ExecuteJob"
    bindings:
      JobConfiguration: "Syndication:JobConfiguration"
  - id: "GetFormRecord1"
    type: "pipelet"
    ref: "GetFormRecord"
    bindings:
      RecordID: "SyndicationUUID"
  - id: "GetPageLocator1"
    type: "pipelet"
    ref: "GetPageLocator"
    config:
      DefaultPageLocatorName: "SynchronizationPageLocator"
      RestorePageLocatorDictionary: "True"
  - id: "GetPageLocator2"
    type: "pipelet"
    ref: "GetPageLocator"
    config:
      DefaultPageLocatorName: "SynchronizationPageLocator"
      RestorePageLocatorDictionary: "True"
  - id: "GetPageable1"
    type: "pipelet"
    ref: "GetPageable"
    bindings:
      Pageable: "Syndications"
      PageableID: "PageLocator:PageableID"
  - id: "GetSyndicationByUUID1"
    type: "pipelet"
    ref: "GetSyndicationByUUID"
  - id: "GetSyndicationByUUID2"
    type: "pipelet"
    ref: "GetSyndicationByUUID"
  - id: "GetSyndicationByUUID3"
    type: "pipelet"
    ref: "GetSyndicationByUUID"
  - id: "GetSyndications1"
    type: "pipelet"
    ref: "GetSyndications"
