    type: "jump"
    ref: "SecureJump-Start"
  - id: "JumpNode1"
    type: "jump"
    ref: "ViewChannelOutboundSynchronization-Paging"
  - id: "JumpNode2"
    type: "jump"
    ref: "ViewChannelOutboundSynchronization-Paging"
