  - id: "PrepareApplicationView2"
    type: "pipelet"
    ref: "PrepareApplicationView"
    config:
      RenderingType: "HTML"
      SelectedMenuItem: "ChannelCatalogs"
      WorkingTemplate: "syndication/ChannelOutboundSynchronization"
  - id: "RemoveDictionaryValue1"
    type: "pipelet"
    ref: "RemoveDictionaryValue"
    config:
      Key: "SelectedObjectUUID"
      RemoveFormValues: true
  - id: "RemoveDictionaryValue2"
    type: "pipelet"
    ref: "RemoveDictionaryValue"
    config:
      Key: "SelectedObjectUUID"
      RemoveFormValues: true
  - id: "RemoveJobTimeCondition1"
    type: "pipelet"
    ref: "RemoveJobTimeCondition"
    bindings:
      JobConfiguration: "Syndication:JobConfiguration"
  - id: "ResolveFilename1"
    type: "pipelet"
    ref: "ResolveFilename"
    config:
      UnitDirectory: "SYNDICATION_DIR"
    bindings:
      AbsoluteFileName: "FilePath"
      UnitDomain: "Syndication:Domain"
      FileName: "Syndication:FileName"
      DirectoryPath: "null"
      Locale: "null"
  - id: "SetPage1"
    type: "pipelet"
    ref: "SetPage"
    bindings:
      PageNumber: "PageLocator:PageNumber"
      Pageable: "Syndications"
  - id: "SetPage2"
    type: "pipelet"
    ref: "SetPage"
    bindings:
      Pageable: "Syndications"
  - id: "SetPageLocator1"
    type: "pipelet"
    ref: "SetPageLocator"
    config:
      DefaultHandlerPipeline: "ViewChannelOutboundSynchronization-Paging"
      DefaultPageLocatorName: "SynchronizationPageLocator"
    bindings:
      Pageable: "Syndications"
  - id: "UpdateJobConfiguration1"
    type: "pipelet"
    ref: "UpdateJobConfiguration"
    bindings:
      JobConfiguration: "Syndication:JobConfiguration"
      JobJavaDate: "Syndication:JobConfiguration:LastExecutionTime"
      JobInterval: "FormRecord:Interval"
      JobUnit: "\"HOURS\""
  - id: "VerifyInteger1"
    type: "pipelet"
    ref: "VerifyInteger"
    bindings:
      IntegerObject: "PageNumber"
      LocalizedString: "PageNumber"

