flow: "GetBuyingOrganizations"
kind: "process"

entries:
  - id: "StartNode1"
    name: "BySimpleSearch"
    mode: "private"
    strict: false
    inputs:
      []
  - id: "StartNode2"
    name: "ByParametricSearch"
    mode: "private"
    strict: false
    inputs:
      []

steps:
  - id: "AddObjectToVector1"
    type: "pipelet"
    ref: "AddObjectToVector"
    bindings:
      Iterator: "TypeCodes"
      Object: "\"1\""
  - id: "DecisionNode3"
    type: "decision"
    condition: "SortingAttribute"
  - id: "EndNode1"
    type: "end"
    strict: false
  - id: "EndNode2"
    type: "end"
    strict: false
  - id: "EndNode3"
    type: "end"
    strict: false
  - id: "EndNode4"
    type: "end"
    strict: false
  - id: "ExecutePageableQuery1"
    type: "pipelet"
    ref: "ExecutePageableQuery"
    config:
      Datasource: "default"
      DefaultPageSize: 15
      QueryName: "organization/GetOrganizationsByOwningDomain"
      ParameterName_01: "OwningDomain"
      ParameterName_02: "SimpleSearchTermExp"
      ParameterName_03: "TypeCodes"
      ParameterName_04: "SortBy"
    bindings:
      ParameterValue_02: "SimpleSearchTermExp"
      ParameterValue_01: "OwningDomain"
      SearchResult: "Organizations"
      ParameterValue_03: "TypeCodes"
      ParameterValue_04: "\"ID\""
  - id: "ExecutePageableQuery2"
    type: "pipelet"
    ref: "ExecutePageableQuery"
    config:
      Datasource: "default"
      DefaultPageSize: 10
      QueryName: "organization/GetBuyingOrganizationsByParametricSearch"
    bindings:
      SearchResult: "Organizations"
      Parameters: "OrganizationSearchParameters"
  - id: "JoinNode1"
    type: "join"
  - id: "JoinNode2"
    type: "join"
  - id: "JoinNode3"
    type: "join"
  - id: "JoinNode4"
    type: "join"
  - id: "JoinNode5"
    type: "join"
  - id: "JoinNode6"
    type: "join"
  - id: "JoinNode7"
    type: "join"
  - id: "SetDictionaryValue1"
    type: "pipelet"
    ref: "SetDictionaryValue"
    config:
      Name: "SortBy"
      Value: "displayName"
  - id: "SetDictionaryValue2"
    type: "pipelet"
    ref: "SetDictionaryValue"
    config:
      Name: "SortBy"
      Value: "ID"
  - id: "UpdateDictionary2"
    type: "pipelet"
    ref: "UpdateDictionary"
    config:
      Name_01: "OwningDomain"
      Name_02: "Locale"
      Name_03: "ID"
      Name_04: "Name"
      Name_05: "Description"
      Name_07: "SupplierOrganizationID"
      Name_08: "SupplierDisplayName"
      Name_06: "SortBy"
    bindings:
      OutDictionary: "OrganizationSearchParameters"
      InDictionary: "null"
      Value_01: "OwningDomain"
      Value_02: "CurrentRequest:Locale"
      Value_03: "OrganizationIDExp"
      Value_04: "OrganizationDisplayNameExp"
      Value_05: "OrganizationDescriptionExp"
      Value_07: "SupplierOrganizationIDExp"
      Value_08: "SupplierDisplayNameExp"
      Value_06: "SortBy"
  - id: "VerifySearchTerm1"
    type: "pipelet"
    ref: "VerifySearchTerm"
    config:
      AllowFuzzySearch: false
      DefaultOperator: "OR"
    bindings:
      UserSearchTerm: "BuyerDisplayName"
      SearchExpression: "OrganizationDisplayNameExp"
      ErrorCode: "OrganizationDisplayNameError"
  - id: "VerifySearchTerm2"
    type: "pipelet"
    ref: "VerifySearchTerm"
    config:
      AllowFuzzySearch: false
      DefaultOperator: "OR"
    bindings:
      UserSearchTerm: "BuyerOrganizationID"
      SearchExpression: "OrganizationIDExp"
      ErrorCode: "OrganizationIDError"
  - id: "VerifySearchTerm3"
    type: "pipelet"
    ref: "VerifySearchTerm"
    config:
      AllowFuzzySearch: true
    bindings:
      UserSearchTerm: "BuyerDescription"
      SearchExpression: "OrganizationDescriptionExp"
      ErrorCode: "OrganizationDescriptionError"
  - id: "VerifySearchTerm4"
    type: "pipelet"
    ref: "VerifySearchTerm"
    config:
      AllowFuzzySearch: false
      DefaultOperator: "OR"
    bindings:
      UserSearchTerm: "SupplierDisplayName"
      SearchExpression: "SupplierDisplayNameExp"
      ErrorCode: "SupplierDisplayNameError"
  - id: "VerifySearchTerm5"
    type: "pipelet"
    ref: "VerifySearchTerm"
    config:
      AllowFuzzySearch: false
      DefaultOperator: "OR"
    bindings:
      UserSearchTerm: "SupplierOrganizationID"
      SearchExpression: "SupplierOrganizationIDExp"
      ErrorCode: "SupplierOrganizationIDError"
  - id: "VerifySearchTerm6"
    type: "pipelet"
    ref: "VerifySearchTerm"
    config:
      AllowFuzzySearch: true
      DefaultOperator: "AND"
      AllowWildcards: "default"
      AllowSubOperator: "default"
    bindings:
      UserSearchTerm: "SearchTerm"
      SearchExpression: "SimpleSearchTermExp"
      ErrorCode: "SimpleSearchTermError"

links:
  - from: "StartNode2"
    via: "next"
    to: "VerifySearchTerm2"
    into: "in"
  - from: "VerifySearchTerm4"
    via: "error"
    to: "JoinNode4"
    into: "in1"
  - from: "VerifySearchTerm5"
    via: "next"
    to: "VerifySearchTerm4"
    into: "in"
  - from: "VerifySearchTerm2"
    via: "next"
    to: "VerifySearchTerm1"
    into: "in"
  - from: "VerifySearchTerm1"
    via: "next"
    to: "VerifySearchTerm3"
    into: "in"
  - from: "VerifySearchTerm3"
    via: "next"
    to: "VerifySearchTerm5"
    into: "in"
  - from: "JoinNode4"
    via: "next"
    to: "JoinNode2"
    into: "in2"
  - from: "DecisionNode3"
    via: "yes"
    to: "SetDictionaryValue1"
    into: "in"
  - from: "SetDictionaryValue1"
    via: "next"
    to: "JoinNode3"
    into: "in1"
  - from: "JoinNode3"
    via: "next"
    to: "UpdateDictionary2"
    into: "in"
  - from: "DecisionNode3"
    via: "no"
    to: "SetDictionaryValue2"
    into: "in"
  - from: "VerifySearchTerm5"
    via: "error"
    to: "JoinNode5"
    into: "in1"
  - from: "SetDictionaryValue2"
    via: "next"
    to: "JoinNode3"
    into: "in2"
  - from: "JoinNode5"
    via: "next"
    to: "JoinNode4"
    into: "in2"
  - from: "VerifySearchTerm3"
    via: "error"
    to: "JoinNode6"
    into: "in1"
  - from: "JoinNode6"
    via: "next"
    to: "JoinNode5"
    into: "in2"
  - from: "VerifySearchTerm1"
    via: "error"
    to: "JoinNode7"
    into: "in1"
  - from: "JoinNode7"
    via: "next"
    to: "JoinNode6"
    into: "in2"
  - from: "VerifySearchTerm4"
    via: "next"
    to: "DecisionNode3"
    into: "in"
  - from: "UpdateDictionary2"
    via: "next"
    to: "ExecutePageableQuery2"
    into: "in"
  - from: "VerifySearchTerm2"
    via: "error"
    to: "JoinNode7"
    into: "in2"
  - from: "VerifySearchTerm6"
    via: "error"
    to: "JoinNode1"
    into: "in2"
  - from: "ExecutePageableQuery1"
    via: "error"
    to: "JoinNode1"
    into: "in1"
  - from: "JoinNode1"
    via: "next"
    to: "EndNode4"
    into: "in"
  - from: "ExecutePageableQuery2"
    via: "error"
    to: "JoinNode2"
    into: "in1"
  - from: "JoinNode2"
    via: "next"
    to: "EndNode3"
    into: "in"
  - from: "StartNode1"
    via: "next"
    to: "AddObjectToVector1"
    into: "in"
  - from: "ExecutePageableQuery1"
    via: "next"
    to: "EndNode1"
    into: "in"
  - from: "VerifySearchTerm6"
    via: "next"
    to: "ExecutePageableQuery1"
    into: "in"
  - from: "AddObjectToVector1"
    via: "next"
    to: "VerifySearchTerm6"
    into: "in"
  - from: "ExecutePageableQuery2"
    via: "next"
    to: "EndNode2"
    into: "in"
