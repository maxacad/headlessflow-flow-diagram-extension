flow: "ViewContact"
kind: "view"

entries:
  - id: "StartNode1"
    name: "Start"
    mode: "private"
    strict: false
    inputs:
      []
  - id: "StartNode2"
    name: "Send"
    mode: "private"
    strict: false
    inputs:
      []
  - id: "StartNode3"
    name: "Dispatch"
    mode: "private"
    strict: false
    inputs:
      []
  - id: "StartNode5"
    name: "SendContactForm"
    mode: "private"
    strict: true
    inputs:
      - key: "Organization"
        type: "com.intershop.component.organization.capi.Organization"
        required: true
      - key: "MailSubject"
        type: "java.lang.String"
        required: false
      - key: "ContactUsForm"
        type: "com.intershop.beehive.core.capi.webform.Form"
        required: false

steps:
  - id: "CallNode1"
    type: "call"
    ref: "FireTrackingEvents-View"
    bindings:
      PageName: "\"contact\""
      PageType: "\"general\""
  - id: "CallNode4"
    type: "call"
    ref: "ViewContact-SendContactForm"
    bindings:
      Organization: "CurrentOrganization"
      MailSubject: "ContactUsForm:Subject:Value"
      ContactUsForm: "ContactUsForm"
  - id: "ConcatenateStrings0"
    type: "pipelet"
    ref: "ConcatenateStrings"
    bindings:
      String0: "ContactUsForm:Email:Value"
      String2: "ServiceMailTo"
      String1: "\";\""
      Concatenated: "MailTo"
  - id: "CreateForm1"
    type: "pipelet"
    ref: "CreateForm"
    config:
      FormName: "ContactUsForm"
      FormResource: "ContactUs"
    bindings:
      Form: "ContactUsForm"
  - id: "CreateForm2"
    type: "pipelet"
    ref: "CreateForm"
    config:
      FormName: "ContactUsForm"
      FormResource: "ContactUs"
    bindings:
      Form: "ContactUsForm"
  - id: "DispatchFormAction1"
    type: "pipelet"
    ref: "DispatchFormAction"
    config:
      OutValue_0: "ViewContact-Send"
    bindings:
      Key_0: "send"
      SelectionKey: "JumpTarget"
  - id: "EndNode4"
    type: "end"
    strict: true
  - id: "EndNode5"
    type: "end"
    strict: true
  - id: "GetDomainPreference1"
    type: "pipelet"
    ref: "GetDomainPreference"
    config:
      DefaultPreferenceKey: "ContactFormCustomerServiceEmailTemplate"
      Type: "String"
    bindings:
      PreferenceDomain: "ChannelRepository:Domain"
      PreferenceStringValue: "MailTemplate"
  - id: "GetDomainPreference2"
    type: "pipelet"
    ref: "GetDomainPreference"
    config:
      DefaultPreferenceKey: "ContactFormCustomerServiceEmailTo"
      Type: "String"
    bindings:
      PreferenceDomain: "ChannelRepository:Domain"
      PreferenceStringValue: "ServiceMailTo"
  - id: "GetRepositoryByRepositoryDomain1"
    type: "pipelet"
    ref: "GetRepositoryByRepositoryDomain"
    bindings:
      RepositoryDomain: "Organization:OwningDomain"
      Repository: "ChannelRepository"
  - id: "JoinNode1"
    type: "join"
  - id: "JoinNode2"
    type: "join"
  - id: "JoinNode3"
    type: "join"
  - id: "JoinNode4"
    type: "join"
  - id: "JoinNode6"
    type: "join"
  - id: "JumpNode1"
    type: "jump"
    ref: "SecureJump-Start"
  - id: "JumpNode4"
    type: "jump"
    ref: "ViewPage-Start"
  - id: "KeyMapper1"
    type: "pipelet"
    ref: "KeyMapper"
    bindings:
      InValue_1: "ContactUsForm:Email:Value"
      OutValue_1: "MailFrom"
  - id: "KeyMapper2"
    type: "pipelet"
    ref: "KeyMapper"
    bindings:
      InValue_1: "ContactUsForm:PageletEntryPointID:FormattedValue"
      OutValue_1: "PageletEntryPointID"
  - id: "KeyMapper3"
    type: "pipelet"
    ref: "KeyMapper"
    config:
      ValueType: "Dictionary Value"
    bindings:
      InValue_1: "\"systempage.helpdesk.contactUs.pagelet2-systempage.helpdesk.contactUs\""
      OutValue_1: "PageletEntryPointID"
  - id: "ProcessMail1"
    type: "pipelet"
    ref: "ProcessMail"
    config:
      UseErrorConnector: true
  - id: "SetDictionaryValue1"
    type: "pipelet"
    ref: "SetDictionaryValue"
    config:
      Name: "ERROR"
      Value: "SendContactForm"
      ValueType: "Dictionary Value"
  - id: "ValidateForm1"
    type: "pipelet"
    ref: "ValidateForm"
    bindings:
      Form: "ContactUsForm"

links:
  - from: "CreateForm2"
    via: "next"
    to: "ValidateForm1"
    into: "in"
  - from: "GetDomainPreference1"
    via: "error"
    to: "JoinNode2"
    into: "in1"
  - from: "JoinNode1"
    via: "next"
    to: "JoinNode2"
    into: "in1"
  - from: "StartNode1"
    via: "next"
    to: "CreateForm1"
    into: "in"
  - from: "KeyMapper3"
    via: "next"
    to: "KeyMapper2"
    into: "in"
  - from: "JoinNode3"
    via: "next"
    to: "JoinNode6"
    into: "in1"
  - from: "ValidateForm1"
    via: "error"
    to: "JoinNode3"
    into: "in1"
  - from: "StartNode5"
    via: "next"
    to: "GetRepositoryByRepositoryDomain1"
    into: "in"
  - from: "ProcessMail1"
    via: "next"
    to: "EndNode5"
    into: "in"
  - from: "ProcessMail1"
    via: "error"
    to: "JoinNode4"
    into: "in1"
  - from: "StartNode2"
    via: "next"
    to: "CreateForm2"
    into: "in"
  - from: "KeyMapper1"
    via: "next"
    to: "GetDomainPreference2"
    into: "in"
  - from: "CreateForm1"
    via: "next"
    to: "JoinNode3"
    into: "in1"
  - from: "CallNode4"
    via: "ERROR"
    to: "SetDictionaryValue1"
    into: "in"
  - from: "ValidateForm1"
    via: "next"
    to: "CallNode4"
    into: "in"
  - from: "SetDictionaryValue1"
    via: "next"
    to: "JoinNode6"
    into: "in1"
  - from: "CallNode4"
    via: "next"
    to: "JoinNode6"
    into: "in1"
  - from: "JoinNode6"
    via: "next"
    to: "CallNode1"
    into: "in"
  - from: "CallNode1"
    via: "next"
    to: "KeyMapper3"
    into: "in"
  - from: "KeyMapper2"
    via: "next"
    to: "JumpNode4"
    into: "in"
  - from: "GetDomainPreference1"
    via: "next"
    to: "ProcessMail1"
    into: "in"
  - from: "JoinNode4"
    via: "next"
    to: "EndNode4"
    into: "in"
  - from: "StartNode3"
    via: "next"
    to: "DispatchFormAction1"
    into: "in"
  - from: "DispatchFormAction1"
    via: "next"
    to: "JumpNode1"
    into: "in"
  - from: "GetRepositoryByRepositoryDomain1"
    via: "next"
    to: "KeyMapper1"
    into: "in"
  - from: "JoinNode2"
    via: "next"
    to: "JoinNode4"
    into: "in1"
  - from: "GetDomainPreference2"
    via: "error"
    to: "JoinNode1"
    into: "in1"
  - from: "GetRepositoryByRepositoryDomain1"
    via: "error"
    to: "JoinNode1"
    into: "in1"
  - from: "ConcatenateStrings0"
    via: "next"
    to: "GetDomainPreference1"
    into: "in"
  - from: "GetDomainPreference2"
    via: "next"
    to: "ConcatenateStrings0"
    into: "in"
