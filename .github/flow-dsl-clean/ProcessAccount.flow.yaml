flow: "ProcessAccount"
kind: "process"

entries:
  - id: "Start1"
    name: "ObtainUserAccount"
    mode: "private"
    strict: false
    inputs:
      []
  - id: "Start2"
    name: "ObtainDepartmentAccount"
    mode: "private"
    strict: false
    inputs:
      []
  - id: "Start3"
    name: "ObtainCostCenterAccount"
    mode: "private"
    strict: false
    inputs:
      []
  - id: "Start4"
    name: "BindTransaction"
    mode: "private"
    strict: false
    inputs:
      []
  - id: "Start6"
    name: "GetTransactionsByAccount"
    mode: "private"
    strict: false
    inputs:
      []

