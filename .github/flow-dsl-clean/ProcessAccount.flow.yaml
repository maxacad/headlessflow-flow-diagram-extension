    strict: false
  - id: "End7"
    type: "end"
    strict: false
  - id: "ExecutePageableQuery1"
    type: "pipelet"
    ref: "ExecutePageableQuery"
    config:
      QueryName: "account/GetAccountTransactionListByAccountID"
      DefaultPageSize: 15
      ParameterName_01: "AccountUUID"
    bindings:
      ParameterValue_01: "Account:UUID"
      SearchResult: "Transactions"
  - id: "GetAccountByOwner1"
    type: "pipelet"
    ref: "GetAccountByOwner"
    config:
      DefaultTypeCode: 1
    bindings:
      Owner: "Profile"
      TypeCode: "null"
  - id: "GetAccountByOwner2"
    type: "pipelet"
    ref: "GetAccountByOwner"
    config:
      DefaultTypeCode: 2
    bindings:
      Owner: "Department"
      TypeCode: "null"
