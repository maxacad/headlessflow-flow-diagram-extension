    type: "pipelet"
    ref: "GetAccountByOwner"
    config:
      DefaultTypeCode: 3
    bindings:
      Owner: "CostCenter"
      TypeCode: "null"
  - id: "GetCostCenter1"
    type: "pipelet"
    ref: "GetCostCenter"
  - id: "GetDepartment1"
    type: "pipelet"
    ref: "GetDepartment"
    config:
