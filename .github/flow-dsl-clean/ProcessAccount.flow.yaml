  - id: "Call3"
    type: "call"
    ref: "ProcessAccount-ObtainUserAccount"
  - id: "CheckForEmptyString1"
    type: "pipelet"
    ref: "CheckForEmptyString"
    bindings:
      FilledString: "DepartmentUUID"
  - id: "CheckForEmptyString2"
    type: "pipelet"
    ref: "CheckForEmptyString"
    bindings:
      FilledString: "CostCenterUUID"
  - id: "CreateAccount1"
    type: "pipelet"
    ref: "CreateAccount"
    config:
      DefaultTypeCode: 1
    bindings:
      Owner: "Profile"
  - id: "CreateAccount2"
    type: "pipelet"
    ref: "CreateAccount"
    config:
      DefaultTypeCode: 2
    bindings:
      Owner: "Department"
      TypeCode: "null"
  - id: "CreateAccount3"
    type: "pipelet"
    ref: "CreateAccount"
    config:
      DefaultTypeCode: 3
    bindings:
      Owner: "CostCenter"
  - id: "Decision1"
    type: "decision"
    condition: "User"
  - id: "DetermineUserProfile1"
    type: "pipelet"
    ref: "DetermineUserProfile"
    bindings:
      CurrentUser: "User"
  - id: "DetermineUserProfile2"
    type: "pipelet"
    ref: "DetermineUserProfile"
    bindings:
      CurrentUser: "User"
