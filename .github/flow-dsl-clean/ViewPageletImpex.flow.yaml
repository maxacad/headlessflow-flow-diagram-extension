flow: "ViewPageletImpex"
kind: "view"

entries:
  - id: "Start2"
    name: "Status"
    mode: "private"
    strict: false
    inputs:
      []
  - id: "Start3"
    name: "Monitor"
    mode: "private"
    strict: false
    inputs:
      []
  - id: "StartNode1"
    name: "Dispatch"
    mode: "private"
    strict: false
    inputs:
      []
  - id: "StartNode2"
    name: "DeleteImpexJobs"
    mode: "private"
    strict: false
    inputs:
      []
  - id: "StartNode3"
    name: "DownloadFile"
    mode: "private"
    strict: false
    inputs:
      []
  - id: "StartNode4"
    name: "ExportPagelets"
    mode: "private"
    strict: false
    inputs:
      []

steps:
  - id: "Call2"
    type: "call"
    ref: "ProcessClipboard-Update"
  - id: "Call4"
    type: "call"
    ref: "ProcessClipboard-Delete"
  - id: "Call5"
    type: "call"
    ref: "ProcessImpexJob-GetLogContent"
  - id: "CallNode1"
    type: "call"
    ref: "ProcessJobConfigurationSearch-Search"
  - id: "CallNode2"
    type: "call"
    ref: "ViewImpex-DeleteImpexJobs"
  - id: "Decision1"
    type: "decision"
    condition: "ConfirmDeleteImpexJobs"
  - id: "Decision2"
    type: "decision"
    condition: "JobConfiguration:Status"
  - id: "DecisionNode1"
    type: "decision"
    condition: "PageVariantTemplateExport"
  - id: "DecisionNode2"
    type: "decision"
    condition: "ComponentTemplateExport"
  - id: "DecisionNode4"
    type: "decision"
    condition: "PageExport"
  - id: "DecisionNode5"
    type: "decision"
    condition: "IncludeExport"
  - id: "DecisionNode6"
    type: "decision"
    condition: "PageVariantExport"
  - id: "DecisionNode7"
    type: "decision"
    condition: "ComponentExport"
  - id: "GetJobConfiguration2"
    type: "pipelet"
    ref: "GetJobConfiguration"
    bindings:
      JobUUID: "JobConfigurationUUID"
  - id: "InteractionEnd1"
    type: "interaction"
  - id: "InteractionEnd2"
    type: "interaction"
  - id: "Join1"
    type: "join"
  - id: "Join7"
    type: "join"
  - id: "JoinNode1"
    type: "join"
  - id: "JumpNode1"
    type: "jump"
    ref: "SecureJump-Start"
  - id: "JumpNode2"
    type: "jump"
    ref: "SecureJump-Start"
  - id: "JumpNode3"
    type: "jump"
    ref: "This:Status"
  - id: "JumpNode4"
    type: "jump"
    ref: "ViewImpex-DownloadFile"
  - id: "JumpNode5"
    type: "jump"
    ref: "ViewPageletExport-Start"
  - id: "KeyMapper1"
    type: "pipelet"
    ref: "KeyMapper"
    bindings:
      InValue_1: "OrganizationDomain"
      OutValue_1: "JobDomain"
  - id: "KeyMapper10"
    type: "pipelet"
    ref: "KeyMapper"
    config:
      ValueType: "Dictionary Value"
    bindings:
      InValue_1: "\"Component\""
      OutValue_1: "PageletType"
  - id: "KeyMapper11"
    type: "pipelet"
    ref: "KeyMapper"
    bindings:
      InValue_1: "\"PageVariant\""
      OutValue_1: "PageletType"
  - id: "KeyMapper2"
    type: "pipelet"
    ref: "KeyMapper"
    bindings:
      InValue_1: "Jobs"
      OutValue_1: "ImpexJobs"
  - id: "KeyMapper3"
    type: "pipelet"
    ref: "KeyMapper"
    bindings:
      OutValue_1: "DynamicTemplate"
      InValue_1: "\"impex/DownloadFile\""
  - id: "KeyMapper4"
    type: "pipelet"
    ref: "KeyMapper"
    bindings:
      InValue_1: "\"PageVariantTemplate\""
      OutValue_1: "PageletType"
  - id: "KeyMapper5"
    type: "pipelet"
    ref: "KeyMapper"
    bindings:
      InValue_1: "\"ComponentTemplate\""
      OutValue_1: "PageletType"
  - id: "KeyMapper6"
    type: "pipelet"
    ref: "KeyMapper"
    bindings:
      InValue_2: "CurrentMasterRepository:UUID"
      OutValue_2: "ContentRepositoryUUID"
      InValue_3: "CurrentOrganization:OrganizationDomain:UUID"
      OutValue_3: "ExportExecutionDomainUUID"
  - id: "KeyMapper7"
    type: "pipelet"
    ref: "KeyMapper"
    bindings:
      InValue_1: "\"Page\""
      OutValue_1: "PageletType"
  - id: "KeyMapper8"
    type: "pipelet"
    ref: "KeyMapper"
    bindings:
      InValue_1: "\"Include\""
      OutValue_1: "PageletType"
  - id: "Pipelet1"
    type: "pipelet"
    ref: "DispatchFormAction"
    config:
      OutValue_0: "ViewPageletImpex-Status"
      OutValue_1: "ViewPageletImpex-DeleteImpexJobs"
      OutValue_2: "ViewPageletImpex-Status"
      OutValue_3: "ViewPageletImpex-Monitor"
      OutValue_4: "ViewPageletImpex-DownloadFile"
      OutValue_7: "ViewPageletImpex-ExportPagelets"
      OutValue_8: "ViewPageletImpex-ExportPagelets"
      OutValue_6: "ViewPageletImpex-ExportPagelets"
      OutValue_5: "ViewPageletImpex-ExportPagelets"
    bindings:
      Key_0: "Status"
      Key_1: "DeleteImpexJobs"
      Key_2: "ConfirmDeleteImpexJobs"
      Key_3: "Monitor"
      Key_4: "DownloadFile"
      Key_5: "PageExport"
      Key_6: "IncludeExport"
      Key_7: "PageVariantExport"
      Key_8: "ComponentExport"
      SelectionKey: "JumpTarget"
  - id: "Pipelet2"
    type: "pipelet"
    ref: "DispatchFormAction"
    config:
      OutValue_0: "ViewPageletImportFiles-BrowseDirectory"
      OutValue_1: "ViewPageletExportFiles-BrowseDirectory"
      OutValue_2: "ViewPageletContentExport-Start"
      OutValue_3: "ViewPageletContentImport-SelectFile"
      OutValue_4: "ViewPageletImpex-ExportPagelets"
      OutValue_5: "ViewPageletImpex-ExportPagelets"
    bindings:
      SelectionKey: "JumpTarget"
      Key_0: "ImportFiles"
      Key_1: "ExportFiles"
      Key_2: "PageletContentExport"
      Key_3: "PageletContentImport"
      Key_4: "PageVariantTemplateExport"
      Key_5: "ComponentTemplateExport"
  - id: "PrepareApplicationView1"
    type: "pipelet"
    ref: "PrepareApplicationView"
    config:
      SelectedMenuItem: "PageletImpex"
      WorkingTemplate: "content/PageletImpexOverview.isml"
  - id: "PrepareApplicationView2"
    type: "pipelet"
    ref: "PrepareApplicationView"
    config:
      SelectedMenuItem: "PageletImpex"
      WorkingTemplate: "content/PageletImpexMonitor"
  - id: "SetDictionaryValue1"
    type: "pipelet"
    ref: "SetDictionaryValue"
    config:
      Name: "JobName"
      Value: "ProcessPageletImpex"

