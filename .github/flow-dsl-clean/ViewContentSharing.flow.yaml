  - from: "StartNode2"
    via: "next"
    to: "Pipelet1"
    into: "in"
  - from: "JoinNode6"
    via: "next"
    to: "JoinNode4"
    into: "in1"
  - from: "Pipelet11"
    via: "next"
    to: "Pipelet17"
    into: "in"
  - from: "DecisionNode2"
    via: "yes"
    to: "Pipelet11"
    into: "in"
  - from: "Pipelet18"
    via: "next"
    to: "JoinNode1"
    into: "in1"
  - from: "DecisionNode1"
    via: "yes"
    to: "Pipelet5"
    into: "in"
  - from: "UpdateDictionary1"
    via: "next"
    to: "ExecutePageableQuery1"
    into: "in"
  - from: "JoinNode3"
    via: "next"
    to: "CallNode2"
    into: "in"
  - from: "CallNode7"
    via: "next"
    to: "Pipelet3"
    into: "in"
  - from: "StartNode3"
    via: "next"
    to: "CallNode7"
    into: "in"
  - from: "JoinNode8"
    via: "next"
    to: "JoinNode4"
    into: "in3"
  - from: "ExecutePageableQuery1"
    via: "error"
    to: "JoinNode1"
    into: "in2"
  - from: "CallNode8"
    via: "next"
    to: "JoinNode2"
    into: "in1"
  - from: "CreateProxyRepository1"
    via: "next"
    to: "AddObjectToVector1"
    into: "in"
  - from: "StartNode4"
    via: "next"
    to: "CallNode1"
    into: "in"
  - from: "CallNode1"
    via: "next"
    to: "DecisionNode3"
    into: "in"
  - from: "DecisionNode3"
    via: "no"
    to: "JumpNode1"
    into: "in"
  - from: "GetRepositoryByUUID1"
    via: "next"
    to: "ConcatenateStrings1"
    into: "in"
  - from: "DecisionNode3"
    via: "yes"
    to: "CallNode3"
    into: "in"
  - from: "CallNode3"
    via: "next"
    to: "LoopNode1"
