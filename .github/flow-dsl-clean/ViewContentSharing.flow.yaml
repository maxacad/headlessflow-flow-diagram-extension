flow: "ViewContentSharing"
kind: "view"

entries:
  - id: "StartNode1"
    name: "New"
    mode: "private"
    strict: false
    inputs:
      []
  - id: "StartNode2"
    name: "Dispatch"
    mode: "private"
    strict: false
    inputs:
      []
  - id: "StartNode3"
    name: "Paging"
    mode: "private"
    strict: false
    inputs:
      []
  - id: "StartNode4"
    name: "Create"
    mode: "private"
    strict: false
    inputs:
      []

steps:
  - id: "AddObjectToVector1"
    type: "pipelet"
    ref: "AddObjectToVector"
    config:
      Mode: "Forbid Duplicates"
    bindings:
      Object: "Channel"
      Objects: "null"
      InVector: "Channels"
      OutVector: "Channels"
  - id: "CallNode1"
    type: "call"
    ref: "ProcessClipboard-Update"
  - id: "CallNode2"
    type: "call"
    ref: "ViewContentSharingList-GetMasterRepository"
    bindings:
      OrganizationUUID: "SelectedOrganizationUUID"
  - id: "CallNode3"
    type: "call"
    ref: "ViewContentSharingList-GetMasterRepository"
    bindings:
      OrganizationUUID: "SelectedOrganizationUUID"
      MasterRepository: "SharedMasterRepository"
      Organization: "SharingOrganization"
  - id: "CallNode7"
    type: "call"
    ref: "ProcessClipboard-Update"
  - id: "CallNode8"
    type: "call"
    ref: "ProcessClipboard-Delete"
  - id: "ConcatenateStrings1"
    type: "pipelet"
    ref: "ConcatenateStrings"
    config:
      DefaultString1: "-"
      DefaultString3: "-"
      DefaultString5: "-Proxy"
    bindings:
      Concatenated: "ProxyRepositoryID"
      String0: "Channel:Id"
      String2: "SharingOrganization:ID"
      String4: "MasterRepository:Id"
  - id: "CreateProxyRepository1"
    type: "pipelet"
    ref: "CreateProxyRepository"
    bindings:
      Repository: "SharedMasterRepository"
      RepositoryType: "SharedMasterRepository:TypeCode"
      Domain: "Channel:RepositoryDomain"
      RepositoryID: "ProxyRepositoryID"
  - id: "DecisionNode1"
    type: "decision"
    condition: "PageLocator"
  - id: "DecisionNode2"
    type: "decision"
    condition: "PageNumber"
  - id: "DecisionNode3"
    type: "decision"
    condition: "SelectedObjectUUIDs"
  - id: "ExecutePageableQuery1"
    type: "pipelet"
    ref: "ExecutePageableQuery"
    config:
      QueryName: "content/GetChannelsWithSharedContent"
      DefaultPageSize: 15
    bindings:
      Connection: "null"
      Parameters: "QueryParameter"
      Query: "null"
      ErrorCode: "SearchError"
      SearchResult: "ChannelsWithoutSharedContent"
  - id: "GetRepositoryByUUID1"
    type: "pipelet"
    ref: "GetRepositoryByUUID"
    bindings:
      UUID: "ChannelUUID"
      Repository: "Channel"
  - id: "InteractionEnd2"
    type: "interaction"
  - id: "JoinNode1"
    type: "join"
  - id: "JoinNode2"
    type: "join"
  - id: "JoinNode3"
    type: "join"
  - id: "JoinNode4"
    type: "join"
  - id: "JoinNode5"
    type: "join"
  - id: "JoinNode6"
    type: "join"
  - id: "JoinNode8"
    type: "join"
  - id: "JumpNode1"
    type: "jump"
    ref: "This:Paging"
  - id: "JumpNode2"
    type: "jump"
    ref: "SecureJump-Start"
  - id: "JumpNode3"
    type: "jump"
    ref: "ViewContentSharingList-Start"
  - id: "LoopNode1"
    type: "loop"
  - id: "Pipelet1"
    type: "pipelet"
    ref: "DispatchFormAction"
    config:
      PagingPipeline: "ViewContentSharing-Paging"
      OutValue_0: "ViewContentSharing-Paging"
      OutValue_1: "ViewContentSharing-Create"
      OutValue_2: "ViewContentSharingList-Start"
    bindings:
      SelectionKey: "JumpTarget"
      Key_0: "Paging"
      Key_1: "Create"
      Key_2: "Cancel"
  - id: "Pipelet11"
    type: "pipelet"
    ref: "VerifyInteger"
    bindings:
      IntegerObject: "PageNumber"
      LocalizedString: "PageNumber"
  - id: "Pipelet16"
    type: "pipelet"
    ref: "GetPageable"
    bindings:
      Pageable: "ChannelsWithoutSharedContent"
      PageableID: "PageLocator:PageableID"
  - id: "Pipelet17"
    type: "pipelet"
    ref: "SetPage"
    bindings:
      Pageable: "ChannelsWithoutSharedContent"
  - id: "Pipelet18"
    type: "pipelet"
    ref: "SetPageLocator"
    config:
      DefaultHandlerPipeline: "ViewContentSharing-Paging"
      DefaultPageLocatorName: "ContentSharingAssignmentPageLocator"
    bindings:
      Pageable: "ChannelsWithoutSharedContent"
  - id: "Pipelet3"
    type: "pipelet"
    ref: "GetPageLocator"
    config:
      DefaultPageLocatorName: "ContentSharingAssignmentPageLocator"
      RestorePageLocatorDictionary: "True"
  - id: "Pipelet5"
    type: "pipelet"
    ref: "SetPage"
    bindings:
      PageNumber: "PageLocator:PageNumber"
      Pageable: "ChannelsWithoutSharedContent"
  - id: "PrepareApplicationView1"
    type: "pipelet"
    ref: "PrepareApplicationView"
    config:
      RenderingType: "HTML"
      SelectedMenuItem: "ContentSharing"
      WorkingTemplate: "content/ContentSharing"
  - id: "UpdateContentSharingHelperCache1"
    type: "pipelet"
    ref: "UpdateContentSharingHelperCache"
    bindings:
      Repositories: "Channels"
  - id: "UpdateDictionary1"
    type: "pipelet"
    ref: "UpdateDictionary"
    config:
      Name_01: "MasterRepository"
      Name_02: "SortBy"
      Name_03: "SortDirection"
      Name_04: "Locale"
      Name_05: "OwningDomain"
      Name_06: "WithoutSharedContent"
    bindings:
      InDictionary: "null"
      OutDictionary: "QueryParameter"
      Value_01: "MasterRepository"
      Value_02: "SortBy"
      Value_03: "SortDirection"
      Value_04: "CurrentSession:Locale"
      Value_05: "CurrentOrganization:Domain"
      Value_06: "\"(Boolean)true\""

links:
  - from: "Pipelet1"
    via: "next"
    to: "JumpNode2"
    into: "in"
  - from: "Pipelet17"
    via: "next"
    to: "JoinNode6"
    into: "in1"
  - from: "Pipelet16"
    via: "next"
    to: "JoinNode5"
    into: "in2"
  - from: "StartNode1"
    via: "next"
    to: "CallNode8"
    into: "in"
  - from: "DecisionNode2"
    via: "no"
    to: "DecisionNode1"
    into: "in"
  - from: "JoinNode2"
    via: "next"
    to: "JoinNode3"
    into: "in1"
  - from: "Pipelet3"
    via: "error"
    to: "JoinNode2"
    into: "in2"
  - from: "JoinNode4"
    via: "next"
    to: "Pipelet18"
    into: "in"
  - from: "Pipelet16"
    via: "error"
    to: "JoinNode3"
    into: "in2"
  - from: "ExecutePageableQuery1"
    via: "next"
    to: "JoinNode5"
    into: "in1"
  - from: "PrepareApplicationView1"
    via: "next"
