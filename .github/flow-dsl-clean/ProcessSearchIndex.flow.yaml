flow: "ProcessSearchIndex"
kind: "process"

entries:
  - id: "StartNode0"
    name: "ValidateSynonymAndCheckForExistence"
    mode: "private"
    strict: true
    inputs:
      - key: "SynonymKeyword"
        type: "java.lang.String"
        required: true
      - key: "SynonymName"
        type: "java.lang.String"
        required: true
      - key: "SynonymDeductionFrom"
        type: "java.lang.String"
        required: true
      - key: "SynonymDeductionTo"
        type: "java.lang.String"
        required: true
      - key: "PreviousSynonymKeyword"
        type: "java.lang.String"
        required: true
      - key: "SearchIndexConfiguration"
        type: "com.intershop.component.search.capi.SearchIndexConfiguration"
        required: true
  - id: "StartNode1"
    name: "GetIndexes"
    mode: "private"
    strict: true
    inputs:
      - key: "Domain"
        type: "com.intershop.beehive.core.capi.domain.Domain"
        required: true
  - id: "StartNode10"
    name: "UpdateAllSearchIndexesOfDomain"
    mode: "private"
    strict: true
    inputs:
      - key: "Domain"
        type: "com.intershop.beehive.core.capi.domain.Domain"
        required: true
      - key: "SearchIndexProcessAction"
        type: "java.lang.String"
        required: false
  - id: "StartNode11"
    name: "MoveFilterEntry"
    mode: "private"
    strict: true
    inputs:
      - key: "SearchIndex"
        type: "com.intershop.component.search.capi.SearchIndex"
        required: true
      - key: "MoveDirection"
        type: "java.lang.String"
        required: true
      - key: "AttributeName"
        type: "java.lang.String"
        required: false
      - key: "SortingLevel"
        type: "java.lang.String"
        required: true
      - key: "EntryName"
        type: "java.lang.String"
        required: false
      - key: "EntryType"
        type: "java.lang.String"
        required: false
  - id: "StartNode12"
