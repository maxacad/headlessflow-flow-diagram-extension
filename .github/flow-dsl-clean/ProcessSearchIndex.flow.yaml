    inputs:
      - key: "Domain"
        type: "com.intershop.beehive.core.capi.domain.Domain"
        required: true
  - id: "StartNode8"
    name: "AddAttributes"
    mode: "private"
    strict: false
    inputs:
      - key: "SearchIndex"
        type: "com.intershop.component.search.capi.SearchIndex"
        required: false
      - key: "SelectedAttributeName"
        type: "java.lang.String"
        required: false
      - key: "RepositoryDomain"
        type: "com.intershop.beehive.core.capi.domain.Domain"
        required: true
  - id: "StartNode9"
    name: "PrepareStopWords"
    mode: "private"
    strict: true
    inputs:
      - key: "StopWordsIterator"
        type: "java.util.Iterator<E>"
        required: false

steps:
  - id: "AcquireFileResource1"
    type: "pipelet"
    ref: "AcquireFileResource"
    config:
      DefaultTargetDirectoryPath: "indexes"
    bindings:
      TargetUnitDomain: "SearchIndex:Domain"
      TargetUnitDirectory: "\"ACTIVE_SITE_BASE_DIR\""
      TargetFileName: "SearchIndex:IndexID"
      CurrentProcess: "IndexingProcess"
      Locale: "null"
      TargetFileNames: "null"
  - id: "AddEntryToMap0"
    type: "pipelet"
    ref: "AddEntryToMap"
    bindings:
      InMap: "SynonymErrors"
      Key: "\"SynonymAlreadyExists\""
      Value: "\"(Boolean)true\""
      Keys: "null"
      OutMap: "SynonymErrors"
  - id: "AddEntryToMap10"
    type: "pipelet"
    ref: "AddEntryToMap"
    bindings:
      Key: "\"InvalidDeductionTo\""
      Value: "\"(Boolean)true\""
      InMap: "SynonymErrors"
      OutMap: "SynonymErrors"
      Keys: "null"
  - id: "AddEntryToMap2"
    type: "pipelet"
    ref: "AddEntryToMap"
    bindings:
      Key: "SearchIndexAttribute:Name"
      Value: "SearchIndexAttribute"
      InMap: "ExistingAttributesMap"
      Keys: "ExistingAttributeNames"
      OutMap: "ExistingAttributesMap"
  - id: "AddEntryToMap6"
    type: "pipelet"
    ref: "AddEntryToMap"
    bindings:
      Key: "AttributeName"
      Value: "SynonymErrors"
      InMap: "SynonymsErrors"
      OutMap: "SynonymsErrors"
      Keys: "null"
  - id: "AddEntryToMap7"
    type: "pipelet"
    ref: "AddEntryToMap"
    bindings:
      Key: "\"KeywordIsMissing\""
      Value: "\"(Boolean)true\""
      InMap: "SynonymErrors"
      OutMap: "SynonymErrors"
      Keys: "null"
  - id: "AddEntryToMap8"
    type: "pipelet"
    ref: "AddEntryToMap"
    bindings:
      Key: "\"NameIsMissing\""
      Value: "\"(Boolean)true\""
      InMap: "SynonymErrors"
      OutMap: "SynonymErrors"
      Keys: "null"
  - id: "AddEntryToMap9"
    type: "pipelet"
    ref: "AddEntryToMap"
    bindings:
      Key: "\"InvalidDeductionFrom\""
      Value: "\"(Boolean)true\""
      InMap: "SynonymErrors"
      OutMap: "SynonymErrors"
      Keys: "null"
  - id: "AddObjectToVector1"
    type: "pipelet"
    ref: "AddObjectToVector"
    config:
      Mode: "Forbid Duplicates"
    bindings:
      InVector: "AttributesVector"
      Object: "SearchIndexAttribute"
      Iterator: "AttributesIterator"
      OutVector: "AttributesVector"
  - id: "AddObjectToVector10"
    type: "pipelet"
    ref: "AddObjectToVector"
    bindings:
      Object: "SearchIndex"
      Objects: "null"
      InVector: "null"
      OutVector: "SearchIndexes"
      Iterator: "null"
  - id: "AddObjectToVector11"
    type: "pipelet"
    ref: "AddObjectToVector"
    bindings:
      InVector: "AttributesVector"
      Objects: "SearchIndex:Configuration:createAttributesIterator"
      Object: "null"
      Iterator: "null"
      OutVector: "AttributesVector"
  - id: "AddObjectToVector12"
    type: "pipelet"
    ref: "AddObjectToVector"
    bindings:
      InVector: "Attributes"
      Object: "SearchIndex:Configuration:FilterGroupByName(AttributeName)"
      Iterator: "RemoveAttributes"
      OutVector: "Attributes"
  - id: "AddObjectToVector13"
    type: "pipelet"
    ref: "AddObjectToVector"
    bindings:
      Object: "null"
      Objects: "null"
      InVector: "SearchIndexesVector"
      Iterator: "SearchIndexes"
      OutVector: "SearchIndexesVector"
  - id: "AddObjectToVector14"
    type: "pipelet"
    ref: "AddObjectToVector"
    bindings:
      Object: "SearchIndex"
      Objects: "null"
      InVector: "SearchIndexesVector"
      Iterator: "SearchIndexes"
      OutVector: "SearchIndexesVector"
  - id: "AddObjectToVector15"
    type: "pipelet"
    ref: "AddObjectToVector"
    config:
      Mode: "Forbid Duplicates"
    bindings:
      Object: "NewSynonym"
      InVector: "SynonymsVector"
      Iterator: "Synonyms"
  - id: "AddObjectToVector16"
    type: "pipelet"
    ref: "AddObjectToVector"
    config:
      Mode: "Forbid Duplicates"
    bindings:
      Objects: "SearchIndex:Configuration:createSynonymsIterator"
      OutVector: "SynonymsVector"
  - id: "AddObjectToVector17"
    type: "pipelet"
    ref: "AddObjectToVector"
    bindings:
      InVector: "null"
      Objects: "null"
      Object: "null"
      Iterator: "DefaultBusinessAttributes"
      OutVector: "AttributesVector"
  - id: "AddObjectToVector18"
    type: "pipelet"
    ref: "AddObjectToVector"
    bindings:
      InVector: "AttributesVector"
      Objects: "null"
      Object: "SearchIndexAttribute"
      Iterator: "DefaultBusinessAttributes"
      OutVector: "AttributesVector"
  - id: "AddObjectToVector19"
    type: "pipelet"
    ref: "AddObjectToVector"
    bindings:
      Object: "Directory"
      InVector: "null"
      Objects: "null"
      Iterator: "Files"
  - id: "AddObjectToVector2"
    type: "pipelet"
    ref: "AddObjectToVector"
    bindings:
      Object: "SearchIndex:Configuration:AttributeByName(AttributeName)"
      Iterator: "RemoveAttributes"
  - id: "AddObjectToVector20"
    type: "pipelet"
    ref: "AddObjectToVector"
    config:
      Mode: "Forbid Duplicates"
    bindings:
      Objects: "SearchIndex:Configuration:createSynonymsIterator"
      OutVector: "SynonymsVector"
  - id: "AddObjectToVector21"
    type: "pipelet"
    ref: "AddObjectToVector"
    bindings:
      Object: "null"
      Objects: "null"
      InVector: "null"
      Iterator: "SearchIndexesIterator"
      OutVector: "SearchIndexesVector"
  - id: "AddObjectToVector22"
    type: "pipelet"
    ref: "AddObjectToVector"
    bindings:
      Object: "SearchIndex"
      Objects: "null"
      InVector: "SearchIndexesVector"
      Iterator: "SearchIndexesIterator"
      OutVector: "SearchIndexesVector"
  - id: "AddObjectToVector3"
    type: "pipelet"
    ref: "AddObjectToVector"
    bindings:
      InVector: "null"
      Objects: "null"
      Object: "null"
      Iterator: "StandardAttributes"
      OutVector: "AttributesVector"
  - id: "AddObjectToVector4"
    type: "pipelet"
    ref: "AddObjectToVector"
    bindings:
      InVector: "AttributesVector"
      Object: "NewAttribute"
      Iterator: "AttributesIterator"
      OutVector: "AttributesVector"
  - id: "AddObjectToVector5"
    type: "pipelet"
    ref: "AddObjectToVector"
    bindings:
      InVector: "AttributesVector"
      Objects: "null"
      Object: "SearchIndexAttribute"
      Iterator: "StandardAttributes"
      OutVector: "AttributesVector"
  - id: "AddObjectToVector6"
    type: "pipelet"
    ref: "AddObjectToVector"
    config:
      Mode: "Forbid Duplicates"
    bindings:
      Object: "UpdatedSynonym"
      InVector: "SynonymsVector"
      Objects: "null"
      Iterator: "Synonyms"
      OutVector: "SynonymsVector"
  - id: "AddObjectToVector7"
    type: "pipelet"
    ref: "AddObjectToVector"
    config:
      Mode: "Forbid Duplicates"
    bindings:
