    strict: true
    inputs:
      - key: "SearchIndexID"
        type: "java.lang.String"
        required: false
      - key: "Domain"
        type: "com.intershop.beehive.core.capi.domain.Domain"
        required: false
  - id: "StartNode36"
    name: "GetLogger"
    mode: "private"
    strict: false
    inputs:
      []
  - id: "StartNode37"
    name: "InitRebuildIndex"
    mode: "private"
    strict: false
    inputs:
      - key: "SearchIndexID"
        type: "java.lang.String"
        required: true
      - key: "UnitName"
        type: "java.lang.String"
        required: true
      - key: "ObjectsToRemove<java.util.Iterator>"
        type: "java.util.Iterator"
        required: false
      - key: "SearchIndexProcessAction"
        type: "java.lang.String"
        required: true
  - id: "StartNode38"
    name: "UpdateStopWords"
    mode: "private"
    strict: true
    inputs:
      - key: "StopWords_Text"
        type: "java.lang.String"
        required: false
      - key: "SearchIndex"
        type: "com.intershop.component.search.capi.SearchIndex"
        required: false
      - key: "QueryStopWords_Text"
        type: "java.lang.String"
        required: false
  - id: "StartNode39"
    name: "RebuildIndex"
    mode: "private"
    strict: true
    inputs:
      - key: "SearchIndexDomainName"
        type: "java.lang.String"
        required: false
      - key: "SearchIndexID"
        type: "java.lang.String"
        required: false
  - id: "StartNode4"
    name: "Update"
    mode: "private"
    strict: true
    inputs:
      - key: "SearchIndex"
        type: "com.intershop.component.search.capi.SearchIndex"
        required: false
      - key: "SearchIndexMain"
        type: "com.intershop.beehive.core.capi.request.WebForm"
        required: false
      - key: "Domain"
        type: "com.intershop.beehive.core.capi.domain.Domain"
        required: false
  - id: "StartNode40"
    name: "CompleteBuildIndex"
    mode: "private"
    strict: true
    inputs:
      - key: "SearchIndexProcessAction"
        type: "java.lang.String"
        required: true
      - key: "UnitName"
        type: "java.lang.String"
        required: true
      - key: "SearchIndexID"
        type: "java.lang.String"
        required: true
  - id: "StartNode41"
    name: "PostRebuildIndex"
    mode: "private"
    strict: true
    inputs:
      - key: "SearchIndex"
        type: "com.intershop.component.search.capi.SearchIndex"
        required: false
      - key: "LastIndexStartTime"
        type: "java.util.Date"
        required: false
      - key: "Domain"
        type: "com.intershop.beehive.core.capi.domain.Domain"
        required: false
      - key: "SearchIndexImportHandler"
        type: "com.intershop.component.search.capi.SearchIndexImportHandler"
        required: false
      - key: "JobConfiguration"
        type: "com.intershop.beehive.core.capi.job.JobConfiguration"
        required: false
      - key: "ProcessLogAppender"
        type: "com.intershop.beehive.core.capi.log.ProcessAppender"
        required: false
      - key: "IndexingProcess"
        type: "com.intershop.beehive.core.capi.locking.Process"
        required: true
  - id: "StartNode42"
    name: "ProcessRebuildIndex"
    mode: "private"
    strict: true
    inputs:
      - key: "SearchIndex"
        type: "com.intershop.component.search.capi.SearchIndex"
        required: true
      - key: "Objects"
        type: "java.util.Iterator"
        required: true
      - key: "SearchIndexImportHandler"
        type: "com.intershop.component.search.capi.SearchIndexImportHandler"
        required: false
  - id: "StartNode43"
    name: "ErrorRebuildSearchIndex"
    mode: "private"
    strict: false
    inputs:
      []
  - id: "StartNode44"
    name: "GetObjects"
    mode: "private"
    strict: true
    inputs:
      - key: "UnitName"
        type: "java.lang.String"
        required: true
      - key: "SearchIndexID"
        type: "java.lang.String"
        required: true
      - key: "SearchIndexProcessAction"
        type: "java.lang.String"
        required: false
  - id: "StartNode45"
    name: "UpdateAllSearchIndexesOfDomainName"
    mode: "private"
    strict: true
    inputs:
      - key: "DomainName"
        type: "java.lang.String"
        required: true
      - key: "SearchIndexProcessAction"
        type: "java.lang.String"
        required: true
  - id: "StartNode46"
    name: "CheckSynonymExists"
    mode: "private"
    strict: true
    inputs:
      - key: "NewSynonym"
        type: "com.intershop.component.search.capi.Synonym"
        required: true
      - key: "SearchIndexConfiguration"
        type: "com.intershop.component.search.capi.SearchIndexConfiguration"
        required: true
  - id: "StartNode5"
    name: "Create"
    mode: "private"
    strict: true
    inputs:
      - key: "Domain"
        type: "com.intershop.beehive.core.capi.domain.Domain"
        required: true
      - key: "SearchIndexMain"
        type: "com.intershop.beehive.core.capi.request.WebForm"
        required: true
  - id: "StartNode6"
    name: "UpdateClipboard"
    mode: "private"
    strict: true
    inputs:
      - key: "ObjectUUID"
        type: "java.lang.String"
        required: false
      - key: "SelectedObjectUUID"
        type: "java.lang.String"
        required: false
  - id: "StartNode7"
    name: "Delete"
    mode: "private"
