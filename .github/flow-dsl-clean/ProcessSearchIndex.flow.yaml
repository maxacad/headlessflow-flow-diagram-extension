      - key: "CustomAttributeName"
        type: "java.lang.String[]"
        required: false
  - id: "StartNode22"
    name: "DeleteFilterAttribute"
    mode: "private"
    strict: true
    inputs:
      - key: "SearchIndex"
        type: "java.lang.Object"
        required: false
      - key: "AttributeName"
        type: "java.lang.String"
        required: false
  - id: "StartNode23"
    name: "NewAttribute"
    mode: "private"
    strict: true
    inputs:
      - key: "AttributeName"
        type: "java.lang.String"
        required: true
      - key: "AttributeDescription"
        type: "java.lang.String"
        required: false
      - key: "SearchIndex"
        type: "com.intershop.component.search.capi.SearchIndex"
