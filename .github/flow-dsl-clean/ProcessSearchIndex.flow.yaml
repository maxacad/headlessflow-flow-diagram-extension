  - id: "StartNode25"
    name: "PrepareSynonyms"
    mode: "private"
    strict: true
    inputs:
      - key: "SearchIndex"
        type: "com.intershop.component.search.capi.SearchIndex"
        required: false
  - id: "StartNode26"
    name: "GetObjectsToIndex"
    mode: "private"
