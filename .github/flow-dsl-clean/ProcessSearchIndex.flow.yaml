        type: "com.intershop.component.search.capi.SearchIndex"
        required: false
      - key: "AttributeNames"
        type: "java.util.Iterator"
        required: false
  - id: "StartNode21"
    name: "UpdateSynonyms"
    mode: "private"
    strict: true
    inputs:
      - key: "SearchIndex"
        type: "com.intershop.component.search.capi.SearchIndex"
        required: true
      - key: "KeywordSelection"
        type: "java.util.Iterator"
        required: false
      - key: "Domain"
        type: "com.intershop.beehive.core.capi.domain.Domain"
