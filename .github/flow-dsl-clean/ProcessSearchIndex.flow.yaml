        required: false
      - key: "Domain"
        type: "com.intershop.beehive.core.capi.domain.Domain"
        required: true
  - id: "StartNode27"
    name: "DeleteSynonyms"
    mode: "private"
    strict: true
    inputs:
      - key: "SearchIndex"
        type: "com.intershop.component.search.capi.SearchIndex"
        required: false
  - id: "StartNode28"
    name: "GetObjectsToRemove"
    mode: "private"
    strict: true
    inputs:
      - key: "SearchIndex"
        type: "com.intershop.component.search.capi.SearchIndex"
        required: true
      - key: "Domain"
        type: "com.intershop.beehive.core.capi.domain.Domain"
        required: true
      - key: "LastIndexStartTime"
        type: "java.util.Date"
        required: false
  - id: "StartNode29"
    name: "GetObjectsAndLogger"
    mode: "private"
    strict: false
    inputs:
      []
  - id: "StartNode3"
    name: "CheckConsistence"
    mode: "private"
    strict: true
    inputs:
      - key: "SearchIndexID"
        type: "java.lang.String"
        required: true
      - key: "Domain"
        type: "com.intershop.beehive.core.capi.domain.Domain"
        required: false
  - id: "StartNode30"
    name: "GetOnlineSearchindexByFeature"
    mode: "private"
    strict: true
    inputs:
      - key: "Domain"
        type: "com.intershop.beehive.core.capi.domain.Domain"
        required: true
      - key: "FeatureID"
        type: "java.lang.String"
        required: true
      - key: "Locale"
        type: "com.intershop.beehive.core.capi.localization.LocaleInformation"
        required: true
  - id: "StartNode31"
    name: "ReleaseLock"
    mode: "private"
    strict: true
    inputs:
      - key: "IndexingProcess"
        type: "com.intershop.beehive.core.capi.locking.Process"
        required: false
      - key: "ProcessEndState"
        type: "java.lang.String"
        required: true
  - id: "StartNode32"
    name: "CheckLock"
    mode: "private"
    strict: true
    inputs:
      - key: "SearchIndex"
        type: "com.intershop.component.search.capi.SearchIndex"
        required: true
  - id: "StartNode33"
    name: "GetSortings"
    mode: "private"
    strict: true
    inputs:
      - key: "Domain"
        type: "com.intershop.beehive.core.capi.domain.Domain"
        required: true
      - key: "Locale"
        type: "com.intershop.beehive.core.capi.localization.LocaleInformation"
        required: true
  - id: "StartNode34"
    name: "PrepareMainValues"
