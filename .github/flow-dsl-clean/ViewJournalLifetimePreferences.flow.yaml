flow: "ViewJournalLifetimePreferences"
kind: "com.intershop.component.organization.capi.Organization"

entries:
  - id: "StartNode3"
    name: "Update"
    mode: "private"
    strict: false
    inputs:
      []
  - id: "StartNode4"
    name: "Start"
    mode: "private"
    strict: false
    inputs:
      []
  - id: "StartNode5"
    name: "InitFormData"
    mode: "private"
    strict: true
    inputs:
      - key: "Organization"
        type: "com.intershop.component.organization.capi.Organization"
        required: true
      - key: "Form"
        type: "com.intershop.beehive.core.capi.webform.Form"
        required: false
      - key: "OrganizationDomain"
        type: "com.intershop.beehive.core.capi.domain.Domain"
        required: false
  - id: "StartNode6"
    name: "Dispatch"
    mode: "private"
    strict: false
    inputs:
      []

steps:
  - id: "CallNode1"
    type: "call"
    ref: "ProcessJournal-CleanUpJournal"
    bindings:
      Domain: "MasterRepository:RepositoryDomain"
  - id: "CallNode3"
    type: "call"
    ref: "DetermineRepositories-Master"
  - id: "CallNode4"
    type: "call"
    ref: "DetermineRepositories-Master"
  - id: "CallNode5"
    type: "call"
    ref: "This:InitFormData"
  - id: "CreateForm1"
    type: "pipelet"
    ref: "CreateForm"
    config:
      FormName: "JournalLifetimePreferencesForm"
      FormResource: "JournalLifetimePreferences"
  - id: "CreateForm2"
    type: "pipelet"
    ref: "CreateForm"
    config:
      FormName: "JournalLifetimePreferencesForm"
      FormResource: "JournalLifetimePreferences"
  - id: "DecisionNode1"
    type: "decision"
    condition: "Form:JournalState:Value"
  - id: "DecisionNode2"
    type: "decision"
    condition: "Form:JournalLifetime:Value"
  - id: "DecisionNode3"
    type: "decision"
    condition: "Form:JournalState:Value"
  - id: "DispatchFormAction1"
    type: "pipelet"
    ref: "DispatchFormAction"
    config:
      OutValue_0: "ViewJournalLifetimePreferences-Start"
      OutValue_1: "ViewJournalLifetimePreferences-Update"
    bindings:
      Key_0: "reset"
      Key_1: "update"
      OutValue_0: "null"
      OutValue_1: "null"
      SelectionKey: "JumpTarget"
  - id: "EndNode1"
    type: "end"
    strict: true
  - id: "GetRepository1"
    type: "pipelet"
    ref: "GetRepository"
    config:
      CustomRepositoryTypeCode: 21
      Type: "Custom Repository"
    bindings:
      Repository: "MasterRepository"
  - id: "InteractionNode2"
    type: "interaction"
  - id: "JoinNode1"
    type: "join"
  - id: "JoinNode11"
    type: "join"
  - id: "JoinNode12"
    type: "join"
