  - id: "Jump6"
    type: "jump"
    ref: "SecureJump-Start"
  - id: "Pipelet12"
    type: "pipelet"
    ref: "GetDomainPreference"
    config:
      DefaultPreferenceKey: "JournalState"
      Type: "Integer"
    bindings:
      PreferenceDomain: "Organization:Domain"
      PreferenceIntValue: "JournalState"
  - id: "Pipelet13"
    type: "pipelet"
    ref: "PrepareApplicationView"
    config:
      SelectedMenuItem: "Preferences"
      WorkingTemplate: "product/JournalLifetimePreference"
  - id: "Pipelet15"
    type: "pipelet"
    ref: "SetDomainPreference"
    config:
      DefaultPreferenceKey: "JournalLifetime"
      Type: "Integer"
      DefaultPreferenceValue: 24
    bindings:
      PreferenceDomain: "Organization:Domain"
      PreferenceIntValue: "Form:JournalLifetime:Value"
  - id: "Pipelet16"
    type: "pipelet"
    ref: "SetDomainPreference"
    config:
      DefaultPreferenceKey: "JournalState"
      DefaultPreferenceValue: 1
      Type: "Integer"
    bindings:
      PreferenceDomain: "Organization:Domain"
      PreferenceIntValue: "Form:JournalState:Value"
  - id: "Pipelet18"
    type: "pipelet"
    ref: "GetDomainPreference"
    config:
      DefaultPreferenceKey: "JournalLifetime"
      Type: "Integer"
    bindings:
      PreferenceDomain: "Organization:Domain"
      PreferenceIntValue: "JournalLifetime"
  - id: "SetDictionaryValue7"
    type: "pipelet"
    ref: "SetDictionaryValue"
    config:
      Name: "JumpTarget"
      Value: "ViewJournalLifetimePreferences-Start"
  - id: "SetFormError1"
    type: "pipelet"
    ref: "SetFormError"
    bindings:
      TargetObject: "Form:JournalLifetime"
      ErrorMsg: "\"JournalLifetimeUndefined\""
  - id: "SetFormParameterValue1"
    type: "pipelet"
    ref: "SetFormParameterValue"
    bindings:
      FormParameter: "Form:JournalState"
      Value: "JournalState"
  - id: "SetFormParameterValue2"
    type: "pipelet"
    ref: "SetFormParameterValue"
    bindings:
      FormParameter: "Form:JournalLifetime"
      Value: "JournalLifetime"
  - id: "ValidateForm1"
    type: "pipelet"
    ref: "ValidateForm"

