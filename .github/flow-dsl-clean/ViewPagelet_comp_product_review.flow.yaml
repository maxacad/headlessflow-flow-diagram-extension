flow: "ViewPagelet_comp_product_review"
kind: "view"

entries:
  - id: "StartNode1"
    name: "CurrentCustomerReviewSection"
    mode: "private"
    strict: true
    inputs:
      - key: "ProductBO"
        type: "com.intershop.component.product.capi.ProductBO"
        required: true
      - key: "CurrentUser"
        type: "com.intershop.beehive.core.capi.user.User"
        required: true
  - id: "StartNode2"
    name: "ReviewList"
    mode: "private"
    strict: true
    inputs:
      - key: "ProductBO"
        type: "com.intershop.component.product.capi.ProductBO"
        required: true
      - key: "CurrentUser"
        type: "com.intershop.beehive.core.capi.user.User"
        required: true
      - key: "Locale"
        type: "com.intershop.beehive.core.capi.localization.LocaleInformation"
        required: false
      - key: "PageableID"
        type: "java.lang.String"
        required: false
      - key: "PageletConfigurationParameters"
        type: "java.util.Map"
        required: false
      - key: "CategoryDomainName"
        type: "java.lang.String"
        required: false
      - key: "CategoryName"
        type: "java.lang.String"
        required: false
      - key: "ListNavigationVO"
        type: "com.intershop.sellside.application.b2c.capi.common.ListNavigationVO"
        required: false

steps:
  - id: "AddMultipleEntriesToMap1"
    type: "pipelet"
    ref: "AddMultipleEntriesToMap"
    config:
      Mode: "OverwriteValue"
    bindings:
      InMap: "null"
      Key1: "\"SKU\""
      Value1: "ProductBO:SKU"
      Key2: "\"CategoryDomainName\""
      Value2: "CategoryDomainName"
      Key3: "\"CategoryName\""
      Value3: "CategoryName"
      OutMap: "ReviewPagingHandlerParametersMap"
  - id: "AddObjectToVector1"
    type: "pipelet"
    ref: "AddObjectToVector"
    bindings:
      InVector: "null"
      Object: "\"APPROVED\""
      OutVector: "StatusNames"
  - id: "CallNode2"
    type: "call"
    ref: "ViewProductReview-GetCustomer"
  - id: "CallNode3"
    type: "call"
    ref: "ViewProductReview-GetCustomer"
  - id: "CallNode6"
    type: "call"
    ref: "ViewProductReview-GetReviewsByAuthor"
  - id: "CallNode9"
    type: "call"
    ref: "ViewProductReview-GetNavigationList"
    bindings:
      PageSize: "Reviews:PageSize"
      CurrentPage: "Reviews:Page"
  - id: "CheckUserLoggedIn1"
    type: "pipelet"
    ref: "CheckUserLoggedIn"
  - id: "CreatePageableFromCollection1"
    type: "pipelet"
    ref: "CreatePageableFromCollection"
    config:
      Pagesize: 3
    bindings:
      Collection: "ReviewList"
      Pageable: "Reviews"
  - id: "DecisionNode1"
    type: "decision"
    condition: "Reviews"
  - id: "DecisionNode2"
    type: "decision"
    condition: "ListNavigationVO"
  - id: "DecisionNode3"
    type: "decision"
    condition: "PageletConfigurationParameters:reviewsPerPage"
  - id: "EndNode1"
    type: "end"
    strict: true
    outputs:
      - key: "ReviewBO"
        type: "com.intershop.component.rating.capi.ReviewBO"
        guaranteed: false
      - key: "ReviewApprovalBO"
        type: "com.intershop.component.rating.capi.ReviewApprovalBO"
        guaranteed: false
      - key: "UserLoggedIn"
        type: "java.lang.String"
        guaranteed: false
      - key: "ShowReviewerName"
        type: "java.lang.String"
        guaranteed: false
  - id: "EndNode2"
    type: "end"
    strict: true
    outputs:
      - key: "Reviews"
        type: "java.util.Iterator<com.intershop.component.rating.capi.ReviewBO>"
        guaranteed: true
      - key: "ListNavigationVO"
        type: "com.intershop.sellside.application.b2c.capi.common.ListNavigationVO"
        guaranteed: true
      - key: "ShowReviewerName"
        type: "java.lang.String"
        guaranteed: false
  - id: "GetBusinessObjectReviewsExceptForCustomer1"
    type: "pipelet"
    ref: "GetBusinessObjectReviewsExceptForCustomer"
    bindings:
      BusinessObjectApprovedReviewBORepository: "ProductBO:Extension(\"Review\")"
      ExcludedCustomer: "CustomerBO"
      Reviews: "ReviewList"
  - id: "GetFirstElementOfIterator1"
    type: "pipelet"
    ref: "GetFirstElementOfIterator"
    bindings:
      Iterator: "Reviews:Iterator"
      FirstElement: "ReviewBO"
  - id: "JoinNode1"
    type: "join"
  - id: "JoinNode2"
    type: "join"
  - id: "JoinNode3"
    type: "join"
  - id: "JoinNode4"
    type: "join"
  - id: "JoinNode5"
    type: "join"
  - id: "KeyMapper1"
    type: "pipelet"
    ref: "KeyMapper"
    bindings:
      InValue_1: "\"true\""
      OutValue_1: "UserLoggedIn"
  - id: "KeyMapper2"
    type: "pipelet"
    ref: "KeyMapper"
    bindings:
      InValue_1: "ReviewBO:Extension(\"Approval\"):Approval"
      OutValue_1: "ReviewApprovalBO"
  - id: "KeyMapper3"
    type: "pipelet"
    ref: "KeyMapper"
    bindings:
      InValue_1: "ListNavigationVO:ListObjects"
      InValue_2: "ListNavigationVO:ElementCount"
      OutValue_1: "Reviews"
      OutValue_2: "ReviewCount"
  - id: "UpdatePageSize1"
    type: "pipelet"
    ref: "UpdatePageSize"
    bindings:
      PageableIterator: "Reviews"
      PageSize: "PageletConfigurationParameters:reviewsPerPage"

links:
  - from: "CallNode2"
    via: "next"
    to: "AddObjectToVector1"
    into: "in"
  - from: "GetFirstElementOfIterator1"
    via: "next"
    to: "KeyMapper2"
    into: "in"
  - from: "AddObjectToVector1"
    via: "next"
    to: "DecisionNode2"
    into: "in"
  - from: "StartNode1"
    via: "next"
    to: "CallNode3"
    into: "in"
  - from: "JoinNode2"
    via: "next"
    to: "JoinNode1"
    into: "in1"
  - from: "DecisionNode2"
    via: "no"
    to: "GetBusinessObjectReviewsExceptForCustomer1"
    into: "in"
  - from: "DecisionNode3"
    via: "yes"
    to: "UpdatePageSize1"
    into: "in"
  - from: "CallNode6"
    via: "next"
    to: "DecisionNode1"
    into: "in"
  - from: "DecisionNode2"
    via: "yes"
    to: "KeyMapper3"
    into: "in"
  - from: "KeyMapper3"
    via: "next"
    to: "JoinNode3"
    into: "in1"
  - from: "GetBusinessObjectReviewsExceptForCustomer1"
    via: "next"
    to: "CreatePageableFromCollection1"
    into: "in"
  - from: "CreatePageableFromCollection1"
    via: "next"
    to: "DecisionNode3"
    into: "in"
  - from: "CallNode9"
    via: "next"
    to: "JoinNode3"
    into: "in1"
  - from: "UpdatePageSize1"
    via: "next"
    to: "JoinNode4"
    into: "in1"
  - from: "DecisionNode3"
    via: "no"
    to: "JoinNode4"
    into: "in1"
  - from: "JoinNode3"
    via: "next"
    to: "EndNode2"
    into: "in"
  - from: "JoinNode4"
    via: "next"
    to: "AddMultipleEntriesToMap1"
    into: "in"
  - from: "JoinNode1"
    via: "next"
    to: "CheckUserLoggedIn1"
    into: "in"
  - from: "KeyMapper2"
    via: "next"
    to: "JoinNode1"
    into: "in1"
  - from: "CheckUserLoggedIn1"
    via: "error"
    to: "JoinNode5"
    into: "in1"
  - from: "JoinNode5"
    via: "next"
    to: "EndNode1"
    into: "in"
  - from: "CheckUserLoggedIn1"
    via: "next"
    to: "KeyMapper1"
    into: "in"
  - from: "KeyMapper1"
    via: "next"
    to: "JoinNode5"
    into: "in1"
  - from: "AddMultipleEntriesToMap1"
    via: "next"
    to: "CallNode9"
    into: "in"
  - from: "GetFirstElementOfIterator1"
    via: "error"
    to: "JoinNode2"
    into: "in1"
  - from: "DecisionNode1"
    via: "no"
    to: "JoinNode2"
    into: "in1"
  - from: "CallNode3"
    via: "next"
    to: "CallNode6"
    into: "in"
  - from: "DecisionNode1"
    via: "yes"
    to: "GetFirstElementOfIterator1"
    into: "in"
  - from: "StartNode2"
    via: "next"
    to: "CallNode2"
    into: "in"
