      DefaultDirectoryPath: "export"
      UnitDirectory: "IMPEX_DIR"
    bindings:
      UnitDomain: "Channel:Domain"
  - id: "CreateDirectory2"
    type: "pipelet"
    ref: "CreateDirectory"
