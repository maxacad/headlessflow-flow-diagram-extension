flow: "UpdateObjectStatistics_52"
kind: "process"

entries:
  - id: "StartNode1"
    name: "ProcessChannel"
    mode: "private"
    strict: true
    inputs:
      - key: "CurrentChannel"
        type: "com.intershop.component.mvc.capi.catalog.Repository"
        required: true

steps:
  - id: "CallNode1"
    type: "call"
    ref: "UpdateObjectStatisticsRealtime-Update"
    bindings:
      ObjectDomain: "CurrentChannel:RepositoryDomain"
      GroupName: "\"Order\""
  - id: "CallNode2"
    type: "call"
    ref: "UpdateObjectStatisticsRealtime-Update"
    bindings:
      ObjectDomain: "CurrentChannel:RepositoryDomain"
      GroupName: "\"Product\""
  - id: "CallNode3"
    type: "call"
    ref: "ProcessPromotion-GetPromotionDomainByChannel"
    bindings:
      Channel: "CurrentChannel"
  - id: "CallNode5"
    type: "call"
    ref: "UpdateObjectStatisticsRealtime-Update"
    bindings:
      ObjectDomain: "CurrentChannel:RepositoryDomain"
      GroupName: "\"Promotion\""
  - id: "EndNode1"
    type: "end"
    strict: true

links:
  - from: "StartNode1"
    via: "next"
    to: "CallNode2"
    into: "in"
  - from: "CallNode2"
    via: "next"
    to: "CallNode1"
    into: "in"
  - from: "CallNode3"
    via: "next"
    to: "CallNode5"
    into: "in"
  - from: "CallNode5"
    via: "next"
    to: "EndNode1"
    into: "in"
  - from: "CallNode1"
    via: "next"
    to: "CallNode3"
    into: "in"
