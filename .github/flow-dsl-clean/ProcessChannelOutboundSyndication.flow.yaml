flow: "ProcessChannelOutboundSyndication"
kind: "process"

entries:
  - id: "StartNode1"
    name: "GetSyndicationFileExtension"
    mode: "private"
    strict: true
    inputs:
      - key: "Syndication"
        type: "com.intershop.component.foundation.capi.syndication.Syndication"
        required: true
      - key: "CompressionLevel"
        type: "java.lang.String"
        required: false
  - id: "StartNode2"
    name: "GetFileExtension"
    mode: "private"
    strict: true
    inputs:
      - key: "FileName"
        type: "java.lang.String"
        required: true
  - id: "StartNode3"
    name: "EnforceAppropriateFileExtension"
    mode: "private"
    strict: true
    inputs:
      - key: "Syndication"
        type: "com.intershop.component.foundation.capi.syndication.Syndication"
        required: true
      - key: "FileName"
        type: "java.lang.String"
        required: true
      - key: "CompressionLevel"
        type: "java.lang.String"
        required: false
  - id: "StartNode5"
    name: "EnforceFileExtension"
    mode: "private"
    strict: true
    inputs:
      - key: "FileName"
        type: "java.lang.String"
        required: true
      - key: "FileExtension"
        type: "java.lang.String"
        required: false

steps:
  - id: "CallNode1"
    type: "call"
    ref: "ProcessChannelOutboundSyndication-GetFileExtension"
  - id: "CallNode2"
    type: "call"
    ref: "ProcessChannelOutboundSyndication-GetFileExtension"
  - id: "CallNode3"
    type: "call"
    ref: "ProcessChannelOutboundSyndication-GetSyndicationFileExtension"
  - id: "CallNode4"
    type: "call"
    ref: "ProcessChannelOutboundSyndication-EnforceFileExtension"
  - id: "ConcatenateStrings1"
    type: "pipelet"
    ref: "ConcatenateStrings"
    config:
      DefaultString1: "."
    bindings:
      String0: "FileName"
      Concatenated: "NewFileName"
      String2: "FileExtension"
  - id: "ConcatenateStrings2"
    type: "pipelet"
    ref: "ConcatenateStrings"
    config:
      DefaultString0: "^(?i)"
      DefaultString2: "$"
    bindings:
      Concatenated: "Pattern"
      String1: "FileExtension"
  - id: "CreateStringSplitter2"
    type: "pipelet"
    ref: "CreateStringSplitter"
    config:
      Separator: "."
      Mode: "Last Occurrence"
  - id: "DecisionNode1"
    type: "decision"
    condition: "Extension"
  - id: "DecisionNode2"
    type: "decision"
    condition: "Extension"
  - id: "DecisionNode3"
    type: "decision"
    condition: "Extension"
  - id: "DecisionNode4"
    type: "decision"
    condition: "FileExtension"
  - id: "DecisionNode5"
    type: "decision"
    condition: "CompressionLevel"
  - id: "DecisionNode6"
    type: "decision"
    condition: "CompressionLevel"
  - id: "DecisionNode7"
    type: "decision"
    condition: "Index"
  - id: "EndNode1"
    type: "end"
    strict: true
    outputs:
      - key: "FileExtension"
        type: "java.lang.String"
        guaranteed: false
  - id: "EndNode2"
    type: "end"
    strict: true
    outputs:
      - key: "NewFileName"
        type: "java.lang.String"
        guaranteed: true
  - id: "EndNode3"
    type: "end"
    strict: true
    outputs:
      - key: "Extension"
        type: "java.lang.String"
        guaranteed: false
  - id: "EndNode4"
    type: "end"
    strict: true
    outputs:
      - key: "NewFileName"
        type: "java.lang.String"
        guaranteed: true
  - id: "EndNode5"
    type: "end"
    strict: true
    outputs:
      - key: "NewFileName"
        type: "java.lang.String"
        guaranteed: true
  - id: "GetStringIndexOf2"
    type: "pipelet"
    ref: "GetStringIndexOf"
    bindings:
      MainString: "FileName"
      SubString: "\".\""
      IndexOf: "Index"
  - id: "JoinNode1"
    type: "join"
  - id: "JoinNode2"
    type: "join"
  - id: "JoinNode3"
    type: "join"
  - id: "JoinNode4"
    type: "join"
  - id: "JoinNode5"
    type: "join"
  - id: "JoinNode6"
    type: "join"
  - id: "JoinNode7"
    type: "join"
  - id: "JoinNode8"
    type: "join"
  - id: "JoinNode9"
    type: "join"
  - id: "KeyMapper1"
    type: "pipelet"
    ref: "KeyMapper"
    bindings:
      InValue_1: "FileName"
      OutValue_1: "NewFileName"
  - id: "KeyMapper2"
    type: "pipelet"
    ref: "KeyMapper"
    bindings:
      InValue_1: "FileName"
      OutValue_1: "NewFileName"
  - id: "KeyMapper3"
    type: "pipelet"
    ref: "KeyMapper"
    bindings:
      InValue_1: "Syndication:Target:Parameters:get(\"zeroCompressionFileExtension\")"
      OutValue_1: "FileExtension"
  - id: "KeyMapper4"
    type: "pipelet"
    ref: "KeyMapper"
    bindings:
      InValue_1: "\"zip\""
      OutValue_1: "FileExtension"
  - id: "KeyMapper5"
    type: "pipelet"
    ref: "KeyMapper"
    bindings:
      InValue_1: "FileName"
      OutValue_1: "NewFileName"
  - id: "KeyMapper6"
    type: "pipelet"
    ref: "KeyMapper"
    bindings:
      InValue_1: "Splitter:End(FileName)"
      OutValue_1: "Extension"
  - id: "VerifyStringByRegularExpression1"
    type: "pipelet"
    ref: "VerifyStringByRegularExpression"
    bindings:
      String: "Extension"
  - id: "VerifyStringByRegularExpression2"
    type: "pipelet"
    ref: "VerifyStringByRegularExpression"
    bindings:
      String: "Extension"
      Pattern: "\"^(?i)zip$\""

links:
  - from: "JoinNode7"
    via: "next"
    to: "EndNode4"
    into: "in"
  - from: "DecisionNode6"
    via: "no"
    to: "JoinNode2"
    into: "in2"
  - from: "ConcatenateStrings1"
    via: "next"
    to: "JoinNode7"
    into: "in3"
  - from: "JoinNode5"
    via: "next"
    to: "ConcatenateStrings1"
    into: "in"
  - from: "DecisionNode3"
    via: "yes"
    to: "JoinNode6"
    into: "in1"
  - from: "CallNode1"
    via: "next"
    to: "DecisionNode2"
    into: "in"
  - from: "JoinNode6"
    via: "next"
    to: "JoinNode5"
    into: "in2"
  - from: "KeyMapper5"
    via: "next"
    to: "EndNode2"
    into: "in"
  - from: "StartNode3"
    via: "next"
    to: "CallNode2"
    into: "in"
  - from: "VerifyStringByRegularExpression2"
    via: "next"
    to: "KeyMapper2"
    into: "in"
  - from: "CreateStringSplitter2"
    via: "next"
    to: "KeyMapper6"
    into: "in"
  - from: "DecisionNode5"
    via: "yes"
    to: "DecisionNode6"
    into: "in"
  - from: "DecisionNode3"
    via: "no"
    to: "ConcatenateStrings2"
    into: "in"
  - from: "ConcatenateStrings2"
    via: "next"
    to: "VerifyStringByRegularExpression1"
    into: "in"
  - from: "KeyMapper1"
    via: "next"
    to: "JoinNode7"
    into: "in1"
  - from: "CallNode3"
    via: "next"
    to: "CallNode4"
    into: "in"
  - from: "StartNode1"
    via: "next"
    to: "DecisionNode5"
    into: "in"
  - from: "DecisionNode5"
    via: "no"
    to: "JoinNode2"
    into: "in1"
  - from: "JoinNode2"
    via: "next"
    to: "KeyMapper3"
    into: "in"
  - from: "DecisionNode6"
    via: "yes"
    to: "KeyMapper4"
    into: "in"
  - from: "KeyMapper3"
    via: "next"
    to: "JoinNode3"
    into: "in3"
  - from: "VerifyStringByRegularExpression2"
    via: "error"
    to: "JoinNode9"
    into: "in1"
  - from: "VerifyStringByRegularExpression1"
    via: "error"
    to: "JoinNode5"
    into: "in1"
  - from: "KeyMapper2"
    via: "next"
    to: "JoinNode8"
    into: "in1"
  - from: "JoinNode8"
    via: "next"
    to: "EndNode5"
    into: "in"
  - from: "DecisionNode1"
    via: "no"
    to: "JoinNode9"
    into: "in2"
  - from: "GetStringIndexOf2"
    via: "next"
    to: "DecisionNode7"
    into: "in"
  - from: "KeyMapper4"
    via: "next"
    to: "JoinNode3"
    into: "in1"
  - from: "JoinNode3"
    via: "next"
    to: "EndNode1"
    into: "in"
  - from: "DecisionNode7"
    via: "yes"
    to: "CreateStringSplitter2"
    into: "in"
  - from: "StartNode2"
    via: "next"
    to: "GetStringIndexOf2"
    into: "in"
  - from: "DecisionNode7"
    via: "no"
    to: "JoinNode4"
    into: "in2"
  - from: "KeyMapper6"
    via: "next"
    to: "JoinNode1"
    into: "in1"
  - from: "VerifyStringByRegularExpression1"
    via: "next"
    to: "KeyMapper1"
    into: "in"
  - from: "JoinNode1"
    via: "next"
    to: "EndNode3"
    into: "in"
  - from: "GetStringIndexOf2"
    via: "error"
    to: "JoinNode4"
    into: "in1"
  - from: "JoinNode4"
    via: "next"
    to: "JoinNode1"
    into: "in2"
  - from: "CallNode2"
    via: "next"
    to: "DecisionNode1"
    into: "in"
  - from: "CallNode4"
    via: "next"
    to: "JoinNode8"
    into: "in2"
  - from: "DecisionNode1"
    via: "yes"
    to: "VerifyStringByRegularExpression2"
    into: "in"
  - from: "JoinNode9"
    via: "next"
    to: "CallNode3"
    into: "in"
  - from: "DecisionNode2"
    via: "no"
    to: "JoinNode6"
    into: "in2"
  - from: "DecisionNode4"
    via: "no"
    to: "KeyMapper5"
    into: "in"
  - from: "StartNode5"
    via: "next"
    to: "DecisionNode4"
    into: "in"
  - from: "DecisionNode4"
    via: "yes"
    to: "CallNode1"
    into: "in"
  - from: "DecisionNode2"
    via: "yes"
    to: "DecisionNode3"
    into: "in"
