    config:
      AllowNullParameter: false
      ParameterDefinition: "ToBeRemovedDomainID=string"
      StoredProcedure: "sp_deleteUserDelegateByDomain"
  - id: "Pipelet5"
    type: "pipelet"
    ref: "ExecuteStoredProcedure"
    config:
      AllowNullParameter: false
      ParameterDefinition: "ToBeRemovedDomainID=string"
      StoredProcedure: "sp_deleteChannelByDomain"
  - id: "Pipelet6"
    type: "pipelet"
    ref: "ExecuteStoredProcedure"
    config:
      AllowNullParameter: false
      ParameterDefinition: "ToBeRemovedDomainID=string"
      StoredProcedure: "sp_deleteOrganizationByDomain"
  - id: "Text1"
    type: "text"

links:
  - from: "Start1"
    via: "next"
    to: "ExecuteStoredProcedure5"
    into: "in"
  - from: "ExecuteStoredProcedure5"
    via: "error"
    to: "JoinNode1"
    into: "in1"
