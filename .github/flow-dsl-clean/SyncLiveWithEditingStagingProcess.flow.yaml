flow: "SyncLiveWithEditingStagingProcess"
kind: "process"

entries:
  - id: "StartNode1"
    name: "Start"
    mode: "private"
    strict: false
    inputs:
      []

steps:
  - id: "DecisionNode1"
    type: "decision"
    condition: "DatabaseLinkName"
  - id: "DecisionNode2"
    type: "decision"
    condition: "EditingSchemaName"
  - id: "EndNode1"
    type: "end"
  - id: "EndNode2"
    type: "end"
  - id: "GetProperties2"
    type: "pipelet"
    ref: "GetProperties"
    config:
      DictionaryKey1: "DatabaseLinkName"
      DictionaryKey2: "EditingSchemaName"
      DictionaryKey3: "RbsName"
      PropertyName1: "staging.dblink.name"
      PropertyName2: "staging.editing.schema.name"
      PropertyName3: "staging.rollback"
  - id: "JoinNode2"
    type: "join"
  - id: "JoinNode3"
    type: "join"
  - id: "Pipelet4"
    type: "pipelet"
    ref: "ExecuteStoredProcedure"
    config:
      ParameterDefinition: "EditingSchemaName=string;DatabaseLinkName=string"
      AllowNullParameter: true
      StoredProcedure: "staging.sync_live_with_editing_process"

links:
  - from: "DecisionNode1"
    via: "yes"
    to: "JoinNode2"
    into: "in1"
  - from: "JoinNode2"
    via: "next"
    to: "Pipelet4"
    into: "in"
  - from: "DecisionNode2"
    via: "yes"
    to: "JoinNode2"
    into: "in3"
  - from: "Pipelet4"
    via: "error"
    to: "EndNode2"
    into: "in"
  - from: "Pipelet4"
    via: "next"
    to: "JoinNode3"
    into: "in1"
  - from: "JoinNode3"
    via: "next"
    to: "EndNode1"
    into: "in"
  - from: "DecisionNode2"
    via: "no"
    to: "JoinNode3"
    into: "in3"
  - from: "StartNode1"
    via: "next"
    to: "GetProperties2"
    into: "in"
  - from: "GetProperties2"
    via: "next"
    to: "DecisionNode1"
    into: "in"
  - from: "DecisionNode1"
    via: "no"
    to: "DecisionNode2"
    into: "in"
