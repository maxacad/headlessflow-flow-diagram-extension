    via: "next"
    to: "Join2"
    into: "in1"
  - from: "Join1"
    via: "next"
    to: "KeyMapper5"
    into: "in"
  - from: "Join2"
    via: "next"
    to: "Call7"
    into: "in"
  - from: "Join3"
