flow: "ViewCatalogMaintenance"
kind: "view"

entries:
  - id: "Start1"
    name: "Prefix"
    mode: "private"
    strict: true
    inputs:
      - key: "CatalogUUID"
        type: "java.lang.String"
        required: true
  - id: "Start2"
    name: "Update"
    mode: "private"
    strict: false
    inputs:
      []
  - id: "Start3"
    name: "Start"
    mode: "private"
    strict: false
    inputs:
      []
  - id: "Start5"
    name: "Dispatch"
    mode: "private"
    strict: false
    inputs:
      []

steps:
  - id: "Call2"
    type: "call"
    ref: "ViewCatalogMaintenance-Prefix"
  - id: "Call3"
    type: "call"
    ref: "ViewCatalogMaintenance-Prefix"
  - id: "CallNode1"
    type: "call"
    ref: "ProcessCatalogMaintenance-Update"
  - id: "DispatchFormAction1"
    type: "pipelet"
    ref: "DispatchFormAction"
    config:
      OutValue_0: "ViewCatalogMaintenance-Update"
      OutValue_1: "ViewCatalogMaintenance-Start"
      OutValue_2: "ViewCatalogList-ListAll"
    bindings:
      Key_0: "apply"
      Key_1: "reset"
      Key_2: "back"
      SelectionKey: "JumpTarget"
  - id: "End1"
    type: "end"
    strict: true
    outputs:
      - key: "Catalog"
        type: "com.intershop.component.mvc.capi.catalog.Catalog"
        guaranteed: true
  - id: "GetCatalogByUUID1"
    type: "pipelet"
    ref: "GetCatalogByUUID"
  - id: "InteractionEnd1"
    type: "interaction"
  - id: "Join2"
    type: "join"
  - id: "JoinNode1"
    type: "join"
  - id: "Jump2"
    type: "jump"
    ref: "SecureJump-Start"
  - id: "JumpNode1"
    type: "jump"
    ref: "ViewCatalogList-ListAll"
  - id: "PrepareApplicationView1"
    type: "pipelet"
    ref: "PrepareApplicationView"
    config:
      SelectedMenuItem: "Catalogs"
      WorkingTemplate: "catalog/CatalogMaintenance"

links:
  - from: "Start3"
    via: "next"
    to: "Call3"
    into: "in"
  - from: "GetCatalogByUUID1"
    via: "next"
    to: "End1"
    into: "in"
  - from: "PrepareApplicationView1"
    via: "next"
    to: "InteractionEnd1"
    into: "in"
  - from: "Start5"
    via: "next"
    to: "DispatchFormAction1"
    into: "in"
  - from: "Start2"
    via: "next"
    to: "Call2"
    into: "in"
  - from: "DispatchFormAction1"
    via: "next"
    to: "Jump2"
    into: "in"
  - from: "Start1"
    via: "next"
    to: "GetCatalogByUUID1"
    into: "in"
  - from: "Call3"
    via: "next"
    to: "JoinNode1"
    into: "in1"
  - from: "Call2"
    via: "next"
    to: "CallNode1"
    into: "in"
  - from: "CallNode1"
    via: "next"
    to: "JoinNode1"
    into: "in3"
  - from: "JoinNode1"
    via: "next"
    to: "PrepareApplicationView1"
    into: "in"
  - from: "GetCatalogByUUID1"
    via: "error"
    to: "JumpNode1"
    into: "in"
