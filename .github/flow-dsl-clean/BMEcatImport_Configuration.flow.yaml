flow: "BMEcatImport_Configuration"
kind: "process"

entries:
  - id: "Start1"
    name: "Start"
    mode: "private"
    strict: false
    inputs:
      []

steps:
  - id: "CreateBMEConfiguration1"
    type: "pipelet"
    ref: "CreateBMEConfiguration"
  - id: "CreateBMEProductIdentifierMapping2"
    type: "pipelet"
    ref: "CreateBMEProductIdentifierMapping"
    config:
      SourceProductIdentifierName: "MANUFACTURER_AID"
      TargetProductIdentifierName: "ManufacturerID"
    bindings:
      TargetProductIdentifierOwner: "OrganizationDomain"
      TargetProductIdentifierScope: "null"
  - id: "CreateBMEProductIdentifierMapping3"
    type: "pipelet"
    ref: "CreateBMEProductIdentifierMapping"
    config:
      SourceProductIdentifierName: "SUPPLIER_AID"
      TargetProductIdentifierName: "SellerID"
    bindings:
      TargetProductIdentifierOwner: "OrganizationDomain"
      TargetProductIdentifierScope: "RepositoryDomain"
  - id: "DetermineUnit1"
    type: "pipelet"
    ref: "DetermineUnit"
    bindings:
      UnitName: "DomainName"
      Unit: "OrganizationDomain"
  - id: "End1"
    type: "end"
    strict: false
  - id: "EndNode1"
    type: "end"
    strict: false
  - id: "Join1"
    type: "join"
  - id: "Join2"
    type: "join"
  - id: "KeyMapper1"
    type: "pipelet"
    ref: "KeyMapper"
    config:
      ValueType: "Dictionary Value"
    bindings:
      OutValue_1: "ProductDeletionPipeline"
      InValue_1: "\"BatchProcessProducts-DeleteProductsLoop\""
  - id: "Pipelet1"
    type: "pipelet"
    ref: "DetermineUnit"
    bindings:
      UnitName: "CatalogDomainName"
      Unit: "CatalogDomain"
  - id: "Pipelet2"
    type: "pipelet"
    ref: "DetermineUnit"
    bindings:
      UnitName: "RepositoryDomainName"
      Unit: "RepositoryDomain"

links:
  - from: "CreateBMEConfiguration1"
    via: "next"
    to: "CreateBMEProductIdentifierMapping3"
    into: "in"
  - from: "Pipelet2"
    via: "next"
    to: "CreateBMEConfiguration1"
    into: "in"
  - from: "Pipelet1"
    via: "error"
    to: "Join2"
    into: "in1"
  - from: "Pipelet2"
    via: "error"
    to: "Join1"
    into: "in1"
  - from: "DetermineUnit1"
    via: "error"
    to: "Join2"
    into: "in1"
  - from: "KeyMapper1"
    via: "next"
    to: "EndNode1"
    into: "in"
  - from: "CreateBMEProductIdentifierMapping3"
    via: "next"
    to: "CreateBMEProductIdentifierMapping2"
    into: "in"
  - from: "CreateBMEProductIdentifierMapping2"
    via: "next"
    to: "KeyMapper1"
    into: "in"
  - from: "Start1"
    via: "next"
    to: "DetermineUnit1"
    into: "in"
  - from: "DetermineUnit1"
    via: "next"
    to: "Pipelet1"
    into: "in"
  - from: "Join2"
    via: "next"
    to: "Join1"
    into: "in1"
  - from: "Join1"
    via: "next"
    to: "End1"
    into: "in"
  - from: "Pipelet1"
    via: "next"
    to: "Pipelet2"
    into: "in"
