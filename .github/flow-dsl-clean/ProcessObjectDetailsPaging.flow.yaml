flow: "ProcessObjectDetailsPaging"
kind: "process"

entries:
  - id: "StartNode10"
    name: "GetPageableFromSession"
    mode: "private"
    strict: true
    inputs:
      - key: "PageLocatorName"
        type: "java.lang.String"
        required: true
      - key: "DetailsPageNumber"
        type: "java.lang.String"
        required: false

steps:
  - id: "Decision1"
    type: "decision"
    condition: "PageLocator:Parameter(\"DetailsPageNumber\")"
  - id: "Decision2"
    type: "decision"
    condition: "DetailsPageNumber"
  - id: "Decision5"
    type: "decision"
    condition: "PageLocator"
  - id: "End1"
    type: "end"
    strict: true
    outputs:
      - key: "DetailsPagingBarPageable"
        type: "com.intershop.beehive.core.capi.paging.PageableIterator"
        guaranteed: false
  - id: "GetPageLocator5"
    type: "pipelet"
    ref: "GetPageLocator"
    config:
      RestorePageLocatorDictionary: "False"
  - id: "GetPageable3"
    type: "pipelet"
    ref: "GetPageable"
    bindings:
      Pageable: "DetailsPagingBarPageable"
      PageableID: "PageLocator:PageableID"
  - id: "Join12"
    type: "join"
  - id: "Join13"
    type: "join"
  - id: "JoinNode25"
    type: "join"
  - id: "JoinNode27"
    type: "join"
  - id: "SetPage1"
    type: "pipelet"
    ref: "SetPage"
    bindings:
      PageNumber: "PageLocator:PageNumber"
      Pageable: "DetailsPagingBarPageable"
  - id: "SetPage3"
    type: "pipelet"
    ref: "SetPage"
    bindings:
      Pageable: "DetailsPagingBarPageable"
      PageNumber: "DetailsPageNumber"
  - id: "SetPage4"
    type: "pipelet"
    ref: "SetPage"
    bindings:
      PageNumber: "PageLocator:Parameter(\"DetailsPageNumber\")"
      Pageable: "DetailsPagingBarPageable"
  - id: "SetPageLocatorParameter1"
    type: "pipelet"
    ref: "SetPageLocatorParameter"
    bindings:
      ParameterName: "\"DetailsPageNumber\""
      ParameterValue: "DetailsPageNumber"
  - id: "VerifyInteger3"
    type: "pipelet"
    ref: "VerifyInteger"
    bindings:
      IntegerObject: "DetailsPageNumber"
      LocalizedString: "DetailsPageNumber"

links:
  - from: "VerifyInteger3"
    via: "error"
    to: "Join13"
    into: "in3"
  - from: "Decision1"
    via: "no"
    to: "SetPage1"
    into: "in"
  - from: "GetPageLocator5"
    via: "error"
    to: "JoinNode25"
    into: "in2"
  - from: "GetPageable3"
    via: "error"
    to: "JoinNode25"
    into: "in1"
  - from: "Decision5"
    via: "no"
    to: "Join12"
    into: "in3"
  - from: "Join12"
    via: "next"
    to: "Join13"
    into: "in1"
  - from: "Decision2"
    via: "yes"
    to: "VerifyInteger3"
    into: "in"
  - from: "GetPageLocator5"
    via: "next"
    to: "GetPageable3"
    into: "in"
  - from: "GetPageable3"
    via: "next"
    to: "Decision2"
    into: "in"
  - from: "VerifyInteger3"
    via: "next"
    to: "SetPage3"
    into: "in"
  - from: "SetPageLocatorParameter1"
    via: "next"
    to: "Join13"
    into: "in1"
  - from: "JoinNode27"
    via: "next"
    to: "End1"
    into: "in"
  - from: "SetPage1"
    via: "next"
    to: "Join12"
    into: "in1"
  - from: "Decision1"
    via: "yes"
    to: "SetPage4"
    into: "in"
  - from: "StartNode10"
    via: "next"
    to: "GetPageLocator5"
    into: "in"
  - from: "JoinNode25"
    via: "next"
    to: "JoinNode27"
    into: "in3"
  - from: "Decision2"
    via: "no"
    to: "Decision5"
    into: "in"
  - from: "SetPage4"
    via: "next"
    to: "Join12"
    into: "in1"
  - from: "Join13"
    via: "next"
    to: "JoinNode27"
    into: "in1"
  - from: "Decision5"
    via: "yes"
    to: "Decision1"
    into: "in"
  - from: "SetPage3"
    via: "next"
    to: "SetPageLocatorParameter1"
    into: "in"
