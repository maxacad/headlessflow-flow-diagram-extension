  - from: "JoinNode8"
    via: "next"
    to: "JoinNode7"
    into: "in2"
  - from: "StartNode2"
    via: "next"
    to: "GetAssignmentStrategy2"
    into: "in"
  - from: "StartNode9"
    via: "next"
    to: "GetAssignmentStrategy3"
    into: "in"
  - from: "UpdateAssignment1"
    via: "next"
    to: "EndNode2"
    into: "in"
  - from: "DeleteAssignment1"
