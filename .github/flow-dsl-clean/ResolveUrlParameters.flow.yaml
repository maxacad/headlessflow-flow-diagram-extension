flow: "ResolveUrlParameters"
kind: "view"

entries:
  - id: "StartNode1"
    name: "Category"
    mode: "public"
    strict: false
    inputs:
      []
  - id: "StartNode2"
    name: "Product"
    mode: "public"
    strict: false
    inputs:
      []
  - id: "StartNode3"
    name: "lookupCategory"
    mode: "private"
    strict: false
    inputs:
      []

steps:
  - id: "CallNode1"
    type: "call"
    ref: "ResolveUrlParameters-lookupCategory"
  - id: "CallNode2"
    type: "call"
    ref: "ResolveUrlParameters-lookupCategory"
  - id: "DecisionNode4"
    type: "decision"
    condition: "CategoryDomainName"
  - id: "DecisionNode5"
    type: "decision"
    condition: "CategoryName"
  - id: "EndNode1"
    type: "end"
    strict: false
  - id: "EndNode2"
    type: "end"
    strict: false
  - id: "GetCatalog1"
    type: "pipelet"
    ref: "GetCatalog"
    bindings:
      OrganizationDomain: "CurrentOrganization:OwningDomain"
      CatalogID: "CategoryDomain"
  - id: "GetCategoryByName1"
    type: "pipelet"
    ref: "GetCategoryByName"
  - id: "GetCategoryByName4"
    type: "pipelet"
    ref: "GetCategoryByName"
  - id: "GetFormSelection3"
    type: "pipelet"
    ref: "GetFormSelection"
    config:
      DefaultParameterName: "CategoryName"
    bindings:
      Selection: "CategoryNames"
  - id: "GetStringSubstitution1"
    type: "pipelet"
    ref: "GetStringSubstitution"
    config:
      DefaultSubstitutionPattern: ""
      DefaultPattern: "-"
    bindings:
      InputString: "CategoryName"
      OutputString: "CategoryName"
      Pattern: "\"-\""
      SubstitutionPattern: "\" \""
  - id: "JoinNode1"
    type: "join"
  - id: "JoinNode2"
    type: "join"
  - id: "JoinNode3"
    type: "join"
  - id: "JoinNode4"
    type: "join"
  - id: "JoinNode8"
    type: "join"
  - id: "JumpNode1"
    type: "jump"
    ref: "ViewStandardCatalog-Browse"
  - id: "JumpNode2"
    type: "jump"
    ref: "ViewProduct-Start"
  - id: "KeyMapper1"
    type: "pipelet"
    ref: "KeyMapper"
    bindings:
      OutValue_1: "CategoryDomainName"
      InValue_1: "Catalog:Domain:DomainName"
  - id: "KeyMapper3"
    type: "pipelet"
    ref: "KeyMapper"
    bindings:
      OutValue_1: "CatalogCategoryID"
      InValue_1: "Category:UUID"
      InValue_2: "Category:DomainName"
      OutValue_2: "CategoryDomainName"
  - id: "LoopNode3"
    type: "loop"
  - id: "RemoveDictionaryValues1"
    type: "pipelet"
    ref: "RemoveDictionaryValues"
    config:
      Keys: "CategoryDomain,Category"
  - id: "RemoveDictionaryValues3"
    type: "pipelet"
    ref: "RemoveDictionaryValues"
    config:
      Keys: "CategoryDomain,Category,Catalog"

links:
  - from: "RemoveDictionaryValues1"
    via: "next"
    to: "JumpNode1"
    into: "in"
  - from: "DecisionNode5"
    via: "no"
    to: "JoinNode2"
    into: "in1"
  - from: "DecisionNode4"
    via: "no"
    to: "GetCatalog1"
    into: "in"
  - from: "JoinNode2"
    via: "next"
    to: "JoinNode8"
    into: "in1"
  - from: "GetCatalog1"
    via: "error"
    to: "JoinNode2"
    into: "in2"
  - from: "CallNode1"
    via: "next"
    to: "JumpNode2"
    into: "in"
  - from: "DecisionNode4"
    via: "yes"
    to: "JoinNode1"
    into: "in1"
  - from: "GetCategoryByName4"
    via: "error"
    to: "GetStringSubstitution1"
    into: "in"
  - from: "GetStringSubstitution1"
    via: "next"
    to: "GetCategoryByName1"
    into: "in"
  - from: "GetCategoryByName4"
    via: "next"
    to: "JoinNode3"
    into: "in1"
  - from: "JoinNode1"
    via: "next"
    to: "GetFormSelection3"
    into: "in"
  - from: "StartNode2"
    via: "next"
    to: "CallNode1"
    into: "in"
  - from: "GetCategoryByName1"
    via: "next"
    to: "JoinNode3"
    into: "in3"
  - from: "JoinNode3"
    via: "next"
    to: "KeyMapper3"
    into: "in"
  - from: "GetStringSubstitution1"
    via: "error"
    to: "JoinNode4"
    into: "in2"
  - from: "GetCategoryByName1"
    via: "error"
    to: "JoinNode4"
    into: "in1"
  - from: "JoinNode4"
    via: "next"
    to: "LoopNode3"
    into: "loop"
  - from: "DecisionNode5"
    via: "yes"
    to: "DecisionNode4"
    into: "in"
  - from: "KeyMapper1"
    via: "next"
    to: "JoinNode1"
    into: "in2"
  - from: "KeyMapper3"
    via: "next"
    to: "RemoveDictionaryValues3"
    into: "in"
  - from: "StartNode1"
    via: "next"
    to: "CallNode2"
    into: "in"
  - from: "LoopNode3"
    via: "do"
    to: "GetCategoryByName4"
    into: "in"
  - from: "LoopNode3"
    via: "next"
    to: "JoinNode8"
    into: "in2"
  - from: "CallNode2"
    via: "next"
    to: "RemoveDictionaryValues1"
    into: "in"
  - from: "RemoveDictionaryValues3"
    via: "next"
    to: "EndNode2"
    into: "in"
  - from: "JoinNode8"
    via: "next"
    to: "EndNode1"
    into: "in"
  - from: "StartNode3"
    via: "next"
    to: "DecisionNode5"
    into: "in"
  - from: "GetFormSelection3"
    via: "next"
    to: "LoopNode3"
    into: "in"
  - from: "GetCatalog1"
    via: "next"
    to: "KeyMapper1"
    into: "in"
