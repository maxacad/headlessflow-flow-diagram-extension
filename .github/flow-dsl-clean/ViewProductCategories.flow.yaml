    type: "decision"
    condition: "Product"
  - id: "Decision2"
    type: "decision"
    condition: "confirmDelete"
  - id: "DecisionNode1"
    type: "decision"
    condition: "defaultCategory"
  - id: "DispatchFormAction1"
    type: "pipelet"
    ref: "DispatchFormAction"
    config:
      OutValue_1: "ViewProductCategories-DeleteProductAssignment"
      OutValue_2: "ViewProductCategories-SetDefaultCategory"
      OutValue_0: "ViewProductCategoryAssignmentWizard-PrepareProductAssignment"
    bindings:
      Key_1: "delete"
      SelectionKey: "JumpTarget"
      Key_2: "apply"
      Key_0: "new"
  - id: "End1"
    type: "end"
    strict: false
