  - id: "SetDictionaryValue1"
    type: "pipelet"
    ref: "SetDictionaryValue"
    config:
      Value: "ViewProductCategories-Start"
      Name: "JumpTarget"
      ValueType: "Dictionary Value"
  - id: "UpdateProduct2"
    type: "pipelet"
    ref: "UpdateProduct"
    bindings:
      DefaultCategory: "DefaultCatalogCategory"
      ProductID: "Product:SKU"

