  - id: "KeyMapper1"
    type: "pipelet"
    ref: "KeyMapper"
    bindings:
      InValue_1: "Category"
      InValue_2: "CategoriesPath"
      OutValue_1: "JumpCategory"
      OutValue_2: "JumpPath"
      InValue_3: "CurrentMasterRepository:RepositoryDomain"
      OutValue_3: "ProductDomain"
  - id: "PrepareApplicationView1"
    type: "pipelet"
    ref: "PrepareApplicationView"
    config:
      SelectedMenuItem: "Products"
      WorkingTemplate: "product/ProductUpdateCategories"
  - id: "RemoveDictionaryValue1"
    type: "pipelet"
