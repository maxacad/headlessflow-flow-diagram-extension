  - id: "CallNode5"
    type: "call"
    ref: "DetermineProduct-MasterRepositoryProduct"
  - id: "CallNode6"
    type: "call"
    ref: "ProcessProductCategories-GetImplicitAndExplicitCategoriesByCatalogType"
    bindings:
