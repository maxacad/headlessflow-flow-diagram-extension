flow: "ProcessRedirectAction"
kind: "process"

entries:
  - id: "StartNode0"
    name: "CleanupProductRedirects"
    mode: "private"
    strict: true
    inputs:
      - key: "ProductID"
        type: "java.lang.String"
        required: true
      - key: "Domain"
        type: "com.intershop.beehive.core.capi.domain.Domain"
        required: true

steps:
  - id: "CallNode0"
    type: "call"
    ref: "ProcessSearchIndex-GetIndexes"
  - id: "DecisionNode0"
    type: "decision"
    condition: "RedirectAction:RedirectType"
  - id: "DecisionNode1"
    type: "decision"
    condition: "RedirectAction:RedirectTarget"
  - id: "EndNode0"
    type: "end"
    strict: false
  - id: "JoinNode0"
    type: "join"
  - id: "JoinNode1"
    type: "join"
  - id: "JoinNode2"
    type: "join"
  - id: "LoopNode0"
    type: "loop"
  - id: "LoopNode1"
    type: "loop"
  - id: "RemoveSearchAction0"
    type: "pipelet"
    ref: "RemoveSearchAction"
    bindings:
      SearchAction: "RedirectAction"
  - id: "SearchRedirectActions0"
    type: "pipelet"
    ref: "SearchRedirectActions"

links:
  - from: "CallNode0"
    via: "next"
    to: "LoopNode0"
    into: "in"
  - from: "DecisionNode0"
    via: "no"
    to: "JoinNode0"
    into: "in1"
  - from: "DecisionNode0"
    via: "yes"
    to: "DecisionNode1"
    into: "in"
  - from: "DecisionNode1"
    via: "no"
    to: "JoinNode2"
    into: "in1"
  - from: "DecisionNode1"
    via: "yes"
    to: "RemoveSearchAction0"
    into: "in"
  - from: "JoinNode0"
    via: "next"
    to: "LoopNode1"
    into: "loop"
  - from: "JoinNode1"
    via: "next"
    to: "LoopNode0"
    into: "loop"
  - from: "JoinNode2"
    via: "next"
    to: "JoinNode0"
    into: "in1"
  - from: "LoopNode0"
    via: "do"
    to: "SearchRedirectActions0"
    into: "in"
  - from: "LoopNode0"
    via: "next"
    to: "EndNode0"
    into: "in"
  - from: "LoopNode1"
    via: "do"
    to: "DecisionNode0"
    into: "in"
  - from: "LoopNode1"
    via: "next"
    to: "JoinNode1"
    into: "in1"
  - from: "RemoveSearchAction0"
    via: "next"
    to: "JoinNode2"
    into: "in1"
  - from: "SearchRedirectActions0"
    via: "error"
    to: "JoinNode1"
    into: "in1"
  - from: "SearchRedirectActions0"
    via: "next"
    to: "LoopNode1"
    into: "in"
  - from: "StartNode0"
    via: "next"
    to: "CallNode0"
    into: "in"
