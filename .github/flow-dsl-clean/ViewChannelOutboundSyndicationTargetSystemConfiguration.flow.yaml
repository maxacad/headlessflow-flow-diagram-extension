flow: "ViewChannelOutboundSyndicationTargetSystemConfiguration"
kind: "view"

entries:
  - id: "StartNode1"
    name: "Update"
    mode: "private"
    strict: true
    inputs:
      - key: "Syndication"
        type: "com.intershop.component.foundation.capi.syndication.Syndication"
        required: true
      - key: "SiteMapWebForm_ChangeFrequency"
        type: "java.lang.String"
        required: false
      - key: "SiteMapWebForm_CurrencyMnemonic"
        type: "java.lang.String"
        required: false
      - key: "SiteMapWebForm_FileName"
        type: "java.lang.String"
        required: false
      - key: "SiteMapWebForm_LocaleID"
        type: "java.lang.String"
        required: false
      - key: "SiteMapWebForm_Priority"
        type: "java.lang.String"
        required: false
      - key: "SiteMapWebForm_CompressionLevel"
        type: "java.lang.String"
        required: true
      - key: "SiteMapWebForm_UseLastModified"
        type: "java.lang.String"
        required: true
  - id: "StartNode2"
    name: "Edit"
    mode: "private"
    strict: false
    inputs:
      []
  - id: "StartNode3"
    name: "Remove"
    mode: "private"
    strict: true
    inputs:
      - key: "Syndication"
        type: "com.intershop.component.foundation.capi.syndication.Syndication"
        required: true
  - id: "StartNode4"
    name: "CreateWebForm"
    mode: "private"
    strict: true
    inputs:
      []

steps:
  - id: "EndNode1"
    type: "end"
    strict: true
    outputs:
      - key: "SiteMapWebForm"
        type: "com.intershop.beehive.core.capi.request.WebForm"
        guaranteed: false
  - id: "EndNode2"
    type: "end"
    strict: true
  - id: "EndNode3"
    type: "end"
    strict: true
    outputs:
      - key: "SiteMapWebForm"
        type: "com.intershop.beehive.core.capi.request.WebForm"
        guaranteed: false
  - id: "GetSyndicationByUUID1"
    type: "pipelet"
    ref: "GetSyndicationByUUID"
  - id: "GetTargetCluster0"
    type: "pipelet"
    ref: "GetTargetCluster"
    bindings:
      TargetClusterID: "Syndication:TargetID"
  - id: "InteractionNode1"
    type: "interaction"
  - id: "JoinNode0"
    type: "join"

links:
  - from: "GetSyndicationByUUID1"
    via: "next"
    to: "GetTargetCluster0"
    into: "in"
  - from: "GetTargetCluster0"
    via: "error"
    to: "JoinNode0"
    into: "in1"
  - from: "GetTargetCluster0"
    via: "next"
    to: "JoinNode0"
    into: "in1"
  - from: "JoinNode0"
    via: "next"
    to: "InteractionNode1"
    into: "in"
  - from: "StartNode1"
    via: "next"
    to: "EndNode1"
    into: "in"
  - from: "StartNode2"
    via: "next"
    to: "GetSyndicationByUUID1"
    into: "in"
  - from: "StartNode3"
    via: "next"
    to: "EndNode2"
    into: "in"
  - from: "StartNode4"
    via: "next"
    to: "EndNode3"
    into: "in"
