    bindings:
      LocaleInformation: "null"
      ExtensibleObject: "Syndication"
      AttributeName: "\"FileName\""
  - id: "RemoveCustomAttribute6"
    type: "pipelet"
    ref: "RemoveCustomAttribute"
    bindings:
      LocaleInformation: "null"
      ExtensibleObject: "Syndication"
      AttributeName: "\"ShippingCosts\""
  - id: "RemoveWebForm1"
    type: "pipelet"
    ref: "RemoveWebForm"
    config:
      webform-id: "SoqueroDataFeedWebForm"
  - id: "UpdateCustomAttributes1"
    type: "pipelet"
    ref: "UpdateCustomAttributes"
    config:
      Attribute_1_Name: "FileName"
      Attribute_1_Type: "String"
      Attribute_10_Name: "CompressionLevel"
      Attribute_10_Type: "String"
      Attribute_2_Name: "LocaleID"
      Attribute_2_Type: "String"
      Attribute_3_Name: "CurrencyMnemonic"
      Attribute_3_Type: "String"
      Attribute_4_Name: "ShippingCosts"
      Attribute_4_Type: "String"
      Attribute_5_Name: "LogoLink"
      Attribute_5_Type: "String"
    bindings:
      Attribute_1_Value: "SoqueroDataFeedWebForm_FileName"
      ExtensibleObject: "Syndication"
      Attribute_10_Value: "SoqueroDataFeedWebForm_CompressionLevel"
      Attribute_2_Value: "SoqueroDataFeedWebForm_LocaleID"
      Attribute_3_Value: "SoqueroDataFeedWebForm_CurrencyMnemonic"
      Attribute_4_Value: "SoqueroDataFeedWebForm_ShippingCosts"
      Attribute_5_Value: "SoqueroDataFeedWebForm_LogoLink"
  - id: "UpdateCustomAttributes5"
    type: "pipelet"
    ref: "UpdateCustomAttributes"
    config:
      Attribute_1_Name: "FileName"
      Attribute_1_Type: "String"
    bindings:
      Attribute_1_Value: "NewFileName"
      ExtensibleObject: "Syndication"
  - id: "UpdateWebForm2"
    type: "pipelet"
    ref: "UpdateWebForm"
    config:
      mode: "update"
      webform-id: "SoqueroDataFeedWebForm"
    bindings:
      WebForm: "SoqueroDataFeedWebForm"
  - id: "ValidateWebForm2"
    type: "pipelet"
    ref: "ValidateWebForm"
    bindings:
      WebForm: "SoqueroDataFeedWebForm"

