flow: "ViewChannelOutboundSyndicationSoqueroDataFeedConfiguration"
kind: "view"

entries:
  - id: "StartNode1"
    name: "Update"
    mode: "private"
    strict: true
    inputs:
      - key: "Syndication"
        type: "com.intershop.component.foundation.capi.syndication.Syndication"
        required: true
      - key: "SoqueroDataFeedWebForm"
        type: "com.intershop.beehive.core.capi.request.WebForm"
        required: false
      - key: "SoqueroDataFeedWebForm_FileName"
        type: "java.lang.String"
        required: false
      - key: "SoqueroDataFeedWebForm_CompressionLevel"
        type: "java.lang.String"
        required: false
      - key: "SoqueroDataFeedWebForm_LocaleID"
        type: "java.lang.String"
        required: false
      - key: "SoqueroDataFeedWebForm_CurrencyMnemonic"
        type: "java.lang.String"
        required: false
      - key: "SoqueroDataFeedWebForm_ShippingCosts"
        type: "java.lang.String"
        required: false
      - key: "SoqueroDataFeedWebForm_LogoLink"
        type: "java.lang.String"
        required: false
  - id: "StartNode2"
    name: "Edit"
    mode: "private"
    strict: false
    inputs:
      []
  - id: "StartNode3"
    name: "Remove"
    mode: "private"
    strict: true
    inputs:
      - key: "Syndication"
        type: "com.intershop.component.foundation.capi.syndication.Syndication"
        required: true
  - id: "StartNode4"
    name: "CreateWebForm"
    mode: "private"
    strict: true
    inputs:
      []

steps:
  - id: "CallNode1"
    type: "call"
    ref: "ViewChannelOutboundSyndicationSoqueroDataFeedConfiguration-CreateWebForm"
  - id: "CallNode2"
    type: "call"
    ref: "ViewChannelOutboundSyndicationSoqueroDataFeedConfiguration-CreateWebForm"
  - id: "CallNode3"
    type: "call"
    ref: "ProcessChannelOutboundSyndication-EnforceAppropriateFileExtension"
    bindings:
      CompressionLevel: "SoqueroDataFeedWebForm_CompressionLevel"
      FileName: "SoqueroDataFeedWebForm_FileName"
  - id: "CreateWebForm1"
    type: "pipelet"
    ref: "CreateWebForm"
    config:
      webform-id: "SoqueroDataFeedWebForm"
      param.1.name: "FileName"
      param.1.rule: "^[^.\\\\/:*?<>|\\s]([^\\\\/:*?<>|\\s]*[^.\\\\/:*?<>|\\s])?$"
      param.1.required: true
      param.2.name: "CompressionLevel"
      param.2.rule: "^[0-9]$"
      param.2.required: true
      param.3.name: "LocaleID"
      param.3.rule: ""
      param.3.required: true
      param.4.name: "CurrencyMnemonic"
      param.4.rule: ""
      param.4.required: false
      param.5.name: "ShippingCosts"
      param.5.rule: ""
      param.5.required: false
      param.6.name: "LogoLink"
      param.6.rule: ""
      param.6.required: false
    bindings:
      WebForm: "SoqueroDataFeedWebForm"
  - id: "DetermineLocales1"
    type: "pipelet"
    ref: "DetermineLocales"
  - id: "EndNode1"
    type: "end"
    strict: true
    outputs:
      - key: "SoqueroDataFeedWebForm"
        type: "com.intershop.beehive.core.capi.request.WebForm"
        guaranteed: false
  - id: "EndNode2"
    type: "end"
    strict: true
  - id: "EndNode3"
    type: "end"
    strict: true
    outputs:
      - key: "SoqueroDataFeedWebForm"
        type: "com.intershop.beehive.core.capi.request.WebForm"
        guaranteed: false
  - id: "GetCurrencies1"
    type: "pipelet"
    ref: "GetCurrencies"
    config:
      Method: "Active Currencies"
    bindings:
      Domain: "OrganizationDomain"
  - id: "GetSyndicationByUUID1"
    type: "pipelet"
    ref: "GetSyndicationByUUID"
  - id: "GetWebForm1"
    type: "pipelet"
    ref: "GetWebForm"
    config:
      webform-id: "SoqueroDataFeedWebForm"
    bindings:
      WebForm: "SoqueroDataFeedWebForm"
  - id: "GetWebForm2"
    type: "pipelet"
    ref: "GetWebForm"
    config:
      webform-id: "SoqueroDataFeedWebForm"
    bindings:
      WebForm: "SoqueroDataFeedWebForm"
  - id: "InteractionNode1"
    type: "interaction"
  - id: "JoinNode1"
    type: "join"
  - id: "JoinNode2"
    type: "join"
  - id: "JoinNode3"
    type: "join"
  - id: "RemoveCustomAttribute1"
    type: "pipelet"
    ref: "RemoveCustomAttribute"
    bindings:
      LocaleInformation: "null"
      ExtensibleObject: "Syndication"
      AttributeName: "\"CompressionLevel\""
  - id: "RemoveCustomAttribute2"
    type: "pipelet"
    ref: "RemoveCustomAttribute"
    bindings:
      LocaleInformation: "null"
      ExtensibleObject: "Syndication"
      AttributeName: "\"LocaleID\""
  - id: "RemoveCustomAttribute3"
