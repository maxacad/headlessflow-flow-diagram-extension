flow: "ViewCheckoutGifting"
kind: "view"

entries:
  - id: "StartNode1"
    name: "Start"
    mode: "private"
    strict: false
    inputs:
      []
  - id: "StartNode2"
    name: "Continue"
    mode: "private"
    strict: false
    inputs:
      []
  - id: "StartNode3"
    name: "Dispatch"
    mode: "private"
    strict: false
    inputs:
      []
  - id: "StartNode4"
    name: "Prefix"
    mode: "private"
    strict: false
    inputs:
      []

steps:
  - id: "CallNode0"
    type: "call"
    ref: "ProcessCart-Calculate"
    bindings:
      Cart: "CurrentCart"
  - id: "CallNode1"
    type: "call"
    ref: "ViewCheckoutGifting-Prefix"
  - id: "CallNode10"
    type: "call"
    ref: "ProcessCheckoutGifting-GenerateForm"
  - id: "CallNode11"
    type: "call"
    ref: "ProcessCheckoutGifting-SetMergedProductLineItems"
  - id: "CallNode12"
    type: "call"
    ref: "ProcessCheckoutGifting-GetSplitProductLineItems"
  - id: "CallNode13"
    type: "call"
    ref: "ProcessCheckoutGifting-GetSplitProductLineItems"
  - id: "CallNode15"
    type: "call"
    ref: "ProcessGiftingPreferences-GetGiftingPreferences"
    bindings:
      PreferenceDomain: "CurrentOrganization:OwningDomain"
  - id: "CallNode16"
    type: "call"
    ref: "FireTrackingEvents-View"
    bindings:
      PageType: "\"checkout\""
      PageName: "\"gifting\""
  - id: "CallNode2"
    type: "call"
    ref: "ViewCheckoutGifting-Prefix"
  - id: "CallNode3"
    type: "call"
    ref: "ViewCheckout-Prefix"
  - id: "CallNode4"
    type: "call"
    ref: "ProcessCheckoutGifting-GetAllGiftMessages"
  - id: "CallNode5"
    type: "call"
    ref: "ProcessCheckoutGifting-UpdatePackSlipMessages"
  - id: "CallNode6"
    type: "call"
    ref: "ProcessCheckoutGifting-UpdateGiftWrap"
  - id: "CallNode7"
    type: "call"
    ref: "ProcessCheckoutGifting-UpdateGiftMessage"
  - id: "CallNode8"
    type: "call"
    ref: "ProcessCheckoutGifting-GetAllGiftWraps"
  - id: "CallNode9"
    type: "call"
    ref: "ProcessCheckoutGifting-ValidateForm"
  - id: "DecisionNode1"
    type: "decision"
    condition: "SplittingSubform:SplitInfoMapID:Value"
  - id: "DispatchFormAction1"
    type: "pipelet"
    ref: "DispatchFormAction"
    config:
      OutValue_0: "ViewCheckoutGifting-Continue"
    bindings:
      Key_0: "continue"
      SelectionKey: "JumpTarget"
  - id: "EndNode1"
    type: "end"
    strict: false
  - id: "JoinNode1"
    type: "join"
  - id: "JoinNode2"
    type: "join"
  - id: "Jump1"
    type: "jump"
  - id: "JumpNode1"
    type: "jump"
    ref: "ViewCheckoutPayment-Start"
  - id: "JumpNode2"
    type: "jump"
    ref: "ViewCheckoutGifting-Start"
  - id: "JumpNode4"
    type: "jump"
    ref: "ViewPage-Start"
  - id: "KeyMapper15"
    type: "pipelet"
    ref: "KeyMapper"
    config:
      ValueType: "Dictionary Value"
    bindings:
      InValue_1: "CurrentRequest:PipelineDictionary"
      InValue_3: "\"systempage.checkout.gifting.pagelet2-systempage.checkout.gifting\""
      InValue_2: "\"checkout/gifting/CheckoutGifting\""
      OutValue_1: "Dictionary"
      OutValue_3: "PageletEntryPointID"
      OutValue_2: "WorkingTemplate"
  - id: "KeyMapper2"
    type: "pipelet"
    ref: "KeyMapper"
    bindings:
      InValue_1: "GiftingForm:get(\"Splitting\")"
      OutValue_1: "SplittingSubform"
  - id: "VerifyInteger2"
    type: "pipelet"
    ref: "VerifyInteger"
    bindings:
      LocalizedString: "\"2\""
      IntegerObject: "CurrentStep"

links:
  - from: "CallNode0"
    via: "next"
    to: "KeyMapper15"
    into: "in"
  - from: "CallNode10"
    via: "next"
    to: "JoinNode1"
    into: "in1"
  - from: "CallNode11"
    via: "next"
    to: "JumpNode1"
    into: "in"
  - from: "CallNode12"
    via: "next"
    to: "CallNode10"
    into: "in"
  - from: "CallNode13"
    via: "next"
    to: "CallNode9"
    into: "in"
  - from: "CallNode15"
    via: "next"
    to: "EndNode1"
    into: "in"
  - from: "CallNode16"
    via: "next"
    to: "CallNode1"
    into: "in"
  - from: "CallNode1"
    via: "next"
    to: "CallNode12"
    into: "in"
  - from: "CallNode2"
    via: "next"
    to: "CallNode13"
    into: "in"
  - from: "CallNode3"
    via: "next"
    to: "VerifyInteger2"
    into: "in"
  - from: "CallNode4"
    via: "next"
    to: "JumpNode4"
    into: "in"
  - from: "CallNode5"
    via: "next"
    to: "CallNode6"
    into: "in"
  - from: "CallNode6"
    via: "next"
    to: "CallNode7"
    into: "in"
  - from: "CallNode7"
    via: "next"
    to: "CallNode11"
    into: "in"
  - from: "CallNode8"
    via: "next"
    to: "CallNode4"
    into: "in"
  - from: "CallNode9"
    via: "ERROR"
    to: "JoinNode1"
    into: "in1"
  - from: "CallNode9"
    via: "next"
    to: "KeyMapper2"
    into: "in"
  - from: "DecisionNode1"
    via: "no"
    to: "CallNode5"
    into: "in"
  - from: "DecisionNode1"
    via: "yes"
    to: "JoinNode2"
    into: "in1"
  - from: "DispatchFormAction1"
    via: "error"
    to: "JumpNode2"
    into: "in"
  - from: "DispatchFormAction1"
    via: "next"
    to: "Jump1"
    into: "in"
  - from: "JoinNode1"
    via: "next"
    to: "JoinNode2"
    into: "in1"
  - from: "JoinNode2"
    via: "next"
    to: "CallNode0"
    into: "in"
  - from: "KeyMapper15"
    via: "next"
    to: "CallNode8"
    into: "in"
  - from: "KeyMapper2"
    via: "next"
    to: "DecisionNode1"
    into: "in"
  - from: "StartNode1"
    via: "next"
    to: "CallNode16"
    into: "in"
  - from: "StartNode2"
    via: "next"
    to: "CallNode2"
    into: "in"
  - from: "StartNode3"
