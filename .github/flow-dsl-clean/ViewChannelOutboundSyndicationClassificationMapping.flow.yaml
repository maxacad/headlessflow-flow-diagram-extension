    config:
      Key: "SyndicationRule"
      RemoveFormValues: false
  - id: "UpdateCustomAttribute1"
    type: "pipelet"
    ref: "UpdateCustomAttribute"
    config:
      DefaultAttributeName: "ClassificationCatalogUUID"
      DefaultAttributeType: "MultipleString"
    bindings:
      ExtensibleObject: "SyndicationRule:SourceSyndicationDataDeclaration"
      AttributeValue: "SelectedClassificationCatalogUUIDs"
      AttributeName: "null"
      AttributeType: "null"
      LocaleInformation: "null"

