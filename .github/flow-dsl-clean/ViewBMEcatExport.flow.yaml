flow: "ViewBMEcatExport"
kind: "view"

entries:
  - id: "Start1"
    name: "Export"
    mode: "private"
    strict: false
    inputs:
      []
  - id: "Start2"
    name: "SelectCatalog"
    mode: "private"
    strict: false
    inputs:
      []
  - id: "Start4"
    name: "GetCategories"
    mode: "private"
    strict: false
    inputs:
      []
  - id: "Start5"
    name: "GetProducts"
    mode: "private"
    strict: false
    inputs:
      []
  - id: "StartNode1"
    name: "Dispatch"
    mode: "private"
    strict: false
    inputs:
      []
  - id: "StartNode2"
    name: "GetLocale"
    mode: "private"
    strict: false
    inputs:
      []
  - id: "StartNode3"
    name: "OverwriteFile"
    mode: "private"
    strict: false
    inputs:
      []
  - id: "StartNode4"
    name: "CancelOverwriteFile"
    mode: "private"
    strict: false
    inputs:
      []

steps:
  - id: "Call1"
    type: "call"
    ref: "ViewBMEcatExport-GetProducts"
  - id: "Call2"
    type: "call"
    ref: "ProcessImpexJob-Create"
  - id: "Call3"
    type: "call"
    ref: "ViewBMEcatExport-GetCategories"
  - id: "CallNode1"
    type: "call"
    ref: "ViewBMEcatExport-GetLocale"
  - id: "CallNode2"
    type: "call"
    ref: "ViewBMEcatExport-GetLocale"
  - id: "CallNode3"
    type: "call"
    ref: "DetermineRepositories-All"
  - id: "CallNode4"
    type: "call"
    ref: "ProcessImpexJob-IsFilenameTaken"
    bindings:
      Domain: "OrganizationDomain"
      Filename: "BMEcatExportConfiguration:ExportFile:Value"
  - id: "CallNode5"
    type: "call"
    ref: "ViewBMEcatExport-GetLocale"
  - id: "CallNode6"
    type: "call"
    ref: "ViewBMEcatExport-GetLocale"
  - id: "CreateWebForm1"
    type: "pipelet"
    ref: "CreateWebForm"
    config:
      param.1.name: "ExportFile"
      param.1.required: true
      param.1.rule: "^[^.\\\\/:*?<>|\\s]([^\\\\/:*?<>|\\s]*[^.\\\\/:*?<>|\\s])?$"
      param.2.name: "CatalogDomainName"
      param.2.required: true
      webform-id: "BMEcatExportConfiguration"
      param.2.rule: ""
    bindings:
      WebForm: "BMEcatExportConfiguration"
  - id: "Decision10"
    type: "decision"
    condition: "Repositories"
  - id: "Decision6"
    type: "decision"
    condition: "Binding:ProductBindingType"
  - id: "DetermineLocales1"
    type: "pipelet"
    ref: "DetermineLocales"
  - id: "End1"
    type: "end"
    strict: false
  - id: "End13"
    type: "end"
    strict: false
  - id: "End2"
    type: "end"
    strict: false
  - id: "EndNode1"
    type: "end"
    strict: false
  - id: "ExecutePageableQuery1"
    type: "pipelet"
    ref: "ExecutePageableQuery"
    config:
      ParameterName_01: "Domain"
      Datasource: "default"
      QueryName: "catalog/GetCategories"
      DefaultPageSize: 1000000
    bindings:
      ParameterValue_01: "Catalog:CatalogDomain"
      SearchResult: "Categories"
  - id: "ExecutePageableQuery2"
    type: "pipelet"
    ref: "ExecutePageableQuery"
    config:
      ParameterName_01: "Repositories"
      Datasource: "default"
      QueryName: "product/GetExpAssignedProducts"
      DefaultPageSize: 1000000
      ParameterName_02: "Category"
    bindings:
      ParameterValue_01: "Repositories"
      SearchResult: "Products"
      ParameterValue_02: "Category"
  - id: "ExecutePageableQuery3"
    type: "pipelet"
    ref: "ExecutePageableQuery"
    config:
      ParameterName_01: "Repositories"
      Datasource: "default"
      QueryName: "product/GetImpAssignedProducts"
      DefaultPageSize: 1000000
      ParameterName_02: "LocaleInformation"
      ParameterName_03: "BindingValue"
      ParameterName_04: "BindingAttribute"
    bindings:
      ParameterValue_01: "Repositories"
      SearchResult: "Products"
      ParameterValue_02: "Locale"
      ParameterValue_03: "Category:ProductBindingValue"
      ParameterValue_04: "Category:ProductBindingAttribute"
  - id: "GetCatalogByDomain1"
    type: "pipelet"
    ref: "GetCatalogByDomain"
    bindings:
      CatalogDomainName: "BMEcatExportConfiguration_CatalogDomainName"
  - id: "GetLocale1"
    type: "pipelet"
    ref: "GetLocale"
    config:
      LocaleFallback: "Session Locale"
  - id: "GetProductBinding3"
    type: "pipelet"
    ref: "GetProductBinding"
    bindings:
      Category: "Catalog:Root"
  - id: "GetWebForm1"
    type: "pipelet"
    ref: "GetWebForm"
    config:
      webform-id: "BMEcatExportConfiguration"
    bindings:
      WebForm: "BMEcatExportConfiguration"
  - id: "GetWebForm2"
    type: "pipelet"
    ref: "GetWebForm"
    config:
      webform-id: "BMEcatExportConfiguration"
    bindings:
      WebForm: "BMEcatExportConfiguration"
  - id: "GetWebForm3"
    type: "pipelet"
    ref: "GetWebForm"
    config:
      webform-id: "BMEcatExportConfiguration"
    bindings:
      WebForm: "BMEcatExportConfiguration"
  - id: "InteractionEnd2"
    type: "interaction"
  - id: "Join24"
    type: "join"
  - id: "Join3"
    type: "join"
  - id: "JoinNode1"
    type: "join"
  - id: "JoinNode2"
    type: "join"
  - id: "JoinNode3"
    type: "join"
  - id: "JoinNode4"
    type: "join"
  - id: "JoinNode5"
    type: "join"
  - id: "JoinNode6"
    type: "join"
  - id: "Jump1"
    type: "jump"
    ref: "ViewCatalogImpex-Status"
  - id: "JumpNode1"
    type: "jump"
    ref: "SecureJump-Start"
  - id: "KeyMapper1"
    type: "pipelet"
    ref: "KeyMapper"
    bindings:
      InValue_1: "OrganizationDomain"
      InValue_2: "OrganizationDomain"
      OutValue_1: "ProcessOwningDomain"
      OutValue_2: "ProcessExecutionDomain"
  - id: "KeyMapper2"
    type: "pipelet"
    ref: "KeyMapper"
    config:
      ValueType: "Form Value"
    bindings:
      InValue_1: "Categories:ID"
      OutValue_1: "CategoriesID"
      InValue_3: "BMEcatExportConfiguration_ExportFile"
      OutValue_3: "SelectedFile"
      InValue_2: "Products:ID"
      OutValue_2: "ProductsID"
      InValue_4: "Locale:LocaleID"
      OutValue_4: "LocaleId"
      InValue_5: "CurrentOrganization:UUID"
      InValue_6: "Catalog:UUID"
      OutValue_6: "CatalogUUID"
      OutValue_5: "SupplyingOrganizationUUID"
  - id: "KeyMapper3"
    type: "pipelet"
    ref: "KeyMapper"
    bindings:
      InValue_1: "Catalog:Root"
      OutValue_1: "Category"
  - id: "KeyMapper4"
    type: "pipelet"
    ref: "KeyMapper"
    config:
      ValueType: "Form Value"
    bindings:
      OutValue_1: "ProcessPipelineName"
      InValue_1: "\"ProcessBMEcatExport\""
      OutValue_2: "ProcessPipelineStartNode"
      InValue_2: "\"Export\""
      InValue_4: "\"ProcessCatalogImpex\""
      OutValue_4: "JobName"
  - id: "Pipelet1"
    type: "pipelet"
    ref: "DispatchFormAction"
    config:
      OutValue_0: "ViewBMEcatExport-SelectCatalog"
      OutValue_1: "ViewBMEcatExport-Export"
      OutValue_2: "ViewCatalogImpex-Status"
      OutValue_3: "ViewBMEcatExport-OverwriteFile"
      OutValue_4: "ViewBMEcatExport-CancelOverwriteFile"
    bindings:
      Key_0: "Start"
      Key_1: "Export"
      Key_2: "Cancel"
      SelectionKey: "JumpTarget"
      Key_3: "Overwrite"
      Key_4: "CancelOverwrite"
  - id: "Pipelet4"
    type: "pipelet"
    ref: "GetCatalogs"
    config:
      CatalogType: "Product Catalog"
      OnlineOnly: "False"
      ProxyFilter: "ON - Exclude Proxy Catalogs"
    bindings:
      Catalogs: "Catalogs"
  - id: "PrepareApplicationView2"
    type: "pipelet"
    ref: "PrepareApplicationView"
    config:
      SelectedMenuItem: "ImportExport"
      WorkingTemplate: "impex/BMEcatExportSelectCatalog"
  - id: "RemoveDictionaryValue1"
    type: "pipelet"
    ref: "RemoveDictionaryValue"
    config:
      RemoveFormValues: false
      Key: "Repositories"
  - id: "SetDictionaryValue1"
    type: "pipelet"
    ref: "SetDictionaryValue"
    config:
      Name: "JumpTarget"
      Value: "ViewCatalogImpex-Status"
      ValueType: "Dictionary Value"
  - id: "SetDictionaryValue4"
    type: "pipelet"
    ref: "SetDictionaryValue"
    config:
      Name: "FILENAME_ALREADY_IN_USE"
      Value: true
  - id: "UpdateWebForm1"
    type: "pipelet"
    ref: "UpdateWebForm"
    config:
      mode: "update"
      webform-id: "BMEcatExportConfiguration"
    bindings:
      WebForm: "BMEcatExportConfiguration"
  - id: "UpdateWebForm2"
    type: "pipelet"
    ref: "UpdateWebForm"
    config:
      mode: "update"
      webform-id: "BMEcatExportConfiguration"
    bindings:
      WebForm: "BMEcatExportConfiguration"
  - id: "ValidateWebForm1"
    type: "pipelet"
    ref: "ValidateWebForm"
    bindings:
      WebForm: "BMEcatExportConfiguration"
  - id: "ValidateWebForm2"
    type: "pipelet"
    ref: "ValidateWebForm"
    bindings:
      WebForm: "BMEcatExportConfiguration"

