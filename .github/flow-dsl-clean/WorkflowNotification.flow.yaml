flow: "WorkflowNotification"
kind: "process"

entries:
  - id: "Start1"
    name: "Start"
    mode: "private"
    strict: false
    inputs:
      []

steps:
  - id: "DetermineActivitiesForNotification1"
    type: "pipelet"
    ref: "DetermineActivitiesForNotification"
  - id: "DetermineMailNotificationData1"
    type: "pipelet"
    ref: "DetermineMailNotificationData"
    config:
      DefaultEmailFrom: "WorkflowNotification@test.intershop.de"
      Mode: "Multiple"
  - id: "DetermineUsersForNotification1"
    type: "pipelet"
    ref: "DetermineUsersForNotification"
  - id: "End1"
    type: "end"
  - id: "Loop2"
    type: "loop"
  - id: "SendMail1"
    type: "pipelet"
    ref: "SendMail"
  - id: "SetActivityNotificationDone1"
    type: "pipelet"
    ref: "SetActivityNotificationDone"

links:
  - from: "DetermineMailNotificationData1"
    via: "next"
    to: "SendMail1"
    into: "in"
  - from: "DetermineUsersForNotification1"
    via: "next"
    to: "DetermineMailNotificationData1"
    into: "in"
  - from: "SendMail1"
    via: "next"
    to: "SetActivityNotificationDone1"
    into: "in"
  - from: "Start1"
    via: "next"
    to: "DetermineActivitiesForNotification1"
    into: "in"
  - from: "SetActivityNotificationDone1"
    via: "next"
    to: "Loop2"
    into: "loop"
  - from: "Loop2"
    via: "next"
    to: "End1"
    into: "in"
  - from: "DetermineActivitiesForNotification1"
    via: "next"
    to: "Loop2"
    into: "in"
  - from: "Loop2"
    via: "do"
    to: "DetermineUsersForNotification1"
    into: "in"
