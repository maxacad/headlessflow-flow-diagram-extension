flow: "ProcessCheckoutAddresses"
kind: "process"

entries:
  - id: "StartNode1"
    name: "DeleteAddress"
    mode: "private"
    strict: true
    inputs:
      - key: "AddressID"
        type: "java.lang.String"
        required: true
      - key: "CurrentUser"
        type: "com.intershop.beehive.core.capi.user.User"
        required: true
      - key: "CurrentCart"
        type: "com.intershop.beehive.bts.capi.orderprocess.basket.Basket"
        required: true
  - id: "StartNode10"
    name: "CheckAddressOwner"
    mode: "private"
    strict: true
    inputs:
      - key: "AddressID"
        type: "java.lang.String"
        required: true
      - key: "CurrentUser"
        type: "com.intershop.beehive.core.capi.user.User"
        required: true
      - key: "CurrentCart"
        type: "com.intershop.beehive.bts.capi.orderprocess.basket.Basket"
        required: true
  - id: "StartNode11"
    name: "GenerateAddressWebFormForAddress"
    mode: "private"
    strict: true
    inputs:
      - key: "Address"
        type: "com.intershop.beehive.core.capi.profile.Address"
        required: true
  - id: "StartNode13"
    name: "CheckDefaultSettings"
    mode: "private"
    strict: true
    inputs:
      - key: "Cart"
        type: "com.intershop.beehive.bts.capi.orderprocess.basket.Basket"
        required: true
  - id: "StartNode14"
    name: "GetRegistrationForm"
    mode: "private"
    strict: true
    inputs:
      - key: "CurrentDomain"
        type: "com.intershop.beehive.core.capi.domain.Domain"
        required: true
  - id: "StartNode15"
    name: "DefaultSettings"
    mode: "private"
    strict: true
    inputs:
      - key: "Cart"
        type: "com.intershop.beehive.bts.capi.orderprocess.basket.Basket"
        required: true
      - key: "User"
        type: "com.intershop.beehive.core.capi.user.User"
        required: true
  - id: "StartNode2"
    name: "UpdateAddress"
    mode: "private"
    strict: true
    inputs:
      - key: "AddressID"
        type: "java.lang.String"
        required: true
      - key: "CurrentUser"
        type: "com.intershop.beehive.core.capi.user.User"
        required: true
      - key: "UpdateAddressWebForm"
        type: "com.intershop.beehive.core.capi.webform.Form"
        required: true
      - key: "CurrentCart"
        type: "com.intershop.beehive.bts.capi.orderprocess.basket.Basket"
        required: true
      - key: "EditShippingAddress"
        type: "java.lang.String"
        required: false
      - key: "EditBillingAddress"
        type: "java.lang.String"
        required: false
  - id: "StartNode22"
    name: "GetLoginForm"
    mode: "private"
    strict: true
    inputs:
      - key: "CurrentDomain"
        type: "com.intershop.beehive.core.capi.domain.Domain"
        required: true
  - id: "StartNode23"
    name: "EmailOptInt"
    mode: "private"
    strict: true
    inputs:
      - key: "BasketEmailOptIn"
        type: "java.lang.String"
        required: true
      - key: "EmailAddress"
        type: "com.intershop.beehive.core.capi.webform.Form"
        required: true
      - key: "CurrentDomain"
        type: "com.intershop.beehive.core.internal.domain.DomainPO"
        required: true
  - id: "StartNode3"
    name: "SetAsShippingAddress"
    mode: "private"
    strict: true
    inputs:
      - key: "CurrentUser"
        type: "com.intershop.beehive.core.capi.user.User"
        required: true
      - key: "CurrentCart"
        type: "com.intershop.beehive.bts.capi.orderprocess.basket.Basket"
        required: true
      - key: "AddressID"
        type: "java.lang.String"
        required: true
  - id: "StartNode4"
    name: "SetReturningCustomerAddresses"
    mode: "private"
    strict: true
    inputs:
      - key: "User"
        type: "com.intershop.beehive.core.capi.user.User"
        required: true
      - key: "Cart"
        type: "com.intershop.beehive.bts.capi.orderprocess.basket.Basket"
        required: true
  - id: "StartNode5"
    name: "ApplyAddressSuggest"
    mode: "private"
    strict: true
    inputs:
      - key: "AddressID"
        type: "java.lang.String"
        required: true
      - key: "CurrentUser"
        type: "com.intershop.beehive.core.capi.user.User"
        required: true
      - key: "AddressSuggestID"
        type: "java.lang.String"
        required: true
      - key: "CartBO"
        type: "com.intershop.component.basket.capi.BasketBO"
        required: true
      - key: "CurrentCart"
        type: "com.intershop.beehive.bts.capi.orderprocess.basket.Basket"
        required: true
      - key: "ServiceConfigurationBORepository"
        type: "com.intershop.component.service.capi.service.ServiceConfigurationBORepository"
        required: true
  - id: "StartNode6"
    name: "CreateShipToAddress"
    mode: "private"
    strict: true
    inputs:
      - key: "Cart"
        type: "com.intershop.beehive.bts.capi.orderprocess.basket.Basket"
        required: true
      - key: "ShipToAddressForm"
        type: "com.intershop.beehive.core.capi.webform.Form"
        required: true
      - key: "CurrentUser"
        type: "com.intershop.beehive.core.capi.user.User"
        required: true
  - id: "StartNode7"
    name: "CreateInvoiceToAddress"
    mode: "private"
    strict: true
    inputs:
      - key: "Cart"
        type: "com.intershop.beehive.bts.capi.orderprocess.basket.Basket"
        required: true
      - key: "InvoiceToAddressForm"
        type: "com.intershop.beehive.core.capi.webform.Form"
        required: true
      - key: "CurrentUser"
        type: "com.intershop.beehive.core.capi.user.User"
        required: true
      - key: "Email"
        type: "com.intershop.beehive.core.capi.webform.Form"
        required: false
  - id: "StartNode8"
    name: "GetAddressSuggest"
    mode: "private"
    strict: true
    inputs:
      - key: "Address"
        type: "com.intershop.beehive.core.capi.profile.Address"
        required: true
      - key: "AddressSuggestID"
        type: "java.lang.String"
        required: true
      - key: "CartBO"
        type: "com.intershop.component.basket.capi.BasketBO"
        required: true
      - key: "ServiceConfigurationBORepository"
        type: "com.intershop.component.service.capi.service.ServiceConfigurationBORepository"
        required: true
  - id: "StartNode9"
    name: "SetAsBillingAddress"
    mode: "private"
    strict: true
    inputs:
      - key: "CurrentUser"
        type: "com.intershop.beehive.core.capi.user.User"
        required: false
      - key: "AddressID"
        type: "java.lang.String"
        required: true
      - key: "CurrentCart"
        type: "com.intershop.beehive.bts.capi.orderprocess.basket.Basket"
        required: true

steps:
  - id: "CallNode1"
    type: "call"
    ref: "ProcessCheckoutAddresses-CheckAddressOwner"
  - id: "CallNode10"
    type: "call"
    ref: "ProcessWebforms-CreateCountrySpecificForm"
    bindings:
      CountryCode: "Address:CountryCode"
      WebformPrefix: "\"Address\""
      ConfigurationPrefix: "\"WebFormSelectorSuffix\""
      FormName: "\"address\""
  - id: "CallNode11"
    type: "call"
    ref: "ProcessCheckoutAddresses-GetAddressSuggest"
  - id: "CallNode12"
    type: "call"
    ref: "ProcessCheckoutAddresses-GetAddressSuggest"
  - id: "CallNode13"
    type: "call"
    ref: "ProcessCheckoutAddresses-CheckAddressOwner"
  - id: "CallNode14"
    type: "call"
    ref: "CustomAddressAttributes-Add"
    bindings:
      Address: "InvoiceToAddress"
      AddressForm: "InvoiceToAddressForm"
  - id: "CallNode15"
    type: "call"
    ref: "ProcessCheckoutAddresses-CheckAddressOwner"
  - id: "CallNode16"
    type: "call"
    ref: "ProcessOrders-SetNotificationEMail"
    bindings:
      MailTo: "CurrentUser:Profile:DefaultAddress:EMail"
      LineItemCtnr: "Cart"
  - id: "CallNode19"
    type: "call"
    ref: "CustomAddressAttributes-Add"
    bindings:
      Address: "CreatedAddress"
      AddressForm: "InvoiceToAddressForm"
  - id: "CallNode2"
    type: "call"
    ref: "ProcessOrders-SetNotificationEMail"
    bindings:
      MailTo: "Email:Email:Value"
      LineItemCtnr: "Cart"
  - id: "CallNode20"
    type: "call"
    ref: "CustomAddressAttributes-Add"
    bindings:
      Address: "ShipToAddress"
      AddressForm: "ShipToAddressForm"
  - id: "CallNode21"
    type: "call"
    ref: "CustomAddressAttributes-Add"
    bindings:
      Address: "CreatedAddress"
      AddressForm: "ShipToAddressForm"
  - id: "CallNode22"
    type: "call"
    ref: "CustomAddressAttributes-Update"
    bindings:
      AddressForm: "UpdateAddressWebForm"
  - id: "CallNode23"
    type: "call"
    ref: "CustomAddressAttributes-Update"
    bindings:
      AddressForm: "UpdateAddressWebForm"
  - id: "CallNode3"
    type: "call"
    ref: "ProcessCheckoutAddresses-CheckAddressOwner"
  - id: "CallNode37"
    type: "call"
    ref: "ProcessUserAddresses-UpdateDataSheet"
    bindings:
      City: "PreferredAddress:City"
      CountryCode: "PreferredAddress:CountryCode"
      LastName: "PreferredAddress:LastName"
      Street2: "PreferredAddress:Street2"
      Street: "PreferredAddress:Street"
      State: "PreferredAddress:State"
      PostalCode: "PreferredAddress:PostalCode"
      PhoneHome: "PreferredAddress:PhoneHome"
      FirstName: "PreferredAddress:FirstName"
      User: "CurrentUser"
      Title: "PreferredAddress:Title"
  - id: "CallNode4"
    type: "call"
    ref: "ProcessUserAddresses-UpdateDataSheet"
    bindings:
      City: "UpdateAddressWebForm:City:Value"
      CountryCode: "UpdateAddressWebForm:CountryCode:Value"
      LastName: "UpdateAddressWebForm:LastName:Value"
      Street2: "UpdateAddressWebForm:Address2:Value"
      Street: "UpdateAddressWebForm:Address1:Value"
      State: "UpdateAddressWebForm:State:Value"
      PostalCode: "UpdateAddressWebForm:PostalCode:Value"
      PhoneHome: "UpdateAddressWebForm:Phone:Value"
      FirstName: "UpdateAddressWebForm:FirstName:Value"
      User: "CurrentUser"
  - id: "CallNode43"
    type: "call"
    ref: "ProcessUserAccount-GetLoginType"
  - id: "CallNode5"
    type: "call"
    ref: "ProcessAddress-GetAddress"
    bindings:
      Profile: "User:Profile"
  - id: "CallNode55"
    type: "call"
    ref: "ProcessNewsletter-Subscribe"
    bindings:
      Domain: "CurrentDomain"
      Email: "EmailAddress:Email:Value"
  - id: "CallNode6"
    type: "call"
    ref: "ProcessUserAddresses-UpdateDataSheet"
    bindings:
      City: "AddressSuggest:City"
      Country: "AddressSuggest:CountryCode"
      CountryCode: "AddressSuggest:CountryCode"
      LastName: "null"
      Street2: "AddressSuggest:Street2"
      Street: "AddressSuggest:Street"
      State: "AddressSuggest:StateCode"
      PostalCode: "AddressSuggest:ZipCode"
      PhoneHome: "null"
      FirstName: "null"
      User: "CurrentUser"
      Title: "null"
  - id: "CallNode7"
    type: "call"
    ref: "ProcessCheckoutAddresses-CheckAddressOwner"
  - id: "CallNode8"
    type: "call"
    ref: "ProcessCheckoutAddresses-SetReturningCustomerAddresses"
  - id: "CallNode9"
    type: "call"
    ref: "ProcessCheckoutAddresses-CheckDefaultSettings"
  - id: "CheckUserLoggedIn1"
    type: "pipelet"
    ref: "CheckUserLoggedIn"
  - id: "CheckUserLoggedIn2"
    type: "pipelet"
    ref: "CheckUserLoggedIn"
  - id: "CheckUserLoggedIn4"
    type: "pipelet"
    ref: "CheckUserLoggedIn"
  - id: "CheckUserLoggedIn5"
    type: "pipelet"
    ref: "CheckUserLoggedIn"
  - id: "CheckUserLoggedIn6"
    type: "pipelet"
    ref: "CheckUserLoggedIn"
  - id: "CheckUserLoggedIn7"
    type: "pipelet"
    ref: "CheckUserLoggedIn"
  - id: "CheckUserLoggedIn8"
    type: "pipelet"
    ref: "CheckUserLoggedIn"
  - id: "CreateAddress3"
    type: "pipelet"
    ref: "CreateAddress"
    bindings:
      City: "InvoiceToAddressForm:City:Value"
      FirstName: "InvoiceToAddressForm:FirstName:Value"
      LastName: "InvoiceToAddressForm:LastName:Value"
      PhoneHome: "InvoiceToAddressForm:PhoneHome:Value"
      PostalCode: "InvoiceToAddressForm:PostalCode:Value"
      State: "InvoiceToAddressForm:State:Value"
      Street: "InvoiceToAddressForm:Address1:Value"
      Street2: "InvoiceToAddressForm:Address2:Value"
      Profile: "CurrentUser:Profile"
      CountryCode: "InvoiceToAddressForm:CountryCode:Value"
      UseForInvoiceTo: "\"true\""
      UseForShipTo: "\"true\""
      Title: "LocalizedTitle"
      Address: "InvoiceToAddress"
  - id: "CreateAddress4"
    type: "pipelet"
    ref: "CreateAddress"
    bindings:
      City: "ShipToAddressForm:City:Value"
      FirstName: "ShipToAddressForm:FirstName:Value"
      LastName: "ShipToAddressForm:LastName:Value"
      PhoneHome: "ShipToAddressForm:PhoneHome:Value"
      PostalCode: "ShipToAddressForm:PostalCode:Value"
      State: "ShipToAddressForm:State:Value"
      Street: "ShipToAddressForm:Address1:Value"
      Street2: "ShipToAddressForm:Address2:Value"
      Profile: "CurrentUser:Profile"
      CountryCode: "ShipToAddressForm:CountryCode:Value"
      UseForInvoiceTo: "\"true\""
      UseForShipTo: "\"true\""
      Title: "ShipToAddressForm:Title:Value"
      Address: "ShipToAddress"
  - id: "CreateForm3"
    type: "pipelet"
    ref: "CreateForm"
    config:
      FormResource: "RegisterUser"
      FormName: "RegisterUserUsernameForm"
    bindings:
      Form: "RegisterUserForm"
  - id: "CreateForm4"
    type: "pipelet"
    ref: "CreateForm"
    config:
      FormResource: "RegisterUser"
      FormName: "PostCheckoutRegisterForm"
    bindings:
      Form: "RegisterUserForm"
  - id: "CreateForm6"
    type: "pipelet"
    ref: "CreateForm"
    config:
      FormResource: "LoginUser"
      FormName: "ShopLoginForm"
    bindings:
      Form: "LoginForm"
  - id: "CreateStaticAddress1"
    type: "pipelet"
    ref: "CreateStaticAddress"
    config:
      AssignAsInvoiceToAddress: true
      AssignAsShipToAddress: false
      PreserveLineItemShipToAddress: false
    bindings:
      AddressNr: "null"
      City: "InvoiceToAddressForm:City:Value"
      Company: "null"
      CompanyTranscription: "null"
      CountryCode: "InvoiceToAddressForm:CountryCode:Value"
      County: "null"
      Fax: "null"
      FirstName: "InvoiceToAddressForm:FirstName:Value"
      FirstNameTranscription: "null"
      Homepage: "null"
      Honorific: "null"
      JobTitle: "null"
      LastName: "InvoiceToAddressForm:LastName:Value"
      LastNameTranscription: "null"
      Mobile: "null"
      PhoneBusiness: "null"
      PhoneBusinessDirect: "null"
      PhoneHome: "InvoiceToAddressForm:PhoneHome:Value"
      PostalCode: "InvoiceToAddressForm:PostalCode:Value"
      Prefecture: "null"
      Province: "null"
      Region: "null"
      SecondLastName: "null"
      SecondName: "null"
      State: "InvoiceToAddressForm:State:Value"
      Street: "InvoiceToAddressForm:Address1:Value"
      SteetTranscription: "null"
      Street2: "InvoiceToAddressForm:Address2:Value"
      Suffix: "null"
      Title: "LocalizedTitle"
      PostalBox: "null"
      LineItemCtnr: "Cart"
      ProductLineItem: "null"
      StreetTranscription: "null"
      Email: "Email:Email:Value"
      Street3: "InvoiceToAddressForm:Address3:Value"
  - id: "CreateStaticAddress4"
    type: "pipelet"
    ref: "CreateStaticAddress"
    config:
      AssignAsInvoiceToAddress: false
      AssignAsShipToAddress: true
      PreserveLineItemShipToAddress: true
    bindings:
      AddressNr: "null"
      City: "ShipToAddressForm:City:Value"
      Company: "null"
      CompanyTranscription: "null"
      CountryCode: "ShipToAddressForm:CountryCode:Value"
      County: "null"
      Email: "null"
      Fax: "null"
      FirstName: "ShipToAddressForm:FirstName:Value"
      FirstNameTranscription: "null"
      Homepage: "null"
      Honorific: "null"
      JobTitle: "null"
      LastName: "ShipToAddressForm:LastName:Value"
      LastNameTranscription: "null"
      Mobile: "null"
      PhoneBusiness: "null"
      PhoneBusinessDirect: "null"
      PhoneHome: "ShipToAddressForm:PhoneHome:Value"
      PostalCode: "ShipToAddressForm:PostalCode:Value"
      Prefecture: "null"
      Province: "null"
      Region: "null"
      SecondLastName: "null"
      SecondName: "null"
      State: "ShipToAddressForm:State:Value"
      Street: "ShipToAddressForm:Address1:Value"
      SteetTranscription: "null"
      Street2: "ShipToAddressForm:Address2:Value"
      Suffix: "null"
      Title: "ShipToAddressForm:Title:Value"
      PostalBox: "null"
      LineItemCtnr: "Cart"
      ProductLineItem: "null"
      StreetTranscription: "null"
      Street3: "ShipToAddressForm:Address3:Value"
  - id: "DecisionNode1"
    type: "decision"
    condition: "Address:PreferredBilling"
  - id: "DecisionNode10"
    type: "decision"
    condition: "Cart:InvoiceToAddress"
  - id: "DecisionNode11"
    type: "decision"
    condition: "BasketEmailOptIn"
  - id: "DecisionNode12"
    type: "decision"
    condition: "Address:PreferredBilling"
  - id: "DecisionNode15"
    type: "decision"
    condition: "AddressValidation:SuggestedAddresses"
  - id: "DecisionNode17"
    type: "decision"
    condition: "AddressSuggest:Field(\"ID\")"
  - id: "DecisionNode18"
    type: "decision"
    condition: "AddressesChanged"
  - id: "DecisionNode2"
    type: "decision"
    condition: "User:Profile"
  - id: "DecisionNode3"
    type: "decision"
    condition: "CurrentStaticAddress:UUID"
  - id: "DecisionNode4"
    type: "decision"
    condition: "Cart:InvoiceToAddress"
  - id: "DecisionNode5"
    type: "decision"
    condition: "User:Profile"
  - id: "DecisionNode6"
    type: "decision"
    condition: "CurrentUser:Profile"
  - id: "DecisionNode7"
    type: "decision"
    condition: "Cart:InvoiceToAddress"
  - id: "DecisionNode9"
    type: "decision"
    condition: "EmailAddress:Newsletter:FormattedValue"
  - id: "EndNode1"
    type: "end"
    strict: true
  - id: "EndNode10"
    type: "end"
    strict: true
  - id: "EndNode11"
    type: "end"
    strict: true
  - id: "EndNode12"
    type: "end"
    strict: true
  - id: "EndNode13"
    type: "end"
    strict: true
  - id: "EndNode14"
    type: "end"
    strict: true
  - id: "EndNode15"
    type: "end"
    strict: true
    outputs:
      - key: "CurrentCart"
        type: "com.intershop.beehive.bts.capi.orderprocess.basket.Basket"
        guaranteed: true
  - id: "EndNode16"
    type: "end"
    strict: true
  - id: "EndNode17"
    type: "end"
    strict: true
    outputs:
      - key: "LoginForm"
        type: "com.intershop.beehive.core.capi.webform.Form"
        guaranteed: true
  - id: "EndNode18"
    type: "end"
    strict: true
    outputs:
      - key: "Form"
        type: "com.intershop.beehive.core.capi.webform.Form"
        guaranteed: true
      - key: "WebFormFileName"
        type: "java.lang.String"
        guaranteed: true
  - id: "EndNode19"
    type: "end"
    strict: true
    outputs:
      - key: "RegisterUserForm"
        type: "com.intershop.beehive.core.capi.webform.Form"
        guaranteed: true
  - id: "EndNode2"
    type: "end"
    strict: true
    outputs:
      - key: "ShipToAddress"
        type: "com.intershop.beehive.core.capi.profile.Address"
        guaranteed: true
  - id: "EndNode22"
    type: "end"
    strict: true
    outputs:
      - key: "AddressSuggest"
        type: "com.intershop.component.address.capi.AddressBO"
        guaranteed: true
  - id: "EndNode23"
    type: "end"
    strict: true
    outputs:
      - key: "RestrictedItemsMap"
        type: "java.util.Map"
        guaranteed: false
  - id: "EndNode24"
    type: "end"
    strict: true
    outputs:
      - key: "RestrictedItemsMap"
        type: "java.util.Map"
        guaranteed: false
  - id: "EndNode25"
    type: "end"
    strict: true
  - id: "EndNode26"
    type: "end"
    strict: true
  - id: "EndNode3"
    type: "end"
    strict: true
    outputs:
      - key: "InvoiceToAddress"
        type: "com.intershop.beehive.core.capi.profile.Address"
        guaranteed: true
  - id: "EndNode4"
    type: "end"
    strict: true
  - id: "EndNode5"
    type: "end"
    strict: true
  - id: "EndNode6"
    type: "end"
    strict: true
  - id: "EndNode7"
    type: "end"
    strict: true
    outputs:
      - key: "Address"
        type: "com.intershop.beehive.core.capi.profile.Address"
        guaranteed: true
  - id: "EndNode8"
    type: "end"
    strict: true
  - id: "EndNode9"
    type: "end"
    strict: true
    outputs:
      - key: "CurrentCart"
        type: "com.intershop.beehive.bts.capi.orderprocess.basket.Basket"
        guaranteed: true
  - id: "GetAddress1"
    type: "pipelet"
    ref: "GetAddress"
    bindings:
      Profile: "CurrentUser:Profile"
  - id: "GetAddress2"
    type: "pipelet"
    ref: "GetAddress"
    bindings:
      Profile: "CurrentUser:Profile"
  - id: "GetAddress3"
    type: "pipelet"
    ref: "GetAddress"
    bindings:
      Profile: "CurrentUser:Profile"
  - id: "GetAddress4"
    type: "pipelet"
    ref: "GetAddress"
    bindings:
      Profile: "CurrentUser:Profile"
  - id: "GetApplicationBO1"
    type: "pipelet"
    ref: "GetApplicationBO"
  - id: "GetBasketBO1"
    type: "pipelet"
    ref: "GetBasketBO"
    bindings:
      Basket: "CurrentCart"
      BasketBORepository: "ApplicationBO:Extension(\"Basket\"):getBasketBORepository(CurrentCart)"
      BasketBO: "Basket"
  - id: "GetDomainPreference1"
    type: "pipelet"
    ref: "GetDomainPreference"
    config:
      DefaultPreferenceKey: "UserRegistrationUseSimpleAccount"
      Type: "String"
    bindings:
      PreferenceDomain: "CurrentDomain"
      PreferenceKey: "null"
      PreferenceStringValue: "UseSimpleAccount"
  - id: "GetDomainPreference5"
    type: "pipelet"
    ref: "GetDomainPreference"
    config:
      DefaultPreferenceKey: "UserRegistrationUseSimpleAccount"
      Type: "String"
    bindings:
      PreferenceDomain: "CurrentDomain"
      PreferenceKey: "null"
      PreferenceStringValue: "UseSimpleAccount"
  - id: "GetLocalizedTextByKey0"
    type: "pipelet"
