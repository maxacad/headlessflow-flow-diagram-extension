flow: "ViewConfigurationParameterSelectCatalogCategoryLinkType"
kind: "view"

entries:
  - id: "StartNode1"
    name: "GetAvailableTypeCodeDefinitions"
    mode: "private"
    strict: false
    inputs:
      - key: "ChannelRepositoryUUID"
        type: "java.lang.String"
        required: false

steps:
  - id: "EndNode1"
    type: "end"
    strict: false
    outputs:
      - key: "TypeCodeDefinitions"
        type: "java.lang.Object"
        guaranteed: true
  - id: "GetTypeCodeDefinitions1"
    type: "pipelet"
    ref: "GetTypeCodeDefinitions"
    bindings:
      TypeCodeGroups: "TypeCodeDefinitions"
      TypeCodeGroup: "\"CatalogCategoryLink\""
  - id: "TextNode1"
    type: "text"

links:
  - from: "GetTypeCodeDefinitions1"
    via: "next"
    to: "EndNode1"
    into: "in"
  - from: "StartNode1"
    via: "next"
    to: "GetTypeCodeDefinitions1"
    into: "in"
