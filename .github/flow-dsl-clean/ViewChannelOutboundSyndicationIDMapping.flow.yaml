  - from: "GetSyndicationRuleByUUID1"
    via: "next"
    to: "RemoveSyndicationRule1"
    into: "in"
  - from: "Start3"
    via: "next"
    to: "DispatchFormAction1"
    into: "in"
  - from: "DispatchFormAction1"
    via: "next"
    to: "Jump5"
    into: "in"
  - from: "StartNode2"
    via: "next"
    to: "GetSyndicationByUUID2"
    into: "in"
  - from: "GetSyndicationByUUID2"
    via: "next"
    to: "CallNode2"
    into: "in"
  - from: "GetFormSelection2"
    via: "next"
