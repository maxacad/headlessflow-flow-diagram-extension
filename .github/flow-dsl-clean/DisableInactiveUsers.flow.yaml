flow: "DisableInactiveUsers"
kind: "job"

entries:
  - id: "StartNode1"
    name: "Start"
    mode: "private"
    strict: true
    inputs:
      - key: "UnitName"
        type: "java.lang.String"
        required: true
  - id: "StartNode5"
    name: "GetInactivityPeriod"
    mode: "private"
    strict: true
    inputs:
      - key: "Organization"
        type: "com.intershop.component.organization.capi.Organization"
        required: true
  - id: "StartNode6"
    name: "DisableInactiveUsers"
    mode: "private"
    strict: true
    inputs:
      - key: "InactivityPeriod"
        type: "java.lang.Integer"
        required: true
      - key: "Domain"
        type: "com.intershop.beehive.core.capi.domain.Domain"
        required: true
  - id: "StartNode7"
    name: "NotifyImminentInactiveUsers"
    mode: "private"
    strict: true
    inputs:
      - key: "InactivityPeriod"
        type: "java.lang.Integer"
        required: true
      - key: "MailFrom"
        type: "java.lang.String"
        required: true
      - key: "Domain"
        type: "com.intershop.beehive.core.capi.domain.Domain"
        required: true

steps:
  - id: "CalculateDate3"
    type: "pipelet"
    ref: "CalculateDate"
    config:
      CalculationMethod: "Add"
    bindings:
      Date: "InactivityPeriodDate"
      Days: "\"(java.lang.Integer)7\""
      CalculatedDate: "NotificationDate"
  - id: "CalculateDate4"
    type: "pipelet"
    ref: "CalculateDate"
    config:
      CalculationMethod: "Subtract"
    bindings:
      Date: "CurrentDate"
      Days: "InactivityPeriod"
      CalculatedDate: "InactivityPeriodDate"
  - id: "CalculateDate5"
    type: "pipelet"
    ref: "CalculateDate"
    config:
      CalculationMethod: "Subtract"
    bindings:
      Date: "CurrentDate"
      Days: "InactivityPeriod"
      CalculatedDate: "InactivityPeriodDate"
  - id: "CallNode1"
    type: "call"
    ref: "DisableInactiveUsers-DisableInactiveUsers"
    bindings:
      Domain: "OrganizationDomain"
  - id: "CallNode3"
    type: "call"
    ref: "DisableInactiveUsers-NotifyImminentInactiveUsers"
    bindings:
      MailFrom: "Organization:Profile:AddressBook:DefaultAddress:EMail"
      Domain: "OrganizationDomain"
  - id: "CallNode4"
    type: "call"
    ref: "DisableInactiveUsers-GetInactivityPeriod"
  - id: "DecisionNode10"
    type: "decision"
    condition: "User:DefaultAddress:EMail"
  - id: "DecisionNode11"
    type: "decision"
    condition: "InactivityPeriod"
  - id: "DecisionNode2"
    type: "decision"
    condition: "Organization:Profile:AddressBook:DefaultAddress:EMail"
  - id: "DetermineUser1"
    type: "pipelet"
    ref: "DetermineUser"
    bindings:
      UserID: "ProfileToBeDisabled:UUID"
      User: "UserToBeDisabled"
  - id: "DetermineUser2"
    type: "pipelet"
    ref: "DetermineUser"
    bindings:
      UserID: "Profile:UUID"
  - id: "EndNode1"
    type: "end"
    strict: true
  - id: "EndNode13"
    type: "end"
    strict: false
  - id: "EndNode14"
    type: "end"
    strict: true
    outputs:
      - key: "InactivityPeriod"
        type: "java.lang.Integer"
        guaranteed: true
  - id: "EndNode15"
    type: "end"
    strict: true
  - id: "EndNode2"
    type: "end"
    strict: true
  - id: "EndNode3"
    type: "end"
    strict: true
  - id: "ExecuteObjectsQuery1"
    type: "pipelet"
    ref: "ExecuteObjectsQuery"
    config:
      QueryName: "user/GetInactiveUsers"
      ParameterName_01: "DateThreshold"
      ParameterName_02: "Domain"
      ParameterName_03: "DomainID"
    bindings:
      SearchResult: "ProfilesToBeDisabled"
      ParameterValue_01: "InactivityPeriodDate"
      ParameterValue_02: "Domain"
      ParameterValue_03: "OrganizationDomain"
  - id: "ExecuteObjectsQuery2"
    type: "pipelet"
    ref: "ExecuteObjectsQuery"
    config:
      QueryName: "user/GetInactiveUsers"
      ParameterName_01: "DateThreshold"
      ParameterName_02: "Domain"
      ParameterName_03: "DomainID"
    bindings:
      SearchResult: "ProfilesToBeNotified"
      ParameterValue_01: "NotificationDate"
      ParameterValue_02: "Domain"
      ParameterValue_03: "OrganizationDomain"
  - id: "GetCurrentDate2"
    type: "pipelet"
    ref: "GetCurrentDate"
    config:
      OffsetTime: "00:00"
  - id: "GetCurrentDate3"
    type: "pipelet"
    ref: "GetCurrentDate"
    config:
      OffsetTime: "00:00"
  - id: "GetDomainByName1"
    type: "pipelet"
    ref: "GetDomainByName"
    bindings:
      DomainName: "UnitName"
      Domain: "OrganizationDomain"
  - id: "GetDomainPreference2"
    type: "pipelet"
    ref: "GetDomainPreference"
    config:
      DefaultPreferenceKey: "InactivityPeriod"
      Type: "Integer"
    bindings:
      PreferenceDomain: "Organization:OrganizationDomain"
      PreferenceIntValue: "InactivityPeriod"
  - id: "GetOrganizationByDomain1"
    type: "pipelet"
    ref: "GetOrganizationByDomain"
  - id: "JoinNode1"
    type: "join"
  - id: "JoinNode2"
    type: "join"
  - id: "JoinNode3"
    type: "join"
  - id: "JoinNode4"
    type: "join"
  - id: "JoinNode5"
    type: "join"
  - id: "JoinNode6"
    type: "join"
  - id: "JoinNode7"
    type: "join"
  - id: "JoinNode8"
    type: "join"
  - id: "LoopNode2"
    type: "loop"
  - id: "LoopNode3"
    type: "loop"
  - id: "ProcessMail1"
    type: "pipelet"
    ref: "ProcessMail"
    config:
      UseErrorConnector: false
    bindings:
      MailFrom: "MailFrom"
      MailTemplate: "\"user/InactiveUserNotificationMail\""
      MailTo: "User:DefaultAddress:EMail"
  - id: "UpdateUserCredentials2"
    type: "pipelet"
    ref: "UpdateUserCredentials"
    config:
      allowMixedCaseLogin: "Default"
    bindings:
      IsActive: "\"false\""
      User: "UserToBeDisabled"
      IPRange: "null"
      LastLoggedInDate: "null"
      Login: "null"
      NewPasswordExpiry: "null"
      Password: "null"
      PasswordConfirmation: "null"
      PasswordReminder: "null"
      SecurityQuestion: "null"

links:
  - from: "GetDomainByName1"
    via: "error"
    to: "JoinNode2"
    into: "in2"
  - from: "ExecuteObjectsQuery2"
    via: "next"
    to: "LoopNode3"
    into: "in"
  - from: "DecisionNode2"
    via: "yes"
    to: "JoinNode6"
    into: "in2"
  - from: "CallNode4"
    via: "DISABLED"
    to: "JoinNode8"
    into: "in1"
  - from: "ProcessMail1"
    via: "error"
    to: "JoinNode4"
    into: "in2"
  - from: "DecisionNode2"
    via: "no"
    to: "CallNode3"
    into: "in"
  - from: "CallNode4"
    via: "next"
    to: "CallNode1"
    into: "in"
  - from: "LoopNode3"
    via: "next"
    to: "EndNode3"
    into: "in"
  - from: "CalculateDate5"
    via: "next"
    to: "CalculateDate3"
    into: "in"
  - from: "CallNode1"
    via: "next"
    to: "DecisionNode2"
    into: "in"
  - from: "DecisionNode10"
    via: "yes"
    to: "JoinNode4"
    into: "in1"
  - from: "CalculateDate3"
    via: "next"
    to: "ExecuteObjectsQuery2"
    into: "in"
  - from: "CallNode3"
    via: "next"
    to: "JoinNode6"
    into: "in1"
  - from: "JoinNode8"
    via: "next"
    to: "JoinNode7"
    into: "in3"
  - from: "JoinNode6"
    via: "next"
    to: "JoinNode7"
    into: "in1"
  - from: "JoinNode7"
    via: "next"
    to: "EndNode2"
    into: "in"
  - from: "LoopNode2"
    via: "do"
    to: "DetermineUser1"
    into: "in"
  - from: "DetermineUser1"
    via: "next"
    to: "UpdateUserCredentials2"
    into: "in"
  - from: "DecisionNode10"
    via: "no"
    to: "ProcessMail1"
    into: "in"
  - from: "ProcessMail1"
    via: "next"
    to: "JoinNode3"
    into: "in1"
  - from: "LoopNode3"
    via: "do"
    to: "DetermineUser2"
    into: "in"
  - from: "DecisionNode11"
    via: "no"
    to: "EndNode13"
    into: "in"
  - from: "JoinNode3"
    via: "next"
    to: "LoopNode3"
    into: "loop"
  - from: "DetermineUser2"
    via: "next"
    to: "DecisionNode10"
    into: "in"
  - from: "JoinNode1"
    via: "next"
    to: "JoinNode2"
    into: "in1"
  - from: "JoinNode2"
    via: "next"
    to: "EndNode1"
    into: "in"
  - from: "UpdateUserCredentials2"
    via: "error"
    to: "JoinNode5"
    into: "in2"
  - from: "ExecuteObjectsQuery1"
    via: "next"
    to: "LoopNode2"
    into: "in"
  - from: "GetOrganizationByDomain1"
    via: "error"
    to: "JoinNode1"
    into: "in2"
  - from: "JoinNode8"
    via: "next"
    to: "JoinNode1"
    into: "in1"
  - from: "LoopNode2"
    via: "next"
    to: "EndNode15"
    into: "in"
  - from: "GetDomainPreference2"
    via: "next"
    to: "DecisionNode11"
    into: "in"
  - from: "DecisionNode11"
    via: "yes"
    to: "EndNode14"
    into: "in"
  - from: "JoinNode4"
    via: "next"
    to: "JoinNode3"
    into: "in2"
  - from: "StartNode1"
    via: "next"
    to: "GetDomainByName1"
    into: "in"
  - from: "StartNode6"
    via: "next"
    to: "GetCurrentDate2"
    into: "in"
  - from: "GetCurrentDate2"
    via: "next"
    to: "CalculateDate4"
    into: "in"
  - from: "CalculateDate4"
    via: "next"
    to: "ExecuteObjectsQuery1"
    into: "in"
  - from: "UpdateUserCredentials2"
    via: "next"
    to: "JoinNode5"
    into: "in1"
  - from: "JoinNode5"
    via: "next"
    to: "LoopNode2"
