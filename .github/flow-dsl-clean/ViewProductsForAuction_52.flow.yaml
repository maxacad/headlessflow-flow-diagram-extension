      OutValue_4: "ViewAuctionItems_52-AddProducts"
    bindings:
      SelectionKey: "JumpTarget"
      Key_0: "findSimple"
      Key_1: "Expand"
      Key_2: "Collapse"
      Key_3: "Cancel"
      Key_4: "Assign"
  - id: "PrepareApplicationView1"
    type: "pipelet"
    ref: "PrepareApplicationView"
    config:
      SelectedMenuItem: "AuctionManagement"
      WorkingTemplate: "auction/ListProducts_52"
  - id: "SetDictionaryValue1"
    type: "pipelet"
    ref: "SetDictionaryValue"
    config:
      Name: "RecreatePageablePipeline"
      Value: "ViewProductsForAuction_52-SimpleSearch"
      ValueType: "Dictionary Value"
  - id: "SetDictionaryValue2"
    type: "pipelet"
    ref: "SetDictionaryValue"
