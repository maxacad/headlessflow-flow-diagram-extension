      OutValue_1: "PageSize"
  - id: "Pipelet5"
    type: "pipelet"
    ref: "DispatchFormAction"
    config:
      PagingPipeline: "ViewProductsForAuction_52-Paging"
      OutValue_0: "ViewProductsForAuction_52-SimpleSearch"
      OutValue_1: "ViewProductsForAuction_52-Paging"
      OutValue_2: "ViewProductsForAuction_52-Paging"
