      Value: "ProductList"
      ValueType: "Dictionary Value"
  - id: "SetDictionaryValue3"
    type: "pipelet"
    ref: "SetDictionaryValue"
    config:
      Name: "DetermineRepositoriesPipeline"
      Value: "DetermineRepositories-SelectedChannel"
  - id: "SetPageLocator2"
    type: "pipelet"
    ref: "SetPageLocator"
    config:
      DefaultHandlerPipeline: "ViewProductsForAuction_52-Paging"
      DefaultPageLocatorName: "ProductList"
    bindings:
      Pageable: "Products"
  - id: "SetPageLocatorParameter1"
    type: "pipelet"
    ref: "SetPageLocatorParameter"
    config:
      DefaultParameterName: "AuctionUUID"
    bindings:
      ParameterValue: "Auction:UUID"

