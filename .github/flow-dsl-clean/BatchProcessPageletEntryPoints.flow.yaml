  - id: "Pipelet2"
    type: "pipelet"
    ref: "SetDictionaryValue"
    config:
      Name: "Result"
      ValueType: "Dictionary Value"
      Value: "ViewContextFallback"
  - id: "Pipelet3"
    type: "pipelet"
    ref: "SetDictionaryValue"
    config:
      Name: "Result"
      ValueType: "Dictionary Value"
      Value: "Locked"
  - id: "Pipelet4"
    type: "pipelet"
    ref: "RemoveDictionaryValue"
    config:
      Key: "Result"
  - id: "RemoveDictionaryValue1"
    type: "pipelet"
    ref: "RemoveDictionaryValue"
    config:
      Key: "ParentAssignment"
  - id: "SetDictionaryValue1"
    type: "pipelet"
    ref: "SetDictionaryValue"
    config:
      Name: "Result"
      Value: "Shared"
      ValueType: "Dictionary Value"
  - id: "SetDictionaryValue2"
    type: "pipelet"
