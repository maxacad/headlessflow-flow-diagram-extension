flow: "BatchProcessPageletEntryPoints"
kind: "process"

entries:
  - id: "StartNode1"
    name: "SetParent"
    mode: "private"
    strict: false
    inputs:
      []
  - id: "StartNode10"
    name: "Finish"
    mode: "private"
    strict: false
    inputs:
      []
  - id: "StartNode4"
    name: "CanSetParent"
    mode: "private"
    strict: true
    inputs:
      - key: "PageletEntryPoint"
        type: "com.intershop.component.pmc.capi.pagelet.PageletEntryPoint"
        required: true
      - key: "Parent"
        type: "com.intershop.component.pmc.capi.pagelet.PageletEntryPoint"
        required: true
      - key: "ContextDomain"
        type: "com.intershop.beehive.core.capi.domain.Domain"
        required: true
  - id: "StartNode7"
    name: "Init"
    mode: "private"
    strict: false
    inputs:
      []
  - id: "StartNode9"
    name: "DeletePageletEntryPoints"
    mode: "private"
    strict: false
    inputs:
      []

steps:
  - id: "AddObjectToVector1"
    type: "pipelet"
    ref: "AddObjectToVector"
    config:
      Mode: "Forbid Duplicates"
    bindings:
      InVector: "PEPTreePath"
      OutVector: "PEPTreePath"
      Iterator: "null"
      Object: "Parent:UUID"
      Objects: "null"
  - id: "AddObjectToVector2"
    type: "pipelet"
    ref: "AddObjectToVector"
    config:
      Mode: "Forbid Duplicates"
    bindings:
      InVector: "null"
      OutVector: "PEPTreePath"
      Iterator: "null"
      Object: "null"
      Objects: "null"
  - id: "CallNode12"
    type: "call"
    ref: "ProcessPageletEntryPointLock-CheckUnlocked"
    bindings:
      CheckedUserID: "JobCreator:ID"
      LockingDomain: "ContextDomain"
      PageletEntryPoint: "PageletEntryPoint"
  - id: "CallNode14"
    type: "call"
    ref: "BatchProcessLog-CleanLogger"
  - id: "CallNode16"
    type: "call"
    ref: "BatchProcessLog-PrepareLogger"
  - id: "CallNode19"
    type: "call"
    ref: "ProcessPageletEntryPoint-DeletePageletEntryPoint"
    bindings:
      Domain: "ContextDomain"
      Site: "ContextDomain:Site"
  - id: "CallNode3"
    type: "call"
    ref: "ProcessPageletEntryPoint-GetParentAssignment"
    bindings:
      Domain: "ContextDomain"
      PageletEntryPoint: "Parent"
  - id: "CallNode4"
    type: "call"
    ref: "BatchProcessLog-LogPageletEntryPointResult"
  - id: "CallNode5"
    type: "call"
    ref: "BatchProcessPageletEntryPoints-CanSetParent"
  - id: "CallNode6"
    type: "call"
    ref: "BatchProcessLog-LogPageletEntryPointResult"
  - id: "CallNode7"
    type: "call"
    ref: "ViewPageletEntryPointProperties-UpdateParentAssignment"
    bindings:
      ParentPageletEntryPoint: "Parent"
  - id: "DecisionNode1"
    type: "decision"
    condition: "PageletEntryPoint:Page"
  - id: "DecisionNode10"
    type: "decision"
    condition: "PageletEntryPoint:Dynamic"
  - id: "DecisionNode2"
    type: "decision"
    condition: "PageletEntryPoint:DomainID"
  - id: "DecisionNode3"
    type: "decision"
    condition: "PEPTreePath:Contains(PageletEntryPoint:UUID)"
  - id: "DecisionNode4"
    type: "decision"
    condition: "ParentAssignment"
  - id: "DecisionNode5"
    type: "decision"
    condition: "PEPTreePath:Contains(Parent:UUID)"
  - id: "DecisionNode6"
    type: "decision"
    condition: "PageletEntryPoint:Dynamic"
  - id: "DecisionNode8"
    type: "decision"
    condition: "PageletEntryPoint:DomainID"
  - id: "DecisionNode9"
    type: "decision"
    condition: "PageletEntryPoint:PageletEntryPointViewContextAssignmentPOsCount"
  - id: "DetermineUser1"
    type: "pipelet"
    ref: "DetermineUser"
    bindings:
      UserID: "JobCreatorUserID"
      User: "JobCreator"
  - id: "DetermineUser3"
    type: "pipelet"
