    type: "call"
    ref: "This:CreateFlagName"
  - id: "CallNode21"
    type: "call"
    ref: "This:CreateFlagName"
  - id: "CallNode22"
    type: "call"
    ref: "This:Prefix"
  - id: "CallNode27"
    type: "call"
    ref: "This:Prefix"
