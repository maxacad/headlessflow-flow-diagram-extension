      OutValue_1: "ViewPageletEntryPoint-Lock"
      OutValue_2: "ViewPageletEntryPoint-Unlock"
      OutValue_3: "ViewPageletEntryPoint-UpdateConstraints"
      OutValue_4: "ViewPageletEntryPoint-SetLocale"
      OutValue_5: "ViewPageletEntryPoint-ConfirmDelete"
