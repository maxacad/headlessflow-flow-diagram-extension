      PreferenceDomain: "ContentRepository:RepositoryDomain"
      User: "CurrentUser"
      Pagelet: "PageletEntryPoint"
  - id: "ConcatenateStrings5"
    type: "pipelet"
    ref: "ConcatenateStrings"
    config:
      DefaultString0: "PageletEntryPointViewTabSwitched@"
    bindings:
      String1: "PageletEntryPointUUID"
      Concatenated: "FlagName"
  - id: "DecisionNode1"
    type: "decision"
    condition: "PageletEntryPointUUID"
  - id: "DecisionNode5"
    type: "decision"
    condition: "IsTabSwitched"
