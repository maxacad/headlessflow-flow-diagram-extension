        type: "java.lang.Object"
        guaranteed: true
      - key: "Locales"
        type: "java.util.Iterator"
        guaranteed: true
  - id: "ExchangeSessionObject1"
    type: "pipelet"
    ref: "ExchangeSessionObject"
    config:
      ProcessMethod: "Put Object to Session"
    bindings:
      SaveObject: "\"(Boolean)true\""
      SessionObjectName: "FlagName"
  - id: "ExchangeSessionObject2"
    type: "pipelet"
