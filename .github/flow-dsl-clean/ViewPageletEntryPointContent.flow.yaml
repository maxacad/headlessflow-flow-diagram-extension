flow: "ViewPageletEntryPointContent"
kind: "view"

entries:
  - id: "StartNode1"
    name: "SelectPageVariant"
    mode: "private"
    strict: false
    inputs:
      []
  - id: "StartNode13"
    name: "Dispatch"
    mode: "private"
    strict: false
    inputs:
      []
  - id: "StartNode2"
    name: "TemplateCallback"
    mode: "private"
    strict: false
    inputs:
      - key: "PageletEntryPointUUID"
        type: "java.lang.String"
        required: true
  - id: "StartNode3"
    name: "GetSessionKey"
    mode: "private"
    strict: true
    inputs:
      - key: "PageletEntryPointUUID"
        type: "java.lang.String"
        required: true
  - id: "StartNode4"
    name: "View"
    mode: "private"
    strict: false
    inputs:
      []
  - id: "StartNode5"
    name: "New"
    mode: "private"
    strict: false
    inputs:
      []

steps:
  - id: "CallNode1"
    type: "call"
    ref: "ViewPageletEntryPoint-Prefix"
  - id: "CallNode2"
    type: "call"
    ref: "ViewPageletEntryPoint-IsTabSwitched"
    bindings:
      Flag: "IsTabSwitched"
  - id: "CallNode3"
    type: "call"
    ref: "ViewPageletEntryPointContent-GetSessionKey"
  - id: "CallNode4"
    type: "call"
    ref: "ViewPageletEntryPointContent-GetSessionKey"
  - id: "CallNode5"
    type: "call"
    ref: "ViewPageletEntryPointContent-GetSessionKey"
  - id: "ConcatenateStrings1"
    type: "pipelet"
    ref: "ConcatenateStrings"
    config:
      DefaultString1: "@SelectedPageVariant"
    bindings:
      String0: "PageletEntryPointUUID"
      Concatenated: "SessionKey"
  - id: "DecisionNode1"
    type: "decision"
    condition: "IsTabSwitched"
  - id: "DispatchFormAction2"
    type: "pipelet"
    ref: "DispatchFormAction"
    config:
      OutValue_0: "ViewPageletEntryPointContent-SelectPageVariant"
      OutValue_1: "ViewPageletEntryPointContent-New"
    bindings:
      SelectionKey: "JumpTarget"
      Key_0: "SelectPageVariant"
      Key_1: "CreatePageVariant"
  - id: "EndNode1"
    type: "end"
    strict: false
    outputs:
      - key: "SelectedPageVariantUUID"
        type: "java.lang.Object"
        guaranteed: false
      - key: "IsTabSwitched"
        type: "java.lang.Object"
        guaranteed: false
  - id: "EndNode2"
    type: "end"
    strict: true
    outputs:
      - key: "SessionKey"
        type: "java.lang.String"
        guaranteed: true
  - id: "ExchangeSessionObject1"
    type: "pipelet"
    ref: "ExchangeSessionObject"
    config:
      ProcessMethod: "Get Object from Session"
    bindings:
      SessionObjectName: "SessionKey"
      LoadObject: "SelectedPageVariantUUID"
      SaveObject: "null"
  - id: "ExchangeSessionObject2"
    type: "pipelet"
    ref: "ExchangeSessionObject"
    config:
      ProcessMethod: "Put Object to Session"
    bindings:
      SaveObject: "null"
      SessionObjectName: "SessionKey"
  - id: "ExchangeSessionObject3"
    type: "pipelet"
    ref: "ExchangeSessionObject"
    config:
      ProcessMethod: "Put Object to Session"
    bindings:
      SessionObjectName: "SessionKey"
      SaveObject: "SelectedPageVariantUUID"
  - id: "ExchangeSessionObject4"
    type: "pipelet"
    ref: "ExchangeSessionObject"
    config:
      ProcessMethod: "Get Object from Session"
    bindings:
      SessionObjectName: "SessionKey"
      SaveObject: "SelectedPageVariantUUID"
  - id: "GetValuesFromContainer1"
    type: "pipelet"
    ref: "GetValuesFromContainer"
    config:
      OverwriteBehavior: false
    bindings:
      ContainerName: "SessionKey"
      ContainerReadFirstTime: "PageletHasBeenSelected"
  - id: "JoinNode1"
    type: "join"
  - id: "JoinNode2"
    type: "join"
  - id: "JoinNode3"
    type: "join"
  - id: "JumpNode1"
    type: "jump"
    ref: "ViewPageletEntryPoint-InternalView"
  - id: "JumpNode3"
    type: "jump"
    ref: "ViewPageletAssignments-New"
  - id: "JumpNode5"
    type: "jump"
    ref: "SecureJump-Start"
  - id: "KeyMapper1"
    type: "pipelet"
    ref: "KeyMapper"
    bindings:
      InValue_1: "ContentRepositoryUUID"
      OutValue_1: "RepositoryUUID"
      InValue_2: "\"PageletEntryPoint\""
      OutValue_2: "ContextType"
      InValue_3: "PageletEntryPointUUID"
      OutValue_3: "ContextObjectUUID"
      InValue_4: "\"ViewPageletAssignments-GetPageEntryPoint\""
      OutValue_4: "GetPipeline"
  - id: "KeyMapper2"
    type: "pipelet"
    ref: "KeyMapper"
    bindings:
      InValue_1: "\"(Boolean)false\""
      OutValue_1: "PageletHasBeenSelected"
  - id: "SetDictionaryValue1"
    type: "pipelet"
    ref: "SetDictionaryValue"
    config:
      Name: "SelectedTab"
      Value: "Content"
  - id: "SetValuesToContainer1"
    type: "pipelet"
    ref: "SetValuesToContainer"
    bindings:
      ContainerName: "SessionKey"

links:
  - from: "DispatchFormAction2"
    via: "next"
    to: "JumpNode5"
    into: "in"
  - from: "StartNode2"
    via: "next"
    to: "CallNode3"
    into: "in"
  - from: "JoinNode1"
    via: "next"
    to: "EndNode1"
    into: "in"
  - from: "DecisionNode1"
    via: "yes"
    to: "ExchangeSessionObject2"
    into: "in"
  - from: "ExchangeSessionObject2"
    via: "next"
    to: "JoinNode1"
    into: "in2"
  - from: "StartNode3"
    via: "next"
    to: "ConcatenateStrings1"
    into: "in"
  - from: "ConcatenateStrings1"
    via: "next"
    to: "EndNode2"
    into: "in"
  - from: "GetValuesFromContainer1"
    via: "next"
    to: "JoinNode3"
    into: "in1"
  - from: "CallNode5"
    via: "next"
    to: "ExchangeSessionObject4"
    into: "in"
  - from: "ExchangeSessionObject4"
    via: "next"
    to: "JoinNode2"
    into: "in3"
  - from: "StartNode4"
    via: "next"
    to: "CallNode5"
    into: "in"
  - from: "StartNode13"
    via: "next"
    to: "DispatchFormAction2"
    into: "in"
  - from: "CallNode3"
    via: "next"
    to: "GetValuesFromContainer1"
    into: "in"
  - from: "JoinNode2"
    via: "next"
    to: "SetDictionaryValue1"
    into: "in"
  - from: "StartNode5"
    via: "next"
    to: "KeyMapper1"
    into: "in"
  - from: "ExchangeSessionObject3"
    via: "next"
    to: "SetValuesToContainer1"
    into: "in"
  - from: "KeyMapper1"
    via: "next"
    to: "JumpNode3"
    into: "in"
  - from: "SetValuesToContainer1"
    via: "next"
    to: "JoinNode2"
    into: "in1"
  - from: "GetValuesFromContainer1"
    via: "error"
    to: "KeyMapper2"
    into: "in"
  - from: "JoinNode3"
    via: "next"
    to: "CallNode2"
    into: "in"
  - from: "KeyMapper2"
    via: "next"
    to: "JoinNode3"
    into: "in3"
  - from: "CallNode4"
    via: "next"
    to: "ExchangeSessionObject3"
    into: "in"
  - from: "StartNode1"
    via: "next"
    to: "CallNode4"
    into: "in"
  - from: "CallNode1"
    via: "next"
    to: "JumpNode1"
    into: "in"
  - from: "SetDictionaryValue1"
    via: "next"
    to: "CallNode1"
    into: "in"
  - from: "DecisionNode1"
    via: "no"
    to: "ExchangeSessionObject1"
    into: "in"
  - from: "CallNode2"
    via: "next"
    to: "DecisionNode1"
    into: "in"
  - from: "ExchangeSessionObject1"
    via: "next"
    to: "JoinNode1"
    into: "in1"
