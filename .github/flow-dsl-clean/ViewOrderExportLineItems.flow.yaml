  - from: "ValidateForm1"
    via: "error"
    to: "JoinNode1"
    into: "in1"
  - from: "LoopNode3"
    via: "next"
    to: "JoinNode2"
    into: "in1"
  - from: "JoinNode2"
    via: "next"
    to: "EndNode1"
    into: "in"
  - from: "CallNode2"
    via: "next"
    to: "MapObjectToForm1"
