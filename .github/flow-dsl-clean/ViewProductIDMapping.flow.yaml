flow: "ViewProductIDMapping"
kind: "view"

entries:
  - id: "Start1"
    name: "Prefix"
    mode: "private"
    strict: false
    inputs:
      []
  - id: "Start2"
    name: "Start"
    mode: "private"
    strict: false
    inputs:
      []
  - id: "Start3"
    name: "Update"
    mode: "private"
    strict: false
    inputs:
      []
  - id: "Start4"
    name: "Delete"
    mode: "private"
    strict: false
    inputs:
      []
  - id: "Start5"
    name: "Dispatch"
    mode: "private"
    strict: false
    inputs:
      []

steps:
  - id: "AddObjectToVector1"
    type: "pipelet"
    ref: "AddObjectToVector"
    bindings:
      InVector: "Vector"
      Iterator: "SelectedRules"
      Object: "FormRecord:RuleID"
      OutVector: "Vector"
  - id: "Call1"
    type: "call"
    ref: "DetermineRepositories-Master"
  - id: "Call2"
    type: "call"
    ref: "ViewProductIDMapping-Prefix"
  - id: "Call4"
    type: "call"
    ref: "ViewProductIDMapping-Prefix"
  - id: "Call5"
    type: "call"
    ref: "ViewProductIDMapping-Prefix"
  - id: "Call6"
    type: "call"
    ref: "ProcessProductDataMappingRule-CreateRuleConstruct"
  - id: "Call7"
    type: "call"
    ref: "ViewProductIDMapping-Delete"
  - id: "Call8"
    type: "call"
    ref: "ProcessProductDataMappingRule-DeleteRuleConstruct"
  - id: "CombineIterators1"
    type: "pipelet"
    ref: "CombineIterators"
    config:
      ProcessMethod: "Subtract Iterators"
    bindings:
      Iterator: "ToBeDeleted"
      Iterator1: "AllRules"
      Iterator2: "SelectedRules"
  - id: "Decision1"
    type: "decision"
    condition: "Rule:SourceDeclaration:TypeCode"
  - id: "Decision2"
    type: "decision"
    condition: "Rule:SourceDeclaration:identifierType"
  - id: "Decision3"
    type: "decision"
    condition: "SelectedRules"
  - id: "DispatchFormAction1"
    type: "pipelet"
    ref: "DispatchFormAction"
    config:
      OutValue_0: "ViewProductIDMapping-Update"
    bindings:
      Key_0: "apply"
      SelectionKey: "JumpTarget"
  - id: "End1"
    type: "end"
    strict: false
  - id: "End2"
    type: "end"
    strict: false
  - id: "GetFormRecord1"
    type: "pipelet"
    ref: "GetFormRecord"
    config:
      DefaultRecordID: "Prefix"
    bindings:
      RecordID: "Prefix"
  - id: "GetFormSelection1"
    type: "pipelet"
    ref: "GetFormSelection"
    config:
      DefaultParameterName: "ProductIdentifierType"
  - id: "GetFormSelection2"
    type: "pipelet"
    ref: "GetFormSelection"
    config:
      DefaultParameterName: "RuleID"
    bindings:
      Selection: "AllRules"
  - id: "GetProductDataMappingRule1"
    type: "pipelet"
    ref: "GetProductDataMappingRule"
    bindings:
      ProductDataMappingRuleID: "FormRecord:RuleID"
  - id: "GetProductDataMappingRuleSet1"
    type: "pipelet"
    ref: "GetProductDataMappingRuleSet"
    bindings:
      DeclaringDomain: "Repository:Domain"
      ProvidingDomain: "ProvidingRepository:Domain"
  - id: "GetProductDataMappingRules1"
    type: "pipelet"
    ref: "GetProductDataMappingRules"
    config:
      DefaultTypeCode: 1
    bindings:
      DeclaringDomain: "ProductDataMappingRuleSet:DeclaringDomain"
      ProductDataMappingRulesMap: "RulesMap"
      ProvidingDomain: "ProductDataMappingRuleSet:ProvidingDomain"
  - id: "GetProductDataMappingRules2"
    type: "pipelet"
    ref: "GetProductDataMappingRules"
    config:
      DefaultTypeCode: 1
    bindings:
      DeclaringDomain: "ProductDataMappingRuleSet:DeclaringDomain"
      ProvidingDomain: "ProductDataMappingRuleSet:ProvidingDomain"
  - id: "GetRepositoryByUUID1"
    type: "pipelet"
    ref: "GetRepositoryByUUID"
    bindings:
      Repository: "ProvidingRepository"
      UUID: "ProviderID"
  - id: "InteractionEnd1"
    type: "interaction"
  - id: "Join1"
    type: "join"
  - id: "Join2"
    type: "join"
  - id: "Join3"
    type: "join"
  - id: "JoinNode1"
    type: "join"
  - id: "Jump1"
    type: "jump"
    ref: "ViewProductIDMapping-Start"
  - id: "Jump3"
    type: "jump"
    ref: "SecureJump-Start"
  - id: "KeyMapper1"
    type: "pipelet"
    ref: "KeyMapper"
    bindings:
      InValue_1: "AllRules"
      OutValue_1: "ToBeDeleted"
  - id: "Loop1"
    type: "loop"
  - id: "Loop2"
    type: "loop"
  - id: "Loop3"
    type: "loop"
  - id: "PrepareApplicationView1"
    type: "pipelet"
    ref: "PrepareApplicationView"
    config:
      SelectedMenuItem: "Syndication"
      WorkingTemplate: "syndication/ProductIDMapping"
  - id: "SetDictionaryValue1"
    type: "pipelet"
    ref: "SetDictionaryValue"
    config:
      Name: "JumpTarget"
      Value: "ViewProductIDMapping-Start"
      ValueType: "Dictionary Value"
  - id: "Text1"
    type: "text"
  - id: "UpdateCustomAttributes1"
    type: "pipelet"
    ref: "UpdateCustomAttributes"
    config:
      Attribute_1_Name: "identifierType"
      Attribute_1_Type: "String"
      Attribute_2_Type: "String"
      Attribute_3_Type: "String"
    bindings:
      Attribute_1_Value: "FormRecord:identifierType"
      ExtensibleObject: "SourceDeclaration"
  - id: "UpdateCustomAttributes2"
    type: "pipelet"
    ref: "UpdateCustomAttributes"
    config:
      Attribute_1_Name: "identifierType"
      Attribute_1_Type: "String"
      Attribute_2_Name: "identifierPrefix"
      Attribute_2_Type: "String"
      Attribute_3_Name: "identifierSuffix"
      Attribute_3_Type: "String"
      Attribute_4_Name: "identifierOwner"
      Attribute_4_Type: "String"
    bindings:
      Attribute_1_Value: "FormRecord:identifierType"
      Attribute_2_Value: "FormRecord:identifierPrefix"
      Attribute_3_Value: "FormRecord:identifierSuffix"
      Attribute_4_Value: "Organization:Domain:DomainName"
      ExtensibleObject: "TargetDeclaration"
  - id: "UpdateCustomAttributes3"
    type: "pipelet"
    ref: "UpdateCustomAttributes"
    config:
      Attribute_1_Name: "identifierType"
      Attribute_1_Type: "String"
      Attribute_2_Name: "identifierPrefix"
      Attribute_2_Type: "String"
      Attribute_3_Name: "identifierSuffix"
      Attribute_3_Type: "String"
      Attribute_4_Name: "identifierOwner"
      Attribute_4_Type: "String"
    bindings:
      Attribute_1_Value: "FormRecord:identifierType"
      Attribute_2_Value: "FormRecord:identifierPrefix"
      Attribute_3_Value: "FormRecord:identifierSuffix"
      Attribute_4_Value: "Organization:Domain:DomainName"
      ExtensibleObject: "ProductDataMappingRule:TargetDeclaration"

